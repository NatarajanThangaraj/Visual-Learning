<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SprintBoard — who is on what</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap');
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#05060F;--s1:#0A0C1C;--s2:#0F1330;--s3:#151A3E;
  --tx:#EAF0FF;--tx2:#8FA4CC;--tx3:#4A5B8A;
  --blue:#3B82F6;--purple:#8B5CF6;--cyan:#22D3EE;
  --amber:#F59E0B;--green:#10B981;--rose:#F43F5E;
  --glow-b:rgba(59,130,246,.45);--glow-p:rgba(139,92,246,.45);
  --glass:rgba(255,255,255,.045);--hair:rgba(255,255,255,.09);
  --mono:'JetBrains Mono',ui-monospace,Menlo,monospace;
  --r:12px;--r2:20px;
}
html,body{height:100%}
body{
  font-family:'Poppins',system-ui,sans-serif;
  background:var(--bg);color:var(--tx);overflow:hidden;
  -webkit-font-smoothing:antialiased;
}
body::before{
  content:'';position:fixed;inset:0;pointer-events:none;z-index:0;
  background:
    radial-gradient(60% 50% at 16% 6%,rgba(59,130,246,.15),transparent 70%),
    radial-gradient(55% 50% at 88% 94%,rgba(139,92,246,.15),transparent 70%);
}
.app{position:relative;z-index:1;height:100%;display:flex;flex-direction:column}

/* ─────────── header ─────────── */
.top{flex:none;display:flex;align-items:center;gap:14px;padding:12px clamp(12px,2.6vw,24px)}
.brand{display:flex;align-items:center;gap:9px;flex:1;min-width:0}
.brand .mark{
  width:27px;height:27px;border-radius:9px;flex:none;display:grid;place-items:center;
  background:linear-gradient(140deg,var(--blue),var(--purple));box-shadow:0 0 18px var(--glow-b);
}
.brand .mark svg{width:15px;height:15px;color:#fff}
.brand b{font-size:14.5px;font-weight:600;white-space:nowrap}
.brand .proj{
  font-size:11.5px;color:var(--tx3);padding:3px 9px;border-radius:999px;
  background:var(--glass);border:1px solid var(--hair);white-space:nowrap;
}

.toggle{
  flex:none;position:relative;display:flex;padding:5px;gap:4px;
  background:var(--glass);border:1px solid var(--hair);border-radius:999px;
  backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
}
.thumb{
  position:absolute;top:5px;left:5px;height:calc(100% - 10px);border-radius:999px;
  background:linear-gradient(120deg,var(--blue),var(--purple));
  box-shadow:0 0 22px var(--glow-p),0 2px 10px rgba(0,0,0,.4);
  transition:transform .42s cubic-bezier(.4,1.3,.4,1),width .42s cubic-bezier(.4,1.3,.4,1);
}
.seg{
  position:relative;z-index:1;display:flex;align-items:center;gap:7px;
  padding:8px 16px;border:0;background:none;cursor:pointer;
  font-family:inherit;font-size:13px;font-weight:500;color:var(--tx2);
  border-radius:999px;transition:color .3s;white-space:nowrap;
}
.seg svg{width:15px;height:15px}
.seg.is-on{color:#fff;font-weight:600}
.seg .pip{
  min-width:17px;height:17px;padding:0 4px;border-radius:999px;
  background:var(--amber);color:#1A1200;font-size:10.5px;font-weight:700;
  display:none;place-items:center;
}
.seg .pip.on{display:grid;animation:pip .6s ease}

.clockbox{flex:1;display:flex;justify-content:flex-end;align-items:center;gap:9px}
.clock{
  font-size:13.5px;font-weight:600;letter-spacing:1px;color:var(--tx);
  padding:6px 12px;border-radius:999px;background:var(--glass);border:1px solid var(--hair);
}
.adv{
  display:flex;align-items:center;gap:6px;padding:7px 13px;border:0;border-radius:999px;
  cursor:pointer;font-family:inherit;font-size:12.5px;font-weight:600;color:#fff;
  background:linear-gradient(120deg,var(--blue),var(--purple));
  box-shadow:0 6px 18px rgba(0,0,0,.4),0 0 20px var(--glow-b);
  transition:transform .24s cubic-bezier(.3,1.5,.5,1),box-shadow .24s;
}
.adv svg{width:14px;height:14px}
.adv:hover{transform:translateY(-2px);box-shadow:0 10px 24px rgba(0,0,0,.45),0 0 28px var(--glow-p)}
.adv:active{transform:translateY(0) scale(.97)}

/* ─────────── stage / views ─────────── */
.stage{flex:1;position:relative;min-height:0}
.view{
  position:absolute;inset:0;padding:0 clamp(12px,2.6vw,24px) clamp(12px,2vh,18px);
  display:none;flex-direction:column;gap:11px;
}
.view.is-on{display:flex;animation:viewIn .4s cubic-bezier(.3,1,.4,1)}

.panel{
  border-radius:var(--r2);border:1px solid var(--hair);background:var(--glass);
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  display:flex;flex-direction:column;min-height:0;
}
.p-head{flex:none;display:flex;align-items:center;gap:9px;padding:11px 15px 0}
.p-head .dot{width:6px;height:6px;border-radius:50%;background:var(--blue);box-shadow:0 0 10px var(--glow-b)}
.p-head .dot.p{background:var(--purple);box-shadow:0 0 10px var(--glow-p)}
.p-head .lbl{font-size:12.5px;font-weight:500;color:var(--tx2)}
.p-head .hint{margin-left:auto;font-size:11.5px;color:var(--tx3);transition:color .3s}
.p-head .hint.live{color:var(--cyan)}

/* ─────────── the sprint band ─────────── */
.band-panel{flex:none}
.band{
  flex:1;min-height:0;display:flex;align-items:center;gap:16px;
  overflow-x:auto;overflow-y:hidden;padding:10px 15px 13px;scrollbar-width:none;
}
.band::-webkit-scrollbar{display:none}
.band.can-drop{background:rgba(59,130,246,.06)}
.sprint{flex:none;display:flex;align-items:center;gap:9px}
.sprint-tag{
  flex:none;display:flex;flex-direction:column;gap:2px;padding-right:4px;
  border-right:1px solid var(--hair);margin-right:3px;
}
.sprint-tag b{font-size:11px;font-weight:700;letter-spacing:.8px;color:var(--tx2)}
.sprint-tag small{font-size:10.5px;color:var(--tx3);white-space:nowrap}
.band-empty{margin:auto;color:var(--tx3);font-size:12.5px}

/* a stage chip */
.chip{
  flex:none;display:flex;align-items:center;gap:8px;padding:8px 11px;cursor:pointer;
  border-radius:var(--r);border:1px solid var(--hair);
  background:linear-gradient(170deg,rgba(255,255,255,.06),rgba(255,255,255,.02));
  transition:transform .26s cubic-bezier(.3,1.4,.5,1),box-shadow .26s,border-color .26s,opacity .26s;
}
.chip svg{width:16px;height:16px;flex:none}
/* both must refuse to shrink: nowrap text in a shrunk box would slide
   straight under the duration pill */
.chip .nm{flex:none;font-size:12px;font-weight:500;white-space:nowrap}
.chip .du{
  flex:none;font-size:10.5px;font-weight:600;color:var(--tx3);padding:2px 6px;
  border-radius:999px;background:rgba(255,255,255,.06);white-space:nowrap;
}
.chip[data-sp="0"] svg{color:var(--blue)}
.chip[data-sp="1"] svg{color:var(--purple)}
.chip:hover{transform:translateY(-3px);box-shadow:0 10px 24px rgba(0,0,0,.45)}
.chip.is-sel{
  border-color:var(--cyan);
  box-shadow:0 0 0 1px rgba(34,211,238,.45),0 0 26px rgba(34,211,238,.45);
  transform:translateY(-3px);
}
.chip.just{animation:pop .5s cubic-bezier(.2,1.5,.4,1)}

/* ─────────── the five lanes ─────────── */
.lanes-panel{flex:1;min-height:0}
.lanes{
  flex:1;min-height:0;overflow-y:auto;padding:8px 15px 12px;
  display:flex;flex-direction:column;gap:7px;
  /* centred when the screen is tall enough to leave room; `safe` keeps them
     from being pushed off the top when it is not */
  justify-content:safe center;
}
.lane{
  flex:none;display:flex;align-items:center;gap:10px;padding:7px 10px;cursor:pointer;
  border-radius:var(--r);border:1px solid transparent;background:rgba(255,255,255,.028);
  transition:border-color .26s,background .26s,box-shadow .26s;
}
.lane:hover{background:rgba(255,255,255,.05)}
.lanes.can-drop .lane{border-color:rgba(34,211,238,.28)}
.lanes.can-drop .lane:hover{border-color:var(--cyan);box-shadow:0 0 22px rgba(34,211,238,.3)}
.lane .av{
  width:28px;height:28px;border-radius:50%;flex:none;display:grid;place-items:center;
  font-size:11.5px;font-weight:600;color:#fff;
}
.lane > .nm{flex:none;width:52px;font-size:12px;font-weight:500;color:var(--tx2)}
.lane-work{
  flex:1;min-width:0;display:flex;align-items:center;gap:6px;
  overflow-x:auto;scrollbar-width:none;
}
.lane-work::-webkit-scrollbar{display:none}
.lane-work .chip{padding:5px 8px}
.lane-work .chip svg{width:14px;height:14px}
.lane-work .chip .nm{font-size:11px}
.lane-empty{font-size:11.5px;color:var(--tx3);font-style:italic}
.load{flex:none;width:58px;display:flex;flex-direction:column;gap:3px;align-items:flex-end}
.load small{font-size:10px;font-weight:600;color:var(--tx3)}
.load .bar{width:100%;height:3px;border-radius:2px;background:rgba(255,255,255,.08);overflow:hidden}
.load .bar i{display:block;height:100%;background:var(--blue);transition:width .4s ease,background .3s}
.load.over small{color:var(--amber)}
.load.over .bar i{background:var(--amber)}
.light{
  flex:none;width:22px;height:22px;border-radius:50%;display:grid;place-items:center;
  background:rgba(255,255,255,.05);color:var(--tx3);
}
.light svg{width:12px;height:12px}
.light[data-st="working"]{background:rgba(34,211,238,.16);color:var(--cyan)}
.light[data-st="decide"]{background:rgba(245,158,11,.2);color:var(--amber);animation:beat 1.5s ease-in-out infinite}
.light[data-st="done"]{background:rgba(16,185,129,.18);color:var(--green)}

/* ─────────── my work ─────────── */
.who-row{
  flex:none;display:flex;gap:8px;overflow-x:auto;padding:2px 2px 0;scrollbar-width:none;
}
.who-row::-webkit-scrollbar{display:none}
.who{
  flex:none;display:flex;align-items:center;gap:8px;padding:6px 13px 6px 6px;cursor:pointer;
  border-radius:999px;border:1px solid var(--hair);background:var(--glass);
  transition:border-color .26s,box-shadow .26s,transform .26s;position:relative;
}
.who .av{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-size:11px;font-weight:600;color:#fff}
.who .nm{font-size:12.5px;font-weight:500;color:var(--tx2)}
.who:hover{transform:translateY(-2px)}
.who.is-on{border-color:var(--purple);box-shadow:0 0 22px var(--glow-p)}
.who.is-on .nm{color:#fff;font-weight:600}
.who .flagdot{
  position:absolute;top:3px;right:3px;width:8px;height:8px;border-radius:50%;
  background:var(--amber);box-shadow:0 0 8px var(--amber);display:none;
}
.who.needs .flagdot{display:block}

.cards-panel{flex:1;min-height:0}
.cards{
  flex:1;min-height:0;overflow-y:auto;padding:13px 15px;
  display:flex;flex-wrap:wrap;gap:10px;align-content:flex-start;
}
.card{
  flex:none;width:clamp(150px,19vw,190px);padding:12px;border-radius:var(--r);
  border:1px solid var(--hair);
  background:linear-gradient(170deg,rgba(255,255,255,.06),rgba(255,255,255,.02));
  transition:border-color .3s,box-shadow .3s,transform .3s;
}
.card:hover{transform:translateY(-3px);box-shadow:0 12px 28px rgba(0,0,0,.45)}
.card-top{display:flex;align-items:center;gap:8px;margin-bottom:9px}
.card-top svg{width:18px;height:18px;flex:none}
.card[data-sp="0"] .card-top svg{color:var(--blue)}
.card[data-sp="1"] .card-top svg{color:var(--purple)}
.card-top .nm{font-size:12.5px;font-weight:600;line-height:1.25}
.meter{height:4px;border-radius:2px;background:rgba(255,255,255,.08);overflow:hidden;margin-bottom:9px}
.meter i{display:block;height:100%;width:0;background:var(--cyan);transition:width .45s ease,background .3s}
.card-bot{display:flex;align-items:center;gap:7px}
.card-bot .du{font-size:10.5px;font-weight:600;color:var(--tx3);flex:1}
.act{
  display:flex;align-items:center;gap:5px;padding:6px 11px;border:0;border-radius:999px;
  cursor:pointer;font-family:inherit;font-size:11.5px;font-weight:600;color:#fff;
  background:rgba(255,255,255,.1);transition:transform .22s,background .22s,box-shadow .22s;
}
.act svg{width:12px;height:12px}
.act:hover{transform:translateY(-2px)}
.act.go{background:linear-gradient(120deg,var(--blue),var(--purple));box-shadow:0 0 18px var(--glow-b)}
.act.ok{background:linear-gradient(120deg,var(--green),var(--cyan));box-shadow:0 0 18px rgba(16,185,129,.45)}
.act.more{background:rgba(245,158,11,.22);color:var(--amber)}
.state{
  display:flex;align-items:center;gap:5px;font-size:11px;font-weight:600;color:var(--tx3);
}
.state svg{width:13px;height:13px}
.card[data-st="working"]{border-color:rgba(34,211,238,.35)}
.card[data-st="working"] .state{color:var(--cyan)}
.card[data-st="decide"]{
  border-color:rgba(245,158,11,.6);box-shadow:0 0 0 1px rgba(245,158,11,.25),0 0 28px rgba(245,158,11,.3);
}
.card[data-st="decide"] .meter i{background:var(--amber)}
.card[data-st="done"]{opacity:.62;border-color:rgba(16,185,129,.35)}
.card[data-st="done"] .meter i{background:var(--green)}
.card[data-st="done"] .state{color:var(--green)}
.card.buzz{animation:buzz .5s cubic-bezier(.3,.9,.4,1)}
.cards-empty{margin:auto;text-align:center;color:var(--tx3);font-size:12.5px}
.cards-empty svg{width:38px;height:38px;opacity:.35;margin-bottom:9px}

/* ─────────── blueprint: one walkthrough per operation ───────────
   Not a reference any more: you pick an operation and step through it, and
   each step lights the one box or arrow it is talking about. Everything here
   is namespaced fp- because .row, .items, .card, .bar, .dot, .state and .act
   are all already taken by the two views above. */
.fp-picker{
  flex:none;display:flex;align-items:center;gap:13px;
  overflow-x:auto;overflow-y:hidden;padding:1px 2px;scrollbar-width:none;
}
.fp-picker::-webkit-scrollbar{display:none}
.fp-group{flex:none;display:flex;align-items:center;gap:5px}
.fp-group > b{
  font-size:9.5px;font-weight:700;letter-spacing:.7px;text-transform:uppercase;
  color:var(--tx3);white-space:nowrap;
}
.fp-flow{
  flex:none;padding:5px 11px;cursor:pointer;white-space:nowrap;
  border:1px solid var(--hair);border-radius:999px;background:var(--glass);
  font-family:var(--mono);font-size:11px;color:var(--tx2);
  transition:border-color .26s,box-shadow .26s,color .26s;
}
.fp-flow:hover{color:var(--tx)}
.fp-flow.is-on{
  color:#fff;font-weight:600;border-color:var(--cyan);
  box-shadow:0 0 0 1px rgba(34,211,238,.4),0 0 20px rgba(34,211,238,.35);
}

.fp-bar{
  flex:none;display:flex;align-items:center;gap:8px;padding:5px 10px;
  border-radius:999px;border:1px solid var(--hair);background:var(--glass);
  backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
}
.fp-btn{
  flex:none;width:26px;height:26px;display:grid;place-items:center;
  border:0;border-radius:999px;cursor:pointer;
  background:rgba(255,255,255,.08);color:var(--tx2);
  transition:background .22s,color .22s,transform .22s;
}
.fp-btn svg{width:13px;height:13px}
.fp-btn:hover{color:#fff;background:rgba(255,255,255,.15);transform:translateY(-1px)}
.fp-btn.go{
  width:auto;display:flex;gap:6px;padding:0 13px;height:26px;color:#fff;
  font-family:inherit;font-size:11.5px;font-weight:600;
  background:linear-gradient(120deg,var(--blue),var(--purple));
  box-shadow:0 0 18px var(--glow-b);
}
.fp-btn.go:hover{box-shadow:0 0 24px var(--glow-p)}
.fp-prog{
  flex:1;min-width:40px;height:3px;border-radius:2px;overflow:hidden;
  background:rgba(255,255,255,.08);
}
.fp-prog i{
  display:block;height:100%;width:0;transition:width .35s ease;
  background:linear-gradient(90deg,var(--blue),var(--cyan));
}
.fp-count{flex:none;min-width:34px;text-align:right;font-size:10.5px;font-weight:600;color:var(--tx3)}
.fp-speed{flex:none;display:flex;align-items:center;gap:5px;font-size:10.5px;color:var(--tx3)}
.fp-speed select{
  font-family:inherit;font-size:10.5px;color:var(--tx2);outline:none;
  background:var(--s2);border:1px solid var(--hair);border-radius:7px;padding:2px 4px;
}

.fp-cap{
  flex:none;display:flex;align-items:flex-start;gap:10px;padding:9px 13px;min-height:54px;
  border-radius:var(--r);border:1px solid var(--hair);background:var(--glass);
  backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
}
.fp-cap-n{
  flex:none;width:22px;height:22px;border-radius:50%;display:grid;place-items:center;
  font-size:11px;font-weight:700;color:#06101E;
  background:linear-gradient(120deg,var(--cyan),var(--blue));
}
.fp-cap-t{display:block;font-size:12.5px;font-weight:600;color:#fff;margin-bottom:2px}
.fp-cap p{font-size:11.5px;line-height:1.5;color:var(--tx2)}
.fp-cap code{font-family:var(--mono);font-size:11px;color:var(--cyan)}
.fp-cap-idle{font-size:11.5px;line-height:1.5;color:var(--tx3)}
.fp-cap-idle b{color:var(--tx2)}
.fp-cap-idle .chain{font-family:var(--mono);font-size:10.5px;color:var(--tx3)}

/* Not .panel: that is a flex column, and a flex column that also scrolls
   fights the min-height:100% the grid below leans on. */
.fp-dia{
  flex:1;min-height:0;overflow:auto;padding:10px;
  border-radius:var(--r2);border:1px solid var(--hair);background:var(--glass);
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
}
/* min-height:100% plus align-content:center, rather than a pixel height
   written in from JS: the grid then centres itself when it fits and grows
   when it does not, and the two viewport tiers only have to disagree about
   one custom property. */
.fp-grid{
  position:relative;display:grid;min-height:100%;align-content:center;
  min-width:560px;padding:4px 2px;
  grid-template-columns:repeat(var(--cols),minmax(0,1fr));
  grid-auto-rows:minmax(var(--fp-row),auto);
  gap:var(--fp-row-gap) var(--fp-col-gap);
  --fp-row:86px;--fp-row-gap:30px;--fp-col-gap:22px;
}
/* absolute, or the svg is auto-placed as a grid item of its own */
.fp-edges{position:absolute;left:0;top:0;pointer-events:none;z-index:1}
.fp-edge{fill:none;stroke:rgba(255,255,255,.14);stroke-width:1.8;transition:stroke .35s,stroke-width .35s}
.fp-edge.dash{stroke-dasharray:5 4}
.fp-edge.is-on{
  stroke:var(--cyan);stroke-width:2.6;stroke-dasharray:7 7;
  animation:flow 1s linear infinite;filter:drop-shadow(0 0 6px rgba(34,211,238,.7));
}
.fp-edge.is-done{stroke:rgba(255,255,255,.28)}
.fp-edge.is-idle{opacity:.3}
/* a real triangle, not a marker: a marker resolves currentColor against its
   own cascade inside <defs>, so it can never follow the line that used it */
.fp-head{fill:rgba(255,255,255,.22);transition:fill .35s}
.fp-head.is-on{fill:var(--cyan)}
.fp-head.is-done{fill:rgba(255,255,255,.34)}
.fp-head.is-idle{opacity:.3}

.fp-node{
  position:relative;z-index:2;align-self:center;justify-self:center;
  width:100%;max-width:200px;padding:8px 11px;text-align:center;cursor:pointer;
  border-radius:var(--r);border:1px solid var(--hair);
  background:linear-gradient(170deg,rgba(255,255,255,.07),rgba(255,255,255,.025));
  transition:border-color .3s,box-shadow .3s,transform .3s,opacity .3s;
}
.fp-node b{
  display:flex;align-items:center;justify-content:center;gap:6px;
  font-family:var(--mono);font-size:11.5px;font-weight:600;color:#fff;
  line-height:1.3;overflow-wrap:break-word;
}
.fp-node b svg{width:13px;height:13px;flex:none;color:var(--blue)}
.fp-node small{display:block;font-size:9.5px;color:var(--tx3);margin-top:2px}
.fp-node em{display:block;font-size:9.5px;font-style:normal;color:var(--tx3);margin-top:4px;line-height:1.4}
.fp-node .mets{
  display:block;margin-top:5px;padding-top:5px;border-top:1px dashed var(--hair);
  font-family:var(--mono);font-size:10px;color:var(--tx2);line-height:1.5;
}
.fp-node.k-class{background:linear-gradient(170deg,rgba(255,255,255,.09),rgba(255,255,255,.03))}
.fp-node.k-data{background:rgba(139,92,246,.08);border-style:dashed;border-radius:14px}
.fp-node.k-data b{color:#C4B5FD;font-weight:500}
.fp-node.k-file{background:rgba(34,211,238,.06);border-color:rgba(34,211,238,.2)}
.fp-node.k-file b svg{color:var(--cyan)}
.fp-node:hover{transform:translateY(-3px);box-shadow:0 14px 30px rgba(0,0,0,.5)}
.fp-node.is-on{
  border-color:var(--cyan);transform:translateY(-3px);
  box-shadow:0 0 0 1px rgba(34,211,238,.4),0 0 30px rgba(34,211,238,.35);
}
.fp-node.is-on b{color:var(--cyan)}
.fp-node.is-done{opacity:.85}
.fp-node.is-idle{opacity:.34}

/* opaque, not glass: the caption sits on the arrow and has to hide it */
.fp-lab{
  position:absolute;z-index:3;transform:translate(-50%,-50%);pointer-events:none;
  padding:2px 7px;border-radius:999px;border:1px solid var(--hair);background:var(--s1);
  font-size:9.5px;color:var(--tx3);white-space:nowrap;
  max-width:190px;overflow:hidden;text-overflow:ellipsis;transition:.2s;
}
/* this page has no global [hidden] rule, and placeLabel() hides the captions
   of the implied, label-less arrows */
.fp-lab[hidden]{display:none}
.fp-lab.is-on{
  color:#06101E;font-weight:700;border-color:transparent;
  background:linear-gradient(120deg,var(--cyan),var(--blue));
}
.fp-lab.is-done{color:var(--tx2)}
.fp-lab.is-idle{opacity:.35}

@keyframes flow{to{stroke-dashoffset:-28}}
@keyframes viewIn{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@keyframes pop{0%{transform:scale(.7);opacity:0}60%{transform:scale(1.1);opacity:1}100%{transform:scale(1)}}
@keyframes beat{0%,100%{opacity:1}50%{opacity:.45}}
@keyframes pip{0%{transform:scale(0)}60%{transform:scale(1.25)}100%{transform:scale(1)}}
@keyframes buzz{0%,100%{transform:translateX(0)}25%{transform:translateX(-5px)}60%{transform:translateX(4px)}}

/* short viewports — the embedded frame is about 1140x480 */
@media (max-height:620px){
  .top{padding:8px clamp(10px,2.4vw,18px);gap:10px}
  .brand .proj{display:none}
  .seg{padding:7px 13px;font-size:12.5px}
  .view{gap:8px;padding:0 clamp(10px,2.4vw,18px) 10px}
  .p-head{padding:8px 12px 0}
  .band{padding:7px 12px 10px;gap:13px}
  .chip{padding:6px 9px}
  .lanes{padding:6px 12px 9px;gap:5px}
  .lane{padding:5px 8px;gap:8px}
  .lane .av{width:25px;height:25px;font-size:11px}
  .lane > .nm{width:46px;font-size:11.5px}
  .cards{padding:10px 12px;gap:8px}
  .card{width:150px;padding:10px}
  .fp-grid{--fp-row:46px;--fp-row-gap:14px;--fp-col-gap:14px}
  .fp-node{max-width:186px;padding:6px 9px}
  .fp-node b{font-size:11px}
  .fp-node small,.fp-node em{font-size:9px}
  .fp-node .mets{font-size:9.5px;margin-top:4px;padding-top:4px}
  .fp-cap{min-height:50px;padding:8px 11px}
  .fp-cap p,.fp-cap-idle{font-size:11px}
  .fp-dia{padding:8px}
  .fp-bar{padding:4px 8px;gap:6px}
  .fp-picker{gap:11px}
}
@media (max-width:700px){
  .brand b,.brand .proj{display:none}
  .clock{padding:5px 9px;font-size:12.5px}
  .adv span{display:none}
  .adv{padding:8px 11px}
  .lane > .nm{display:none}
  .load{width:44px}
}
/* a phone cannot fit the mark, both labels and the clock on one row,
   and the page does not scroll sideways — so the mark goes */
@media (max-width:470px){
  .top{gap:8px;padding:8px 10px}
  .brand{display:none}
  .seg{padding:7px 11px;font-size:12px;gap:5px}
  .clockbox{gap:6px}
  .clock{padding:5px 8px;font-size:12px;letter-spacing:.4px}
  /* three labels plus the clock do not fit a phone, and this page never
     scrolls sideways — so only the view you are on says its name */
  .seg .lb{display:none}
  .seg.is-on .lb{display:inline}
}

<body>

<div class="app" id="app">

  <header class="top">
    <div class="brand">
      <span class="mark" id="mark"></span>
      <b>SprintBoard</b>
      <span class="proj">AI Study Buddy</span>
    </div>
    <div class="toggle" id="toggle">
      <span class="thumb" id="thumb"></span>
      <button class="seg is-on" data-view="lead" id="segLead" aria-label="The lead's board"></button>
      <button class="seg" data-view="me" id="segMe" aria-label="One person's work"></button>
      <button class="seg" data-view="plan" id="segPlan" aria-label="Walk through the classes behind the board"></button>
    </div>
    <div class="clockbox" id="clockbox">
      <span class="clock" id="clock">09:00</span>
      <button class="adv" id="adv" aria-label="Move the day forward by thirty minutes"></button>
    </div>
  </header>

  <main class="stage">

    <!-- ══════ lead ══════ -->
    <section class="view is-on" id="viewLead">
      <div class="panel band-panel">
        <div class="p-head">
          <span class="dot"></span><span class="lbl">Not handed out yet</span>
          <span class="hint" id="bandHint"></span>
        </div>
        <div class="band" id="band"></div>
      </div>
      <div class="panel lanes-panel">
        <div class="p-head"><span class="dot p"></span><span class="lbl">The team</span></div>
        <div class="lanes" id="lanes"></div>
      </div>
    </section>

    <!-- ══════ my work ══════ -->
    <section class="view" id="viewMe">
      <div class="who-row" id="whoRow"></div>
      <div class="panel cards-panel">
        <div class="cards" id="cards"></div>
      </div>
    </section>

    <!-- ══════ blueprint ══════ -->
    <section class="view" id="viewPlan">
      <div class="fp-picker" id="fpPicker"></div>
      <div class="fp-bar" id="fpBar">
        <button class="fp-btn" data-ctl="restart" aria-label="Back to the start"></button>
        <button class="fp-btn" data-ctl="prev" aria-label="Previous step"></button>
        <button class="fp-btn go" data-ctl="play" id="fpPlay"></button>
        <button class="fp-btn" data-ctl="next" aria-label="Next step"></button>
        <span class="fp-prog"><i id="fpFill"></i></span>
        <span class="fp-count" id="fpCount"></span>
        <label class="fp-speed">speed
          <select id="fpSpeed" aria-label="How fast the walkthrough steps">
            <option value="0.5">0.5&times;</option>
            <option value="1" selected>1&times;</option>
            <option value="2">2&times;</option>
          </select>
        </label>
      </div>
      <div class="fp-cap" id="fpCap"></div>
      <div class="fp-dia" id="fpDia"><div class="fp-grid" id="fpGrid"></div></div>
    </section>

  </main>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/animejs/3.2.2/anime.min.js"></script>

/* ════════════════════════════════════════
   THE CLASSES BEHIND ALL OF THIS
   One walkthrough per operation. A flow is a handful of boxes on a row/col
   grid, the arrows between them, and an ordered list of which box or arrow
   lights up next — so the picture and the prose can never drift apart.

   Edge ids are derived, never written: 'from>to'. That one convention is why
   a step's `focus` can name a box and an arrow in the same flat list, and why
   one painter drives boxes, arrows and captions together.

   Authoring rules, both learnt the hard way:
     · ids stay lowercase alphanumeric — they go straight into a selector
     · write Java generics as &lt; — these strings are interpolated as HTML
       so that the prose can keep marking data up as <code>
════════════════════════════════════════ */
function nd(id, label, o){
  o = o || {};
  return { id:id, label:label, kind:o.kind || 'method', icon:o.icon || null,
           row:o.row || 0, col:o.col || 0, sub:o.sub || '',
           methods:o.methods || null, note:o.note || '' };
}
function eg(from, to, label, dashed){
  return { id:from + '>' + to, from:from, to:to, label:label || '', dashed:!!dashed };
}
function st(focus, title, text){
  return { focus:(focus instanceof Array) ? focus : [focus], title:title, text:text };
}

/* Every flow is four rows by three columns, and every arrow points down or
   sideways-within-a-row. drawEdges() has no upward case, and a sideways-then-
   drop arrow runs along its source's middle — so a box parked in that row
   between the two ends would be drawn straight through. */
var FLOWS = [

  /* ══════ authentication ══════ */

    id:'sign-in', group:'Authentication', name:'signIn()', title:'Sign in',

    nodes:[
      nd('main','Main.java',{kind:'class',icon:'door',row:0,col:1,sub:'menu · Scanner'}),
      nd('board','SprintBoard.java',{kind:'class',icon:'key',row:1,col:1,methods:['signIn()']}),

    ],
    edges:[
      eg('main','board','option 1 → name, password'),
      eg('board','get','is this really you?'),

      eg('role','user','employee'),

    steps:[

      st('main>board','Straight to the front door',

      st(['board','board>get'],'signIn() cannot answer alone',
         'The users live in the file, not in memory, so <code>signIn()</code> asks FileHandling for them.'),
      st(['get','get>role'],'getAllUsersDetails()',
         'FileHandling hands back every stored user. Matching a password against one of them is SprintBoard&rsquo;s job, not the file&rsquo;s.'),
      st('role','The role is read back',
         'The same field that was written at sign-up. One string, and it picks which class you spend the rest of the session inside.'),
      st(['role>user','user'],'Employee → UserOperations',
         'An employee only ever gets the class that holds <code>[ tasks ]</code> — their own. It cannot reach anyone else&rsquo;s work, because it was never handed it.'),
      st(['role>admin','admin'],'Lead → AdminOperations',

  /* ══════ the employee side ══════ */
  {
    id:'view-tasks', group:'My work', name:'viewTasks()', title:'View my tasks',
    sub:'Main → UserOperations.viewTasks() → getEmployeeTasks() → [ tasks ]',
    nodes:[

var view  = 'lead';

if (A) A.suspendWhenDocumentHidden = false;

/* ════════════════════════════════════════
   SHORTHANDS
════════════════════════════════════════ */
function $(id){ return document.getElementById(id); }
function stage(id){ for (var i=0;i<STAGES.length;i++) if (STAGES[i].id===id) return STAGES[i]; return null; }
function person(id){ for (var i=0;i<PEOPLE.length;i++) if (PEOPLE[i].id===id) return PEOPLE[i]; return PEOPLE[0]; }
function held(pid){ return STAGES.filter(function(s){ return s.owner === pid; }); }
function loose(){ return STAGES.filter(function(s){ return s.owner === null; }); }

function dur(m){
  var h = Math.floor(m/60), r = m%60;
  if (!h) return r + 'm';
  return r ? h + 'h' + r : h + 'h';
}
function hhmm(t){
  var h = Math.floor(t/60) % 24, m = t % 60;
  return (h<10?'0':'') + h + ':' + (m<10?'0':'') + m;
}
function avatar(p, cls){
  return '<span class="av '+(cls||'')+'" style="background:'+p.c+'">'+p.i+'</span>';
}

/* where a person stands, read off the work filed under them */
function standing(pid){
  var mine = held(pid);
  if (!mine.length) return 'empty';
  if (mine.some(function(s){ return s.state === 'decide'; }))  return 'decide';
  if (mine.some(function(s){ return s.state === 'working'; })) return 'working';
  if (mine.every(function(s){ return s.state === 'done'; }))   return 'done';
  return 'waiting';
}
var LIGHT = {empty:'empty', waiting:'wait', working:'spin', decide:'bang', done:'check'};
function waitingOnUser(){ return STAGES.filter(function(s){ return s.state === 'decide'; }).length; }

/* ════════════════════════════════════════
   RENDER
════════════════════════════════════════ */
function chipHTML(s, extra){
  return '<div class="chip'+(sel===s.id?' is-sel':'')+(justPlaced===s.id?' just':'')+'"'+
           ' data-stage="'+s.id+'" data-sp="'+s.sp+'" draggable="true"'+
           ' role="button" tabindex="0" aria-label="'+s.name+', '+dur(s.mins)+'">'+
           I[s.icon]+
           '<span class="nm">'+s.name+'</span>'+
           (extra === false ? '' : '<span class="du">'+dur(s.mins)+'</span>')+
         '</div>';
}

function renderBand(){
  var el = $('band'), free = loose();
  if (!free.length){
    el.innerHTML = '<div class="band-empty">Everything is with someone</div>';
  } else {
    el.innerHTML = SPRINTS.map(function(nm, i){
      var mine = free.filter(function(s){ return s.sp === i; });
      if (!mine.length) return '';
      return '<div class="sprint">'+
               '<span class="sprint-tag"><b>SPRINT '+(i+1)+'</b><small>'+nm+'</small></span>'+
               mine.map(function(s){ return chipHTML(s); }).join('')+
             '</div>';
    }).join('');
  }
  var picked = sel ? stage(sel) : null;
  var hint = $('bandHint');
  if (picked && picked.owner){ hint.textContent = 'tap here to take it back'; hint.classList.add('live'); }
  else if (picked){ hint.textContent = 'now tap a teammate'; hint.classList.add('live'); }
  else { hint.textContent = 'tap a piece of work'; hint.classList.remove('live'); }
  el.classList.toggle('can-drop', !!(picked && picked.owner));
}

function renderLanes(){
  $('lanes').innerHTML = PEOPLE.map(function(p){
    var mine = held(p.id);
    var total = mine.reduce(function(n,s){ return n + s.mins; }, 0);
    var st = standing(p.id);
    var pct = Math.min(100, Math.round(total / DAY * 100));
    return '<div class="lane" data-person="'+p.id+'">'+
             avatar(p)+
             '<span class="nm">'+p.name+'</span>'+
             '<div class="lane-work">'+
               (mine.length ? mine.map(function(s){ return chipHTML(s); }).join('')
                            : '<span class="lane-empty">nothing yet</span>')+
             '</div>'+
             '<span class="load'+(total > DAY ? ' over' : '')+'">'+
               '<small>'+(total ? dur(total) : '—')+'</small>'+
               '<span class="bar"><i style="width:'+pct+'%"></i></span>'+
             '</span>'+
             '<span class="light" data-st="'+st+'" aria-label="'+p.name+' — '+st+'">'+I[LIGHT[st]]+'</span>'+
           '</div>';
  }).join('');
  $('lanes').classList.toggle('can-drop', !!(sel && !stage(sel).owner));
}

function renderWho(){
  $('whoRow').innerHTML = PEOPLE.map(function(p){
    var needs = held(p.id).some(function(s){ return s.state === 'decide'; });
    return '<div class="who'+(me===p.id?' is-on':'')+(needs?' needs':'')+'" data-person="'+p.id+'"'+
             ' role="button" tabindex="0" aria-label="Show '+p.name+'’s work">'+
             avatar(p)+'<span class="nm">'+p.name+'</span><span class="flagdot"></span>'+
           '</div>';
  }).join('');
}

var STATE_WORD = {waiting:'not started', working:'under way', decide:'time is up', done:'done'};
function renderCards(){
  var mine = held(me), el = $('cards');
  if (!mine.length){
    el.innerHTML = '<div class="cards-empty">'+I.empty+'<div>Nothing handed to '+person(me).name+' yet</div></div>';
    return;
  }
  el.innerHTML = mine.map(function(s){
    var pct = Math.min(100, Math.round(s.spent / s.mins * 100));
    var act = '';
    if (s.state === 'waiting')      act = '<button class="act go" data-act="start" data-stage="'+s.id+'">'+I.play+'Start</button>';
    else if (s.state === 'decide')  act = '<button class="act ok" data-act="done" data-stage="'+s.id+'" aria-label="Mark done">'+I.check+'</button>'+
                                          '<button class="act more" data-act="more" data-stage="'+s.id+'" aria-label="Give it another 30 minutes">'+I.again+'</button>';
    else                            act = '<span class="state">'+I[LIGHT[s.state]]+STATE_WORD[s.state]+'</span>';
    return '<div class="card" data-sp="'+s.sp+'" data-st="'+s.state+'" data-stage="'+s.id+'">'+
             '<div class="card-top">'+I[s.icon]+'<span class="nm">'+s.name+'</span></div>'+
             '<div class="meter"><i style="width:'+pct+'%"></i></div>'+
             '<div class="card-bot"><span class="du">'+dur(s.spent)+' / '+dur(s.mins)+'</span>'+act+'</div>'+
           '</div>';
  }).join('');
}

function renderTop(){
  $('clock').textContent = hhmm(clock);
  var n = waitingOnUser(), pip = $('segMe').querySelector('.pip');
  if (pip){ pip.textContent = n; pip.classList.toggle('on', n > 0); }
}

function renderAll(){ renderBand(); renderLanes(); renderWho(); renderCards(); renderTop(); }

/* ════════════════════════════════════════
   VIEW SWAP — display is the authority, the
   animation is only a flourish
════════════════════════════════════════ */
var SEG = {lead:'segLead', me:'segMe', plan:'segPlan'};
var VIEW = {lead:'viewLead', me:'viewMe', plan:'viewPlan'};

function moveThumb(){
  var on = $(SEG[view]);
  $('thumb').style.width = on.offsetWidth + 'px';
  $('thumb').style.transform = 'translateX(' + (on.offsetLeft - 5) + 'px)';
}
function setView(next){
  if (next === view) return;
  view = next;
  for (var k in SEG){
    $(SEG[k]).classList.toggle('is-on', k === view);
    $(VIEW[k]).classList.toggle('is-on', k === view);
  }
  /* the clock runs the day; it means nothing on the blueprint */
  $('clockbox').style.visibility = (view === 'plan') ? 'hidden' : '';
  moveThumb();
  /* Boxes can only be measured once the view is actually on screen — hence
     the draw here rather than at load. The pause matters just as much: left
     running, the player would step a diagram nobody is looking at and you
     would come back to a finished walkthrough. */
  if (view === 'plan'){
    drawEdges();
    setTimeout(drawEdges, 80);
    if (stepI < 0) play();
  } else {
    pause();
  }
}

/* ════════════════════════════════════════
   HANDING WORK OUT
════════════════════════════════════════ */
function pick(id){ sel = (sel === id) ? null : id; renderBand(); renderLanes(); }

function giveTo(pid){
  if (!sel) return;
  var s = stage(sel);
  if (!s || s.owner === pid) { sel = null; renderAll(); return; }
  s.owner = pid;
  justPlaced = s.id;
  sel = null;
  renderAll();
  setTimeout(function(){ justPlaced = null; }, 600);
}

function takeBack(){
  if (!sel) return;
  var s = stage(sel);
  if (!s || !s.owner) return;
  s.owner = null; s.state = 'waiting'; s.spent = 0;
  justPlaced = s.id;
  sel = null;
  renderAll();
  setTimeout(function(){ justPlaced = null; }, 600);
}

/* ════════════════════════════════════════
   RUNNING THE DAY
════════════════════════════════════════ */
function advance(){
  clock += STEP;
  var flipped = [];
  STAGES.forEach(function(s){
    if (s.state !== 'working') return;
    s.spent += STEP;
    if (s.spent >= s.mins){ s.spent = s.mins; s.state = 'decide'; flipped.push(s.id); }
  });
  renderAll();
  flipped.forEach(function(id){
    var c = $('cards').querySelector('.card[data-stage="'+id+'"]');
    if (c){ c.classList.add('buzz'); setTimeout(function(){ c.classList.remove('buzz'); }, 520); }
  });
  if (A) A({targets:'#clock', scale:[1,1.09,1], duration:380, easing:'easeOutQuad'});
}

function act(kind, id){
  var s = stage(id);
  if (!s) return;
  if (kind === 'start' && s.state === 'waiting') s.state = 'working';
  else if (kind === 'done' && s.state === 'decide') s.state = 'done';
  else if (kind === 'more' && s.state === 'decide'){ s.mins += STEP; s.state = 'working'; }
  renderAll();
}

/* ════════════════════════════════════════
   BLUEPRINT — one walkthrough, played a step at a time
════════════════════════════════════════ */
var FP_DWELL = 3400;   /* how long a step is left on screen, at 1x */
var flow    = null;    /* the walkthrough being played */
var stepI   = -1;      /* -1 is the idle "press play" state */
var playing = false;
var fpSpeed = 1;
var fpTimer = null;
var fpDraw  = null;

function flowById(id){ for (var i=0;i<FLOWS.length;i++) if (FLOWS[i].id===id) return FLOWS[i]; return null; }

/* ── markup ────────────────────────────── */

/* The groups are not written down anywhere: they are the order the flows
   appear in, first seen first. */
function renderPicker(){
  var groups = [], html = '', i, j, g, f;
  for (i=0;i<FLOWS.length;i++){
    g = null;
    for (j=0;j<groups.length;j++) if (groups[j].name === FLOWS[i].group) g = groups[j];
    if (!g){ g = {name:FLOWS[i].group, flows:[]}; groups.push(g); }
    g.flows.push(FLOWS[i]);
  }
  for (i=0;i<groups.length;i++){
    html += '<div class="fp-group"><b>' + groups[i].name + '</b>';
    for (j=0;j<groups[i].flows.length;j++){
      f = groups[i].flows[j];
      html += '<button class="fp-flow" data-flow="'+f.id+'" title="'+f.sub+'">'+f.name+'</button>';
    }
    html += '</div>';
  }
  $('fpPicker').innerHTML = html;
}

function nodeHTML(n){
  var h = '<div class="fp-node k-'+n.kind+'" data-node="'+n.id+'" role="button" tabindex="0"'+
          ' style="grid-row:'+(n.row+1)+';grid-column:'+(n.col+1)+'">';
  h += '<b>' + (n.icon ? I[n.icon] : '') + '<span>'+n.label+'</span></b>';
  if (n.sub)     h += '<small>'+n.sub+'</small>';
  if (n.methods) h += '<span class="mets">'+n.methods.join('<br>')+'</span>';
  if (n.note)    h += '<em>'+n.note+'</em>';
  return h + '</div>';
}

function flowHTML(f){
  var html = '<svg class="fp-edges" aria-hidden="true"></svg>', i;
  for (i=0;i<f.nodes.length;i++) html += nodeHTML(f.nodes[i]);
  for (i=0;i<f.edges.length;i++)
    html += '<span class="fp-lab" data-elabel="'+f.edges[i].id+'">'+f.edges[i].label+'</span>';
  return html;
}

/* ── drawing ───────────────────────────── */

/* Arrows are measured from where the boxes actually ended up, so the picture
   survives a resize, a late font, or a longer method name. */
function drawEdges(){
  if (!flow) return;
  var grid = $('fpGrid'), svg = grid.querySelector('.fp-edges');
  if (!svg) return;
  var box = grid.getBoundingClientRect();
  if (!box.width) return;   /* the view has not been shown yet */

  svg.setAttribute('viewBox','0 0 '+box.width+' '+box.height);
  svg.style.width  = box.width + 'px';
  svg.style.height = box.height + 'px';
  while (svg.firstChild) svg.removeChild(svg.firstChild);

  function rel(el){
    var r = el.getBoundingClientRect();
    return {
      left:   r.left - box.left,
      right:  r.left - box.left + r.width,
      top:    r.top  - box.top,
      bottom: r.top  - box.top + r.height,
      cx:     r.left - box.left + r.width/2,
      mid:    r.top  - box.top + r.height/2
    };
  }

  /* every box, so the captions can be kept off them */
  var boxes = grid.querySelectorAll('[data-node]'), obstacles = [], i;
  for (i=0;i<boxes.length;i++) obstacles.push(rel(boxes[i]));

  for (i=0;i<flow.edges.length;i++){
    var e = flow.edges[i];
    var a = grid.querySelector('[data-node="'+e.from+'"]');
    var b = grid.querySelector('[data-node="'+e.to+'"]');
    if (!a || !b) continue;
    var s = rel(a), t = rel(b), d, anchor, hx, hy, rot, x1, ax, bx, right;

    if (t.top >= s.bottom - 2){
      if (Math.abs(s.cx - t.cx) < 6){
        /* straight down the same column */
        d = 'M'+s.cx+' '+s.bottom+' L'+t.cx+' '+t.top;
        anchor = [s.cx, (s.bottom + t.top)/2];
      } else {
        /* leave sideways, run across, then drop — this keeps the line out of
           whatever sits directly below the source box */
        x1 = (t.cx > s.cx) ? s.right : s.left;
        d = 'M'+x1+' '+s.mid+' L'+t.cx+' '+s.mid+' L'+t.cx+' '+t.top;
        anchor = [(x1 + t.cx)/2, s.mid];
      }
      hx = t.cx; hy = t.top; rot = 90;         /* arriving from above */
    } else {
      /* same row */
      right = t.left > s.left;
      ax = right ? s.right : s.left;
      bx = right ? t.left  : t.right;
      d = 'M'+ax+' '+s.mid+' L'+bx+' '+t.mid;
      anchor = [(ax + bx)/2, (s.mid + t.mid)/2];
      hx = bx; hy = t.mid; rot = right ? 0 : 180;
    }

    var path = document.createElementNS('http://www.w3.org/2000/svg','path');
    path.setAttribute('d', d);
    path.setAttribute('class', 'fp-edge' + (e.dashed ? ' dash' : ''));
    path.setAttribute('data-edge', e.id);
    svg.appendChild(path);

    /* A triangle of our own, turned to match the last leg. A <marker> cannot
       do this job: it resolves currentColor against its own cascade inside
       <defs>, so it could never follow the line that used it. */
    var head = document.createElementNS('http://www.w3.org/2000/svg','path');
    head.setAttribute('d','M'+hx+','+hy+' l-7,-4.5 l0,9 z');
    head.setAttribute('class','fp-head');
    head.setAttribute('data-edge', e.id);
    if (rot) head.setAttribute('transform','rotate('+rot+','+hx+','+hy+')');
    svg.appendChild(head);

    placeLabel(e, path, anchor, obstacles, s, t, box);
  }

  paintFocus();
}

/* Put an arrow's caption on the line, but never on top of a box. */
function placeLabel(edge, path, anchor, obstacles, s, t, box){
  var label = $('fpGrid').querySelector('[data-elabel="'+edge.id+'"]');
  if (!label) return;
  label.hidden = !edge.label;      /* the implied, label-less arrows */
  if (!edge.label) return;

  var w = label.offsetWidth, h = label.offsetHeight;

  function clear(p){
    for (var oi=0; oi<obstacles.length; oi++){
      var o = obstacles[oi];
      if (p[0] + w/2 > o.left - 3 && p[0] - w/2 < o.right  + 3 &&
          p[1] + h/2 > o.top  - 3 && p[1] - h/2 < o.bottom + 3) return false;
    }
    return true;
  }
  function firstClear(list){
    for (var k=0;k<list.length;k++) if (clear(list[k])) return list[k];
    return null;
  }

  var point = anchor;
  if (!clear(point)){
    var len = path.getTotalLength();
    var fr = [0.5, 0.35, 0.65, 0.22, 0.78, 0.12, 0.88];
    var onLine = [], offLine = [], k, pt;
    for (k=0;k<fr.length;k++){
      pt = path.getPointAtLength(len * fr[k]);
      onLine.push([pt.x, pt.y]);
    }
    /* A caption is taller than the gap between two stacked rows, so on a
       straight-down arrow nothing on the line can ever be clear. Step it out
       past both boxes instead, keeping its height — the columns are far wider
       than the boxes sitting in them, so the room is there. Clearing the line
       is not enough; it has to clear the box the line came out of. */
    var outR = Math.max(s.right, t.right) + w/2 + 8;
    var outL = Math.min(s.left,  t.left)  - w/2 - 8;
    var sideLine = [];
    for (k=0;k<onLine.length;k++){
      sideLine.push([outR, onLine[k][1]]);
      sideLine.push([outL, onLine[k][1]]);
    }
    /* if the line itself is too tight — short hops between neighbours —
       step the caption just above or below it */
    for (k=0;k<onLine.length;k++){
      offLine.push([onLine[k][0], onLine[k][1] - h - 4]);
      offLine.push([onLine[k][0], onLine[k][1] + h + 4]);
    }
    /* last resort, for boxes almost shoulder to shoulder: park the caption
       clear of both of them, above or below */
    var beside = [
      [anchor[0], Math.min(s.top, t.top) - h/2 - 5],
      [anchor[0], Math.max(s.bottom, t.bottom) + h/2 + 5]
    ];
    point = firstClear(onLine) || firstClear(sideLine) || firstClear(offLine) ||
            firstClear(beside) || anchor;
  }

  /* Every candidate above can fall outside the diagram — the last two
     deliberately reach past the top and bottom rows. Clipped is worse than
     overlapping, so the chosen spot is pulled back inside. */
  var px = Math.max(w/2 + 2, Math.min(point[0], box.width  - w/2 - 2));
  var py = Math.max(h/2 + 2, Math.min(point[1], box.height - h/2 - 2));

  label.style.left = px + 'px';
  label.style.top  = py + 'px';
}

/* ── stepping ──────────────────────────── */

/* Three states, one painter. Because an edge's id is 'from>to', a step's
   focus list can name a box and an arrow together and this still works. */
function paintFocus(){
  if (!flow) return;
  var grid = $('fpGrid'), now = {}, seen = {}, i, j, f;

  if (stepI >= 0){
    f = flow.steps[stepI].focus;
    for (i=0;i<f.length;i++) now[f[i]] = 1;
  }
  for (i=0;i<stepI;i++){
    f = flow.steps[i].focus;
    for (j=0;j<f.length;j++) seen[f[j]] = 1;
  }

  function mark(el, id){
    el.classList.toggle('is-on',   now[id] === 1);
    el.classList.toggle('is-done', now[id] !== 1 && seen[id] === 1);
    el.classList.toggle('is-idle', now[id] !== 1 && seen[id] !== 1);
  }

  var nodes = grid.querySelectorAll('[data-node]');
  for (i=0;i<nodes.length;i++) mark(nodes[i], nodes[i].getAttribute('data-node'));
  /* one query covers the line and its arrowhead — they share the edge id */
  var edges = grid.querySelectorAll('[data-edge]');
  for (i=0;i<edges.length;i++) mark(edges[i], edges[i].getAttribute('data-edge'));
  var labs = grid.querySelectorAll('[data-elabel]');
  for (i=0;i<labs.length;i++) mark(labs[i], labs[i].getAttribute('data-elabel'));
}

function show(i){
  if (!flow) return;
  var steps = flow.steps;
  stepI = Math.max(-1, Math.min(i, steps.length - 1));
  var s = steps[stepI];

  $('fpCap').innerHTML = s
    ? '<span class="fp-cap-n">'+(stepI+1)+'</span>' +
      '<div><b class="fp-cap-t">'+s.title+'</b><p>'+s.text+'</p></div>'
    : '<div class="fp-cap-idle"><span class="chain">'+flow.sub+'</span><br>'+
      'Press <b>Play</b> to walk it through, or step with the arrow keys.</div>';

  $('fpCount').textContent = Math.max(0, stepI + 1) + ' / ' + steps.length;
  $('fpFill').style.width  = ((stepI + 1) / steps.length * 100) + '%';

  paintFocus();
  scrollFocusIntoView();
  if (A && s) A({targets:'#fpCap .fp-cap-n', scale:[.8,1], duration:280, easing:'easeOutQuad'});
}

/* Every flow is sized to fit, so this is insurance rather than a feature —
   but it is what makes the diagram's overflow:auto honest. Set the scroll
   position outright: smooth scrolling is animation, and animation is exactly
   what cannot be relied on to run here. */
function scrollFocusIntoView(){
  var dia = $('fpDia'), el = dia.querySelector('.fp-node.is-on');
  if (!el) return;
  var maxX = dia.scrollWidth  - dia.clientWidth;
  var maxY = dia.scrollHeight - dia.clientHeight;
  if (maxX > 0)
    dia.scrollLeft = Math.max(0, Math.min(el.offsetLeft + el.offsetWidth/2 - dia.clientWidth/2, maxX));
  if (maxY > 0)
    dia.scrollTop  = Math.max(0, Math.min(el.offsetTop + el.offsetHeight/2 - dia.clientHeight/2, maxY));
}

function play(){
  if (!flow) return;
  if (stepI >= flow.steps.length - 1) show(-1);
  playing = true;
  var b = $('fpPlay');
  if (b) b.innerHTML = I.pause + '<span>Pause</span>';
  tick();
}
function pause(){
  playing = false;
  clearTimeout(fpTimer);
  var b = $('fpPlay');
  if (b) b.innerHTML = I.play + '<span>Play</span>';
}
function tick(){
  clearTimeout(fpTimer);
  if (!playing) return;
  if (stepI >= flow.steps.length - 1){ pause(); return; }
  show(stepI + 1);
  fpTimer = setTimeout(tick, FP_DWELL / fpSpeed);
}

function selectFlow(id){
  pause();
  flow = flowById(id) || FLOWS[0];
  stepI = -1;

  var btns = $('fpPicker').querySelectorAll('.fp-flow'), i, cols = 0;
  for (i=0;i<btns.length;i++)
    btns[i].classList.toggle('is-on', btns[i].getAttribute('data-flow') === flow.id);

  for (i=0;i<flow.nodes.length;i++)
    if (flow.nodes[i].col + 1 > cols) cols = flow.nodes[i].col + 1;

  var grid = $('fpGrid');
  grid.style.setProperty('--cols', cols);
  grid.innerHTML = flowHTML(flow);

  show(-1);
  /* Draw synchronously — reading the boxes forces the layout we need. A second
     pass shortly after catches any late reflow; requestAnimationFrame is not
     used because it never fires while the page is hidden or not compositing. */
  if (view === 'plan'){
    drawEdges();
    setTimeout(drawEdges, 80);
    play();
  }
}

/* drawEdges() reads a rect per box and a width per caption, so unlike the old
   one-shot wire draw it is worth keeping off the resize event's hot path */
function queueDraw(){ clearTimeout(fpDraw); fpDraw = setTimeout(drawEdges, 120); }

/* jump to wherever a box is first talked about */
function stepOfNode(id){
  var i, j;
  for (i=0;i<flow.steps.length;i++){
    for (j=0;j<flow.steps[i].focus.length;j++)
      if (flow.steps[i].focus[j] === id) return i;
  }
  return -1;
}

/* ════════════════════════════════════════
   WIRE UP
════════════════════════════════════════ */
$('mark').innerHTML = I.board;
$('segLead').innerHTML = I.board + '<span class="lb">The board</span>';
$('segMe').innerHTML   = I.user  + '<span class="lb">My work</span><span class="pip">0</span>';
$('segPlan').innerHTML = I.plan  + '<span class="lb">Blueprint</span>';
$('adv').innerHTML     = I.fwd   + '<span>+30m</span>';
$('fpBar').querySelector('[data-ctl="restart"]').innerHTML = I.again;
$('fpBar').querySelector('[data-ctl="prev"]').innerHTML    = I.prev;
$('fpBar').querySelector('[data-ctl="next"]').innerHTML    = I.next;
$('fpPlay').innerHTML = I.play + '<span>Play</span>';

$('toggle').addEventListener('click', function(e){
  var seg = e.target.closest('.seg');
  if (seg) setView(seg.getAttribute('data-view'));
});
$('adv').addEventListener('click', advance);

$('band').addEventListener('click', function(e){
  var chip = e.target.closest('.chip');
  if (chip) return pick(chip.getAttribute('data-stage'));
  if (sel && stage(sel).owner) takeBack();
});

$('lanes').addEventListener('click', function(e){
  var lane = e.target.closest('.lane');
  if (!lane) return;
  if (sel) return giveTo(lane.getAttribute('data-person'));
  var chip = e.target.closest('.chip');
  if (chip) pick(chip.getAttribute('data-stage'));
});

$('whoRow').addEventListener('click', function(e){
  var w = e.target.closest('.who');
  if (w){ me = w.getAttribute('data-person'); renderWho(); renderCards(); }
});

$('cards').addEventListener('click', function(e){
  var b = e.target.closest('.act');
  if (b) act(b.getAttribute('data-act'), b.getAttribute('data-stage'));
});

/* keyboard: the chips and avatars are real controls */
document.addEventListener('keydown', function(e){
  /* one handler, one place: on the walkthrough the keys mean something else
     entirely, so it takes the event first and hands nothing back */
  if (view === 'plan'){
    var a = document.activeElement, tag = a ? a.tagName : '';
    /* inside the speed menu the arrows belong to the menu */
    if (tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT') return;
    if ((e.key === 'Enter' || e.key === ' ') && a && a.classList.contains('fp-node')){
      e.preventDefault();
      var at = stepOfNode(a.getAttribute('data-node'));
      if (at > -1){ pause(); show(at); }
      return;
    }
    if (e.key === 'ArrowRight'){ e.preventDefault(); pause(); show(stepI + 1); }
    else if (e.key === 'ArrowLeft'){ e.preventDefault(); pause(); show(stepI - 1); }
    else if (e.key === ' '){ e.preventDefault(); if (playing) pause(); else play(); }
    return;
  }
  if (e.key === 'Escape' && sel){ sel = null; renderBand(); renderLanes(); return; }
  if (e.key !== 'Enter' && e.key !== ' ') return;
  var t = document.activeElement;
  if (!t) return;
  if (t.classList.contains('chip')){ e.preventDefault(); pick(t.getAttribute('data-stage')); }
  else if (t.classList.contains('who')){ e.preventDefault(); me = t.getAttribute('data-person'); renderWho(); renderCards(); }
});

/* dragging, for anyone on a mouse — the tap path above does the same job */
document.addEventListener('dragstart', function(e){
  var chip = e.target.closest ? e.target.closest('.chip') : null;
  if (!chip) return;
  sel = chip.getAttribute('data-stage');
  if (e.dataTransfer){ e.dataTransfer.effectAllowed = 'move'; e.dataTransfer.setData('text/plain', sel); }
  renderBand(); renderLanes();
});
document.addEventListener('dragover', function(e){
  if (!sel) return;
  if (e.target.closest && (e.target.closest('.lane') || e.target.closest('.band'))) e.preventDefault();
});
document.addEventListener('drop', function(e){
  if (!sel) return;
  var lane = e.target.closest && e.target.closest('.lane');
  if (lane){ e.preventDefault(); return giveTo(lane.getAttribute('data-person')); }
  if (e.target.closest && e.target.closest('.band') && stage(sel).owner){ e.preventDefault(); takeBack(); }
});
document.addEventListener('dragend', function(){ if (sel){ sel = null; renderBand(); renderLanes(); } });

/* the walkthrough: pick an operation, drive it, or click a box to jump to
   wherever it is first talked about */
$('fpPicker').addEventListener('click', function(e){
  var b = e.target.closest('.fp-flow');
  if (b) selectFlow(b.getAttribute('data-flow'));
});
$('fpBar').addEventListener('click', function(e){
  var b = e.target.closest('.fp-btn');
  if (!b) return;
  var ctl = b.getAttribute('data-ctl');
  if (ctl === 'play'){ if (playing) pause(); else play(); return; }
  pause();
  if (ctl === 'next') show(stepI + 1);
  else if (ctl === 'prev') show(stepI - 1);
  else if (ctl === 'restart') show(-1);
});
$('fpSpeed').addEventListener('change', function(){ fpSpeed = Number(this.value) || 1; });
$('fpDia').addEventListener('click', function(e){
  var n = e.target.closest('.fp-node');
  if (!n) return;
  var i = stepOfNode(n.getAttribute('data-node'));
  if (i > -1){ pause(); show(i); }
});

window.addEventListener('resize', function(){
  moveThumb();
  if (view === 'plan') queueDraw();
});

renderPicker();
selectFlow(FLOWS[0].id);   /* paints the caption; skips the draw, since the view is still hidden */
renderAll();
moveThumb();
/* a late font changes every box's width, so the arrows have to be re-measured */
function settle(){ moveThumb(); if (view === 'plan') drawEdges(); }
if (document.fonts && document.fonts.ready) document.fonts.ready.then(settle);
setTimeout(settle, 300);
</script>
</body>
</html>
