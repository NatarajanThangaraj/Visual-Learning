<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LifeCare Hospital – Java String Adventure</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap');

  :root {
    --white: #FFFFFF;
    --bg: #F0F6FF;
    --blue-50: #EBF4FF;
    --blue-100: #C3DFFE;
    --blue-200: #93C5FD;
    --blue-400: #3B82F6;
    --blue-500: #2563EB;
    --blue-600: #1D4ED8;
    --green-50: #ECFDF5;
    --green-100: #D1FAE5;
    --green-400: #34D399;
    --green-500: #10B981;
    --green-600: #059669;
    --teal: #0EA5E9;
    --slate-100: #F1F5F9;
    --slate-200: #E2E8F0;
    --slate-300: #CBD5E1;
    --slate-400: #94A3B8;
    --slate-500: #64748B;
    --slate-600: #475569;
    --slate-700: #334155;
    --slate-800: #1E293B;
    --slate-900: #0F172A;
    --amber-400: #FBBF24;
    --amber-500: #F59E0B;
    --red-400: #F87171;
    --red-500: #EF4444;
    --purple-400: #A78BFA;
    --purple-500: #8B5CF6;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Inter', sans-serif;
    background: var(--bg);
    color: var(--slate-800);
    min-height: 100vh;
    overflow-x: hidden;
  }

  /* ── TOP NAV ── */
  .topbar {
    background: var(--white);
    border-bottom: 1px solid var(--slate-200);
    padding: 0 24px;
    height: 60px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    position: sticky;
    top: 0;
    z-index: 100;
    box-shadow: 0 1px 3px rgba(0,0,0,.06);
  }
  .logo {
    display: flex;
    align-items: center;
    gap: 10px;
    font-weight: 700;
    font-size: 17px;
    color: var(--blue-600);
  }
  .logo-icon {
    width: 32px; height: 32px;
    background: linear-gradient(135deg, var(--blue-500), var(--teal));
    border-radius: 8px;
    display: flex;
    align-items: center;
    justify-content: center;
    color: white;
    font-size: 16px;
  }
  .logo span { color: var(--slate-500); font-weight: 400; font-size: 13px; margin-left: 4px; }
  .score-badge {
    display: flex;
    align-items: center;
    gap: 6px;
    background: var(--blue-50);
    border: 1px solid var(--blue-100);
    border-radius: 20px;
    padding: 4px 14px;
    font-size: 13px;
    font-weight: 600;
    color: var(--blue-600);
  }

  /* ── MAIN LAYOUT ── */
  .main-layout {
    display: flex;
    min-height: calc(100vh - 60px);
  }

  /* ── SIDEBAR ── */
  .sidebar {
    width: 240px;
    background: var(--white);
    border-right: 1px solid var(--slate-200);
    padding: 20px 0;
    position: sticky;
    top: 60px;
    height: calc(100vh - 60px);
    overflow-y: auto;
    flex-shrink: 0;
  }
  .sidebar-title {
    font-size: 11px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: .08em;
    color: var(--slate-400);
    padding: 0 20px 10px;
  }
  .dept-item {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 9px 20px;
    cursor: pointer;
    transition: background .15s;
    border-left: 3px solid transparent;
  }
  .dept-item.active {
    background: var(--blue-50);
    border-left-color: var(--blue-500);
  }
  .dept-item.completed {
    opacity: .7;
  }
  .dept-item.locked {
    opacity: .35;
    cursor: default;
  }
  .dept-icon {
    width: 28px; height: 28px;
    border-radius: 7px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 14px;
    flex-shrink: 0;
  }
  .dept-icon.done { background: var(--green-100); }
  .dept-icon.active-icon { background: var(--blue-100); }
  .dept-icon.pending { background: var(--slate-100); }
  .dept-name { font-size: 12.5px; font-weight: 500; color: var(--slate-700); line-height: 1.3; }
  .dept-method {
    font-size: 10px;
    font-family: 'JetBrains Mono', monospace;
    color: var(--green-600);
    font-weight: 600;
    margin-top: 1px;
  }
  .check-icon { color: var(--green-500); font-size: 12px; margin-left: auto; }

  /* ── CONTENT AREA ── */
  .content {
    flex: 1;
    padding: 32px;
    max-width: 860px;
    margin: 0 auto;
    width: 100%;
  }

  /* ── DEPARTMENT HEADER ── */
  .dept-header {
    background: linear-gradient(135deg, var(--blue-500) 0%, var(--teal) 100%);
    border-radius: 16px;
    padding: 24px 28px;
    color: white;
    margin-bottom: 24px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    box-shadow: 0 4px 20px rgba(37,99,235,.25);
  }
  .dept-header-left h1 { font-size: 22px; font-weight: 700; margin-bottom: 4px; }
  .dept-header-left p { font-size: 13px; opacity: .85; }
  .dept-header-right {
    font-size: 42px;
    opacity: .9;
  }
  .step-indicator {
    display: flex;
    gap: 6px;
    margin-bottom: 20px;
    align-items: center;
  }
  .step-dot {
    width: 8px; height: 8px;
    border-radius: 50%;
    background: var(--slate-300);
    transition: all .3s;
  }
  .step-dot.active { background: var(--blue-500); width: 20px; border-radius: 4px; }
  .step-dot.done { background: var(--green-500); }

  /* ── CHAT BUBBLES ── */
  .chat-area {
    display: flex;
    flex-direction: column;
    gap: 16px;
    margin-bottom: 24px;
  }
  .bubble-wrap {
    display: flex;
    gap: 12px;
    animation: slideIn .35s ease;
  }
  .bubble-wrap.right { flex-direction: row-reverse; }
  @keyframes slideIn {
    from { opacity: 0; transform: translateY(12px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .avatar {
    width: 38px; height: 38px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 18px;
    flex-shrink: 0;
    box-shadow: 0 2px 8px rgba(0,0,0,.12);
  }
  .avatar.staff { background: linear-gradient(135deg, #3B82F6, #0EA5E9); }
  .avatar.student { background: linear-gradient(135deg, #10B981, #059669); }
  .bubble {
    max-width: 78%;
    padding: 13px 16px;
    border-radius: 16px;
    font-size: 14.5px;
    line-height: 1.6;
    position: relative;
  }
  .bubble.staff {
    background: var(--white);
    border: 1px solid var(--slate-200);
    border-top-left-radius: 4px;
    box-shadow: 0 2px 8px rgba(0,0,0,.05);
  }
  .bubble.student {
    background: linear-gradient(135deg, var(--blue-500), var(--blue-600));
    color: white;
    border-top-right-radius: 4px;
  }
  .bubble.hint {
    background: linear-gradient(135deg, #FEF3C7, #FDE68A);
    border: 1px solid var(--amber-400);
    font-size: 13.5px;
  }
  .bubble.success {
    background: linear-gradient(135deg, var(--green-50), var(--green-100));
    border: 1px solid var(--green-400);
  }
  .bubble.code-reveal {
    background: var(--slate-800);
    color: #E2E8F0;
    font-family: 'JetBrains Mono', monospace;
    font-size: 13px;
    border: none;
    max-width: 100%;
  }
  .speaker-name {
    font-size: 11px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: .06em;
    margin-bottom: 5px;
  }
  .bubble.staff .speaker-name { color: var(--blue-500); }
  .bubble.student .speaker-name { color: rgba(255,255,255,.7); }
  .bubble.hint .speaker-name { color: var(--amber-500); }
  .bubble.success .speaker-name { color: var(--green-600); }

  /* ── DATA ANIMATION ── */
  .transform-box {
    background: var(--white);
    border: 1px solid var(--slate-200);
    border-radius: 14px;
    padding: 20px 24px;
    margin: 8px 0;
    box-shadow: 0 2px 12px rgba(0,0,0,.05);
  }
  .transform-label {
    font-size: 11px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: .08em;
    color: var(--slate-400);
    margin-bottom: 10px;
  }
  .transform-row {
    display: flex;
    align-items: center;
    gap: 16px;
    flex-wrap: wrap;
  }
  .data-pill {
    background: var(--slate-800);
    color: #93C5FD;
    font-family: 'JetBrains Mono', monospace;
    font-size: 14px;
    padding: 8px 16px;
    border-radius: 8px;
    font-weight: 500;
    white-space: pre;
  }
  .data-pill.before { border: 2px solid var(--red-400); }
  .data-pill.after {
    border: 2px solid var(--green-400);
    color: #86EFAC;
    animation: glow .6s ease;
  }
  @keyframes glow {
    0% { box-shadow: 0 0 0 0 rgba(52,211,153,.5); }
    50% { box-shadow: 0 0 0 8px rgba(52,211,153,0); }
  }
  .arrow-label {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 3px;
  }
  .arrow-text {
    font-size: 10px;
    font-weight: 600;
    color: var(--blue-500);
    white-space: nowrap;
  }
  .method-tag {
    background: var(--blue-500);
    color: white;
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    font-weight: 600;
    padding: 3px 10px;
    border-radius: 20px;
    white-space: nowrap;
  }

  /* ── CODE BLOCK ── */
  .code-block {
    background: var(--slate-900);
    border-radius: 12px;
    padding: 18px 20px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 13px;
    line-height: 1.7;
    color: #CBD5E1;
    margin: 8px 0;
    overflow-x: auto;
    animation: slideIn .4s ease;
  }
  .code-keyword { color: #93C5FD; }
  .code-string { color: #86EFAC; }
  .code-method { color: #FCD34D; }
  .code-comment { color: #64748B; font-style: italic; }
  .code-type { color: #F9A8D4; }
  .code-output { color: #A78BFA; }

  /* ── CHOICE BUTTONS ── */
  .choices {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    margin-top: 8px;
  }
  .choice-btn {
    padding: 10px 20px;
    border-radius: 10px;
    font-size: 14px;
    font-weight: 500;
    cursor: pointer;
    transition: all .2s;
    border: 2px solid var(--blue-200);
    background: var(--blue-50);
    color: var(--blue-700, #1D4ED8);
    font-family: 'Inter', sans-serif;
  }
  .choice-btn:hover {
    background: var(--blue-500);
    color: white;
    border-color: var(--blue-500);
    transform: translateY(-1px);
    box-shadow: 0 4px 12px rgba(37,99,235,.2);
  }
  .choice-btn.selected {
    background: var(--blue-500);
    color: white;
    border-color: var(--blue-500);
  }

  /* ── TEXT INPUT ── */
  .input-area {
    display: flex;
    gap: 10px;
    margin-top: 8px;
  }
  .text-input {
    flex: 1;
    padding: 11px 16px;
    border: 2px solid var(--slate-200);
    border-radius: 10px;
    font-size: 14px;
    font-family: 'Inter', sans-serif;
    outline: none;
    transition: border-color .2s;
    background: var(--white);
  }
  .text-input:focus { border-color: var(--blue-400); }
  .send-btn {
    padding: 11px 20px;
    background: var(--blue-500);
    color: white;
    border: none;
    border-radius: 10px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    transition: all .2s;
    font-family: 'Inter', sans-serif;
  }
  .send-btn:hover { background: var(--blue-600); transform: translateY(-1px); }

  /* ── NEXT BUTTON ── */
  .next-btn {
    padding: 13px 28px;
    background: linear-gradient(135deg, var(--green-500), var(--green-600));
    color: white;
    border: none;
    border-radius: 12px;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    transition: all .2s;
    display: flex;
    align-items: center;
    gap: 8px;
    font-family: 'Inter', sans-serif;
    box-shadow: 0 4px 14px rgba(16,185,129,.3);
    animation: slideIn .5s ease;
  }
  .next-btn:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(16,185,129,.35); }

  /* ── COMPLETE BADGE ── */
  .method-complete {
    background: linear-gradient(135deg, var(--green-50), var(--green-100));
    border: 2px solid var(--green-400);
    border-radius: 14px;
    padding: 16px 20px;
    display: flex;
    align-items: center;
    gap: 14px;
    animation: slideIn .4s ease;
  }
  .method-badge {
    background: var(--green-500);
    color: white;
    font-family: 'JetBrains Mono', monospace;
    font-size: 14px;
    font-weight: 700;
    padding: 8px 16px;
    border-radius: 8px;
    white-space: nowrap;
  }
  .method-badge-text h3 { font-size: 14px; font-weight: 600; color: var(--green-700, #047857); }
  .method-badge-text p { font-size: 12.5px; color: var(--green-600); margin-top: 2px; }

  /* ── DASHBOARD ── */
  .dashboard {
    padding: 8px;
  }
  .dashboard-header {
    text-align: center;
    margin-bottom: 32px;
  }
  .dashboard-header h1 { font-size: 28px; font-weight: 800; color: var(--slate-800); margin-bottom: 8px; }
  .dashboard-header p { color: var(--slate-500); font-size: 15px; }
  .dept-cards {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
    gap: 16px;
  }
  .dept-card {
    background: var(--white);
    border: 1px solid var(--slate-200);
    border-radius: 14px;
    padding: 18px 20px;
    transition: all .2s;
    cursor: pointer;
  }
  .dept-card:hover { box-shadow: 0 4px 16px rgba(0,0,0,.08); transform: translateY(-2px); }
  .dept-card.done-card { border-color: var(--green-400); background: var(--green-50); }
  .dept-card .card-icon { font-size: 28px; margin-bottom: 10px; }
  .dept-card h3 { font-size: 14px; font-weight: 600; margin-bottom: 4px; }
  .dept-card .card-method {
    display: inline-block;
    background: var(--slate-800);
    color: var(--green-400);
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    font-weight: 600;
    padding: 3px 10px;
    border-radius: 6px;
    margin-top: 6px;
  }
  .dept-card .card-status { font-size: 12px; color: var(--slate-400); margin-top: 6px; }
  .dept-card.done-card .card-status { color: var(--green-600); }
  .final-score {
    background: linear-gradient(135deg, var(--blue-500), var(--teal));
    color: white;
    border-radius: 16px;
    padding: 28px;
    text-align: center;
    margin-bottom: 28px;
    box-shadow: 0 8px 30px rgba(37,99,235,.25);
  }
  .final-score h2 { font-size: 24px; font-weight: 800; margin-bottom: 6px; }
  .score-num { font-size: 60px; font-weight: 800; line-height: 1; margin: 12px 0; }
  .score-label { font-size: 14px; opacity: .85; }

  /* ── WELCOME SCREEN ── */
  .welcome {
    max-width: 640px;
    margin: 0 auto;
    padding: 20px 0;
    text-align: center;
  }
  .welcome-icon { font-size: 64px; margin-bottom: 16px; }
  .welcome h1 { font-size: 32px; font-weight: 800; color: var(--slate-800); margin-bottom: 12px; line-height: 1.2; }
  .welcome h1 span { color: var(--blue-500); }
  .welcome p { font-size: 16px; color: var(--slate-500); line-height: 1.7; margin-bottom: 28px; }
  .welcome-cards {
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
    gap: 14px;
    margin-bottom: 32px;
    text-align: left;
  }
  .welcome-card {
    background: var(--white);
    border: 1px solid var(--slate-200);
    border-radius: 12px;
    padding: 16px;
  }
  .welcome-card .wc-icon { font-size: 22px; margin-bottom: 8px; }
  .welcome-card h4 { font-size: 13px; font-weight: 600; margin-bottom: 4px; }
  .welcome-card p { font-size: 12px; color: var(--slate-500); }
  .start-btn {
    padding: 15px 36px;
    background: linear-gradient(135deg, var(--blue-500), var(--teal));
    color: white;
    border: none;
    border-radius: 14px;
    font-size: 16px;
    font-weight: 700;
    cursor: pointer;
    transition: all .2s;
    font-family: 'Inter', sans-serif;
    box-shadow: 0 6px 24px rgba(37,99,235,.3);
  }
  .start-btn:hover { transform: translateY(-2px); box-shadow: 0 10px 30px rgba(37,99,235,.35); }

  /* Scrollbar */
  ::-webkit-scrollbar { width: 6px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--slate-300); border-radius: 3px; }

  @media (max-width: 768px) {
    .sidebar { display: none; }
    .content { padding: 16px; }
    .welcome-cards { grid-template-columns: 1fr; }
    .bubble { max-width: 90%; }
  }
</style>
</head>
<body>

<div class="topbar">
  <div class="logo">
    <div class="logo-icon">🏥</div>
    LifeCare Hospital
    <span>Java String Adventure</span>
  </div>
  <div class="score-badge">⭐ <span id="scoreDisplay">0</span> pts</div>
</div>

<div class="main-layout">
  <aside class="sidebar" id="sidebar"></aside>
  <main class="content" id="mainContent"></main>
</div>

<script>
// ═══════════════════════════════════════════════════════════════
// DATA: All 10 Departments
// ═══════════════════════════════════════════════════════════════
const departments = [
  {
    id: 0, icon: "🪪", name: "Registration Counter", method: "trim()",
    tagline: "Cleaning Patient Names on Entry",
    scenario: {
      before: '"   Rahul Kumar   "',
      after: '"Rahul Kumar"',
      methodCall: 'name.trim()',
      javaExample: `String name = "   Rahul Kumar   ";
String cleaned = name.<span class="code-method">trim</span>();
<span class="code-comment">// cleaned = "Rahul Kumar"</span>`,
    },
    steps: [
      {
        type: "scene",
        text: `Good morning, Junior Engineer! Welcome to <strong>LifeCare Hospital</strong>. You've just joined our software team. 🎉<br><br>Your first task: the <strong>Registration Counter</strong>. Patients type their name when they check in at our kiosk.`,
        character: "👩‍⚕️ Nurse Priya"
      },
      {
        type: "scene",
        text: `A patient just typed their name: <code>"   Rahul Kumar   "</code><br><br>Should we save this directly to the hospital database?`,
        character: "👩‍⚕️ Nurse Priya",
        question: true,
        choices: ["Yes, save as-is", "No, something seems wrong"],
        correct: 1,
        wrongResponse: `Hmm, think about this: if another patient types <code>"Rahul Kumar"</code> (no spaces), the system would treat them as two different people. Could that cause a problem? 🤔`,
        wrongChoices: ["Oh no, duplicate records!", "I still think it's fine"]
      },
      {
        type: "scene",
        text: `Exactly! Those extra spaces at the start and end could cause <strong>duplicate records</strong>. "Rahul Kumar" and "&nbsp;&nbsp;&nbsp;Rahul Kumar&nbsp;&nbsp;&nbsp;" would be treated as different patients. Medical history could be split across records — that's dangerous! 🚨<br><br>Before saving, our software must remove those extra spaces. What would you call this operation?`,
        character: "👩‍⚕️ Nurse Priya",
        question: true,
        inputPrompt: "What should the software do with the spaces?",
        hint: "Think about cleaning up a string — removing extra space from both ends..."
      },
      {
        type: "reveal",
        text: `Perfect thinking! Java gives us exactly this: <strong>trim()</strong> — it strips all leading and trailing whitespace from a string. The hospital database now only sees clean, consistent patient names.`,
        character: "💡 Java Mentor"
      }
    ]
  },
  {
    id: 1, icon: "📧", name: "Email Registration", method: "toLowerCase()",
    tagline: "Standardizing Patient Email Addresses",
    scenario: {
      before: '"Rahul.Kumar@GMAIL.COM"',
      after: '"rahul.kumar@gmail.com"',
      methodCall: 'email.toLowerCase()',
      javaExample: `String email = "Rahul.Kumar@GMAIL.COM";
String std = email.<span class="code-method">toLowerCase</span>();
<span class="code-comment">// std = "rahul.kumar@gmail.com"</span>`,
    },
    steps: [
      {
        type: "scene",
        text: `Great job at the counter! Now the Registration team needs your help again. Patients are registering their emails — but look at these two entries from our database:<br><br>• <code>Rahul.Kumar@GMAIL.COM</code><br>• <code>rahul.kumar@gmail.com</code><br><br>Are these the same person?`,
        character: "👨‍💼 Dr. Admin",
        question: true,
        choices: ["Yes, same person", "No, different people"],
        correct: 0,
        wrongResponse: `Look carefully at the characters — only the case differs. Email addresses are case-insensitive. GMAIL.COM and gmail.com refer to the same domain. So these are definitely the same person — but our database disagrees! Why is that a problem?`,
        wrongChoices: ["Oh! Case-insensitive means same person", "I'm still not sure"]
      },
      {

// STATE
// ═══════════════════════════════════════════════════════════════
let state = {
  screen: 'welcome',   // 'welcome' | 'game' | 'dashboard'
  currentDept: 0,
  currentStep: 0,
  completedDepts: [],
  score: 0,
  chatHistory: [],     // [{role, text, type}]
  awaitingInput: null, // 'choices' | 'text' | null
  wrongAttempts: 0,
  subStep: 0,          // for multi-part wrong handling
  deptPhase: 'dialogue', // 'dialogue' | 'animation' | 'code' | 'done'
  hintsUsed: 0,
};

function save() {
  try { localStorage.setItem('lch_state', JSON.stringify(state)); } catch(e){}
}
function load() {
  try {
    const s = localStorage.getItem('lch_state');
    if (s) state = JSON.parse(s);
  } catch(e){}
}

// ═══════════════════════════════════════════════════════════════
// RENDER ENGINE
// ═══════════════════════════════════════════════════════════════
function render() {
  document.getElementById('scoreDisplay').textContent = state.score;
  renderSidebar();
  if (state.screen === 'welcome') renderWelcome();
  else if (state.screen === 'game') renderGame();
  else if (state.screen === 'dashboard') renderDashboard();
}

function renderSidebar() {
  const sidebar = document.getElementById('sidebar');
  let html = `<div class="sidebar-title">Departments</div>`;
  departments.forEach((dept, i) => {
    const done = state.completedDepts.includes(i);
    const active = state.screen === 'game' && state.currentDept === i;
    const locked = i > (state.completedDepts.length);
    const cls = done ? 'completed' : active ? 'active' : locked ? 'locked' : '';
    const iconCls = done ? 'done' : active ? 'active-icon' : 'pending';
    html += `
      <div class="dept-item ${cls}" onclick="${locked ? '' : `goToDept(${i})`}">
        <div class="dept-icon ${iconCls}">${dept.icon}</div>
        <div>
          <div class="dept-name">${dept.name}</div>
          ${done ? `<div class="dept-method">${dept.method}</div>` : ''}
        </div>
        ${done ? '<span class="check-icon">✓</span>' : ''}
      </div>`;
  });
  html += `<div style="padding: 16px 20px; margin-top: 8px; border-top: 1px solid var(--slate-100);">
    <div class="dept-item" onclick="renderDashboard(); state.screen='dashboard'; renderSidebar();">
      <div class="dept-icon pending">📊</div>
      <div class="dept-name">View Dashboard</div>
    </div>
  </div>`;
  sidebar.innerHTML = html;
}

function goToDept(i) {
  if (i > state.completedDepts.length && !state.completedDepts.includes(i)) return;
  state.currentDept = i;
  state.currentStep = 0;
  state.chatHistory = [];
  state.awaitingInput = null;
  state.wrongAttempts = 0;
  state.subStep = 0;
  state.deptPhase = 'dialogue';
  state.screen = 'game';
  renderGame();
  save();
}

function startGame() {
  state.screen = 'game';
  state.currentDept = 0;
  state.currentStep = 0;
  state.chatHistory = [];
  state.awaitingInput = null;
  state.deptPhase = 'dialogue';
  renderGame();
  save();
}

// ═══════════════════════════════════════════════════════════════
// GAME SCREEN
// ═══════════════════════════════════════════════════════════════
function renderGame() {
  const dept = departments[state.currentDept];
  const totalSteps = dept.steps.length + 2; // +animation +code
  const progress = state.deptPhase === 'done' ? totalSteps : state.currentStep + 1;

  let dotsHtml = '';
  for (let i = 0; i < totalSteps; i++) {
    const cls = i < progress - 1 ? 'done' : i === progress - 1 ? 'active' : '';
    dotsHtml += `<div class="step-dot ${cls}"></div>`;
  }

  let chatHtml = '';
  state.chatHistory.forEach(msg => {
    chatHtml += renderBubble(msg);
  });

  let inputHtml = '';
  if (state.awaitingInput === 'choices' && state.pendingChoices) {
    state.pendingChoices.forEach((c, i) => {
      inputHtml += `<button class="choice-btn" onclick="handleChoice(${i})">${c}</button>`;
    });
    inputHtml = `<div class="choices">${inputHtml}</div>`;
  } else if (state.awaitingInput === 'text') {
    inputHtml = `<div class="input-area">
      <input class="text-input" id="textInput" placeholder="${state.pendingPrompt || 'Type your answer...'}" 
        onkeydown="if(event.key==='Enter')submitText()">
      <button class="send-btn" onclick="submitText()">Send →</button>
    </div>`;
  } else if (state.awaitingInput === 'hint') {
    inputHtml = `<div class="choices">
      <button class="choice-btn" onclick="useHint()">💡 Give me a hint</button>
      <button class="choice-btn" onclick="showInput()">I think I know it!</button>
    </div>`;
  }

  let nextHtml = '';
  if (state.deptPhase === 'done') {
    const isLast = state.currentDept === departments.length - 1;
    nextHtml = `<button class="next-btn" onclick="${isLast ? 'renderDashboard()' : 'nextDept()'}">
      ${isLast ? '🎉 View Final Dashboard' : `Next: ${departments[state.currentDept + 1]?.name} →`}
    </button>`;
  }

  document.getElementById('mainContent').innerHTML = `
    <div class="dept-header">
      <div class="dept-header-left">
        <h1>${dept.icon} ${dept.name}</h1>
        <p>${dept.tagline}</p>
      </div>
      <div class="dept-header-right">${dept.icon}</div>
    </div>
    <div class="step-indicator">${dotsHtml}</div>
    <div class="chat-area" id="chatArea">${chatHtml}</div>
    <div id="inputArea">${inputHtml}</div>
    <div id="nextArea" style="margin-top:16px">${nextHtml}</div>`;

  // Auto-scroll
  setTimeout(() => {
    const ca = document.getElementById('chatArea');
    if (ca) ca.scrollTop = ca.scrollHeight;
    const ti = document.getElementById('textInput');
    if (ti) ti.focus();
  }, 100);

  // If no chat yet, start the dialogue
  if (state.chatHistory.length === 0 && state.deptPhase === 'dialogue') {
    setTimeout(() => advanceDialogue(), 300);
  }
}

function renderBubble(msg) {
  if (msg.type === 'transform') return renderTransform();
  if (msg.type === 'code') return renderCode();

  const isRight = msg.role === 'student';
  const avatarClass = isRight ? 'student' : 'staff';
  const avatar = isRight ? '👤' : msg.avatar || '👩‍⚕️';
  const bubbleClass = msg.bubbleClass || (isRight ? 'student' : 'staff');

  return `<div class="bubble-wrap ${isRight ? 'right' : ''}">
    <div class="avatar ${avatarClass}">${avatar}</div>
    <div class="bubble ${bubbleClass}">
      ${msg.speaker ? `<div class="speaker-name">${msg.speaker}</div>` : ''}
      ${msg.text}
    </div>
  </div>`;
}

function renderTransform() {
  const dept = departments[state.currentDept];
  const s = dept.scenario;
  return `<div class="transform-box">
    <div class="transform-label">🔄 Data Transformation</div>
    <div class="transform-row">
      <div>
        <div style="font-size:11px;color:var(--red-500);font-weight:600;margin-bottom:4px">BEFORE</div>
        <div class="data-pill before">${s.before}</div>
      </div>
      <div class="arrow-label">
        <div class="arrow-text">Hospital Software</div>
        <div style="font-size:22px">↓</div>
        <div class="method-tag">${s.methodCall}</div>
      </div>
      <div>
        <div style="font-size:11px;color:var(--green-500);font-weight:600;margin-bottom:4px">AFTER</div>
        <div class="data-pill after">${s.after}</div>
      </div>
    </div>
  </div>`;
}

function renderCode() {
  const dept = departments[state.currentDept];
  return `<div style="width:100%">
    <div class="method-complete">
      <div class="method-badge">.${dept.method}</div>
      <div class="method-badge-text">
        <h3>String.${dept.method} unlocked!</h3>
        <p>${dept.tagline}</p>
      </div>
    </div>
    <div class="code-block" style="margin-top:12px">
      <div style="color:var(--slate-400);font-size:11px;margin-bottom:8px">// Java Example — ${dept.name}</div>
      ${dept.scenario.javaExample}
    </div>
  </div>`;
}

// ═══════════════════════════════════════════════════════════════
// DIALOGUE ENGINE
// ═══════════════════════════════════════════════════════════════
function advanceDialogue() {
  const dept = departments[state.currentDept];
  const step = dept.steps[state.currentStep];
  if (!step) {
    showTransformAnimation();
    return;
  }

  // Push staff message
  state.chatHistory.push({
    role: 'staff',
    avatar: step.character ? step.character.split(' ')[0] : '👩‍⚕️',
    speaker: step.character,
    text: step.text,
    bubbleClass: 'staff'
  });

  if (step.question) {
    if (step.choices) {
      state.awaitingInput = 'choices';
      state.pendingChoices = step.choices;
      state.pendingStep = state.currentStep;
    } else if (step.inputPrompt) {
      state.awaitingInput = 'hint';
      state.pendingPrompt = step.inputPrompt;
      state.pendingHint = step.hint;
    }
  } else {
    state.currentStep++;
    setTimeout(() => {
      updateChat();
      setTimeout(() => advanceDialogue(), 600);
    }, 400);
  }

  updateChat();
}

function handleChoice(i) {
  const dept = departments[state.currentDept];
  const step = dept.steps[state.pendingStep];
  const isCorrect = i === step.correct;

  // Student bubble
  state.chatHistory.push({
    role: 'student',
    text: step.choices[i],
    bubbleClass: 'student',
    speaker: 'You'
  });

  state.awaitingInput = null;
  state.pendingChoices = null;

  if (isCorrect) {
    state.score += Math.max(10 - state.wrongAttempts * 3, 3);
    state.wrongAttempts = 0;
    state.currentStep++;
    updateChat();
    setTimeout(() => advanceDialogue(), 700);
  } else {
    state.wrongAttempts++;
    // Push hint
    state.chatHistory.push({
      role: 'staff',
      avatar: '💭',
      speaker: step.character,
      text: step.wrongResponse,
      bubbleClass: 'hint'
    });
    // Show follow-up choices
    state.awaitingInput = 'choices';
    state.pendingChoices = step.wrongChoices || step.choices;
    state.pendingStep = state.pendingStep; // same step, different choices
    if (step.wrongChoices) {
      // replace correct with index 0
      dept.steps[state.pendingStep] = {...step, choices: step.wrongChoices, correct: 0, wrongChoices: null, wrongResponse: null};
    }
    updateChat();
  }
}

function useHint() {
  const step = departments[state.currentDept].steps[state.currentStep];
  state.score = Math.max(0, state.score - 1);
  state.hintsUsed++;
  state.chatHistory.push({
    role: 'staff',
    avatar: '💡',
    speaker: '💡 Hint',
    text: state.pendingHint || step?.hint || 'Think about what operation makes sense here...',
    bubbleClass: 'hint'
  });
  state.awaitingInput = 'text';
  updateChat();
}

function showInput() {
  state.awaitingInput = 'text';
  updateChat();
}

function submitText() {
  const input = document.getElementById('textInput');
  if (!input || !input.value.trim()) return;
  const val = input.value.trim();

  state.chatHistory.push({
    role: 'student',
    text: val,
    bubbleClass: 'student',
    speaker: 'You'
  });

  const dept = departments[state.currentDept];
  const method = dept.method.replace('()', '').toLowerCase();
  const answer = val.toLowerCase().replace(/[^a-z]/g, '');

  const isRight = answer.includes(method) ||
    answer.includes('trim') && method === 'trim' ||
    answer.includes('tolower') && method === 'tolowercase' ||
    answer.includes('lower') && method === 'tolowercase' ||
    answer.includes('upper') && method === 'touppercase' ||
    answer.includes('toupper') && method === 'touppercase' ||
    answer.includes('contain') && method === 'contains' ||
    answer.includes('replac') && method === 'replace' ||
    answer.includes('split') && method === 'split' ||
    answer.includes('start') && method === 'startswith' ||
    answer.includes('equal') && method === 'equals' ||
    answer.includes('substr') && method === 'substring' ||
    answer.includes('length') && method === 'length' ||
    answer.includes('len') && method === 'length' ||
    answer.includes('count') && method === 'length' ||
    answer.includes('size') && method === 'length' ||
    answer.includes('clean') && method === 'trim' ||
    answer.includes('remov') && method === 'trim';

  state.awaitingInput = null;

  if (isRight) {
    state.score += Math.max(15 - state.wrongAttempts * 3, 5);
    state.wrongAttempts = 0;
    state.currentStep++;
    updateChat();
    setTimeout(() => advanceDialogue(), 500);
  } else {
    state.wrongAttempts++;
    state.chatHistory.push({
      role: 'staff',
      avatar: '💭',
      speaker: '🤔 Keep thinking',
      text: `Close! Think about the exact Java method name. ${state.pendingHint || 'What single word describes this operation?'}`,
      bubbleClass: 'hint'
    });
    state.awaitingInput = 'text';
    updateChat();
  }
}

function showTransformAnimation() {
  state.deptPhase = 'animation';
  state.chatHistory.push({ type: 'transform' });
  updateChat();
  setTimeout(() => showCodeReveal(), 1200);
}

function showCodeReveal() {
  state.deptPhase = 'code';
  state.chatHistory.push({ type: 'code' });

  const dept = departments[state.currentDept];
  state.chatHistory.push({
    role: 'staff',
    avatar: '✅',
    speaker: '✅ Module Complete',
    text: `<strong>${dept.name}</strong> module complete! You've learned how <code>${dept.method}</code> solves a real hospital problem. Moving to the next department will unlock when you're ready.`,
    bubbleClass: 'success'
  });

  // Mark complete
  if (!state.completedDepts.includes(state.currentDept)) {
    state.completedDepts.push(state.currentDept);
    state.score += 20;
  }
  state.deptPhase = 'done';
  updateChat();
  save();
}

function nextDept() {
  const next = state.currentDept + 1;
  if (next < departments.length) {
    goToDept(next);
  } else {
    renderDashboard();
  }
}

function updateChat() {
  renderGame();
}

// ═══════════════════════════════════════════════════════════════
// DASHBOARD
// ═══════════════════════════════════════════════════════════════
function renderDashboard() {
  state.screen = 'dashboard';
  const total = departments.length;
  const done = state.completedDepts.length;
  const pct = Math.round((done / total) * 100);

  let cardsHtml = departments.map(dept => {
    const isDone = state.completedDepts.includes(dept.id);
    return `<div class="dept-card ${isDone ? 'done-card' : ''}" onclick="goToDept(${dept.id})">
      <div class="card-icon">${dept.icon}</div>
      <h3>${dept.name}</h3>
      <div>${isDone ? `<span class="card-method">.${dept.method}</span>` : '<span style="font-size:12px;color:var(--slate-400)">Not started</span>'}</div>
      <div class="card-status">${isDone ? '✅ Completed' : dept.tagline}</div>
    </div>`;
  }).join('');

  document.getElementById('mainContent').innerHTML = `
    <div class="dashboard">
      ${done === total ? `
      <div class="final-score">
        <h2>🎉 LifeCare Hospital Software Complete!</h2>
        <div class="score-num">${state.score}</div>
        <div class="score-label">Total Points • ${done}/${total} Departments • Junior Engineer Badge Earned</div>
      </div>` : `
      <div class="dashboard-header">
        <h1>Hospital Dashboard</h1>
        <p>${done} of ${total} departments complete • ${pct}% through your training</p>
        <div style="background:var(--slate-200);border-radius:8px;height:8px;margin-top:16px;overflow:hidden">
          <div style="background:linear-gradient(90deg,var(--blue-500),var(--teal));height:100%;width:${pct}%;border-radius:8px;transition:width .8s ease"></div>
        </div>
      </div>`}
      <div class="dept-cards">${cardsHtml}</div>
      ${done > 0 ? `<div style="margin-top:24px;text-align:center">
        <button class="next-btn" style="margin:0 auto" onclick="continueGame()">
          ${done === total ? '🔄 Review Departments' : `Continue Training →`}
        </button>
      </div>` : ''}
    </div>`;

  renderSidebar();
}

function continueGame() {
  // Go to next incomplete department
  for (let i = 0; i < departments.length; i++) {
    if (!state.completedDepts.includes(i)) {
      goToDept(i);
      return;
    }
  }
  goToDept(0);
}

// ═══════════════════════════════════════════════════════════════
// INIT
// ═══════════════════════════════════════════════════════════════
load();
render();
</script>
</body>
