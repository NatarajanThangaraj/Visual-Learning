<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Java Interface Simulator</title>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg:       #0b1120;
  --surf1:    #111c2e;
  --surf2:    #172035;
  --surf3:    #1e2d48;
  --surf4:    #263654;
  --border:   #2a3f60;
  --border2:  #1e3050;
  --accent:   #3b82f6;
  --cyan:     #06b6d4;
  --purple:   #8b5cf6;
  --green:    #10b981;
  --amber:    #f59e0b;
  --red:      #ef4444;
  --text:     #e2e8f0;
  --text2:    #94a3b8;
  --text3:    #546a8a;
  --ref-col:  #8b5cf6;
  --obj-col:  #f59e0b;
  --iface-col:#06b6d4;
  --impl-col: #10b981;
  --mono: 'JetBrains Mono', 'Courier New', monospace;
  --ui: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;overflow:hidden}
body{background:var(--bg);color:var(--text);font-family:var(--ui);display:flex;flex-direction:column}

/* TOP BAR */
.topbar{
  height:44px;background:var(--surf1);border-bottom:1px solid var(--border2);
  display:flex;align-items:center;padding:0 16px;gap:12px;flex-shrink:0;
  justify-content:space-between;z-index:50;
}
.topbar-brand{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:700;letter-spacing:-.2px}
.topbar-logo{
  width:24px;height:24px;border-radius:5px;
  background:linear-gradient(135deg,var(--accent),var(--purple));
  display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:900;color:#fff
}
.topbar-controls{display:flex;align-items:center;gap:8px}
.view-toggle{
  display:flex;border:1px solid var(--border);border-radius:7px;overflow:hidden;
  background:var(--surf2);
}
.view-btn{
  padding:5px 14px;font-size:12px;font-weight:600;cursor:pointer;
  border:none;background:none;color:var(--text2);transition:all .15s;
}
.view-btn.active{background:var(--accent);color:#fff}

/* LAYOUT */
.app-body{display:flex;flex:1;overflow:hidden}

/* SIDEBAR */
.sidebar{
  width:200px;background:var(--surf1);border-right:1px solid var(--border2);
  flex-shrink:0;display:flex;flex-direction:column;overflow-y:auto;
}
.sidebar-section{padding:8px 0}
.sidebar-label{
  font-size:10px;font-weight:700;color:var(--text3);letter-spacing:.8px;
  text-transform:uppercase;padding:6px 14px 4px;
}
.nav-item{
  display:flex;align-items:center;gap:9px;padding:8px 14px;
  cursor:pointer;font-size:13px;color:var(--text2);
  border-left:2px solid transparent;transition:all .12s;border-radius:0;
}
.nav-item:hover{color:var(--text);background:var(--surf2)}
.nav-item.active{color:var(--accent);background:rgba(59,130,246,.08);border-left-color:var(--accent)}
.nav-icon{font-size:15px;width:18px;text-align:center}

/* MAIN */
.main{flex:1;display:flex;flex-direction:column;overflow:hidden;min-width:0}

/* SPLIT PANES — horizontal left/right */
.split-container{flex:1;display:flex;flex-direction:row;overflow:hidden}
.pane{flex:1;overflow-y:auto;min-height:0;position:relative;display:flex;flex-direction:column}
.pane-header{
  display:flex;align-items:center;justify-content:space-between;
  padding:8px 16px;background:var(--surf1);border-bottom:1px solid var(--border2);
  font-size:11px;font-weight:700;color:var(--text3);letter-spacing:.6px;text-transform:uppercase;
  flex-shrink:0;position:sticky;top:0;z-index:10;
}
.pane-body{flex:1;overflow-y:auto;min-height:0}
.pane-header-actions{display:flex;gap:6px}
.pane-divider{width:1px;background:var(--border);flex-shrink:0;position:relative}
.pane-divider-label{display:none}

/* JAVA PANE TABS */
.java-tab-row{
  display:flex;flex-shrink:0;border-bottom:1px solid var(--border2);background:var(--surf1);
}
.java-tab{
  padding:8px 18px;font-size:12px;font-weight:600;cursor:pointer;
  color:var(--text3);border-bottom:2px solid transparent;transition:all .12s;
}
.java-tab:hover{color:var(--text2)}
.java-tab.active{color:var(--accent);border-bottom-color:var(--accent);background:var(--surf2)}

/* CLASS MAP — floating attached panel */
.cm-panel{
  position:absolute;top:0;right:0;bottom:0;
  width:320px;
  background:var(--surf1);border-left:1px solid var(--border);
  display:flex;flex-direction:column;
  transform:translateX(100%);
  transition:transform .25s cubic-bezier(.4,0,.2,1);
  z-index:30;
}
.cm-panel.open{transform:translateX(0)}
.cm-panel-hdr{
  display:flex;align-items:center;justify-content:space-between;
  padding:10px 14px;border-bottom:1px solid var(--border2);flex-shrink:0;
  font-size:11px;font-weight:700;color:var(--text3);letter-spacing:.6px;text-transform:uppercase;
}
.cm-close{
  width:24px;height:24px;border-radius:5px;border:1px solid var(--border);
  background:var(--surf2);color:var(--text2);cursor:pointer;font-size:14px;
  display:flex;align-items:center;justify-content:center;transition:all .12s;
}
.cm-close:hover{border-color:var(--red);color:var(--red);background:rgba(239,68,68,.08)}
.cm-body{
  flex:1;overflow-y:auto;padding:20px 16px;
  display:flex;flex-direction:column;align-items:center;gap:0;
}
/* Class map diagram elements */
.cm-iface-node{
  padding:12px 20px;border-radius:8px;text-align:center;font-family:var(--mono);
  border:1.5px dashed rgba(6,182,212,.55);background:rgba(6,182,212,.07);
  color:var(--cyan);font-size:13px;font-weight:700;width:100%;max-width:240px;
}
.cm-iface-tag{font-size:9px;font-weight:700;color:rgba(6,182,212,.6);
  letter-spacing:1px;display:block;margin-bottom:4px}
.cm-iface-method{font-size:11px;color:rgba(6,182,212,.7);display:block;margin-top:4px}
.cm-stem{width:1px;height:18px;background:var(--border);margin:0 auto}
.cm-hbar{height:1px;background:var(--border);width:80%;margin:0 auto}
.cm-impls-row{
  display:flex;gap:8px;flex-wrap:wrap;justify-content:center;
  padding:0 8px;width:100%;
}
.cm-impl-node{
  flex:1;min-width:68px;max-width:100px;
  padding:10px 6px;border-radius:8px;font-family:var(--mono);font-size:10px;font-weight:600;
  border:1.5px solid rgba(16,185,129,.3);background:rgba(16,185,129,.06);
  color:var(--green);text-align:center;cursor:pointer;transition:all .22s;
  word-break:break-word;line-height:1.3;
}
.cm-impl-node:hover{border-color:rgba(16,185,129,.6);background:rgba(16,185,129,.1)}
.cm-impl-node.selected{
  border-color:rgba(245,158,11,.8);background:rgba(245,158,11,.1);color:var(--amber);
}
.cm-impl-node .cm-sel-dot{
  display:block;width:6px;height:6px;border-radius:50%;
  background:var(--amber);margin:5px auto 0;
}
.cm-state-box{
  width:100%;margin-top:16px;padding:12px 14px;
  border-radius:8px;background:var(--surf2);border:1px solid var(--border);
  font-size:11px;font-family:var(--mono);line-height:1.9;
}

/* USER VIEW STYLES - OS look */
.uv-screen{padding:20px 24px}
.os-panel{
  background:var(--surf2);border-radius:10px;overflow:hidden;
  max-width:520px;
}
.os-titlebar{
  background:var(--surf3);padding:10px 14px;display:flex;align-items:center;
  gap:8px;border-bottom:1px solid var(--border2);
}
.os-dots span{
  display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:5px;
}
.os-dots .d1{background:#ef4444}.os-dots .d2{background:#f59e0b}.os-dots .d3{background:#10b981}
.os-title{font-size:12px;font-weight:600;color:var(--text2);flex:1;text-align:center;margin-left:-28px}
.os-body{padding:20px}

/* Network list */
.net-list{display:flex;flex-direction:column;gap:2px;margin:12px 0}
.net-item{
  display:flex;align-items:center;justify-content:space-between;
  padding:10px 14px;border-radius:8px;cursor:pointer;
  background:transparent;border:1.5px solid transparent;transition:all .15s;
}
.net-item:hover{background:var(--surf3)}
.net-item.selected{background:rgba(59,130,246,.1);border-color:rgba(59,130,246,.4)}
.net-item-left{display:flex;align-items:center;gap:10px}
.net-radio{
  width:16px;height:16px;border-radius:50%;border:1.5px solid var(--text3);
  display:flex;align-items:center;justify-content:center;transition:all .15s;flex-shrink:0;
}
.net-item.selected .net-radio{border-color:var(--accent)}
.net-radio-dot{width:8px;height:8px;border-radius:50%;background:var(--accent);display:none}
.net-item.selected .net-radio-dot{display:block}
.net-name{font-size:13px;font-weight:600}
.net-sub{font-size:11px;color:var(--text3)}
.net-signal{display:flex;align-items:flex-end;gap:2px;height:16px}
.sig-bar{width:4px;border-radius:1px;background:var(--text3);transition:background .3s}
.sig-bar.lit{background:var(--green)}
.sig1{height:5px}.sig2{height:8px}.sig3{height:11px}.sig4{height:16px}

/* OS button */
.os-btn{
  padding:9px 20px;border-radius:7px;font-size:13px;font-weight:600;
  cursor:pointer;border:none;transition:all .15s;display:inline-flex;align-items:center;gap:6px;
}
.os-btn-primary{background:var(--accent);color:#fff}
.os-btn-primary:hover{background:#2563eb;transform:translateY(-1px)}
.os-btn-secondary{background:var(--surf3);color:var(--text);border:1px solid var(--border)}
.os-btn-secondary:hover{border-color:var(--accent)}
.os-btn-green{background:var(--green);color:#fff}
.os-btn-green:hover{background:#059669}
.os-status-bar{
  padding:10px 14px;border-top:1px solid var(--border2);
  display:flex;align-items:center;gap:8px;font-size:12px;
}
.status-dot{width:7px;height:7px;border-radius:50%;background:var(--text3);flex-shrink:0;transition:background .3s}
.status-dot.connected{background:var(--green);box-shadow:0 0 6px var(--green)}
.status-dot.error{background:var(--red)}

/* Printer dialog */
.doc-icon{
  width:44px;height:56px;background:var(--surf4);border-radius:4px;
  display:flex;flex-direction:column;align-items:center;justify-content:flex-end;
  padding:4px;position:relative;border:1px solid var(--border);margin-bottom:2px;
}
.doc-icon::before{
  content:'';position:absolute;top:0;right:0;width:12px;height:12px;
  background:var(--surf2);border-bottom-left-radius:4px;border:1px solid var(--border);
  border-top:none;border-right:none;
}
.doc-corner{position:absolute;top:0;right:0;width:0;height:0;
  border-left:12px solid var(--surf1);border-bottom:12px solid var(--surf4);}
.doc-lines{width:100%;padding:0 4px}
.doc-line{height:2px;background:var(--border);border-radius:1px;margin:2px 0}
.printer-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:12px 0}
.printer-opt{
  padding:12px;border-radius:8px;border:1.5px solid var(--border);
  background:var(--surf3);cursor:pointer;transition:all .15s;text-align:center;
}
.printer-opt:hover{border-color:rgba(59,130,246,.4)}
.printer-opt.selected{border-color:var(--accent);background:rgba(59,130,246,.1)}
.printer-opt .p-icon{font-size:22px;margin-bottom:4px}
.printer-opt .p-name{font-size:11px;font-weight:600;color:var(--text2)}
.printer-opt.selected .p-name{color:var(--accent)}
.print-progress{
  height:3px;background:var(--border);border-radius:2px;overflow:hidden;margin:8px 0;
}
.print-fill{height:100%;background:var(--green);width:0%;transition:width 1.4s ease;border-radius:2px}

/* Camera preview */
.cam-preview{
  width:100%;aspect-ratio:16/9;border-radius:10px;background:#050d1a;
  display:flex;align-items:center;justify-content:center;
  border:1.5px solid var(--border);position:relative;overflow:hidden;
  margin-bottom:12px;transition:border-color .3s;
}
.cam-preview.active{border-color:var(--cyan)}
.cam-icon-big{font-size:40px;opacity:.2;transition:opacity .3s}
.cam-preview.active .cam-icon-big{opacity:.7}
.cam-label-overlay{
  position:absolute;bottom:8px;left:10px;
  font-size:10px;font-weight:600;color:rgba(255,255,255,.5);font-family:var(--mono);
}
.cam-flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none;border-radius:8px}
.cam-flash.pop{animation:camFlash .25s}
@keyframes camFlash{0%{opacity:.7}100%{opacity:0}}
.cam-thumb{
  position:absolute;bottom:8px;right:8px;width:44px;height:32px;
  border-radius:4px;border:1.5px solid var(--cyan);background:var(--surf3);
  display:flex;align-items:center;justify-content:center;font-size:16px;
  opacity:0;transition:opacity .4s;
}

/* Notif channels */
.channel-row{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}
.channel-btn{
  display:flex;align-items:center;gap:7px;padding:10px 16px;
  border-radius:8px;border:1.5px solid var(--border);background:var(--surf3);
  cursor:pointer;font-size:13px;font-weight:600;color:var(--text2);transition:all .15s;
}
.channel-btn:hover{border-color:var(--cyan);color:var(--text)}
.channel-btn.selected{border-color:var(--cyan);background:rgba(6,182,212,.1);color:var(--cyan)}

/* Message bubble */
.msg-bubble{
  background:var(--surf3);border:1px solid var(--border);border-radius:12px;
  padding:12px 16px;font-size:13px;color:var(--text);line-height:1.5;
  position:relative;margin-bottom:12px;
}
.msg-bubble::after{
  content:'';position:absolute;bottom:-8px;left:20px;
  border:6px solid transparent;border-top-color:var(--border);
}
.notif-phone{
  width:120px;height:160px;border:2px solid var(--border);border-radius:18px;
  background:var(--surf2);display:flex;flex-direction:column;align-items:center;
  padding:10px 8px;position:relative;overflow:hidden;flex-shrink:0;
}
.notif-screen{flex:1;width:100%;background:#050d1a;border-radius:10px;
  display:flex;align-items:center;justify-content:center;padding:6px;overflow:hidden}
.notif-msg-small{font-size:8px;color:var(--text2);text-align:center;
  padding:6px;background:var(--surf3);border-radius:6px;opacity:0;
  transform:translateY(8px);transition:all .4s}
.notif-msg-small.pop{opacity:1;transform:translateY(0)}
.notif-channel-tag{font-size:7px;font-weight:700;color:var(--cyan);margin-bottom:4px}

/* Auth styles */
.auth-field{
  width:100%;background:var(--surf3);border:1px solid var(--border);
  border-radius:7px;padding:9px 12px;color:var(--text);font-size:13px;
  outline:none;font-family:var(--ui);margin-bottom:10px;
}
.auth-field:focus{border-color:var(--accent)}
.auth-methods{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}
.auth-method{
  display:flex;align-items:center;gap:8px;padding:10px 14px;
  border-radius:8px;border:1.5px solid var(--border);background:var(--surf3);
  cursor:pointer;font-size:13px;font-weight:600;color:var(--text2);transition:all .15s;flex:1;min-width:100px;
}
.auth-method:hover{border-color:rgba(59,130,246,.5)}
.auth-method.selected{border-color:var(--accent);background:rgba(59,130,246,.1);color:var(--accent)}
.auth-method .am-icon{font-size:16px}

/* QR animation */
.qr-scan{
  width:80px;height:80px;border:2px solid var(--accent);border-radius:4px;
  display:flex;align-items:center;justify-content:center;position:relative;margin:12px auto;
}
.qr-line{position:absolute;width:100%;height:2px;background:rgba(59,130,246,.6);top:0;
  animation:scanLine 1.5s ease-in-out infinite}
@keyframes scanLine{0%{top:0;opacity:1}100%{top:100%;opacity:.5}}
.qr-grid{display:grid;grid-template-columns:repeat(5,12px);gap:2px;opacity:.5}
.qr-cell{width:12px;height:12px;border-radius:1px}

/* Biometric */
.bio-circle{
  width:64px;height:64px;border-radius:50%;border:2px solid var(--border);
  display:flex;align-items:center;justify-content:center;margin:12px auto;
  font-size:28px;position:relative;
}
.bio-circle.scanning{border-color:var(--accent);animation:bioScan .8s ease-in-out 3}
@keyframes bioScan{0%,100%{box-shadow:0 0 0 0 rgba(59,130,246,.4)}50%{box-shadow:0 0 0 10px rgba(59,130,246,0)}}

/* Payment */
.pay-amount{
  font-size:32px;font-weight:800;color:var(--text);letter-spacing:-1px;
  text-align:center;margin:12px 0;display:flex;align-items:flex-start;justify-content:center;gap:4px;
}
.pay-currency{font-size:18px;font-weight:600;color:var(--text2);margin-top:6px}
.account-list{display:flex;flex-direction:column;gap:6px;margin:12px 0}
.account-item{
  display:flex;align-items:center;justify-content:space-between;
  padding:12px 14px;border-radius:9px;border:1.5px solid var(--border);
  background:var(--surf3);cursor:pointer;transition:all .15s;
}
.account-item:hover{border-color:rgba(59,130,246,.4)}
.account-item.selected{border-color:var(--accent);background:rgba(59,130,246,.1)}
.account-icon{width:32px;height:32px;border-radius:8px;display:flex;align-items:center;
  justify-content:center;font-size:16px;background:var(--surf4);flex-shrink:0}
.account-name{font-size:13px;font-weight:700}
.account-num{font-size:11px;color:var(--text3)}
.account-check{width:18px;height:18px;border-radius:50%;border:1.5px solid var(--border);
  display:flex;align-items:center;justify-content:center;transition:all .15s}
.account-item.selected .account-check{border-color:var(--accent);background:var(--accent)}

/* ===== JAVA CODE VIEW ===== */
.jrv{padding:16px 20px;font-family:var(--mono);display:flex;flex-direction:column;gap:16px}
.jv-iface-block{
  background:#040c1a;border:1.5px dashed rgba(6,182,212,.4);border-radius:8px;
  padding:14px 16px;font-size:12.5px;line-height:1.85;
}
.jv-iface-label{font-size:9px;font-weight:700;color:var(--cyan);letter-spacing:1px;
  text-transform:uppercase;margin-bottom:6px;opacity:.7}
.jv-divider{height:1px;background:var(--border);opacity:.5}
.jv-code-block{
  background:#070f1d;border:1px solid var(--border);border-radius:8px;
  padding:14px 16px;font-size:12.5px;line-height:2;
  position:relative;overflow:auto;
}
.jrv-line{display:block;position:relative;padding-left:0;transition:background .2s;border-radius:3px}
.jrv-line.changed{
  background:rgba(16,185,129,.13);border-left:2px solid var(--green);
  padding-left:8px;margin-left:-2px;animation:lineFlash .5s;
}
.jrv-line.result{
  background:rgba(16,185,129,.08);border-left:2px solid var(--green);
  padding-left:8px;margin-left:-2px;margin-top:8px;
}
@keyframes lineFlash{0%{background:rgba(16,185,129,.4)}100%{background:rgba(16,185,129,.13)}}
.kw{color:#c084fc}.ty{color:#67e8f9}.st{color:#fde68a}.cm{color:#4b6082}.fn{color:#86efac}
.nu{color:#fcd34d}

/* Runtime diagram */
.rtd{display:flex;flex-direction:column;align-items:flex-start;gap:0;padding:0 4px}
.rtd-row{display:flex;align-items:center;gap:10px;margin:2px 0}
.rtd-box{
  padding:8px 14px;border-radius:8px;font-size:12px;font-weight:600;
  display:inline-flex;align-items:center;gap:6px;position:relative;
  transition:all .3s;font-family:var(--mono);
}
.rtd-box.app{background:rgba(59,130,246,.1);border:1.5px solid rgba(59,130,246,.35);color:#93c5fd}
.rtd-box.iface{background:rgba(6,182,212,.1);border:1.5px dashed rgba(6,182,212,.5);color:var(--cyan)}
.rtd-box.ref{background:rgba(139,92,246,.1);border:1.5px solid rgba(139,92,246,.35);color:#c4b5fd}
.rtd-box.obj{background:rgba(245,158,11,.1);border:1.5px solid rgba(245,158,11,.35);color:var(--amber);transition:all .4s}
.rtd-box.mth{background:rgba(16,185,129,.1);border:1.5px solid rgba(16,185,129,.35);color:var(--green)}
.rtd-box.res{background:rgba(16,185,129,.08);border:1px solid rgba(16,185,129,.25);color:var(--green)}
.rtd-box.null-box{background:rgba(148,163,184,.07);border:1.5px dashed rgba(148,163,184,.25);color:var(--text3)}

.rtd-arrow{
  display:flex;flex-direction:column;align-items:flex-start;gap:0;
  margin-left:18px;padding:2px 0;
}
.rtd-arr-line{width:2px;height:20px;background:var(--border);transition:background .5s}
.rtd-arr-line.lit{background:var(--accent)}
.rtd-arr-head{color:var(--text3);font-size:14px;margin-left:-3px;transition:color .5s}
.rtd-arr-head.lit{color:var(--accent)}
.rtd-arr-label{font-size:10px;color:var(--text3);margin-left:10px;font-family:var(--ui);font-weight:500}

/* Ref arrow (the hero element) */
.ref-row{display:flex;align-items:center;gap:0;margin:8px 0}
.ref-var{
  padding:8px 14px;border-radius:8px;
  background:rgba(139,92,246,.1);border:1.5px solid rgba(139,92,246,.4);
  color:#c4b5fd;font-family:var(--mono);font-size:12px;font-weight:600;white-space:nowrap;
}
.ref-arrow-wrap{flex:1;display:flex;align-items:center;padding:0 4px;min-width:60px}
.ref-arrow-line{flex:1;height:2px;background:var(--purple);position:relative;transition:all .5s}
.ref-arrow-line::after{
  content:'▶';position:absolute;right:-6px;top:-7px;font-size:14px;color:var(--purple);
}
.ref-arrow-pulse{
  position:absolute;width:8px;height:8px;border-radius:50%;
  background:var(--purple);top:-3px;left:0;
  box-shadow:0 0 8px var(--purple);
  animation:pulseDot 1.5s ease-in-out infinite;
  transition:left .5s;
}
@keyframes pulseDot{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.6;transform:scale(.8)}}
.ref-obj-box{
  padding:10px 14px;border-radius:8px;border:1.5px solid rgba(245,158,11,.45);
  background:rgba(245,158,11,.08);font-family:var(--mono);font-size:12px;
  color:var(--amber);transition:all .4s;min-width:160px;
}
.ref-obj-box.changing{animation:objChange .4s}
@keyframes objChange{0%{transform:translateX(8px);opacity:.5}100%{transform:translateX(0);opacity:1}}
.ref-null{color:var(--text3);font-style:italic;font-family:var(--mono);font-size:12px;
  padding:8px 14px;border:1.5px dashed var(--border);border-radius:8px}

/* Object memory panel */
.obj-card{
  border:1px solid var(--border);border-radius:8px;overflow:hidden;margin-bottom:8px;
  transition:all .3s;
}
.obj-card-header{
  display:flex;align-items:center;justify-content:space-between;
  padding:8px 10px;background:var(--surf2);border-bottom:1px solid var(--border);
}
.obj-card-id{font-family:var(--mono);font-size:11px;font-weight:700;color:var(--amber)}
.obj-card-class{font-size:10px;color:var(--text3);font-family:var(--mono)}
.obj-card-body{padding:8px 10px}
.obj-field{display:flex;justify-content:space-between;font-size:11px;padding:3px 0;border-bottom:1px solid rgba(255,255,255,.04)}
.obj-field:last-child{border-bottom:none}
.obj-field-name{color:var(--text3);font-family:var(--mono)}
.obj-field-val{color:var(--text);font-family:var(--mono);font-weight:600}
.obj-field-val.changed{color:var(--green);animation:valChange .5s}
@keyframes valChange{0%{color:var(--amber)}100%{color:var(--green)}}

/* Step controls */
.step-bar{
  padding:10px 16px;border-top:1px solid var(--border2);
  display:flex;align-items:center;gap:8px;flex-shrink:0;background:var(--surf1);
}
.step-btn{
  padding:6px 14px;border-radius:6px;font-size:12px;font-weight:600;
  border:1px solid var(--border);background:var(--surf2);color:var(--text2);
  cursor:pointer;transition:all .15s;display:flex;align-items:center;gap:5px;
}
.step-btn:hover{border-color:var(--accent);color:var(--text)}
.step-btn.primary{background:var(--accent);color:#fff;border-color:var(--accent)}
.step-btn.primary:hover{background:#2563eb}
.step-btn:disabled{opacity:.4;cursor:not-allowed}
.step-count{font-size:11px;color:var(--text3);font-family:var(--mono);margin-left:auto}

/* Class map overlay — removed, no longer used */

/* Class map diagram */
.cm-iface{
  text-align:center;padding:10px 24px;border-radius:8px;
  border:1.5px dashed rgba(6,182,212,.6);background:rgba(6,182,212,.07);
  color:var(--cyan);font-family:var(--mono);font-weight:700;font-size:14px;margin-bottom:0;display:inline-block;
}
.cm-tag{font-size:9px;font-weight:700;color:var(--cyan);opacity:.7;letter-spacing:1px;display:block;margin-bottom:2px}
.cm-impls{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;margin-top:0}
.cm-impl{
  padding:10px 16px;border-radius:8px;border:1.5px solid rgba(16,185,129,.35);
  background:rgba(16,185,129,.07);color:var(--green);font-family:var(--mono);font-size:13px;font-weight:600;text-align:center;
}
.cm-obj-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap;justify-content:center;margin-top:16px}
.cm-obj{
  padding:10px 16px;border-radius:8px;border:1.5px solid rgba(245,158,11,.4);
  background:rgba(245,158,11,.07);color:var(--amber);font-family:var(--mono);font-size:12px;font-weight:600;
}

/* Challenge section */
.challenge-q{
  font-size:15px;font-weight:600;margin-bottom:16px;line-height:1.5;
}
.challenge-code-edit{
  background:#070f1d;border:1px solid var(--border);border-radius:8px;
  padding:14px 16px;font-family:var(--mono);font-size:13px;line-height:1.9;margin-bottom:14px;
}
.editable-slot{
  display:inline-block;min-width:160px;border-bottom:2px solid var(--amber);
  color:var(--amber);cursor:pointer;padding:1px 4px;border-radius:4px 4px 0 0;
  transition:all .2s;position:relative;
}
.editable-slot:hover{background:rgba(245,158,11,.1)}
.slot-dropdown{
  position:absolute;top:100%;left:0;min-width:200px;
  background:var(--surf2);border:1px solid var(--border);border-radius:8px;
  overflow:hidden;z-index:50;display:none;box-shadow:0 8px 24px rgba(0,0,0,.5);
}
.slot-dropdown.open{display:block}
.slot-opt{
  padding:8px 14px;cursor:pointer;font-size:12px;color:var(--text2);
  transition:background .1s;white-space:nowrap;
}
.slot-opt:hover{background:var(--surf3);color:var(--text)}
.slot-opt.chosen{color:var(--green);font-weight:700}

/* Discovery mode */
.disc-prompt{
  background:var(--surf2);border:1px solid var(--border);border-radius:10px;
  padding:18px;margin-bottom:14px;
}
.disc-q{font-size:14px;font-weight:600;margin-bottom:12px;line-height:1.5}
.disc-opts{display:flex;flex-direction:column;gap:6px}
.disc-opt{
  padding:10px 14px;border-radius:8px;border:1.5px solid var(--border);
  background:var(--surf3);cursor:pointer;font-size:13px;font-weight:500;
  color:var(--text2);transition:all .15s;
}
.disc-opt:hover{border-color:var(--accent);color:var(--text)}
.disc-opt.correct{border-color:var(--green);background:rgba(16,185,129,.1);color:var(--green)}
.disc-opt.wrong{border-color:var(--red);background:rgba(239,68,68,.08);color:var(--red);animation:shake .3s}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}

/* Tooltip */
.legend-row{display:flex;gap:16px;flex-wrap:wrap;margin-bottom:12px}
.legend-item{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--text2)}
.legend-dot{width:10px;height:10px;border-radius:3px;flex-shrink:0}

/* Notification area */
.notif-area{
  position:fixed;top:52px;right:12px;z-index:300;display:flex;flex-direction:column;gap:6px;
  pointer-events:none;
}
.notif-toast{
  padding:10px 14px;border-radius:8px;background:var(--surf2);border:1px solid var(--border);
  font-size:12px;font-weight:600;display:flex;align-items:center;gap:8px;
  animation:toastIn .3s ease;pointer-events:all;max-width:280px;
  box-shadow:0 8px 24px rgba(0,0,0,.4);
}
@keyframes toastIn{from{opacity:0;transform:translateX(20px)}to{opacity:1;transform:translateX(0)}}
.toastOut{animation:toastOut .3s ease forwards}
@keyframes toastOut{to{opacity:0;transform:translateX(20px)}}

/* Scrollbar */
::-webkit-scrollbar{width:5px;height:5px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}

/* Playground */
.pg-iface-select{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}
.pg-opt{
  padding:10px 14px;border-radius:8px;border:1.5px solid var(--border);background:var(--surf3);
  cursor:pointer;font-size:13px;font-weight:600;color:var(--text2);
  display:flex;align-items:center;gap:10px;transition:all .15s;
}
.pg-opt:hover{border-color:var(--cyan);color:var(--text)}
.pg-opt.active{border-color:var(--cyan);background:rgba(6,182,212,.08);color:var(--cyan)}
.pg-impl-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px;margin:12px 0}
.pg-impl{
  padding:10px 12px;border-radius:8px;border:1.5px solid var(--border);background:var(--surf3);
  cursor:pointer;font-size:12px;font-weight:600;color:var(--text2);text-align:center;transition:all .15s;
}
.pg-impl:hover{border-color:var(--green);color:var(--green)}
.pg-impl.chosen{border-color:var(--green);background:rgba(16,185,129,.1);color:var(--green)}
.pg-call-btn{
  padding:8px 18px;border-radius:7px;background:var(--green);color:#fff;
  border:none;font-size:13px;font-weight:700;cursor:pointer;transition:all .15s;
}
.pg-call-btn:hover{background:#059669}
.pg-reset-btn{
  padding:8px 14px;border-radius:7px;background:var(--surf3);color:var(--text2);
  border:1px solid var(--border);font-size:12px;font-weight:600;cursor:pointer;
}

/* Concept map final */
.concept-flow{display:flex;flex-direction:column;align-items:center;gap:0;padding:16px 0}
.cf-box{
  padding:10px 28px;border-radius:8px;font-size:13px;font-weight:700;
  text-align:center;min-width:200px;
}
.cf-box.app{background:rgba(59,130,246,.1);border:1.5px solid rgba(59,130,246,.4);color:#93c5fd}
.cf-box.ref{background:rgba(139,92,246,.1);border:1.5px solid rgba(139,92,246,.4);color:#c4b5fd}
.cf-box.obj{background:rgba(245,158,11,.1);border:1.5px solid rgba(245,158,11,.4);color:var(--amber)}
.cf-box.cls{background:rgba(16,185,129,.1);border:1.5px solid rgba(16,185,129,.4);color:var(--green)}
.cf-box.mth{background:rgba(16,185,129,.08);border:1px solid rgba(16,185,129,.25);color:var(--green)}
.cf-box.res{background:rgba(6,182,212,.08);border:1px solid rgba(6,182,212,.25);color:var(--cyan)}
.cf-arrow{display:flex;flex-direction:column;align-items:center;padding:2px 0;gap:0}
.cf-arr-line{width:2px;height:18px;background:var(--border)}
.cf-arr-label{font-size:10px;color:var(--text3);margin:2px 0}
.cf-arr-head{color:var(--text3);font-size:14px;margin-top:-2px}

/* Fade-in utility */
.fadein{animation:fadeIn .3s ease}
@keyframes fadeIn{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:translateY(0)}}
</style>
</head>
<body>

<!-- TOAST AREA -->
<div class="notif-area" id="toastArea"></div>


<!-- TOP BAR -->
<div class="topbar">
  <div class="topbar-brand">
    <div class="topbar-logo">Ji</div>
    Java Interface Simulator
  </div>
  <div class="topbar-controls">
    <button class="step-btn" onclick="doReset()">↺ Reset</button>
  </div>
</div>

<!-- APP BODY -->
<div class="app-body">
  <!-- SIDEBAR -->
  <div class="sidebar">
    <div class="sidebar-section">
      <div class="sidebar-label">Scenarios</div>
      <div class="nav-item active" onclick="loadScenario('wifi')"><span class="nav-icon">📶</span>Wi-Fi</div>
      <div class="nav-item" onclick="loadScenario('printer')"><span class="nav-icon">🖨</span>Printer</div>
      <div class="nav-item" onclick="loadScenario('camera')"><span class="nav-icon">📷</span>Camera</div>
      <div class="nav-item" onclick="loadScenario('notif')"><span class="nav-icon">🔔</span>Notification</div>
      <div class="nav-item" onclick="loadScenario('auth')"><span class="nav-icon">🔐</span>Authentication</div>
      <div class="nav-item" onclick="loadScenario('payment')"><span class="nav-icon">💳</span>Payment</div>
    </div>
    <div class="sidebar-section">
      <div class="sidebar-label">Practice</div>
      <div class="nav-item" onclick="loadScenario('playground')"><span class="nav-icon">🧪</span>Interface Playground</div>
      <div class="nav-item" onclick="loadScenario('challenge')"><span class="nav-icon">🎯</span>Challenge Mode</div>
      <div class="nav-item" onclick="loadScenario('concept')"><span class="nav-icon">🗺</span>Concept Map</div>
    </div>
    <div style="padding:12px 14px;margin-top:auto;border-top:1px solid var(--border2)">
      <div class="legend-row">
        <div class="legend-item"><div class="legend-dot" style="background:var(--cyan)"></div>Interface</div>
        <div class="legend-item"><div class="legend-dot" style="background:var(--purple)"></div>Reference</div>
      </div>
      <div class="legend-row">
        <div class="legend-item"><div class="legend-dot" style="background:var(--amber)"></div>Object</div>
        <div class="legend-item"><div class="legend-dot" style="background:var(--green)"></div>Method/Result</div>
      </div>
    </div>
  </div>

  <!-- MAIN AREA -->
  <div class="main">
    <div class="split-container" id="splitContainer">

      <!-- LEFT PANE: User / App View -->
      <div class="pane" id="userPane" style="border-right:1px solid var(--border2)">
        <div class="pane-header">
          <span id="uPaneLabel">Application View</span>
          <div class="pane-header-actions" id="uPaneActions"></div>
        </div>
        <div class="pane-body">
          <div class="uv-screen" id="userContent"></div>
        </div>
      </div>

      <!-- RIGHT PANE: Java View -->
      <div class="pane" id="javaPane" style="max-width:480px;min-width:360px;position:relative;overflow:hidden">
        <div class="pane-header">
          <span>Java View</span>
          <button class="step-btn" onclick="toggleClassMap()" id="cmToggleBtn" style="padding:4px 11px;font-size:11px">Class map ↗</button>
        </div>
        <!-- Code tab content — always visible -->
        <div class="pane-body" id="javaCodePane">
          <div class="jrv" id="javaContent"></div>
        </div>

        <!-- CLASS MAP floating attached panel -->
        <div class="cm-panel" id="cmPanel">
          <div class="cm-panel-hdr">
            <span>Class map</span>
            <div class="cm-close" onclick="closeClassMap()" title="Close">×</div>
          </div>
          <div class="cm-body" id="classMapContent"></div>
        </div>
      </div>

    </div>

    <!-- STEP BAR -->
    <div class="step-bar" id="stepBar">
      <button class="step-btn" id="btnStep" onclick="doStep()">⏭ Step</button>
      <button class="step-btn primary" id="btnRun" onclick="doRun()">▶ Run</button>
      <button class="step-btn" id="btnReset" onclick="doReset()">↺ Reset</button>
      <div class="step-count" id="stepCount">Step 0 / 3</div>
    </div>
  </div>
</div>

<script>
// ===================== STATE =====================
let currentScenario = 'wifi';
let currentView = 'split';
let currentStep = 0;
let totalSteps = 3;
let rpTab = 'objects';
let scenarioState = {};

// ===================== CLASS MAP PANEL =====================
let cmOpen = false;
function toggleClassMap() {
  cmOpen = !cmOpen;
  document.getElementById('cmPanel').classList.toggle('open', cmOpen);
  document.getElementById('cmToggleBtn').textContent = cmOpen ? 'Class map ×' : 'Class map ↗';
  if (cmOpen) renderClassMap();
}
function closeClassMap() {
  cmOpen = false;
  document.getElementById('cmPanel').classList.remove('open');
  document.getElementById('cmToggleBtn').textContent = 'Class map ↗';
}

// ===================== CLASS MAP RENDERER =====================
let scenarioClassMap = null;
function renderClassMap() {
  const cm = scenarioClassMap;
  const el = document.getElementById('classMapContent');
  if (!cm) {
    el.innerHTML = '<div style="color:var(--text3);font-size:12px;padding:20px;text-align:center">Select a scenario to see its class map.</div>';
    return;
  }

  const implsHTML = cm.impls.map(impl => {
    const isSel = cm.selected && cm.selected.id === impl.id;
    return `<div class="cm-impl-node ${isSel?'selected':''}"
      onclick="cm_select('${impl.id}')">
      ${impl.cls}
      ${isSel ? '<span class="cm-sel-dot"></span>' : ''}
    </div>`;
  }).join('');

  const stateHTML = cm.selected
    ? `<div style="color:var(--text3)">${cm.refVar} =</div>
       <div style="color:var(--amber)">new ${cm.selected.cls}()</div>
       <div style="color:var(--text3);margin-top:4px">${cm.refVar}.${cm.method}()</div>
       <div style="color:var(--green)">→ ${cm.selected.cls}.${cm.method}()</div>`
    : `<div style="color:var(--text3)">Select an implementation above.</div>`;

  el.innerHTML = `
    <div class="cm-iface-node">
      <span class="cm-iface-tag">«interface»</span>
      ${cm.ifaceName}
      <span class="cm-iface-method">public void ${cm.method}()</span>
    </div>
    <div class="cm-stem"></div>
    <div class="cm-hbar"></div>
    <div style="width:80%;display:flex;justify-content:space-around;margin-bottom:0">
      ${cm.impls.map(()=>'<div style="width:1px;height:14px;background:var(--border)"></div>').join('')}
    </div>
    <div class="cm-impls-row">${implsHTML}</div>
    <div class="cm-state-box">${stateHTML}</div>`;
}

function cm_select(id) {
  const cm = scenarioClassMap;
  if (!cm) return;
  cm.onSelect(id);
}
// Each scenario calls this with its interface/impl metadata + current selection
function renderJavaView({ifaceName, method, refVar, impls, selImpl, result}) {
  const cls = selImpl ? selImpl.cls : '?';
  const jc = document.getElementById('javaContent');
  const resultLine = result
    ? `<span class="jrv-line result"><span class="cm">// </span><span class="fn">✓ ${result}</span></span>`
    : '';
  jc.innerHTML = `
    <div class="jv-iface-label">interface</div>
    <div class="jv-iface-block">
<span style="color:var(--purple)">interface</span> <span class="ty">${ifaceName}</span> {
    <span style="color:var(--text2)">public</span> <span style="color:var(--purple)">void</span> <span class="fn">${method}</span>();
}</div>
    <div class="jv-divider"></div>
    <div class="jv-code-block">
<span class="jrv-line"><span class="ty">${ifaceName}</span> ${refVar};</span>
<span class="jrv-line ${selImpl?'changed':''}"><span id="jvLine2">${refVar} = <span style="color:var(--purple)">new</span> <span class="ty">${cls}</span>();</span></span>
<span class="jrv-line">${refVar}.<span class="fn">${method}</span>();</span>
${resultLine}
    </div>`;
  // Refresh class map panel if open
  if (cmOpen) renderClassMap();
}

// ===================== NAV =====================
function loadScenario(name) {
  currentScenario = name;
  currentStep = 0;
  scenarioState = {};
  closeClassMap();
  document.querySelectorAll('.nav-item').forEach(n=>n.classList.remove('active'));
  document.querySelectorAll('.nav-item').forEach(n=>{
    if(n.textContent.trim().toLowerCase().replace(/[^a-z]/g,'').includes(name.replace(/[^a-z]/g,'')))
      n.classList.add('active');
  });
  scenarios[name] ? scenarios[name].init() : (() => {})();
  renderObjects();
}

// ===================== SCENARIOS =====================
const scenarios = {};

// ─── WIFI ───────────────────────────────────────────
const wifiNets = [
  {id:'office', name:'Office Wi-Fi', sub:'Zoho Office', cls:'OfficeWiFi', bars:4, ip:'10.0.1.42'},
  {id:'home',   name:'Home Wi-Fi',   sub:'Home Network', cls:'HomeWiFi',   bars:3, ip:'192.168.1.100'},
  {id:'hotspot',name:'Mobile Hotspot',sub:'Phone Hotspot', cls:'MobileHotspot', bars:2, ip:'172.20.10.5'},
];
let wifiSel = null, wifiConnected = false;

scenarios.wifi = {
  init() {
    wifiSel = null; wifiConnected = false;
    document.getElementById('uPaneLabel').textContent = 'Wi-Fi Settings';
    document.getElementById('uPaneActions').innerHTML = '';
    totalSteps = 3; updateStepUI();
    scenarioClassMap = {
      ifaceName:'NetworkConnection', method:'connect', refVar:'connection',
      impls: wifiNets.map(n=>({id:n.id,cls:n.cls})),
      selected: null,
      onSelect: (id) => selectWifi(id),
    };
    this.renderUser();
    this.renderJava(null, false);
  },
  renderUser() {
    const uc = document.getElementById('userContent');
    uc.innerHTML = `
      <div class="os-panel" style="max-width:460px">
        <div class="os-titlebar">
          <div class="os-dots"><span class="d1"></span><span class="d2"></span><span class="d3"></span></div>
          <div class="os-title">Network Settings</div>
        </div>
        <div class="os-body">
          <div style="font-size:13px;font-weight:700;margin-bottom:4px">Wi-Fi</div>
          <div style="font-size:12px;color:var(--text3);margin-bottom:16px">Available Networks</div>
          <div class="net-list" id="netList">${wifiNets.map(n=>wifiNetHTML(n)).join('')}</div>
          <div style="display:flex;gap:8px;margin-top:4px">
            <button class="os-btn os-btn-primary" onclick="wifiConnect()" id="wifiConnBtn">Connect</button>
            ${wifiConnected?`<button class="os-btn os-btn-secondary" onclick="wifiDisconnect()">Disconnect</button>`:''}
          </div>
        </div>
        <div class="os-status-bar">
          <div class="status-dot ${wifiConnected?'connected':''}" id="wifiStatusDot"></div>
          <span id="wifiStatusText" style="font-size:12px;color:var(--text2)">${wifiConnected&&wifiSel?`Connected to ${wifiSel.name}`:'Not connected'}</span>
        </div>
      </div>`;
  },
  renderJava(net, connected) {
    if(scenarioClassMap) { scenarioClassMap.selected = net||null; }
    renderJavaView({
      ifaceName:'NetworkConnection', method:'connect', refVar:'connection',
      impls: wifiNets, selImpl: net,
      result: connected && net ? `Connected to ${net.name} — ${net.ip}` : null,
    });
  }
};

function wifiNetHTML(n) {
  const sel = wifiSel && wifiSel.id === n.id;
  const bars = [1,2,3,4].map(i=>`<div class="sig-bar sig${i} ${i<=n.bars&&sel?'lit':''}"></div>`).join('');
  return `<div class="net-item ${sel?'selected':''}" onclick="selectWifi('${n.id}')">
    <div class="net-item-left">
      <div class="net-radio"><div class="net-radio-dot"></div></div>
      <div><div class="net-name">${n.name}</div><div class="net-sub">${n.sub}</div></div>
    </div>
    <div class="net-signal">${bars}</div>
  </div>`;
}

function selectWifi(id) {
  const prev = wifiSel;
  wifiSel = wifiNets.find(n=>n.id===id);
  wifiConnected = false;
  currentStep = 1;
  updateStepUI();
  scenarios.wifi.renderUser();
  scenarios.wifi.renderJava(wifiSel, false);
  // Animate object change
  if (prev && prev.id !== id) {
    setTimeout(()=>{
      const box = document.getElementById('refObjBox');
      if(box) box.classList.add('changing');
    }, 50);
  }
  updateObjMemory(wifiSel, {status:'disconnected', ip:null});
  renderObjects();
}

  showToast(`✓ Connected to ${wifiSel.name}`, 'success');

function pgSelectIface(k) { pgIface = k; pgImpl = null; pgCalled = false; scenarios.playground.render(); }
function pgSelectImpl(cls, icon) { pgImpl = {cls, icon}; pgCalled = false; scenarios.playground.render(); }

function pgReset() { pgImpl = null; pgCalled = false; scenarios.playground.render(); renderObjects(); }

// ===================== STEP MODE =====================
function updateStepUI() {
  document.getElementById('stepCount').textContent = `Step ${currentStep} / ${totalSteps}`;
  document.getElementById('stepBar').style.display = 'flex';
}

function doStep() {
  const s = scenarios[currentScenario];
  if (!s) return;
  if (currentScenario === 'wifi') {
    if (currentStep === 0) { currentStep=1; updateStepUI(); showToast('Step 1: Declare reference → connection = null', 'info'); }
    else if (currentStep === 1 && wifiSel) { currentStep=1; showToast('Object assigned: new '+wifiSel.cls+'()', 'info'); }
    else if (currentStep === 2) { wifiConnect(); }
  }
}

function doRun() {
  if (currentScenario==='wifi') {
    if (!wifiSel) { showToast('Select a network first', 'warn'); return; }
    wifiConnect();
  } else if (currentScenario==='printer') {
    doPrint();
  } else if (currentScenario==='camera') {
    doCapture();
  } else if (currentScenario==='notif') {
    doSendNotif();
  } else if (currentScenario==='auth') {
    doAuth();
  } else if (currentScenario==='payment') {
    doPay();
  }
}

function doReset() {
  scenarios[currentScenario]&&scenarios[currentScenario].init();
  showToast('Reset', 'info');
}

// ===================== TOAST =====================
function showToast(msg, type='info') {
  const area = document.getElementById('toastArea');
  const el = document.createElement('div');
  el.className = 'notif-toast';
  const colors = {success:'var(--green)',warn:'var(--amber)',info:'var(--accent)',error:'var(--red)'};
  el.innerHTML = `<div style="width:6px;height:6px;border-radius:50%;background:${colors[type]||colors.info};flex-shrink:0"></div>${msg}`;
  area.appendChild(el);
  setTimeout(()=>{
    el.classList.add('toastOut');
    setTimeout(()=>el.remove(), 300);
  }, 2400);
}
