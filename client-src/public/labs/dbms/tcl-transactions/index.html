<style>
/* Design tokens: tcl-transaction-control-language, direction "Quiet Glass" (realistic phones).
   Written 2026-11-03, step 2 (restyle). Supersedes tokens-slides.css (Snap Blocks).
   Colours by role. Contrast ratios are WCAG 2 relative-luminance values computed on 2026-11-03
   (see direction-sheet-real.md). Fonts: Manrope + DM Mono, both SIL OFL 1.1. */

:root {
  color-scheme: light;

  /* stage background: a calm, near-blank radial wash (decoration only) */
  --color-bg-glow: #FBFAF8;     /* centre of the wash */
  --color-bg: #EFEEEB;          /* main background, used for contrast checks */
  --color-bg-edge: #E3E4E6;     /* corners of the wash */

  /* surfaces */
  --color-surface: #FFFFFF;
  --color-glass: rgba(255, 255, 255, 0.58);   /* the ledger glass */
  --color-glass-line: rgba(23, 24, 27, 0.10);
  --color-glass-hi: rgba(255, 255, 255, 0.85);

  /* text and lines */
  --color-text: #17181B;        /* 15.3:1 on bg, 14.0:1 on the wash edge, 17.8:1 on surface */
  --color-muted: #55585F;       /* 6.1:1 on bg, 5.6:1 on the wash edge, 7.1:1 on surface */
  --color-line: rgba(23, 24, 27, 0.12);       /* hairlines, decoration */
  --color-line-strong: #7A7D85; /* UI edges: 3.5:1 on bg, 3.2:1 on the wash edge, 4.1:1 on surface */

  /* the one accent: mulberry (hue 319). Waiting slips, the seal light, the primary button, key words */
  --color-accent: #8C2F6F;      /* as text: 6.6:1 on bg, 7.6:1 on surface and app */
  --color-on-accent: #FFFFFF;   /* 7.6:1 on accent */
  --color-accent-soft: rgba(140, 47, 111, 0.09);
  --color-accent-glow: rgba(140, 47, 111, 0.36);

  /* sealed (committed) rows: solid graphite */
  --color-sealed: #1C1D21;
  --color-on-sealed: #F5F4F1;   /* 15.3:1 */

  /* status, always with a symbol or word */
  --color-success: #1D6E44;     /* 5.4:1 on bg, 6.2:1 on surface */
  --color-success-soft: #DDEEE3;
  --color-warning: #8A5300;     /* 5.5:1 on bg, 6.3:1 on app */
  --color-warning-soft: #F8EAD2;
  --color-danger: #B0251D;      /* 5.8:1 on bg, 6.7:1 on surface */
  --color-danger-soft: #F7E0DD;

  /* inside the phones: the Saunpo app (original, made-up) */
  --app-bg: #FFFFFF;
  --app-text: #141518;          /* 18.3:1 */
  --app-muted: #5C5F67;         /* 6.4:1 */
  --app-card: #F3F3F5;          /* muted on card 5.8:1 */
  --app-line: #E2E2E6;
  --app-banner: rgba(246, 246, 248, 0.96);

  /* initials avatars (people appear only as these) */
  --av-a-bg: #EBDFD5; --av-a-fg: #553627;   /* Asha: warm sand, 8.3:1 */
  --av-r-bg: #DCE3DE; --av-r-fg: #2C3A33;   /* Ravi: sage grey, 9.1:1 */

  /* page shadow under glass and phones */
  --shadow-ink: 0, 0, 0;
  --shadow-strength: 0.30;

  /* type */
  --font-sans: "Manrope", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --font-mono: "DM Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --text-line: clamp(1rem, 0.9rem + 0.55vw, 1.45rem);  /* the one slide line, never below 16 px */
  --text-ui: 0.9375rem;
  --text-small: 0.8125rem;
  --scale: 1.25;

  /* shape and space (8 px rhythm) */
  --space: 8px;
  --radius-card: 18px;
  --radius-btn: 999px;
  --radius-chip: 8px;
  --hit: 44px;

  /* motion: calm and precise, one major motion at a time */
  --ease-out: cubic-bezier(0.2, 0.7, 0.2, 1);
  --ease-in: cubic-bezier(0.5, 0, 0.75, 0);
  --d-ui: 200ms;
  --d-slip: 420ms;    /* a waiting slip arrives */
  --d-merge: 380ms;   /* COMMIT: slips merge into the sealed row */
  --d-seal: 360ms;    /* COMMIT: the seal light closes */
  --d-fly: 520ms;     /* ROLLBACK: slips fly back to Asha's phone */
  --d-notif: 600ms;   /* Ravi's banner and phone tap */
  --d-float: 7s;      /* idle float of the phones (off in calm or reduced motion) */
}

/* the two phone finishes are product colours, fixed in both themes */
:root {
  --metal-graphite: linear-gradient(135deg, #5B5E64 0%, #2B2C30 16%, #73767C 34%, #1E1F22 52%, #4F5258 70%, #2A2B2F 86%, #6C6F75 100%);
  --metal-graphite-edge: linear-gradient(180deg, #46484D 0%, #27282B 40%, #5A5D62 60%, #232427 100%);
  --metal-silver: linear-gradient(135deg, #F4F5F7 0%, #B5B8BE 16%, #ECEDF0 34%, #8E9197 52%, #D9DBDF 70%, #A3A6AC 86%, #F1F2F4 100%);
  --metal-silver-edge: linear-gradient(180deg, #D9DBDF 0%, #A7AAB0 40%, #E6E7EA 60%, #9A9DA3 100%);
  --brush: repeating-linear-gradient(90deg, rgba(255, 255, 255, 0.05) 0 1px, rgba(0, 0, 0, 0.04) 1px 2px, transparent 2px 4px);
}

@media (prefers-color-scheme: dark) {

    color-scheme: dark;
    --color-bg-glow: #26272B;
    --color-bg: #18191C;
    --color-bg-edge: #101113;
    --color-surface: #202125;
    --color-glass: rgba(36, 37, 41, 0.62);
    --color-glass-line: rgba(255, 255, 255, 0.10);
    --color-glass-hi: rgba(255, 255, 255, 0.08);
    --color-text: #EEEDEA;
    --color-muted: #A6A9B0;
    --color-line: rgba(255, 255, 255, 0.12);
    --color-line-strong: #7C8088;
    --color-accent: #E29BC8;
    --color-on-accent: #2A0D20;
    --color-accent-soft: rgba(226, 155, 200, 0.10);
    --color-accent-glow: rgba(226, 155, 200, 0.40);
    --color-sealed: #ECEBE7;
    --color-on-sealed: #17181B;
    --color-success: #74D3A0;
    --color-success-soft: #1D3328;
    --color-warning: #F0B964;
    --color-warning-soft: #3A2E1A;
    --color-danger: #FF8E85;
    --color-danger-soft: #3D2120;
    --app-bg: #141518;
    --app-text: #F1F0ED;
    --app-muted: #A0A3AA;
    --app-card: #212226;
    --app-line: #2B2C31;
    --app-banner: rgba(38, 39, 44, 0.96);
    --av-a-bg: #4B3A30; --av-a-fg: #F3E1D4;
    --av-r-bg: #33413A; --av-r-fg: #DAE8DF;
    --shadow-strength: 0.55;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --color-bg-glow: #26272B;
  --color-bg: #18191C;
  --color-bg-edge: #101113;
  --color-surface: #202125;
  --color-glass: rgba(36, 37, 41, 0.62);

  --color-text: #EEEDEA;
  --color-muted: #A6A9B0;
  --color-line: rgba(255, 255, 255, 0.12);
  --color-line-strong: #7C8088;
  --color-accent: #E29BC8;
  --color-on-accent: #2A0D20;
  --color-accent-soft: rgba(226, 155, 200, 0.10);
  --color-accent-glow: rgba(226, 155, 200, 0.40);
  --color-sealed: #ECEBE7;
  --color-on-sealed: #17181B;
  --color-success: #74D3A0;
  --color-success-soft: #1D3328;
  --color-warning: #F0B964;
  --color-warning-soft: #3A2E1A;
  --color-danger: #FF8E85;
  --color-danger-soft: #3D2120;
  --app-bg: #141518;
  --app-text: #F1F0ED;
  --app-muted: #A0A3AA;
  --app-card: #212226;
  --app-line: #2B2C31;
  --app-banner: rgba(38, 39, 44, 0.96);
  --av-a-bg: #4B3A30; --av-a-fg: #F3E1D4;
  --av-r-bg: #33413A; --av-r-fg: #DAE8DF;
  --shadow-strength: 0.55;
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: 0.01ms !important; animation-iteration-count: 1 !important; transition: none !important; }
}

<style>
/* Ghost or Sealed: page styles, direction "Quiet Glass". Tokens live in tokens-real.css (a copy of
   direction/tokens-real.css). Phones, Saunpo screens, glass ledger and layout follow the approved
   mock-up direction/design-real.html; the extra states (error slip, aborted slips, quiz, cards) extend it. */

/* ---------- self-hosted fonts (SIL OFL 1.1, see fonts/LICENSE-OFL.txt); latin subset plus the rupee sign ---------- */
@font-face{font-family:"Manrope";font-style:normal;font-weight:400 800;font-display:swap;src:url("fonts/manrope.woff2") format("woff2")}
@font-face{font-family:"DM Mono";font-style:normal;font-weight:400;font-display:swap;src:url("fonts/dm-mono-400.woff2") format("woff2")}
@font-face{font-family:"DM Mono";font-style:normal;font-weight:500;font-display:swap;src:url("fonts/dm-mono-500.woff2") format("woff2")}

*,*::before,*::after{box-sizing:border-box}
*{margin:0;padding:0}
html,body{height:100%;overflow:hidden}
body{font-family:var(--font-sans);color:var(--color-text);background-color:var(--color-bg);
  background-image:radial-gradient(120% 90% at 50% 38%,var(--color-bg-glow) 0%,var(--color-bg) 55%,var(--color-bg-edge) 100%);background-attachment:fixed;
  -webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;overscroll-behavior:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
:focus-visible{outline:3px solid var(--color-accent);outline-offset:2px;border-radius:8px}
mark{background:none;color:var(--color-accent);font-weight:800}
.vh{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.nojs{position:fixed;inset:auto 12px 12px;z-index:50;padding:12px 14px;border-radius:14px;border:1px solid var(--color-line-strong);background:var(--color-surface);font-weight:600}

/* ---------- app frame: exactly one viewport ---------- */
.app{height:100vh;height:100dvh;display:grid;grid-template-rows:auto minmax(0,1fr) auto auto;grid-template-columns:minmax(0,1fr);grid-template-areas:"bar" "stage" "panel" "nav";
  padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);overflow:hidden;position:relative}
.slide{display:contents}
.bar{grid-area:bar;display:flex;align-items:center;gap:6px;padding:2px 8px 0;min-width:0}
.ib{width:var(--hit);height:var(--hit);flex:none;display:grid;place-items:center;border-radius:50%;color:var(--color-text);position:relative}
.ib svg{width:20px;height:20px}
.ib:hover{background:var(--color-line)}
#bNote{font:600 17px/1 var(--font-mono)}
.prog{flex:1;display:flex;align-items:center;gap:10px;min-width:0}
.track{flex:1;min-width:30px;height:4px;border-radius:4px;background:var(--color-line);overflow:hidden}
.track i{display:block;height:100%;width:0;background:var(--color-accent);border-radius:4px;transition:width var(--d-ui) var(--ease-out)}
.count{font:500 var(--text-small)/1 var(--font-mono);color:var(--color-muted);white-space:nowrap}
.starchip{flex:none;display:flex;align-items:center;gap:4px;font:500 var(--text-small)/1 var(--font-mono);color:var(--color-muted);padding:0 4px}
.starchip svg{width:14px;height:14px;color:var(--color-accent)}
.slide,.bar,.nav{-webkit-user-select:none;user-select:none}

/* ---------- stage ---------- */
.stage{grid-area:stage;position:relative;min-height:0;min-width:0;overflow:hidden;-webkit-user-select:none;user-select:none;touch-action:pan-y}
.pop,.card{-webkit-user-select:text;user-select:text}
.world{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;gap:var(--gap,16px);padding:8px var(--edge,8px)}
.world[hidden]{display:none}
.world[data-l="row"]{flex-direction:row}
.world[data-l="stack"]{flex-direction:column;justify-content:flex-start;padding-top:4px;padding-bottom:0;gap:6px}
.world[data-l="stack"] .phones{display:flex;justify-content:center;gap:var(--pgap,10px);width:100%;flex:1;align-items:center;min-height:0}
.world[data-l="row"] .phones{display:contents}
.world[data-l="stack"] .centre{order:-1}
.world[data-l="row"] #devA{order:1}.world[data-l="row"] .centre{order:2}.world[data-l="row"] #devR{order:3}

/* ---------- the phone, CSS 3D (our own geometry: 2.06 x width, round punch-hole, flat sides) ---------- */
.dev{--d:calc(var(--pw)*.056);--rad:calc(var(--pw)*.165);--rim-w:calc(var(--pw)*.018);--bez:calc(var(--pw)*.03);--cap-h:24px;
  position:relative;width:var(--pw);flex:none;display:flex;flex-direction:column;align-items:center;perspective:calc(var(--pw)*7)}
.dev.a{--ry:15deg;--rim:var(--metal-graphite);--edge:var(--metal-graphite-edge);--back:#2A2B2F;--key:linear-gradient(90deg,#5A5D62,#2A2B2E)}
.dev.r{--ry:-15deg;--rim:var(--metal-silver);--edge:var(--metal-silver-edge);--back:#D5D7DB;--key:linear-gradient(90deg,#E9EAEC,#9EA1A7)}
.world[data-l="stack"] .dev.a{--ry:11deg}.world[data-l="stack"] .dev.r{--ry:-11deg}
.float{position:relative;width:var(--pw);height:calc(var(--pw)*2.06);transform-style:preserve-3d;animation:float var(--d-float) ease-in-out infinite}
.dev.r .float{animation-delay:calc(var(--d-float)/-2)}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(calc(var(--pw)*-.028))}}
.tilt{position:absolute;inset:0;transform-style:preserve-3d;transform:rotateY(var(--ry)) rotateX(4deg)}
.shake{position:absolute;inset:0;transform-style:preserve-3d}
.shake.buzz{animation:buzz var(--d-notif) var(--ease-out)}
@keyframes buzz{0%,100%{transform:none}15%{transform:rotateZ(1.4deg)}30%{transform:rotateZ(-1.2deg)}45%{transform:rotateZ(.9deg)}60%{transform:rotateZ(-.5deg)}}
.sl{position:absolute;inset:0;border-radius:var(--rad);background:var(--edge);transform:translateZ(calc(var(--d)*var(--k)))}
.edge{position:absolute;background:var(--brush),var(--edge);backface-visibility:hidden;transform-style:preserve-3d}
.edge.l{left:calc(var(--d)/-2);top:var(--rad);width:var(--d);height:calc(100% - 2*var(--rad));transform:rotateY(-90deg)}
.edge.r{left:calc(100% - var(--d)/2);top:var(--rad);width:var(--d);height:calc(100% - 2*var(--rad));transform:rotateY(90deg)}
.edge.t{top:calc(var(--d)/-2);left:var(--rad);height:var(--d);width:calc(100% - 2*var(--rad));transform:rotateX(90deg)}
.edge.b{top:calc(100% - var(--d)/2);left:var(--rad);height:var(--d);width:calc(100% - 2*var(--rad));transform:rotateX(-90deg)}
.key{position:absolute;left:22%;width:56%;border-radius:2px;background:var(--key);transform:translateZ(1.6px);box-shadow:0 0 0 .5px rgba(0,0,0,.25)}
.edge.l .k1{top:9%;height:13%}.edge.l .k2{top:25%;height:13%}
.edge.r .k3{top:16%;height:17%}
.edge.b .port{position:absolute;left:44%;width:12%;top:30%;height:40%;border-radius:4px;background:#111;transform:translateZ(.3px)}
.back{position:absolute;inset:0;border-radius:var(--rad);background:var(--back);transform:rotateY(180deg) translateZ(calc(var(--d)/2));backface-visibility:hidden}
.face{position:absolute;inset:0;border-radius:var(--rad);transform:translateZ(calc(var(--d)/2));background:var(--rim);backface-visibility:hidden;
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.35),inset 0 0 0 2px rgba(0,0,0,.18)}
.glass{position:absolute;inset:var(--rim-w);border-radius:calc(var(--rad) - var(--rim-w));background:#060607;overflow:hidden}
.scr{position:absolute;inset:var(--bez);border-radius:calc(var(--rad) - var(--rim-w) - var(--bez));overflow:hidden;background:var(--app-bg);color:var(--app-text);
  --fs:clamp(11.5px,calc(var(--pw)*.06),15px);font:500 var(--fs)/1.25 var(--font-sans);display:flex;flex-direction:column}
.hole{position:absolute;top:calc(var(--bez) + var(--pw)*.026);left:50%;width:calc(var(--pw)*.045);aspect-ratio:1;transform:translateX(-50%);border-radius:50%;
  background:radial-gradient(circle at 38% 38%,#34363d 0 14%,#0b0b0d 32% 100%);box-shadow:0 0 0 1px rgba(255,255,255,.07);z-index:4}
.off{position:absolute;inset:var(--bez);border-radius:calc(var(--rad) - var(--rim-w) - var(--bez));background:#030304;opacity:0;pointer-events:none;transition:opacity .5s var(--ease-in);z-index:3;display:grid;place-items:center}
.glass.dead .off{opacity:1}
.off svg{width:28%;opacity:0;transition:opacity .3s .5s}
.glass.dead .off svg{opacity:.9}
.sheen{position:absolute;inset:0;pointer-events:none;z-index:5;border-radius:inherit;
  background:linear-gradient(118deg,rgba(255,255,255,.17) 0%,rgba(255,255,255,.05) 20%,transparent 33%,transparent 70%,rgba(255,255,255,.05) 85%,transparent 100%)}
.shadow{position:absolute;left:11%;right:11%;bottom:calc(var(--cap-h) - var(--pw)*.06);height:calc(var(--pw)*.12);border-radius:50%;
  background:radial-gradient(closest-side,rgba(var(--shadow-ink),var(--shadow-strength)),transparent);filter:blur(3px);z-index:-1;animation:shad var(--d-float) ease-in-out infinite}
.dev.r .shadow{animation-delay:calc(var(--d-float)/-2)}
@keyframes shad{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(.9);opacity:.75}}
.cap{height:var(--cap-h);margin-top:calc(var(--pw)*.04);display:flex;align-items:center;gap:6px;white-space:nowrap;font-size:var(--text-small);max-width:calc(var(--pw) + 40px)}
.cap b{font-weight:700}
.under{font:500 10.5px/1 var(--font-mono);padding:4px 6px;border-radius:99px;border:1px solid var(--color-line-strong);color:var(--color-muted);overflow:hidden;text-overflow:ellipsis;min-width:0}
.under.warn{color:var(--color-warning);border-color:var(--color-warning)}
.under.bad{color:var(--color-danger);border-color:var(--color-danger);border-style:dashed}

/* ---------- Saunpo, inside the screen ---------- */
.scr .sb{flex:none;height:2.4em;display:flex;align-items:center;justify-content:space-between;padding:0 .8em 0 .95em;font-size:.96em;font-weight:700;letter-spacing:.01em}
.sb .ri{display:flex;align-items:center;gap:.3em}
.sig{display:flex;align-items:flex-end;gap:1.5px;height:.8em}
.sig i{width:2.5px;background:currentColor;border-radius:1px}
.sig i:nth-child(1){height:30%}.sig i:nth-child(2){height:55%}.sig i:nth-child(3){height:80%}.sig i:nth-child(4){height:100%}
.sig.none i{opacity:.28}
.nos{font-weight:800;color:var(--color-danger);margin-left:-.1em}
.bat{display:flex;align-items:center;gap:.22em}
.bat .cell{position:relative;width:1.55em;height:.85em;border:1.4px solid currentColor;border-radius:.24em;opacity:.9}
.bat .cell::after{content:"";position:absolute;right:-.24em;top:28%;height:44%;width:.14em;background:currentColor;border-radius:0 1px 1px 0}
.bat .cell i{position:absolute;left:1.2px;top:1.2px;bottom:1.2px;border-radius:1.5px;background:currentColor}
.bat.low{color:var(--color-danger)}
.scr .body{flex:1;min-height:0;display:flex;flex-direction:column;padding:.35em .85em .9em;position:relative}
.scr .ah{display:flex;align-items:center;gap:.45em;font-weight:800;font-size:1.02em;margin-bottom:.55em}
.scr .ah svg{width:1.45em;height:1.45em;flex:none}
.scr .ah .back-c{font-weight:600;color:var(--app-muted)}
.scr .h1{font-size:1.32em;font-weight:800;letter-spacing:-.01em;line-height:1.15}
.scr .lbl{font-size:.92em;color:var(--app-muted);font-weight:600}
.scr .avs{display:flex;gap:.9em;margin:.55em 0 .2em}
.scr .avc{display:flex;flex-direction:column;align-items:center;gap:.3em;font-size:.92em;font-weight:600}
.av{display:grid;place-items:center;border-radius:50%;font-weight:800;flex:none}
.scr .avc .av{width:2.7em;height:2.7em;font-size:1.05em;transition:box-shadow var(--d-ui)}
.av.a{background:var(--av-a-bg);color:var(--av-a-fg)}.av.r{background:var(--av-r-bg);color:var(--av-r-fg)}
.av.new{background:var(--app-card);color:var(--app-muted);font-weight:500;font-size:1.3em!important}
.scr .avc.on .av{box-shadow:0 0 0 .16em var(--app-bg),0 0 0 .3em var(--color-accent)}
.scr .wal{margin-top:auto;background:var(--app-card);border-radius:.9em;padding:.75em .85em}
.scr .wal .v{font-size:1.4em;font-weight:800;margin-top:.1em;font-variant-numeric:tabular-nums}
.scr .payto{display:flex;align-items:center;gap:.55em;margin-bottom:.6em}
.scr .payto .av{width:2.2em;height:2.2em}
.scr .amt{font-size:2.3em;font-weight:800;letter-spacing:-.02em;text-align:center;margin:.35em 0 .3em;font-variant-numeric:tabular-nums}
.scr .achips{display:flex;gap:.35em;justify-content:center;flex-wrap:wrap}
.scr .achips span{font-size:.92em;font-weight:700;padding:.4em .6em;border-radius:99em;background:var(--app-card)}
.scr .achips span.on{background:var(--color-accent);color:var(--color-on-accent)}
.scr .cta{margin-top:auto;flex:none;display:grid;place-items:center;height:2.75em;border-radius:99em;background:var(--color-accent);color:var(--color-on-accent);font-weight:800;font-size:1.06em;transition:transform var(--d-ui) var(--ease-out),filter var(--d-ui)}
.scr .cta.big{height:3em;font-size:1.15em}
.scr .cta.press{transform:scale(.95);filter:brightness(.85)}
.scr .cta.sec{background:var(--app-card);color:var(--app-text)}
.scr .cta.line{background:none;border:1.5px solid var(--app-line);color:var(--app-text)}
.scr .rev{background:var(--app-card);border-radius:.9em;padding:.25em .8em;margin-top:.4em}
.scr .rev div{display:flex;justify-content:space-between;align-items:center;padding:.6em 0;gap:.5em}
.scr .rev div+div{border-top:1px solid var(--app-line)}
.scr .rev span{color:var(--app-muted);font-weight:600;font-size:.92em}
.scr .rev b{font-weight:800;display:flex;align-items:center;gap:.35em}
.scr .rev .av{width:1.7em;height:1.7em;font-size:.95em}
.scr .mid{flex:1;min-height:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:.25em}
.spin{width:3.3em;height:3.3em;margin-bottom:.5em;flex:none;animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.scr .st{font-size:1.18em;font-weight:800;line-height:1.2}
.scr .sub{color:var(--app-muted);font-weight:600;font-size:.94em}
.scr .badge{width:3.5em;height:3.5em;flex:none;border-radius:1.05em;display:grid;place-items:center;margin-bottom:.55em}
.scr .badge svg{width:55%;height:55%}
.scr .badge.ok{background:var(--color-success-soft);color:var(--color-success)}
.scr .badge.no{background:var(--app-card);color:var(--app-muted)}
.scr .badge.warn{background:var(--color-warning-soft);color:var(--color-warning)}
.scr .badge.bad{background:var(--color-danger-soft);color:var(--color-danger)}
.scr .bigbal{background:var(--app-card);border-radius:1em;padding:.85em .9em;margin-top:.2em}
.scr .bigbal .v{font-size:2em;font-weight:800;letter-spacing:-.02em;font-variant-numeric:tabular-nums;white-space:nowrap}
.scr .act{margin-top:.9em;display:flex;flex-direction:column;gap:.45em}
.scr .act .it{display:flex;align-items:center;gap:.5em;font-weight:700}
.scr .act .it .av{width:2em;height:2em;font-size:.92em}
.scr .act .it .p{margin-left:auto;color:var(--color-success)}
.scr .act .none{color:var(--app-muted);font-weight:600;font-size:.94em}
.scr .notif{position:absolute;left:.5em;right:.5em;top:.3em;z-index:2;background:var(--app-banner);border:1px solid var(--app-line);border-radius:1em;padding:.6em .7em;
  box-shadow:0 .6em 1.4em -.5em rgba(0,0,0,.35);display:flex;gap:.5em;align-items:flex-start}
.scr .notif svg{width:1.6em;height:1.6em;flex:none}
.scr .notif small{display:block;font-size:.92em;color:var(--app-muted);font-weight:600}
.scr .notif b{display:block;font-weight:800;line-height:1.2;overflow-wrap:break-word}
.scr .notif.in{animation:notif 300ms var(--ease-out)}
@keyframes notif{from{transform:translateY(-130%);opacity:0}}
/* small phones (under 170 px wide): chrome shrinks first, never the words */
.dev.small .pct{display:none}
.dev.small .scr .bigbal .v{font-size:1.65em}
.dev.small .scr .bigbal{padding:.7em .7em}
.dev.small .scr .amt{font-size:2em}
.dev.small .scr .notif svg{display:none}
.dev.small .scr .notif{padding:.5em .6em;left:.35em;right:.35em}
.dev.small .scr .sb{padding:0 .6em 0 .8em}
.dev.small .scr .act .it .av{display:none}
.dev.small .scr .achips{gap:.25em}
.dev.small .scr .achips span{padding:.3em .42em}
.dev.small .scr .amt{margin:.2em 0}
.dev.small .scr .payto{margin-bottom:.35em}
.dev.small{--cap-h:40px}
.dev.small .cap{flex-direction:column;gap:3px;height:auto}
.dev.small .cap b{font-size:12px;line-height:1}

/* ---------- centre: the glass ledger ---------- */
.centre{display:flex;flex-direction:column;align-items:center;gap:.55em;font-size:var(--lf,14px);min-width:0;position:relative;z-index:2}
.world[data-l="row"] .centre{flex:1;max-width:32em}
.world[data-l="stack"] .centre{width:100%;padding:0 var(--fabpad,0px)}
.ledger{position:relative;width:100%;max-width:29em;padding:.75em .85em .8em;border-radius:1.15em;background:var(--color-glass);
  -webkit-backdrop-filter:blur(18px) saturate(1.15);backdrop-filter:blur(18px) saturate(1.15);border:1px solid var(--color-glass-line);
  box-shadow:inset 0 1px 0 var(--color-glass-hi),0 24px 44px -28px rgba(var(--shadow-ink),var(--shadow-strength))}
.lh{display:flex;align-items:center;gap:.5em;font:500 .87em/1.2 var(--font-mono);color:var(--color-muted);min-width:0}
.lh .tt{color:var(--color-text)}
.lh .en{white-space:nowrap}
.seal{margin-left:auto;display:flex;align-items:center;gap:.45em;color:var(--color-muted);min-width:0}
.seal .lk{width:2em;height:2em;flex:none;border-radius:50%;display:grid;place-items:center;border:1px solid var(--color-line-strong);position:relative;color:var(--color-muted);transition:background var(--d-ui)}
.seal .lk svg{width:1.05em;height:1.05em}
.seal .lk .shk{transition:transform var(--d-seal) var(--ease-out);transform:translateY(-1.5px)}
.seal.on{color:var(--color-accent)}
.seal.on .lk{background:var(--color-accent);border-color:var(--color-accent);color:var(--color-on-accent);box-shadow:0 0 0 .28em var(--color-accent-soft),0 0 1.3em var(--color-accent-glow)}
.seal.on .lk .shk{transform:none}
.seal .ring{position:absolute;inset:-.32em;width:calc(100% + .64em);height:calc(100% + .64em);transform:rotate(-90deg);pointer-events:none}
.seal .ring circle{fill:none;stroke:var(--color-accent);stroke-width:1.6;stroke-dasharray:100;stroke-dashoffset:100}
.seal.in .ring circle{animation:ring var(--d-seal) var(--ease-out) forwards}
@keyframes ring{to{stroke-dashoffset:0}}
.seal.in .ring{animation:ringout 300ms var(--d-seal) forwards}
@keyframes ringout{to{opacity:0}}
.seal .sl-t{font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lb{display:grid;grid-template-columns:var(--whow,4.6em) 5.5em minmax(0,1fr);gap:.45em .5em;margin-top:.65em;align-items:center}
.ledger.narrow{--whow:1.9em}
.ledger.narrow .who b{display:none}
.compact .ledger{padding:.6em .7em .65em}
.compact .lb{margin-top:.5em}
.compact .colh{display:none}
.compact .lh .tt,.compact .lh .dot,.compact .lh .en{display:none}
.compact .lh .total{margin:0;padding:0;border:0;font:600 1.12em/1.2 var(--font-sans);gap:.35em;flex-wrap:nowrap;white-space:nowrap}
.compact .lh .total small{font-size:.92em}
.compact .seal .sl-t{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.compact .solid,.compact .slip{height:2.4em}
.compact .lane{min-height:2.4em}
.colh{font:500 .87em/1 var(--font-mono);color:var(--color-muted);display:flex;align-items:center;gap:.3em}
.colh svg{width:1.2em;height:1.2em;color:var(--color-accent)}
.who{display:flex;align-items:center;gap:.4em;font-weight:700;min-width:0}
.who .av{width:1.9em;height:1.9em;font-size:.9em}
.solid{height:2.6em;border-radius:.62em;background:var(--color-sealed);color:var(--color-on-sealed);display:flex;align-items:center;justify-content:space-between;gap:.2em;padding:0 .55em;
  font-weight:800;font-variant-numeric:tabular-nums;position:relative;transition:box-shadow var(--d-ui);white-space:nowrap}
.solid svg{width:.95em;height:.95em;opacity:.7;flex:none}
.solid.eye{box-shadow:0 0 0 2px var(--color-bg),0 0 0 3.5px var(--color-accent)}
.solid.pulse{animation:pulse calc(var(--d-seal) + 300ms) var(--ease-out)}
@keyframes pulse{0%{box-shadow:0 0 0 0 var(--color-accent-glow)}60%{box-shadow:0 0 0 .4em var(--color-accent-soft),0 0 1.4em var(--color-accent-glow)}100%{box-shadow:0 0 0 0 transparent}}
.lockb{display:flex;align-items:center;gap:.15em;font:500 .87em/1 var(--font-mono);padding:.22em .4em;border-radius:99em;background:var(--color-surface);color:var(--color-text);border:1.5px solid var(--color-danger);margin-right:-.25em}
.lockb svg{width:1em;height:1em;opacity:1;color:var(--color-danger)}
.lane{display:flex;gap:.45em;min-height:2.6em;align-items:center;min-width:0}
.lane .none{font:500 .87em/1 var(--font-mono);color:var(--color-muted);opacity:.8}
.slip{flex:none;width:4.8em;height:2.6em;border-radius:.62em;border:1.5px solid var(--color-accent);background:var(--color-accent-soft);
  box-shadow:0 0 1em -.15em var(--color-accent-glow);display:flex;flex-direction:column;justify-content:center;padding:0 .5em;line-height:1.1;position:relative}
.slip .d{font:500 .87em/1.1 var(--font-mono);color:var(--color-accent);white-space:nowrap}
.slip .v{font-weight:800;font-variant-numeric:tabular-nums;white-space:nowrap}
.slip .own{position:absolute;top:-.65em;right:-.45em;font:500 .87em/1 var(--font-mono);background:var(--color-surface);border:1px solid var(--color-line-strong);border-radius:99em;padding:.2em .4em}
.slip.enter{animation:slipin var(--d-slip) var(--ease-out)}
@keyframes slipin{from{opacity:0;transform:translateY(-.7em) scale(.96);box-shadow:0 0 0 transparent}}
/* an error slip: red outline with a cross, then it fades (the failing statement is undone) */
.slip.err{border-color:var(--color-danger);background:var(--color-danger-soft);box-shadow:none}
.slip.err .d{color:var(--color-danger)}
/* aborted slips (PostgreSQL): hatched red, dashed, labelled */
.slip.hatch{width:auto;min-width:4.8em;border:1.5px dashed var(--color-danger);box-shadow:none;
  background:repeating-linear-gradient(135deg,color-mix(in srgb,var(--color-danger) 16%,transparent) 0 .3em,transparent .3em .6em),var(--color-danger-soft)}
.slip.hatch .d{color:var(--color-danger)}
.mk{flex:none;width:2px;align-self:stretch;margin:-.25em .1em;position:relative;background:repeating-linear-gradient(var(--color-text) 0 3px,transparent 3px 6px)}
.mk b{position:absolute;bottom:calc(100% + .1em);left:-.1em;font:500 .87em/1 var(--font-mono);white-space:nowrap;background:var(--color-text);color:var(--color-bg);padding:.25em .45em;border-radius:.35em .35em .35em 0;z-index:1}
.mk.end b{left:auto;right:-.1em;border-radius:.35em .35em 0 .35em}
.compact .lb.hasmk{margin-top:1.7em}
.mk.mark b{background:var(--color-surface);color:var(--color-text);border:1px solid var(--color-line-strong)}
.mk.in{animation:mkin 320ms var(--ease-out)}
@keyframes mkin{from{opacity:0;transform:scaleY(.4)}}
.eyechip{grid-column:1/-1;display:flex;align-items:center;gap:.35em;font:500 .87em/1.2 var(--font-mono);color:var(--color-accent);margin-top:.1em}
.eyechip.bad{color:var(--color-danger)}
.eyechip svg{width:1.3em;height:1.3em;flex:none}
.total{display:flex;align-items:baseline;justify-content:center;gap:.5em;flex-wrap:wrap;font-size:.95em;margin-top:.65em;padding-top:.55em;border-top:1px solid var(--color-line)}
.total small{color:var(--color-muted);font-weight:600;font-size:.92em}
.total b{font-weight:800;font-size:1.12em;font-variant-numeric:tabular-nums}
.total .ok{color:var(--color-success);font-weight:700}
.total .bad{color:var(--color-danger);font-weight:700}
.total .q{color:var(--color-muted);font-weight:600}
.ncbox{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);z-index:3;padding:.6em .9em;border-radius:.8em;border:1.5px dashed var(--color-line-strong);background:var(--color-surface);
  font:600 1em/1.2 var(--font-sans);color:var(--color-muted);white-space:nowrap;box-shadow:0 12px 28px -16px rgba(var(--shadow-ink),.45)}
.tags{display:flex;flex-wrap:wrap;gap:.35em;justify-content:center;max-width:31em}
.tags:empty{display:none}
.world .tags{font-size:var(--lf,14px)}
.world.tmid .tags{flex:none;flex-direction:column;justify-content:center;align-items:stretch;align-self:center;max-width:none;gap:.4em}
.world.tmid .tag{border-radius:.7em;text-align:center;overflow-wrap:anywhere}
.tag{font:500 .87em/1.3 var(--font-mono);padding:.3em .55em;border-radius:99em;border:1px solid var(--color-line);background:var(--color-glass);color:var(--color-text)}
.tag.eng{color:var(--color-muted)}
.tag.sql{border-color:var(--color-line-strong)}
.tag.bad{color:var(--color-danger);border-color:var(--color-danger)}
.tag.rule{border-style:dashed;border-color:var(--color-line-strong);color:var(--color-muted)}
.tag.ghost{border-color:var(--color-accent);color:var(--color-accent);background:var(--color-accent-soft)}
.tag.solid{background:var(--color-sealed);color:var(--color-on-sealed);border-color:var(--color-sealed)}
.tag.star{border-color:var(--color-accent);color:var(--color-accent);font-weight:500}
.tag.in{animation:tagin var(--d-ui) var(--ease-out)}
@keyframes tagin{from{opacity:0;transform:translateY(.3em)}}

/* ---------- corner buttons and cards ---------- */
.fabs{display:flex;gap:8px;justify-content:center}
.world[data-l="stack"]~.fabs,.fabs.corner{position:absolute;top:6px;left:8px;right:8px;justify-content:space-between;pointer-events:none;z-index:3}
.fabs.corner .fab{pointer-events:auto}
.fabs.row{position:absolute;bottom:8px;left:50%;transform:translateX(-50%);z-index:3}
.fab{min-width:var(--hit);height:var(--hit);padding:0 14px;border-radius:99px;font:600 var(--text-small)/1 var(--font-sans);background:var(--color-surface);border:1px solid var(--color-line-strong);color:var(--color-text);white-space:nowrap}
.fab[aria-disabled="true"]{color:var(--color-muted);border-style:dashed}
.fab svg{width:11px;height:11px;vertical-align:-1px;margin-left:2px}
.fab[hidden]{display:none}
.nav .fabs{position:static;transform:none;display:flex;gap:6px}
.nav .fab{padding:0 12px}
.pop{position:absolute;z-index:10;left:50%;top:12px;transform:translateX(-50%);width:min(26rem,calc(100% - 24px));max-height:calc(100% - 24px);overflow:auto;background:var(--color-surface);border:1px solid var(--color-line);
  border-radius:var(--radius-card);padding:16px 48px 16px 18px;box-shadow:0 24px 48px -20px rgba(var(--shadow-ink),.45);font-size:var(--text-ui);line-height:1.45}
.pop[hidden]{display:none}
.pop h3{font:500 var(--text-small)/1 var(--font-mono);color:var(--color-muted);margin-bottom:8px}
.pop .x{position:absolute;top:4px;right:4px;width:var(--hit);height:var(--hit);border-radius:50%;font-size:22px}
.pop pre{font:500 .85rem/1.5 var(--font-mono);white-space:pre-wrap;background:var(--color-bg);border-radius:10px;padding:8px 10px;margin-top:6px}
.fchips{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.chip{display:inline-block;font:500 .75rem/1 var(--font-mono);padding:6px 8px;border-radius:var(--radius-chip);border:1px solid var(--color-line-strong);color:var(--color-text)}
.chip.med{border:1.5px dashed var(--color-warning);color:var(--color-warning)}

/* ---------- card slides (cheat sheet, sources): the only cards that scroll ---------- */
.card{position:absolute;inset:10px var(--edge,10px);z-index:5;overflow:auto;overscroll-behavior:contain;touch-action:pan-y;border-radius:var(--radius-card);border:1px solid var(--color-glass-line);
  background:var(--color-surface);box-shadow:0 24px 48px -28px rgba(var(--shadow-ink),.45);padding:16px 18px;text-align:left;max-width:1200px;margin:0 auto}
.card[hidden]{display:none}
.card:focus-visible{outline-offset:-4px}
.card h2{margin:0 0 10px;font:800 1.15rem/1.2 var(--font-sans);letter-spacing:-.01em}
.card h3{margin:16px 0 6px;font:700 .9375rem/1.2 var(--font-sans);display:flex;gap:8px;align-items:center}
.card h3 .tag{font-size:.75rem}
.card code{display:block;font:400 .8125rem/1.5 var(--font-mono);white-space:pre-wrap;word-break:break-word}
.card .cl{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:baseline;padding:8px 0;border-bottom:1px solid var(--color-line)}
.card .cl code{flex:1 1 220px}
.card .cols{display:grid;gap:4px 24px}
@media (min-width:900px){.card .cols{grid-template-columns:repeat(3,1fr)}}
.card .src{display:grid;gap:3px;padding:8px 0;border-bottom:1px solid var(--color-line)}
.card .src a{color:var(--color-accent);font-weight:700;text-decoration-thickness:1.5px;text-underline-offset:3px;word-break:break-word;display:inline-flex;align-items:center;min-height:44px;padding:2px 0}
.card .src small{color:var(--color-muted);font:400 .8125rem/1.4 var(--font-mono)}
.card .lead{margin:0 0 6px;color:var(--color-muted);font-size:.875rem}

/* ---------- panel ---------- */
.panel{grid-area:panel;display:flex;flex-direction:column;align-items:center;gap:8px;padding:4px 12px 6px;width:100%;max-width:56rem;justify-self:center;min-width:0}
.line{font-size:var(--text-line);font-weight:600;line-height:1.3;text-align:center;letter-spacing:-.005em;max-width:34ch;text-wrap:balance}
.answers,.player,.eng{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.answers:empty,.player:empty,.eng:empty{display:none}
.ans{min-height:var(--hit);padding:0 16px;border-radius:var(--radius-btn);background:var(--color-surface);border:1px solid var(--color-line-strong);font-weight:700;font-size:var(--text-ui);display:flex;align-items:center;gap:6px;position:relative}
.ans:hover{border-color:var(--color-text)}
.ans.ok{border:2px solid var(--color-success);color:var(--color-success)}
.ans.no{border:1.5px dashed var(--color-danger);color:var(--color-danger);opacity:.85}
.ans[disabled]{cursor:default}
.ans.saved{border:2px solid var(--color-accent);color:var(--color-accent)}
.ans.tab[aria-pressed="true"]{background:var(--color-text);color:var(--color-bg);border-color:var(--color-text)}
.ans.hasg{min-width:96px;justify-content:center}
.ans .am{font-weight:800}
.ans .yg{font:500 10.5px/1 var(--font-mono);position:absolute;top:-8px;left:50%;transform:translateX(-50%);background:var(--color-text);color:var(--color-bg);padding:3px 6px;border-radius:99px;white-space:nowrap}
.pb{flex:none;width:var(--hit);height:var(--hit);border-radius:50%;display:grid;place-items:center;border:1px solid var(--color-line-strong);background:var(--color-surface)}
.pb svg{width:16px;height:16px}
.pb.main{background:var(--color-accent);border-color:var(--color-accent);color:var(--color-on-accent)}
.player{gap:6px;flex-wrap:nowrap;width:100%;max-width:30rem}
.scrub{display:flex;align-items:center;gap:6px;flex:1 1 100px;min-width:0;max-width:260px}
.scrub input{flex:1;accent-color:var(--color-accent);height:var(--hit);min-width:60px;width:100%}
.scrub span{font:500 .75rem/1.2 var(--font-mono);color:var(--color-muted);min-width:3ch}
.eng button{min-height:var(--hit);padding:0 14px;border-radius:99px;border:1px solid var(--color-line-strong);font:500 .8rem/1 var(--font-mono);background:var(--color-surface)}
.eng button[aria-pressed="true"]{background:var(--color-text);color:var(--color-bg);border-color:var(--color-text)}
.nav{grid-area:nav;display:flex;align-items:center;justify-content:space-between;gap:8px;padding:0 10px 6px;min-width:0}
.nav .ib{border:1px solid var(--color-line-strong);background:var(--color-surface);font-size:15px}
.nav .go{background:var(--color-text);color:var(--color-bg);border-color:var(--color-text)}
.nav .ib:disabled{opacity:.35;cursor:default}
.lvl{min-width:0;min-height:var(--hit);padding:2px 10px;border-radius:22px;font:600 var(--text-small)/1.15 var(--font-sans);color:var(--color-muted);display:flex;align-items:center;gap:6px;text-align:left}
.lvl .st{white-space:nowrap}
.lvl .st{color:var(--color-accent);font-family:var(--font-mono)}

/* ---------- note, menu ---------- */
.note{position:fixed;top:54px;right:10px;z-index:20;max-width:min(300px,calc(100vw - 20px));background:var(--color-surface);border:1px solid var(--color-line);border-radius:14px;
  padding:12px 44px 12px 14px;font-size:var(--text-small);line-height:1.45;box-shadow:0 18px 36px -18px rgba(var(--shadow-ink),.45)}
.note[hidden]{display:none}
.note .x{position:absolute;top:0;right:0;width:var(--hit);height:var(--hit);font-size:20px}
.menu{position:fixed;inset:0;z-index:40;background:rgba(10,10,12,.4);display:flex;justify-content:flex-start}
.menu[hidden]{display:none}
.sheet{width:min(360px,92vw);height:100%;overflow:auto;overscroll-behavior:contain;background:var(--color-surface);padding:12px 16px 16px;display:flex;flex-direction:column;gap:6px}
.sheet .top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.sheet .top h2{margin-top:0}
.sheet .top .ib{font-size:22px}
.sheet h2{font:500 var(--text-small)/1.3 var(--font-mono);color:var(--color-muted);margin:12px 4px 4px}
.sheet .grid{display:flex;flex-direction:column;gap:2px}
.sheet button.it{min-height:var(--hit);text-align:left;padding:8px 12px;border-radius:12px;display:flex;justify-content:space-between;align-items:center;gap:10px;font-weight:600;font-size:var(--text-ui)}
.sheet button.it:hover,.sheet button.it.here{background:var(--color-line)}
.sheet button.it .st{font:500 .8125rem/1 var(--font-mono);color:var(--color-accent);white-space:nowrap}
.sheet .row{display:flex;gap:6px;flex-wrap:wrap}
.sheet .row button{min-height:var(--hit);padding:0 14px;border-radius:99px;border:1px solid var(--color-line-strong);font-weight:600;font-size:var(--text-small)}
.sheet .row button[aria-pressed="true"]{background:var(--color-text);color:var(--color-bg);border-color:var(--color-text)}
.sheet .quiet{font-size:var(--text-small);color:var(--color-muted);padding:4px}

/* ---------- breakpoints ---------- */
@media (orientation:landscape) and (max-height:520px){
  .app{grid-template-columns:minmax(0,1fr) minmax(250px,32%);grid-template-rows:auto minmax(0,1fr) auto;grid-template-areas:"bar bar" "stage panel" "stage nav"}
  .panel{justify-content:center;padding:4px 10px}
  .line{font-size:1rem}
  .nav{padding-bottom:6px}
}
@media (min-width:900px) and (min-height:600px){.bar{padding:10px 18px 4px}.nav{padding:4px 18px 14px}.panel{gap:12px}}
@media (max-width:420px){
  .answers{gap:6px;flex-wrap:nowrap;width:100%}.ans{padding:4px 11px;font-size:.875rem;flex:0 1 auto;min-width:0;line-height:1.15;text-align:center;justify-content:center}.ans.hasg{min-width:84px}
  .eng{gap:6px}.eng button{padding:0 9px;font-size:.75rem}
  .lvl{padding:0 4px;font-size:.78rem}
  .nav{gap:6px;padding:0 8px 6px}.nav .fab{padding:0 10px}
}

/* ---------- calm motion and reduced motion: no idle float, every change instant ----------
   transition: none (not a 0.01 ms transition), so sizes never lag one frame behind a change. */
[data-motion="calm"] .float,[data-motion="calm"] .shadow,[data-motion="calm"] .spin{animation:none}
[data-motion="calm"] *,[data-motion="calm"] *::before,[data-motion="calm"] *::after{transition:none!important}
[data-motion="calm"] .slip.enter,[data-motion="calm"] .mk.in,[data-motion="calm"] .tag.in,[data-motion="calm"] .scr .notif.in,[data-motion="calm"] .shake.buzz,[data-motion="calm"] .solid.pulse{animation:none}
[data-motion="calm"] .seal.in .ring{display:none}
@media (prefers-reduced-motion:reduce){.float,.shadow,.spin{animation:none!important}.seal.in .ring{display:none}}
</style>

function ledgerHTML(s,fx){

let lastCH='';

function describe(s){

/* ---------- ops: each changes the scene; animated ones run one at a time ----------
   Every animated op carries the run token it started with. After each pause it checks the token,
   and if the slide (or the player step) has changed it stops without touching the new scene. */
let runId=0;
const rectOf=el=>el.getBoundingClientRect();
/* each motion is time-bounded: if the page is in the background and animations or frames stall, the op still moves on */
const bounded=(p,ms)=>Promise.race([p,new Promise(r=>setTimeout(r,ms+120))]);
function animateEls(els,kf,ms,ease){return bounded(Promise.all(els.map(e=>e.animate(kf(e),{duration:ms,easing:ease,fill:'forwards'}).finished.catch(()=>{}))),ms);}
const EASE_OUT='cubic-bezier(.2,.7,.2,1)',EASE_IN='cubic-bezier(.5,0,.75,0)';
function countUp(from,to,ms,tok){
  return bounded(new Promise(res=>{const t0=performance.now();const f=now=>{if(tok!==runId){res();return;}const el=$('#rbal');const k=Math.min(1,(now-t0)/ms);const e=1-Math.pow(1-k,3);if(el)el.textContent=fmt(Math.round(from+(to-from)*e));k<1?requestAnimationFrame(f):res();};requestAnimationFrame(f);}),ms);
}
async function apply(op,anim,tok){
  const s=ST;
  anim=anim&&!calm();
  const gone=()=>anim&&tok!==undefined&&tok!==runId;
  const pause=async ms=>{if(anim)await wait(ms);return gone();};
  if(op.set){Object.assign(s,cloneST(op.set));render({tagIn:anim,notifIn:anim&&!!op.set.notif});if(anim&&await pause(op.hold||D.ui+120))return false;}
  if(op.g){const g={id:uid(),v:op.v,d:op.d,own:op.own,hatch:op.hatch};s['g'+op.g].push(g);render({enter:anim?[g.id]:[]});if(anim&&await pause(D.slip+120))return false;}
  if(op.rib){s.rib=cloneST(op.rib);render({ribIn:anim});if(anim&&await pause(D.ui+200))return false;}
  if(op.ribOut){
    if(anim){const els=[...document.querySelectorAll('#ledger .mk')];await animateEls(els,()=>[{opacity:1,transform:'none'},{opacity:0,transform:'translateY(-.6em) scaleY(.5)'}],D.fly,EASE_IN);if(gone())return false;}
    s.rib=null;render();
  }
  if(op.ribMark){if(s.rib)s.rib.mark=op.ribMark;render();if(anim&&await pause(D.ui))return false;}
  if(op.crack){
    const g={id:uid(),v:op.v,d:op.d,crack:true};s['g'+op.crack].push(g);render({enter:anim?[g.id]:[]});
    if(anim){if(await pause(D.slip+420))return false;
      const el=document.querySelector(`#ledger [data-id="${g.id}"]`);
      if(el)await animateEls([el],()=>[{opacity:1,transform:'none'},{transform:'translateX(-.25em)',offset:.2},{transform:'translateX(.25em)',offset:.4},{opacity:0,transform:'translateY(.8em) scale(.8)'}],D.fly,EASE_IN);
      if(gone())return false;}
    s['g'+op.crack]=s['g'+op.crack].filter(x=>x.id!==g.id);if(op.after)Object.assign(s,cloneST(op.after));render({tagIn:anim});if(anim&&await pause(D.ui))return false;
  }
  if(op.hatch){s.ga.forEach(g=>g.hatch=true);s.gr.forEach(g=>g.hatch=true);render();if(anim&&await pause(D.ui+100))return false;}
  if(op.commit){
    const only=op.only;
    const list=only?[(only==='a'?s.ga:s.gr).slice(-1)[0]].filter(Boolean):[...s.ga,...s.gr];
    if(anim&&list.length){
      const els=list.map(g=>document.querySelector(`#ledger .slip[data-id="${g.id}"]`)).filter(Boolean);
      await animateEls(els,e=>{const row=s.ga.some(g=>g.id===e.dataset.id)?'a':'r';const so=rectOf(document.querySelector(`#ledger .solid[data-row="${row}"]`)),r=rectOf(e);return [{transform:'none',opacity:1},{transform:`translateX(${so.left+so.width/2-(r.left+r.width/2)}px) scale(.7)`,opacity:0}];},D.merge,EASE_OUT);
      if(gone())return false;
    }
    const oldR=s.sr;
    if(!only||only==='a'){if(s.ga.length)s.sa=s.ga[s.ga.length-1].v;s.ga=[];}
    if(!only||only==='r'){if(s.gr.length)s.sr=s.gr[s.gr.length-1].v;s.gr=[];}
    if(!only){s.rib=null;s.rib2=null;}
    if(op.buzz)s.rview=oldR;
    if(op.seal)s.seal=cloneST(op.seal);
    render({pulse:anim,sealIn:anim&&!!op.seal});
    if(anim&&await pause(D.seal+160))return false;
    if(op.buzz){
      s.notif='Received '+fmt(op.buzz);render({notifIn:anim,buzz:anim});
      if(anim){if(await pause(D.notif*.6))return false;await countUp(oldR,s.sr,D.count,tok);if(gone())return false;}
      s.rview=null;render();
    }
    if(op.after){Object.assign(s,cloneST(op.after));render({tagIn:anim});}
  }
  if(op.fly!==undefined){
    const k=op.fly,who=op.who||'ar';
    const ga=who.includes('a')?s.ga.slice(k):[],gr=who.includes('r')?s.gr.slice(k):[];
    if(anim&&(ga.length||gr.length)){
      const tgt=rectOf($(op.dir==='r'?'#scrR':'#scrA'));
      const els=[...ga,...gr].map(g=>document.querySelector(`#ledger .slip[data-id="${g.id}"]`)).filter(Boolean);
      await animateEls(els,e=>{const r=rectOf(e);return [{transform:'none',opacity:1},{transform:`translate(${tgt.left+tgt.width/2-(r.left+r.width/2)}px,${tgt.top+tgt.height*.45-(r.top+r.height/2)}px) scale(.45)`,opacity:0}];},D.fly,EASE_IN);
      if(gone())return false;
    }
    if(who.includes('a'))s.ga=s.ga.slice(0,k);
    if(who.includes('r'))s.gr=s.gr.slice(0,k);
    if(op.ribToo||k===0&&who==='ar'){s.rib=null;s.rib2=null;}
    if(op.after)Object.assign(s,cloneST(op.after));
    render({tagIn:anim});
  }
  if(op.pause&&anim){if(await pause(op.pause))return false;}
  return true;
}
/* run a list of ops with animation; a newer run (or a slide change) cancels this one */
async function run(ops,anim){const my=++runId;for(const op of ops||[]){if(my!==runId)return false;const ok=await apply(op,anim,my);if(ok===false||my!==runId)return false;}return my===runId;}
/* apply ops at once (no awaits happen when anim is false, so this is synchronous) */
function runNow(ops){for(const op of ops||[])apply(op,false);}
</script>

<script>

/* ---------- layout: phones as large as the stage allows, screen text never below 11.5 px ----------
   Row (wide stage): Asha | ledger | Ravi. Stack (narrow): ledger on top, phones side by side below.
   Under 600 px wide the stack goes compact: total in the ledger header, SQL and Why? in the bottom nav.
   On laptops (viewport 1024 px and wider) the row keeps a clear margin of 4% of the width at each side. */
function layout(){
  const st=$('#stage'),w=$('#world'),c=$('#centre'),fabs=$('#fabs'),tg=$('#tags');
  const W=st.clientWidth,H=st.clientHeight;if(!W||!H)return;
  const putTags=where=>{if(where==='mid'){if(tg.parentNode!==$('#phones'))$('#phones').insertBefore(tg,$('#devR'));}else{if(tg.parentNode!==c)c.appendChild(tg);tg.style.width='';}w.classList.toggle('tmid',where==='mid');};
  const row=W/H>1.12&&W>=560;

  const wasC=COMPACT;COMPACT=!row&&W<600;w.classList.toggle('compact',COMPACT);
  const nav=$('.nav');
  if(COMPACT){if(fabs.parentNode!==nav)nav.insertBefore(fabs,$('#bNext'));fabs.className='fabs';}

  if(wasC!==COMPACT)render();

    const M=vw>=1024?Math.max(24,Math.round(vw*.04)):8;
    w.style.setProperty('--edge',M+'px');
    const Wa=W-2*M;
    pw=Math.min((H-cap-20)/2.2,Wa*.27); /* 2.2 = body 2.06 + caption gap .04 + idle float .028 + tilt reserve */
    const lf=Math.max(11.5,Math.min(16,(Wa-2*pw-64)/23));
    const minC=21.8*lf;
    if(Wa-2*pw-40<minC)pw=Math.max(110,(Wa-minC-40)/2);
    const cw=Math.min(32*lf,Wa-2*pw-40);
    w.style.setProperty('--lf',Math.max(11.5,Math.min(16,cw/22))+'px');
    w.style.setProperty('--gap',Math.max(16,Math.min(48,(Wa-2*pw-cw)/3))+'px');
    w.style.removeProperty('--fabpad');
    c.style.paddingBottom='52px';
  }else{
    c.style.paddingBottom='';
    const M=Math.max(8,Math.round(W*.03));
    w.style.setProperty('--edge',M+'px');
    let cw,lf;
    if(COMPACT){w.style.setProperty('--fabpad','0px');cw=W-16;lf=Math.max(11.5,Math.min(13.5,cw/24));}
    else{fabs.className='fabs corner';const fabW=Math.max(...[...fabs.querySelectorAll('.fab:not([hidden])')].map(b=>b.offsetWidth),44);
      w.style.setProperty('--fabpad',(fabW+6)+'px');cw=W-16-2*(fabW+6);lf=Math.max(11.5,Math.min(15,cw/21));}
    w.style.setProperty('--lf',lf+'px');
    $('#ledger').classList.toggle('narrow',cw/lf<20.5);
    /* compact and short of height: the tags move between the two phones (Asha | tags | Ravi) when that gives bigger phones */
    putTags('centre');
    const pwA=Math.min((W-2*M-12)/2.06,(H-c.offsetHeight-cap-14)/2.06);pw=pwA;
    let mid=false;
    if(COMPACT&&tg.children.length&&pwA<112){
      putTags('mid');
      const hLim=(H-c.offsetHeight-cap-14)/2.06;
      const pwB=Math.min(hLim,(W-2*M-16-104)/2);
      tg.style.width=Math.floor(W-2*M-16-2*pwB)+'px';
      if(pwB>pwA+4&&tg.offsetHeight<=2.06*pwB){pw=pwB;mid=true;}
      else putTags('centre');
    }
    w.style.setProperty('--pgap',mid?'8px':Math.max(8,Math.min(28,(W-2*pw)/3))+'px');
  }
  w.style.setProperty('--pw',Math.max(90,Math.floor(pw))+'px');
  document.querySelectorAll('.dev').forEach(d=>d.classList.toggle('small',pw<170));
  if(row){const L=$('#ledger');L.classList.remove('narrow');const lf=parseFloat(getComputedStyle(w).getPropertyValue('--lf'));if(L.clientWidth/lf<23.2)L.classList.add('narrow');}
  lastCH=sceneKey();
}
new ResizeObserver(()=>layout()).observe(document.getElementById('stage'));
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(()=>layout());

/* ---------- slide engine ---------- */
let cur=Math.max(0,Math.min(SL.length-1,P.i|0));
const player={k:0,playing:false,timer:null,wake:null,sess:0};
const engOf=s=>P.engPer&&P.engPer[s.id]||s.engDefault||P.eng||'mysql';
function conf(s){const e=s.eng&&s.eng[engOf(s)]||{};return Object.assign({},s,e,{why:e.why||s.why,ask:e.ask||s.ask});}
function answerKey(s){return s.eng&&s.eng[engOf(s)]&&s.eng[engOf(s)].ask?s.id+'@'+engOf(s):s.id;}

/* show(i, dir): dir 1 = arriving forward (the slide's own animation plays once), -1 = back (end state at once),
   0 = rebuild in place. Navigation is synchronous: it cancels any running animation or player step first. */
function show(i,dir,opt){
  opt=opt||{};runId++;stopPlayer();closePop();
  const fa=document.activeElement,zone=fa&&fa.closest?fa.closest('#answers,#player,#eng'):null;
  const fi=zone?[...zone.querySelectorAll('button,input')].indexOf(fa):-1,zoneId=zone?zone.id:null;
  cur=Math.max(0,Math.min(SL.length-1,i));P.i=cur;
  const s=SL[cur];if(s.id==='result')P.bonus=true;save();
  const c=conf(s);
  ST=c.st?c.st():base();
  const card=$('#card');
  if(s.card){card.hidden=false;card.innerHTML=s.card==='cheat'?cheatHTML():sourcesHTML();card.scrollTop=0;card.setAttribute('aria-label',s.card==='cheat'?'Cheat sheet':'Sources');$('#world').hidden=true;}
  else{card.hidden=true;card.innerHTML='';$('#world').hidden=false;}
  render();layout();
  $('#line').innerHTML=mark(s.line);
  buildPanel(s,c);updateChrome();layout();
  if(zoneId){const z=document.getElementById(zoneId),els=z?[...z.querySelectorAll('button:not([disabled]),input')]:[];(els[Math.min(fi,els.length-1)]||$('#bNext')).focus({preventScroll:true});}
  const a=P.ans[answerKey(s)];
  const solved=!!(c.ask&&a!=null&&(c.ask.kind==='guess'||c.ask.kind==='nav'||a===c.ask.ok));
  const rev=solved?[...(c.ask.reveal||[]),...(s.engineAfter?(c.after||[]):[])]:[];
  const tabOps=c.tab&&P.tab&&P.tab[s.id]!=null?c.tab[P.tab[s.id]]:[];
  if(opt.reveal){runNow(c.on);render();run([...rev,...tabOps],true);return;}
  if(c.on&&dir>0&&!solved){run(c.on,true);return;}
  runNow(c.on);runNow(rev);runNow(tabOps);render();
}
function buildPanel(s,c){
  // the hook player
  const pl=$('#player');pl.innerHTML='';
  if(s.player){
    pl.innerHTML=`<button class="pb" id="pRe" aria-label="Restart">${IC.restart}</button><button class="pb" id="pBk" aria-label="Step back">${IC.back}</button><button class="pb main" id="pPl" aria-label="Play">${IC.play}</button><button class="pb" id="pFw" aria-label="Step forward">${IC.fwd}</button><label class="scrub"><input type="range" id="pSc" min="0" max="${HOOK.length}" step="1" value="0" aria-label="Payment steps"><span id="pLb" aria-hidden="true">0/${HOOK.length}</span></label>`;
    player.k=0;syncPlayer();
    $('#pRe').onclick=()=>{stopPlayer();jump(0);};
    $('#pBk').onclick=()=>{stopPlayer();jump(player.k-1);};
    $('#pFw').onclick=()=>{stopPlayer();stepFwd();};
    $('#pPl').onclick=togglePlay;
    $('#pSc').oninput=e=>{stopPlayer();jump(+e.target.value);};
  }
  // the engine switch (bonus world only)
  const en=$('#eng');en.innerHTML='';
  const k=answerKey(s),a=P.ans[k];
  if(s.engine||(s.engineAfter&&a!=null)){
    en.innerHTML=Object.keys(ENG).map(e=>`<button data-e="${e}" aria-pressed="${engOf(s)===e}">${ENG[e]}</button>`).join('');
    en.querySelectorAll('button').forEach(b=>b.onclick=()=>{if(engOf(s)===b.dataset.e)return;P.engPer[s.id]=b.dataset.e;P.eng=b.dataset.e;save();show(cur,1);});
  }
  // answers, or the deadlock tabs
  const an=$('#answers');an.innerHTML='';
  if(c.tabs||s.tabs){
    const tabs=s.tabs,sel=P.tab[s.id];
    an.innerHTML=tabs.map((t,i)=>`<button class="ans tab" aria-pressed="${sel===i}" data-i="${i}">${esc(t)}</button>`).join('');
    an.querySelectorAll('button').forEach(b=>b.onclick=()=>{P.tab[s.id]=+b.dataset.i;save();ST=c.st();render();an.querySelectorAll('button').forEach(x=>x.setAttribute('aria-pressed',x===b));run(c.tab[+b.dataset.i],true);});
  } else if(c.ask){
    const A=c.ask;
    an.innerHTML=A.opts.map((t,i)=>{
      let cls='ans',mk='',dis='';
      let lab='';
      if(A.kind==='guess'&&P.guess===i){cls+=' saved hasg';mk='<span class="yg">saved</span>';lab=', your saved guess';}
      else if(a!=null&&A.kind!=='nav'&&A.kind!=='guess'){if(i===A.ok&&(a===A.ok)){cls+=' ok';mk='<span class="am">✓</span>';lab=', correct';}else if(P.tried[k]&&P.tried[k].includes(i)&&i!==A.ok){cls+=' no';mk='<span class="am">✕</span>';dis=' disabled';lab=', wrong';}}
      else if(A.kind!=='nav'&&A.kind!=='guess'&&P.tried[k]&&P.tried[k].includes(i)&&i!==A.ok){cls+=' no';mk='<span class="am">✕</span>';dis=' disabled';lab=', wrong';}
      const yg=A.showGuess&&P.guess===i?'<span class="yg">your guess</span>':'';
      if(yg){cls+=' hasg';lab+=', your guess from slide 3';}
      return `<button class="${cls}" data-i="${i}"${dis} aria-label="${esc(t+lab)}">${mk}${esc(t)}${yg}</button>`;
    }).join('');
    an.querySelectorAll('button').forEach(b=>b.onclick=()=>answer(s,c,+b.dataset.i,b));
  }
  // why + sql
  const why=c.why;const answeredOrNone=!c.ask||c.ask.kind==='guess'||c.ask.kind==='nav'||a===c.ask.ok;
  $('#bWhy').hidden=!why||!!s.card;$('#bWhy').setAttribute('aria-disabled',answeredOrNone?'false':'true');
  $('#bWhy').setAttribute('aria-label',answeredOrNone?'Why?':'Why? Answer first');
  $('#bWhy').innerHTML=answeredOrNone?'Why?':'Why? <svg viewBox="0 0 16 16" aria-hidden="true"><rect x="3" y="7" width="10" height="7" rx="1.8" fill="currentColor"/><path d="M5.3 7V5.2a2.7 2.7 0 0 1 5.4 0V7" fill="none" stroke="currentColor" stroke-width="1.6"/></svg>';
  $('#bSql').hidden=!(c.sql||s.sql)||!!s.card;
}
function answer(s,c,i,btn){
  const A=c.ask,k=answerKey(s);
  if(A.kind==='nav'){show(idx(A.go[i]),1);return;}
  if(A.kind==='guess'){P.guess=i;P.ans[k]=i;save();buildPanel(s,c);layout();const b=$(`#answers [data-i="${i}"]`);if(b)b.focus({preventScroll:true});return;}
  if(P.ans[k]===A.ok)return;

  if(P.tried[k].includes(i))return;
  const firstTry=!P.tried[k].length;P.tried[k].push(i);
  if(i===A.ok){
    if(firstTry&&P.first[s.id]===undefined)P.first[s.id]=true;
    P.ans[k]=i;
    if(A.thenEngine){P.engPer[s.id]=A.thenEngine;}
    save();show(cur,0,{reveal:true});
  } else {
    if(firstTry&&P.first[s.id]===undefined)P.first[s.id]=false;
    save();btn.classList.add('no');btn.insertAdjacentHTML('afterbegin','<span class="am">✕</span>');
    const nextBtn=[...$('#answers').querySelectorAll('button:not([disabled])')].find(x=>x!==btn);
    btn.disabled=true;btn.setAttribute('aria-label',btn.textContent.replace(/^✕/,'')+', wrong');if(nextBtn)nextBtn.focus({preventScroll:true});updateChrome();layout();
  }
}

/* ---------- the hook player (never autoplays) ---------- */
const IC={restart:'<svg viewBox="0 0 16 16" aria-hidden="true"><path d="M3 3v10M13 3L6 8l7 5z" fill="currentColor" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/></svg>',
  back:'<svg viewBox="0 0 16 16" aria-hidden="true"><path d="M11 3L5 8l6 5z" fill="currentColor"/></svg>',
  fwd:'<svg viewBox="0 0 16 16" aria-hidden="true"><path d="M5 3l6 5-6 5z" fill="currentColor"/></svg>',
  play:'<svg viewBox="0 0 16 16" aria-hidden="true"><path d="M4.5 2.5l9 5.5-9 5.5z" fill="currentColor"/></svg>',
  pause:'<svg viewBox="0 0 16 16" aria-hidden="true"><path d="M4 2.5h3v11H4zM9 2.5h3v11H9z" fill="currentColor"/></svg>',
  replay:'<svg viewBox="0 0 16 16" aria-hidden="true"><path d="M13 8a5 5 0 1 1-1.5-3.6" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/><path d="M12.5 1.5v3.4H9.1" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>'};
function hookState(k){ST=SL[0].st();for(let j=0;j<k;j++)runNow(HOOK[j].ops);render();}
function jump(k){runId++;k=Math.max(0,Math.min(HOOK.length,k));hookState(k);player.k=k;syncPlayer();}
/* one step forward: rebuild the finished state of the steps before it, then animate this step only */
async function stepFwd(){
  if(player.k>=HOOK.length)return false;
  const k=player.k;runId++;hookState(k);player.k=k+1;syncPlayer();
  return await run(HOOK[k].ops,true);
}
function syncPlayer(){
  const sc=$('#pSc');if(!sc)return;
  sc.value=player.k;sc.setAttribute('aria-valuetext',player.k?`Step ${player.k} of ${HOOK.length}: ${HOOK[player.k-1].n}`:'Start: nothing sent yet');
  const lb=$('#pLb');if(lb)lb.textContent=`${player.k}/${HOOK.length}`;
  const pl=$('#pPl');pl.innerHTML=player.playing?IC.pause:(player.k>=HOOK.length?IC.replay:IC.play);
  pl.setAttribute('aria-label',player.playing?'Pause':(player.k>=HOOK.length?'Replay':'Play'));
}
async function togglePlay(){
  if(player.playing){stopPlayer();return;}
  if(player.k>=HOOK.length)jump(0);
  const my=++player.sess;
  player.playing=true;syncPlayer();
  while(player.sess===my&&player.playing&&player.k<HOOK.length){
    const ok=await stepFwd();
    if(!ok||player.sess!==my||!player.playing||player.k>=HOOK.length)break;
    await new Promise(r=>{player.wake=r;player.timer=setTimeout(r,calm()?2200:700);});
  }
  if(player.sess===my){player.playing=false;player.wake=null;syncPlayer();}
}
function stopPlayer(){
  player.sess++;player.playing=false;clearTimeout(player.timer);
  if(player.wake){const w=player.wake;player.wake=null;w();}
  syncPlayer();
}

/* ---------- pop cards: SQL and Why? ---------- */
function openPop(kind){
  const s=SL[cur],c=conf(s),pop=$('#pop');
  if(pop.dataset.kind===kind&&!pop.hidden){closePop();return;}

    const en=(s.engine||s.engineAfter)?ENG[engOf(s)]:'MySQL 8.4';
    if($('#bWhy').getAttribute('aria-disabled')==='true'){pop.innerHTML=`<h3>Why?</h3><p>Answer first, then tap Why.</p><button class="x" aria-label="Close">&times;</button>`;}
    else{const w=c.why;pop.innerHTML=`<h3>Why? · ${esc(en)}</h3><p>${esc(w.t)}</p><div class="fchips">${factChips(w.f,w.m)||'<span class="chip">no fact on this slide</span>'}</div><button class="x" aria-label="Close">&times;</button>`;}
    pop.setAttribute('aria-label','Why');
  } else {
    const lines=(c.sql||s.sql||[]).slice(0,3);
    const en=(s.engine||s.engineAfter)?ENG[engOf(s)]:'MySQL 8.4';
    const sf=c.sf||s.sf||[];
    pop.innerHTML=`<h3>SQL · ${esc(en)}</h3>${lines.map(l=>`<pre>${esc(l)}</pre>`).join('')}${sf.length?`<div class="fchips">${factChips(sf)}</div>`:''}<button class="x" aria-label="Close">&times;</button>`;pop.setAttribute('aria-label','SQL');
  }
  pop.dataset.kind=kind;pop.hidden=false;
  $('#bWhy').setAttribute('aria-expanded',kind==='why');$('#bSql').setAttribute('aria-expanded',kind==='sql');
  pop.querySelector('.x').onclick=()=>{closePop();$(kind==='why'?'#bWhy':'#bSql').focus({preventScroll:true});};
  pop.querySelector('.x').focus({preventScroll:true});
}
/* fact chips "F70 · S10"; a medium-confidence fact gets the dashed chip */
function factChips(fs,med){return fs.map(f=>{const m=(med||[]).includes(f);const src=(FACTS[f]||[[]])[0];return `<span class="chip${m?' med':''}" title="Fact ${f}, source ${src.join(', ')}${m?', medium confidence':''}">${f} · ${src.join(' ')}${m?' · medium':''}</span>`;}).join('');}
function closePop(){const p=$('#pop');p.hidden=true;p.dataset.kind='';$('#bWhy').setAttribute('aria-expanded','false');$('#bSql').setAttribute('aria-expanded','false');}
$('#bWhy').onclick=()=>openPop('why');$('#bSql').onclick=()=>openPop('sql');

/* ---------- cheat sheet + sources (the only cards that scroll) ---------- */
function chips(fs){return fs.map(f=>`<span class="chip">${f}</span>`).join(' ');}
function cheatHTML(){

  <div><h3>MySQL 8.4 <span class="tag eng">main path</span></h3>${row('START TRANSACTION;   -- or BEGIN',['F70','F18'])}${row('COMMIT;',['F70'])}${row('ROLLBACK;',['F70'])}${row('SAVEPOINT tip;',['F71'])}${row('ROLLBACK TO SAVEPOINT tip;',['F71','F36'])}${row('RELEASE SAVEPOINT tip;',['F71','F36'])}${row('SET [GLOBAL | SESSION] TRANSACTION\n  ISOLATION LEVEL READ COMMITTED;',['F73'])}</div>
  <div><h3>PostgreSQL 18</h3>${row('BEGIN;',['F75'])}${row('SAVEPOINT tip;',['F75'])}${row('ROLLBACK TO SAVEPOINT tip;',['F75'])}${row('RELEASE SAVEPOINT tip;',['F75'])}${row('SET TRANSACTION ISOLATION LEVEL\n  SERIALIZABLE;   -- after BEGIN, before the first query',['F76','F47'])}</div>
  <div><h3>Oracle 19c</h3>${row('-- no BEGIN: the first executable\n-- SQL statement starts it',['F22'])}${row('SAVEPOINT tip;',['F79'])}${row('ROLLBACK TO SAVEPOINT tip;',['F79'])}${row('SET TRANSACTION READ ONLY;   -- first statement',['F79','F50'])}</div></div>`;
}
function sourcesHTML(){
  const used={};SL.forEach(s=>{const ws=[s.why,...(s.eng?Object.values(s.eng).map(e=>e.why):[])].filter(Boolean);ws.forEach(w=>w.f.forEach(f=>used[f]=1));
    [s.sf,...(s.eng?Object.values(s.eng).map(e=>e.sf):[])].filter(Boolean).forEach(fs=>fs.forEach(f=>used[f]=1));});
  ['F70','F18','F71','F36','F73','F75','F76','F47','F22','F79','F50'].forEach(f=>used[f]=1);
  const bySrc={};Object.keys(used).forEach(f=>(FACTS[f]?FACTS[f][0]:[]).forEach(sid=>{(bySrc[sid]=bySrc[sid]||[]).push(f);}));
  const ids=Object.keys(bySrc).sort((a,b)=>+a.slice(1)-+b.slice(1));
  return `<h2>Sources</h2><p class="lead">Opened 2026-11-02; S54–S65 opened 2026-11-03. Links leave this site.</p>`+ids.map(id=>{const r=SRC[id];return `<div class="src"><span><span class="chip">${id}</span> <a href="${esc(r[3])}" target="_blank" rel="noopener noreferrer">${esc(r[0])}</a></span><small>${esc(r[1])} · ${esc(r[2])}</small><span>${chips(bySrc[id].sort((a,b)=>+a.slice(1)-+b.slice(1)))}</span></div>`;}).join('');
}

/* ---------- chrome: progress, stars, level ---------- */
function updateChrome(){
  const s=SL[cur],list=SEC[s.sec],n=list.indexOf(s)+1;
  const label=s.sec==='main'?`${n} / ${list.length}`:s.sec==='bonus'?`Bonus ${n} / ${list.length}`:`Extra ${n} / ${list.length}`;
  $('#count').textContent=label;$('#trackFill').style.width=(n/list.length*100)+'%';
  const tr=$('#track');tr.setAttribute('aria-valuemax',list.length);tr.setAttribute('aria-valuenow',n);tr.setAttribute('aria-valuetext',label);
  const got=Object.values(P.first).filter(Boolean).length;

  $('#lvlName').textContent=s.lvl;
  const ls=starsIn(levelOf(s));$('#lvlStars').textContent=ls.max?'★'.repeat(ls.got)+'☆'.repeat(ls.max-ls.got):'';
  $('#bLvl').setAttribute('aria-label',`Level: ${s.lvl}${ls.max?`, ${ls.got} of ${ls.max} stars`:''}. Open the level menu`);
  $('#bPrev').disabled=cur===0;$('#bNext').disabled=cur===SL.length-1;
  $('#slide').setAttribute('aria-label',`${label}: ${s.lvl}`);
}

/* ---------- menu ---------- */
function openMenu(){
  const lv=[];SL.forEach(s=>{if(!lv.find(x=>x.lvl===s.lvl))lv.push(s);});
  const btn=s=>{const st=starsIn(levelOf(s));const here=SL[cur].lvl===s.lvl;return `<button data-go="${s.id}" class="it${here?' here':''}"${here?' aria-current="true"':''}><span>${esc(s.lvl)}</span><span class="st" aria-hidden="true">${st.max?'★'.repeat(st.got)+'☆'.repeat(st.max-st.got):''}</span>${st.max?`<span class="vh">, ${st.got} of ${st.max} stars</span>`:''}</button>`;};
  $('#sheet').innerHTML=`<div class="top"><h2>Main path · MySQL 8.4</h2><button class="ib" id="mX" aria-label="Close menu">&times;</button></div><div class="grid">${lv.filter(s=>s.sec==='main').map(btn).join('')}</div>
  <h2>Bonus world ${P.bonus?'· open':'· opens after the quiz (peek anytime)'}</h2><div class="grid">${lv.filter(s=>s.sec==='bonus').map(btn).join('')}</div>
  <h2>Extras</h2><div class="grid">${lv.filter(s=>s.sec==='end').map(btn).join('')}</div>
  <h2>Settings</h2><div class="row"><button id="mTheme">Theme: ${P.theme}</button><button id="mCalm" aria-pressed="${!!P.calm}">Calm motion: ${P.calm?'on':(mq.matches?'on (system)':'off')}</button><button id="mReset">Start over</button></div>${storageOK?'':'<p class="quiet">This browser is not saving progress, so stars reset when you leave.</p>'}`;
  const wasOpen=!$('#menu').hidden;
  $('#menu').hidden=false;$('#bMenu').setAttribute('aria-expanded','true');
  if(!wasOpen)$('#mX').focus();
  $('#sheet').querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>{closeMenu();show(idx(b.dataset.go),1);});
  $('#mX').onclick=closeMenu;
  $('#mTheme').onclick=()=>{cycleTheme();openMenu();$('#mTheme').focus();};
  $('#mCalm').onclick=()=>{P.calm=!P.calm;applyPrefs();save();openMenu();$('#mCalm').focus();};
  $('#mReset').onclick=()=>{P=Object.assign(P,{i:0,ans:{},first:{},tried:{},guess:null,bonus:false,tab:{},engPer:{},eng:'mysql'});save();closeMenu();show(0,1);};
}
function closeMenu(){if($('#menu').hidden)return;$('#menu').hidden=true;$('#bMenu').setAttribute('aria-expanded','false');$('#bMenu').focus();}
$('#bMenu').onclick=openMenu;$('#bLvl').onclick=openMenu;
$('#menu').addEventListener('click',e=>{if(e.target.id==='menu')closeMenu();});
$('#menu').addEventListener('keydown',e=>{
  if(e.key!=='Tab')return;
  const f=[...$('#sheet').querySelectorAll('button')];if(!f.length)return;
  const first=f[0],last=f[f.length-1];
  if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus();}
  else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus();}
});

/* ---------- theme, note, calm motion ---------- */
function applyPrefs(){if(P.theme==='auto')root.removeAttribute('data-theme');else root.setAttribute('data-theme',P.theme);if(P.calm)root.setAttribute('data-motion','calm');else root.removeAttribute('data-motion');$('#bTheme').setAttribute('aria-label','Theme: '+P.theme);}
function cycleTheme(){P.theme={auto:'light',light:'dark',dark:'auto'}[P.theme]||'auto';applyPrefs();save();}
$('#bTheme').onclick=cycleTheme;
$('#bNote').onclick=()=>{const n=$('#note');n.hidden=!n.hidden;$('#bNote').setAttribute('aria-expanded',!n.hidden);};
$('#bNoteX').onclick=()=>{$('#note').hidden=true;$('#bNote').setAttribute('aria-expanded','false');$('#bNote').focus();};
const onMotionChange=()=>{if(!$('#menu').hidden){openMenu();}};
if(mq.addEventListener)mq.addEventListener('change',onMotionChange);else if(mq.addListener)mq.addListener(onMotionChange);

/* ---------- navigation: buttons, keys, swipe. Each press moves exactly one slide. ---------- */
const next=()=>{if(cur<SL.length-1)show(cur+1,1);};
const prev=()=>{if(cur>0)show(cur-1,-1);};
$('#bNext').onclick=next;$('#bPrev').onclick=prev;
document.addEventListener('keydown',e=>{
  if(e.altKey||e.ctrlKey||e.metaKey)return;
  if(e.key==='Escape'){if(!$('#menu').hidden){closeMenu();return;}if(!$('#pop').hidden){const k=$('#pop').dataset.kind;closePop();$(k==='why'?'#bWhy':'#bSql').focus({preventScroll:true});return;}if(!$('#note').hidden){$('#note').hidden=true;$('#bNote').setAttribute('aria-expanded','false');$('#bNote').focus();}return;}
  if(!$('#menu').hidden)return;
  const t=e.target,inRange=t&&t.type==='range';
  const isNext=e.key==='ArrowRight'||e.key==='PageDown',isPrev=e.key==='ArrowLeft'||e.key==='PageUp';
  if((isNext||isPrev)&&!inRange){e.preventDefault();if(e.repeat)return;isNext?next():prev();}
  else if(e.key===' '&&SL[cur].player&&!(t&&(t.tagName==='BUTTON'||t.tagName==='INPUT'||t.tagName==='A'))){e.preventDefault();if(!e.repeat)togglePlay();}
});
let sw=null,lastSwipe=0;
const slideEl=$('#slide');
slideEl.addEventListener('pointerdown',e=>{if(e.button>0||!e.isPrimary)return;if(e.target.closest('input,.card,.pop')){sw=null;return;}sw={x:e.clientX,y:e.clientY,id:e.pointerId};});
window.addEventListener('pointerup',e=>{
  if(!sw||e.pointerId!==sw.id)return;
  const dx=e.clientX-sw.x,dy=e.clientY-sw.y;sw=null;
  if(Math.abs(dx)>50&&Math.abs(dx)>Math.abs(dy)*1.4){lastSwipe=Date.now();dx<0?next():prev();}
});
window.addEventListener('pointercancel',()=>{sw=null;});
slideEl.addEventListener('click',e=>{if(Date.now()-lastSwipe<450){e.stopPropagation();e.preventDefault();}},true);

applyPrefs();
show(cur,0);
</script>
</body>
</html>
