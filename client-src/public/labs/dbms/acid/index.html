:.88em;line-height:1.25}\n.bill .tx small{display:block;font-size:.72em;color:#5D6B72}\n.bill .tx small.warn{color:#B42A20;font-weight:600}\n.bill .amt{font-weight:700;font-size:.9em;margin-right:.2em;white-space:nowrap}\n.pbtn{border:0;border-radius:.6em;padding:.5em .9em;background:#0E7C66;color:#fff;font-weight:700;font-size:.8em;white-space:nowrap}\n.pbtn:disabled{background:#B8C6C2}\n.chip{font-size:.72em;font-weight:700;padding:.35em .6em;border-radius:.5em;white-space:nowrap}\n.chip.paid{background:#E5F4EB;color:#1D8048}\n.bill.lost{box-shadow:inset 0 0 0 2px #E58A82}\n.view.center{display:flex;flex-direction:column;text-align:center;justify-content:center;align-items:center;padding:1.3em}\n.big{width:3.6em;height:3.6em;border-radius:50%;display:grid;place-items:center;font-size:1.4em;font-weight:800;margin:0 auto .7em}\n.big.ok{background:#E5F4EB;color:#1D8048}\n.big.bad{background:#FCE9E7;color:#C3362C}\n.center p{margin:.2em 0;font-size:.86em;color:#4E5B62;line-height:1.45}\n.center .t{font-size:1.3em;font-weight:800;color:#14222A;margin-bottom:.15em}\n.receipt{margin-top:.9em;background:#fff;border-radius:.9em;padding:.7em .9em;font-size:.78em;width:100%;text-align:left}\n.receipt div{display:flex;justify-content:space-between;gap:.6em;padding:.12em 0}\n.receipt span:first-child{color:#5D6B72}\n.receipt span:last-child{font-family:var(--mono);font-weight:500}\n.spinner{width:2.8em;height:2.8em;border-radius:50%;border:.3em solid #D7EEE8;border-top-color:#0E7C66;animation:spin .9s linear infinite;margin:0 auto .9em}\n.cta{background:#fff;padding:.7em .8em .9em;border-top:1px solid #E3EAE8}\n.cta button{width:100%;border:0;border-radius:.8em;padding:.85em;font-weight:700;font-size:.95em;background:#0E7C66;color:#fff}\n.toast{position:absolute;left:.8em;right:.8em;bottom:.9em;background:#14222A;color:#fff;border-radius:.8em;padding:.65em .85em;font-size:.78em;font-weight:600;line-height:1.4;animation:drop .35s ease;z-index:2}\n.toast.bad{background:#B42A20}\n\n/* ---------- Server ---------- */\n.server{background:var(--server);color:var(--server-ink);border-radius:18px;padding:22px;position:relative;overflow:hidden;transition:background .3s}\n.srv-head{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}\n.srv-head h2{margin:0;font-size:1.25rem;line-height:1.2;color:#fff}\n.srv-head small{color:var(--server-dim);font-size:.85rem}\n.status{display:inline-flex;align-items:center;gap:8px;font-weight:600;font-size:.88rem;padding:6px 12px;border-radius:99px;background:rgba(76,194,127,.15);color:#7FE0A6}\n.status i{width:9px;height:9px;border-radius:50%;background:currentColor}\n.status.off{background:rgba(240,108,98,.15);color:#FF9A92}\n.status.boot{background:rgba(240,178,74,.15);color:#F5C673}\n.status.on i{animation:blink 1.6s ease-in-out infinite}\n.power{display:flex;gap:10px;margin:18px 0}\n.power button{flex:1;border:0;border-radius:12px;padding:14px;font-weight:700;font-size:1.02rem}\n.cut{background:#E5483D;color:#fff}\n.cut:hover:not(:disabled){filter:brightness(1.08)}\n.restart{background:#2FA36B;color:#fff}\n.power button:disabled{opacity:.35}\n.boxes{display:grid;grid-template-columns:1fr 1fr;gap:12px;transition:opacity .4s}\n.box{background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);border-radius:14px;padding:14px;min-height:190px}\n.box h3{margin:0 0 10px;font-size:.98rem;color:#fff;display:flex;align-items:center;gap:8px}\n.box h3 .em{font-size:1.2rem}\n.items{display:grid;gap:7px}\n.item{display:flex;justify-content:space-between;gap:8px;background:rgba(255,255,255,.08);border-radius:9px;padding:8px 10px;font-size:.88rem;animation:fade .35s ease}\n.item b{font-weight:600}\n.item span{font-family:var(--mono);font-size:.82rem;color:var(--server-dim)}\n.item.saving{outline:1.5px dashed #F5C673;animation:pulse 1s ease-in-out infinite}\n.empty{color:var(--server-dim);font-size:.88rem}\n.saver{margin-top:14px;font-size:.9rem;color:var(--server-dim);min-height:1.5em}\n.saver b{color:#F5C673;font-family:var(--mono);font-weight:500}\n.sbarline{height:6px;border-radius:99px;background:rgba(255,255,255,.1);overflow:hidden;margin-top:6px}\n.sbarline i{display:block;height:100%;background:#F5C673;transition:width 1s linear}\n.server.dark{background:#06090D}\n.server.dark .mem{opacity:.25}\n.server.dark .disk{opacity:.6}\n.flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none}\n.flash.go{animation:flash .5s ease}\n.again{margin-top:16px;border:1px solid rgba(255,255,255,.18);background:transparent;color:var(--server-ink);border-radius:10px;padding:9px 14px;font-size:.88rem;font-weight:500;width:100%}\n\n/* ---------- Below ---------- */\n.below{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:22px;margin-top:26px}\n.panel{background:var(--bg);border-radius:18px;padding:20px}\n.panel h3{margin:0 0 10px;font-size:1.05rem}\n.timeline{list-style:none;margin:0;padding:0;display:grid;gap:8px;max-height:300px;overflow:auto}\n.timeline li{display:grid;grid-template-columns:auto 1fr;gap:10px;font-size:.9rem;align-items:baseline}\n.timeline time{font:500 .78rem var(--mono);color:var(--muted)}\n.timeline b.r{color:#0E7C66}\n.timeline b.s{color:var(--accent)}\n.timeline li.bad span{color:var(--bad)}\n.timeline .none{color:var(--muted);display:block}\n.tasks ol{list-style:none;margin:0;padding:0;display:grid;gap:9px;counter-reset:t}\n.tasks li{display:flex;gap:10px;align-items:flex-start;font-size:.93rem;counter-increment:t}\n.tasks li::before{content:counter(t);flex:none;width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font-size:.78rem;font-weight:700;background:var(--soft);color:var(--muted)}\n.tasks li.done{color:var(--muted)}\n.tasks li.done::before{content:\"✓\";background:var(--ok);color:#fff}\n.tag{font-size:.72rem;font-weight:700;padding:2px 7px;border-radius:99px;margin-left:4px;vertical-align:1px;white-space:nowrap}\n.tag.r{background:var(--ok-soft);color:var(--ok)}\n.tag.w{background:var(--bad-soft);color:var(--bad)}\n.alldone{margin:12px 0 0;font-weight:600;color:var(--ok);display:none}\n.alldone.show{display:block}\n\nfooter{border-top:1px solid var(--line);padding:26px 0 40px;background:var(--bg)}\n.chapters{max-width:1060px;margin:0 auto;padding:0 22px;display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;font-weight:600;color:var(--muted)}\n.chapters a{color:var(--accent);text-decoration:none}\n\n@keyframes spin{to{transform:rotate(360deg)}}\n@keyframes fade{from{opacity:0}to{opacity:1}}\n@keyframes drop{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:none}}\n@keyframes blink{50%{opacity:.35}}\n@keyframes pulse{50%{opacity:.55}}\n@keyframes flash{0%{opacity:.9}100%{opacity:0}}\n@media (prefers-reduced-motion:reduce){*{animation:none !important;transition:none !important}.spinner{border-left-color:#0E7C66}}\n\n@media (max-width:860px){\n  .stage{grid-template-columns:minmax(0,1fr)}\n  .stage > div{min-width:0}\n  .phone-col{max-width:330px;margin:0 auto;width:100%}\n  .below{grid-template-columns:minmax(0,1fr)}\n}\n@media (max-width:520px){\n  .wrap{padding:32px 14px 44px}\n  .seg button{padding:10px 14px}\n  .server{padding:16px}\n  .boxes{grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:8px}\n  .box{padding:10px;min-height:150px}\n  .item{flex-direction:column;gap:0;font-size:.82rem}\n}\n.site-nav{max-width:1060px;margin:0 auto;padding:0 22px;display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap;font-weight:600}\n.site-nav a{color:var(--accent);text-decoration:none}\n.site-nav a:hover{text-decoration:underline}\n.site-nav .gap{min-width:1px}\n\u003c/style>\n\u003c/head>\n\u003cbody>\n\n\u003cmain class=\"wrap\">\n  \u003cdiv class=\"intro\">\n    \u003ch1>11:58 PM, two minutes to midnight\u003c/h1>\n    \u003cp>Ravi has three bills due tonight. He pays them from his phone while a bank server far away keeps track. Cut the server’s power whenever you like, then switch it back on and see what’s left of Ravi’s payments.\u003c/p>\n  \u003c/div>\n\n  \u003cdiv class=\"modes\">\n    \u003cdiv class=\"seg\" role=\"group\" aria-label=\"Bank system\">\n      \u003cbutton class=\"right\" data-mode=\"right\" aria-pressed=\"true\">✅ Right way\u003c/button>\n      \u003cbutton class=\"wrong\" data-mode=\"wrong\" aria-pressed=\"false\">⚠️ Wrong way\u003c/button>\n    \u003c/div>\n  \u003c/div>\n  \u003cdiv class=\"mode-note\" id=\"modeNote\" aria-live=\"polite\">\u003c/div>\n\n  \u003cdiv class=\"stage\">\n    \u003cdiv class=\"phone-col\">\n      \u003cdiv class=\"who\">Ravi\u003csmall>Chennai\u003c/small>\u003c/div>\n      \u003cdiv class=\"phone\">\u003cdiv class=\"screen\" id=\"phone\">\u003c/div>\u003c/div>\n    \u003c/div>\n\n    \u003cdiv>\n      \u003cdiv class=\"who\">The bank\u003csmall>Server room, Mumbai\u003c/small>\u003c/div>\n      \u003cdiv class=\"server\" id=\"server\">\n        \u003cdiv class=\"flash\" id=\"flash\">\u003c/div>\n        \u003cdiv class=\"srv-head\">\n          \u003cdiv>\u003ch2>Bank server\u003c/h2>\u003csmall>Keeps every payment\u003c/small>\u003c/div>\n          \u003cspan class=\"status on\" id=\"status\">\u003ci>\u003c/i>\u003cspan id=\"statusText\">Running\u003c/span>\u003c/span>\n        \u003c/div>\n        \u003cdiv class=\"power\">\n          \u003cbutton class=\"cut\" id=\"cutBtn\">⚡ Power cut\u003c/button>\n          \u003cbutton class=\"restart\" id=\"restartBtn\" disabled>🔌 Switch on\u003c/button>\n        \u003c/div>\n        \u003cdiv class=\"boxes\">\n          \u003cdiv class=\"box mem\">\u003ch3>\u003cspan class=\"em\" aria-hidden=\"true\">🧠\u003c/span>Memory\u003c/h3>\u003cdiv class=\"items\" id=\"mem\">\u003c/div>\u003c/div>\n          \u003cdiv class=\"box disk\">\u003ch3>\u003cspan class=\"em\" aria-hidden=\"true\">💾\u003c/span>Disk\u003c/h3>\u003cdiv class=\"items\" id=\"disk\">\u003c/div>\u003c/div>\n        \u003c/div>\n        \u003cdiv class=\"saver\" id=\"saver\">\u003c/div>\n        \u003cbutton class=\"again\" id=\"againBtn\">Start again\u003c/button>\n      \u003c/div>\n    \u003c/div>\n  \u003c/div>\n\n  \u003cdiv class=\"below\">\n    \u003cdiv class=\"panel\">\n      \u003ch3>What happened\u003c/h3>\n      \u003col class=\"timeline\" id=\"timeline\">\u003cli class=\"none\">Pay a bill on Ravi’s phone.\u003c/li>\u003c/ol>\n    \u003c/div>\n    \u003cdiv class=\"panel tasks\">\n      \u003ch3>Try this\u003c/h3>\n      \u003col id=\"tasks\">\n        \u003cli data-t=\"1\">Pay a bill. Then cut the power and switch it back on \u003cspan class=\"tag r\">Right way\u003c/span>\u003c/li>\n        \u003cli data-t=\"2\">Cut the power while a payment is still loading \u003cspan class=\"tag r\">Right way\u003c/span>\u003c/li>\n        \u003cli data-t=\"3\">Pay a bill and cut the power quickly, before the save. Switch it back on \u003cspan class=\"tag w\">Wrong way\u003c/span>\u003c/li>\n        \u003cli data-t=\"4\">Pay a bill, wait for the save, then cut the power and switch it back on \u003cspan class=\"tag w\">Wrong way\u003c/span>\u003c/li>\n      \u003c/ol>\n      \u003cp class=\"alldone\" id=\"alldone\">All done. Which bank would you trust at 11:58 PM?\u003c/p>\n    \u003c/div>\n  \u003c/div>\n\u003c/main>\n\n\u003cfooter>\n  \u003cnav class=\"site-nav\" aria-label=\"Chapters\">\n    \u003ca href=\"isolation.html\">← Previous: Last phone sale\u003c/a>\n    \u003ca href=\"index.html\">All chapters\u003c/a>\n    \u003ca href=\"index.html\">Back to the start →\u003c/a>\n  \u003c/nav>\n\u003c/footer>\n\n\u003cscript>\n(() => {\n  const $ = s => document.querySelector(s);\n  const BILLS = [\n    {id:'e', name:'Electricity bill', sub:'Chennai, home', icon:'⚡', amt:1200},\n    {id:'m', name:'Mobile recharge', sub:'98XXX XX210, 28 days', icon:'📶', amt:299},\n    {id:'b', name:'Broadband', sub:'100 Mbps plan', icon:'🌐', amt:589}\n  ];\n  const SAVE_EVERY = 12;\n  const money = n => '₹' + n.toLocaleString('en-IN');\n  const bill = id => BILLS.find(b => b.id === id);\n  const done = new Set();\n  let S, clock, timers = [], ticker = null;\n\n  function fresh(mode) {\n    timers.forEach(clearTimeout); timers = [];\n    clock = 23 * 3600 + 58 * 60;\n    S = {\n      mode, power:'on', memory:[], disk:[], saving:null, saveIn:SAVE_EVERY,\n      app: Object.fromEntries(BILLS.map(b => [b.id, 'due'])),\n      refs: {}, screen:'home', current:null, toast:null, events:[]\n    };\n  }\n\n  function stamp() {\n    clock += 2 + Math.floor(Math.random() * 4);\n    const h = Math.floor(clock / 3600) % 24, m = Math.floor(clock / 60) % 60, s = clock % 60;\n    const hh = h > 12 ? h - 12 : h;\n    return `${hh}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')} PM`;\n  }\n  const log = (who, text, bad) => S.events.push({t:stamp(), who, text, bad});\n  const later = (fn, ms) => timers.push(setTimeout(fn, ms));\n\n  /* ---------- Actions ---------- */\n  function pay(id) {\n    if (S.power !== 'on' || S.screen !== 'home') return;\n    const b = bill(id);\n    S.current = id; S.screen = 'processing';\n    S.refs[id] = String(6021000000 + Math.floor(Math.random() * 899999999)).replace(/(\\d{4})(\\d{4})(\\d+)/, '$1 $2 $3');\n    log('r', `tapped Pay for the ${b.name.toLowerCase()} (${money(b.amt)}).`);\n    S.memory.push(id);\n\n    if (S.mode === 'right') {\n      S.saving = id;\n      render();\n      later(() => {\n        if (S.power !== 'on' || S.saving !== id) return;\n        S.disk.push(id); S.saving = null;\n        S.app[id] = 'paid'; S.screen = 'success';\n        log('s', `wrote the ${b.name.toLowerCase()} payment to disk, then replied “Payment successful”.`);\n        render();\n      }, 2200);\n    } else {\n      render();\n      later(() => {\n        if (S.power !== 'on') return;\n        S.app[id] = 'paid'; S.screen = 'success';\n        log('s', `replied “Payment successful” right away. The payment is only in memory for now.`);\n        render();\n      }, 500);\n    }\n  }\n\n  function cut() {\n    if (S.power !== 'on') return;\n    S.power = 'off';\n    const inMem = S.memory.length;\n    S.memory = [];\n    $('#flash').classList.remove('go'); void $('#flash').offsetWidth; $('#flash').classList.add('go');\n    log('s', `lost power. Memory is wiped${inMem ? ` (${inMem} payment${inMem > 1 ? 's' : ''} were in it)` : ''}.`, true);\n    if (S.screen === 'processing') {\n      const id = S.current;\n      if (S.mode === 'right') {\n        S.saving = null; S.screen = 'failed';\n        log('r', `saw “Payment failed. No money was taken.”`);\n        done.add(2);\n      } else {\n        S.screen = 'failed';\n      }\n      S.app[id] = 'due';\n    }\n    render();\n  }\n\n  function restart() {\n    if (S.power !== 'off') return;\n    S.power = 'boot';\n    render();\n    later(() => {\n      S.power = 'on';\n      S.memory = [...S.disk];\n      S.saveIn = SAVE_EVERY;\n      const found = S.disk.length;\n      log('s', `is back on. It read the disk and found ${found} payment${found === 1 ? '' : 's'}.`);\n      const lost = BILLS.filter(b => S.app[b.id] === 'paid' && !S.disk.includes(b.id));\n      const kept = BILLS.filter(b => S.app[b.id] === 'paid' && S.disk.includes(b.id));\n      lost.forEach(b => {\n        S.app[b.id] = 'lost';\n        log('r', `checked the ${b.name.toLowerCase()}. The receipt says paid, but the bank has no record. Still unpaid.`, true);\n      });\n      if (lost.length) {\n        S.screen = 'home';\n        S.toast = {bad:true, text:`⚠ Your ${lost.map(b => b.name.toLowerCase()).join(' and ')} ${lost.length > 1 ? 'are' : 'is'} still unpaid. A ₹100 late fee applies after midnight.`};\n        later(() => { S.toast = null; render(); }, 5000);\n        if (S.mode === 'wrong') done.add(3);\n      } else if (kept.length) {\n        log('r', `checked the app. Every paid bill still shows Paid.`);\n      }\n      if (kept.length && S.mode === 'right') done.add(1);\n      if (kept.length && S.mode === 'wrong') done.add(4);\n      render();\n    }, 1500);\n  }\n\n  function tick() {\n    if (S.mode !== 'wrong' || S.power !== 'on') return;\n    S.saveIn -= 1;\n    if (S.saveIn \u003c= 0) {\n      const fresh = S.memory.filter(id => !S.disk.includes(id));\n      if (fresh.length) {\n        S.disk.push(...fresh);\n        log('s', `saved memory to disk (${fresh.map(id => bill(id).name.toLowerCase()).join(', ')}).`);\n      }\n      S.saveIn = SAVE_EVERY;\n      render();\n    } else {\n      renderSaver();\n    }\n  }\n\n  /* ---------- Rendering ---------- */\n  function phoneHtml() {\n    const due = BILLS.filter(b => S.app[b.id] !== 'paid').length;\n    let head = `\u003cdiv class=\"sbar\">\u003cspan>11:58\u003c/span>\u003cspan>▮▮▮ 4G\u003c/span>\u003c/div>\n      \u003cdiv class=\"apphead\">\u003cspan class=\"logo\">QuickPay\u003c/span>\u003cspan class=\"avatar\">R\u003c/span>\u003c/div>`;\n    const offline = S.power !== 'on' ? `\u003cdiv class=\"offline\">\u003cspan aria-hidden=\"true\">⚠\u003c/span>Can’t reach your bank right now.\u003c/div>` : '';\n    const toast = S.toast ? `\u003cdiv class=\"toast ${S.toast.bad ? 'bad' : ''}\">${S.toast.text}\u003c/div>` : '';\n    let v = '', cta = '';\n\n    if (S.screen === 'home') {\n      head += `\u003cdiv class=\"hello\">\u003cb>Hi Ravi\u003c/b>\u003csmall>${due ? `${due} bill${due > 1 ? 's' : ''} due before midnight` : 'All bills paid. Good night!'}\u003c/small>\u003c/div>`;\n      v = `\u003cdiv class=\"view\">\u003cdiv class=\"lbl\">Bills due tonight\u003c/div>${BILLS.map(b => {\n        const st = S.app[b.id];\n        let right;\n        if (st === 'paid') right = `\u003cspan class=\"chip paid\">Paid ✓\u003c/span>`;\n        else right = `\u003cspan class=\"amt\">${money(b.amt)}\u003c/span>\u003cbutton class=\"pbtn\" data-pay=\"${b.id}\" ${S.power !== 'on' ? 'disabled' : ''}>${st === 'lost' ? 'Pay again' : 'Pay'}\u003c/button>`;\n        const sub = `\u003csmall>${st === 'paid' ? money(b.amt) + ' paid' : 'Due by 11:59 PM'}\u003c/small>`;\n        const note = st === 'lost' ? `\u003cdiv class=\"note\">Your receipt said paid, but the bank says unpaid.\u003c/div>` : '';\n        return `\u003cdiv class=\"bill ${st === 'lost' ? 'lost' : ''}\">\u003cspan class=\"ic\" aria-hidden=\"true\">${b.icon}\u003c/span>\u003cdiv class=\"tx\">\u003cb>${b.name}\u003c/b>${sub}\u003c/div>${right}${note}\u003c/div>`;\n      }).join('')}\u003c/div>`;\n    } else if (S.screen === 'processing') {\n      const b = bill(S.current);\n      v = `\u003cdiv class=\"view center\">\u003cdiv class=\"spinner\" aria-hidden=\"true\">\u003c/div>\u003cp class=\"t\">Paying ${money(b.amt)}\u003c/p>\u003cp>${b.name}\u003c/p>\u003cp>Please don’t close the app.\u003c/p>\u003c/div>`;\n    } else if (S.screen === 'success') {\n      const b = bill(S.current);\n      v = `\u003cdiv class=\"view center\">\u003cdiv class=\"big ok\">✓\u003c/div>\u003cp class=\"t\">${money(b.amt)} paid\u003c/p>\u003cp>${b.name}, ${b.sub}\u003c/p>\n        \u003cdiv class=\"receipt\">\u003cdiv>\u003cspan>Status\u003c/span>\u003cspan>Successful\u003c/span>\u003c/div>\u003cdiv>\u003cspan>Ref no.\u003c/span>\u003cspan>${S.refs[b.id]}\u003c/span>\u003c/div>\u003cdiv>\u003cspan>To\u003c/span>\u003cspan>${b.name}\u003c/span>\u003c/div>\u003c/div>\u003c/div>`;\n      cta = `\u003cdiv class=\"cta\">\u003cbutton data-go=\"home\">Done\u003c/button>\u003c/div>`;\n    } else if (S.screen === 'failed') {\n      const b = bill(S.current);\n      v = `\u003cdiv class=\"view center\">\u003cdiv class=\"big bad\">✕\u003c/div>\u003cp class=\"t\">Payment failed\u003c/p>\u003cp>${b.name}, ${money(b.amt)}\u003c/p>\u003cp>Your bank went offline before the payment went through. \u003cb>No money was taken.\u003c/b>\u003c/p>\u003c/div>`;\n      cta = `\u003cdiv class=\"cta\">\u003cbutton data-go=\"home\">Back to bills\u003c/button>\u003c/div>`;\n    }\n    return head + offline + v + cta + toast;\n  }\n\n  const itemHtml = (id, saving) => {\n    const b = bill(id);\n    return `\u003cdiv class=\"item ${saving ? 'saving' : ''}\">\u003cb>${b.icon} ${b.name}\u003c/b>\u003cspan>${money(b.amt)}\u003c/span>\u003c/div>`;\n  };\n\n  function renderSaver() {\n    const el = $('#saver');\n    if (S.mode === 'right') {\n      el.innerHTML = S.saving ? `Writing the ${bill(S.saving).name.toLowerCase()} payment to disk…` : '';\n    } else if (S.power === 'on') {\n      const pct = ((SAVE_EVERY - S.saveIn) / SAVE_EVERY) * 100;\n      el.innerHTML = `Next save to disk in \u003cb>${S.saveIn}s\u003c/b>\u003cdiv class=\"sbarline\">\u003ci style=\"width:${pct}%\">\u003c/i>\u003c/div>`;\n    } else {\n      el.innerHTML = 'Saving is paused.';\n    }\n  }\n\n  function render() {\n    $('#phone').innerHTML = phoneHtml();\n\n    const st = $('#status');\n    st.className = 'status ' + (S.power === 'on' ? 'on' : S.power === 'off' ? 'off' : 'boot');\n    $('#statusText').textContent = S.power === 'on' ? 'Running' : S.power === 'off' ? 'Power off' : 'Starting…';\n    $('#server').classList.toggle('dark', S.power !== 'on');\n    $('#cutBtn').disabled = S.power !== 'on';\n    $('#restartBtn').disabled = S.power !== 'off';\n\n    $('#mem').innerHTML = S.memory.length ? S.memory.map(id => itemHtml(id, false)).join('') : `\u003cspan class=\"empty\">${S.power === 'on' ? 'Empty' : 'Wiped'}\u003c/span>`;\n    const diskItems = S.disk.map(id => itemHtml(id, false));\n    if (S.saving) diskItems.push(itemHtml(S.saving, true));\n    $('#disk').innerHTML = diskItems.length ? diskItems.join('') : '\u003cspan class=\"empty\">Empty\u003c/span>';\n    renderSaver();\n\n    $('#timeline').innerHTML = S.events.length\n      ? S.events.map(e => `\u003cli class=\"${e.bad ? 'bad' : ''}\">\u003ctime>${e.t}\u003c/time>\u003cspan>\u003cb class=\"${e.who}\">${e.who === 'r' ? 'Ravi' : 'The bank'}\u003c/b> ${e.text}\u003c/span>\u003c/li>`).join('')\n      : '\u003cli class=\"none\">Pay a bill on Ravi’s phone.\u003c/li>';\n    const tl = $('#timeline'); tl.scrollTop = tl.scrollHeight;\n\n    document.querySelectorAll('#tasks li').forEach(li => li.classList.toggle('done', done.has(+li.dataset.t)));\n    $('#alldone').classList.toggle('show', done.size === 4);\n  }\n\n  function setMode(m) {\n    document.querySelectorAll('.seg button').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.mode === m)));\n    $('#modeNote').textContent = m === 'right'\n      ? 'The bank writes each payment to disk before it says “Payment successful”.'\n      : `The bank says “Payment successful” first, and saves to disk every ${SAVE_EVERY} seconds.`;\n    fresh(m); render();\n  }\n\n  document.addEventListener('click', e => {\n    const p = e.target.closest('[data-pay]');\n    if (p) { pay(p.dataset.pay); return; }\n    const g = e.target.closest('[data-go]');\n    if (g) { S.screen = g.dataset.go; render(); }\n  });\n  $('#cutBtn').addEventListener('click', cut);\n  $('#restartBtn').addEventListener('click', restart);\n  $('#againBtn').addEventListener('click', () => { fresh(S.mode); render(); });\n  document.querySelectorAll('.seg button').forEach(b => b.addEventListener('click', () => { if (b.getAttribute('aria-pressed') !== 'true') setMode(b.dataset.mode); }));\n\n  ticker = setInterval(tick, 1000);\n  setMode('right');\n})();\n\u003c/script>\n\u003cscript>(function () {\n  document.addEventListener('click', function (e) {\n    if (e.defaultPrevented || e.button !== 0 || e.metaKey || e.ctrlKey || e.shiftKey || e.altKey) return;\n    var a = e.target.closest && e.target.closest('a[href]');\n    var m = a && /^(index|atomicity|consistency|isolation|durability)\\.html$/.exec(a.getAttribute('href').split('#')[0]);\n    if (!m) return;\n    e.preventDefault();\n    parent.postMessage({ acidPage: m[1] }, '*');\n  });\n}());\u003c/script>\n\u003c/body>\n\u003c/html>\n"}</script>
<script>
(function () {
  // The five pages, each a complete document. #atomicity shows atomicity.html; no hash is the index.
  var PAGES = JSON.parse(document.getElementById('pages').textContent);
  var frame = document.getElementById('page');

  function current() {
    var h = location.hash.slice(1);
    return PAGES[h] && h !== 'index' ? h : 'index';
  }
  function show() {
    var name = current();
    frame.srcdoc = PAGES[name];
    var t = /<title>([^<]*)<\/title>/.exec(PAGES[name]);
    document.title = t ? t[1] : 'ACID';
  }
  frame.addEventListener('load', function () { try { frame.contentWindow.focus(); } catch (e) { /* not reachable */ } });
  window.addEventListener('message', function (e) {
    if (e.source !== frame.contentWindow || !e.data || !PAGES[e.data.acidPage]) return;
    var name = e.data.acidPage;
    // Assigning location.hash stays inside the lesson frame in every browser.
    location.hash = name === 'index' ? '' : name;
  });
  window.addEventListener('hashchange', show);
  show();
}());
</script>
