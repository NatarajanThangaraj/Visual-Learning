f}\n.cta button:disabled{background:#B9B8DA}\n.view.center{display:flex;flex-direction:column;text-align:center;justify-content:center;align-items:center;padding:1.3em}\n.big{width:3.6em;height:3.6em;border-radius:50%;display:grid;place-items:center;font-size:1.4em;font-weight:800;margin:0 auto .7em}\n.big.ok{background:#E5F4EB;color:#1D8048}\n.big.bad{background:#FCE9E7;color:#C3362C}\n.big.warn{background:#FFF1D6;color:#8A5A00}\n.center p{margin:.2em 0;font-size:.86em;color:#4D4E70;line-height:1.45}\n.center .t{font-size:1.25em;font-weight:800;color:#17173A;margin-bottom:.15em}\n.spinner{width:2.8em;height:2.8em;border-radius:50%;border:.3em solid #E4E3FF;border-top-color:#3F3D9E;animation:spin .9s linear infinite;margin:0 auto .9em}\n.hist{margin-top:1em;width:100%;background:#fff;border-radius:.9em;padding:.6em .8em;font-size:.78em;text-align:left}\n.hist div{display:flex;justify-content:space-between;gap:.5em;padding:.15em 0}\n.hist .neg{color:#B42A20;font-weight:700}\n.hist .pos{color:#1D8048;font-weight:700}\n.hello{background:#3F3D9E;color:#fff;padding:.2em 1em 1.2em}\n.hello small{opacity:.8;font-size:.78em}\n.hello b{display:block;font-size:2em;line-height:1.15;letter-spacing:-.02em}\n.lbl{font-size:.74em;color:#66678A;font-weight:600;margin:.1em .2em .6em}\n.tx{background:#fff;border-radius:.9em;padding:.65em .75em;margin-bottom:.5em;display:flex;gap:.6em;align-items:center;font-size:.86em}\n.tx .av{width:2.2em;height:2.2em;font-size:.9em}\n.tx div{flex:1;min-width:0}\n.tx small{display:block;font-size:.85em;color:#66678A}\n.tx .amt{font-weight:700;white-space:nowrap}\n.tx.new{animation:pop .6s ease}\n.empty{color:#66678A;font-size:.82em;text-align:center;margin-top:1.4em}\n.toast{position:absolute;left:.8em;right:.8em;bottom:.9em;background:#17173A;color:#fff;border-radius:.8em;padding:.65em .85em;font-size:.8em;font-weight:600;line-height:1.4;animation:drop .35s ease;z-index:2}\n.toast.ok{background:#1D8048}\n\n/* ---------- Bank ---------- */\n.bank{background:var(--bg);border-radius:18px;padding:20px}\n.bank-head{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}\n.bank h2{margin:0;font-size:1.25rem;line-height:1.2}\n.net{display:inline-flex;align-items:center;gap:7px;font-weight:600;font-size:.85rem;padding:5px 11px;border-radius:99px;background:var(--ok-soft);color:var(--ok)}\n.net i{width:8px;height:8px;border-radius:50%;background:currentColor}\n.net.cut{background:var(--bad-soft);color:var(--bad)}\n.accts{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:14px 0 8px}\n.acct{background:var(--soft);border-radius:12px;padding:10px 12px}\n.acct small{display:block;color:var(--muted);font-size:.78rem}\n.acct b{font-size:1.4rem;line-height:1.25;font-variant-numeric:tabular-nums;transition:color .3s}\n.acct b.down{color:var(--bad)} .acct b.up{color:var(--ok)}\n.total{display:flex;justify-content:space-between;align-items:center;gap:8px;border-radius:12px;padding:10px 12px;background:var(--ok-soft);color:var(--ok);font-weight:600}\n.total b{font-size:1.25rem;font-variant-numeric:tabular-nums}\n.total.bad{background:var(--bad-soft);color:var(--bad)}\n.steps{list-style:none;margin:14px 0;padding:0;display:grid;gap:8px}\n.steps li{display:flex;gap:10px;align-items:center;padding:10px 12px;border-radius:12px;border:1px solid var(--line);font-size:.93rem;transition:background .3s,border-color .3s}\n.steps .dot{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-size:.8rem;font-weight:700;flex:none;background:var(--soft);color:var(--muted)}\n.steps li.run{border-color:var(--amber);background:var(--amber-soft)}\n.steps li.run .dot{background:var(--amber);color:#fff;animation:pulse 1s ease-in-out infinite}\n.steps li.done{border-color:var(--ok);background:var(--ok-soft)}\n.steps li.done .dot{background:var(--ok);color:#fff}\n.steps li.fail{border-color:var(--bad);background:var(--bad-soft)}\n.steps li.fail .dot{background:var(--bad);color:#fff}\n.steps li.undo{border-color:var(--accent);background:var(--soft)}\n.steps li.undo .dot{background:var(--accent);color:#fff}\n.steps li em{font-style:normal;margin-left:auto;font-size:.78rem;font-weight:600;color:var(--muted);white-space:nowrap}\n.ctrl{display:flex;gap:8px}\n.ctrl button{flex:1;border:0;border-radius:12px;padding:12px;font-weight:700;font-size:.95rem}\n.cutb{background:#E5483D;color:#fff}\n.fixb{background:#2FA36B;color:#fff}\n.ctrl button:disabled{opacity:.35}\n.again{margin-top:10px;width:100%;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:10px;padding:9px;font-size:.9rem;font-weight:500}\n\n/* ---------- Below ---------- */\n.below{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:22px;margin-top:26px}\n.panel{background:var(--bg);border-radius:18px;padding:20px}\n.panel h3{margin:0 0 10px;font-size:1.05rem}\n.timeline{list-style:none;margin:0;padding:0;display:grid;gap:8px;max-height:300px;overflow:auto}\n.timeline li{display:grid;grid-template-columns:auto 1fr;gap:10px;font-size:.9rem;align-items:baseline}\n.timeline time{font:500 .78rem var(--mono);color:var(--muted)}\n.timeline b.r{color:#3F3D9E} .timeline b.m{color:#B0306A} .timeline b.k{color:var(--accent)}\n.timeline li.bad span{color:var(--bad)}\n.timeline .none{color:var(--muted);display:block}\n.tasks ol{list-style:none;margin:0;padding:0;display:grid;gap:9px;counter-reset:t}\n.tasks li{display:flex;gap:10px;align-items:flex-start;font-size:.93rem;counter-increment:t}\n.tasks li::before{content:counter(t);flex:none;width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font-size:.78rem;font-weight:700;background:var(--soft);color:var(--muted)}\n.tasks li.done{color:var(--muted)}\n.tasks li.done::before{content:\"✓\";background:var(--ok);color:#fff}\n.tag{font-size:.72rem;font-weight:700;padding:2px 7px;border-radius:99px;margin-left:4px;vertical-align:1px;white-space:nowrap}\n.tag.r{background:var(--ok-soft);color:var(--ok)}\n.tag.w{background:var(--bad-soft);color:var(--bad)}\n.alldone{margin:12px 0 0;font-weight:600;color:var(--ok);display:none}\n.alldone.show{display:block}\n\nfooter{border-top:1px solid var(--line);padding:26px 0 40px;background:var(--bg)}\n.chapters{max-width:1080px;margin:0 auto;padding:0 22px;display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;font-weight:600;color:var(--muted)}\n\n@keyframes spin{to{transform:rotate(360deg)}}\n@keyframes fade{from{opacity:0}to{opacity:1}}\n@keyframes drop{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}\n@keyframes pulse{50%{opacity:.55}}\n@keyframes pop{0%{transform:scale(.9);opacity:0}60%{transform:scale(1.03)}100%{transform:none;opacity:1}}\n@media (prefers-reduced-motion:reduce){*{animation:none !important;transition:none !important}.spinner{border-left-color:#3F3D9E}}\n\n@media (max-width:980px){\n  .stage{grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:14px}\n  .bank{grid-column:1 / -1;order:3}\n  .below{grid-template-columns:minmax(0,1fr)}\n}\n@media (max-width:620px){\n  .wrap{padding:32px 12px 44px}\n  .phone{font-size:10.5px;border-radius:2em}\n  .who{font-size:.9rem}\n  .seg button{padding:10px 14px}\n  .bank{padding:16px}\n}\n.site-nav{max-width:1060px;margin:0 auto;padding:0 22px;display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap;font-weight:600}\n.site-nav a{color:var(--accent);text-decoration:none}\n.site-nav a:hover{text-decoration:underline}\n.site-nav .gap{min-width:1px}\n\u003c/style>\n\u003c/head>\n\u003cbody>\n\n\u003cmain class=\"wrap\">\n  \u003cdiv class=\"intro\">\n    \u003ch1>Ravi owes Meena ₹500\u003c/h1>\n    \u003cp>He sends it from his phone. The bank has two jobs: take the money from Ravi, then give it to Meena. Cut the connection in the middle and see where the ₹500 ends up. Try the right way and the wrong way.\u003c/p>\n  \u003c/div>\n\n  \u003cdiv class=\"modes\">\n    \u003cdiv class=\"seg\" role=\"group\" aria-label=\"Payment system\">\n      \u003cbutton class=\"right\" data-mode=\"right\" aria-pressed=\"true\">✅ Right way\u003c/button>\n      \u003cbutton class=\"wrong\" data-mode=\"wrong\" aria-pressed=\"false\">⚠️ Wrong way\u003c/button>\n    \u003c/div>\n  \u003c/div>\n  \u003cdiv class=\"mode-note\" id=\"modeNote\" aria-live=\"polite\">\u003c/div>\n\n  \u003cdiv class=\"stage\">\n    \u003cdiv>\n      \u003cdiv class=\"who\">Ravi\u003csmall>Sending money\u003c/small>\u003c/div>\n      \u003cdiv class=\"phone\">\u003cdiv class=\"screen\" id=\"ph-ravi\">\u003c/div>\u003c/div>\n    \u003c/div>\n\n    \u003cdiv class=\"bank\" aria-live=\"polite\">\n      \u003cdiv class=\"bank-head\">\u003ch2>The bank\u003c/h2>\u003cspan class=\"net\" id=\"net\">\u003ci>\u003c/i>\u003cspan id=\"netText\">Connected\u003c/span>\u003c/span>\u003c/div>\n      \u003cdiv class=\"accts\">\n        \u003cdiv class=\"acct\">\u003csmall>Ravi’s account\u003c/small>\u003cb id=\"aRavi\">\u003c/b>\u003c/div>\n        \u003cdiv class=\"acct\">\u003csmall>Meena’s account\u003c/small>\u003cb id=\"aMeena\">\u003c/b>\u003c/div>\n      \u003c/div>\n      \u003cdiv class=\"total\" id=\"total\">\u003cspan id=\"totalLabel\">Money in the bank\u003c/span>\u003cb id=\"totalVal\">\u003c/b>\u003c/div>\n      \u003col class=\"steps\" id=\"steps\">\u003c/ol>\n      \u003cdiv class=\"ctrl\">\n        \u003cbutton class=\"cutb\" id=\"cutBtn\">✂️ Cut the connection\u003c/button>\n        \u003cbutton class=\"fixb\" id=\"fixBtn\" disabled>🔌 Reconnect\u003c/button>\n      \u003c/div>\n      \u003cbutton class=\"again\" id=\"againBtn\">Start again\u003c/button>\n    \u003c/div>\n\n    \u003cdiv>\n      \u003cdiv class=\"who\">Meena\u003csmall>Receiving money\u003c/small>\u003c/div>\n      \u003cdiv class=\"phone\">\u003cdiv class=\"screen\" id=\"ph-meena\">\u003c/div>\u003c/div>\n    \u003c/div>\n  \u003c/div>\n\n  \u003cdiv class=\"below\">\n    \u003cdiv class=\"panel\">\n      \u003ch3>What happened\u003c/h3>\n      \u003col class=\"timeline\" id=\"timeline\">\u003cli class=\"none\">Send money from Ravi’s phone.\u003c/li>\u003c/ol>\n    \u003c/div>\n    \u003cdiv class=\"panel tasks\">\n      \u003ch3>Try this\u003c/h3>\n      \u003col id=\"tasks\">\n        \u003cli data-t=\"1\">Send ₹500 and let it finish \u003cspan class=\"tag r\">Right way\u003c/span>\u003c/li>\n        \u003cli data-t=\"2\">Send ₹500 and cut the connection after step 1 is done \u003cspan class=\"tag r\">Right way\u003c/span>\u003c/li>\n        \u003cli data-t=\"3\">Do the same thing again \u003cspan class=\"tag w\">Wrong way\u003c/span>\u003c/li>\n        \u003cli data-t=\"4\">Look at “Money in the bank”. Where did the ₹500 go? \u003cspan class=\"tag w\">Wrong way\u003c/span>\u003c/li>\n      \u003c/ol>\n      \u003cp class=\"alldone\" id=\"alldone\">All done. Which app would you send ₹500 with?\u003c/p>\n    \u003c/div>\n  \u003c/div>\n\u003c/main>\n\n\u003cfooter>\n  \u003cnav class=\"site-nav\" aria-label=\"Chapters\">\n    \u003cspan class=\"gap\">\u003c/span>\n    \u003ca href=\"index.html\">All chapters\u003c/a>\n    \u003ca href=\"consistency.html\">Next: Tatkal booking →\u003c/a>\n  \u003c/nav>\n\u003c/footer>\n\n\u003cscript>\n(() => {\n  const $ = s => document.querySelector(s);\n  const START = {ravi:5000, meena:2000};\n  const money = n => '₹' + n.toLocaleString('en-IN');\n  const done = new Set();\n  let S, clock, timers = [];\n\n  function fresh(mode) {\n    timers.forEach(clearTimeout); timers = [];\n    clock = 19 * 3600 + 30 * 60;\n    S = {\n      mode, net:true, ravi:START.ravi, meena:START.meena, amt:500,\n      phase:'idle', step1:'wait', step2:'wait',\n      raviScreen:'send', meenaToast:null, raviHist:[], meenaHist:[], events:[], lastAmt:500\n    };\n  }\n  const later = (fn, ms) => timers.push(setTimeout(fn, ms));\n  function stamp() {\n    clock += 1 + Math.floor(Math.random() * 3);\n    const h = Math.floor(clock / 3600), m = Math.floor(clock / 60) % 60, s = clock % 60;\n    return `${h - 12}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')} PM`;\n  }\n  const log = (who, text, bad) => S.events.push({t:stamp(), who, text, bad});\n\n  /* ---------- Actions ---------- */\n  function send() {\n    if (S.phase !== 'idle' || S.ravi \u003c S.amt) return;\n    const amt = S.amt; S.lastAmt = amt;\n    S.phase = 'sending'; S.raviScreen = 'sending'; S.step1 = 'run'; S.step2 = 'wait';\n    log('r', `tapped Send ${money(amt)} to Meena.`);\n    render();\n    later(() => {\n      if (!S.net) return;\n      S.ravi -= amt; S.step1 = 'done'; S.step2 = 'run';\n      log('k', `took ${money(amt)} from Ravi’s account.`);\n      render();\n      later(() => {\n        if (!S.net) return;\n        S.meena += amt; S.step2 = 'done'; S.phase = 'idle'; S.raviScreen = 'success';\n        S.raviHist.unshift({text:'To Meena', amt:-amt, ok:true});\n        S.meenaHist.unshift({text:'From Ravi', amt, ok:true, isNew:true});\n        S.meenaToast = `${money(amt)} received from Ravi`;\n        later(() => { S.meenaToast = null; render(); }, 3500);\n        log('k', `gave ${money(amt)} to Meena. Both steps done.`);\n        log('m', `got a message: “${money(amt)} received from Ravi”.`);\n        if (S.mode === 'right') done.add(1);\n        render();\n      }, 2600);\n    }, 1600);\n  }\n\n  function cut() {\n    if (!S.net) return;\n    S.net = false;\n    log('k', 'lost its connection.', true);\n    if (S.phase === 'sending') {\n      timers.forEach(clearTimeout); timers = [];\n      const amt = S.lastAmt;\n      if (S.step1 !== 'done') {\n        S.step1 = 'fail'; S.phase = 'idle'; S.raviScreen = 'failedClean';\n        log('k', `couldn’t start. Nothing was taken from Ravi.`);\n        log('r', 'saw “Payment failed. No money was taken.”');\n      } else {\n        S.step2 = 'fail';\n        if (S.mode === 'right') {\n          S.phase = 'undoing';\n          render();\n          later(() => {\n            S.ravi += amt; S.step1 = 'undo'; S.phase = 'idle'; S.raviScreen = 'failedBack';\n            S.raviHist.unshift({text:'To Meena, failed', amt:0, ok:false, back:amt});\n            log('k', `couldn’t reach Meena’s account, so it put the ${money(amt)} back in Ravi’s account.`);\n            log('r', `saw “Payment failed. ${money(amt)} is back in your account.”`);\n            done.add(2);\n            render();\n          }, 1300);\n        } else {\n          S.phase = 'idle'; S.raviScreen = 'failedLost';\n          S.raviHist.unshift({text:'To Meena, failed', amt:-amt, ok:false});\n          log('k', `couldn’t reach Meena’s account. It stopped there. The ${money(amt)} taken from Ravi was never given to anyone.`, true);\n          log('r', `saw “Something went wrong”. His balance is ${money(S.ravi)}.`, true);\n          log('m', 'never got anything.', true);\n          done.add(3);\n        }\n      }\n    }\n    render();\n  }\n\n  function fix() {\n    if (S.net) return;\n    S.net = true;\n    log('k', 'is connected again.');\n    render();\n  }\n\n  /* ---------- Rendering ---------- */\n  function raviHtml() {\n    const head = `\u003cdiv class=\"sbar\">\u003cspan>7:30\u003c/span>\u003cspan>▮▮▮ 4G\u003c/span>\u003c/div>\n      \u003cdiv class=\"apphead\">\u003cspan class=\"logo\">Rupee\u003ci>Go\u003c/i>\u003c/span>\u003cspan class=\"bal ${S.ravi \u003c START.ravi && S.raviScreen === 'failedLost' ? 'low' : ''}\">Balance ${money(S.ravi)}\u003c/span>\u003c/div>`;\n    let v = '', cta = '';\n    const amt = S.lastAmt;\n    const hist = S.raviHist.length ? `\u003cdiv class=\"hist\">${S.raviHist.slice(0,3).map(h =>\n      `\u003cdiv>\u003cspan>${h.text}\u003c/span>\u003cspan class=\"${h.amt \u003c 0 ? 'neg' : 'pos'}\">${h.amt \u003c 0 ? '−' + money(-h.amt) : h.back ? money(h.back) + ' back' : '₹0'}\u003c/span>\u003c/div>`).join('')}\u003c/div>` : '';\n    switch (S.raviScreen) {\n      case 'send':\n        v = `\u003cdiv class=\"view\">\n          \u003cdiv class=\"contact\">\u003cspan class=\"av\">M\u003c/span>\u003cdiv>\u003cb>Meena\u003c/b>\u003csmall>meena@rupeego\u003c/small>\u003c/div>\u003c/div>\n          \u003cdiv class=\"amount\">\u003csmall>You’re sending\u003c/small>\u003cb>${money(S.amt)}\u003c/b>\u003c/div>\n          \u003cdiv class=\"chips\">${[100,500,1000].map(a => `\u003cbutton data-amt=\"${a}\" aria-pressed=\"${a === S.amt}\">${money(a)}\u003c/button>`).join('')}\u003c/div>\n          \u003cp class=\"note\">${S.net ? 'Money reaches Meena in a few seconds.' : '⚠ No connection to the bank.'}\u003c/p>\n          ${hist}\n        \u003c/div>`;\n        cta = `\u003cdiv class=\"cta\">\u003cbutton data-act=\"send\" ${S.ravi \u003c S.amt ? 'disabled' : ''}>Send ${money(S.amt)}\u003c/button>\u003c/div>`;\n        break;\n      case 'sending':\n        v = `\u003cdiv class=\"view center\">\u003cdiv class=\"spinner\" aria-hidden=\"true\">\u003c/div>\u003cp class=\"t\">Sending ${money(amt)}\u003c/p>\u003cp>To Meena\u003c/p>\u003cp>Please don’t close the app.\u003c/p>\u003c/div>`;\n        break;\n      case 'success':\n        v = `\u003cdiv class=\"view center\">\u003cdiv class=\"big ok\">✓\u003c/div>\u003cp class=\"t\">${money(amt)} sent\u003c/p>\u003cp>Meena has received it.\u003c/p>${hist}\u003c/div>`;\n        cta = `\u003cdiv class=\"cta\">\u003cbutton data-act=\"home\">Done\u003c/button>\u003c/div>`; break;\n      case 'failedClean':\n        v = `\u003cdiv class=\"view center\">\u003cdiv class=\"big bad\">✕\u003c/div>\u003cp class=\"t\">Payment failed\u003c/p>\u003cp>Couldn’t reach your bank.\u003c/p>\u003cp>\u003cb>No money was taken.\u003c/b>\u003c/p>\u003c/div>`;\n        cta = `\u003cdiv class=\"cta\">\u003cbutton data-act=\"home\">Back\u003c/button>\u003c/div>`; break;\n      case 'failedBack':\n        v = `\u003cdiv class=\"view center\">\u003cdiv class=\"big bad\">✕\u003c/div>\u003cp class=\"t\">Payment failed\u003c/p>\u003cp>Meena didn’t get the money.\u003c/p>\u003cp>\u003cb>${money(amt)} is back in your account.\u003c/b>\u003c/p>${hist}\u003c/div>`;\n        cta = `\u003cdiv class=\"cta\">\u003cbutton data-act=\"home\">Back\u003c/button>\u003c/div>`; break;\n      case 'failedLost':\n        v = `\u003cdiv class=\"view center\">\u003cdiv class=\"big warn\">!\u003c/div>\u003cp class=\"t\">Something went wrong\u003c/p>\u003cp>We couldn’t complete your payment.\u003c/p>\u003cp>Your balance is now \u003cb>${money(S.ravi)}\u003c/b>.\u003c/p>${hist}\u003c/div>`;\n        cta = `\u003cdiv class=\"cta\">\u003cbutton data-act=\"home\">Back\u003c/button>\u003c/div>`; break;\n    }\n    return head + v + cta;\n  }\n\n  function meenaHtml() {\n    const head = `\u003cdiv class=\"sbar\">\u003cspan>7:30\u003c/span>\u003cspan>▮▮▮ 5G\u003c/span>\u003c/div>\n      \u003cdiv class=\"apphead\">\u003cspan class=\"logo\">Rupee\u003ci>Go\u003c/i>\u003c/span>\u003cspan class=\"bal\">Hi Meena\u003c/span>\u003c/div>\n      \u003cdiv class=\"hello\">\u003csmall>Your balance\u003c/small>\u003cb>${money(S.meena)}\u003c/b>\u003c/div>`;\n    const list = S.meenaHist.length\n      ? S.meenaHist.map(h => `\u003cdiv class=\"tx ${h.isNew ? 'new' : ''}\">\u003cspan class=\"av r\">R\u003c/span>\u003cdiv>\u003cb>${h.text}\u003c/b>\u003csmall>Just now\u003c/small>\u003c/div>\u003cspan class=\"amt\" style=\"color:#1D8048\">+${money(h.amt)}\u003c/span>\u003c/div>`).join('')\n      : `\u003cp class=\"empty\">No money received yet.\u003c/p>`;\n    S.meenaHist.forEach(h => { h.isNew = false; });\n    const toast = S.meenaToast ? `\u003cdiv class=\"toast ok\">🔔 ${S.meenaToast}\u003c/div>` : '';\n    return head + `\u003cdiv class=\"view\">\u003cdiv class=\"lbl\">Received\u003c/div>${list}\u003c/div>` + toast;\n  }\n\n  function render() {\n    $('#ph-ravi').innerHTML = raviHtml();\n    $('#ph-meena').innerHTML = meenaHtml();\n\n    $('#net').className = 'net' + (S.net ? '' : ' cut');\n    $('#netText').textContent = S.net ? 'Connected' : 'Connection cut';\n    $('#cutBtn').disabled = !S.net;\n    $('#fixBtn').disabled = S.net;\n\n    const ar = $('#aRavi'), am = $('#aMeena');\n    ar.textContent = money(S.ravi); am.textContent = money(S.meena);\n    ar.className = S.ravi \u003c START.ravi && S.meena === START.meena ? 'down' : '';\n    am.className = S.meena > START.meena ? 'up' : '';\n    const total = S.ravi + S.meena, startTotal = START.ravi + START.meena;\n    $('#totalVal').textContent = money(total);\n    $('#total').classList.toggle('bad', total !== startTotal);\n    $('#totalLabel').textContent = total === startTotal ? 'Money in the bank' : `Money in the bank (${money(startTotal - total)} missing)`;\n    if (total !== startTotal && S.mode === 'wrong') done.add(4);\n\n    const amt = S.lastAmt;\n    const st = (k, label) => {\n      const s = S[k];\n      const word = {wait:'Waiting', run:'Working…', done:'Done', fail:'Failed', undo:'Put back'}[s];\n      const icon = {wait:k === 'step1' ? '1' : '2', run:k === 'step1' ? '1' : '2', done:'✓', fail:'✕', undo:'↩'}[s];\n      return `\u003cli class=\"${s}\">\u003cspan class=\"dot\">${icon}\u003c/span>\u003cspan>${label}\u003c/span>\u003cem>${word}\u003c/em>\u003c/li>`;\n    };\n    let steps = st('step1', `Take ${money(amt)} from Ravi`) + st('step2', `Give ${money(amt)} to Meena`);\n    if (S.phase === 'undoing') steps += `\u003cli class=\"run\">\u003cspan class=\"dot\">↩\u003c/span>\u003cspan>Put ${money(amt)} back in Ravi’s account\u003c/span>\u003cem>Working…\u003c/em>\u003c/li>`;\n    $('#steps').innerHTML = steps;\n\n    $('#timeline').innerHTML = S.events.length\n      ? S.events.map(e => `\u003cli class=\"${e.bad ? 'bad' : ''}\">\u003ctime>${e.t}\u003c/time>\u003cspan>\u003cb class=\"${e.who}\">${{r:'Ravi', m:'Meena', k:'The bank'}[e.who]}\u003c/b> ${e.text}\u003c/span>\u003c/li>`).join('')\n      : '\u003cli class=\"none\">Send money from Ravi’s phone.\u003c/li>';\n    const tl = $('#timeline'); tl.scrollTop = tl.scrollHeight;\n\n    document.querySelectorAll('#tasks li').forEach(li => li.classList.toggle('done', done.has(+li.dataset.t)));\n    $('#alldone').classList.toggle('show', done.size === 4);\n  }\n\n  function setMode(m) {\n    document.querySelectorAll('.seg button').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.mode === m)));\n    $('#modeNote').textContent = m === 'right'\n      ? 'If anything fails halfway, the bank puts everything back the way it was.'\n      : 'If anything fails halfway, the bank just stops where it is.';\n    fresh(m); render();\n  }\n\n  document.addEventListener('click', e => {\n    const a = e.target.closest('[data-amt]');\n    if (a) { S.amt = +a.dataset.amt; render(); return; }\n    const b = e.target.closest('[data-act]');\n    if (!b) return;\n    if (b.dataset.act === 'send') send();\n    if (b.dataset.act === 'home') { S.raviScreen = 'send'; S.step1 = 'wait'; S.step2 = 'wait'; render(); }\n  });\n  $('#cutBtn').addEventListener('click', cut);\n  $('#fixBtn').addEventListener('click', fix);\n  $('#againBtn').addEventListener('click', () => { fresh(S.mode); render(); });\n  document.querySelectorAll('.seg button').forEach(b => b.addEventListener('click', () => { if (b.getAttribute('aria-pressed') !== 'true') setMode(b.dataset.mode); }));\n\n  setMode('right');\n})();\n\u003c/script>\n\u003cscript>(function () {\n  document.addEventListener('click', function (e) {\n    if (e.defaultPrevented || e.button !== 0 || e.metaKey || e.ctrlKey || e.shiftKey || e.altKey) return;\n    var a = e.target.closest && e.target.closest('a[href]');\n    var m = a && /^(index|atomicity|consistency|isolation|durability)\\.html$/.exec(a.getAttribute('href').split('#')[0]);\n    if (!m) return;\n    e.preventDefault();\n    parent.postMessage({ acidPage: m[1] }, '*');\n  });\n}());\u003c/script>\n\u003c/body>\n\u003c/html>\n","consistency":"\u003c!DOCTYPE html>\n\u003chtml lang=\"en\">\n\u003chead>\n\u003cmeta charset=\"utf-8\">\n\u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1, viewport-fit=cover\">\n\u003ctitle>Tatkal Booking Story\u003c/title>\n\u003clink rel=\"preconnect\" :transform .1s}\n.book:active{transform:scale(.98)}\n\n.sheet{position:absolute;inset:auto 0 0 0;background:#fff;border-radius:24px 24px 0 0;padding:22px 18px 20px;box-shadow:0 -12px 30px rgba(16,22,31,.18);transform:translateY(105%);transition:transform .35s ease;max-height:85%;overflow:auto}\n.sheet.open{transform:none}\n.scrim{position:absolute;inset:0;background:rgba(16,22,31,.35);opacity:0;pointer-events:none;transition:opacity .3s}\n.scrim.open{opacity:1;pointer-events:auto}\n.sheet .icon{width:52px;height:52px;border-radius:50%;display:grid;place-items:center;font-size:1.6rem;font-weight:700;margin-bottom:10px}\n.sheet.ok .icon{background:#E5F4EB;color:#1D8048}\n.sheet.bad .icon{background:#FCE9E7;color:#C3362C}\n.sheet h3{margin:0 0 4px;font-size:1.2rem}\n.sheet p{margin:0 0 12px;font-size:.92rem;color:#4A5465;line-height:1.5}\n.sheet .seats{display:grid;gap:6px;margin-bottom:12px}\n.sheet .seat{display:flex;justify-content:space-between;align-items:center;gap:8px;background:#FFF1D6;border-radius:10px;padding:8px 10px;font-size:.88rem}\n.sheet .seat b{color:#8A5A00}\n.sheet .seat.clash{background:#FCE9E7}\n.sheet .seat.clash b{color:#C3362C}\n.sheet .seat em{font-style:normal;font-size:.78rem;color:#C3362C;font-weight:600}\n.sheet .pnr{font:500 .8rem var(--mono);color:#5A6576;margin-bottom:14px}\n.sheet .done{width:100%;border:0;border-radius:12px;padding:12px;background:#18212E;color:#fff;font-weight:600}\n\n/* Coach */\n.coach{background:var(--bg);border-radius:18px;padding:22px}\n.coach-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap}\n.coach-head h2{margin:0;font-size:1.3rem;line-height:1.2}\n.coach-head small{color:var(--muted);font-size:.88rem}\n.reset{border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:10px;padding:8px 14px;font-size:.88rem;font-weight:500}\n.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:16px 0 18px}\n.stat{background:var(--soft);border-radius:12px;padding:10px 14px}\n.stat small{display:block;color:var(--muted);font-size:.8rem}\n.stat b{font-size:1.6rem;line-height:1.2;font-variant-numeric:tabular-nums}\n.stat.bad{background:var(--bad-soft)}\n.stat.bad b{color:var(--bad)}\n.train-body{border:2px solid var(--line);border-radius:14px;padding:12px;position:relative}\n.bays{display:grid;grid-template-columns:repeat(auto-fill,minmax(118px,1fr));gap:10px}\n.bay{border-radius:10px;background:var(--soft);padding:8px 8px 6px}\n.bay-seats{display:flex;gap:4px;justify-content:center}\n.bcol{display:flex;flex-direction:column;gap:3px}\n.bcol.side{justify-content:flex-end}\n.aisle{width:9px;border-left:1px dashed var(--line);margin-left:2px}\n.berth{width:30px;height:24px;border-radius:5px;display:grid;place-items:center;font:600 .74rem/1 var(--body);font-variant-numeric:tabular-nums;position:relative;border:0;padding:0}\n.berth.taken{background:var(--taken);color:var(--muted)}\n.berth.free{background:var(--bg);box-shadow:inset 0 0 0 2px var(--ok);color:var(--ok)}\n.berth.you{background:var(--you);color:#1A1200}\n.berth.clash{background:var(--bad);color:#fff;animation:pulse 1.1s ease-in-out infinite}\n.berth.clash::after{content:attr(data-n);position:absolute;top:-7px;right:-7px;min-width:16px;height:16px;border-radius:8px;background:var(--ink);color:var(--bg);font-size:.62rem;display:grid;place-items:center}\n.berth.new{animation:pop .7s ease}\n.berth.sel{outline:3px solid var(--accent);outline-offset:2px}\n.bay-name{text-align:center;font-size:.72rem;color:var(--muted);margin-top:4px}\n.legend{display:flex;gap:16px;flex-wrap:wrap;margin-top:14px;font-size:.84rem;color:var(--muted)}\n.legend span{display:inline-flex;align-items:center;gap:6px}\n.legend i{width:16px;height:13px;border-radius:3px;display:inline-block}\n.legend .lt{background:var(--taken)} .legend .lf{box-shadow:inset 0 0 0 2px var(--ok)} .legend .ly{background:var(--you)} .legend .lc{background:var(--bad)}\n.info{margin-top:14px;padding:12px 14px;border-radius:12px;background:var(--soft);font-size:.93rem;min-height:48px}\n.info.clash{background:var(--bad-soft);color:var(--bad);font-weight:500}\n\n.tasks{margin-top:22px;border-top:1px solid var(--line);padding-top:16px}\n.tasks h3{margin:0 0 10px;font-size:1rem}\n.tasks ol{list-style:none;margin:0;padding:0;display:grid;gap:8px;counter-reset:t}\n.tasks li{display:flex;gap:10px;align-items:flex-start;font-size:.93rem;counter-increment:t}\n.tasks li::before{content:counter(t);flex:none;width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font-size:.78rem;font-weight:700;background:var(--soft);color:var(--muted)}\n.tasks li.done{color:var(--muted)}\n.tasks li.done::before{content:\"✓\";background:var(--ok);color:#fff}\n.tasks .tag{font-size:.72rem;font-weight:700;padding:2px 7px;border-radius:99px;margin-left:4px;vertical-align:1px}\n.tasks .tag.r{background:var(--ok-soft);color:var(--ok)}\n.tasks .tag.w{background:var(--bad-soft);color:var(--bad)}\n.alldone{margin-top:12px;font-weight:600;color:var(--ok);display:none}\n.alldone.show{display:block}\n\nfooter{border-top:1px solid var(--line);padding:26px 0 40px;background:var(--bg)}\n.chapters{max-width:1060px;margin:0 auto;padding:0 22px;display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;font-weight:600}\n.chapters a{color:var(--accent);text-decoration:none}\n.chapters span{color:var(--muted);font-weight:500}\n\n@keyframes pop{0%{transform:scale(.4)}60%{transform:scale(1.25)}100%{transform:scale(1)}}\n@keyframes pulse{50%{filter:brightness(1.25)}}\n@media (prefers-reduced-motion:reduce){*{animation:none !important;transition:none !important}}\n@media (max-width:860px){\n  .stage{grid-template-columns:minmax(0,1fr)}\n  .phone{position:static;max-width:330px;margin:0 auto;width:100%}\n}\n@media (max-width:520px){\n  .wrap{padding:32px 14px 44px}\n  .coach{padding:16px}\n  .bays{grid-template-columns:repeat(2,minmax(0,1fr))}\n  .seg button{padding:10px 14px}\n  .stat b{font-size:1.3rem}\n}\n.site-nav{max-width:1060px;margin:0 auto;padding:0 22px;display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap;font-weight:600}\n.site-nav a{color:var(--accent);text-decoration:none}\n.site-nav a:hover{text-decoration:underline}\n.site-nav .gap{min-width:1px}\n\u003c/style>\n\u003c/head>\n\u003cbody>\n\n\u003cmain class=\"wrap\">\n  \u003cdiv class=\"intro\">\n    \u003ch1>10:00 AM, Tatkal opens\u003c/h1>\n    \u003cp>Train 12621, Tamil Nadu Express. Coach S4 has 72 berths and only 3 are free. Book tickets the right way and the wrong way, and watch what happens to the coach.\u003c/p>\n  \u003c/div>\n\n  \u003cdiv class=\"modes\">\n    \u003cdiv class=\"seg\" role=\"group\" aria-label=\"Booking system\">\n      \u003cbutton class=\"right\" data-mode=\"right\" aria-pressed=\"true\">✅ Right way\u003c/button>\n      \u003cbutton class=\"wrong\" data-mode=\"wrong\" aria-pressed=\"false\">⚠️ Wrong way\u003c/button>\n    \u003c/div>\n  \u003c/div>\n  \u003cdiv class=\"mode-note\" id=\"modeNote\" aria-live=\"polite\">\u003c/div>\n\n  \u003cdiv class=\"stage\">\n    \u003cdiv class=\"phone\">\n      \u003cdiv class=\"screen\">\n        \u003cdiv class=\"sbar\" aria-hidden=\"true\">\u003cspan>10:00\u003c/span>\u003cspan>▮▮▮ 5G\u003c/span>\u003c/div>\n        \u003cdiv class=\"apphead\">\n          \u003cspan class=\"back\" aria-hidden=\"true\">‹\u003c/span>\n          \u003cdiv>\u003cb>Book ticket\u003c/b>\u003csmall>Tue, 10 Nov\u003c/small>\u003c/div>\n          \u003cspan class=\"tatkal\">Tatkal\u003c/span>\n        \u003c/div>\n        \u003cdiv class=\"scroll\">\n          \u003cdiv class=\"card\">\n            \u003cdiv class=\"route\">\n              \u003cdiv class=\"stn\">\u003cb>MAS\u003c/b>\u003csmall>Chennai Central\u003c/small>\u003c/div>\n              \u003cdiv class=\"line\" aria-hidden=\"true\">\u003c/div>\n              \u003cdiv class=\"stn r\">\u003cb>NDLS\u003c/b>\u003csmall>New Delhi\u003c/small>\u003c/div>\n            \u003c/div>\n            \u003cdiv class=\"tname\">12621 Tamil Nadu Express\u003c/div>\n            \u003cdiv class=\"chips\">\u003cspan>Sleeper (SL)\u003c/span>\u003cspan>Coach S4\u003c/span>\u003cspan>Departs 22:00\u003c/span>\u003c/div>\n          \u003c/div>\n          \u003cdiv class=\"card avail\">\n            \u003cdiv>\u003csmall>Seat availability\u003c/small>\u003cb>Coach S4\u003c/b>\u003c/div>\n            \u003cspan class=\"avl\" id=\"avl\">Available 3\u003c/span>\n          \u003c/div>\n          \u003cdiv class=\"card\">\n            \u003cdiv class=\"field\">\n              \u003clabel for=\"pname\">Passenger name\u003c/label>\n              \u003cinput id=\"pname\" value=\"Meena\" maxlength=\"20\" autocomplete=\"off\">\n            \u003c/div>\n            \u003cdiv class=\"row\">\n              \u003cspan>Passengers\u003c/span>\n              \u003cdiv class=\"stepper\">\n                \u003cbutton id=\"minus\" aria-label=\"Fewer passengers\">−\u003c/button>\n                \u003coutput id=\"count\" aria-live=\"polite\">1\u003c/output>\n                \u003cbutton id=\"plus\" aria-label=\"More passengers\">+\u003c/button>\n              \u003c/div>\n            \u003c/div>\n          \u003c/div>\n        \u003c/div>\n        \u003cdiv class=\"bookbar\">\n          \u003cdiv class=\"sum\">\u003cspan id=\"sumText\">1 passenger, Sleeper\u003c/span>\u003cspan>Tatkal quota\u003c/span>\u003c/div>\n          \u003cbutton class=\"book\" id=\"bookBtn\">Book now\u003c/button>\n        \u003c/div>\n        \u003cdiv class=\"scrim\" id=\"scrim\">\u003c/div>\n        \u003cdiv class=\"sheet\" id=\"sheet\" role=\"dialog\" aria-live=\"polite\">\u003c/div>\n      \u003c/div>\n    \u003c/div>\n\n    \u003cdiv class=\"coach\">\n      \u003cdiv class=\"coach-head\">\n        \u003cdiv>\u003ch2>Coach S4, Sleeper\u003c/h2>\u003csmall>Tap any berth to see who has it\u003c/small>\u003c/div>\n        \u003cbutton class=\"reset\" id=\"resetBtn\">Reset coach\u003c/button>\n      \u003c/div>\n      \u003cdiv class=\"stats\">\n        \u003cdiv class=\"stat\">\u003csmall>Berths in coach\u003c/small>\u003cb>72\u003c/b>\u003c/div>\n        \u003cdiv class=\"stat\" id=\"stIssued\">\u003csmall>Tickets issued\u003c/small>\u003cb id=\"issued\">69\u003c/b>\u003c/div>\n        \u003cdiv class=\"stat\" id=\"stFree\">\u003csmall>Free berths\u003c/small>\u003cb id=\"free\">3\u003c/b>\u003c/div>\n      \u003c/div>\n      \u003cdiv class=\"train-body\">\u003cdiv class=\"bays\" id=\"bays\">\u003c/div>\u003c/div>\n      \u003cdiv class=\"legend\">\n        \u003cspan>\u003ci class=\"lt\">\u003c/i>Booked by others\u003c/span>\n        \u003cspan>\u003ci class=\"lf\">\u003c/i>Free\u003c/span>\n        \u003cspan>\u003ci class=\"ly\">\u003c/i>Your bookings\u003c/span>\n        \u003cspan>\u003ci class=\"lc\">\u003c/i>Two passengers\u003c/span>\n      \u003c/div>\n      \u003cdiv class=\"info\" id=\"info\" aria-live=\"polite\">Book a ticket on the phone and your berth will light up here.\u003c/div>\n\n      \u003cdiv class=\"tasks\">\n        \u003ch3>Try this\u003c/h3>\n        \u003col id=\"tasks\">\n          \u003cli data-t=\"1\">Book 1 passenger \u003cspan class=\"tag r\">Right way\u003c/span>\u003c/li>\n          \u003cli data-t=\"2\">Book 3 passengers when only 1 berth is free \u003cspan class=\"tag r\">Right way\u003c/span>\u003c/li>\n          \u003cli data-t=\"3\">Book 3 passengers when only 1 berth is free \u003cspan class=\"tag w\">Wrong way\u003c/span>\u003c/li>\n          \u003cli data-t=\"4\">Tap a red berth and see who sleeps there\u003c/li>\n        \u003c/ol>\n        \u003cp class=\"alldone\" id=\"alldone\">All done. Which way would you trust with your ticket?\u003c/p>\n      \u003c/div>\n    \u003c/div>\n  \u003c/div>\n\u003c/main>\n\n\u003cfooter>\n  \u003cnav class=\"site-nav\" aria-label=\"Chapters\">\n    \u003ca href=\"atomicity.html\">← Previous: Send ₹500\u003c/a>\n    \u003ca href=\"index.html\">All chapters\u003c/a>\n    \u003ca href=\"isolation.html\">Next: Last phone sale →\u003c/a>\n  \u003c/nav>\n\u003c/footer>\n\n\u003cscript>\n(() => {\n  const TOTAL = 72;\n  const TYPES = ['Lower','Middle','Upper','Lower','Middle','Upper','Side lower','Side upper'];\n  const SHORT = ['LB','MB','UB','LB','MB','UB','SL','SU'];\n  const MY_NAMES = ['Meena','Arjun','Kavya','Rahul','Priya','Suresh','Divya','Imran'];\n  const OTHERS = ['Ganesh','Lakshmi','Vikram','Anitha','Joseph','Fatima','Karthik','Revathi','Siddharth','Nandini','Abdul','Harini','Manoj','Deepa','Ravi','Sneha'];\n  const $ = s => document.querySelector(s);\n\n  let mode = 'right', berths, count = 1, pnr = 4521003070, nameIdx = 0, lastNew = [], selected = null;\n  const done = new Set();\n\n  function reset(note) {\n    const free = new Set();\n    while (free.size \u003c 3) free.add(1 + Math.floor(Math.random() * TOTAL));\n    berths = {};\n    for (let n = 1; n \u003c= TOTAL; n++) berths[n] = free.has(n) ? [] : [{name: OTHERS[(n * 7) % OTHERS.length], mine: false}];\n    lastNew = []; selected = null; count = 1;\n    nameIdx = 0; $('#pname').value = MY_NAMES[0];\n    closeSheet();\n    $('#info').className = 'info';\n    $('#info').textContent = note || 'Book a ticket on the phone and your berth will light up here.';\n    render();\n  }\n\n  const issued = () => Object.values(berths).reduce((s, a) => s + a.length, 0);\n  const freeCount = () => TOTAL - issued();\n  const label = n => `S4-${n} ${SHORT[(n - 1) % 8]}`;\n  const names = a => a.map(o => o.name).join(' and ');\n\n  function render() {\n    const free = freeCount();\n    const avl = $('#avl');\n    avl.textContent = (mode === 'right' && free \u003c= 0) ? 'Waiting list' : `Available ${free}`;\n    avl.classList.toggle('wl', free \u003c= 0);\n    $('#count').textContent = count;\n    $('#minus').disabled = count \u003c= 1;\n    $('#plus').disabled = count >= 4;\n    $('#sumText').textContent = `${count} passenger${count > 1 ? 's' : ''}, Sleeper`;\n    $('#issued').textContent = issued();\n    $('#free').textContent = free;\n    $('#stIssued').classList.toggle('bad', issued() > TOTAL);\n    $('#stFree').classList.toggle('bad', free \u003c 0);\n\n    let html = '';\n    for (let b = 0; b \u003c 9; b++) {\n      const cell = k => {\n        const n = b * 8 + k, a = berths[n];\n        let cls = 'free';\n        if (a.length > 1) cls = 'clash';\n        else if (a.length === 1) cls = a[0].mine ? 'you' : 'taken';\n        if (lastNew.includes(n)) cls += ' new';\n        if (selected === n) cls += ' sel';\n        const who = a.length ? names(a) : 'free';\n        return `\u003cbutton class=\"berth ${cls}\" data-b=\"${n}\" data-n=\"${a.length}\" aria-label=\"Berth ${n} ${TYPES[k - 1]}: ${who}\">${n}\u003c/button>`;\n      };\n      html += `\u003cdiv class=\"bay\">\u003cdiv class=\"bay-seats\">\u003cdiv class=\"bcol\">${cell(3)}${cell(2)}${cell(1)}\u003c/div>\u003cdiv class=\"bcol\">${cell(6)}${cell(5)}${cell(4)}\u003c/div>\u003cdiv class=\"aisle\">\u003c/div>\u003cdiv class=\"bcol side\">${cell(8)}${cell(7)}\u003c/div>\u003c/div>\u003cdiv class=\"bay-name\">Bay ${b + 1}\u003c/div>\u003c/div>`;\n    }\n    $('#bays').innerHTML = html;\n\n    document.querySelectorAll('#tasks li').forEach(li => li.classList.toggle('done', done.has(+li.dataset.t)));\n    $('#alldone').classList.toggle('show', done.size === 4);\n  }\n\n  function openSheet(html, ok) {\n    const s = $('#sheet');\n    s.className = 'sheet open ' + (ok ? 'ok' : 'bad');\n    s.innerHTML = html + '\u003cbutton class=\"done\" id=\"doneBtn\">Done\u003c/button>';\n    $('#scrim').classList.add('open');\n    $('#doneBtn').addEventListener('click', closeSheet);\n    $('#doneBtn').focus({preventScroll:true});\n  }\n  function closeSheet() {\n    $('#sheet').className = 'sheet';\n    $('#scrim').classList.remove('open');\n  }\n\n  function book() {\n    const name = ($('#pname').value.trim() || 'Passenger').replace(/[\u003c>&\"]/g, '');\n    const free = freeCount();\n    const empty = [];\n    for (let n = 1; n \u003c= TOTAL; n++) if (berths[n].length === 0) empty.push(n);\n\n    if (mode === 'right' && count > free) {\n      if (count >= 3 && free === 1) done.add(2);\n      lastNew = [];\n      render();\n      openSheet(`\n        \u003cdiv class=\"icon\">✕\u003c/div>\n        \u003ch3>${free \u003c= 0 ? 'Coach is full' : 'Not enough berths'}\u003c/h3>\n        \u003cp>${free \u003c= 0\n          ? `There are no free berths in S4. ${name} has been added to the waiting list.`\n          : `You asked for ${count} berths, but only ${free} ${free > 1 ? 'are' : 'is'} free.`}\u003c/p>\n        \u003cp>Nothing was booked. No money was taken.\u003c/p>`, false);\n      $('#info').className = 'info';\n      $('#info').textContent = `${name}${count > 1 ? ` +${count - 1}` : ''}: booking refused. The coach is unchanged.`;\n      return;\n    }\n\n    // Pick berths: empty ones first; the wrong way also reuses booked ones\n    const seats = empty.slice(0, count);\n    if (seats.length \u003c count) {\n      const reuse = [];\n      for (let n = 1; n \u003c= TOTAL && seats.length + reuse.length \u003c count; n++) {\n        const k = ((n * 29) % TOTAL) + 1;\n        if (berths[k].length === 1 && !seats.includes(k) && !reuse.includes(k)) reuse.push(k);\n      }\n      seats.push(...reuse);\n    }\n    const shared = {};\n    seats.forEach((n, i) => {\n      if (berths[n].length) shared[n] = names(berths[n]);\n      berths[n].push({name: count > 1 ? `${name} (${i + 1}/${count})` : name, mine: true});\n    });\n    pnr += 1;\n    lastNew = seats;\n    const clashes = Object.keys(shared).length;\n\n    if (mode === 'right') done.add(1);\n    if (mode === 'wrong' && clashes && count >= 3 && free \u003c= 1) done.add(3);\n\n    render();\n    openSheet(`\n      \u003cdiv class=\"icon\">✓\u003c/div>\n      \u003ch3>Booking confirmed\u003c/h3>\n      \u003cp>${name}${count > 1 ? ` and ${count - 1} more` : ''}, have a good journey.\u003c/p>\n      \u003cdiv class=\"seats\">${seats.map(n => shared[n]\n        ? `\u003cdiv class=\"seat clash\">\u003cb>${label(n)}\u003c/b>\u003cem>Also on ${shared[n]}’s ticket\u003c/em>\u003c/div>`\n        : `\u003cdiv class=\"seat\">\u003cb>${label(n)}\u003c/b>\u003cspan>Confirmed\u003c/span>\u003c/div>`).join('')}\u003c/div>\n      \u003cdiv class=\"pnr\">PNR ${pnr}\u003c/div>`, true);\n\n    const info = $('#info');\n    if (clashes) {\n      info.className = 'info clash';\n      info.textContent = `${clashes} berth${clashes > 1 ? 's were' : ' was'} given to two people. Tap the red berth${clashes > 1 ? 's' : ''} to see who.`;\n    } else {\n      info.className = 'info';\n      info.textContent = `${name}${count > 1 ? ` +${count - 1}` : ''}: ${seats.map(label).join(', ')}.`;\n    }\n\n    nameIdx = (nameIdx + 1) % MY_NAMES.length;\n    $('#pname').value = MY_NAMES[nameIdx];\n    count = 1;\n    render();\n    setTimeout(() => { lastNew = []; }, 800);\n  }\n\n  function showBerth(n) {\n    selected = n;\n    const a = berths[n], k = (n - 1) % 8;\n    const info = $('#info');\n    if (a.length > 1) {\n      info.className = 'info clash';\n      info.textContent = `Berth ${n} (${TYPES[k]}): ${names(a)} both have a confirmed ticket for this one berth.`;\n      done.add(4);\n    } else if (a.length === 1) {\n      info.className = 'info';\n      info.textContent = `Berth ${n} (${TYPES[k]}): ${a[0].name}${a[0].mine ? ' (your booking)' : ''}.`;\n    } else {\n      info.className = 'info';\n      info.textContent = `Berth ${n} (${TYPES[k]}): free.`;\n    }\n    render();\n  }\n\n  function setMode(m) {\n    if (m === mode) return;\n    mode = m;\n    document.querySelectorAll('.seg button').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.mode === m)));\n    reset(`Coach reset: 3 berths free again. You’re now booking the ${m === 'right' ? 'right' : 'wrong'} way.`);\n    $('#modeNote').textContent = m === 'right' ? 'The app checks free berths before confirming.' : 'The app confirms every booking without checking.';\n  }\n\n  $('#bookBtn').addEventListener('click', book);\n  $('#scrim').addEventListener('click', closeSheet);\n  $('#minus').addEventListener('click', () => { if (count > 1) { count--; render(); } });\n  $('#plus').addEventListener('click', () => { if (count \u003c 4) { count++; render(); } });\n  $('#resetBtn').addEventListener('click', () => reset('Coach reset: 3 berths free again.'));\n  $('#bays').addEventListener('click', e => { const b = e.target.closest('[data-b]'); if (b) showBerth(+b.dataset.b); });\n  document.querySelectorAll('.seg button').forEach(b => b.addEventListener('click', () => setMode(b.dataset.mode)));\n\n  $('#modeNote').textContent = 'The app checks free berths before confirming.';\n  reset();\n})();\n\u003c/script>\n\u003cscript>(function () {\n  document.addEventListener('click', function (e) {\n    if (e.defaultPrevented || e.button !== 0 || e.metaKey || e.ctrlKey || e.shiftKey || e.altKey) return;\n    var a = e.target.closest && e.target.closest('a[href]');\n    var m = a && /^(index|atomicity|consistency|isolation|durability)\\.html$/.exec(a.getAttribute('href').split('#')[0]);\n    if (!m) return;\n    e.preventDefault();\n    parent.postMessage({ acidPage: m[1] }, '*');\n  });\n}());\u003c/script>\n\u003c/body>\n\u003c/html>\n","isolation":"\u003c!DOCTYPE html>\n\u003chtml lang=\"en\">\n\u003chead>\n\u003cmeta charset=\"utf-8\">\n\u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1, viewport-fit=cover\">\n\u003ctitle>Last Phone Sale Story\u003c/title>\n\u003clink rel=\"preconnect\" href=\"https://fonts.googleapis.com\">\n\u003clink rel=\"preconnect\" href=\"https://fonts.gstatic.com\" crossorigin>\n\u003clink href=\"https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap\" rel=\"stylesheet\">\n\u003cstyle>\n:root{\n  --bg:#FFFFFF; --soft:#F4F6F9; --ink:#18212E; --muted:#5A6576; --line:#E1E5EB;\n  --accent:#2457A6; --accent-soft:#E7EEF9;\n  --ok:#1D8048; --ok-soft:#E5F4EB; --bad:#C3362C; --bad-soft:#FCE9E7; --hold:#B26A00; --hold-soft:#FFF1D6;\n  --phone:#10161F;\n  --body:\"IBM Plex Sans\",system-ui,-apple-system,\"Segoe UI\",Roboto,sans-serif;\n  --mono:\"JetBrains Mono\",ui-monospace,Menlo,Consolas,monospace;\n  color-scheme:light;\n  box-sizing:border-box;\n  padding-top:env(safe-area-inset-top,0px);\n  padding-bottom:env(safe-area-inset-bottom,0px);\n}\n@media (prefers-color-scheme:dark){\n  :root:not([data-theme=\"light\"]){\n    --bg:#0F151E; --soft:#17202C; --ink:#E6EBF2; --muted:#9AA6B6; --line:#263244;\n    --accent:#7AA5EC; --accent-soft:#1B2B44;\n    --ok:#4CC27F; --ok-soft:#15301F; --bad:#F06C62; --bad-soft:#3A1C1A; --hold:#F0B24A; --hold-soft:#3A2C12;\n    --phone:#05080C; color-scheme:dark;\n  }\n}\n:root[data-theme=\"dark\"]{\n  --bg:#0F151E; --soft:#17202C; --ink:#E6EBF2; --muted:#9AA6B6; --line:#263244;\n  --accent:#7AA5EC; --accent-soft:#1B2B44;\n  --ok:#4CC27F; --ok-soft:#15301F; --bad:#F06C62; --bad-soft:#3A1C1A; --hold:#F0B24A; --hold-soft:#3A2C12;\n  --phone:#05080C; color-scheme:dark;\n}\n*,*::before,*::after{box-sizing:inherit}\nhtml{scroll-padding-top:env(safe-area-inset-top,0px)}\nbody{margin:0;background:var(--soft);color:var(--ink);font:400 17px/1.6 var(--body);-webkit-font-smoothing:antialiased}\nbutton{font:inherit;cursor:pointer}\n:focus-visible{outline:3px solid var(--accent);outline-offset:3px}\n.wrap{max-width:1080px;margin:0 auto;padding:44px 22px 56px}\n.intro{max-width:680px;margin:0 auto 26px;text-align:center}\nh1{font-size:clamp(1.8rem,5vw,2.5rem);line-height:1.15;margin:0 0 10px;font-weight:700;letter-spacing:-.02em}\n.intro p{margin:0;color:var(--muted);font-size:1.08rem}\n\n.modes{display:flex;justify-content:center;margin:0 auto 14px}\n.seg{display:inline-flex;background:var(--bg);border:1px solid var(--line);border-radius:14px;padding:4px;gap:4px}\n.seg button{border:0;border-radius:10px;padding:11px 20px;background:transparent;color:var(--muted);font-weight:600;font-size:.98rem;transition:background .2s,color .2s}\n.seg button[aria-pressed=\"true\"].right{background:var(--ok);color:#fff}\n.seg button[aria-pressed=\"true\"].wrong{background:var(--bad);color:#fff}\n.mode-note{text-align:center;color:var(--muted);font-size:.9rem;min-height:1.4em;margin-bottom:22px}\n\n/* Stage: phone | warehouse | phone */\n.stage{display:grid;grid-template-columns:290px minmax(0,1fr) 290px;gap:22px;align-items:start}\n.who{text-align:center;font-weight:600;margin-bottom:10px}\n.who small{display:block;color:var(--muted);font-weight:400;font-size:.85rem}\n\n/* Phone (stays light like a real app) */\n.phone{font-size:15px;background:var(--phone);border-radius:2.6em;padding:.6em;box-shadow:0 22px 44px -20px rgba(16,22,31,.5)}\n.screen{background:#F6F6FA;color:#1B1B2F;border-radius:2em;overflow:hidden;height:38em;display:flex;flex-direction:column;position:relative}\n.sbar{display:flex;justify-content:space-between;padding:.7em 1.4em .3em;font-size:.72em;font-weight:600;background:#fff}\n.apphead{background:#fff;padding:.3em .9em .7em;display:flex;align-items:center;gap:.6em}\n.logo{font-weight:800;font-size:1.05em;color:#5B2BE0;letter-spacing:-.03em;white-space:nowrap}\n.logo i{font-style:normal;color:#FF8A00}\n.search{flex:1;min-width:0;background:#F1F1F6;border-radius:99px;padding:.45em .8em;font-size:.72em;color:#8A8AA0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}\n.salebar{background:#FFE9A8;color:#6B4200;font-size:.74em;font-weight:600;padding:.45em 1.2em;display:flex;justify-content:space-between;gap:.5em}\n.salebar b{font-family:var(--mono);font-weight:500}\n.view{flex:1;overflow:auto;padding:.8em;animation:fade .3s ease}\n.hero{background:#EEE9FF;border-radius:1.1em;height:11em;display:grid;place-items:center;position:relative}\n.hero svg{height:8.6em;width:auto;display:block}\n.off{position:absolute;top:.7em;left:.7em;background:#E2364F;color:#fff;font-size:.7em;font-weight:700;padding:.25em .6em;border-radius:.5em}\n.pinfo{padding:.8em .2em 0}\n.pname{font-weight:700;line-height:1.3}\n.rating{font-size:.75em;color:#6A6A80;margin-top:.2em}\n.rating b{background:#1D8048;color:#fff;padding:.05em .45em;border-radius:.35em;font-weight:600;margin-right:.35em}\n.pricerow{display:flex;align-items:baseline;gap:.45em;margin-top:.45em;flex-wrap:wrap}\n.pricerow .now{font-size:1.4em;font-weight:800;letter-spacing:-.01em}\n.pricerow s{font-size:.8em;color:#8A8AA0}\n.pricerow .pct{font-size:.8em;color:#1D8048;font-weight:700}\n.stock{display:inline-block;margin-top:.45em;font-size:.75em;font-weight:700;padding:.3em .7em;border-radius:.5em;background:#FFE4E8;color:#C21F3A}\n.stock.out{background:#ECECF2;color:#6A6A80}\n.deliv{font-size:.75em;color:#55556A;margin-top:.6em}\n.cta{background:#fff;padding:.7em .8em .9em;border-top:1px solid #EAEAF0;display:grid;gap:.2em}\n.btn{width:100%;border:0;border-radius:.8em;padding:.85em;font-weight:700;font-size:.95em}\n.btn.buy,.btn.pay{background:#5B2BE0;color:#fff}\n.btn.ghost{background:transparent;color:#5B2BE0;padding:.5em;font-weight:600}\n.btn:active{transform:scale(.98)}\n.h{font-weight:700;font-size:1.05em;margin:.1em 0 .6em}\n.crow{background:#fff;border-radius:.9em;padding:.65em;margin-bottom:.55em;display:flex;gap:.65em;align-items:center;font-size:.82em}\n.crow .ic{width:2.3em;height:2.3em;border-radius:.6em;background:#EEE9FF;display:grid;place-items:center;flex:none}\n.crow small{display:block;color:#6A6A80;font-size:.9em}\n.crow .radio{margin-left:auto;width:1.1em;height:1.1em;border-radius:50%;border:.32em solid #5B2BE0;flex:none}\n.sum{background:#fff;border-radius:.9em;padding:.65em .8em;font-size:.82em}\n.sum div{display:flex;justify-content:space-between;padding:.15em 0}\n.sum .free{color:#1D8048;font-weight:600}\n.sum .tot{font-weight:800;border-top:1px dashed #DDDDE6;margin-top:.3em;padding-top:.45em}\n.view.center{display:flex;flex-direction:column;text-align:center;justify-content:center;align-items:center;padding:1.2em}\n.big{width:3.6em;height:3.6em;border-radius:50%;display:grid;place-items:center;font-size:1.4em;font-weight:800;margin:0 auto .7em}\n.big.ok{background:#E5F4EB;color:#1D8048}\n.big.bad{background:#FCE9E7;color:#C3362C}\n.big.wait{background:#FFF1D6;color:#8A5A00}\n.center p{margin:.2em 0;font-size:.86em;color:#55556A;line-height:1.45}\n.center .t{font-size:1.15em;font-weight:800;color:#1B1B2F;margin-bottom:.25em}\n.spinner{width:2.8em;height:2.8em;border-radius:50%;border:.3em solid #EEE9FF;border-top-color:#5B2BE0;animation:spin .9s linear infinite;margin:0 auto .9em}\n.toast{position:absolute;left:.8em;right:.8em;top:5.6em;background:#1B1B2F;color:#fff;border-radius:.8em;padding:.6em .8em;font-size:.8em;font-weight:600;animation:drop .35s ease}\n\n/* Warehouse */\n.ware{background:var(--bg);border-radius:18px;padding:20px}\n.ware h2{margin:0;font-size:1.25rem;line-height:1.2}\n.ware .sub{color:var(--muted);font-size:.86rem;margin:2px 0 14px}\n.shelf{background:var(--soft);border-radius:12px;padding:14px;display:flex;align-items:flex-end;gap:10px;min-height:86px;border-bottom:6px solid var(--line)}\n.shelf .crate{font-size:2.6rem;line-height:1;transition:opacity .4s,transform .4s}\n.shelf .crate.gone{opacity:.15;transform:translateY(-6px)}\n.shelf small{margin-left:auto;color:var(--muted);font-size:.82rem}\n.nums{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0}\n.num{background:var(--soft);border-radius:10px;padding:8px 10px}\n.num small{display:block;color:var(--muted);font-size:.74rem;line-height:1.3}\n.num b{font-size:1.5rem;line-height:1.2;font-variant-numeric:tabular-nums}\n.num.bad{background:var(--bad-soft)} .num.bad b{color:var(--bad)}\n.hold{border-radius:10px;padding:10px 12px;font-size:.9rem;font-weight:500;background:var(--soft);color:var(--muted);margin-bottom:12px}\n.hold.on{background:var(--hold-soft);color:var(--hold)}\n.hold.many{background:var(--bad-soft);color:var(--bad)}\n.orders h3{font-size:.9rem;margin:0 0 6px}\n.orders ul{list-style:none;margin:0;padding:0;display:grid;gap:6px}\n.orders li{display:flex;justify-content:space-between;gap:8px;font-size:.88rem;padding:7px 10px;border-radius:8px;background:var(--soft)}\n.orders li em{font-style:normal;font-weight:600;font-size:.78rem}\n.orders li.ok em{color:var(--ok)}\n.orders li.cx{background:var(--bad-soft)} .orders li.cx em{color:var(--bad)}\n.orders .empty{color:var(--muted);background:none;padding:0}\n.reset{margin-top:14px;width:100%;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:10px;padding:9px;font-size:.9rem;font-weight:500}\n\n/* Bottom: timeline + tasks */\n.below{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:22px;margin-top:26px}\n.panel{background:var(--bg);border-radius:18px;padding:20px}\n.panel h3{margin:0 0 10px;font-size:1.05rem}\n.timeline{list-style:none;margin:0;padding:0;display:grid;gap:8px;max-height:300px;overflow:auto}\n.timeline li{display:grid;grid-template-columns:auto 1fr;gap:10px;font-size:.9rem;align-items:baseline}\n.timeline time{font:500 .78rem var(--mono);color:var(--muted)}\n.timeline .p{color:#7A3FE0;font-weight:600}\n.timeline .r{color:#0F8A8A;font-weight:600}\n.timeline li.bad span{color:var(--bad)}\n.timeline .empty{color:var(--muted);display:block}\n.tasks ol{list-style:none;margin:0;padding:0;display:grid;gap:9px;counter-reset:t}\n.tasks li{display:flex;gap:10px;align-items:flex-start;font-size:.93rem;counter-increment:t}\n.tasks li::before{content:counter(t);flex:none;width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font-size:.78rem;font-weight:700;background:var(--soft);color:var(--muted)}\n.tasks li.done{color:var(--muted)}\n.tasks li.done::before{content:\"✓\";background:var(--ok);color:#fff}\n.tag{font-size:.72rem;font-weight:700;padding:2px 7px;border-radius:99px;margin-left:4px;vertical-align:1px;white-space:nowrap}\n.tag.r{background:var(--ok-soft);color:var(--ok)}\n.tag.w{background:var(--bad-soft);color:var(--bad)}\n.alldone{margin:12px 0 0;font-weight:600;color:var(--ok);display:none}\n.alldone.show{display:block}\n\nfooter{border-top:1px solid var(--line);padding:26px 0 40px;background:var(--bg)}\n.chapters{max-width:1080px;margin:0 auto;padding:0 22px;display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;font-weight:600;color:var(--muted)}\n\n@keyframes spin{to{transform:rotate(360deg)}}\n@keyframes fade{from{opacity:0}to{opacity:1}}\n@keyframes blink{50%{opacity:.35}}\n@keyframes drop{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:none}}\n@media (prefers-reduced-motion:reduce){*{animation:none !important;transition:none !important}.spinner{border-left-color:#5B2BE0}}\n\n@media (max-width:980px){\n  .stage{grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:14px}\n  .stage > div{min-width:0}\n  .ware{grid-column:1 / -1;order:3}\n  .below{grid-template-columns:minmax(0,1fr)}\n}\n@media (max-width:620px){\n  .wrap{padding:32px 12px 44px}\n  .phone{font-size:10.5px;border-radius:2em}\n  .search{display:none}\n  .apphead{justify-content:space-between}\n  .salebar{padding:.45em .9em}\n  .who{font-size:.9rem}\n  .seg button{padding:10px 14px}\n  .num b{font-size:1.25rem}\n}\n.site-nav{max-width:1060px;margin:0 auto;padding:0 22px;display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap;font-weight:600}\n.site-nav a{color:var(--accent);text-decoration:none}\n.site-nav a:hover{text-decoration:underline}\n.site-nav .gap{min-width:1px}\n\u003c/style>\n\u003c/head>\n\u003cbody>\n\n\u003cmain class=\"wrap\">\n  \u003cdiv class=\"intro\">\n    \u003ch1>12:00 PM, the sale goes live\u003c/h1>\n    \u003cp>The Nova X phone is ₹49,999 today, and only 1 is left. Priya in Chennai and Rahul in Delhi both want it at the same moment. You play both of them. Try the right way and the wrong way.\u003c/p>\n  \u003c/div>\n\n  \u003cdiv class=\"modes\">\n    \u003cdiv class=\"seg\" role=\"group\" aria-label=\"Shop system\">\n      \u003cbutton class=\"right\" data-mode=\"right\" aria-pressed=\"true\">✅ Right way\u003c/button>\n      \u003cbutton class=\"wrong\" data-mode=\"wrong\" aria-pressed=\"false\">⚠️ Wrong way\u003c/button>\n    \u003c/div>\n  \u003c/div>\n  \u003cdiv class=\"mode-note\" id=\"modeNote\" aria-live=\"polite\">\u003c/div>\n\n  \u003cdiv class=\"stage\">\n    \u003cdiv>\n      \u003cdiv class=\"who\">Priya\u003csmall>Chennai\u003c/small>\u003c/div>\n      \u003cdiv class=\"phone\">\u003cdiv class=\"screen\" id=\"ph-priya\">\u003c/div>\u003c/div>\n    \u003c/div>\n\n    \u003cdiv class=\"ware\" aria-live=\"polite\">\n      \u003ch2>Warehouse\u003c/h2>\n      \u003cp class=\"sub\">What the shop really has\u003c/p>\n      \u003cdiv class=\"shelf\" id=\"shelf\">\u003c/div>\n      \u003cdiv class=\"nums\">\n        \u003cdiv class=\"num\">\u003csmall>Phones on shelf\u003c/small>\u003cb id=\"nShelf\">1\u003c/b>\u003c/div>\n        \u003cdiv class=\"num\">\u003csmall>Stock shown on site\u003c/small>\u003cb id=\"nStock\">1\u003c/b>\u003c/div>\n        \u003cdiv class=\"num\" id=\"paidBox\">\u003csmall>Paid orders\u003c/small>\u003cb id=\"nPaid\">0\u003c/b>\u003c/div>\n      \u003c/div>\n      \u003cdiv class=\"hold\" id=\"hold\">Nobody is at checkout.\u003c/div>\n      \u003cdiv class=\"orders\">\n        \u003ch3>Orders\u003c/h3>\n        \u003cul id=\"orders\">\u003cli class=\"empty\">No orders yet.\u003c/li>\u003c/ul>\n      \u003c/div>\n      \u003cbutton class=\"reset\" id=\"resetBtn\">Start the sale again\u003c/button>\n    \u003c/div>\n\n    \u003cdiv>\n      \u003cdiv class=\"who\">Rahul\u003csmall>Delhi\u003c/small>\u003c/div>\n      \u003cdiv class=\"phone\">\u003cdiv class=\"screen\" id=\"ph-rahul\">\u003c/div>\u003c/div>\n    \u003c/div>\n  \u003c/div>\n\n  \u003cdiv class=\"below\">\n    \u003cdiv class=\"panel\">\n      \u003ch3>What happened\u003c/h3>\n      \u003col class=\"timeline\" id=\"timeline\">\u003cli class=\"empty\">Tap a button on either phone.\u003c/li>\u003c/ol>\n    \u003c/div>\n    \u003cdiv class=\"panel tasks\">\n      \u003ch3>Try this\u003c/h3>\n      \u003col id=\"tasks\">\n        \u003cli data-t=\"1\">Tap “Buy now” on both phones \u003cspan class=\"tag r\">Right way\u003c/span>\u003c/li>\n        \u003cli data-t=\"2\">Pay on the first phone and watch the other one \u003cspan class=\"tag r\">Right way\u003c/span>\u003c/li>\n        \u003cli data-t=\"3\">Start again. Tap “Buy now” on both, then cancel on the first phone \u003cspan class=\"tag r\">Right way\u003c/span>\u003c/li>\n        \u003cli data-t=\"4\">Tap “Buy now” on both phones, then pay on both \u003cspan class=\"tag w\">Wrong way\u003c/span>\u003c/li>\n        \u003cli data-t=\"5\">Wait a few seconds and see what happens to the second buyer \u003cspan class=\"tag w\">Wrong way\u003c/span>\u003c/li>\n      \u003c/ol>\n      \u003cp class=\"alldone\" id=\"alldone\">All done. Which shop would you trust with ₹49,999?\u003c/p>\n    \u003c/div>\n  \u003c/div>\n\u003c/main>\n\n\u003cfooter>\n  \u003cnav class=\"site-nav\" aria-label=\"Chapters\">\n    \u003ca href=\"consistency.html\">← Previous: Tatkal booking\u003c/a>\n    \u003ca href=\"index.html\">All chapters\u003c/a>\n    \u003ca href=\"durability.html\">Next: The power cut →\u003c/a>\n  \u003c/nav>\n\u003c/footer>\n\n\u003cscript>\n(() => {\n  const $ = s => document.querySelector(s);\n  const PRICE = '₹49,999';\n  const done = new Set();\n  let S, clock, timers = [];\n\n  function fresh(mode) {\n    timers.forEach(clearTimeout); timers = [];\n    clock = 12 * 3600;\n    S = {\n      mode, shelf: 1, stock: 1, holder: null, queue: [], orders: [], events: [],\n      users: {\n        priya: {id:'priya', name:'Priya', city:'Chennai', screen:'browse', snap:1, toast:null},\n        rahul: {id:'rahul', name:'Rahul', city:'Delhi',   screen:'browse', snap:1, toast:null}\n      }\n    };\n  }\n  const other = id => id === 'priya' ? 'rahul' : 'priya';\n\n  function stamp() {\n    clock += 1 + Math.floor(Math.random() * 3);\n    const h = Math.floor(clock / 3600), m = Math.floor(clock / 60) % 60, s = clock % 60;\n    return `${h}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;\n  }\n  function log(uid, text, bad) {\n    S.events.push({t: stamp(), uid, text, bad});\n  }\n\n  /* ---------- Actions ---------- */\n  function buy(uid) {\n    const u = S.users[uid];\n    if (S.mode === 'right') {\n      if (S.stock \u003c= 0) { u.screen = 'soldout'; log(uid, 'tapped Buy now. Sold out, not charged.'); }\n      else if (S.holder && S.holder !== uid) {\n        u.screen = 'waiting'; S.queue.push(uid);\n        log(uid, `tapped Buy now. The phone is held for ${S.users[S.holder].name}, so ${u.name} waits.`);\n        done.add(1);\n      } else {\n        S.holder = uid; u.screen = 'checkout';\n        log(uid, 'tapped Buy now. The phone is held for them during checkout.');\n      }\n    } else {\n      if (u.snap \u003c= 0) { u.screen = 'soldout'; log(uid, 'tapped Buy now. Sold out.'); }\n      else {\n        u.screen = 'checkout';\n        const both = Object.values(S.users).filter(x => x.screen === 'checkout').length;\n        log(uid, `tapped Buy now. The screen says 1 left, so checkout opens.${both > 1 ? ' Both buyers are at checkout now.' : ''}`, both > 1);\n      }\n    }\n    render();\n  }\n\n  function pay(uid) {\n    const u = S.users[uid];\n    if (S.mode === 'right') {\n      S.stock -= 1; S.shelf -= 1; S.holder = null;\n      S.orders.push({uid, ok:true}); u.screen = 'done';\n      log(uid, `paid ${PRICE}. Order placed.`);\n      const waiting = S.queue.splice(0);\n      waiting.forEach(w => {\n        S.users[w].screen = 'soldout';\n        log(w, 'was waiting. The phone is now sold, so they see “Sold out”. No money taken.');\n        done.add(2);\n      });\n      S.users[other(uid)].snap = 0;\n    } else {\n      S.stock = u.snap - 1;\n      if (S.shelf > 0) S.shelf -= 1;\n      S.orders.push({uid, ok:true}); u.screen = 'done';\n      const paid = S.orders.filter(o => o.ok).length;\n      log(uid, `paid ${PRICE}. Order placed. The site sets stock to ${S.stock}.`, paid > S.shelf);\n      if (paid >= 2) {\n        done.add(4);\n        timers.push(setTimeout(() => {\n          S.orders[S.orders.length - 1].ok = false;\n          S.orders[S.orders.length - 1].cancelled = true;\n          u.screen = 'cancelled';\n          log(uid, `got a message: “Order cancelled, out of stock. Refund in 5 to 7 days.”`, true);\n          done.add(5);\n          render();\n        }, 2600));\n      } else if (S.users[other(uid)].screen === 'browse') {\n        // the other phone still shows the old number\n      }\n    }\n    render();\n  }\n\n  function cancel(uid) {\n    const u = S.users[uid];\n    u.screen = 'browse';\n    if (S.mode === 'right') {\n      S.holder = null;\n      log(uid, 'cancelled checkout. The phone is free again.');\n      const next = S.queue.shift();\n      if (next) {\n        S.holder = next; S.users[next].screen = 'checkout';\n        S.users[next].toast = 'Your turn! The phone is yours to buy.';\n        log(next, 'was waiting and now moves to checkout.');\n        done.add(3);\n        timers.push(setTimeout(() => { S.users[next].toast = null; render(); }, 2600));\n      }\n    } else {\n      log(uid, 'cancelled checkout.');\n    }\n    render();\n  }\n\n  function leave(uid) {\n    S.queue = S.queue.filter(x => x !== uid);\n    S.users[uid].screen = 'browse';\n    log(uid, 'stopped waiting and went back.');\n    render();\n  }\n\n  /* ---------- Rendering ---------- */\n  let saleLeft = 14 * 60 + 59;\n  function countdown() {\n    const m = Math.floor(saleLeft / 60), sec = saleLeft % 60;\n    return `00:${String(m).padStart(2,'0')}:${String(sec).padStart(2,'0')}`;\n  }\n  setInterval(() => {\n    saleLeft = saleLeft > 0 ? saleLeft - 1 : 14 * 60 + 59;\n    document.querySelectorAll('.cd').forEach(el => { el.textContent = countdown(); });\n  }, 1000);\n\n  function shownStock(u) { return S.mode === 'right' ? S.stock : u.snap; }\n\n  const PHONE_SVG = `\u003csvg viewBox=\"0 0 60 110\" aria-hidden=\"true\">\u003cdefs>\u003cclipPath id=\"scr\">\u003crect x=\"5.5\" y=\"8\" width=\"49\" height=\"94\" rx=\"6\"/>\u003c/clipPath>\u003c/defs>\u003crect x=\"2\" y=\"2\" width=\"56\" height=\"106\" rx=\"10\" fill=\"#23233A\"/>\u003cg clip-path=\"url(#scr)\">\u003crect x=\"5.5\" y=\"8\" width=\"49\" height=\"94\" fill=\"#7C5CFF\"/>\u003ccircle cx=\"18\" cy=\"32\" r=\"15\" fill=\"#A994FF\"/>\u003ccircle cx=\"46\" cy=\"82\" r=\"24\" fill=\"#5B2BE0\"/>\u003ccircle cx=\"41\" cy=\"44\" r=\"6\" fill=\"#FFD166\"/>\u003c/g>\u003crect x=\"24\" y=\"4\" width=\"12\" height=\"2.4\" rx=\"1.2\" fill=\"#3B3B55\"/>\u003c/svg>`;\n\n  function phoneHtml(u) {\n    const head = `\u003cdiv class=\"sbar\">\u003cspan>12:00\u003c/span>\u003cspan>▮▮▮ 4G\u003c/span>\u003c/div>\n      \u003cdiv class=\"apphead\">\u003cspan class=\"logo\">Big\u003ci>Sale\u003c/i>\u003c/span>\u003cspan class=\"search\">Search phones, shoes…\u003c/span>\u003cspan aria-hidden=\"true\">🛒\u003c/span>\u003c/div>\n      \u003cdiv class=\"salebar\">\u003cspan>⚡ Mega sale ends in\u003c/span>\u003cb class=\"cd\">${countdown()}\u003c/b>\u003c/div>`;\n    const toast = u.toast ? `\u003cdiv class=\"toast\">${u.toast}\u003c/div>` : '';\n    let v = '', cta = '';\n    switch (u.screen) {\n      case 'browse': {\n        const left = shownStock(u);\n        v = `\u003cdiv class=\"view\">\n          \u003cdiv class=\"hero\">${PHONE_SVG}\u003cspan class=\"off\">23% off\u003c/span>\u003c/div>\n          \u003cdiv class=\"pinfo\">\n            \u003cdiv class=\"pname\">Nova X 5G (256 GB)\u003c/div>\n            \u003cdiv class=\"rating\">\u003cb>4.6 ★\u003c/b>12,480 ratings\u003c/div>\n            \u003cdiv class=\"pricerow\">\u003cspan class=\"now\">${PRICE}\u003c/span>\u003cs>₹64,999\u003c/s>\u003cspan class=\"pct\">23% off\u003c/span>\u003c/div>\n            \u003cspan class=\"stock ${left \u003c= 0 ? 'out' : ''}\">${left > 0 ? `Hurry, only ${left} left!` : 'Sold out'}\u003c/span>\n            \u003cdiv class=\"deliv\">🚚 Free delivery by Friday\u003c/div>\n          \u003c/div>\n        \u003c/div>`;\n        cta = `\u003cdiv class=\"cta\">\u003cbutton class=\"btn buy\" data-a=\"buy\" data-u=\"${u.id}\">Buy now\u003c/button>\u003c/div>`;\n        break;\n      }\n      case 'checkout':\n        v = `\u003cdiv class=\"view\">\n          \u003cp class=\"h\">Checkout\u003c/p>\n          \u003cdiv class=\"crow\">\u003cspan class=\"ic\" aria-hidden=\"true\">📱\u003c/span>\u003cdiv>\u003cb>Nova X 5G\u003c/b>\u003csmall>256 GB, qty 1\u003c/small>\u003c/div>\u003c/div>\n          \u003cdiv class=\"crow\">\u003cspan class=\"ic\" aria-hidden=\"true\">📍\u003c/span>\u003cdiv>\u003cb>${u.name}\u003c/b>\u003csmall>Deliver to ${u.city}\u003c/small>\u003c/div>\u003c/div>\n          \u003cdiv class=\"crow\">\u003cspan class=\"ic\" aria-hidden=\"true\">💳\u003c/span>\u003cdiv>\u003cb>UPI\u003c/b>\u003csmall>Pay with any UPI app\u003c/small>\u003c/div>\u003cspan class=\"radio\" aria-hidden=\"true\">\u003c/span>\u003c/div>\n          \u003cdiv class=\"sum\">\n            \u003cdiv>\u003cspan>Price\u003c/span>\u003cspan>${PRICE}\u003c/span>\u003c/div>\n            \u003cdiv>\u003cspan>Delivery\u003c/span>\u003cspan class=\"free\">Free\u003c/span>\u003c/div>\n            \u003cdiv class=\"tot\">\u003cspan>Total\u003c/span>\u003cspan>${PRICE}\u003c/span>\u003c/div>\n          \u003c/div>\n        \u003c/div>`;\n        cta = `\u003cdiv class=\"cta\">\u003cbutton class=\"btn pay\" data-a=\"pay\" data-u=\"${u.id}\">Pay ${PRICE}\u003c/button>\u003cbutton class=\"btn ghost\" data-a=\"cancel\" data-u=\"${u.id}\">Cancel\u003c/button>\u003c/div>`;\n        break;\n      case 'waiting':\n        v = `\u003cdiv class=\"view center\">\n          \u003cdiv class=\"spinner\" aria-hidden=\"true\">\u003c/div>\n          \u003cp class=\"t\">Please wait…\u003c/p>\n          \u003cp>Another buyer is paying for the last one right now. We’ll update you in a moment.\u003c/p>\n        \u003c/div>`;\n        cta = `\u003cdiv class=\"cta\">\u003cbutton class=\"btn ghost\" data-a=\"leave\" data-u=\"${u.id}\">Stop waiting\u003c/button>\u003c/div>`;\n        break;\n      case 'done':\n        v = `\u003cdiv class=\"view center\">\n          \u003cdiv class=\"big ok\">✓\u003c/div>\n          \u003cp class=\"t\">Order placed\u003c/p>\n          \u003cp>Nova X 5G is on its way to ${u.city}.\u003c/p>\n          \u003cp>Arriving Friday\u003c/p>\n        \u003c/div>`; break;\n      case 'soldout':\n        v = `\u003cdiv class=\"view center\">\n          \u003cdiv class=\"big wait\">!\u003c/div>\n          \u003cp class=\"t\">Sold out\u003c/p>\n          \u003cp>Someone bought the last one.\u003c/p>\n          \u003cp>\u003cb>You were not charged.\u003c/b>\u003c/p>\n        \u003c/div>`; break;\n      case 'cancelled':\n        v = `\u003cdiv class=\"view center\">\n          \u003cdiv class=\"big bad\">✕\u003c/div>\n          \u003cp class=\"t\">Order cancelled\u003c/p>\n          \u003cp>Sorry, this item went out of stock after your payment.\u003c/p>\n          \u003cp>\u003cb>${PRICE} will be refunded in 5 to 7 days.\u003c/b>\u003c/p>\n        \u003c/div>`; break;\n    }\n    return head + v + cta + toast;\n  }\n\n  function render() {\n    for (const u of Object.values(S.users)) $('#ph-' + u.id).innerHTML = phoneHtml(u);\n\n    $('#shelf').innerHTML = `\u003cspan class=\"crate ${S.shelf \u003c= 0 ? 'gone' : ''}\" aria-hidden=\"true\">📦\u003c/span>\u003csmall>${S.shelf > 0 ? '1 Nova X ready to ship' : 'Shelf is empty'}\u003c/small>`;\n    $('#nShelf').textContent = Math.max(S.shelf, 0);\n    $('#nStock').textContent = S.stock;\n    const paid = S.orders.filter(o => o.ok || o.cancelled).length;\n    $('#nPaid').textContent = paid;\n    $('#paidBox').classList.toggle('bad', paid > 1);\n\n    const hold = $('#hold');\n    const atCheckout = Object.values(S.users).filter(u => u.screen === 'checkout').map(u => u.name);\n    if (S.mode === 'right') {\n      hold.className = 'hold' + (S.holder ? ' on' : '');\n      hold.textContent = S.holder\n        ? `🔒 Held for ${S.users[S.holder].name}${S.queue.length ? `. ${S.queue.map(q => S.users[q].name).join(', ')} is waiting.` : '.'}`\n        : 'Nobody is at checkout.';\n    } else {\n      hold.className = 'hold' + (atCheckout.length > 1 ? ' many' : atCheckout.length ? ' on' : '');\n      hold.textContent = atCheckout.length ? `At checkout: ${atCheckout.join(' and ')}` : 'Nobody is at checkout.';\n    }\n\n    $('#orders').innerHTML = S.orders.length\n      ? S.orders.map(o => `\u003cli class=\"${o.cancelled ? 'cx' : 'ok'}\">\u003cspan>${S.users[o.uid].name}, ${PRICE}\u003c/span>\u003cem>${o.cancelled ? 'Cancelled, refund pending' : 'Paid'}\u003c/em>\u003c/li>`).join('')\n      : '\u003cli class=\"empty\">No orders yet.\u003c/li>';\n\n    $('#timeline').innerHTML = S.events.length\n      ? S.events.map(e => `\u003cli class=\"${e.bad ? 'bad' : ''}\">\u003ctime>${e.t}\u003c/time>\u003cspan>\u003cb class=\"${e.uid === 'priya' ? 'p' : 'r'}\">${S.users[e.uid].name}\u003c/b> ${e.text}\u003c/span>\u003c/li>`).join('')\n      : '\u003cli class=\"empty\">Tap a button on either phone.\u003c/li>';\n    const tl = $('#timeline'); tl.scrollTop = tl.scrollHeight;\n\n    document.querySelectorAll('#tasks li').forEach(li => li.classList.toggle('done', done.has(+li.dataset.t)));\n    $('#alldone').classList.toggle('show', done.size === 5);\n  }\n\n  function setMode(m) {\n    document.querySelectorAll('.seg button').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.mode === m)));\n    $('#modeNote').textContent = m === 'right'\n      ? 'The shop holds the last phone for one buyer at a time.'\n      : 'The shop lets everyone check out at the same time.';\n    fresh(m); render();\n  }\n\n  document.addEventListener('click', e => {\n    const b = e.target.closest('[data-a]');\n    if (!b) return;\n    const uid = b.dataset.u;\n    ({buy, pay, cancel, leave})[b.dataset.a](uid);\n  });\n  document.querySelectorAll('.seg button').forEach(b => b.addEventListener('click', () => { if (b.getAttribute('aria-pressed') !== 'true') setMode(b.dataset.mode); }));\n  $('#resetBtn').addEventListener('click', () => { fresh(S.mode); render(); });\n\n  setMode('right');\n})();\n\u003c/script>\n\u003cscript>(function () {\n  document.addEventListener('click', function (e) {\n    if (e.defaultPrevented || e.button !== 0 || e.metaKey || e.ctrlKey || e.shiftKey || e.altKey) return;\n    var a = e.target.closest && e.target.closest('a[href]');\n    var m = a && /^(index|atomicity|consistency|isolation|durability)\\.html$/.exec(a.getAttribute('href').split('#')[0]);\n    if (!m) return;\n    e.preventDefault();\n    parent.postMessage({ acidPage: m[1] }, '*');\n  });\n}());\u003c/script>\n\u003c/body>\n\u003c/html>\n","durability":"\u003c!DOCTYPE html>\n\u003chtml lang=\"en\">\n\u003chead>\n\u003cmeta charset=\"utf-8\">\n\u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1, viewport-fit=cover\">\n\u003ctitle>The Power Cut Story\u003c/title>\n\u003clink rel=\"preconnect\" href=\"https://fonts.googleapis.com\">\n\u003clink rel=\"preconnect\" href=\"https://fonts.gstatic.com\" crossorigin>\n\u003clink href=\"https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap\" rel=\"stylesheet\">\n\u003cstyle>\n:root{\n  --bg:#FFFFFF; --soft:#F4F6F9; --ink:#18212E; --muted:#5A6576; --line:#E1E5EB;\n  --accent:#2457A6; --accent-soft:#E7EEF9;\n  --ok:#1D8048; --ok-soft:#E5F4EB; --bad:#C3362C; --bad-soft:#FCE9E7; --amber:#B26A00; --amber-soft:#FFF1D6;\n  --phone:#10161F; --server:#1A2230; --server-ink:#DCE4EE; --server-dim:#8794A6;\n  --body:\"IBM Plex Sans\",system-ui,-apple-system,\"Segoe UI\",Roboto,sans-serif;\n  --mono:\"JetBrains Mono\",ui-monospace,Menlo,Consolas,monospace;\n  color-scheme:light;\n  box-sizing:border-box;\n  padding-top:env(safe-area-inset-top,0px);\n  padding-bottom:env(safe-area-inset-bottom,0px);\n}\n@media (prefers-color-scheme:dark){\n  :root:not([data-theme=\"light\"]){\n    --bg:#0F151E; --soft:#17202C; --ink:#E6EBF2; --muted:#9AA6B6; --line:#263244;\n    --accent:#7AA5EC; --accent-soft:#1B2B44;\n    --ok:#4CC27F; --ok-soft:#15301F; --bad:#F06C62; --bad-soft:#3A1C1A; --amber:#F0B24A; --amber-soft:#3A2C12;\n    --phone:#05080C; --server:#0A0F16; color-scheme:dark;\n  }\n}\n:root[data-theme=\"dark\"]{\n  --bg:#0F151E; --soft:#17202C; --ink:#E6EBF2; --muted:#9AA6B6; --line:#263244;\n  --accent:#7AA5EC; --accent-soft:#1B2B44;\n  --ok:#4CC27F; --ok-soft:#15301F; --bad:#F06C62; --bad-soft:#3A1C1A; --amber:#F0B24A; --amber-soft:#3A2C12;\n  --phone:#05080C; --server:#0A0F16; color-scheme:dark;\n}\n*,*::before,*::after{box-sizing:inherit}\nhtml{scroll-padding-top:env(safe-area-inset-top,0px)}\nbody{margin:0;background:var(--soft);color:var(--ink);font:400 17px/1.6 var(--body);-webkit-font-smoothing:antialiased}\nbutton{font:inherit;cursor:pointer}\nbutton:disabled{cursor:default}\n:focus-visible{outline:3px solid var(--accent);outline-offset:3px}\n.wrap{max-width:1060px;margin:0 auto;padding:44px 22px 56px}\n.intro{max-width:680px;margin:0 auto 26px;text-align:center}\nh1{font-size:clamp(1.8rem,5vw,2.5rem);line-height:1.15;margin:0 0 10px;font-weight:700;letter-spacing:-.02em}\n.intro p{margin:0;color:var(--muted);font-size:1.08rem}\n\n.modes{display:flex;justify-content:center;margin:0 auto 14px}\n.seg{display:inline-flex;background:var(--bg);border:1px solid var(--line);border-radius:14px;padding:4px;gap:4px}\n.seg button{border:0;border-radius:10px;padding:11px 20px;background:transparent;color:var(--muted);font-weight:600;font-size:.98rem;transition:background .2s,color .2s}\n.seg button[aria-pressed=\"true\"].right{background:var(--ok);color:#fff}\n.seg button[aria-pressed=\"true\"].wrong{background:var(--bad);color:#fff}\n.mode-note{text-align:center;color:var(--muted);font-size:.9rem;min-height:1.4em;margin-bottom:22px}\n\n.stage{display:grid;grid-template-columns:310px minmax(0,1fr);gap:28px;align-items:start}\n.who{text-align:center;font-weight:600;margin-bottom:10px}\n.who small{display:block;color:var(--muted);font-weight:400;font-size:.85rem}\n\n/* ---------- Phone (stays light like a real app) ---------- */\n.phone{font-size:15px;background:var(--phone);border-radius:2.6em;padding:.6em;box-shadow:0 22px 44px -20px rgba(16,22,31,.5)}\n.screen{background:#F3F7F6;color:#14222A;border-radius:2em;overflow:hidden;height:38em;display:flex;flex-direction:column;position:relative}\n.sbar{display:flex;justify-content:space-between;padding:.7em 1.4em .3em;font-size:.72em;font-weight:600;background:#0E7C66;color:#fff}\n.apphead{background:#0E7C66;color:#fff;padding:.3em 1em 1.1em;display:flex;align-items:center;justify-content:space-between}\n.logo{font-weight:800;font-size:1.1em;letter-spacing:-.03em}\n.avatar{width:2em;height:2em;border-radius:50%;background:#fff;color:#0E7C66;display:grid;place-items:center;font-weight:700;font-size:.85em}\n.hello{background:#0E7C66;color:#fff;padding:0 1em 1.1em}\n.hello b{font-size:1.25em;display:block;line-height:1.2}\n.hello small{opacity:.85;font-size:.8em}\n.offline{background:#FCE9E7;color:#B42A20;font-size:.76em;font-weight:600;padding:.6em 1.2em;display:flex;gap:.5em;align-items:center}\n.view{flex:1;overflow:auto;padding:.9em;animation:fade .3s ease}\n.lbl{font-size:.74em;color:#5D6B72;font-weight:600;margin:.1em .2em .6em}\n.bill{background:#fff;border-radius:1em;padding:.75em;margin-bottom:.6em;display:flex;flex-wrap:wrap;gap:.7em;align-items:center}\n.bill .note{flex-basis:100%;background:#FCE9E7;color:#B42A20;font-size:.74em;font-weight:600;padding:.45em .7em;border-radius:.6em;line-height:1.35}\n.bill .ic{width:2.4em;height:2.4em;border-radius:.7em;background:#E3F2EE;display:grid;place-items:center;flex:none}\n.bill .tx{flex:1;min-width:0}\n.bill .tx b{display:block;font-size
