<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Office Detective · Northwind Systems</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EEF0F3;--surface:#FFFFFF;--surface2:#F6F7F9;--ink:#161A20;--ink2:#46505E;--ink3:#7A8494;--line:#DCE0E6;
  --navy:#1F3A5F;--navy2:#2C5282;--navy-t:#E6ECF4;
  --grant:#0E7C66;--grant-t:#E3F2EE;--warn:#A15C07;--warn-t:#FBF0DF;--hit:#FFF4D6;
  --code:#141922;--glass:rgba(255,255,255,.94);--scrim:rgba(225,229,235,.6);
  --shadow:0 1px 2px rgba(16,24,40,.06),0 8px 24px rgba(16,24,40,.08);
  --sans:'IBM Plex Sans','Segoe UI',system-ui,sans-serif;--mono:'IBM Plex Mono',Consolas,monospace;
  --ease:cubic-bezier(.22,1,.36,1);color-scheme:light;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0F1216;--surface:#171B21;--surface2:#1D222A;--ink:#E7EAEE;--ink2:#AEB6C2;--ink3:#7D8796;--line:#2A303A;
  --navy:#8DB0E0;--navy2:#A9C4EA;--navy-t:#1C2838;--grant:#4CC3A6;--grant-t:#12302A;--warn:#E7A54A;--warn-t:#33260F;--hit:#3A3115;
  --code:#0B0E12;--glass:rgba(23,27,33,.94);--scrim:rgba(10,12,16,.6);--shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.35);color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F1216;--surface:#171B21;--surface2:#1D222A;--ink:#E7EAEE;--ink2:#AEB6C2;--ink3:#7D8796;--line:#2A303A;
  --navy:#8DB0E0;--navy2:#A9C4EA;--navy-t:#1C2838;--grant:#4CC3A6;--grant-t:#12302A;--warn:#E7A54A;--warn-t:#33260F;--hit:#3A3115;
  --code:#0B0E12;--glass:rgba(23,27,33,.94);--scrim:rgba(10,12,16,.6);--shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.35);color-scheme:dark}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%;margin:0;overflow:hidden}
body{background:var(--bg);color:var(--ink);font:14px/1.55 var(--sans);-webkit-font-smoothing:antialiased}
button{font-family:inherit;cursor:pointer;color:inherit}
button:focus-visible,input:focus-visible{outline:2px solid var(--navy2);outline-offset:2px}
#scene{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
.panelish{background:var(--glass);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1px solid var(--line);box-shadow:var(--shadow)}
.hud{position:fixed;z-index:6;transition:opacity .4s var(--ease)}
.off{opacity:0;pointer-events:none}

/* clock reads like a lobby display */
.clock{top:calc(14px + env(safe-area-inset-top,0px));left:14px;border-radius:10px;padding:10px 16px 11px;display:flex;gap:14px;align-items:center}
.clock .t{font:600 30px/1 var(--sans);letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.clock .t small{font-size:13px;font-weight:500;color:var(--ink2);margin-left:4px;letter-spacing:0}
.clock .d{font-size:12.5px;color:var(--ink2);line-height:1.35;border-left:1px solid var(--line);padding-left:14px}
.clock .d b{display:block;color:var(--ink);font-weight:600;font-size:13.5px}
.live{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;color:var(--grant)}
.live i{width:6px;height:6px;border-radius:50%;background:var(--grant)}
.ctrl{left:50%;transform:translateX(-50%);bottom:calc(14px + env(safe-area-inset-bottom,0px));display:flex;align-items:center;gap:4px;padding:5px 12px 5px 5px;border-radius:10px}
.ic{height:36px;min-width:36px;border-radius:7px;border:0;background:transparent;font-size:14px;padding:0 10px}
.ic:hover{background:var(--surface2)}
.ic.play{background:var(--navy);color:#fff}
:root:not([data-theme="light"]) .ic.play{color:var(--bg)}
@media (prefers-color-scheme: light){.ic.play{color:#fff}}
.spd{font:600 13px var(--mono);border:1px solid var(--line);background:var(--surface);height:32px;border-radius:7px;padding:0 10px;margin-right:6px}
#tline{width:min(340px,34vw);accent-color:var(--navy)}
.tticks{display:flex;justify-content:space-between;font:11px var(--mono);color:var(--ink3)}
.inv{top:calc(14px + env(safe-area-inset-top,0px));right:14px;border-radius:9px;padding:11px 18px;font-weight:600;font-size:14.5px;background:var(--navy);color:#fff;border:0;box-shadow:var(--shadow)}
.inv:hover{background:var(--navy2)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .inv{color:var(--bg)}}
#labels{position:fixed;inset:0;pointer-events:none;z-index:3}
.zl{position:absolute;transform:translate(-50%,-50%);font-size:11.5px;font-weight:600;padding:3px 9px 3px 8px;border-radius:4px;background:var(--surface);color:var(--ink2);border:1px solid var(--line);white-space:nowrap;transition:opacity .4s;display:flex;gap:6px;align-items:center}
.zl i{width:3px;height:12px;border-radius:2px}
.pc{position:fixed;z-index:8;width:236px;border-radius:10px;padding:12px 14px;animation:pop .25s var(--ease)}
.pc .n{font-weight:600;font-size:16px}
.pc .r{font-size:12.5px;color:var(--ink3)}
.pc .k{margin-top:9px;font-size:11.5px;color:var(--ink3)}
.pc .x{position:absolute;top:6px;right:6px;border:0;background:transparent;color:var(--ink3);font-size:18px;width:28px;height:28px}
.pc .badge{display:inline-block;font:500 11px var(--mono);padding:1px 6px;border:1px solid var(--line);border-radius:4px;color:var(--ink2);margin-top:6px}

#intro{position:fixed;inset:0;z-index:20;display:grid;place-items:center;background:linear-gradient(180deg,transparent,var(--scrim) 50%,transparent);transition:opacity .7s}
#intro.gone{opacity:0;pointer-events:none}
.intro{margin:16px;width:min(420px,calc(100% - 32px));border-radius:14px;padding:26px 28px;animation:in .8s var(--ease)}
.intro .co{font-size:12.5px;color:var(--ink3);display:flex;gap:8px;align-items:center}
.intro .co i{width:14px;height:14px;border-radius:3px;background:var(--navy)}
.intro h1{margin:14px 0 4px;font-size:34px;font-weight:700;letter-spacing:-.03em;line-height:1.05}
.intro .w{color:var(--ink2);margin-bottom:22px;font-variant-numeric:tabular-nums}
.btn{border:0;border-radius:8px;padding:11px 18px;font-size:14px;font-weight:600;background:var(--navy);color:#fff;transition:background .15s}
.btn:hover{background:var(--navy2)}
.btn.sec{background:var(--surface);color:var(--ink);border:1px solid var(--line)}
.btn.sec:hover{background:var(--surface2)}
.btn.grant{background:var(--grant)}
.btn.sm{padding:7px 12px;font-size:13px}
.btn:disabled{opacity:.45;cursor:not-allowed}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .btn:not(.sec){color:var(--bg)}}
:root[data-theme="dark"] .btn:not(.sec){color:var(--bg)}
.link{border:0;background:none;color:var(--navy2);font-weight:600;font-size:13.5px;padding:4px 0;text-decoration:underline;text-underline-offset:3px;text-decoration-thickness:1px}

.code{border-radius:8px;background:var(--code);color:#D6DCE5;font:12px/1.65 var(--mono);padding:10px 0;overflow-x:auto}
.code pre{margin:0;padding:0 12px}
.ck{color:#8FB8F2}.cf{color:#C9A8F5}.cs{color:#8FD6B5}.cn{color:#E7C873}.cc{color:#6B7686}
.tw{max-height:240px;overflow:auto;border-radius:6px;border:1px solid var(--line)}
table{border-collapse:collapse;width:100%;font:11.5px var(--mono)}
th{position:sticky;top:0;background:var(--surface2);color:var(--ink2);text-align:left;padding:5px 9px;font-weight:600;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:4px 9px;border-top:1px solid var(--line);white-space:nowrap;color:var(--ink2)}
tbody tr{animation:rowin .3s var(--ease) both}
tr.hit td{background:var(--hit);color:var(--ink)}
@keyframes rowin{from{opacity:0;transform:translateX(-6px)}to{opacity:1;transform:none}}
/* schema diagram */
.schema{margin-top:12px;border:1px solid var(--line);border-radius:8px;background:var(--surface);padding:8px}
.schema svg{display:block;width:100%;height:auto}
.schema .cap{font-size:11.5px;color:var(--ink3);padding:2px 6px 4px;display:flex;justify-content:space-between}
.tb rect.box{fill:var(--surface);stroke:#8A93A0;stroke-width:1.2}
.tb rect.hd{fill:#5B6470}
.tb.use rect.hd{fill:#1F3A5F}
.tb text{font:12px var(--mono);fill:var(--ink)}
.tb text.tn{font-weight:700;fill:#FFFFFF;letter-spacing:.02em}
.tb text.ct2{font-weight:700}
.tb text.k{font-size:10px;font-weight:600;fill:var(--ink2)}
.tb rect.cu{fill:#FFE59A}
:root[data-theme="dark"] .tb rect.cu{fill:#5A4A12}
.tb.use rect.box{stroke:#1F3A5F;stroke-width:2.4}
.tb.dim{opacity:.62}
.tb{cursor:pointer}
.tb.sel rect.box{stroke:var(--grant);stroke-width:2}
.rel{fill:none;stroke:#7A8494;stroke-width:1.6;opacity:.8}
.rel.use{stroke:#C2410C;opacity:1;stroke-width:2.6;stroke-dasharray:5 4;animation:flow 1s linear infinite}
.rl{font:700 11px var(--mono);fill:var(--ink)}
@keyframes flow{to{stroke-dashoffset:-9}}

#cur{position:fixed;inset:0;z-index:40;display:grid;place-items:center;text-align:center;background:#12161C;color:#E7EAEE;opacity:0;pointer-events:none;transition:opacity .6s}
#cur.on{opacity:1;pointer-events:auto}
#cur .a{font:500 13px var(--mono);color:#8B95A5}
#cur .b{font-size:clamp(26px,5vw,40px);font-weight:600;letter-spacing:-.02em;margin-top:4px}
@keyframes in{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes pop{from{opacity:0;transform:scale(.97)}to{opacity:1;transform:none}}
@keyframes dot{from{transform:scale(0)}to{transform:scale(1)}}
/* ---------- investigation window: one wide window, tabs ---------- */
.iw{position:fixed;z-index:12;left:50%;bottom:calc(14px + env(safe-area-inset-bottom,0px));width:min(1180px,calc(100% - 28px));height:min(560px,62vh);transform:translate(-50%,calc(100% + 40px));transition:transform .5s var(--ease);border-radius:12px;display:flex;flex-direction:column;overflow:hidden}
.iw.open{transform:translate(-50%,0)}
.iw-h{display:flex;align-items:center;gap:14px;padding:0 10px 0 18px;border-bottom:1px solid var(--line);min-height:50px}
.crumb{font-size:12.5px;color:var(--ink3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:300px;flex:none}
.crumb b{color:var(--ink);font-weight:600}
.tabs{position:relative;display:flex;flex:1;overflow-x:auto;scrollbar-width:none;align-self:stretch}
.tabs::-webkit-scrollbar{display:none}
.tab{border:0;background:none;padding:0 14px;font:500 13.5px var(--sans);color:var(--ink3);white-space:nowrap;transition:color .2s}
.tab:hover:not(:disabled){color:var(--ink)}
.tab.on{color:var(--ink);font-weight:600}
.tab:disabled{opacity:.35;cursor:not-allowed}
.ink{position:absolute;bottom:0;height:2px;background:var(--navy2);border-radius:2px;transition:left .35s var(--ease),width .35s var(--ease)}
.tools{display:flex;gap:2px;align-items:center;flex:none}
.tl2{border:1px solid transparent;background:none;border-radius:6px;padding:6px 10px;font:500 12.5px var(--sans);color:var(--ink2)}
.tl2:hover{background:var(--surface2)}
.tl2.on{border-color:var(--line);background:var(--surface2);color:var(--ink)}
.iw .xb{position:static;flex:none;margin-left:4px}
.xb{width:32px;height:32px;border-radius:7px;border:1px solid var(--line);background:var(--surface);font-size:17px;color:var(--ink2)}
.iw-b{flex:1;position:relative;overflow:hidden}
.pane{position:absolute;inset:0;padding:18px 22px;display:grid;grid-template-columns:270px minmax(0,1fr);gap:30px;transition:opacity .16s ease,transform .16s ease}
.pane.out{opacity:0;transform:translateY(6px)}
.pane.full{grid-template-columns:minmax(0,1fr)}
.ans{display:flex;flex-direction:column;min-height:0;overflow:auto}
.ans .qq{font-size:13.5px;color:var(--ink2);line-height:1.4}
.ans .big{font:700 38px/1.08 var(--sans);letter-spacing:-.03em;margin:8px 0 4px;font-variant-numeric:tabular-nums;transition:color .3s}
.ans .sub{font-size:13px;color:var(--ink3)}
.ans .sub b{color:var(--ink);font-variant-numeric:tabular-nums}
.ans .foot{margin-top:auto;padding-top:12px;display:flex;flex-direction:column;gap:8px}
.nxb{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:9px 12px;font:600 13px var(--sans);color:var(--navy);text-align:left;display:flex;justify-content:space-between;align-items:center;transition:border-color .15s,background .15s}
.nxb:hover{border-color:var(--navy2);background:var(--surface2)}
.viz{min-width:0;min-height:0;overflow:auto;position:relative}
.focusin{animation:focusin .5s var(--ease)}
@keyframes focusin{from{opacity:.2;filter:blur(2px)}to{opacity:1;filter:none}}
.lrows{display:flex;flex-direction:column;gap:2px}
.lrow{display:grid;grid-template-columns:170px minmax(0,1fr) 44px;gap:14px;align-items:center;padding:7px 10px;border-radius:8px;border:1px solid transparent;background:none;text-align:left;width:100%;transition:background .15s,border-color .15s}
.lrow:not(:disabled):hover{background:var(--surface2);border-color:var(--line)}
.lrow:disabled{cursor:default;opacity:.8}
.lrow .nm{display:flex;gap:9px;align-items:center;font-weight:500;font-size:14px}
.sw{width:9px;height:9px;border-radius:2px;flex:none}
.track{display:flex;gap:5px;align-items:center;min-height:24px;flex-wrap:wrap}
.pdot{width:24px;height:24px;border-radius:50%;display:inline-grid;place-items:center;font:600 10.5px var(--sans);color:#fff;flex:none;animation:pin .35s var(--ease) both}
.lrow .n{text-align:right;font:600 16px var(--mono);font-variant-numeric:tabular-nums}
.lrow .go{grid-column:1/-1}
@keyframes pin{from{opacity:0;transform:scale(.4)}to{opacity:1;transform:none}}
.tiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.tile{border:1px solid var(--line);border-radius:8px;padding:12px 14px;background:var(--surface);animation:rin .4s var(--ease) both}
.tile .k{font-size:12px;color:var(--ink3)}
.tile .v{font:700 26px/1.2 var(--sans);font-variant-numeric:tabular-nums;margin-top:2px}
.tile .s{font-size:11.5px;color:var(--ink3)}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px}
.chip{display:inline-flex;gap:6px;align-items:center;border:1px solid var(--line);border-radius:999px;padding:2px 10px 2px 2px;font-size:12.5px;background:var(--surface);animation:pin .3s var(--ease) both}
.chip .pdot{width:20px;height:20px;font-size:9.5px;animation:none}
.seg{display:flex;height:10px;border-radius:3px;overflow:hidden;background:var(--surface2);margin-top:8px}
.seg i{height:100%;width:0;transition:width .8s var(--ease)}
.segl{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:12px;color:var(--ink2);margin-top:7px}
.segl span{display:inline-flex;gap:5px;align-items:center}
.move{margin-top:16px;border:1px solid var(--line);border-radius:8px;padding:12px 14px;animation:rin .4s .2s var(--ease) both}
.move .k{font-size:12px;color:var(--ink3)}
.move .v{font-size:14px;margin-top:2px}
.cols{height:100%;min-height:190px;display:flex;align-items:flex-end;gap:5px;padding:2px 2px 26px}
.col{flex:1;min-width:16px;height:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;position:relative;border:0;background:none;padding:0;border-radius:4px}
.col:hover .bar{filter:brightness(.92)}
.col .bar{width:100%;max-width:48px;background:var(--navy-t);border-radius:4px 4px 0 0;height:0;transition:height .6s var(--ease),background .3s}
.col .v{font:600 11.5px var(--mono);color:var(--ink2);margin-bottom:4px;opacity:0;transition:opacity .3s .3s}
.cols.shown .col .v{opacity:1}
.col .x{position:absolute;bottom:-22px;font:11px var(--mono);color:var(--ink3);white-space:nowrap}
.col.peak .bar{background:var(--navy2)}
.col.sel .bar{background:var(--grant)}
.col.sel .x{color:var(--grant);font-weight:600}
.col.pick .bar{box-shadow:inset 0 0 0 2px var(--navy)}
.plist{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:2px 20px}
.prow{display:grid;grid-template-columns:24px minmax(0,1fr) auto 38px;gap:10px;align-items:center;padding:6px 8px;border-radius:7px;animation:rin .35s var(--ease) both}
.prow:hover{background:var(--surface2)}
.prow .w{font-size:13.5px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.prow .w small{color:var(--ink3);font-weight:400;margin-left:6px}
.d5{display:flex;gap:3px}
.d5 i{width:13px;height:13px;border-radius:3px;background:var(--surface2);border:1px solid var(--line);transition:background .25s,border-color .25s}
.d5 i.on{background:var(--navy2);border-color:var(--navy2)}
.prow.reg .d5 i.on{background:var(--grant);border-color:var(--grant)}
.prow .c{font:600 12.5px var(--mono);text-align:right;color:var(--ink2)}
.prow.reg .c{color:var(--grant)}
.traits{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.trait{border:1px solid var(--line);border-radius:8px;padding:12px 14px;animation:rin .4s var(--ease) both}
.trait .k{font-size:12px;color:var(--ink3)}
.trait .v{font:600 17px var(--sans);margin-top:2px}
.strip{position:relative;height:36px;margin-top:10px;border-bottom:1px solid var(--line)}
.strip i{position:absolute;bottom:0;width:2px;margin-left:-1px;height:0;background:var(--grant);transition:height .5s var(--ease)}
.strip .band{position:absolute;bottom:0;height:100%;background:var(--grant-t);border-radius:3px;transform-origin:center;transform:scaleX(0);transition:transform .7s var(--ease)}
.strip .lab{display:flex;justify-content:space-between;font:10.5px var(--mono);color:var(--ink3);position:absolute;left:0;right:0;bottom:-17px}
.opts{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.opt{border-radius:9px;border:1px solid var(--line);background:var(--surface);padding:14px 12px;text-align:left;transition:border-color .15s,background .15s,box-shadow .15s;animation:rin .35s var(--ease) both}
.opt b{display:block;font:600 16px var(--mono)}
.opt span{font-size:12px;color:var(--ink3)}
.opt .mb{height:5px;border-radius:3px;background:var(--surface2);margin-top:9px;overflow:hidden}
.opt .mb i{display:block;height:100%;width:0;background:var(--navy2);transition:width .7s var(--ease)}
.opt:hover{border-color:var(--navy2)}
.opt.on{border-color:var(--navy);background:var(--navy-t);box-shadow:inset 0 0 0 1px var(--navy)}
.vlist{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-top:14px}
.vb{border:1px solid var(--line);border-radius:8px;padding:10px 12px;animation:rin .4s var(--ease) both}
.vb .k{font-size:12px;color:var(--ink3)}
.vb .v{font:600 15px var(--mono);margin-top:2px}
.vb.ok{border-color:var(--grant);background:var(--grant-t)}.vb.ok .v{color:var(--grant)}
.vb.no{border-color:var(--warn);background:var(--warn-t)}.vb.no .v{color:var(--warn)}
.livebar{display:flex;gap:10px;align-items:center;font-size:12.5px;color:var(--ink3);margin-bottom:8px}
.livebar i{width:7px;height:7px;border-radius:50%;background:#C2410C;animation:blink 1s infinite}
@keyframes blink{50%{opacity:.25}}
@keyframes rin{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.sqlv{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:18px;height:100%}
.sqlv .left{display:flex;flex-direction:column;min-height:0}
.sqlv .code{flex:1;overflow:auto}
.sqlv .right{min-height:0;overflow:auto}
.rowbar{display:flex;justify-content:space-between;align-items:center;margin-top:8px;gap:8px}
.meta{font:12px var(--mono);color:var(--ink3)}
.btn.sm{padding:7px 12px;font-size:13px}
.btn.grant{background:var(--grant)}

function doing(pi){ const tr=DB.get(S.day).tracks[pi], st=PM[pi].st; if(!tr) return 'Not in the office today'; if(!st) return S.t<tr[0].t0?'Not in yet':'Gone home for the day';
  const s=st.seg; if(s.k==='tap') return s.type==='exit'?'Badging out at the main entrance':'Badging in at '+(s.door==='ENT'?'the main entrance':LOC[s.door].location_name);
  if(s.k==='walk') return s.dest==='OUT'?'Heading home':s.dest==='ENT'?'Arriving from the street':s.dest===PEOPLE[pi].home?'Walking back to their desk':'Walking to '+LOC[s.dest].location_name;
  return {work:'Working at their desk in '+(LOC[s.zone]||{}).location_name,buy:'Ordering at the counter',lunch:'Having lunch',coffee:'Coffee break',snack:'Afternoon snack',meeting:'In a meeting',testing:'Testing in the lab',gym:'Working out in the gym'}[s.act]; }
function selectPerson(pi){ S.sel=pi; $('invBtn').classList.remove('off'); const P=PEOPLE[pi];
  $('pcard').innerHTML=`<div class="pc panelish" id="pc"><button class="x" aria-label="Close">×</button><div class="n">${esc(P.name)}</div><div class="r">${esc(P.role)} · ${esc(P.team)}</div><div class="k">Currently</div><div id="pcN">${esc(doing(pi))}</div></div>`;
  $('pc').querySelector('.x').onclick=hideCard; placeCard(); }
function cardText(){ const n=$('pcN'); if(n&&S.sel!=null) n.textContent=doing(S.sel); }
function placeCard(){ const pc=$('pc'); if(!pc||S.sel==null) return; const M=PM[S.sel]; if(!M.root.visible){ pc.style.left='14px'; pc.style.top=(innerWidth<760?80:100)+'px'; return; } const s=scr(M.root.position.x,2.4,M.root.position.z);
  pc.style.left=clamp(s.x+16,8,innerWidth-pc.offsetWidth-8)+'px'; pc.style.top=clamp(s.y-pc.offsetHeight-10,8,innerHeight-pc.offsetHeight-8)+'px'; }
function hideCard(){ S.sel=null; $('pcard').innerHTML=''; }

const RELS={pa:`M${10+TW},${cy('PERSON','person_id')} H220 V${cy('ACCESS_LOG','person_id')} H232`,
  la:`M${232+TW},${cy('LOCATION','location_id')} H430 V${cy('ACCESS_LOG','location_id')} H${232+TW}`,

function schemaSVG(uses,rel,sel){
  uses=uses||{}; rel=rel||[]; const anyUse=Object.keys(uses).length>0;
  let s=`<svg viewBox="0 0 436 302" role="img" aria-label="Database schema: PERSON, LOCATION, ACCESS_LOG and CAFETERIA_LOG with their keys">`;
  for(const k in RELS) s+=`<path class="rel ${rel.includes(k)?'use':''}" d="${RELS[k]}"/>`;
  s+=`<text class="rl" x="206" y="${cy('PERSON','person_id')-4}">1</text><text class="rl" x="223" y="${cy('ACCESS_LOG','person_id')-4}">N</text>`;
  s+=`<text class="rl" x="424" y="${cy('LOCATION','location_id')-4}">1</text><text class="rl" x="424" y="${cy('ACCESS_LOG','location_id')+12}">N</text>`;
  s+=`<text class="rl" x="1" y="${cy('PERSON','person_id')-6}">1</text><text class="rl" x="1" y="${cy('CAFETERIA_LOG','person_id')-6}">N</text>`;
  for(const t in TBL){ const T=TBL[t], u=uses[t]; const h=HH+T.cols.length*RH;
    s+=`<g class="tb ${u?'use':anyUse?'dim':''} ${sel===t?'sel':''}" data-t="${t}" tabindex="0" role="button" aria-label="Show ${t} rows"><rect class="box" x="${T.x}" y="${T.y}" width="${TW}" height="${h}" rx="5"/><rect class="hd" x="${T.x+.5}" y="${T.y+.5}" width="${TW-1}" height="${HH-1}" rx="5"/>
      <text class="tn" x="${T.x+10}" y="${T.y+17}">${t}</text>`;
    T.cols.forEach((c,i)=>{ const y=T.y+HH+i*RH; if(u&&u.includes(c)) s+=`<rect class="cu" x="${T.x+1}" y="${y}" width="${TW-2}" height="${RH}"/>`;
      s+=`<text class="${u&&u.includes(c)?'ct2':''}" x="${T.x+10}" y="${y+14}">${c}</text>`; const tag=c===T.pk?'PK':(T.fk||[]).includes(c)?'FK':''; if(tag) s+=`<text class="k" x="${T.x+TW-24}" y="${y+14}">${tag}</text>`; });
    s+=`</g>`; }
  return s+'</svg>';
}

function presence(day,t){ const m=new Map(); for(const r of DB.get(day).access){ if(r._t>t) break;
  if(r._loc==='ENT'){ if(r.event_type==='entry') m.set(r._p,'LOBBY'); else m.delete(r._p); } else if(m.has(r._p)) m.set(r._p,r._loc); } return m; }
function around(r){ const a=DB.get(r._day).access.filter(x=>x._p===r._p&&x!==r); let prev=null,next=null; for(const x of a){ if(x._t<r._t) prev=x; else if(!next) next=x; } return {prev,next}; }
const tally=arr=>{ const m=new Map(); arr.forEach(k=>m.set(k,(m.get(k)||0)+1)); return [...m].sort((a,b)=>b[1]-a[1]); };
function firstIns(days,tl){ return days.map(d=>accRows([d],tl,r=>r._loc==='ENT'&&r.event_type==='entry')[0]).filter(Boolean); }

// answer = grouped result of a record set
function answer(s,days,tl){
  const rows=s.rows(days,tl);
  if(s.kind==='slots'){ const m=new Map(); rows.forEach(r=>{ const k=slotOf(r._t); m.set(k,(m.get(k)||0)+1); });
    const ks=[...m.keys()].sort((a,b)=>a-b), groups=[]; if(ks.length) for(let k=ks[0];k<=ks[ks.length-1];k+=60) groups.push({key:k,label:slotTxt(k),value:m.get(k)||0});
    let best=null; groups.forEach(g=>{ if(!best||g.value>best.value) best=g; }); return {rows,groups,best,total:rows.length}; }
  const m=new Map(); rows.forEach(r=>{ const k=s.key(r); if(!m.has(k)) m.set(k,{key:k,label:s.label(k),value:0,n:0,set:new Set()}); const g=m.get(k); g.n++;
    if(s.distinct) g.set.add(s.distinct(r)); else g.value+=s.val?s.val(r):s.avg?Math.floor(r._t):s.qty?r.quantity:1; });
  let groups=[...m.values()]; groups.forEach(g=>{ if(s.distinct) g.value=g.set.size+g.n/1e4; else if(s.avg) g.value=g.value/g.n; });
  groups.sort((a,b)=>(s.best==='min'?a.value-b.value:b.value-a.value)||String(a.label).localeCompare(String(b.label)));
  return {rows,groups,best:groups[0]||null,total:groups.reduce((t,g)=>t+(s.avg||s.distinct?g.n:g.value),0)};
}
const valTxt=(s,v)=>s.unit==='min'?Math.round(v)+' min':s.distinct?String(Math.floor(v)):s.avg?fmt(Math.round(v)):String(Math.round(v));

// ---------- analysis tabs: Time / People / Pattern over the answer's records ----------
function slotsOf(s,days,tl,keys){ const rows=s.rows(days,tl), m=new Map(); rows.forEach(r=>{ const k=slotOf(r._t); m.set(k,(m.get(k)||0)+1); });
  let ks=keys; if(!ks){ const a=[...m.keys()].sort((x,y)=>x-y); ks=[]; if(a.length) for(let k=a[0];k<=a[a.length-1];k+=60) ks.push(k); }
  const groups=ks.map(k=>({key:k,label:slotTxt(k),value:m.get(k)||0})); let peak=null; groups.forEach(g=>{ if(!peak||g.value>peak.value) peak=g; }); return {rows,groups,peak}; }
function slotPeople(s,days,k){ const rows=s.rows(days).filter(r=>slotOf(r._t)===k), m=new Map();
  rows.forEach(r=>{ if(!m.has(r._p)) m.set(r._p,{pi:r._p,days:new Set(),rows:[]}); const o=m.get(r._p); o.days.add(r._day); o.rows.push(r); });
  return {rows,list:[...m.values()].sort((a,b)=>b.days.size-a.days.size||pnm(a.pi).localeCompare(pnm(b.pi)))}; }
function patternOf(s,days,k){
  const sp=slotPeople(s,days,k); let thr=4, reg=sp.list.filter(o=>o.days.size>=4); if(reg.length<2){ thr=3; reg=sp.list.filter(o=>o.days.size>=3); } if(reg.length<2){ thr=2; reg=sp.list.filter(o=>o.days.size>=2); }
  const rows=reg.flatMap(o=>o.rows), ts=rows.map(r=>r._t), mean=ts.reduce((a,b)=>a+b,0)/Math.max(1,ts.length), sd=Math.sqrt(ts.reduce((a,b)=>a+(b-mean)**2,0)/Math.max(1,ts.length));
  return {sp,thr,reg,rows,mean,sd,home:tally(reg.map(o=>PEOPLE[o.pi].home)),team:tally(reg.map(o=>PEOPLE[o.pi].team)),from:tally(rows.map(r=>{ const p=around(r).prev; return p?p._loc:'ENT'; }))}; }
const ensureSlot=()=>{ const c=S.ctx; if(c.slot==null){ const s=slotsOf(src(),c.days); c.slot=s.peak?s.peak.key:null; } return c.slot; };
function rTime(){
  const c=S.ctx, s=src(), r=slotsOf(s,c.days); if(!r.peak){ pane().innerHTML=`<div class="ans"><div class="big">No records</div></div><div class="viz"></div>`; return; }
  if(c.slot==null||!r.groups.some(g=>g.key===c.slot)) c.slot=r.peak.key;
  focusLoc(s.focus||null,true); const sel=()=>r.groups.find(g=>g.key===c.slot);
  pane().innerHTML=`<div class="ans"><div class="qq">When do the ${esc(s.noun)} happen?</div><div class="big focusin" id="tsl">${slotTxt(c.slot)}</div><div class="sub" id="tsub"></div>
      <div class="foot">${s.focus&&!s.cafe?'<button class="btn sec sm" id="bRe">Replay this hour</button>':''}${nextBtn('people','Who is behind them?')}</div></div>
    <div class="viz">${colChart(r.groups,{peak:r.peak.key,sel:c.slot})}</div>`;
  const sub=()=>{ const g=sel(); $('tsub').innerHTML=`<b id="tv">0</b> over 5 days${g.key===r.peak.key?', the busiest hour':''}. Select a bar to analyse another time.`; countUp($('tv'),g.value,null,450); };
  sub(); growCols();

const HR=k=>pad(Math.floor(k/60));

const KW=/^(SELECT|FROM|JOIN|LEFT|ON|WHERE|AND|OR|GROUP|BY|ORDER|DESC|ASC|LIMIT|AS|HAVING|DISTINCT|BETWEEN|IN|NOT|OVER|PARTITION|WITH|IS|NULL)$/, FN=/^(COUNT|SUM|AVG|MIN|MAX|ROUND|DATE|TIME|IIF|strftime|COALESCE|ROW_NUMBER|LEAD|julianday)$/;

    if(r.rows.length) boxTable(r.cols,shown.map(x=>x.map(v=>String(v)))).forEach(l=>lines.push(esc(l))); else lines.push(esc(r.empty||'(no rows)'));
    if(r.rows.length>shown.length) lines.push(`… ${r.rows.length-shown.length} more rows`);
    lines.push('',`<span class="ok">${r.rows.length} row${r.rows.length===1?'':'s'} returned</span>`,`<span class="p">sqlite&gt;</span> <span class="cur">▌</span>`);
    let i=0; const step=()=>{ if(!$('tout')) return; i=i<2?i+1:i<5?5:Math.min(lines.length,i+3); out.innerHTML=lines.slice(0,i).join('\n'); out.scrollTop=out.scrollHeight; if(i<lines.length) setTimeout(step,RM?0:i<2?240:70); };
    out.innerHTML=`<span class="p">sqlite&gt;</span> running…`; setTimeout(step,RM?0:280); };
}

// ---------- day change ----------
function nextDay(t0,msg,cb){
  if(S.busy) return; S.busy=true; const nd=dayInfo(S.day+1); $('cu1').textContent=msg; $('cu2').textContent=''; $('cur').classList.add('on');
  setTimeout(()=>{ $('cu1').textContent='Next working day'; $('cu2').textContent=nd.wd+', '+nd.long; S.day++; S.t=t0; S.snap=true; hideCard(); },RM?100:900);
  setTimeout(()=>{ $('cur').classList.remove('on'); S.busy=false; if(cb) cb(); },RM?400:2200);
}
function bindInv(){
  $('iwX').onclick=closeInv; $('iwQ').onclick=openMenu; $('qmX').onclick=closeMenu; $('rpX').onclick=endReplay;
  addEventListener('resize',()=>{ if(S.ctx&&$('inv').classList.contains('open')) drawTabs(); });
}

init(); bind(); moveT(-7,0); camera.zoom=MOB()?1.4:.95; camera.updateProjectionMatrix(); requestAnimationFrame(frame);
</script>
