<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Python Code Jumble — Biology Coding Lab</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#F0F2F5;--surface:#FFFFFF;--surface2:#F8FAFC;--surface3:#F1F5F9;
  --border:#E2E8F0;--border2:#CBD5E1;
  --text:#1E293B;--text2:#475569;--text3:#94A3B8;
  --blue:#185FA5;--bluebg:#E6F1FB;--bluebd:#B5D4F4;
  --green:#2D6A11;--greenbg:#EAF3DE;--greenbd:#C0DD97;
  --amber:#7A4A08;--amberbg:#FAEEDA;--amberbd:#FAC775;
  --red:#9B2B2B;--redbg:#FCEBEB;--redbd:#F7C1C1;
  --purple:#4A42A8;--purplebg:#EEEDFE;--purplebd:#CECBF6;
  --teal:#0C6349;--tealbg:#E1F5EE;--tealbd:#9FE1CB;
  --coral:#8B3418;--coralbg:#FAECE7;--coralbd:#F5C4B3;
  --pink:#8A2F4E;--pinkbg:#FBEAF0;--pinkbd:#F4C0D1;
  --r:10px;--mono:'Courier New',monospace;
}
body{font-family:system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--text);min-height:100vh}

.app-header{background:linear-gradient(135deg,#1a3a6b 0%,#185FA5 100%);padding:16px 24px;display:flex;align-items:center;gap:14px}
.logo{width:42px;height:42px;background:rgba(255,255,255,.18);border-radius:11px;display:flex;align-items:center;justify-content:center;font-size:22px;flex-shrink:0}
.app-header h1{font-size:19px;font-weight:700;color:#fff;letter-spacing:-.01em}
.app-header p{font-size:11px;color:rgba(255,255,255,.7);margin-top:2px}
.hdr-stats{margin-left:auto;display:flex;gap:8px}
.sc{background:rgba(255,255,255,.15);border-radius:8px;padding:5px 14px;text-align:center;min-width:60px}
.sc .v{font-size:18px;font-weight:700;color:#fff}
.sc .l{font-size:9px;color:rgba(255,255,255,.65);text-transform:uppercase;letter-spacing:.05em}

.main{display:grid;grid-template-columns:252px 1fr;min-height:calc(100vh - 74px)}
.sidebar{background:var(--surface);border-right:1px solid var(--border);padding:14px 10px;overflow-y:auto;max-height:calc(100vh - 74px);position:sticky;top:0}
.slbl{font-size:9px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--text3);margin-bottom:7px;padding-left:6px}
.cgroup{margin-bottom:14px}
.chead{display:flex;align-items:center;gap:6px;padding:5px 8px;border-radius:7px;font-size:11px;font-weight:700;margin-bottom:3px}
.qi{display:flex;align-items:center;gap:7px;padding:6px 9px;border-radius:7px;cursor:pointer;font-size:11px;color:var(--text2);transition:.12s;border:1px solid transparent;line-height:1.3}
.qi:hover{background:var(--bg)}
.qi.active{background:var(--bluebg);border-color:var(--bluebd);color:var(--blue)}
.qi.done{color:var(--green)}
.qi.done .qtick{display:block}
.qn{width:19px;height:19px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:9px;font-weight:700;flex-shrink:0}
.qtick{display:none;font-size:12px;color:var(--green);margin-left:auto}

.content{padding:18px 20px;overflow-y:auto;max-height:calc(100vh - 74px)}

.pbar-wrap{height:5px;background:var(--border);border-radius:3px;overflow:hidden;margin-bottom:14px}
.pbar{height:100%;background:var(--blue);border-radius:3px;transition:.4s}

.navrow{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:12px;gap:12px;flex-wrap:wrap}
.navinfo .title{font-size:15px;font-weight:700;color:var(--text)}
.navinfo .sub{font-size:11px;color:var(--text3);margin-top:3px}
.navbtns{display:flex;gap:6px;flex-shrink:0}

.btn{display:inline-flex;align-items:center;gap:5px;padding:6px 13px;border-radius:7px;font-size:12px;font-weight:500;cursor:pointer;border:1px solid var(--border2);background:var(--surface);color:var(--text);transition:.12s;white-space:nowrap}
.btn:hover{background:var(--surface3)}
.btn:disabled{opacity:.4;cursor:default}
.btn-primary{background:var(--blue);color:#fff;border-color:var(--blue)}
.btn-primary:hover{background:#0C447C}
.btn-hint{background:var(--amberbg);color:var(--amber);border-color:var(--amberbd)}
.btn-eye{background:var(--purplebg);color:var(--purple);border-color:var(--purplebd)}
.btn-reset{background:var(--surface3);color:var(--text2);border-color:var(--border2)}

/* INFO CARD */
.icard{border-radius:var(--r);padding:13px 15px;margin-bottom:14px;border:1px solid}
.icard-top{display:flex;align-items:center;gap:10px;margin-bottom:9px}
.icard-icon{width:36px;height:36px;border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:19px;flex-shrink:0}
.icard-title{font-size:14px;font-weight:700}
.icard-concept{font-size:10px;margin-top:2px;font-weight:600;letter-spacing:.03em;text-transform:uppercase}
.icard-desc{font-size:12px;color:var(--text2);line-height:1.65;margin-bottom:9px}
.chips{display:flex;flex-wrap:wrap;gap:5px}
.chip{font-size:10px;padding:2px 8px;border-radius:12px;background:var(--surface);border:1px solid var(--border);color:var(--text2)}

/* IO SECTION */
.io-section{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
.io-box{background:var(--surface);border-radius:var(--r);border:1px solid var(--border);overflow:hidden}
.io-head{padding:7px 12px;border-bottom:1px solid var(--border);font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.07em;display:flex;align-items:center;gap:6px;background:var(--surface3)}
.io-body{padding:10px 12px;font-size:12px;line-height:1.7;color:var(--text2)}
.io-body code{font-family:var(--mono);font-size:11px;background:var(--surface3);padding:1px 5px;border-radius:4px;color:var(--blue)}
.io-row{display:flex;gap:8px;margin-bottom:4px;align-items:flex-start}
.io-row:last-child{margin-bottom:0}
.io-dot{width:6px;height:6px;border-radius:50%;flex-shrink:0;margin-top:6px}
.expected-out{font-family:var(--mono);font-size:11px;background:#0F172A;color:#4ADE80;padding:8px 10px;border-radius:6px;line-height:1.8;margin-top:6px}

/* GAME AREA */
.game-area{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.panel{background:var(--surface);border-radius:var(--r);border:1px solid var(--border);overflow:hidden}
.panel-head{padding:8px 12px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:7px;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;background:var(--surface3)}
.panel-body{padding:6px}

/* LINE BLOCKS — NO GAP BETWEEN */
.line-block{
  display:flex;align-items:flex-start;gap:6px;
  background:var(--surface3);border:1px solid var(--border);
  border-radius:0;
  padding:5px 9px;
  font-size:11.5px;font-family:var(--mono);
  cursor:pointer;line-height:1.55;color:var(--text);
  user-select:none;transition:.1s;
  margin:0;
}
.line-block:first-child{border-radius:6px 6px 0 0}
.line-block:last-child{border-radius:0 0 6px 6px}
.line-block:only-child{border-radius:6px}
/* merge borders */
.line-block+.line-block{border-top:none}
.line-block:hover{background:#E8EEF6;border-color:var(--border2);z-index:1;position:relative}
.line-block.dragging{opacity:.35}
.line-block.drophover{background:var(--bluebg);border-color:var(--blue);z-index:2;position:relative}
.line-block.ans{border-left:3px solid var(--blue);background:#FAFCFF}
.line-block.ans:first-child{border-radius:6px 6px 0 0}
.line-block.ans:last-child{border-radius:0 0 6px 6px}
.line-block.ans:only-child{border-radius:6px}
.line-block.ok{border-left:3px solid var(--green);background:var(--greenbg)}
.line-block.err{border-left:3px solid var(--red);background:var(--redbg)}
.ln{font-size:9px;color:var(--text3);min-width:14px;flex-shrink:0;margin-top:2px;text-align:right}
.lcode{flex:1;white-space:pre;overflow:hidden}

/* drop zones between lines */
.dz{height:4px;background:transparent;border-radius:2px;transition:.1s;margin:0}
.dz.active{height:16px;background:var(--bluebg);border:1px dashed var(--blue);border-radius:4px;display:flex;align-items:center;justify-content:center;font-size:9px;color:var(--blue)}

.empty-hint{padding:24px 12px;text-align:center;font-size:11px;color:var(--text3);border:1.5px dashed var(--border);border-radius:8px;margin:4px}

/* ACTIONS */
.actions{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:12px}

/* HINT BOX */
.hintbox{background:var(--amberbg);border:1px solid var(--amberbd);border-radius:8px;padding:10px 13px;font-size:12px;color:var(--amber);line-height:1.65;margin-bottom:12px;display:none}
.hintbox strong{font-weight:700}

/* FEEDBACK */
.fb{border-radius:8px;padding:10px 13px;font-size:12px;line-height:1.6;margin-bottom:12px;border:1px solid;display:none}
.fb.ok{background:var(--greenbg);border-color:var(--greenbd);color:var(--green)}
.fb.err{background:var(--redbg);border-color:var(--redbd);color:var(--red)}
.fb.warn{background:var(--amberbg);border-color:var(--amberbd);color:var(--amber)}
.fb.info{background:var(--bluebg);border-color:var(--bluebd);color:var(--blue)}

/* OUTPUT */
.out-panel{background:var(--surface);border-radius:var(--r);border:1px solid var(--border);overflow:hidden;margin-bottom:14px}
.out-head{padding:8px 13px;border-bottom:1px solid #1e3a5f;background:#0F172A;display:flex;align-items:center;gap:7px}
.out-head span{font-size:11px;font-weight:700;color:#94A3B8;text-transform:uppercase;letter-spacing:.07em}
.out-badge{margin-left:auto;font-size:10px;padding:2px 9px;border-radius:10px;font-weight:600}
.out-body{padding:12px 14px;font-family:var(--mono);font-size:12px;line-height:1.9;background:#0F172A;min-height:56px}
.ol{color:#4ADE80}
.oe{color:#F87171}
.op{color:#334155;font-size:11px}

/* EXPLANATION */
.expbox{background:var(--surface);border-radius:var(--r);border:1px solid var(--purplebd);overflow:hidden;display:none}
.expbox.show{display:block}
.exp-head{padding:10px 14px;background:var(--purplebg);border-bottom:1px solid var(--purplebd);display:flex;align-items:center;gap:8px}
.exp-head span{font-size:12px;font-weight:700;color:var(--purple)}
.exp-body{padding:14px;display:grid;grid-template-columns:1fr 1fr;gap:14px}
.exp-sec{margin-bottom:0}
.exp-sec.full{grid-column:1/-1}
.explbl{font-size:9px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--text3);margin-bottom:6px}
.exptxt{font-size:12px;color:var(--text2);line-height:1.7}
.esteps{display:flex;flex-direction:column;gap:5px}
.estep{display:flex;gap:9px;align-items:flex-start}
.snum{width:20px;height:20px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:9px;font-weight:700;flex-shrink:0;margin-top:2px;background:var(--purplebg);color:var(--purple)}
.stxt{font-size:12px;color:var(--text2);line-height:1.65;flex:1}
.stxt strong{color:var(--text);font-weight:600}
.ttbl{width:100%;border-collapse:collapse;font-size:11px;margin-top:4px}
.ttbl th{background:var(--surface3);padding:5px 8px;border:1px solid var(--border);font-weight:700;color:var(--text2);text-align:left;font-size:10px;text-transform:uppercase;letter-spacing:.05em}
.ttbl td{padding:5px 8px;border:1px solid var(--border);color:var(--text);font-family:var(--mono);font-size:11px}
.ttbl tr:nth-child(even) td{background:var(--surface3)}
.try-box{background:var(--greenbg);border:1px solid var(--greenbd);border-radius:7px;padding:9px 12px;font-size:12px;color:var(--teal);grid-column:1/-1;line-height:1.6}
.try-box strong{font-weight:700}

/* TOAST */
.toast{position:fixed;bottom:22px;right:22px;background:#1E293B;color:#fff;padding:11px 18px;border-radius:10px;font-size:13px;font-weight:600;z-index:9999;display:none;align-items:center;gap:8px;box-shadow:0 4px 20px rgba(0,0,0,.2)}
.toast.show{display:flex}

@media(max-width:680px){
  .main{grid-template-columns:1fr}
  .sidebar{display:none}
  .game-area{grid-template-columns:1fr}
  .io-section{grid-template-columns:1fr}
  .exp-body{grid-template-columns:1fr}
  .hdr-stats .sc:last-child{display:none}
}
</style>
</head>
<body>

<div class="app-header">
  <div class="logo">🧬</div>
  <div>
    <h1>Python Code Jumble</h1>
    <p>Arrange the lines • See the output • Understand the logic</p>
  </div>
  <div class="hdr-stats">
    <div class="sc"><div class="v" id="hsc">0</div><div class="l">Score</div></div>
    <div class="sc"><div class="v" id="hsv">0</div><div class="l">Solved</div></div>
    <div class="sc"><div class="v">20</div><div class="l">Total</div></div>
  </div>
</div>

<div class="main">
<div class="sidebar" id="sb"></div>
<div class="content" id="ct"></div>
</div>

<div class="toast" id="toast"></div>

<script>
/* ══════════════════════════════════════════════
   QUESTION BANK — 20 questions
══════════════════════════════════════════════ */
const QS = [

/* ── CONDITIONAL 1 ── */
{id:'fever', cat:'conditional', icon:'🌡️', color:'#9B2B2B', bg:'#FCEBEB', bd:'#F7C1C1',
 title:'Patient fever checker',
 concept:'if / elif / else',
 desc:'A hospital checks a patient\'s temperature and prints the exact medical diagnosis. Python checks each condition from the top and stops at the first one that is true.',
 uses:['Hospital triage','Smartwatch health alert','School clinic','Airport scanner'],
 input:[
   {label:'temp', value:'38.7', note:'patient temperature in °C'}
 ],
 expectedOutput:['Mild fever — rest and monitor'],
 explanation:{
   why:'Python evaluates if → elif → elif → else from top to bottom. The moment one condition is True, it runs that block and skips everything else. This is why we put the narrowest ranges first.',
   steps:[
     {l:'temp = 38.7', t:'Stores the patient temperature as a float (decimal number).'},
     {l:'if temp < 36', t:'Is 38.7 less than 36? No → skip "Hypothermia".'},
     {l:'elif temp <= 37.5', t:'Is 38.7 ≤ 37.5? No → skip "Normal".'},
     {l:'elif temp <= 39', t:'Is 38.7 ≤ 39? YES → print "Mild fever". Python stops here.'},
     {l:'else', t:'Never reached because a previous condition already matched.'},
   ],
   trace:[
     {c:'temp < 36', v:'38.7 < 36', r:'False — skip'},
     {c:'temp <= 37.5', v:'38.7 ≤ 37.5', r:'False — skip'},
     {c:'temp <= 39', v:'38.7 ≤ 39', r:'True ✓ RUNS'},
   ],
   tryThis:'Change temp = 35.5 → Hypothermia. Change temp = 40.5 → High fever. Observe how different branches activate.'
 },
 lines:[
   'temp = 38.7',
   'if temp < 36:',
   '    print("Hypothermia — seek help")',
   'elif temp <= 37.5:',
   '    print("Normal temperature")',
   'elif temp <= 39:',
   '    print("Mild fever — rest and monitor")',
   'else:',
   '    print("High fever! See a doctor now")',
 ],
 sim(lines){
   const c=lines.join('\n'),m=c.match(/temp\s*=\s*([\d.]+)/);
   if(!m)return['Error: temp not set'];
   const t=parseFloat(m[1]);
   if(t<36)return['Hypothermia — seek help'];
   if(t<=37.5)return['Normal temperature'];
   if(t<=39)return['Mild fever — rest and monitor'];
   return['High fever! See a doctor now'];
 }
},

/* ── CONDITIONAL 2 ── */
{id:'bmi', cat:'conditional', icon:'⚖️', color:'#185FA5', bg:'#E6F1FB', bd:'#B5D4F4',
 title:'BMI health classifier',
 concept:'if / elif / else — computed condition',
 desc:'A fitness app calculates BMI from weight and height, then classifies the result. BMI = weight ÷ (height²). The calculation must happen BEFORE the conditions are checked.',
 uses:['Fitness apps','Hospital registration','Insurance screening','School health check'],
 input:[
   {label:'weight', value:'70', note:'kg'},
   {label:'height', value:'1.75', note:'metres'}
 ],
 expectedOutput:['BMI: 22.9','Normal weight — healthy range'],
 explanation:{
   why:'The calculation must come first — you cannot check the category before computing the value. round() keeps the output clean. The conditions then check the computed bmi value.',
   steps:[
     {l:'bmi = weight / (height * height)', t:'70 ÷ (1.75 × 1.75) = 70 ÷ 3.0625 = 22.857...'},
     {l:'bmi = round(bmi, 1)', t:'Rounds to 1 decimal → 22.9.'},
     {l:'print("BMI:", bmi)', t:'Prints the value before checking categories.'},
     {l:'elif bmi < 25', t:'22.9 < 25 is True → "Normal weight" prints. '},
   ],
   trace:[
     {c:'bmi < 18.5', v:'22.9 < 18.5', r:'False — skip'},
     {c:'bmi < 25', v:'22.9 < 25', r:'True ✓ RUNS'},
   ],
   tryThis:'weight=50, height=1.75 → underweight. weight=100, height=1.70 → which category?'
 },
 lines:[
   'weight = 70',
   'height = 1.75',
   'bmi = weight / (height * height)',
   'bmi = round(bmi, 1)',
   'print("BMI:", bmi)',
   'if bmi < 18.5:',
   '    print("Underweight")',
   'elif bmi < 25:',
   '    print("Normal weight — healthy range")',
   'elif bmi < 30:',
   '    print("Overweight — improve diet")',
   'else:',
   '    print("Obese — consult a doctor")',
 ],
 sim(lines){
   const c=lines.join('\n');
   const wm=c.match(/weight\s*=\s*([\d.]+)/),hm=c.match(/height\s*=\s*([\d.]+)/);
   if(!wm||!hm)return['Error: weight or height not set'];
   const bmi=Math.round(parseFloat(wm[1])/(parseFloat(hm[1])**2)*10)/10;
   const o=[`BMI: ${bmi}`];
   if(bmi<18.5)o.push('Underweight');
   else if(bmi<25)o.push('Normal weight — healthy range');
   else if(bmi<30)o.push('Overweight — improve diet');
   else o.push('Obese — consult a doctor');
   return o;
 }
},

/* ── CONDITIONAL 3 ── */
{id:'enzyme', cat:'conditional', icon:'⚗️', color:'#8A2F4E', bg:'#FBEAF0', bd:'#F4C0D1',
 title:'Enzyme activity checker',
 concept:'if with AND operator',
 desc:'An enzyme only works when BOTH pH and temperature are in the correct range at the same time. The AND operator means both conditions must be true simultaneously.',
 uses:['Biochemistry lab','Drug manufacturing','Digestive system model','Quality control'],
 input:[
   {label:'pH', value:'7.2', note:'lab condition'},
   {label:'temp', value:'37', note:'°C'}
 ],
 expectedOutput:['Enzyme is active — substrate breaks down'],
 explanation:{
   why:'AND requires ALL conditions to be true at once. If even one is false, the entire condition is false. This is like a door that needs TWO keys — both must be correct.',
   steps:[
     {l:'if 6 < pH < 8 and temp == 37', t:'Two conditions joined by AND. Both must pass simultaneously.'},
     {l:'6 < 7.2 < 8', t:'True — pH is in the correct range.'},
     {l:'temp == 37', t:'True — temperature is correct.'},
     {l:'True AND True = True', t:'Enzyme is active prints. elif and else are skipped.'},
   ],
   trace:[
     {c:'6 < pH < 8', v:'6 < 7.2 < 8', r:'True'},
     {c:'temp == 37', v:'37 == 37', r:'True'},
     {c:'True AND True', v:'both conditions', r:'True ✓ RUNS'},
   ],
   tryThis:'pH=5.0 → enzyme denatured (pH fails). temp=40 with pH=7.2 → temperature wrong. See how AND works.'
 },
 lines:[
   'pH = 7.2',
   'temp = 37',
   'if 6 < pH < 8 and temp == 37:',
   '    print("Enzyme is active — substrate breaks down")',
   'elif pH < 6 or pH > 8:',
   '    print("pH out of range — enzyme denatured")',
   'else:',
   '    print("Wrong temperature — enzyme inactive")',
 ],
 sim(lines){
   const c=lines.join('\n');
   const pm=c.match(/pH\s*=\s*([\d.]+)/),tm=c.match(/temp\s*=\s*([\d.]+)/);
   if(!pm)return['Error: pH not set'];
   const pH=parseFloat(pm[1]),t=tm?parseFloat(tm[1]):37;
   if(pH>6&&pH<8&&t===37)return['Enzyme is active — substrate breaks down'];
   if(pH<=6||pH>=8)return['pH out of range — enzyme denatured'];
   return['Wrong temperature — enzyme inactive'];
 }
},

/* ── CONDITIONAL 4 ── */
{id:'eb', cat:'conditional', icon:'⚡', color:'#7A4A08', bg:'#FAEEDA', bd:'#FAC775',
 title:'Electricity bill calculator',
 concept:'if / elif / else — slab pricing',
 desc:'Electricity boards charge different rates per unit depending on total usage. Checking slabs from lowest to highest ensures each customer gets the right rate.',
 uses:['TNEB billing','Smart meter app','Energy audit','Shop billing'],
 input:[
   {label:'units', value:'210', note:'units consumed'},
   {label:'fixed_charge', value:'50', note:'₹ fixed monthly'}
 ],
 expectedOutput:['Electricity bill: Rs. 890.0'],
 explanation:{
   why:'Slab pricing checks conditions in ascending order. Once a slab matches, the rate is set and all other elif blocks are skipped. The final total is calculated OUTSIDE the if/elif chain.',
   steps:[
     {l:'units <= 100', t:'210 ≤ 100? No. Skip ₹1.50 rate.'},
     {l:'units <= 200', t:'210 ≤ 200? No. Skip ₹2.50 rate.'},
     {l:'units <= 500', t:'210 ≤ 500? YES. bill = 210 × 4.0 = 840.'},
     {l:'total = bill + fixed_charge', t:'840 + 50 = 890. This line is outside the if block.'},
     {l:'print(...total)', t:'Prints final bill amount.'},
   ],
   trace:[
     {c:'units <= 100', v:'210 ≤ 100', r:'False — skip'},
     {c:'units <= 200', v:'210 ≤ 200', r:'False — skip'},
     {c:'units <= 500', v:'210 ≤ 500', r:'True ✓ bill=840'},
   ],
   tryThis:'units=85 → ₹177.5. units=650 → which slab? Always check: which condition fires first?'
 },
 lines:[
   'units = 210',
   'fixed_charge = 50',
   'if units <= 100:',
   '    bill = units * 1.5',
   'elif units <= 200:',
   '    bill = units * 2.5',
   'elif units <= 500:',
   '    bill = units * 4.0',
   'else:',
   '    bill = units * 6.0',

 explanation:{
   why:'Plain strings cannot do arithmetic — "12:15" minus "09:30" is meaningless. strptime() parses the string into a datetime object. Subtracting gives a timedelta which has total_seconds(). Dividing by 60 gives minutes.',
   steps:[
     {l:'from datetime import datetime', t:'Must import before using any datetime functions.'},
     {l:'datetime.strptime("09:30", "%H:%M")', t:'%H = 24-hour hour, %M = minutes. Converts string to datetime.'},
     {l:'duration = end - start', t:'Subtracting two datetime objects gives a timedelta object.'},
     {l:'total_minutes = int(duration.total_seconds() / 60)', t:'timedelta stores time as seconds. Divide by 60 for minutes.'},
     {l:'hours = total_minutes // 60', t:'Integer division: 165 // 60 = 2 hours.'},
     {l:'minutes = total_minutes % 60', t:'Remainder: 165 % 60 = 45 minutes.'},
   ],
   trace:[
     {c:'strptime("09:30")', v:'string → datetime', r:'datetime object'},
     {c:'end - start', v:'12:15 − 09:30', r:'timedelta of 165 min'},
     {c:'165 // 60', v:'integer division', r:'2 hours'},
     {c:'165 % 60', v:'remainder', r:'45 minutes'},
   ],
   tryThis:'Change end_str to "10:30" — is it still over 2 hours? Try "11:30" exactly — which branch fires?'
 },
 lines:[
   'from datetime import datetime',
   'start_str = "09:30"',
   'end_str = "12:15"',
   'start = datetime.strptime(start_str, "%H:%M")',
   'end = datetime.strptime(end_str, "%H:%M")',
   'duration = end - start',
   'total_minutes = int(duration.total_seconds() / 60)',
   'hours = total_minutes // 60',
   'minutes = total_minutes % 60',
   'print("Duration:", hours, "hours", minutes, "minutes")',
   'if total_minutes > 120:',
   '    print("Warning: meeting exceeds 2 hours!")',
   'else:',
   '    print("Duration is within recommended limits.")',
 ],
 sim(lines){

   const sm=c.match(/start_str\s*=\s*"(\d+:\d+)"/),em=c.match(/end_str\s*=\s*"(\d+:\d+)"/);
   if(!sm||!em)return['Error: time strings not set'];
   const[sh,smin]=sm[1].split(':').map(Number),[eh,emin]=em[1].split(':').map(Number);
   const total=(eh*60+emin)-(sh*60+smin);
   if(total<0)return['Error: end time before start time'];

  </div>
  <div class="io-box">
    <div class="io-head"><span style="color:var(--green)">▸</span> Expected output</div>
    <div class="io-body"><div class="expected-out">${expOut}</div></div>
  </div>
</div>

<div class="game-area">
  <div class="panel">
    <div class="panel-head" style="color:${q.color}">🃏 Jumbled lines &nbsp;<span style="margin-left:auto;font-size:10px;background:${q.bg};color:${q.color};padding:2px 8px;border-radius:8px;font-weight:600" id="jcount">0 left</span></div>
    <div class="panel-body" id="jcol"></div>
  </div>
  <div class="panel">
    <div class="panel-head" style="color:var(--green)">📝 Your answer &nbsp;<span style="margin-left:auto;font-size:10px;background:var(--greenbg);color:var(--green);padding:2px 8px;border-radius:8px;font-weight:600" id="acount">0 placed</span></div>
    <div class="panel-body" id="acol"></div>
  </div>
</div>

<div class="actions">
  <button class="btn btn-primary" onclick="checkAns()">▶ Check answer</button>
  <button class="btn btn-hint" onclick="toggleHint()">💡 Hint</button>
  <button class="btn btn-eye" onclick="showSol()">👁 Show solution</button>
  <button class="btn btn-reset" onclick="resetQ()">↺ Reshuffle</button>
  <button class="btn" onclick="clearAns()" style="color:var(--red)">✕ Clear</button>
</div>
<div class="hintbox" id="hbox"></div>
<div class="fb" id="fb"></div>
<div class="out-panel">
  <div class="out-head"><span>▸</span><span>Output</span><span class="out-badge" id="obadge" style="background:#1e3a5f;color:#64748B">waiting</span></div>
  <div class="out-body" id="obody"><span class="op">Run your arranged code to see the output...</span></div>
</div>
<div class="expbox" id="expbox"></div>
`;
  renderJ();renderA();updateCounts();
}

/* ══════════════════════════════════════════════
   RENDER COLUMNS — NO GAP between lines
══════════════════════════════════════════════ */
function renderJ(){
  const col=document.getElementById('jcol');
  if(!col)return;
  if(jumbled.length===0){col.innerHTML='<div class="empty-hint">All lines moved to answer column ✓</div>';return;}
  col.innerHTML='';
  const wrap=document.createElement('div');
  wrap.style.cssText='padding:4px';
  jumbled.forEach((line,i)=>{
    wrap.appendChild(makeBlock(line,i,'j'));
  });
  col.appendChild(wrap);
}

function renderA(){
  const col=document.getElementById('acol');
  if(!col)return;
  col.innerHTML='';
  if(answered.length===0){
    col.innerHTML='<div class="empty-hint">Click lines from the left to add them here</div>';
    return;
  }
  const wrap=document.createElement('div');
  wrap.style.cssText='padding:4px';
  // drop zone at top
  wrap.appendChild(makeDZ(0));
  answered.forEach((line,i)=>{
    wrap.appendChild(makeBlock(line,i,'a'));
    wrap.appendChild(makeDZ(i+1));
  });
  col.appendChild(wrap);
}

function makeDZ(before){
  const dz=document.createElement('div');
  dz.className='dz';
  dz.dataset.before=before;
  dz.addEventListener('dragover',e=>{e.preventDefault();dz.classList.add('active');dz.textContent='drop here'});
  dz.addEventListener('dragleave',()=>{dz.classList.remove('active');dz.textContent=''});
  dz.addEventListener('drop',e=>{
    e.preventDefault();dz.classList.remove('active');dz.textContent='';
    handleDrop('a',parseInt(dz.dataset.before));
  });
  return dz;
}

function makeBlock(line,idx,area){
  const d=document.createElement('div');
  d.className='line-block'+(area==='a'?' ans':'');
  d.draggable=true;
  d.dataset.idx=idx;d.dataset.area=area;
  // indent visual
  const spaces=(line.text.match(/^(\s*)/)||['',''])[1].length;
  const indent='&nbsp;'.repeat(spaces);
  const trimmed=esc(line.text.trimStart());
  const q=QS[cur];
  d.innerHTML=`<span class="ln">${area==='a'?idx+1:'•'}</span><span class="lcode">${indent}${trimmed}</span>`;
  if(area==='a') d.style.borderLeftColor=q.color;
  // drag
  d.addEventListener('dragstart',()=>{dragSrc=idx;dragArea=area;setTimeout(()=>d.classList.add('dragging'),0)});
  d.addEventListener('dragend',()=>d.classList.remove('dragging'));
  // drag-over for jumble column
  if(area==='j'){
    d.addEventListener('dragover',e=>{e.preventDefault();d.classList.add('drophover')});
    d.addEventListener('dragleave',()=>d.classList.remove('drophover'));
    d.addEventListener('drop',e=>{
      e.preventDefault();d.classList.remove('drophover');
      if(dragArea==='a'){const l=answered.splice(dragSrc,1)[0];jumbled.splice(idx,0,l);renderJ();renderA();updateCounts();}
    });
    d.addEventListener('click',()=>{
      const l=jumbled.splice(idx,1)[0];answered.push(l);renderJ();renderA();updateCounts();
    });
  } else {
    d.addEventListener('click',()=>{
      const l=answered.splice(idx,1)[0];jumbled.push(l);renderJ();renderA();updateCounts();
    });
  }
  return d;
}

function handleDrop(targetArea,beforeIdx){
  if(dragArea==='j'&&targetArea==='a'){
    const l=jumbled.splice(dragSrc,1)[0];
    answered.splice(beforeIdx,0,l);
  } else if(dragArea==='a'&&targetArea==='a'){
    const l=answered.splice(dragSrc,1)[0];
    const ins=dragSrc<beforeIdx?beforeIdx-1:beforeIdx;
    answered.splice(Math.max(0,ins),0,l);
  }
  renderJ();renderA();updateCounts();
}

function updateCounts(){
  const jc=document.getElementById('jcount'),ac=document.getElementById('acount');
  if(jc)jc.textContent=`${jumbled.length} left`;
  if(ac)ac.textContent=`${answered.length} placed`;
}

/* ══════════════════════════════════════════════
   CHECK
══════════════════════════════════════════════ */
function checkAns(){
  const q=QS[cur];
  if(!answered.length){showFB('warn','Place lines in the answer column first — click any line on the left to move it.');return;}
  if(answered.length<q.lines.length){showFB('warn',`${q.lines.length-answered.length} line(s) still in the jumble pile. Move all lines across first.`);return;}
  const correct=q.lines.map((_,i)=>i);
  const given=answered.map(l=>l.id);
  const ok=given.every((id,i)=>id===correct[i]);
  // run output
  const output=q.sim(answered.map(l=>l.text));
  const ob=document.getElementById('obody'),badge=document.getElementById('obadge');
  ob.innerHTML=output.map(l=>`<div class="${l.startsWith('Error')?'oe':'ol'}">${esc(l)}</div>`).join('');
  if(ok){
    badge.style.cssText='background:#14532d;color:#4ADE80';badge.textContent='correct!';
    showFB('ok','🏆 Perfect! All lines in the correct order.');
    colorLines(true,given,correct);
    if(!solved[q.id]){solved[q.id]=true;scores[q.id]=10;updHdr();toast('🎉 +10 points!');buildSB();document.getElementById('pbar').style.width=Math.round(Object.keys(solved).length/QS.length*100)+'%';}
    showExp();
  } else {
    badge.style.cssText='background:#7f1d1d;color:#F87171';badge.textContent='wrong order';
    const w=given.filter((id,i)=>id!==correct[i]).length;
    showFB('err',`${w} line(s) in the wrong position. The output shows what your current order produces — compare it with the expected output above and adjust.`);
    colorLines(false,given,correct);
  }
}

function colorLines(allOk,given,correct){
  document.querySelectorAll('#acol .line-block').forEach((b,i)=>{
    b.classList.remove('ok','err');
    if(allOk)b.classList.add('ok');
    else if(given[i]!==correct[i])b.classList.add('err');
    else b.classList.add('ok');
  });
}

/* ══════════════════════════════════════════════
   SOLUTION
══════════════════════════════════════════════ */
function showSol(){
  const q=QS[cur];
  jumbled=[];
  answered=q.lines.map((t,i)=>({id:i,text:t}));
  renderJ();renderA();updateCounts();
  const ob=document.getElementById('obody'),badge=document.getElementById('obadge');
  const output=q.sim(answered.map(l=>l.text));
  ob.innerHTML=output.map(l=>`<div class="ol">${esc(l)}</div>`).join('');
  badge.style.cssText='background:#14532d;color:#4ADE80';badge.textContent='solution';
  showFB('info','Solution shown — study the order and then try a new question!');
  document.querySelectorAll('#acol .line-block').forEach(b=>b.classList.add('ok'));
  showExp();
}

/* ══════════════════════════════════════════════
   EXPLANATION
══════════════════════════════════════════════ */
function showExp(){
  const q=QS[cur],e=q.explanation,eb=document.getElementById('expbox');
  if(!eb)return;
  const traceRows=e.trace.map(r=>`<tr><td>${esc(r.c)}</td><td>${esc(r.v)}</td><td>${esc(r.r)}</td></tr>`).join('');
  const stepItems=e.steps.map((s,i)=>`<div class="estep"><div class="snum">${i+1}</div><div class="stxt"><strong>${esc(s.l)}</strong><br>${esc(s.t)}</div></div>`).join('');
  eb.innerHTML=`
<div class="exp-head"><span>📖 Explanation — why this order?</span></div>
<div class="exp-body">
  <div class="exp-sec full"><div class="explbl">Concept</div><div class="exptxt">${esc(e.why)}</div></div>
  <div class="exp-sec"><div class="explbl">Line by line</div><div class="esteps">${stepItems}</div></div>
  <div class="exp-sec"><div class="explbl">Condition trace</div><table class="ttbl"><tr><th>Check</th><th>Value</th><th>Result</th></tr>${traceRows}</table></div>
  <div class="try-box"><strong>🧪 Try this:</strong> ${esc(e.tryThis)}</div>
</div>`;
  eb.classList.add('show');
}

/* ══════════════════════════════════════════════
   HINT / FEEDBACK / TOAST / CLEAR
══════════════════════════════════════════════ */
function toggleHint(){
  const hb=document.getElementById('hbox');if(!hb)return;
  if(hb.style.display==='block'){hb.style.display='none';return;}
  hb.innerHTML=`<strong>💡 Hint:</strong> ${esc(QS[cur].explanation.steps[0].t)} — ${esc(QS[cur].explanation.steps[1]?.t||'')}`;
  hb.style.display='block';
}
function clearAns(){jumbled=[...jumbled,...answered];answered=[];renderJ();renderA();updateCounts();document.getElementById('fb').style.display='none';}
function showFB(type,msg){const fb=document.getElementById('fb');if(!fb)return;fb.className=`fb ${type}`;fb.innerHTML=msg;fb.style.display='block'}
function toast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2500)}

/* ── INIT ── */
buildSB();resetQ();
</script>
</body>
