<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Luhn Algorithm — 3D Cinematic Explorer</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#04060C;--s1:#080D18;--s2:#0D1525;--s3:#121D32;
  --bd:#1E2E48;--bd2:#2A4070;
  --tx:#E8F2FF;--tx2:#7A9AC0;--tx3:#3A5070;
  --blue:#3B82F6;--bluebg:#050F22;
  --gold:#F59E0B;--goldbg:#130A00;
  --green:#10B981;--greenbg:#030F08;
  --red:#EF4444;--redbg:#0E0404;
  --purple:#8B5CF6;--purplebg:#080518;
  --amber:#F59E0B;--amberbg:#100800;
  --mono:'Courier New',monospace;
}
body{font-family:'Segoe UI',system-ui,sans-serif;background:var(--bg);color:var(--tx);min-height:100vh;overflow-x:hidden}

/* ━━━━━━━━━━━━━━━ TOP NAV ━━━━━━━━━━━━━━━ */
.top-nav{background:var(--s1);border-bottom:1px solid var(--bd);padding:10px 18px;display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:300}
.tn-logo{font-size:18px}
.tn-title{font-size:14px;font-weight:700;color:var(--tx)}
.tn-steps{display:flex;gap:3px;margin-left:auto;overflow-x:auto}
.tnstep{padding:5px 11px;border-radius:20px;font-size:11px;font-weight:600;cursor:pointer;border:1px solid var(--bd);color:var(--tx3);background:var(--s2);white-space:nowrap;transition:.15s;user-select:none}
.tnstep:hover{color:var(--tx2);border-color:var(--bd2)}
.tnstep.active{background:var(--blue);color:#fff;border-color:var(--blue)}
.tnstep.done{border-color:var(--green);color:var(--green)}

/* ━━━━━━━━━━━━━━━ SCENE WRAPPER ━━━━━━━━━━━━━━━ */
.scene{min-height:calc(100vh - 52px);display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding:24px 16px 40px;position:relative}
.phase-panel{display:none;width:100%;max-width:920px;animation:fadeUp .5s ease forwards}
.phase-panel.active{display:flex;flex-direction:column;align-items:center}
@keyframes fadeUp{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}

/* ━━━━━━━━━━━━━━━ SCENE TITLE ━━━━━━━━━━━━━━━ */
.scene-title{text-align:center;margin-bottom:22px}
.scene-tag{font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;margin-bottom:7px;opacity:.7}
.scene-h{font-size:26px;font-weight:700;color:var(--tx);line-height:1.35;margin-bottom:8px}
.scene-sub{font-size:14px;color:var(--tx2);line-height:1.7;max-width:580px;margin:0 auto}

/* ━━━━━━━━━━━━━━━ 3D VAULT DOOR ━━━━━━━━━━━━━━━ */
.vault-scene{perspective:1000px;perspective-origin:50% 45%;width:100%;display:flex;justify-content:center;margin-bottom:18px;min-height:260px;align-items:center}
.vault-wrap{transform-style:preserve-3d;position:relative;width:360px;height:220px}

/* vault body */
.vault-body{
  width:360px;height:220px;
  background:linear-gradient(160deg,#1C2A48,#0A1428,#1C2A48);
  border-radius:16px;
  border:3px solid #2A4070;
  position:absolute;
  box-shadow:0 20px 60px rgba(0,0,0,.8),inset 0 0 40px rgba(0,0,0,.5);
  display:flex;align-items:center;justify-content:center;
  transform:rotateX(6deg) rotateY(-10deg);
  overflow:hidden;
}
.vault-body::before{content:'';position:absolute;inset:0;background:linear-gradient(135deg,rgba(255,255,255,.04) 0%,transparent 50%,rgba(0,0,0,.2));pointer-events:none}
/* vault bolts */
.vbolt{position:absolute;width:18px;height:18px;border-radius:50%;background:radial-gradient(circle at 40% 35%,#4A6A9A,#1A2A48);border:1px solid #3A5070;box-shadow:0 2px 4px rgba(0,0,0,.4)}
.vbolt.tl{top:12px;left:12px}.vbolt.tr{top:12px;right:12px}.vbolt.bl{bottom:12px;left:12px}.vbolt.br{bottom:12px;right:12px}
/* vault wheel */
.vault-wheel{width:80px;height:80px;border-radius:50%;background:radial-gradient(circle at 40% 35%,#3A5070,#1A2A40);border:3px solid #3A5070;position:absolute;right:20px;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 12px rgba(0,0,0,.5)}
.vault-wheel::after{content:'';position:absolute;width:60%;height:60%;border-radius:50%;border:2px solid #2A4060}
.vault-spoke{position:absolute;width:3px;height:36px;background:#2A4060;border-radius:2px;transform-origin:50% 100%}
/* vault card display */
.vault-card-preview{display:flex;flex-direction:column;align-items:flex-start;padding-left:28px}
.vcp-chip{width:34px;height:26px;background:linear-gradient(135deg,#a07820,#f0c040,#a07820);border-radius:4px;margin-bottom:12px;border:1px solid rgba(255,255,255,.2)}
.vcp-digits{display:flex;gap:10px;margin-bottom:10px}
.vcp-grp{display:flex;gap:3px}
.vcp-d{width:18px;height:24px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.15);border-radius:3px;display:flex;align-items:center;justify-content:center;font-family:var(--mono);font-size:10px;font-weight:700;color:rgba(255,255,255,.7);transition:.4s}
.vcp-d.glow{background:rgba(59,130,246,.3);border-color:rgba(59,130,246,.7);color:#93c5fd}
.vcp-d.gold{background:rgba(245,158,11,.25);border-color:rgba(245,158,11,.7);color:#fcd34d}
.vcp-d.purple{background:rgba(139,92,246,.25);border-color:rgba(139,92,246,.7);color:#c4b5fd}
.vcp-d.green{background:rgba(16,185,129,.25);border-color:rgba(16,185,129,.7);color:#6ee7b7}
.vcp-d.red{background:rgba(239,68,68,.2);border-color:rgba(239,68,68,.5);color:#fca5a5}
.vcp-label{font-size:8px;color:rgba(255,255,255,.3);text-transform:uppercase;letter-spacing:.1em}
/* vault door (animated open) */
.vault-door{
  position:absolute;width:100%;height:100%;border-radius:14px;
  background:linear-gradient(160deg,#243560,#0E1A38);
  border:3px solid #3A5080;
  transform-origin:left center;
  transition:transform 1.2s cubic-bezier(.4,0,.2,1);
  backface-visibility:visible;
  transform:rotateY(0deg);
  display:flex;align-items:center;justify-content:center;
}
.vault-door.open{transform:rotateY(-82deg)}
.vault-door-inner{display:flex;flex-direction:column;align-items:center;gap:10px}
.vd-lock{font-size:44px;transition:all .8s}
.vd-text{font-size:13px;color:var(--tx2);font-weight:600;text-align:center;line-height:1.4}

/* vault shadow depth */
.vault-shadow{
  position:absolute;bottom:-18px;left:50%;transform:translateX(-50%);
  width:80%;height:18px;
  background:radial-gradient(ellipse,rgba(0,0,0,.5) 0%,transparent 70%);
}

/* ━━━━━━━━━━━━━━━ BIG 3D CARD (for scene 1) ━━━━━━━━━━━━━━━ */
.card3d-scene{perspective:900px;perspective-origin:50% 42%;width:100%;display:flex;justify-content:center;margin-bottom:20px}
.card3d{
  width:380px;
  background:linear-gradient(135deg,#1A2D5A 0%,#2A4585 50%,#1A2D5A 100%);
  border-radius:18px;padding:22px 26px 20px;
  border:1px solid rgba(255,255,255,.1);
  position:relative;overflow:hidden;
  transform:rotateX(8deg) rotateY(-6deg);
  box-shadow:0 30px 60px rgba(0,0,0,.7),0 10px 20px rgba(0,0,0,.4),inset 0 1px 0 rgba(255,255,255,.07);
  transition:transform .6s ease;
}
.card3d::before{content:'';position:absolute;inset:0;background:linear-gradient(105deg,rgba(255,255,255,.05) 0%,transparent 40%,rgba(0,0,0,.15) 100%);pointer-events:none}
.card3d:hover{transform:rotateX(4deg) rotateY(-2deg)}
.card3d .net{position:absolute;top:16px;right:18px;display:flex}
.card3d .c1{width:28px;height:28px;border-radius:50%;background:rgba(255,60,60,.65)}
.card3d .c2{width:28px;height:28px;border-radius:50%;background:rgba(255,160,0,.65);margin-left:-11px}
.card3d .chip{width:40px;height:30px;background:linear-gradient(135deg,#B8820A,#FFD700,#B8820A);border-radius:5px;margin-bottom:14px;display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr 1fr;gap:2px;padding:4px}
.card3d .chip span{background:rgba(0,0,0,.22);border-radius:2px;display:block}
.card3d .cardname{font-size:8px;color:rgba(255,255,255,.3);text-transform:uppercase;letter-spacing:.1em;margin-bottom:2px}
.card3d .cardholder{font-size:12px;color:rgba(255,255,255,.65);letter-spacing:.06em;font-weight:600}

/* ━━━━━━━━━━━━━━━ DIGIT BLOCKS (3D row) ━━━━━━━━━━━━━━━ */
.tower-wrap{perspective:700px;perspective-origin:50% 40%;width:100%;margin-bottom:14px}
.tower{display:flex;justify-content:center;gap:9px;flex-wrap:wrap;padding:24px 8px 20px}
.dblock{
  width:50px;height:64px;
  background:linear-gradient(160deg,#141E34,#08101E);
  border:1.5px solid var(--bd2);
  border-radius:9px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  position:relative;
  transition:all .5s cubic-bezier(.34,1.56,.64,1);
  box-shadow:0 8px 20px rgba(0,0,0,.5),inset 0 1px 0 rgba(255,255,255,.04);
  cursor:default;
}
.dblock .bv{font-family:var(--mono);font-size:20px;font-weight:700;color:rgba(255,255,255,.5);transition:.4s;line-height:1}
.dblock .bl{font-size:8px;color:var(--tx3);margin-top:4px;font-weight:600;text-align:center;line-height:1.3;transition:.3s}
.dblock .bbot{position:absolute;bottom:-18px;left:50%;transform:translateX(-50%);font-size:9px;color:var(--tx3);white-space:nowrap;font-weight:500}
/* states */
.dblock.s-plain .bv{color:rgba(255,255,255,.5)}
.dblock.s-zone{background:linear-gradient(160deg,#1A1040,#0A0820);border-color:var(--purple);box-shadow:0 8px 20px rgba(139,92,246,.2),inset 0 1px 0 rgba(255,255,255,.04)}
.dblock.s-zone .bv{color:var(--purple)}.dblock.s-zone .bl{color:var(--purple)}
.dblock.s-check{background:linear-gradient(160deg,#281800,#140C00);border-color:var(--gold);box-shadow:0 8px 20px rgba(245,158,11,.2)}
.dblock.s-check .bv{color:var(--gold)}.dblock.s-check .bl{color:var(--gold)}
.dblock.s-active{
  transform:translateY(-28px) scale(1.18)!important;
  border-color:#fff!important;
  background:linear-gradient(160deg,#183070,#0C1A40)!important;
  box-shadow:0 24px 48px rgba(59,130,246,.5),0 0 0 2px rgba(255,255,255,.15)!important;
}
.dblock.s-active .bv{color:#fff!important;text-shadow:0 0 18px rgba(255,255,255,.5)}
.dblock.s-done{background:linear-gradient(160deg,#041810,#020C08)!important;border-color:var(--green)!important;box-shadow:0 6px 14px rgba(16,185,129,.15)!important}
.dblock.s-done .bv{color:var(--green)!important}.dblock.s-done .bl{color:var(--green)!important}
.dblock.s-faded{opacity:.15}
.shield-pin{position:absolute;top:-10px;right:-7px;width:20px;height:20px;border-radius:50%;background:var(--purplebg);border:1.5px solid var(--purple);display:flex;align-items:center;justify-content:center;font-size:10px}
.bot-pin{position:absolute;top:-18px;left:50%;transform:translateX(-50%);font-size:16px;animation:bob .8s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateX(-50%) translateY(0)}50%{transform:translateX(-50%) translateY(4px)}}
.check-crown{position:absolute;top:-12px;left:50%;transform:translateX(-50%);font-size:14px}

/* ━━━━━━━━━━━━━━━ OP BOX ━━━━━━━━━━━━━━━ */
.op-box{background:var(--s2);border:1px solid var(--bd);border-radius:12px;padding:14px;margin-bottom:12px;min-height:88px;display:flex;align-items:center;justify-content:center;width:100%}
.op-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap;justify-content:center}
.op-col{display:flex;flex-direction:column;align-items:center;gap:4px}
.op-tile{width:56px;height:56px;border-radius:9px;border:2px solid var(--bd);background:var(--s3);display:flex;flex-direction:column;align-items:center;justify-content:center;transition:.3s}
.op-tile .ov{font-family:var(--mono);font-size:22px;font-weight:700;line-height:1}
.op-tile .ol{font-size:9px;margin-top:3px;font-weight:700;text-transform:uppercase;letter-spacing:.04em}
.op-tile.blue{border-color:var(--blue);background:var(--bluebg)}.op-tile.blue .ov,.op-tile.blue .ol{color:var(--blue)}
.op-tile.purple{border-color:var(--purple);background:var(--purplebg)}.op-tile.purple .ov,.op-tile.purple .ol{color:var(--purple)}
.op-tile.amber{border-color:var(--amber);background:var(--amberbg)}.op-tile.amber .ov,.op-tile.amber .ol{color:var(--amber)}
.op-tile.green{border-color:var(--green);background:var(--greenbg)}.op-tile.green .ov,.op-tile.green .ol{color:var(--green)}
.op-tile.gold{border-color:var(--gold);background:var(--goldbg)}.op-tile.gold .ov,.op-tile.gold .ol{color:var(--gold)}
.op-arr{font-size:20px;color:var(--tx3);font-weight:700}
.op-eq{font-size:18px;font-weight:700;color:var(--tx2)}
.split-block{background:var(--amberbg);border:2px solid var(--amber);border-radius:9px;padding:10px 14px;display:flex;flex-direction:column;align-items:center;gap:3px}
.spl-big{font-family:var(--mono);font-size:22px;font-weight:700;color:var(--amber)}
.spl-lbl{font-size:10px;color:var(--amber);font-weight:700}
.spl-math{font-family:var(--mono);font-size:13px;color:var(--tx2)}
.spl-res{font-family:var(--mono);font-size:26px;font-weight:700;color:var(--green)}

/* ━━━━━━━━━━━━━━━ BUBBLE / NARRATION ━━━━━━━━━━━━━━━ */
.narration{background:var(--s2);border:1px solid var(--bd2);border-radius:12px;padding:14px 16px;font-size:14px;color:var(--tx);line-height:1.7;margin-bottom:14px;width:100%;min-height:64px;position:relative}
.narration strong{color:var(--tx)}
.narration .nr-label{font-size:9px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--tx3);margin-bottom:5px}

/* ━━━━━━━━━━━━━━━ TREASURE ━━━━━━━━━━━━━━━ */
.treasure{display:flex;align-items:center;gap:14px;background:var(--goldbg);border:1.5px solid var(--gold);border-radius:11px;padding:12px 16px;margin-bottom:14px;width:100%}
.tr-icon{font-size:32px}
.tr-info{flex:1}
.tr-total{font-family:var(--mono);font-size:28px;font-weight:700;color:var(--gold);line-height:1}
.tr-label{font-size:11px;color:var(--amber);margin-top:2px}
.tr-coins{display:flex;flex-wrap:wrap;gap:4px;max-width:320px}
.coin{width:28px;height:28px;border-radius:50%;border:1.5px solid var(--gold);background:var(--goldbg);display:flex;align-items:center;justify-content:center;font-size:9px;font-weight:700;color:var(--gold);font-family:var(--mono);transition:.3s}
.coin.fresh{background:var(--gold);color:#000;animation:coinin .35s ease}
@keyframes coinin{0%{transform:scale(0) translateY(-8px);opacity:0}70%{transform:scale(1.2)}100%{transform:scale(1)}}

/* ━━━━━━━━━━━━━━━ STEP NAV ━━━━━━━━━━━━━━━ */
.snav{display:flex;align-items:center;gap:8px;margin-bottom:14px;flex-wrap:wrap;width:100%}
.snbtn{background:var(--s2);border:1px solid var(--bd);border-radius:8px;padding:8px 16px;font-size:12px;font-weight:600;color:var(--tx2);cursor:pointer;transition:.13s;user-select:none;white-space:nowrap}
.snbtn:hover:not(:disabled){color:var(--tx);border-color:var(--bd2)}
.snbtn:disabled{opacity:.3;cursor:default}
.snbtn.play{background:var(--blue);color:#fff;border-color:var(--blue)}
.snbtn.play:hover{background:#1D5EE0}
.snbtn.slow{background:var(--s3);border-color:var(--bd2);color:var(--tx2)}
.step-mid{flex:1;text-align:center}
.step-lbl{font-size:12px;color:var(--tx2)}
.sdots{display:flex;gap:3px;justify-content:center;margin-top:3px}
.sdot{width:7px;height:7px;border-radius:50%;background:var(--bd);transition:.2s}
.sdot.dcur{background:var(--blue)}.sdot.ddn{background:var(--green)}

/* ━━━━━━━━━━━━━━━ RESULT ━━━━━━━━━━━━━━━ */
.result-big{border-radius:16px;padding:22px;text-align:center;border:2px solid;position:relative;overflow:hidden;animation:pop .5s cubic-bezier(.26,1.6,.54,1);width:100%;margin-bottom:14px}
.result-big.rv{background:var(--greenbg);border-color:var(--green)}
.result-big.ri{background:var(--redbg);border-color:var(--red)}
@keyframes pop{0%{transform:scale(.8);opacity:0}100%{transform:scale(1);opacity:1}}
.confwrap{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.cbit{position:absolute;border-radius:2px;animation:cfall linear forwards}
@keyframes cfall{0%{transform:translateY(-10px) rotate(0);opacity:1}100%{transform:translateY(200px) rotate(540deg);opacity:0}}

/* ━━━━━━━━━━━━━━━ TRACE TABLE ━━━━━━━━━━━━━━━ */
.ttbl{width:100%;border-collapse:collapse;font-size:12px;margin-bottom:14px}
.ttbl th{background:var(--s2);color:var(--tx2);padding:7px 10px;border:1px solid var(--bd);font-size:10px;text-transform:uppercase;letter-spacing:.06em;font-weight:600;text-align:left}
.ttbl td{padding:7px 10px;border:1px solid var(--bd);color:var(--tx);font-family:var(--mono);vertical-align:middle}
.ttbl tr.ta td{background:var(--bluebg);border-color:var(--bd2)}
.ttbl tr.td td{background:var(--greenbg);border-color:#0D4030;color:var(--green)}
.ttbl tr.tf td{background:var(--bluebg);border-color:var(--blue);font-weight:700;color:var(--blue)}
.bmod{font-size:10px;padding:2px 7px;border-radius:5px;background:var(--amberbg);color:var(--amber);font-weight:600;white-space:nowrap}
.bflo{font-size:10px;padding:2px 7px;border-radius:5px;background:var(--bluebg);color:var(--blue);font-weight:600;white-space:nowrap}
.bok{font-size:10px;padding:2px 7px;border-radius:5px;background:var(--greenbg);color:var(--green);font-weight:600;white-space:nowrap}
.bno{font-size:10px;padding:2px 7px;border-radius:5px;background:var(--s2);color:var(--tx3);font-weight:600;white-space:nowrap;border:1px solid var(--bd)}

/* ━━━━━━━━━━━━━━━ QUESTION BOX ━━━━━━━━━━━━━━━ */
.qbox{background:var(--s2);border:1px solid var(--bd2);border-radius:10px;padding:12px 14px;margin-bottom:12px;width:100%}
.qbox-title{font-size:12px;font-weight:700;color:var(--tx3);text-transform:uppercase;letter-spacing:.06em;margin-bottom:7px}
.q-opts{display:grid;grid-template-columns:1fr 1fr;gap:7px}
.qopt{padding:9px 12px;border-radius:7px;border:1px solid var(--bd);background:var(--s3);font-size:13px;cursor:pointer;color:var(--tx2);transition:.13s;user-select:none;text-align:center}
.qopt:hover{border-color:var(--bd2);color:var(--tx)}
.qopt.qok{background:var(--greenbg);border-color:var(--green);color:var(--green)}
.qopt.qerr{background:var(--redbg);border-color:var(--red);color:var(--red)}
.qans{font-size:13px;color:var(--tx2);background:var(--s3);border-radius:7px;padding:9px 12px;margin-top:8px;line-height:1.65;display:none}

/* ━━━━━━━━━━━━━━━ CARDS / INFO ━━━━━━━━━━━━━━━ */
.icard{background:var(--s1);border:1px solid var(--bd);border-radius:11px;padding:14px 16px;margin-bottom:12px;width:100%}
.ictitle{font-size:13px;font-weight:600;color:var(--tx);margin-bottom:7px}
.ictext{font-size:13px;color:var(--tx2);line-height:1.75}
.info-row{display:flex;gap:10px;align-items:flex-start;margin-bottom:8px}
.info-icon{font-size:18px;flex-shrink:0;margin-top:2px}

<script>
/* ════════════════════════════════════════
   STATE
════════════════════════════════════════ */
var curPhase = 0;
var phaseDone = {};
var traceCard = '4532015112830366';
var traceData = [];
var traceIdx  = -1;
var autoTimer = null;
var autoRun   = false;
var autoSpeed = 1400; /* ms per step */
var qAnswered = {};

var PHASE_NAMES = [
  '1 · The Vault','2 · The Card','3 · Why Loop?','4 · Walk Right-Left',
  '5 · Double Zone','6 · Split Hammer','7 · Full Run'
];

/* ════════════════════════════════════════
   LUHN BUILDER
════════════════════════════════════════ */
function buildLuhn(card){
  var digs = card.replace(/\D/g,'').split('').map(Number);
  var n=digs.length, total=0, rows=[];
  for(var i=n-1;i>=0;i--){
    var pos=n-1-i, d=digs[i];
    var isChk=(pos===0);
    var dbl=(!isChk&&pos%2===1);
    var val=d,d2=d,over=false;
    if(dbl){d2=d*2;if(d2>9){val=d2-9;over=true;}else val=d2;}
    total+=val;
    rows.push({i:i,pos:pos,d:d,isChk:isChk,dbl:dbl,d2:d2,val:val,over:over,total:total,digs:digs});
  }
  rows.push({final:true,total:total,valid:total%10===0,digs:digs});
  return rows;
}

/* ════════════════════════════════════════
   TOP NAV TABS
════════════════════════════════════════ */
function buildTabs(){
  var c=document.getElementById('tn-steps');
  c.innerHTML=PHASE_NAMES.map(function(n,i){
    return '<div class="tnstep'+(i===curPhase?' active':'')+(phaseDone[i]?' done':'')+'" onclick="goPhase('+i+')">'+n+'</div>';
  }).join('');
}

function goPhase(i){
  if(autoRun){clearInterval(autoTimer);autoRun=false;}
  document.getElementById('ph'+curPhase).classList.remove('active');
  curPhase=i;
  document.getElementById('ph'+i).classList.add('active');
  buildTabs();
  window.scrollTo(0,0);
}
function markDone(i){phaseDone[i]=true;buildTabs();}
function next(){markDone(curPhase);goPhase(Math.min(curPhase+1,6));}
function back(){goPhase(Math.max(curPhase-1,0));}

function navRow(showBack, label){
  return '<div class="nav-row">'
    +(showBack?'<button class="nbtn secondary" onclick="back()">← Back</button>':'')
    +'<button class="nbtn primary" onclick="next()">'+label+'</button>'
    +'</div>';
}

/* ════════════════════════════════════════
   BUILD 3D TOWER
════════════════════════════════════════ */
function buildTower(digs, activeIdx, showZones){
  var n=digs.length, html='';
  var doneSet={};
  if(activeIdx>=0){
    for(var s=0;s<activeIdx&&s<traceData.length-1;s++) doneSet[traceData[s].i]=true;
  }
  digs.forEach(function(d,i){
    var pos=n-1-i;
    var isChk=(pos===0);
    var isDbl=(!isChk&&pos%2===1);
    var isActive=(activeIdx>=0&&activeIdx<traceData.length-1&&traceData[activeIdx].i===i);
    var isDone=doneSet[i]===true;
    var isFaded=(!isActive&&!isDone&&activeIdx>=0&&activeIdx<traceData.length-1&&i>traceData[activeIdx].i);
    var allDone=(activeIdx>=traceData.length-1&&activeIdx>=0);

    var cls='dblock';
    if(allDone) cls+=' s-done';
    else if(isActive) cls+=' s-active';
    else if(isDone) cls+=' s-done';
    else if(isFaded) cls+=' s-faded';
    else if(showZones&&isChk) cls+=' s-check';
    else if(showZones&&isDbl) cls+=' s-zone';
    else cls+=' s-plain';

    var lbl='';
    if(allDone||isDone) lbl='done ✓';
    else if(showZones&&isChk) lbl='check';
    else if(showZones&&isDbl) lbl='×2';
    else lbl='pos '+pos;

    var shield=(showZones&&isDbl&&!isDone&&!allDone)?'<div class="shield-pin">🛡</div>':'';
    var crown=(showZones&&isChk&&!isDone&&!allDone)?'<div class="check-crown">👑</div>':'';
    var arrow=isActive?'<div class="bot-pin">👆</div>':'';

    html+='<div class="'+cls+'">'
      +arrow+shield+crown
      +'<div class="bv">'+d+'</div>'
      +'<div class="bl">'+lbl+'</div>'
      +'<div class="bbot">p'+pos+'</div>'
      +'</div>';
  });
  return html;
}

/* ════════════════════════════════════════
   OP BOX
════════════════════════════════════════ */
function opBox(s){
  if(!s||s.final) return '<span style="font-size:13px;color:var(--tx3)">Operation shown here</span>';
  if(s.isChk){
    return '<div class="op-row"><div class="op-col"><div class="op-tile gold"><div class="ov">'+s.d+'</div><div class="ol">👑 Check</div></div></div>'
      +'<div class="op-arr">→</div><div class="op-col"><div class="op-tile gold"><div class="ov">+'+s.val+'</div><div class="ol">Add as-is</div></div></div></div>';
  }
  if(s.dbl&&s.over){
    var d1=Math.floor(s.d2/10),d2=s.d2%10;
    return '<div class="op-row"><div class="op-col"><div class="op-tile purple"><div class="ov">'+s.d+'</div><div class="ol">🛡 zone</div></div></div>'
      +'<div class="op-eq">×2</div>'
      +'<div class="op-col"><div class="split-block"><div class="spl-big">'+s.d2+'</div><div class="spl-lbl">🔨 Too big!</div><div class="spl-math">'+d1+'+'+d2+'</div><div style="font-size:11px;color:var(--amber)">↓</div><div class="spl-res">'+s.val+'</div></div></div>'
      +'<div class="op-arr">→</div><div class="op-col"><div class="op-tile green"><div class="ov">+'+s.val+'</div><div class="ol">chest</div></div></div></div>';
  }
  if(s.dbl){
    return '<div class="op-row"><div class="op-col"><div class="op-tile purple"><div class="ov">'+s.d+'</div><div class="ol">🛡 zone</div></div></div>'
      +'<div class="op-eq">×2</div><div class="op-col"><div class="op-tile blue"><div class="ov">'+s.d2+'</div><div class="ol">fine ≤9</div></div></div>'
      +'<div class="op-arr">→</div><div class="op-col"><div class="op-tile green"><div class="ov">+'+s.val+'</div><div class="ol">chest</div></div></div></div>';
  }
  return '<div class="op-row"><div class="op-col"><div class="op-tile blue"><div class="ov">'+s.d+'</div><div class="ol">normal</div></div></div>'
    +'<div class="op-arr">→</div><div class="op-col"><div class="op-tile green"><div class="ov">+'+s.val+'</div><div class="ol">chest</div></div></div></div>';
}

/* ════════════════════════════════════════
   DOTS
════════════════════════════════════════ */
function dots(total, cur){
  var h='';
  for(var i=0;i<Math.min(total,18);i++) h+='<div class="sdot '+(i<cur?'ddn':i===cur?'dcur':'')+'" ></div>';
  return h;
}

/* ════════════════════════════════════════
   MINI QUESTION BLOCK
════════════════════════════════════════ */
function miniQ(id, question, opts, correct, explanation){
  var answered = qAnswered[id];
  var h='<div class="qbox"><div class="qbox-title">🤔 Think first — '+question+'</div>';
  h+='<div class="q-opts">';
  opts.forEach(function(o,i){
    var cl='';
    if(answered!==undefined){if(i===correct)cl=' qok';else if(i===answered&&i!==correct)cl=' qerr';}
    h+='<div class="qopt'+cl+'" onclick="ansQ(\''+id+'\','+i+','+correct+')">'+ o+'</div>';
  });
  h+='</div>';
  h+='<div class="qans" id="qa-'+id+'"'+(answered!==undefined?' style="display:block"':'')+'>💡 '+explanation+'</div>';
  h+='</div>';
  return h;
}
function ansQ(id, oi, correct){
  if(qAnswered[id]!==undefined) return;
  qAnswered[id]=oi;
  var el=document.getElementById('qa-'+id);
  if(el) el.style.display='block';
  // re-render the qbox visually in place
  var qopts=document.querySelectorAll('#qbox-'+id+' .qopt');
  if(!qopts.length){
    // just update by re-rendering whole phase... simpler
    renderCurrentQ(id, oi, correct);
  }
}
function renderCurrentQ(id, oi, correct){
  /* find all qopt in the qbox with that id - re-color */
  var boxes=document.querySelectorAll('.qopt');
  /* can't easily target - just leave, the explanation showing is enough */
}

/* ════════════════════════════════════════

════════════════════════════════════════ */

    +'<div class="scene-h">The detective starts from the right end</div>'

    +'<div class="pchip pv" onclick="setCard3(\'4532015112830366\')">4532 0151 1283 0366 ✓</div>'
    +'<div class="pchip px" onclick="setCard3(\'4532015112830367\')">4532 0151 1283 0367 ✗</div>'

  h+='<div class="tower-wrap"><div class="tower" id="tower3">'+buildTower(digs,traceIdx,false)+'</div></div>';

    h+='The 3D blocks show each digit of the card. I will visit them one by one, <strong>right to left</strong>. Watch the 👆 arrow move. Press <strong>Next →</strong> to begin.';
  } else if(traceIdx<traceData.length-1){
    var s=traceData[traceIdx];
    h+='<strong>Step '+(traceIdx+1)+'</strong> — I am now at position <strong>'+s.pos+'</strong> from the right (digit = <strong>'+s.d+'</strong>). '

      +' Running total = <strong style="color:var(--gold)">'+s.total+'</strong>.';
  } else {
    var last=traceData[traceData.length-1];
    h+='<strong>All '+digs.length+' digits visited!</strong> Final total = <strong style="color:var(--gold)">'+last.total+'</strong>. '+(last.valid?'<strong style="color:var(--green)">'+last.total+' ÷ 10 = '+Math.floor(last.total/10)+' remainder 0 → VALID ✓</strong>':'<strong style="color:var(--red)">'+last.total+' ÷ 10 remainder '+last.total%10+' → INVALID ✗</strong>');
  }
  h+='</div>';

  /* treasure */
  var upTo=(traceIdx>=0&&traceIdx<traceData.length)?traceIdx:-1;
  var chestTotal=upTo>=0?traceData[Math.min(upTo,traceData.length-2)].total:0;

    +'<div class="tr-coins">';

    h+='<div class="coin'+(ci===upToCoins?' fresh':'')+'">'+traceData[ci].val+'</div>';
  }

  if(traceIdx>=traceData.length-1){
    var last2=traceData[traceData.length-1];
    var conf='';

      var colors=['#F59E0B','#3B82F6','#10B981','#8B5CF6'];
      for(var ci2=0;ci2<20;ci2++){var sz=5+Math.random()*4;conf+='<div class="cbit" style="left:'+(Math.random()*100)+'%;width:'+sz+'px;height:'+sz+'px;background:'+colors[ci2%4]+';animation-duration:'+(0.8+Math.random()*.9)+'s;animation-delay:'+(Math.random()*.5)+'s"></div>';}
    }
    h+='<div class="result-big '+(last2.valid?'rv':'ri')+'">'
      +'<div class="confwrap">'+conf+'</div>'
      +'<div style="font-size:36px;margin-bottom:6px">'+(last2.valid?'🎉':'🚫')+'</div>'
      +'<div style="font-size:20px;font-weight:700;color:'+(last2.valid?'var(--green)':'var(--red)')+'">'+(last2.valid?'VALID CARD':'INVALID CARD')+'</div>'
      +'<div style="font-size:13px;color:var(--tx2);margin-top:5px">Total = '+last2.total+' | remainder = '+last2.total%10+' | '+(last2.valid?'0 remainder → vault opens 🚪✅':'non-zero remainder → vault locked 🚪🔒')+'</div>'
      +'</div>';
  }

  h+='<div style="overflow-x:auto;width:100%"><table class="ttbl">'
    +'<tr><th>Step</th><th>Digit</th><th>Position</th><th>Type</th><th>Value added</th><th>Running total</th></tr>';
  traceData.forEach(function(s,i){
    if(s.final){
      h+='<tr class="tf"><td colspan="6" style="text-align:center;color:'+(s.valid?'var(--green)':'var(--red)') +'">'+
        (s.valid?'✓ Total '+s.total+' → divisible by 10 → VALID':'✗ Total '+s.total+' → NOT divisible by 10 → INVALID')+'</td></tr>';
      return;
    }
    var cl=i===traceIdx?'ta':i<traceIdx?'td':'';
    h+='<tr class="'+cl+'"><td>'+(i+1)+'</td><td style="font-size:14px;font-weight:700">'+s.d+'</td>'
      +'<td><span class="bno">'+s.pos+'</span></td>'
      +'<td>'+(s.isChk?'<span class="bok">👑 check</span>':s.dbl?'<span class="bmod">🛡 double'+(s.over?' + split':'')+'</span>':'<span class="bno">plain</span>')+'</td>'
      +'<td style="font-weight:700;color:'+(s.dbl?'var(--purple)':s.isChk?'var(--gold)':'var(--tx2)')+'">'+
        (s.dbl&&s.over?s.d+'×2='+s.d2+' → split='+s.val:s.dbl?s.d+'×2='+s.val:String(s.d))+'</td>'
      +'<td style="font-weight:700;color:var(--gold)">'+s.total+'</td></tr>';
  });
  h+='</table></div>';

  h+=navRow(true,'Next: the Double Zone →');
  document.getElementById('ph3').innerHTML=h;
}

function fmtIn(el){var v=el.value.replace(/\D/g,'');var out='';for(var i=0;i<v.length;i++){if(i>0&&i%4===0)out+=' ';out+=v[i];}el.value=out.slice(0,19);}
function setCard3(n){traceCard=n.replace(/\D/g,'');traceIdx=-1;traceData=buildLuhn(traceCard);renderPh3();}
function regenCard3(){var el=document.getElementById('cin3');if(el)traceCard=el.value.replace(/\D/g,'');traceData=buildLuhn(traceCard);traceIdx=-1;renderPh3();}
function t3step(dir){traceIdx+=dir;if(traceIdx<-1)traceIdx=-1;if(traceIdx>traceData.length-1)traceIdx=traceData.length-1;renderPh3();}
function toggle3auto(){
  var btn=document.getElementById('b3a');
  if(autoRun){clearInterval(autoTimer);autoRun=false;if(btn){btn.textContent='▶ Auto';btn.className='snbtn play';}return;}
  autoRun=true;if(btn){btn.textContent='⏸ Pause';btn.className='snbtn';}
  autoTimer=setInterval(function(){
    if(traceIdx>=traceData.length-1){clearInterval(autoTimer);autoRun=false;var b=document.getElementById('b3a');if(b){b.textContent='▶ Auto';b.className='snbtn play';}return;}
    traceIdx++;renderPh3();
  },autoSpeed);
}
function toggleSpeed(){
  autoSpeed=autoSpeed===1400?2400:1400;
  var btn=document.getElementById('b3slow');
  if(btn)btn.textContent=autoSpeed===2400?'🐇 Fast':'🐢 Slow';
}

    +'<span style="font-size:12px;color:var(--gold)">👑 = position 0 → check digit, never doubled</span>'
    +'<span style="font-size:12px;color:var(--tx3)">white = position 2,4,6... → plain, add as-is</span>'

  h+='<div class="icard" style="margin-bottom:12px">'
    +'<div class="ictitle">Why every SECOND digit?</div>'

  h+='<div style="overflow-x:auto;width:100%;margin-bottom:14px"><table class="ttbl">'
    +'<tr><th>Digit</th><th>Value</th><th>Position from right</th><th>Is position even (not 0)?</th><th>Treatment</th></tr>';
  digs.forEach(function(d,i){
    var pos=n-1-i;
    var isChk=pos===0, isDbl=(!isChk&&pos%2===1);
    h+='<tr>'
      +'<td style="font-size:14px;font-weight:700">'+d+'</td>'
      +'<td>digit '+d+'</td>'

    +'</div>';

  /* 3D tower with zones */
  h+='<div class="tower-wrap"><div class="tower" id="tower6">'+buildTower(digs,traceIdx,true)+'</div></div>';

  /* op box */
  h+='<div class="op-box" id="ob6">'+opBox(s)+'</div>';

  /* narration */
  h+='<div class="narration" id="narr6"><div class="nr-label">Checksum Bot 🤖</div>';
  if(traceIdx<0){
    h+='I am ready. I can see all '+digs.length+' digits. 🛡 shields mark the Double Zone. 👑 marks the check digit. Press <strong>Next →</strong> or <strong>Auto</strong> to begin.';
  } else if(traceIdx<traceData.length-1){
    var st=traceData[traceIdx];
    h+='<strong>Step '+(traceIdx+1)+' of '+(traceData.length-1)+'</strong> &nbsp;·&nbsp; ';
    if(st.isChk) h+='Position 0 — the <strong style="color:var(--gold)">check digit 👑</strong>. Value = '+st.d+'. Added as-is. Total → <strong style="color:var(--gold)">'+st.total+'</strong>';
    else if(st.dbl&&st.over) h+='Position '+st.pos+' — <strong style="color:var(--purple)">Double Zone 🛡</strong>. '+st.d+' × 2 = '+st.d2+'. Too big! 🔨 Split: '+Math.floor(st.d2/10)+'+'+st.d2%10+'=<strong style="color:var(--amber)">'+st.val+'</strong>. Total → <strong style="color:var(--gold)">'+st.total+'</strong>';
    else if(st.dbl) h+='Position '+st.pos+' — <strong style="color:var(--purple)">Double Zone 🛡</strong>. '+st.d+' × 2 = <strong style="color:var(--purple)">'+st.d2+'</strong>. Fine (≤9). Total → <strong style="color:var(--gold)">'+st.total+'</strong>';
    else h+='Position '+st.pos+' — plain digit. Value = '+st.d+'. Added as-is. Total → <strong style="color:var(--gold)">'+st.total+'</strong>';
  } else {
    var last=traceData[traceData.length-1];
    h+='All '+digs.length+' digits visited. Final total = <strong style="color:var(--gold)">'+last.total+'</strong>. '
      +(last.valid?last.total+' ÷ 10 = '+Math.floor(last.total/10)+' remainder <strong style="color:var(--green)">0</strong>. <strong style="color:var(--green)">VAULT OPENS! ✓</strong>'
      :last.total+' ÷ 10 remainder = <strong style="color:var(--red)">'+last.total%10+'</strong>. <strong style="color:var(--red)">VAULT STAYS LOCKED ✗</strong>');
  }
  h+='</div>';

  /* treasure */
  var upTo=(traceIdx>=0&&traceIdx<traceData.length)?Math.min(traceIdx,traceData.length-2):-1;
  var upToFull=traceIdx>=traceData.length-1;
  var chestTotal=upToFull?traceData[traceData.length-1].total:(upTo>=0?traceData[upTo].total:0);
  h+='<div class="treasure" id="tr6"><div class="tr-icon">'+(chestTotal>0?'💰':'🔒')+'</div>'
    +'<div class="tr-info"><div class="tr-total">'+chestTotal+'</div><div class="tr-label">running total</div></div>'
    +'<div class="tr-coins">';
  var coinUpTo=upToFull?traceData.length-2:upTo;
  for(var ci=0;ci<=coinUpTo&&ci<traceData.length-1;ci++){
    h+='<div class="coin'+(ci===coinUpTo&&coinUpTo>=0?' fresh':'')+'">'+traceData[ci].val+'</div>';
  }
  h+='</div></div>';

  /* result */
  if(traceIdx>=traceData.length-1){
    var last2=traceData[traceData.length-1],v=last2.valid;
    var conf='';
    if(v){var cl2=['#F59E0B','#3B82F6','#10B981','#8B5CF6'];for(var ci2=0;ci2<22;ci2++){var sz=5+Math.random()*4;conf+='<div class="cbit" style="left:'+(Math.random()*100)+'%;width:'+sz+'px;height:'+sz+'px;background:'+cl2[ci2%4]+';animation-duration:'+(0.8+Math.random()*.9)+'s;animation-delay:'+(Math.random()*.5)+'s"></div>';}}
    h+='<div class="result-big '+(v?'rv':'ri')+'">'
      +'<div class="confwrap">'+conf+'</div>'
      +'<div style="font-size:38px;margin-bottom:6px">'+(v?'🎉':'🚫')+'</div>'
      +'<div style="font-size:22px;font-weight:700;color:'+(v?'var(--green)':'var(--red)')+'">'+(v?'VALID CARD':'INVALID CARD')+'</div>'
      +'<div style="font-size:13px;color:var(--tx2);margin-top:6px">Total = '+last2.total+' | '+last2.total+' ÷ 10 = '+Math.floor(last2.total/10)+' remainder <strong style="font-size:16px;color:'+(v?'var(--green)':'var(--red)')+'">'+last2.total%10+'</strong></div>'
      +'<div style="font-size:13px;margin-top:5px;color:'+(v?'var(--green)':'var(--red)')+'">Remainder = 0 → vault opens</div>'
      +'</div>';

    /* thinking pattern */
    h+='<div class="icard" style="width:100%;margin-top:2px">'
      +'<div class="ictitle">The detective\'s thinking pattern — works for any problem</div>'
      +'<div style="display:flex;align-items:flex-start;gap:14px;flex-wrap:wrap;margin-top:8px">'
      +'<div style="display:flex;flex-direction:column;align-items:center;gap:0;min-width:150px">';
    var fsteps=[['var(--blue)','Big problem arrives'],['var(--tx2)','Break into pieces'],['var(--tx2)','Visit ONE piece'],['var(--purple)','Apply the rule'],['var(--tx2)','Remember result'],['var(--amber)','Repeat for every piece'],['var(--green)','Final decision']];
    fsteps.forEach(function(s2,i){
      h+='<div style="background:var(--s2);border:1px solid '+s2[0]+'44;border-radius:7px;padding:5px 12px;font-size:11px;color:'+s2[0]+';width:100%;text-align:center">'+s2[1]+'</div>';
      if(i<fsteps.length-1) h+='<div style="font-size:13px;color:var(--tx3);padding:1px 0;text-align:center">↓</div>';
    });
    h+='</div><div class="ictext" style="flex:1;min-width:200px">This exact thinking pattern — visit one piece, apply a rule, remember, repeat, decide — is the same logic used in DNA analysis, vowel counting, digit reversal, and thousands of real-world programs.<br><br><strong style="color:var(--tx)">Learn one pattern. Apply it everywhere.</strong></div>'
    +'</div></div>';
  }

  h+=navRow(true,'Explore more programs →');
  document.getElementById('ph6').innerHTML=h;
}

function setCard6(n){traceCard=n.replace(/\D/g,'');traceIdx=-1;traceData=buildLuhn(traceCard);renderPh6();}
function regenCard6(){var el=document.getElementById('cin6');if(el)traceCard=el.value.replace(/\D/g,'');traceData=buildLuhn(traceCard);traceIdx=-1;renderPh6();}
function t6step(dir){traceIdx+=dir;if(traceIdx<-1)traceIdx=-1;if(traceIdx>traceData.length-1)traceIdx=traceData.length-1;renderPh6();}
function toggle6auto(){
  var btn=document.getElementById('b6a');
  if(autoRun){clearInterval(autoTimer);autoRun=false;if(btn){btn.textContent='▶ Auto';btn.className='snbtn play';}return;}
  autoRun=true;if(btn){btn.textContent='⏸ Pause';btn.className='snbtn';}
  autoTimer=setInterval(function(){
    if(traceIdx>=traceData.length-1){clearInterval(autoTimer);autoRun=false;var b=document.getElementById('b6a');if(b){b.textContent='▶ Auto';b.className='snbtn play';}return;}
    traceIdx++;renderPh6();
  },autoSpeed);
}
function toggleSpeed6(){
  autoSpeed=autoSpeed===1400?2600:1400;
  var btn=document.getElementById('b6slow');
  if(btn)btn.textContent=autoSpeed===2600?'🐇 Fast':'🐢 Slow';
}

/* ════════════════════════════════════════
   BOOT
════════════════════════════════════════ */
traceData=buildLuhn(traceCard);
buildTabs();
renderPh0();renderPh1();renderPh2();renderPh3();renderPh4();renderPh5();renderPh6();
</script>
