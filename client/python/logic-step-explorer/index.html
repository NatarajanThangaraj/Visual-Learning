<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Logic Step Explorer</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#F0F4F8;--s0:#fff;--s1:#F8FAFC;--s2:#EEF2F7;
  --bd:#E2E8F0;--bd2:#CBD5E1;--tx:#1A202C;--tx2:#4A5568;--tx3:#94A3B8;
  --blue:#4F46E5;--bluebg:#EEF2FF;--bluebd:#C7D2FE;
  --green:#059669;--greenbg:#ECFDF5;--greenbd:#A7F3D0;
  --amber:#D97706;--amberbg:#FFFBEB;--amberbd:#FDE68A;
  --red:#DC2626;--redbg:#FEF2F2;--redbd:#FECACA;
  --purple:#7C3AED;--purplebg:#F5F3FF;--purplebd:#DDD6FE;
  --teal:#0891B2;--tealbg:#ECFEFF;--tealbd:#A5F3FC;
  --pink:#DB2777;--pinkbg:#FDF2F8;--pinkbd:#FBCFE8;
  --orange:#EA580C;--orangebg:#FFF7ED;--orangebd:#FED7AA;
  --mono:'Courier New',monospace;
}
body{font-family:system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--tx);min-height:100vh;font-size:14px}

/* HEADER */
.hdr{background:var(--blue);padding:13px 20px;display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:200}
.hdr-logo{width:38px;height:38px;background:rgba(255,255,255,.18);border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:19px;flex-shrink:0}
.hdr h1{font-size:16px;font-weight:700;color:#fff}
.hdr p{font-size:11px;color:rgba(255,255,255,.7);margin-top:1px}
.hdr-score{margin-left:auto;display:flex;gap:8px}
.hsc{background:rgba(255,255,255,.15);border-radius:8px;padding:4px 13px;text-align:center}
.hsc .sv{font-size:17px;font-weight:700;color:#fff}
.hsc .sl{font-size:9px;color:rgba(255,255,255,.65);text-transform:uppercase;letter-spacing:.04em}

/* PROGRAM SELECTOR */
.prog-bar{background:var(--s0);border-bottom:1px solid var(--bd);padding:0 16px;display:flex;gap:2px;overflow-x:auto}
.ptab{padding:10px 12px;font-size:11px;font-weight:600;color:var(--tx3);cursor:pointer;border-bottom:2px solid transparent;white-space:nowrap;transition:.15s;display:flex;align-items:center;gap:5px}
.ptab:hover{color:var(--tx2)}
.ptab.active{color:var(--blue);border-bottom-color:var(--blue)}
.ptab.done{color:var(--green)}
.ptab .pn{width:16px;height:16px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:8px;font-weight:700;background:var(--s2);color:var(--tx3)}
.ptab.active .pn{background:var(--bluebg);color:var(--blue)}
.ptab.done .pn{background:var(--greenbg);color:var(--green)}

/* PHASE TABS */
.phase-bar{background:var(--s1);border-bottom:1px solid var(--bd);padding:0 16px;display:flex;overflow-x:auto}
.phtab{padding:8px 14px;font-size:11px;font-weight:500;color:var(--tx3);cursor:pointer;border-bottom:2px solid transparent;white-space:nowrap;transition:.15s;display:flex;align-items:center;gap:5px}
.phtab:hover{color:var(--tx2)}
.phtab.active{color:var(--blue);border-bottom-color:var(--blue)}
.phtab.ph-done{color:var(--green)}
.phtab .phnum{font-size:10px;background:var(--s2);border-radius:50%;width:16px;height:16px;display:flex;align-items:center;justify-content:center;font-weight:700;color:var(--tx3)}
.phtab.active .phnum{background:var(--bluebg);color:var(--blue)}
.phtab.ph-done .phnum{background:var(--greenbg);color:var(--green)}

/* MAIN CONTENT */
.main{max-width:1060px;margin:0 auto;padding:16px}
.phase-panel{display:none}
.phase-panel.active{display:block}

/* PROGRESS BAR */
.prog-bar-wrap{height:4px;background:var(--bd);border-radius:2px;overflow:hidden;margin-bottom:14px}
.prog-bar-fill{height:100%;background:var(--blue);border-radius:2px;transition:.4s}

/* GENERIC CARDS */
.card{background:var(--s0);border:1px solid var(--bd);border-radius:11px;padding:15px 17px;margin-bottom:12px}
.card-title{font-size:13px;font-weight:700;color:var(--tx);margin-bottom:9px;display:flex;align-items:center;gap:8px}
.card-text{font-size:12.5px;color:var(--tx2);line-height:1.75}
.card-text p{margin-bottom:7px}
.card-text p:last-child{margin-bottom:0}
.slbl{font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--tx3);margin-bottom:8px;display:flex;align-items:center;gap:7px}
.slbl::after{content:'';flex:1;height:1px;background:var(--bd)}

/* QUESTION BOX */
.qbox{background:linear-gradient(135deg,var(--bluebg),var(--purplebg));border:2px solid;border-radius:13px;padding:18px 20px;margin-bottom:14px;text-align:center}
.qb-tag{font-size:10px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;margin-bottom:7px}
.qb-title{font-size:20px;font-weight:700;margin-bottom:8px}
.qb-desc{font-size:13px;color:var(--tx2);line-height:1.7;max-width:560px;margin:0 auto}

/* WHY BOX */
.why-box{border-radius:10px;border:1px solid;padding:13px 15px;margin-bottom:12px;display:flex;gap:11px;align-items:flex-start}
.why-icon{font-size:20px;flex-shrink:0;margin-top:2px}
.why-title{font-size:13px;font-weight:700;margin-bottom:4px}
.why-text{font-size:12px;line-height:1.7}

/* CODE BLOCKS */
.code-box{background:#0f172a;border-radius:9px;padding:12px 14px;font-family:var(--mono);font-size:12px;line-height:1.9;color:#e2e8f0;margin-bottom:10px;overflow-x:auto}
.kw{color:#93c5fd}.nm{color:#fde68a}.cm{color:#475569}.ok{color:#86efac}.str{color:#fca5a5}.op{color:#f9a8d4}

/* MANUAL TABLE */
.mtbl{width:100%;border-collapse:collapse;font-size:12px;overflow-x:auto;display:block}
.mtbl th{background:var(--s2);padding:7px 10px;border:1px solid var(--bd);font-size:10px;text-transform:uppercase;letter-spacing:.06em;color:var(--tx2);font-weight:700;text-align:left}
.mtbl td{padding:7px 10px;border:1px solid var(--bd);font-family:var(--mono);color:var(--tx);vertical-align:middle}
.mtbl tr.highlight-row td{background:var(--amberbg);border-color:var(--amberbd)}

/* STEPS GRID */
.sg{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:9px;margin-bottom:12px}
.sc{border-radius:9px;border:1px solid var(--bd);padding:11px 13px;background:var(--s0)}
.sc-num{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;margin-bottom:5px}
.sc-title{font-size:12px;font-weight:600;color:var(--tx);margin-bottom:3px}
.sc-text{font-size:11px;color:var(--tx2);line-height:1.6}
.sc-code{font-family:var(--mono);font-size:10px;background:var(--s2);border-radius:4px;padding:3px 6px;margin-top:5px;display:inline-block;color:var(--blue)}

/* TRACE TABLE */
.trace-wrap{overflow-x:auto;margin-bottom:12px}
table.trace{width:100%;border-collapse:collapse;font-size:12px}
table.trace th{background:var(--s2);color:var(--tx2);padding:7px 10px;border:1px solid var(--bd);font-size:10px;text-transform:uppercase;letter-spacing:.05em;font-weight:700;text-align:left}
table.trace td{padding:7px 10px;border:1px solid var(--bd);font-family:var(--mono);color:var(--tx);vertical-align:middle}
table.trace tr.tr-active td{background:var(--amberbg);border-color:var(--amberbd)}
table.trace tr.tr-done td{background:var(--greenbg);border-color:var(--greenbd);color:var(--green)}
table.trace tr.tr-final td{background:var(--bluebg);border-color:var(--bluebd);color:var(--blue);font-weight:700}
.badge{font-size:10px;padding:2px 7px;border-radius:7px;font-weight:600;white-space:nowrap;font-family:sans-serif}
.bmod{background:var(--amberbg);color:var(--amber)}
.bfloor{background:var(--bluebg);color:var(--blue)}
.bcmp{background:var(--purplebg);color:var(--purple)}
.bok{background:var(--greenbg);color:var(--green)}

/* SIMULATION PANEL */
.sim-layout{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.panel{background:var(--s0);border:1px solid var(--bd);border-radius:11px;overflow:hidden}
.panel-head{padding:9px 13px;border-bottom:1px solid var(--bd);background:var(--s1);font-size:11px;font-weight:700;color:var(--tx);display:flex;align-items:center;gap:7px}
.panel-body{padding:12px 13px}

/* DIGIT BOXES */
.drow{display:flex;align-items:center;gap:5px;flex-wrap:wrap}
.dbox{width:38px;height:44px;border-radius:7px;border:1.5px solid var(--bd2);background:var(--s1);display:flex;flex-direction:column;align-items:center;justify-content:center;transition:.3s;font-family:var(--mono)}
.dbox .dv{font-size:15px;font-weight:700;color:var(--tx2);line-height:1}
.dbox .dl{font-size:9px;color:var(--tx3);margin-top:2px}
.dbox.d-active{background:var(--amberbg);border-color:var(--amber);box-shadow:0 0 0 2px var(--amberbd)}
.dbox.d-active .dv{color:var(--amber)}
.dbox.d-active .dl{color:var(--amber)}
.dbox.d-used{background:var(--greenbg);border-color:var(--green)}
.dbox.d-used .dv{color:var(--green)}
.dbox.d-result{background:var(--bluebg);border-color:var(--blue)}
.dbox.d-result .dv{color:var(--blue)}
.dbox.d-dim{opacity:.3}
.sarrow{color:var(--tx3);font-size:16px;font-weight:700;padding:0 2px}

/* STEP NAV */
.step-nav{display:flex;align-items:center;gap:8px;margin-bottom:12px;flex-wrap:wrap}
.snbtn{padding:7px 15px;border-radius:7px;font-size:12px;font-weight:600;cursor:pointer;border:1px solid;transition:.15s}
.snbtn.primary{background:var(--blue);color:#fff;border-color:var(--blue)}
.snbtn.primary:hover{background:#4338ca}
.snbtn.secondary{background:var(--s0);color:var(--tx2);border-color:var(--bd2)}
.snbtn.secondary:hover{background:var(--s1)}
.snbtn:disabled{opacity:.3;cursor:default}
.step-dots{display:flex;gap:4px;margin:0 6px}
.sdot{width:7px;height:7px;border-radius:50%;background:var(--bd2);transition:.2s}
.sdot.active{background:var(--blue)}
.sdot.done{background:var(--green)}
.step-lbl{font-size:12px;color:var(--tx2);flex:1;text-align:center}

/* CHECK STRIP */
.check-strip{background:var(--s2);border:1px solid var(--bd);border-radius:8px;padding:10px 12px;margin-top:8px}
.chrow{display:flex;align-items:center;gap:8px;margin-bottom:5px;font-size:12px}
.chrow:last-child{margin-bottom:0}
.chlbl{flex:1;font-family:var(--mono);color:var(--tx2)}
.chval{min-width:50px;font-weight:700;font-family:var(--mono);font-size:13px}
.chbadge{font-size:10px;padding:2px 7px;border-radius:6px;font-weight:600;font-family:sans-serif}
.cbmod{background:var(--amberbg);color:var(--amber)}
.cbfloor{background:var(--bluebg);color:var(--blue)}
.cbcmp{background:var(--purplebg);color:var(--purple)}
.cbres{background:var(--greenbg);color:var(--green)}
.cbwait{background:var(--s2);color:var(--tx3)}

/* OPERATION DISPLAY */
.op-display{background:var(--s0);border:1px solid var(--bd);border-radius:8px;padding:8px 12px;margin-bottom:8px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.op-pill{font-size:11px;font-weight:600;padding:3px 10px;border-radius:20px;font-family:var(--mono)}

/* VAR STATE */
.var-state{background:#0f172a;border-radius:7px;padding:8px 11px;font-family:var(--mono);font-size:11px;color:#94a3b8;margin-top:8px}
.var-state span{color:#4ade80}

/* RESULT DISPLAY */
.result-big{font-family:var(--mono);font-size:28px;font-weight:700;text-align:center;padding:10px;border-radius:8px;margin:8px 0}

/* OUTPUT */
.out-panel{background:#0f172a;border-radius:8px;padding:10px 13px;font-family:var(--mono);font-size:12px;min-height:50px;margin-top:8px}
.ol{color:#4ade80;display:block;line-height:1.8}
.oe{color:#f87171;display:block}

/* SCAFFOLD */
.bstep{background:var(--s0);border:1px solid var(--bd);border-radius:8px;padding:9px 12px;margin-bottom:5px;cursor:pointer;transition:.15s;display:flex;gap:9px;align-items:flex-start}
.bstep:hover{border-color:var(--blue);background:var(--bluebg)}
.bstep.added{border-color:var(--green);background:var(--greenbg)}
.bsn{width:20px;height:20px;border-radius:50%;background:var(--bluebg);color:var(--blue);display:flex;align-items:center;justify-content:center;font-size:9px;font-weight:700;flex-shrink:0;margin-top:1px}
.bstep.added .bsn{background:var(--greenbg);color:var(--green)}
.bst{font-size:12px;font-weight:600;color:var(--tx);margin-bottom:2px}
.bsw{font-size:11px;color:var(--tx2);line-height:1.5}
.bsc{font-family:var(--mono);font-size:10px;color:var(--blue);background:var(--s2);padding:2px 6px;border-radius:4px;margin-top:4px;display:inline-block}
.bstep.added .bsc{color:var(--green)}

/* QUIZ */
.quiz-q{font-size:13px;font-weight:600;color:var(--tx);margin-bottom:11px;line-height:1.65}
.quiz-opts{display:flex;flex-direction:column;gap:5px}
.qopt{background:var(--s1);border:1px solid var(--bd);border-radius:8px;padding:9px 13px;font-size:12.5px;cursor:pointer;transition:.15s;color:var(--tx2)}
.qopt:hover{border-color:var(--blue);background:var(--bluebg)}
.qopt.correct{background:var(--greenbg);border-color:var(--green);color:var(--green);font-weight:600}
.qopt.wrong{background:var(--redbg);border-color:var(--redbd);color:var(--red)}
.qexp{font-size:12px;color:var(--tx2);background:var(--s2);border-radius:7px;padding:9px 12px;line-height:1.65;display:none;margin-top:8px}

/* NAV BUTTONS */
.nav-row{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap;align-items:center}
.nbtn{padding:8px 16px;border-radius:8px;font-size:13px;font-weight:600;cursor:pointer;border:1px solid;transition:.15s}
.nbtn.primary{background:var(--blue);color:#fff;border-color:var(--blue)}
.nbtn.primary:hover{background:#4338ca}
.nbtn.secondary{background:var(--s0);color:var(--tx2);border-color:var(--bd2)}
.nbtn.secondary:hover{background:var(--s1)}
.nbtn.ghost{background:transparent;color:var(--blue);border-color:var(--bluebd)}
.nbtn:disabled{opacity:.3;cursor:default}

/* USE CASE */
.ucbox{background:var(--greenbg);border:1px solid var(--greenbd);border-radius:9px;padding:11px 13px;margin-bottom:12px}
.uc-title{font-size:10px;font-weight:700;color:var(--green);text-transform:uppercase;letter-spacing:.06em;margin-bottom:7px}
.uc-item{display:flex;gap:7px;align-items:flex-start;font-size:12px;color:#065f46;margin-bottom:4px;line-height:1.5}
.uc-item:last-child{margin-bottom:0}

/* TOAST */
.toast{position:fixed;bottom:18px;right:18px;background:#1e293b;color:#f1f5f9;padding:9px 16px;border-radius:9px;font-size:13px;font-weight:600;z-index:9999;display:none;align-items:center;gap:8px;border:1px solid #334155}
.toast.show{display:flex}

/* 2-col layout */
.two-col{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:700px){.two-col,.sim-layout{grid-template-columns:1fr}}
</style>
</head>
<body>

<div class="hdr">
  <div class="hdr-logo">🔢</div>
  <div>
    <h1>Logic Step Explorer</h1>
    <p>Question → Steps → Why loop? → Watch → Build → Quiz</p>
  </div>
  <div class="hdr-score">
    <div class="hsc"><div class="sv" id="hsc">0</div><div class="sl">Score</div></div>
    <div class="hsc"><div class="sv" id="hsv">0</div><div class="sl">Done</div></div>
  </div>
</div>

<div class="prog-bar" id="prog-bar"></div>
<div class="phase-bar" id="phase-bar"></div>

<div class="main">
  <div class="prog-bar-wrap"><div class="prog-bar-fill" id="progress-fill" style="width:0%"></div></div>
  <div id="content-area"></div>
</div>

<div class="toast" id="toast"></div>

<script>
/* ══════════════════════════════════════════════════
   PROGRAM DATA BANK
══════════════════════════════════════════════════ */
const PROGS = [

/* ─── 1. REVERSE ─── */
{id:'reverse',icon:'🔄',title:'Reverse a Number',color:'#4F46E5',bg:'#EEF2FF',bd:'#C7D2FE',
desc:'Peel the last digit using % 10, place it into the reversed number by multiplying by 10, then shrink the original using // 10. Repeat until nothing is left.',
ops:['% 10 → last digit','rev × 10 + digit → build','// 10 → shrink','while n > 0'],
uses:[{i:'💳',t:'Credit card Luhn checksum — digits processed one by one'},{i:'🔢',t:'Palindrome check — compare reversed with original'},{i:'🏦',t:'Bank routing number validation'},{i:'📱',t:'Mobile number pattern apps'}],
manualRows:[
  {n:1234,step:'Start',digit:4,rev:4,newN:123,note:'1234 % 10 = 4 → reversed = 0×10+4 = 4'},
  {n:123,step:'Round 2',digit:3,rev:43,newN:12,note:'123 % 10 = 3 → reversed = 4×10+3 = 43'},
  {n:12,step:'Round 3',digit:2,rev:432,newN:1,note:'12 % 10 = 2 → reversed = 43×10+2 = 432'},
  {n:1,step:'Round 4',digit:1,rev:4321,newN:0,note:'1 % 10 = 1 → reversed = 432×10+1 = 4321'},
],
whyLoop:'For a 4-digit number we repeat the same two operations (% 10 and // 10) exactly 4 times. For a 6-digit number we do it 6 times. We do not know the digit count in advance — the while loop handles it automatically and stops when the number reaches 0.',
concept:[
  {icon:'%10',ibg:'#fef3c7',t:'% 10 always extracts the rightmost (last) digit',
   code:'1234 % 10  →  4   # last digit\n 234 % 10  →  4\n  34 % 10  →  4\n   4 % 10  →  4'},
  {icon:'×10+',ibg:'#eff6ff',t:'Build reversed: shift left (×10) then add digit',
   code:'rev = 0×10 + 4  =    4\nrev = 4×10 + 3  =   43\nrev = 43×10 + 2 =  432\nrev = 432×10+1  = 4321'},
],
scaffold:[
  {t:'Store number and reversed = 0',w:'Two variables needed before the loop.',c:'num = 1234\nreversed = 0',ins:'num = 1234\nreversed = 0\n'},
  {t:'while loop condition',w:'Loop while digits remain.',c:'while num > 0:',ins:'while num > 0:\n'},
  {t:'Extract last digit with % 10',w:'digit = num % 10 peels the rightmost digit.',c:'    digit = num % 10',ins:'    digit = num % 10\n'},
  {t:'Build reversed: × 10 + digit',w:'Shift reversed left, add new digit.',c:'    reversed = reversed * 10 + digit',ins:'    reversed = reversed * 10 + digit\n'},
  {t:'Remove last digit: // 10',w:'Floor divide shrinks the number.',c:'    num = num // 10',ins:'    num = num // 10\n'},
  {t:'Print result',w:'Outside the loop — runs once after all digits done.',c:'print("Reversed:", reversed)',ins:'print("Reversed:", reversed)\n'},
],
quizzes:[
  {q:'What does 5678 % 10 equal?',opts:['567','8','5','56'],correct:1,exp:'5678 ÷ 10 = 567 remainder 8. The % operator gives the remainder, which is always the last digit.'},
  {q:'After one round on num=1234, what is num?',opts:['1234','123','4','12'],correct:1,exp:'num = num // 10 = 1234 // 10 = 123. Floor division removes the last digit.'},
  {q:'If reversed=43 and digit=2, what is reversed*10+digit?',opts:['432','45','234','4302'],correct:0,exp:'43×10 = 430. 430+2 = 432. This is how we build the reversed number one digit at a time.'},
  {q:'Why does reversed start at 0 not 1?',opts:['Tradition','0×10+digit = digit — a neutral starting point','Makes loop run once extra','Python requires it'],correct:1,exp:'0×10 = 0. So 0×10+4 = 4. Starting at 0 means the first digit sets the value correctly without distorting it.'},
],
genSteps(n){
  let num=Math.abs(n),rev=0;const steps=[],orig=num;
  while(num>0){const d=num%10,nr=rev*10+d,nn=Math.floor(num/10);steps.push({num,d,rev,nr,nn});rev=nr;num=nn;}
  steps.push({final:true,rev,orig});return steps;
},
renderTrace(steps,ai){
  let h=`<table class="trace"><tr><th>Step</th><th>num</th><th>digit (num%10)</th><th>rev×10+digit</th><th>num//10</th><th>reversed</th></tr>`;
  steps.forEach((s,i)=>{
    if(s.final){h+=`<tr class="tr-final"><td colspan="6" style="text-align:center">✓ num=0 → loop ends · <b>Reversed = ${s.rev}</b></td></tr>`;return;}
    const cl=i===ai?'tr-active':i<ai?'tr-done':'';
    h+=`<tr class="${cl}"><td>${i+1}</td><td style="font-size:14px;font-weight:700">${s.num}</td><td><span class="badge bmod">${s.num}%10=${s.d}</span></td><td><span class="badge bfloor">${s.rev}×10+${s.d}=${s.nr}</span></td><td><span class="badge bfloor">${s.num}//10=${s.nn}</span></td><td style="font-weight:700;color:var(--blue)">${s.nr}</td></tr>`;
  });return h+'</table>';
},
renderVisual(steps,ai){
  const s=steps[Math.min(ai,steps.length-2)];if(!s)return'';
  const digits=String(steps[0].num).split(''),used=ai;
  let h='<div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:8px">';
  h+='<div><div style="font-size:10px;color:var(--tx3);margin-bottom:4px">Number digits</div><div class="drow">';
  digits.forEach((d,i)=>h+=`<div class="dbox ${i>=digits.length-used&&used>0?'d-used':''}"><div class="dv">${d}</div><div class="dl">${i>=digits.length-used&&used>0?'done':'·'}</div></div>`);
  h+='</div></div><span class="sarrow">→</span>';

  </div>`;
  h+=`<div class="slbl">See the full structure</div>
  <div class="code-box"><span class="cm"># The general pattern for ALL digit logic programs:</span>
<span class="cm"># ── before loop ──────────────────────────────</span>
num = <span class="nm">${n0}</span>
result = <span class="nm">0</span>  <span class="cm"># or -1, 10, False — depends on program</span>
<span class="cm"># ── loop ─────────────────────────────────────</span>
<span class="kw">while</span> num > <span class="nm">0</span>:
    digit = num % <span class="nm">10</span>      <span class="cm"># extract last digit</span>
    <span class="cm"># ... do something with digit ...</span>
    num = num // <span class="nm">10</span>     <span class="cm"># remove last digit</span>
<span class="cm"># ── after loop ───────────────────────────────</span>
<span class="ok">print</span>(result)           <span class="cm"># num is now 0, result is ready</span></div>`;
  h+=navRow(true,true,'Next: Watch it run →');
  document.getElementById('content-area').innerHTML=h;
}

/* ══════════════════════════════════════════════
   PHASE 3 — WATCH IT RUN
══════════════════════════════════════════════ */
function initSteps(){
  const pg=p();
  const n=pg.manualRows[0].n;
  const t=(pg.id==='check_digit'||pg.id==='frequency')?9:undefined;
  stepsData=t!==undefined?pg.genSteps(n,t):pg.genSteps(n);
  simInput={n,t};
}
function renderWatchRun(){
  if(!stepsData)initSteps();
  const pg=p();const total=stepsData.length-1;
  let h=`<div class="slbl">Input</div>
  <div style="display:flex;align-items:center;gap:10px;margin-bottom:12px;flex-wrap:wrap">
    <label style="font-size:12px;color:var(--tx2)">num =</label>
    <input type="number" id="sim-num" value="${simInput.n}" min="1" max="999999" style="width:120px;font-family:var(--mono);background:var(--s0);border:1px solid var(--bd2);border-radius:7px;padding:6px 10px;font-size:14px;color:var(--tx)">
    ${pg.id==='check_digit'||pg.id==='frequency'?`<label style="font-size:12px;color:var(--tx2)">target =</label><input type="number" id="sim-target" value="9" min="0" max="9" style="width:70px;font-family:var(--mono);background:var(--s0);border:1px solid var(--bd2);border-radius:7px;padding:6px 10px;font-size:14px;color:var(--tx)">`:``}
    <button class="nbtn primary" onclick="regenSteps()">▶ Generate trace</button>
  </div>`;

  h+=`<div class="step-nav">
    <button class="snbtn secondary" id="sbn-prev" onclick="prevStep()" ${stepIdx===0?'disabled':''}>← Prev</button>
    <div class="step-dots" id="step-dots">${Array.from({length:Math.min(total+1,14)},(_,i)=>`<div class="sdot ${i===stepIdx?'active':i<stepIdx?'done':''}"></div>`).join('')}</div>
    <div class="step-lbl" id="step-lbl">Step ${stepIdx+1} of ${total+1}</div>
    <button class="snbtn primary" id="sbn-next" onclick="nextStep()" ${stepIdx>=total?'disabled':''}>Next step →</button>
    <button class="snbtn secondary" onclick="autoPlay()" id="auto-btn">▶ Auto</button>
    <button class="snbtn secondary" onclick="resetSteps()">Reset</button>
  </div>`;

  h+=`<div class="slbl">Visual — what is happening</div>
  <div class="card" id="vis-area">${pg.renderVisual(stepsData,stepIdx)}</div>`;

  h+=`<div class="slbl">Trace table — every step</div>
  <div class="trace-wrap" id="trace-area">${pg.renderTrace(stepsData,stepIdx)}</div>`;

  h+=`<div class="slbl">Output</div>
  <div class="out-panel" id="out-area">
    ${stepIdx>=total?pg.sim(simInput.n,simInput.t).map(l=>`<span class="ol">${esc(l)}</span>`).join(''):`<span style="color:#475569;font-size:11px">Complete all steps to see output</span>`}
  </div>`;

  h+=navRow(true,true,'Next: Build the code →');
  document.getElementById('content-area').innerHTML=h;
}
function regenSteps(){
  const pg=p();
  const n=parseInt(document.getElementById('sim-num').value)||pg.manualRows[0].n;
  const tel=document.getElementById('sim-target');
  const t=tel?parseInt(tel.value)||9:undefined;
  stepsData=t!==undefined?pg.genSteps(n,t):pg.genSteps(n);
  simInput={n,t};stepIdx=0;renderWatchRun();
}
function prevStep(){if(stepIdx>0){stepIdx--;updateStepView();}}
function nextStep(){if(stepsData&&stepIdx<stepsData.length-1){stepIdx++;updateStepView();}}
function resetSteps(){stepIdx=0;updateStepView();}
function autoPlay(){
  if(simRunning){stopSim();return;}
  simRunning=true;
  document.getElementById('auto-btn').textContent='⏸ Stop';
  simTimer=setInterval(()=>{
    if(stepIdx>=stepsData.length-1){stopSim();return;}
    stepIdx++;updateStepView();
  },900);
}
function stopSim(){clearInterval(simTimer);simRunning=false;const b=document.getElementById('auto-btn');if(b)b.textContent='▶ Auto';}
function updateStepView(){
  const pg=p(),total=stepsData.length-1;
  const va=document.getElementById('vis-area');if(va)va.innerHTML=pg.renderVisual(stepsData,stepIdx);
  const ta=document.getElementById('trace-area');if(ta)ta.innerHTML=pg.renderTrace(stepsData,stepIdx);
  const oa=document.getElementById('out-area');
  if(oa)oa.innerHTML=stepIdx>=total?pg.sim(simInput.n,simInput.t).map(l=>`<span class="ol">${esc(l)}</span>`).join(''):'<span style="color:#475569;font-size:11px">Complete all steps to see output</span>';
  const prev=document.getElementById('sbn-prev');if(prev)prev.disabled=stepIdx===0;
  const next=document.getElementById('sbn-next');if(next)next.disabled=stepIdx>=total;
  const lbl=document.getElementById('step-lbl');if(lbl)lbl.textContent=`Step ${stepIdx+1} of ${total+1}`;
  const dots=document.getElementById('step-dots');
  if(dots)dots.innerHTML=Array.from({length:Math.min(total+1,14)},(_,i)=>`<div class="sdot ${i===stepIdx?'active':i<stepIdx?'done':''}"></div>`).join('');
  const ar=document.querySelector('tr.tr-active');if(ar)ar.scrollIntoView({block:'nearest',behavior:'smooth'});
}

/* ══════════════════════════════════════════════
   PHASE 4 — BUILD CODE
══════════════════════════════════════════════ */
function renderBuildCode(){
  const pg=p();
  let h=`<div class="two-col">
  <div>
    <div class="slbl">Click each step to add it to your code</div>
    <div id="build-list">
      ${pg.scaffold.map((s,i)=>`<div class="bstep${buildAdded[i]?' added':''}" id="bs${i}" onclick="addStep(${i})">
        <div class="bsn">${i+1}</div>
        <div><div class="bst">${s.t}</div>${s.w?`<div class="bsw">${s.w}</div>`:''}<div class="bsc">${s.c.replace(/\n/g,' | ')}</div></div>
      </div>`).join('')}
    </div>
    <div style="display:flex;gap:7px;margin-top:10px;flex-wrap:wrap">
      <button class="nbtn secondary" onclick="clearCode()">Clear</button>
      <button class="nbtn ghost" onclick="fillAll()">Fill all</button>
      <button class="nbtn primary" onclick="runCode()">▶ Run</button>
    </div>
  </div>
  <div>
    <div class="slbl">Your code</div>
    <div class="code-box" id="code-display" style="min-height:200px">${renderCodeDisplay()}</div>
    <div class="slbl" style="margin-top:8px">Output</div>
    <div class="out-panel" id="build-out"><span style="color:#475569;font-size:11px">Click ▶ Run to see output</span></div>
  </div>
  </div>`;
  h+=navRow(true,true,'Next: Test yourself →');
  document.getElementById('content-area').innerHTML=h;
}
function renderCodeDisplay(){
  if(!codeLines.length)return'<span style="color:#475569"># Click steps on the left to build your code</span>';
  return codeLines.map(l=>{
    const e=l.replace(/</g,'&lt;').replace(/>/g,'&gt;');
    const col=l.includes('while')||l.includes('if ')||l.includes('elif')||l.includes('else')?'#93c5fd':l.includes('print')?'#4ade80':l.includes('= 0')||l.includes('= -1')||l.includes('= 10')||l.includes('= False')?'#fde68a':'#e2e8f0';
    return`<span style="color:${col}">${e}</span>`;
  }).join('<br>');
}
function addStep(i){
  if(buildAdded[i])return;
  buildAdded[i]=true;
  codeLines.push(p().scaffold[i].ins.trimEnd());
  document.getElementById(`bs${i}`).classList.add('added');
  document.getElementById('code-display').innerHTML=renderCodeDisplay();
  toast('Added: '+p().scaffold[i].t);
}
function clearCode(){
  codeLines=[];buildAdded=[];
  p().scaffold.forEach((_,i)=>{const el=document.getElementById('bs'+i);if(el)el.classList.remove('added');});
  const cd=document.getElementById('code-display');if(cd)cd.innerHTML='<span style="color:#475569"># Click steps on the left</span>';
  const bo=document.getElementById('build-out');if(bo)bo.innerHTML='<span style="color:#475569;font-size:11px">Click ▶ Run to see output</span>';
}
function fillAll(){p().scaffold.forEach((_,i)=>{if(!buildAdded[i])addStep(i);});}
function runCode(){
  const pg=p();
  const n=pg.manualRows[0].n,t=(pg.id==='check_digit'||pg.id==='frequency')?9:undefined;
  const out=pg.sim(n,t);
  const bo=document.getElementById('build-out');
  if(bo)bo.innerHTML=out.map(l=>`<span class="ol">${esc(l)}</span>`).join('');
  if(!solved[pg.id]){solved[pg.id]=true;scores[pg.id]=15;updHdr();toast('🎉 +15 points!');buildProgBar();}
  document.getElementById('progress-fill').style.width=Math.round(Object.keys(solved).length/PROGS.length*100)+'%';
}

/* ══════════════════════════════════════════════
   PHASE 5 — QUIZ
══════════════════════════════════════════════ */
function renderQuiz(){
  const pg=p(),q=pg.quizzes[quizIdx];
  const pct=Math.round(quizIdx/pg.quizzes.length*100);
  let h=`<div class="card" style="max-width:620px;margin:0 auto">
    <div style="font-size:11px;color:var(--tx3);margin-bottom:6px">Question ${quizIdx+1} of ${pg.quizzes.length} — ${pg.title}</div>
    <div style="height:4px;background:var(--bd);border-radius:2px;overflow:hidden;margin-bottom:14px"><div style="width:${pct}%;height:100%;background:${pg.color};transition:.3s"></div></div>
    <div class="quiz-q">${q.q}</div>
    <div class="quiz-opts">${q.opts.map((opt,oi)=>`<div class="qopt" id="qo${oi}" onclick="ansQ(${oi})">${opt}</div>`).join('')}</div>
    <div class="qexp" id="qexp">${q.exp}</div>
    <div style="display:flex;justify-content:flex-end;margin-top:10px">
      <button class="nbtn primary" id="qnext" onclick="nextQ()" style="display:none">${quizIdx<pg.quizzes.length-1?'Next question →':'See results'}</button>
    </div>
  </div>`;
  if(quizAnswered[quizIdx]!==undefined)h='';/* will restore below */
  document.getElementById('content-area').innerHTML=h;
  if(quizAnswered[quizIdx]!==undefined){renderQuizRestore();}
}
function ansQ(oi){
  if(quizAnswered[quizIdx]!==undefined)return;
  quizAnswered[quizIdx]=oi;
  const q=p().quizzes[quizIdx];
  document.querySelectorAll('.qopt').forEach((el,idx)=>{
    if(idx===q.correct)el.classList.add('correct');
    else if(idx===oi&&oi!==q.correct)el.classList.add('wrong');
  });
  document.getElementById('qexp').style.display='block';
  document.getElementById('qnext').style.display='inline-flex';
  if(oi===q.correct){scores[p().id]=(scores[p().id]||0)+5;updHdr();toast('✓ Correct! +5 points');}
  else toast('✗ Not quite — read the explanation');
}
function nextQ(){
  quizIdx++;
  const pg=p();
  if(quizIdx>=pg.quizzes.length){showQuizResults();return;}
  renderQuiz();
}
function renderQuizRestore(){
  const pg=p(),q=pg.quizzes[quizIdx];
  let h=`<div class="card" style="max-width:620px;margin:0 auto">
    <div class="quiz-q">${q.q}</div>
    <div class="quiz-opts">${q.opts.map((opt,oi)=>`<div class="qopt${oi===q.correct?' correct':oi===quizAnswered[quizIdx]&&quizAnswered[quizIdx]!==q.correct?' wrong':''}" onclick="ansQ(${oi})">${opt}</div>`).join('')}</div>
    <div class="qexp" style="display:block">${q.exp}</div>
    <div style="display:flex;justify-content:flex-end;margin-top:10px"><button class="nbtn primary" onclick="nextQ()">${quizIdx<pg.quizzes.length-1?'Next question →':'See results'}</button></div>
  </div>`;
  document.getElementById('content-area').innerHTML=h;
}
function showQuizResults(){
  const pg=p(),correct=quizAnswered.filter((a,i)=>a===pg.quizzes[i].correct).length;
  const total=pg.quizzes.length;
  document.getElementById('content-area').innerHTML=`
    <div class="card" style="max-width:500px;margin:0 auto;text-align:center;padding:28px">
      <div style="font-size:44px;margin-bottom:10px">${correct===total?'🏆':correct>=Math.ceil(total/2)?'🎉':'📚'}</div>
      <div style="font-size:22px;font-weight:700">${correct} / ${total} correct</div>
      <div style="font-size:13px;color:var(--tx2);margin-top:8px;line-height:1.7">${correct===total?'Perfect! You fully understand '+pg.title+'.':correct>=Math.ceil(total/2)?'Good work! Review the ones you missed.':'Go back and step through the trace again — then retry.'}</div>
      <div style="display:flex;gap:8px;justify-content:center;margin-top:18px;flex-wrap:wrap">
        <button class="nbtn secondary" onclick="quizIdx=0;quizAnswered=[];renderQuiz()">Retry quiz</button>
        <button class="nbtn primary" onclick="nextPhase()">✓ Continue</button>
        ${curProg<PROGS.length-1?`<button class="nbtn ghost" onclick="switchProg(${curProg+1})">Next program →</button>`:''}
      </div>
    </div>`;
}

/* ══════════════════════════════════════════════
   NAV ROW HELPER
══════════════════════════════════════════════ */
function navRow(showBack,showNext,nextLabel){
  let h='<div class="nav-row">';
  if(showBack)h+=`<button class="nbtn secondary" onclick="prevPhase()">← Back</button>`;
  if(showNext)h+=`<button class="nbtn primary" onclick="nextPhase()">${nextLabel}</button>`;
  h+='</div>';return h;
}

/* ══════════════════════════════════════════════
   UTILS
══════════════════════════════════════════════ */
function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
function toast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2300)}

/* ── INIT ── */
buildProgBar();buildPhaseBar();renderPhase();
</script>
</body>
</html>
