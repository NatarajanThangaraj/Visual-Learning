<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🐍 PyStory — Learn Python Through Stories</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/theme/dracula.min.css">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden}
body{font-family:'Segoe UI',system-ui,-apple-system,sans-serif;background:#0d0d1a;color:#e0e0e0;font-size:14px}

/* LOADING */
#loading{position:fixed;inset:0;z-index:9999;background:linear-gradient(135deg,#1a1a2e 0%,#16213e 50%,#0f3460 100%);display:flex;align-items:center;justify-content:center;flex-direction:column;gap:18px}
.ld-snake{font-size:72px;animation:bounce 1.2s ease-in-out infinite alternate}
@keyframes bounce{from{transform:translateY(-12px) rotate(-5deg)}to{transform:translateY(12px) rotate(5deg)}}
.ld-title{font-size:2.2rem;font-weight:800;background:linear-gradient(90deg,#7c6fff,#ff6b9d);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.ld-sub{color:#8899bb;font-size:.92rem}
.ld-bar{width:280px;height:6px;background:rgba(255,255,255,.1);border-radius:3px;overflow:hidden}
.ld-fill{height:100%;width:0%;background:linear-gradient(90deg,#7c6fff,#ff6b9d);border-radius:3px;transition:width .4s ease}
.ld-fact{color:#6677aa;font-size:.8rem;text-align:center;max-width:320px;min-height:36px;line-height:1.5}

/* APP SHELL — header | desc-strip | main */
#app{height:100vh;display:grid;grid-template-rows:50px auto 1fr;display:none;overflow:hidden}
#app.visible{display:grid}

/* HEADER */
header{background:#12122a;border-bottom:1px solid #2a2a4a;display:flex;align-items:center;padding:0 14px;gap:12px;overflow:hidden}
.logo{font-size:1rem;font-weight:800;color:#fff;white-space:nowrap;display:flex;align-items:center;gap:6px;letter-spacing:-.3px}
.logo em{color:#7c6fff;font-style:normal}
.proj-tabs{flex:1;display:flex;gap:3px;overflow-x:auto;scrollbar-width:none;padding:4px 0}
.proj-tabs::-webkit-scrollbar{display:none}
.tab{padding:5px 11px;border-radius:16px;border:1px solid #2a2a4a;background:transparent;color:#778;font-size:.72rem;cursor:pointer;white-space:nowrap;transition:all .2s;display:flex;align-items:center;gap:4px}
.tab:hover{border-color:#7c6fff;color:#ccc}
.tab.active{background:#7c6fff;border-color:#7c6fff;color:#fff;font-weight:700}
.tab.done::after{content:'✓';color:#51cf66;margin-left:2px}
.py-badge{font-size:.7rem;padding:3px 10px;border-radius:10px;white-space:nowrap;background:rgba(81,207,102,.12);color:#51cf66;border:1px solid rgba(81,207,102,.3)}
.py-badge.loading{background:rgba(255,212,59,.1);color:#ffd43b;border-color:rgba(255,212,59,.3)}
.py-badge.err{background:rgba(255,107,107,.1);color:#ff6b6b;border-color:rgba(255,107,107,.3)}

/* DESC STRIP — full-width horizontal info bar */
.desc-strip{background:#16162e;border-bottom:2px solid #2a2a4a;display:flex;align-items:stretch;overflow-x:auto;scrollbar-width:thin;scrollbar-color:#2a2a4a transparent;flex-shrink:0}
.desc-strip::-webkit-scrollbar{height:3px}
.desc-strip::-webkit-scrollbar-thumb{background:#2a2a4a}
.ds-sec{padding:14px 20px;display:flex;flex-direction:column;justify-content:center;gap:5px;flex-shrink:0}
.ds-div{width:1px;background:#2a2a4a;flex-shrink:0;align-self:stretch;margin:10px 0}
.ds-identity{min-width:180px;max-width:210px}
.ds-story{min-width:260px;max-width:340px}
.ds-objectives{min-width:220px;max-width:280px}
.ds-concepts{min-width:180px;flex:1}
.ds-proj-icon{font-size:2rem;line-height:1}
.ds-proj-title{font-size:1.05rem;font-weight:800;color:#ffffff;line-height:1.25;margin-top:4px;text-shadow:0 0 20px rgba(124,111,255,.4)}
.ds-sec-label{font-size:.66rem;font-weight:700;color:#6677aa;text-transform:uppercase;letter-spacing:.07em;margin-bottom:4px}
.diff-badge{display:inline-block;padding:2px 8px;border-radius:8px;font-size:.68rem;font-weight:700;margin-top:2px;width:fit-content}
.diff-beginner{background:#1a3a2a;color:#51cf66}
.diff-intermediate{background:#3a2a10;color:#ffd43b}
.diff-advanced{background:#3a1020;color:#ff6b6b}
.ds-story-text{color:#c4d4e8;font-size:.84rem;line-height:1.65;overflow:hidden;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical}
.ds-obj-item{display:flex;gap:5px;align-items:flex-start;color:#dde8f5;font-size:.82rem;line-height:1.45}
.ds-obj-dot{color:#a08fff;flex-shrink:0}
.concept-tag{display:inline-block;background:rgba(124,111,255,.18);border:1px solid rgba(124,111,255,.4);color:#a998fa;font-size:.64rem;padding:2px 7px;border-radius:10px;margin:2px 1px}
.ds-hint-btn{margin-top:4px;padding:5px 10px;border-radius:7px;background:rgba(255,212,59,.12);border:1px solid rgba(255,212,59,.3);color:#ffd43b;font-size:.7rem;cursor:pointer;transition:all .2s;white-space:nowrap;width:fit-content}
.ds-hint-btn:hover{background:rgba(255,212,59,.22)}

/* MAIN — 2 panels: code (left) | right-panel (game + console) */
.main{display:grid;grid-template-columns:52% 48%;overflow:hidden;height:100%}

/* RIGHT PANEL — game on top, console below */
.right-panel{display:flex;flex-direction:column;overflow:hidden;border-left:1px solid #2a2a4a}

/* Reuse .story for legacy compat, now unused */
.story{display:none}

/* GAME — top of right panel, scrollable */
.game{background:#f0f2f5;overflow-y:auto;position:relative;display:flex;flex-direction:column;align-items:center;flex:1;min-height:0}
.game-inner{padding:18px;width:100%;max-width:700px;display:flex;flex-direction:column;align-items:center;gap:14px}
.toast{position:fixed;top:62px;left:50%;transform:translateX(-50%);padding:8px 20px;border-radius:20px;font-size:.82rem;font-weight:600;opacity:0;pointer-events:none;z-index:100;transition:opacity .3s;white-space:nowrap}
.toast.show{opacity:1}
.toast.ok{background:#51cf66;color:#000}
.toast.err{background:#ff6b6b;color:#fff}
.toast.warn{background:#ffd43b;color:#000}
.toast.info{background:#7c6fff;color:#fff}

/* CONSOLE — bottom of right panel */
.console-bottom{height:160px;background:#12122a;border-top:2px solid #2a2a4a;display:flex;flex-direction:column;flex-shrink:0}
.console-hdr{padding:5px 12px;border-bottom:1px solid #2a2a4a;display:flex;align-items:center;justify-content:space-between;flex-shrink:0}
.console-hdr-title{font-size:.68rem;font-weight:700;color:#445;text-transform:uppercase;letter-spacing:.05em}
.console-clear{background:none;border:none;color:#445;font-size:.7rem;cursor:pointer;padding:2px 6px;border-radius:4px}
.console-clear:hover{color:#ff6b6b}
.console-out{flex:1;overflow-y:auto;padding:6px 12px;font-family:'Fira Code','Consolas',monospace;font-size:.74rem;scrollbar-width:thin;scrollbar-color:#2a2a4a transparent}
.cl{margin-bottom:1px;white-space:pre-wrap;word-break:break-all;line-height:1.5}
.cl-std{color:#c5c8c6}
.cl-err{color:#ff6b6b}
.cl-ok{color:#51cf66}
.cl-info{color:#74c0fc}
.cl-warn{color:#ffd43b}
.cl-sys{color:#7c6fff;font-style:italic}

/* RIGHT — CODE */
.code-panel{background:#282a36;border-left:1px solid #2a2a4a;display:flex;flex-direction:column;overflow:hidden}
.code-hdr{padding:8px 12px;border-bottom:1px solid #1e1e2e;display:flex;align-items:center;justify-content:space-between;flex-shrink:0}
.code-hdr-title{font-size:.8rem;font-weight:600;color:#bbb;display:flex;align-items:center;gap:5px}
.code-btns{display:flex;gap:5px}
.btn-run{padding:5px 14px;border-radius:6px;background:#51cf66;border:none;color:#000;font-size:.78rem;font-weight:800;cursor:pointer;transition:all .2s;display:flex;align-items:center;gap:4px}
.btn-run:hover:not(:disabled){background:#40bf55;transform:scale(1.03)}
.btn-run:disabled{background:#3a4a3a;color:#556;cursor:not-allowed;transform:none}
.btn-reset{padding:5px 9px;border-radius:6px;background:transparent;border:1px solid #444;color:#888;font-size:.78rem;cursor:pointer;transition:all .2s}
.btn-reset:hover{border-color:#ff6b6b;color:#ff6b6b}
.editor-wrap{flex:1;overflow:hidden;min-height:0}
.editor-wrap .CodeMirror{height:100%;font-size:.93rem;font-family:'Fira Code','Consolas',monospace;line-height:1.6}
.code-footer{padding:10px 12px;border-top:1px solid #1e1e2e;background:#1e1e2e;flex-shrink:0;min-height:60px;max-height:110px;overflow-y:auto}
.tests-title{font-size:.66rem;font-weight:700;color:#556;text-transform:uppercase;letter-spacing:.05em;margin-bottom:6px}
.test-item{display:flex;align-items:flex-start;gap:5px;font-size:.74rem;padding:3px 6px;border-radius:4px;margin-bottom:2px;line-height:1.4}
.test-pass{background:rgba(81,207,102,.08);color:#51cf66}
.test-fail{background:rgba(255,107,107,.08);color:#ff6b6b}
.test-pending{color:#556}

/* HINT POPOVER (anchored to desc strip hint button) */
.hint-popover{position:fixed;z-index:200;background:#1e1e2e;border:1px solid rgba(255,212,59,.35);border-radius:10px;padding:12px 14px;max-width:300px;box-shadow:0 8px 28px rgba(0,0,0,.5);display:none}
.hint-popover.show{display:block}
.hint-popover-text{color:#e0c97a;font-size:.78rem;line-height:1.55}
.hint-popover-nav{display:flex;justify-content:space-between;align-items:center;margin-top:8px;border-top:1px solid rgba(255,212,59,.15);padding-top:7px}
.hint-popover-counter{font-size:.68rem;color:#887}
.hint-arrow{background:none;border:none;color:#ffd43b;cursor:pointer;font-size:.78rem;padding:2px 6px;border-radius:4px}
.hint-arrow:hover{background:rgba(255,212,59,.15)}
.hint-arrow:disabled{color:#445;cursor:not-allowed}

/* ===== PROJECT UIs ===== */

/* FOREST */
.forest-wrap{width:100%}
.trees-row{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-bottom:16px}
.tree-card{background:#fff;border-radius:16px;padding:16px 14px;text-align:center;box-shadow:0 2px 12px rgba(0,0,0,.09);min-width:130px;flex:1;max-width:160px;transition:transform .2s,box-shadow .2s;border:2px solid transparent}
.tree-card:hover{transform:translateY(-3px);box-shadow:0 6px 20px rgba(0,0,0,.13)}
.tree-icon{font-size:2.4rem;display:block;margin-bottom:4px}
.tree-fruit{font-size:.75rem;color:#888;margin-bottom:2px}
.tree-count{font-size:2rem;font-weight:900;color:#7c6fff;line-height:1;margin-bottom:10px}
.tree-count.zero{color:#ddd}
.pick-btn{width:100%;padding:8px;background:#7c6fff;color:#fff;border:none;border-radius:8px;font-size:.78rem;font-weight:700;cursor:pointer;transition:all .2s}
.pick-btn:hover:not(:disabled){background:#6a5de0;transform:scale(1.03)}
.pick-btn:disabled{background:#f0f0f0;color:#bbb;cursor:not-allowed;transform:none}
.basket-card{background:#fff;border-radius:14px;padding:14px 16px;box-shadow:0 2px 12px rgba(0,0,0,.08);width:100%}
.basket-title{font-size:.72rem;font-weight:700;color:#aaa;text-align:center;margin-bottom:10px;text-transform:uppercase;letter-spacing:.04em}
.basket-grid{display:flex;gap:20px;justify-content:center}
.basket-item{text-align:center}
.basket-emoji{font-size:1.4rem}
.basket-count{font-size:1.6rem;font-weight:900;color:#333;line-height:1}
.basket-label{font-size:.65rem;color:#999}
.basket-total{text-align:center;margin-top:10px;padding-top:10px;border-top:1px solid #f5f5f5;font-size:.8rem;color:#7c6fff;font-weight:700}

/* SHOP */
.shop-wrap{width:100%}
.shop-sign{text-align:center;background:#fff;border-radius:12px;padding:10px;font-weight:800;font-size:1rem;color:#333;box-shadow:0 2px 10px rgba(0,0,0,.08);margin-bottom:14px}
.shelf{background:#fff;border-radius:12px;padding:13px 15px;display:flex;align-items:center;gap:12px;box-shadow:0 2px 10px rgba(0,0,0,.08);margin-bottom:8px}
.shelf-icon{font-size:2rem;flex-shrink:0}
.shelf-info{flex:1}
.shelf-name{font-weight:700;color:#333;font-size:.88rem}
.shelf-qty{font-size:.72rem;color:#999;margin-bottom:4px}
.stock-bar-bg{background:#f0f0f0;border-radius:3px;height:5px}
.stock-bar-fill{height:100%;border-radius:3px;transition:width .5s ease}
.bar-green{background:#51cf66}
.bar-yellow{background:#ffd43b}
.bar-red{background:#ff6b6b}
.shelf-btns{display:flex;gap:5px;flex-shrink:0}
.sell-btn{padding:5px 9px;border-radius:6px;border:1px solid #7c6fff;color:#7c6fff;background:transparent;font-size:.74rem;font-weight:700;cursor:pointer;transition:all .2s}
.sell-btn:hover:not(:disabled){background:#7c6fff;color:#fff}
.sell-btn:disabled{opacity:.35;cursor:not-allowed}
.cash-card{background:#fff;border-radius:12px;padding:12px 15px;display:flex;align-items:center;gap:10px;box-shadow:0 2px 10px rgba(0,0,0,.08);margin-top:4px}
.cash-icon{font-size:1.8rem}
.cash-label{font-size:.68rem;color:#aaa}
.cash-amount{font-size:1.6rem;font-weight:900;color:#51cf66}

/* ATM */
.atm{background:linear-gradient(145deg,#1a2744,#243562);border-radius:20px;padding:20px;width:300px;box-shadow:0 10px 40px rgba(0,0,0,.35)}
.atm-screen{background:#0a0a1a;border-radius:12px;padding:18px;margin-bottom:16px;text-align:center;border:2px solid #1a2a4a}
.atm-logo{font-size:.65rem;color:#3344aa;letter-spacing:.1em;margin-bottom:3px}
.atm-welcome{font-size:.78rem;color:#667;margin-bottom:10px}
.atm-balance-lbl{font-size:.7rem;color:#556}
.atm-balance{font-size:1.9rem;font-weight:900;color:#51cf66;margin-bottom:6px;letter-spacing:-1px}
.atm-status-chip{display:inline-block;padding:3px 10px;border-radius:10px;font-size:.7rem;font-weight:700}
.chip-ok{background:rgba(81,207,102,.15);color:#51cf66}
.chip-warn{background:rgba(255,212,59,.15);color:#ffd43b}
.chip-low{background:rgba(255,107,107,.15);color:#ff6b6b}
.atm-pad{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-bottom:10px}
.atm-btn{padding:11px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.15);border-radius:8px;color:#eee;font-size:.85rem;font-weight:700;cursor:pointer;transition:all .2s}
.atm-btn:hover:not(:disabled){background:rgba(255,255,255,.2);transform:scale(1.03)}
.atm-btn:disabled{opacity:.3;cursor:not-allowed;transform:none}
.atm-btn.wide{grid-column:1/-1;background:rgba(255,107,107,.2);border-color:rgba(255,107,107,.4);color:#ffaaaa}
.atm-log{background:rgba(0,0,0,.3);border-radius:8px;padding:8px;max-height:72px;overflow-y:auto}
.atm-log-item{font-size:.68rem;color:#668;padding:2px 0;border-bottom:1px solid rgba(255,255,255,.04)}
.atm-log-item:last-child{border:none}
.atm-log-item.debit{color:#ff9999}

/* WATER TANK */
.tank-scene{display:flex;flex-direction:column;align-items:center;gap:14px;width:100%}
.tank-wrap{background:#fff;border-radius:16px;padding:20px;box-shadow:0 2px 12px rgba(0,0,0,.09);text-align:center}
.tank-info-card{background:#fff;border-radius:12px;padding:12px 20px;box-shadow:0 2px 10px rgba(0,0,0,.08);text-align:center;min-width:200px}
.tank-lvl{font-size:2rem;font-weight:900;color:#0288d1}
.tank-cap{font-size:.72rem;color:#aaa;margin-top:2px}
.tank-status-chip{display:inline-block;padding:3px 10px;border-radius:10px;font-size:.72rem;font-weight:700;margin-top:6px}
.ts-full{background:#e1f5fe;color:#0288d1}
.ts-good{background:#e8f5e9;color:#2e7d32}
.ts-low{background:#fff8e1;color:#f57f17}
.ts-empty{background:#ffebee;color:#c62828}
.tank-controls{display:grid;grid-template-columns:1fr 1fr;gap:8px;width:100%;max-width:340px}
.tank-ctrl-btn{padding:10px;border-radius:9px;border:none;font-size:.8rem;font-weight:700;cursor:pointer;transition:all .2s}
.tank-ctrl-btn.fill{background:#e1f5fe;color:#0277bd;border:1px solid #81d4fa}
.tank-ctrl-btn.use{background:#fce4ec;color:#c62828;border:1px solid #ef9a9a}
.tank-ctrl-btn:hover:not(:disabled){transform:translateY(-2px);box-shadow:0 4px 12px rgba(0,0,0,.12)}
.tank-ctrl-btn:disabled{opacity:.45;cursor:not-allowed;transform:none}

/* PET */
.pet-scene{display:flex;flex-direction:column;align-items:center;gap:14px;width:100%;max-width:380px}
.pet-display{background:#fff;border-radius:20px;padding:22px;text-align:center;box-shadow:0 4px 18px rgba(0,0,0,.1);width:100%}
.pet-face{font-size:4.5rem;display:block;margin-bottom:8px;transition:all .4s;line-height:1}
.pet-name{font-weight:800;font-size:1rem;color:#333}
.pet-mood{font-size:.78rem;color:#888;margin-top:2px}
.pet-stats{background:#fff;border-radius:14px;padding:14px 16px;box-shadow:0 2px 10px rgba(0,0,0,.08);width:100%}
.stat-row{display:flex;align-items:center;gap:8px;margin-bottom:9px}
.stat-row:last-child{margin-bottom:0}
.stat-ic{font-size:1rem;width:22px;text-align:center}
.stat-lbl{font-size:.72rem;color:#777;width:70px}
.stat-bar-bg{flex:1;background:#f0f0f0;border-radius:4px;height:8px;overflow:hidden}
.stat-bar-f{height:100%;border-radius:4px;transition:width .5s ease}
.sf-hunger{background:#ff6b6b}
.sf-energy{background:#ffd43b}
.sf-happy{background:#7c6fff}
.stat-val{font-size:.72rem;font-weight:700;color:#444;width:28px;text-align:right}
.pet-actions{display:grid;grid-template-columns:1fr 1fr 1fr;gap:7px;width:100%}
.pet-btn{padding:10px 6px;border-radius:10px;border:none;cursor:pointer;font-size:.75rem;font-weight:700;transition:all .2s;text-align:center}
.pet-btn:hover:not(:disabled){transform:translateY(-2px);box-shadow:0 4px 12px rgba(0,0,0,.1)}
.pet-btn:disabled{opacity:.4;cursor:not-allowed;transform:none}
.pb-feed{background:#e8f5e9;color:#2e7d32}
.pb-play{background:#e3f2fd;color:#1565c0}
.pb-sleep{background:#f3e5f5;color:#6a1b9a}

/* TREASURE */
.treasure-scene{width:100%}
.gold-banner{background:#fff;border-radius:14px;padding:14px;text-align:center;box-shadow:0 2px 10px rgba(0,0,0,.08);margin-bottom:14px}
.gold-amount{font-size:2rem;font-weight:900;color:#f59e0b}
.gold-lbl{font-size:.72rem;color:#aaa;margin-top:2px}
.chests-wrap{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-bottom:16px}
.chest{text-align:center;cursor:default;transition:transform .3s}
.chest-em{font-size:2.8rem;display:block;transition:all .4s;line-height:1}
.chest.open .chest-em{transform:scale(1.2);filter:drop-shadow(0 2px 6px rgba(245,158,11,.5))}
.chest-gold{font-size:.7rem;color:#888;margin-top:4px}
.hunt-btn{width:100%;padding:12px;background:linear-gradient(135deg,#ffd700,#ffa500);border:none;border-radius:10px;font-size:.9rem;font-weight:800;color:#000;cursor:pointer;transition:all .2s;box-shadow:0 3px 12px rgba(245,158,11,.3)}
.hunt-btn:hover:not(:disabled){transform:scale(1.02);box-shadow:0 5px 20px rgba(245,158,11,.4)}
.hunt-btn:disabled{opacity:.5;cursor:not-allowed;transform:none;box-shadow:none}
.hunt-log{background:#fff;border-radius:10px;padding:10px;max-height:70px;overflow-y:auto;box-shadow:0 2px 8px rgba(0,0,0,.06)}
.hunt-log-item{font-size:.74rem;color:#666;padding:2px 0}

/* ATTENDANCE */
.att-scene{width:100%}
.att-board{background:#fff;border-radius:14px;overflow:hidden;box-shadow:0 2px 12px rgba(0,0,0,.09);margin-bottom:12px}
.att-hdr{background:#3b82f6;padding:12px 16px;color:#fff;font-weight:800;text-align:center;font-size:.9rem}
.att-row{display:flex;align-items:center;padding:11px 16px;border-bottom:1px solid #f5f5f5;transition:background .3s}
.att-row:last-child{border-bottom:none}
.att-row.present{background:rgba(81,207,102,.06)}
.att-row.absent{background:rgba(255,107,107,.04)}
.att-num{font-size:.7rem;color:#ccc;width:22px}
.att-name{flex:1;font-weight:600;color:#333;font-size:.88rem}
.att-badge{font-size:.7rem;padding:3px 10px;border-radius:10px;font-weight:700}
.badge-present{background:#e8f5e9;color:#2e7d32}
.badge-absent{background:#ffebee;color:#c62828}
.badge-pending{background:#f5f5f5;color:#aaa}
.att-summary{background:#fff;border-radius:10px;padding:12px;display:flex;justify-content:space-around;box-shadow:0 2px 8px rgba(0,0,0,.07);margin-bottom:12px}
.att-stat-num{font-size:1.5rem;font-weight:900;text-align:center}
.att-stat-lbl{font-size:.65rem;color:#aaa;text-align:center;margin-top:2px}
.att-btn{width:100%;padding:11px;background:#3b82f6;border:none;border-radius:10px;color:#fff;font-size:.88rem;font-weight:800;cursor:pointer;transition:all .2s}
.att-btn:hover:not(:disabled){background:#2563eb}
.att-btn:disabled{opacity:.5;cursor:not-allowed}
.att-btn.reset{background:#f0f0f0;color:#666;margin-top:6px}
.att-btn.reset:hover:not(:disabled){background:#e0e0e0}

/* ANIMATIONS */
@keyframes float-up{0%{transform:translateY(0);opacity:1}100%{transform:translateY(-70px);opacity:0}}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.12)}}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
@keyframes spin{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}
.float-emoji{position:fixed;pointer-events:none;font-size:1.6rem;z-index:9999;animation:float-up .9s ease forwards}
.pulse{animation:pulse .4s ease}
.shake{animation:shake .4s ease}
.spin{animation:spin 1s linear infinite;display:inline-block}

/* SCROLLBARS */
::-webkit-scrollbar{width:4px;height:4px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:#2a2a4a;border-radius:2px}

async function initPyodide() {
  const fill = document.getElementById('ld-fill');
  const factEl = document.getElementById('ld-fact');
  let factIdx = 0;
  const factInterval = setInterval(() => {
    factIdx = (factIdx+1) % FACTS.length;
    factEl.textContent = FACTS[factIdx];
  }, 3000);

  // Animate progress bar
  let progress = 0;
  const progressInterval = setInterval(() => {
    progress = Math.min(progress + Math.random()*8, 90);
    fill.style.width = progress + '%';
  }, 400);

  try {
    pyodide = await loadPyodide();
    // Setup stdout/stderr capture
    await pyodide.runPythonAsync(`
import sys

class _PyStoryCapture:
    def __init__(self): self._lines = []
    def write(self, s): self._lines.append(str(s)); return len(str(s))
    def flush(self): pass
    def getvalue(self): return ''.join(self._lines)
    def clear(self): self._lines.clear()

sys.stdout = _PyStoryCapture()
sys.stderr = _PyStoryCapture()
`);
    pyReady = true;
    clearInterval(progressInterval);
    clearInterval(factInterval);

/* ============================================================
   CODE EXECUTION
   ============================================================ */
async function runCode() {
  if(!pyReady){ showToast('Python is still loading...','warn'); return; }
  const btn = document.getElementById('run-btn');
  btn.disabled = true;
  btn.innerHTML = '<span class="spin">⏳</span> Running…';

  const code = editor.getValue();
  try {
    // Clear capture buffer
    await pyodide.runPythonAsync('import sys; sys.stdout.clear(); sys.stderr.clear()');
    // Run the student code
    await pyodide.runPythonAsync(code);
    // Read output
    const out = pyodide.runPython('import sys; sys.stdout.getvalue()');
    const err = pyodide.runPython('import sys; sys.stderr.getvalue()');
    if(out.trim()) addLog(out.trim(),'cl-std');
    if(err.trim()) addLog(err.trim(),'cl-err');
    // Sync state
    syncFromPython();
    currentProject.renderUI(currentState);
    showToast('Code executed! ✓','ok');
    addLog('✅ Code ran successfully!','cl-ok');
    // Run tests
    await runTests();
  } catch(e) {
    const msg = cleanError(e.message);
    addLog('❌ '+msg,'cl-err');
    showToast('Error — check console','err');
    shakeEditor();
  } finally {
    btn.disabled = false;
    btn.innerHTML = '▶ Run';
  }
}

function cleanError(msg) {
  // Extract the useful part of Pyodide errors
  const lines = msg.split('\n');
  const last = lines.filter(l=>l.trim()).pop() || msg;
  return last.length > 120 ? last.slice(0,120)+'…' : last;
}

async function executeAction(fnName, ...args) {
  if(!pyReady){ showToast('Click ▶ Run first!','warn'); return; }
  try {
    await pyodide.runPythonAsync('import sys; sys.stdout.clear(); sys.stderr.clear()');
    const argsStr = args.map(a => JSON.stringify(a)).join(', ');
    await pyodide.runPythonAsync(`${fnName}(${argsStr})`);
    const out = pyodide.runPython('import sys; sys.stdout.getvalue()');
    if(out.trim()) addLog(out.trim(),'cl-std');
    syncFromPython();
    currentProject.renderUI(currentState);
    floatEmoji(getActionEmoji(fnName));
  } catch(e) {
    const msg = cleanError(e.message);
    if(msg.includes("not defined")) {
      showToast("Function not found — click ▶ Run first!",'warn');
      addLog("⚠️ Function '"+fnName+"' not defined. Click ▶ Run first!",'cl-warn');
    } else {
      addLog('❌ '+msg,'cl-err');
      showToast('Error in function','err');
    }
  }
}

function getActionEmoji(fn) {
  const map={pick_apple:'🍎',pick_mango:'🥭',pick_orange:'🍊',sell_biscuit:'🍪',sell_chocolate:'🍫',sell_juice:'🧃',withdraw:'💸',fill_water:'💧',use_water:'🚿',feed_pet:'🍖',play_with_pet:'🎾',put_pet_to_sleep:'💤',collect_treasures:'✨',mark_attendance:'✅',mark_absent:'❌'};
  return map[fn] || '⭐';
}

function syncFromPython() {
  const proj = currentProject;
  for(const varName of proj.stateVars) {
    try {
      const val = pyodide.globals.get(varName);
      if(val === undefined || val === null) continue;
      if(typeof val.toJs === 'function') {
        currentState[varName] = val.toJs({dict_converter: Object.fromEntries});
      } else {
        currentState[varName] = val;
      }
    } catch(e) {}
  }
}

/* ============================================================
   TESTS
   ============================================================ */
async function runTests() {
  const proj = currentProject;
  const resultsEl = document.getElementById('test-results');
  const results = [];
  for(const test of proj.tests) {
    try {
      await pyodide.runPythonAsync(test.code);
      results.push({pass:true, desc:test.desc});
    } catch(e) {
      results.push({pass:false, desc:test.desc, err:cleanError(e.message)});
    }
  }
  resultsEl.innerHTML = results.map(r =>
    `<div class="test-item ${r.pass?'test-pass':'test-fail'}">
      ${r.pass?'✅':'❌'} ${r.desc}
      ${r.err?`<br><span style="opacity:.7;font-size:.7rem">${r.err}</span>`:''}
    </div>`
  ).join('');

  if(results.every(r=>r.pass)) {
    completedProjects.add(proj.id);
    buildNav();
    showToast('🎉 All tests passed!','ok');
    confetti();
  }
}

    if(out.trim()) addLog(out.trim(),'cl-std');
    syncFromPython();
    currentProject.renderUI(currentState);
    floatEmoji('✨');
    floatEmoji('🪙');
  } catch(e) {
    const msg = cleanError(e.message);
    if(msg.includes("not defined")){showToast("Click ▶ Run first!",'warn');}
    else{addLog('❌ '+msg,'cl-err');showToast('Error in function','err');}
  }
}

function renderAttendance(state) {
  const students = Array.isArray(state.students) ? state.students : [];
  const present = students.filter(s=>s.present===true||s.present===1).length;
  const absent = students.filter(s=>s.present===false||s.present===0).length;
  const pending = students.filter(s=>s.present===null||s.present===undefined).length;
  const pct = students.length>0 ? Math.round((present/students.length)*100) : 0;
  document.getElementById('game-inner').innerHTML = `
    <div class="att-scene">
      <div class="att-board">
        <div class="att-hdr">🏫 Sunrise Primary School — Attendance</div>
        ${students.map((s,i)=>{
          const p = s.present===true||s.present===1;
          const ab = s.present===false||s.present===0;
          return `<div class="att-row ${p?'present':ab?'absent':''}">
            <span class="att-num">${i+1}</span>
            <span class="att-name">${s.name}</span>
            <span class="att-badge ${p?'badge-present':ab?'badge-absent':'badge-pending'}">${p?'Present':ab?'Absent':'Pending'}</span>
          </div>`;
        }).join('')}
      </div>
      <div class="att-summary">
        <div class="att-stat"><div class="att-stat-num" style="color:#51cf66">${present}</div><div class="att-stat-lbl">Present</div></div>
        <div class="att-stat"><div class="att-stat-num" style="color:#ff6b6b">${absent}</div><div class="att-stat-lbl">Absent</div></div>
        <div class="att-stat"><div class="att-stat-num" style="color:#7c6fff">${pct}%</div><div class="att-stat-lbl">Attendance</div></div>
      </div>
      <button class="att-btn" onclick="doMarkAttendance()" ${pending===0&&present===students.length?'disabled':''}>
        ✅ Mark All Present
      </button>
      <button class="att-btn reset" onclick="markAbsentPrompt()">❌ Mark Someone Absent</button>
    </div>`;
}

function markAbsentPrompt() {
  const students = currentState.students || [];
  const names = students.map(s=>s.name).join(', ');
  const name = prompt(`Mark absent — enter student name:\n(${names})`);
  if(name && name.trim()) executeAction('mark_absent', name.trim());
}

/* ============================================================
   CONSOLE
   ============================================================ */
function addLog(text, cls='cl-std') {
  const out = document.getElementById('console-out');
  const div = document.createElement('div');
  div.className = 'cl '+cls;
  div.textContent = text;
  out.appendChild(div);
  out.scrollTop = out.scrollHeight;
}
function clearConsole() {
  document.getElementById('console-out').innerHTML='';
}

/* ============================================================
   HINTS — popover anchored to the hint button in desc-strip
   ============================================================ */
let hintPopoverOpen = false;

function toggleHintPopover(btn) {
  const popover = document.getElementById('hint-popover');
  if(hintPopoverOpen) {
    popover.classList.remove('show');
    hintPopoverOpen = false;
    return;
  }
  hintIndex = 0;
  renderHintPopover(btn);
}

function renderHintPopover(btn) {
  const hints = currentProject.hints;
  if(!hints||!hints.length) return;
  const popover = document.getElementById('hint-popover');
  document.getElementById('hint-text').innerHTML = hints[hintIndex];
  document.getElementById('hint-counter').textContent = `${hintIndex+1} / ${hints.length}`;
  document.getElementById('hint-prev').disabled = hintIndex===0;
  document.getElementById('hint-next').disabled = hintIndex===hints.length-1;

  // Position below the hint button
  const trigger = btn || document.getElementById('hint-trigger-btn');
  if(trigger) {
    const rect = trigger.getBoundingClientRect();
    popover.style.top = (rect.bottom+6)+'px';
    popover.style.left = Math.min(rect.left, window.innerWidth-310)+'px';
  }
  popover.classList.add('show');
  hintPopoverOpen = true;
}

function prevHint(){
  if(hintIndex>0){ hintIndex--; renderHintPopover(); }
}
function nextHint(){
  if(hintIndex<currentProject.hints.length-1){ hintIndex++; renderHintPopover(); }
}

// Close popover when clicking outside
document.addEventListener('click', e => {
  if(hintPopoverOpen && !e.target.closest('#hint-popover') && !e.target.closest('.ds-hint-btn')){
    document.getElementById('hint-popover').classList.remove('show');
    hintPopoverOpen = false;
  }
});

/* ============================================================
   UTILITIES
   ============================================================ */
function resetCode() {
  editor.setValue(currentProject.starterCode);
  currentState = JSON.parse(JSON.stringify(currentProject.initialState));
  currentProject.renderUI(currentState);
  document.getElementById('test-results').innerHTML =
    currentProject.tests.map(t=>`<div class="test-item test-pending">⬜ ${t.desc}</div>`).join('');
  addLog('↺ Code reset to starter template','cl-sys');
}

let toastEl, toastTimeout;
function showToast(msg, type='info') {
  if(!toastEl) toastEl = document.getElementById('toast');
  clearTimeout(toastTimeout);
  toastEl.textContent = msg;
  toastEl.className = 'toast show '+type;
  toastTimeout = setTimeout(()=>{ toastEl.classList.remove('show'); }, 2200);
}

function floatEmoji(em) {
  const el = document.createElement('div');
  el.className = 'float-emoji';
  el.textContent = em;
  el.style.left = (30+Math.random()*40)+'vw';
  el.style.top = '50vh';
  document.body.appendChild(el);
  setTimeout(()=>el.remove(), 1000);
}

function confetti() {
  const emojis = ['🎉','⭐','🌟','✨','🎊','🏆'];
  for(let i=0;i<8;i++) {
    setTimeout(()=>floatEmoji(emojis[Math.floor(Math.random()*emojis.length)]),i*120);
  }
}

function shakeEditor() {
  const el = document.querySelector('.editor-wrap');
  el.classList.add('shake');
  setTimeout(()=>el.classList.remove('shake'),500);
}

/* ============================================================
   INIT
   ============================================================ */
document.addEventListener('DOMContentLoaded', async () => {
  // Init CodeMirror
  editor = CodeMirror.fromTextArea(document.getElementById('editor'), {
    mode: 'python',
    theme: 'dracula',
    lineNumbers: true,
    indentUnit: 4,
    tabSize: 4,
    indentWithTabs: false,
    lineWrapping: false,
    autofocus: false,
    extraKeys: {
      "Tab": cm => { if(cm.somethingSelected()) cm.indentSelection('add'); else cm.replaceSelection('    '); },
      "Ctrl-Enter": runCode,
      "Cmd-Enter": runCode,
    }
  });

  // Build nav
  buildNav();

  // Load Pyodide
  initPyodide();
});
</script>
