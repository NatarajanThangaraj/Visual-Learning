<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MathicsArena</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>&#127942;</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0b1120; --surf1:#111c2e; --surf2:#172035; --surf3:#1e2d48; --surf4:#263654;
  --border:#2a3f60; --border2:#1e3050;
  --accent:#3b82f6; --cyan:#06b6d4; --purple:#8b5cf6;
  --green:#10b981; --amber:#f59e0b; --red:#ef4444;
  --text:#e2e8f0; --text2:#94a3b8; --text3:#546a8a;
  --mono:'JetBrains Mono','SF Mono',Menlo,'Courier New',monospace;
  --ui:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
  --p1:#3b82f6; --p2:#f59e0b; --p3:#8b5cf6; --p4:#ec4899;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;overflow:hidden}
body{background:var(--bg);color:var(--text);font-family:var(--ui);font-size:13px;
  line-height:1.5;-webkit-font-smoothing:antialiased;display:flex;flex-direction:column}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
select,input{font:inherit;color:inherit}
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-thumb{background:var(--surf4);border-radius:4px}
::-webkit-scrollbar-track{background:transparent}
.mono{font-family:var(--mono)}

/* ------------------------------------------------------------- topbar */
.topbar{height:44px;flex:none;display:flex;align-items:center;gap:10px;padding:0 12px;
  background:var(--surf1);border-bottom:1px solid var(--border)}
.brand{display:flex;align-items:center;gap:8px;cursor:pointer;padding:3px 6px;border-radius:6px}
.brand:hover{background:var(--surf3)}
.brand i{width:22px;height:22px;border-radius:6px;font-style:normal;font-size:12px;
  background:linear-gradient(135deg,var(--accent),var(--purple));display:grid;place-items:center}
.brand b{font-weight:600;letter-spacing:-.01em}
.view-toggle{display:flex;background:var(--surf3);border-radius:7px;padding:2px;margin-left:4px}
.view-btn{padding:3px 11px;border-radius:5px;font-size:11.5px;color:var(--text2);transition:all .15s}
.view-btn:hover{color:var(--text)}
.view-btn.on{background:var(--accent);color:#fff}
.tb-right{margin-left:auto;display:flex;align-items:center;gap:9px}
.tb-chip{font-family:var(--mono);font-size:11px;color:var(--text2);background:var(--surf2);
  border:1px solid var(--border);border-radius:5px;padding:2px 8px}
.tb-chip.lock{color:var(--red);border-color:rgba(239,68,68,.5);background:rgba(239,68,68,.1)}
.tb-chip.free{color:var(--green);border-color:rgba(16,185,129,.4);background:rgba(16,185,129,.08)}

/* ------------------------------------------------------------ app body */
.app-body{flex:1;display:flex;min-height:0}
.sidebar{width:200px;flex:none;background:var(--surf1);border-right:1px solid var(--border);
  display:flex;flex-direction:column;padding:8px 7px;overflow-y:auto}
.nav-head{font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--text3);
  padding:8px 7px 4px;font-weight:600}
.nav-item{display:flex;align-items:center;gap:8px;width:100%;text-align:left;padding:6px 8px;
  border-radius:6px;color:var(--text2);font-size:12.5px;border-left:2px solid transparent;transition:all .12s}
.nav-item:hover{background:var(--surf2);color:var(--text)}
.nav-item.on{background:var(--surf3);color:#fff;border-left-color:var(--accent)}
.nav-item em{font-style:normal;font-size:13px;width:16px;text-align:center}
.nav-item s{margin-left:auto;text-decoration:none;font-size:9.5px;color:var(--green)}
.legend{margin-top:auto;border-top:1px solid var(--border);padding:9px 7px 2px;display:grid;gap:5px}
.legend b{font-size:9.5px;letter-spacing:.1em;color:var(--text3);font-weight:600}
.legend span{font-size:10.5px;color:var(--text2);display:flex;align-items:center;gap:7px}
.dot{width:8px;height:8px;border-radius:50%;flex:none}

.main{flex:1;min-width:0;display:flex;flex-direction:column}
.simwrap{flex:1;display:flex;flex-direction:column;min-height:0}
.split{flex:1;display:flex;min-height:0}
.canvas-col{flex:1;min-width:0;display:flex;flex-direction:column}

/* ------------------------------------------------------------- canvas */
.band-net{flex:1;min-height:0;padding:8px;display:flex;gap:0;position:relative;overflow:hidden}
.band-thr{height:clamp(122px,23vh,182px);flex:none;border-top:1px solid var(--border);padding:8px 11px;overflow:auto}
.v-net .band-thr{display:none}
.v-thr .split{display:none}
.v-thr .band-thr{flex:1;height:auto}
.band-label{font-size:9.5px;letter-spacing:.14em;color:var(--text3);font-weight:600;margin-bottom:7px;
  display:flex;align-items:center;gap:8px}
.band-label s{text-decoration:none;color:var(--text3);font-weight:400;letter-spacing:0;font-size:10.5px}

.srv-col{width:206px;flex:none;display:flex;flex-direction:column;gap:8px;overflow:auto}
.wire-col{width:58px;flex:none;position:relative}
.cli-col{flex:1;min-width:0;display:flex;flex-direction:column;gap:7px;overflow:auto}

.card{background:var(--surf2);border:1px solid var(--border);border-radius:9px}
.srv-card{padding:9px}
.srv-card.off{opacity:.5}
.srv-head{display:flex;align-items:center;gap:7px;font-family:var(--mono);font-size:12px}
.srv-head b{font-weight:500}
.srv-head .port{margin-left:auto;color:var(--cyan)}
.srv-sub{font-family:var(--mono);font-size:10px;color:var(--text3);margin-top:6px;word-break:break-all}
.gm-box{margin-top:9px;background:var(--surf1);border:1px solid var(--border);border-radius:7px;padding:8px;
  transition:border-color .2s}
.gm-box.locked{border-color:var(--red)}
.gm-box.unsync{border-color:var(--amber);border-style:dashed}
.gm-head{display:flex;align-items:center;gap:6px;font-family:var(--mono);font-size:11.5px}
.gm-head b{font-weight:500;color:var(--amber)}
.gm-head s{margin-left:auto;text-decoration:none;font-size:13px}
.gm-fields{font-family:var(--mono);font-size:10.5px;color:var(--text2);margin-top:6px;display:grid;gap:3px}
.gm-fields i{font-style:normal;color:var(--text3)}
.gm-fields b{font-weight:500}
.entryset{margin-top:7px;border:1px dashed var(--red);border-radius:6px;padding:4px 7px;
  font-family:var(--mono);font-size:10px;color:var(--red)}
.valchange{animation:vc .9s ease}
@keyframes vc{0%{background:rgba(245,158,11,.5);color:#fff}100%{background:transparent}}

.scoreboard{padding:8px 9px}
.scoreboard h4{font-size:10px;letter-spacing:.1em;color:var(--text3);font-weight:600;margin-bottom:6px}
.sb-row{display:flex;align-items:center;gap:7px;font-family:var(--mono);font-size:11px;padding:2px 0}
.sb-row s{margin-left:auto;text-decoration:none;font-weight:500}
.sb-bad{color:var(--red)}

/* wires */
.wire{position:absolute;left:0;right:0;height:1px;background:var(--border)}
.wire.hot{background:var(--amber);box-shadow:0 0 6px rgba(245,158,11,.6)}
.wire-tag{position:absolute;left:50%;transform:translateX(-50%);font-family:var(--mono);
  font-size:8.5px;color:var(--text3);background:var(--bg);padding:0 4px;white-space:nowrap}
.pk{position:absolute;font-family:var(--mono);font-size:8.5px;padding:1px 6px;border-radius:8px;
  white-space:nowrap;z-index:4;transform:translateY(-50%);pointer-events:none;
  max-width:70px;overflow:hidden;text-overflow:ellipsis}
.pk-out{animation:pkOut .42s ease-in-out forwards}
.pk-in{animation:pkIn .42s ease-in-out forwards}
@keyframes pkOut{from{left:0;opacity:0}20%{opacity:1}to{left:42px;opacity:0}}
@keyframes pkIn{from{left:42px;opacity:0}20%{opacity:1}to{left:0;opacity:0}}
.k-join{background:var(--cyan);color:#03252b}
.k-problem{background:var(--purple);color:#1b0b3d}
.k-answer{background:var(--amber);color:#3b2606}
.k-verdict{background:var(--green);color:#03291d}
.k-reject{background:var(--red);color:#3d0808}
.k-board{background:var(--text2);color:#0b1120}

/* client terminals */
.term{background:var(--surf2);border:1px solid var(--border);border-radius:8px;overflow:hidden;
  transition:border-color .2s}
.term.win{border-color:var(--green)}
.term.blocked{border-color:var(--red)}
.term.hang{border-color:var(--amber);border-style:dashed}
.term-bar{display:flex;align-items:center;gap:5px;padding:4px 8px;background:var(--surf3);
  font-family:var(--mono);font-size:9.5px;color:var(--text2)}
.term-bar i{width:6px;height:6px;border-radius:50%;font-style:normal}
.term-bar s{margin-left:6px;text-decoration:none}
.term-bar u{margin-left:auto;text-decoration:none;font-size:9px;color:var(--text3)}
.term-body{padding:5px 8px;font-family:var(--mono);font-size:10.5px;color:var(--text2);
  max-height:68px;overflow:auto}
.term-body div{white-space:pre-wrap;word-break:break-word}
.term-body .me{color:var(--text)}
.term-body .hit{color:var(--green)}
.term-body .miss{color:var(--red)}
.caret{display:inline-block;width:6px;height:11px;background:var(--amber);vertical-align:-1px;
  animation:blink 1s steps(2) infinite}
@keyframes blink{50%{opacity:0}}
.spin{display:inline-block;animation:sp 1s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}

/* ------------------------------------------------------- thread lanes */
.lane{display:flex;align-items:center;gap:8px;font-family:var(--mono);font-size:10px;padding:2px 0}
.lane-name{width:104px;flex:none;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lane-cells{display:flex;gap:2px;flex:none}
.lane-cells i{display:block;width:9px;height:12px;border-radius:2px;font-style:normal;opacity:.5}
.lane-cells i.now{opacity:1;outline:1px solid rgba(255,255,255,.35)}
.st-chip{flex:none;padding:0 6px;border-radius:4px;font-size:9px;border:1px solid}
.st-RUNNABLE{color:var(--green);border-color:var(--green)}
.st-BLOCKED{color:var(--red);border-color:var(--red);background:rgba(239,68,68,.12)}
.st-WAITING{color:var(--purple);border-color:var(--purple)}
.st-NEW{color:var(--text3);border-color:var(--text3);border-style:dashed}
.st-TERMINATED{color:var(--text3);border-color:var(--text3);opacity:.7}
.lane-doing{color:var(--text3);font-size:9.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lane-doing b{color:var(--text2);font-weight:400}
.info{display:inline-grid;place-items:center;width:12px;height:12px;border-radius:50%;
  border:1px solid var(--text3);color:var(--text3);font-size:8px;cursor:help;margin-left:4px}
.trace{margin-top:9px;border-top:1px dashed var(--border);padding-top:7px;font-family:var(--mono);font-size:10px}
.trace div{color:var(--text2);padding:1px 0}
.trace .race{color:var(--red)}
.banner{margin:8px 0 0;background:rgba(239,68,68,.14);border:1px solid var(--red);border-radius:7px;
  padding:7px 10px;font-size:11.5px;color:#fecaca}
.banner b{color:#fff}

/* ---------------------------------------------------------- java pane */
.java-pane{width:clamp(320px,34%,450px);max-width:450px;min-width:320px;flex:none;background:var(--surf1);
  border-left:1px solid var(--border);display:flex;flex-direction:column;min-height:0}
.jtabs{display:flex;flex-wrap:wrap;gap:3px;padding:7px;border-bottom:1px solid var(--border)}
.jtab{font-family:var(--mono);font-size:9.5px;padding:3px 7px;border-radius:5px;background:var(--surf3);
  color:var(--text2);transition:all .12s}
.jtab:hover{color:var(--text)}
.jtab.on{background:var(--accent);color:#fff}
.jtab.locked{background:transparent;border:1px dashed var(--border);color:var(--text3);cursor:not-allowed}
.jhead{display:flex;align-items:center;gap:8px;padding:5px 9px;border-bottom:1px solid var(--border);
  font-family:var(--mono);font-size:10px;color:var(--green)}
.jhead u{margin-left:auto;text-decoration:none}
.jbtn{font-size:9.5px;color:var(--text2);border:1px solid var(--border);border-radius:5px;padding:1px 7px}
.jbtn:hover{color:var(--text);border-color:var(--text3)}
.jbtn.on{color:var(--amber);border-color:var(--amber)}
.jcode{flex:1;overflow:auto;padding:7px 0 14px;font-family:var(--mono);font-size:11px;line-height:1.75}
.jline{display:flex;padding:0 9px 0 0;border-left:2px solid transparent}
.jline i{font-style:normal;color:var(--text3);width:30px;flex:none;text-align:right;padding-right:9px;
  user-select:none}
.jline em{font-style:normal;flex:1;min-width:0;white-space:pre-wrap;overflow-wrap:break-word;padding-left:2.6em;text-indent:-2.6em}
.jline.on{border-left-color:var(--green);background:rgba(16,185,129,.1)}
.jline.blk{border-left-color:var(--red);background:rgba(239,68,68,.08)}
.jline.fresh i{color:var(--green)}
.jline.fresh i::after{content:'+';margin-left:2px}
.badges{flex:none;display:flex;gap:3px;padding-left:6px;align-items:center}
.badge{width:14px;height:14px;border-radius:3px;display:grid;place-items:center;font-size:8px;
  font-weight:700;color:#fff;font-family:var(--ui)}
.badge.wait{opacity:.45;filter:grayscale(1)}
.kw{color:var(--purple)}.ty{color:var(--cyan)}.st{color:var(--green)}
.cm{color:var(--text3);font-style:italic}.fn{color:var(--amber)}.nu{color:#f472b6}
.strike{text-decoration:line-through;color:var(--red)!important}

/* ---------------------------------------------------------- step bar */
.stepbar{height:44px;flex:none;display:flex;align-items:center;gap:8px;padding:0 12px;
  background:var(--surf1);border-top:1px solid var(--border);overflow-x:auto}
.sb-btn{padding:5px 13px;border-radius:6px;background:var(--surf3);color:var(--text);font-size:12px;
  white-space:nowrap;transition:all .12s}
.sb-btn:hover{background:var(--surf4)}
.sb-btn.primary{background:var(--accent);color:#fff}
.sb-btn.primary:hover{filter:brightness(1.1)}
.sb-btn:disabled{opacity:.4;cursor:not-allowed}
.sb-right{margin-left:auto;display:flex;align-items:center;gap:9px;white-space:nowrap}
.toggle{display:flex;align-items:center;gap:6px;font-family:var(--mono);font-size:11px;
  border:1px solid var(--border);border-radius:6px;padding:3px 9px;color:var(--text2)}
.toggle.on{color:var(--green);border-color:var(--green)}
.toggle.off{color:var(--red);border-color:var(--red)}
.mini-sel{background:var(--surf3);border:1px solid var(--border);border-radius:5px;padding:2px 5px;
  font-size:11px;font-family:var(--mono)}

/* ------------------------------------------------------------- pages */
.page{flex:1;overflow:auto;padding:20px 24px;display:none}
.page.on{display:block}
.page-wrap{max-width:900px;margin:0 auto}
.page h1{font-size:21px;font-weight:600;letter-spacing:-.01em;margin-bottom:6px}
.page h2{font-size:15px;font-weight:600;margin:22px 0 10px}
.page p{color:var(--text2);font-size:13px;line-height:1.75;margin-bottom:10px}
.page p b{color:var(--text);font-weight:500}
.lede{font-size:14px;color:var(--text2);margin-bottom:18px}
.grid{display:grid;gap:11px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.pcard{background:var(--surf2);border:1px solid var(--border);border-radius:10px;padding:13px 15px}
.pcard h3{font-size:13px;font-weight:600;margin-bottom:5px;display:flex;align-items:center;gap:7px}
.pcard p{font-size:12px;margin:0;line-height:1.65}
.pcard.click{cursor:pointer;transition:all .15s}
.pcard.click:hover{border-color:var(--accent);transform:translateY(-1px)}
.tag{font-family:var(--mono);font-size:9.5px;padding:1px 6px;border-radius:4px;background:var(--surf4);
  color:var(--text2)}
.ul{color:var(--text2);font-size:12.5px;line-height:1.85;padding-left:18px}
.ul li{margin-bottom:3px}
.ul code,.page code{font-family:var(--mono);font-size:11.5px;color:var(--amber);
  background:var(--surf1);padding:1px 5px;border-radius:4px}

/* -------------------------------------------------------- class flow */
.flow-wrap{flex:1;display:flex;min-height:0}
.flow-side{width:186px;flex:none;background:var(--surf1);border-right:1px solid var(--border);
  padding:9px 7px;overflow-y:auto}
.flow-group{font-size:9.5px;letter-spacing:.1em;color:var(--text3);padding:9px 7px 3px;font-weight:600}
.flow-item{display:block;width:100%;text-align:left;padding:5px 8px;border-radius:6px;
  font-family:var(--mono);font-size:10.5px;color:var(--text2)}
.flow-item:hover{background:var(--surf2);color:var(--text)}
.flow-item.on{background:var(--surf3);color:#fff}
.flow-main{flex:1;min-width:0;overflow:auto;padding:13px 15px}
.flow-head h2{font-size:16px;font-weight:600;margin:0}
.flow-head p{font-family:var(--mono);font-size:11px;color:var(--text3);margin:2px 0 0}
.fctl{display:flex;align-items:center;gap:9px;background:var(--surf2);border:1px solid var(--border);
  border-radius:8px;padding:7px 10px;margin:11px 0}
.fctl button{padding:3px 9px;border-radius:5px;background:var(--surf3);font-size:11.5px}
.fctl button:hover{background:var(--surf4)}
.fctl button.primary{background:var(--accent);color:#fff}
.fbar{flex:1;height:4px;border-radius:4px;background:var(--surf4);overflow:hidden}
.fbar i{display:block;height:100%;width:0;background:var(--amber);transition:width .35s ease}
.fcap{display:flex;gap:11px;background:var(--surf2);border:1px solid var(--border);border-radius:8px;
  padding:10px 13px;margin-bottom:11px;min-height:66px}
.fcap-n{flex:none;width:22px;height:22px;border-radius:50%;background:var(--amber);color:#3b2606;
  display:grid;place-items:center;font-size:11px;font-weight:700}
.fcap b{display:block;font-size:12.5px;font-weight:600;margin-bottom:2px}
.fcap p{margin:0;font-size:12px;color:var(--text2);line-height:1.7;max-width:80ch}
.fcap-idle{color:var(--text3);font-size:12px;align-self:center}
.diagram{background:var(--surf2);border:1px solid var(--border);border-radius:8px;padding:14px;overflow-x:auto}
.dgm{position:relative;display:grid;min-width:548px;gap:14px 14px}
.dgm-edges{position:absolute;left:0;top:0;pointer-events:none;z-index:1}
.edge{fill:none;stroke:var(--text3);stroke-width:1.4;opacity:.7}
.edge--dashed{stroke-dasharray:5 4}
.edge--wire{stroke:var(--cyan);stroke-width:1.6;stroke-dasharray:3 3}
.edge.is-on{stroke:var(--amber);stroke-width:2.4;opacity:1}
.edge.is-done{stroke:var(--text2);opacity:.75}
.edge.is-idle{opacity:.25}
.dnode{position:relative;z-index:2;align-self:center;justify-self:center;width:100%;max-width:194px;
  background:var(--surf1);border:1px solid var(--border);border-radius:8px;padding:7px 9px;
  transition:border-color .2s,opacity .2s}
.dnode b{display:block;font-family:var(--mono);font-size:11.5px;font-weight:500;word-break:break-word}
.dnode small{display:block;color:var(--text3);font-size:9.5px;margin-top:2px}
.dnode em{display:block;color:var(--text3);font-size:9.5px;font-style:normal;margin-top:4px;
  border-top:1px dashed var(--border);padding-top:4px}
.dnode .meth{display:block;font-family:var(--mono);font-size:9.5px;color:var(--text2);margin-top:5px;
  padding-top:5px;border-top:1px dashed var(--border)}
.dnode--class{background:linear-gradient(180deg,var(--surf3),var(--surf2));border-color:#33456a}
.dnode--thread{border-color:var(--green)}
.dnode--thread b{color:var(--green)}
.dnode--data{background:var(--bg);border-style:dashed}
.dnode--data b{color:var(--text2);font-weight:400}
.dnode--socket{border-color:var(--cyan);border-style:dashed}
.dnode--socket b{color:var(--cyan)}
.dnode--monitor{border-color:var(--amber)}
.dnode--monitor b{color:var(--amber)}
.dnode.is-on{border-color:var(--amber);box-shadow:0 0 0 3px rgba(245,158,11,.14)}
.dnode.is-on b{color:var(--amber)}
.dnode.is-idle{opacity:.35}
.elabel{position:absolute;z-index:3;transform:translate(-50%,-50%);pointer-events:none;
  font-family:var(--mono);font-size:9px;color:var(--text2);background:var(--surf2);
  border:1px solid var(--border);border-radius:5px;padding:1px 6px;white-space:nowrap}
.elabel.is-on{background:var(--amber);color:#3b2606;border-color:transparent;font-weight:700}
.elabel.is-idle{opacity:.3}
.boundary{position:absolute;top:0;bottom:0;border-left:1px dashed var(--cyan);opacity:.45;z-index:0}
.boundary-tag{position:absolute;top:-8px;transform:translateX(-50%);font-family:var(--mono);
  font-size:9px;color:var(--cyan);background:var(--surf2);padding:0 6px;white-space:nowrap;z-index:3}
.side-tag{position:absolute;top:-10px;font-family:var(--mono);font-size:9px;letter-spacing:.1em;
  color:var(--text3);z-index:3}

/* --------------------------------------------------------- challenge */
.q{background:var(--surf2);border:1px solid var(--border);border-radius:10px;padding:14px 16px;margin-bottom:12px}
.q-head{display:flex;align-items:center;gap:9px;margin-bottom:9px}
.q-n{width:22px;height:22px;flex:none;border-radius:50%;background:var(--surf4);display:grid;
  place-items:center;font-size:11px;font-weight:700}
.q.right .q-n{background:var(--green);color:#03291d}
.q.wrong .q-n{background:var(--red);color:#fff}
.q-head b{font-size:13px;font-weight:600}
.q-code{background:var(--surf1);border:1px solid var(--border);border-radius:7px;padding:9px 11px;
  font-family:var(--mono);font-size:11.5px;line-height:1.8;white-space:pre-wrap;margin-bottom:10px}
.slot{display:inline-block;min-width:118px;background:var(--surf3);border:1px dashed var(--amber);
  border-radius:5px;padding:0 6px;color:var(--amber);cursor:pointer}
.slot:hover{background:var(--surf4)}
.opts{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:9px}
.opt{font-family:var(--mono);font-size:11px;padding:4px 11px;border-radius:6px;background:var(--surf3);
  color:var(--text2);border:1px solid transparent}
.opt:hover{color:var(--text);border-color:var(--text3)}
.opt.pick{border-color:var(--accent);color:#fff;background:var(--surf4)}
.fb{border-radius:7px;padding:9px 12px;font-size:12px;line-height:1.7;margin-top:8px}
.fb.ok{background:rgba(16,185,129,.1);border:1px solid var(--green);color:#a7f3d0}
.fb.no{background:rgba(239,68,68,.1);border:1px solid var(--red);color:#fecaca}
.fb b{color:#fff}
.fb .out{font-family:var(--mono);font-size:10.5px;color:var(--text2);background:var(--surf1);
  border-radius:5px;padding:6px 9px;margin-top:7px;white-space:pre-wrap}
.score-chip{font-family:var(--mono);font-size:12px;color:var(--amber);border:1px solid var(--amber);
  border-radius:6px;padding:2px 10px}

/* ------------------------------------------------------------ toasts */
.toasts{position:fixed;left:212px;bottom:56px;display:grid;gap:7px;z-index:50}
.toast{background:var(--surf3);border:1px solid var(--border);border-left:3px solid var(--accent);
  border-radius:7px;padding:8px 13px;font-size:12px;max-width:310px;animation:tin .25s ease;
  box-shadow:0 8px 24px rgba(0,0,0,.45)}
.toast.warn{border-left-color:var(--amber)}
.toast.bad{border-left-color:var(--red)}
.toast.good{border-left-color:var(--green)}
@keyframes tin{from{opacity:0;transform:translateX(-18px)}}

.ctrl-strip{display:flex;flex-wrap:wrap;align-items:center;gap:7px;padding:7px 11px;
  border-bottom:1px solid var(--border);background:var(--surf1);font-size:11.5px;color:var(--text2)}
.ctrl-strip .sb-btn{padding:3px 9px;font-size:11px}
.ctrl-strip label{display:flex;align-items:center;gap:5px;font-family:var(--mono);font-size:10.5px}
.ctrl-strip input[type=range]{width:64px;accent-color:var(--accent)}
.ctrl-strip input[type=checkbox]{accent-color:var(--red)}

/* client row = its own pair of wires, then its terminal */
.cli-row{display:flex;align-items:stretch;min-height:74px}
.wire-cell{width:58px;flex:none;position:relative}
.cli-row .term{flex:1;min-width:0}

@media (max-width:900px){
  html,body{overflow:auto;height:auto}
  .app-body{flex-direction:column}
  .sidebar{width:100%;flex-direction:row;overflow-x:auto;gap:4px;align-items:center;padding:6px}
  .nav-head,.legend{display:none}
  .nav-item{width:auto;white-space:nowrap;border-left:0;border:1px solid var(--border)}
  .split{flex-direction:column}
  .java-pane{width:100%;max-width:none;border-left:0;border-top:1px solid var(--border);height:300px}
  .band-net{flex-direction:column}
  .srv-col,.cli-col{width:100%}
  .wire-col{width:100%;height:26px}
  .flow-wrap{flex-direction:column}
  .flow-side{width:100%;display:flex;overflow-x:auto;gap:5px}
  .flow-group{display:none}
  .flow-item{width:auto;white-space:nowrap;border:1px solid var(--border)}
  .toasts{left:8px;right:8px;bottom:8px}
  .toast{max-width:none}
}
</style>

<script>
'use strict';
/* =====================================================================
 * MathicsArena
 * A simulated socket server, a thread per player, and one synchronized
 * method that decides who answered first.
 *
 * Nothing here is narrated that the engine did not actually do: every
 * thread owns a list of instructions and executes exactly one of them
 * per tick, so the race on screen is a real race between two program
 * counters, not an animation of one.
 * ===================================================================== */

/* ------------------------------------------------------- Java sources */
/* One line = one addressable object. `since` is the stage the line first
 * appears in, `until` the last stage it survives. Instruction lists point
 * at these ids, so the highlight and the execution can never drift. */
const L = (id, since, h, until) => ({ id: id, since: since, h: h, until: until || 9 });

const CLASSES = {
  MathicsServer: [

    L('srv.f3', 4, '    <span class="kw">private</span> <span class="ty">GameManager</span> gameManager = <span class="kw">new</span> <span class="ty">GameManager</span>(<span class="kw">this</span>);'),

    L('srv.m1', 1, '    <span class="kw">public void</span> <span class="fn">startServer</span>() <span class="kw">throws</span> IOException {'),
    L('srv.bind', 1, '        <span class="ty">ServerSocket</span> serverSocket = <span class="kw">new</span> <span class="ty">ServerSocket</span>(port);'),
    L('srv.log', 1, '        System.out.<span class="fn">println</span>(<span class="st">"MathicsArena listening on "</span> + port);'),
    L('srv.while', 1, '        <span class="kw">while</span> (<span class="kw">true</span>) {'),
    L('srv.accept', 1, '            <span class="ty">Socket</span> socket = serverSocket.<span class="fn">accept</span>();  <span class="cm">// waits right here</span>'),
    L('srv.s1in', 1, '            <span class="ty">BufferedReader</span> in = <span class="kw">new</span> <span class="ty">BufferedReader</span>(', 1),
    L('srv.s1in2', 1, '                <span class="kw">new</span> <span class="ty">InputStreamReader</span>(socket.<span class="fn">getInputStream</span>()));', 1),

    L('srv.s1loop', 1, '            <span class="kw">while</span> (in.<span class="fn">readLine</span>() != <span class="kw">null</span>) { }  <span class="cm">// and nobody else gets in</span>', 1),
    L('srv.mk', 2, '            <span class="ty">ClientHandler</span> handler = <span class="kw">new</span> <span class="ty">ClientHandler</span>(socket, <span class="kw">this</span>);'),
    L('srv.add', 2, '            activeClients.<span class="fn">add</span>(handler);'),

  ClientHandler: [

    L('ch.end', 2, '}')
  ],

  GameManager: [
    L('gm.class', 4, '<span class="kw">public class</span> <span class="ty">GameManager</span> {'),
    L('gm.f0', 4, '    <span class="kw">private</span> <span class="ty">MathicsServer</span> server;'),
    L('gm.f1', 4, '    <span class="kw">private</span> <span class="ty">Map</span>&lt;<span class="ty">String</span>, <span class="ty">Integer</span>&gt; playerScores = <span class="kw">new</span> <span class="ty">HashMap</span>&lt;&gt;();'),
    L('gm.f2', 4, '    <span class="kw">private int</span> currentAnswer;'),

    L('gm.gap', 4, '                <span class="fn">pause</span>(<span class="nu">1500</span>);'),
    L('gm.endfor', 4, '            }'),
    L('gm.board', 4, '            <span class="fn">broadcastLeaderboard</span>();'),
    L('gm.loop3', 4, '        }).<span class="fn">start</span>();'),
    L('gm.loop4', 4, '    }'),
    L('gm.gap3', 4, ''),
    L('gm.gen1', 4, '    <span class="kw">public</span> <span class="ty">String</span> <span class="fn">generateMathProblem</span>() {'),

    L('gm.gap4', 4, ''),
    L('gm.sig', 4, '    <span class="kw">public</span> <span class="kw" id="syncKw">synchronized</span> <span class="kw">boolean</span> <span class="fn">submitAnswer</span>('),
    L('gm.sig2', 4, '            <span class="ty">String</span> player, <span class="kw">int</span> answer) {'),

/* ------------------------------------------------------------- state */

function blankSim(stage) {
  return {
    stage: stage,
    tick: 0,
    totalTicks: stage === 1 ? 26 : stage === 4 ? 96 : 60,
    threads: [],
    clients: [],
    server: { bound: false, port: 8080, pending: [], activeClients: [], closed: false },
    monitor: { owner: null, entry: [] },
    game: { on: false, round: 0, rounds: 3, problem: '', currentAnswer: 0,
            isRoundActive: false, scores: {}, winners: 0, doubled: false },
    opts: { sync: true, listener: stage >= 3, players: stage === 4 ? 3 : 0 },
    bias: 0, flying: [], trace: [], banner: '', log: [], nextId: 1, changed: {}
  };
}

const byId = (id) => sim.threads.find((t) => t.id === id);
const clientOf = (cid) => sim.clients.find((c) => c.id === cid);
const liveHandlers = () => sim.threads.filter((t) => t.kind === 'handler' && t.state !== 'TERMINATED');

/** Handlers are visited in an order the JVM never promises. `bias` is that
 *  promise-less order, and flipping it is what "re-run this race" does. */
function threadsInOrder() {
  const hs = sim.threads.filter((t) => t.kind === 'handler');
  const rest = sim.threads.filter((t) => t.kind !== 'handler');
  const ordered = sim.bias ? hs.slice().reverse() : hs.slice();
  return rest.concat(ordered);
}

function addThread(o) {
  const t = Object.assign({
    id: 'T' + sim.nextId++, pc: 0, state: 'RUNNABLE', doing: '', blockedOn: null,
    hist: [], tmp: null, won: false, color: '#64748b', kind: 'other'
  }, o);
  sim.threads.push(t);
  return t;
}

function addClient(name, idx) {
  const c = {
    id: 'c' + (idx + 1), name: name, color: PLAYER_COLORS[idx], socket: null,
    remotePort: 52300 + idx * 7 + 11, console: [], toServer: [], toClient: [],
    armed: -1, pending: null, reaction: idx === 2 ? 5 : 3, wrong: false,
    typing: '', hang: false, dead: false, unread: 0
  };
  sim.clients.push(c);
  return c;
}

/* ------------------------------------------------------------- wiring */
function sendToClient(c, label, kind) {
  if (!c || c.dead) return;
  c.toClient.push({ text: label, kind: kind });
  sim.flying.push({ id: 'f' + Math.random(), client: c.id, dir: 'toClient', label: label, kind: kind });
}
function sendToServer(c, label, kind) {
  c.toServer.push({ text: label, kind: kind });
  sim.flying.push({ id: 'f' + Math.random(), client: c.id, dir: 'toServer', label: label, kind: kind });
}
function broadcast(label, kind) {
  sim.clients.forEach((c) => { if (c.socket) sendToClient(c, label, kind); });
  sim.log.push(label);
}
function printTo(c, text, cls) {
  c.console.push({ t: text, c: cls || '' });
  if (c.console.length > 40) c.console.shift();
}
/** Whatever the listener thread is not there to read stays in the socket
 *  buffer. This is the only place unread text ever reaches the screen. */
function drainInbox(c) {
  while (c.toClient.length) {
    const m = c.toClient.shift();
    printTo(c, m.text, m.kind === 'verdict' ? 'hit' : m.kind === 'reject' ? 'miss' : '');
  }
  c.unread = 0;
}

function mark(key) { sim.changed[key] = sim.tick; }
function isFresh(key) { return sim.changed[key] === sim.tick; }

/* --------------------------------------------------------- the rounds */
function openRound() {
  const g = sim.game;
  g.round++;
  const a = 2 + Math.floor(Math.random() * 18), b = 2 + Math.floor(Math.random() * 9),
        cc = 1 + Math.floor(Math.random() * 9);
  g.problem = a + ' * ' + b + ' - ' + cc;
  g.currentAnswer = a * b - cc;
  g.isRoundActive = true;
  g.winners = 0;
  mark('isRoundActive'); mark('currentAnswer');
  sim.clients.forEach((c) => {
    if (!c.socket || c.dead) return;
    c.armed = c.reaction;
    c.pending = String(c.wrong ? g.currentAnswer + 3 : g.currentAnswer);
  });
}

        if (c.dead) { th.state = 'TERMINATED'; return 'wait'; }
        if (c.pending === null) { c.typing = ''; return 'wait'; }
        if (c.armed > 0) { c.armed--; c.typing = c.pending.slice(0, c.pending.length - c.armed + 1); return 'wait'; }
        th.tmp = c.pending; c.pending = null; c.typing = '';
        return 'next';
      } },
    { line: 'cl.send', cls: 'MathicsClient', doing: 'out.println(typed)',
      run: function (th) {
        const c = clientOf(th.clientId);
        printTo(c, '> ' + th.tmp, 'me');
        sendToServer(c, th.tmp, 'answer');
        if (!sim.opts.listener) drainInbox(c);   /* only now does she see anything */
        return { goto: 'cl.next' };
      } }
  ],

  /* ---- the client's second thread: its only job is to listen */
  listener: [
    { line: 'sl.read', cls: 'ServerListener', doing: 'in readLine()', io: true,
      run: function (th) {
        const c = clientOf(th.clientId);
        if (c.dead || sim.server.closed) { th.state = 'TERMINATED'; return 'wait'; }
        if (!c.toClient.length) return 'wait';
        th.tmp = c.toClient.shift();
        return 'next';
      } },
    { line: 'sl.print', cls: 'ServerListener', doing: 'printing it, mid-typing',
      run: function (th) {
        const c = clientOf(th.clientId);
        printTo(c, th.tmp.text, th.tmp.kind === 'verdict' ? 'hit' : th.tmp.kind === 'reject' ? 'miss' : '');
        return { goto: 'sl.read' };
      } }
  ]
};

/* --------------------------------------------------------- the engine */
function pcOf(progName, lineId) {
  const p = PROGS[progName];
  for (let i = 0; i < p.length; i++) if (p[i].line === lineId) return i;
  return 0;
}

/** One tick. Every RUNNABLE thread executes exactly one instruction. */
function tick() {
  if (sim.tick >= sim.totalTicks) { pause(); return; }
  sim.tick++;
  sim.flying = [];

  /* a freed monitor is handed to one waiting thread, and the order it is
     handed out in is exactly the thing nobody gets to predict */
  if (sim.opts.sync && sim.monitor.owner === null && sim.monitor.entry.length) {
    const queue = sim.bias ? sim.monitor.entry.slice().reverse() : sim.monitor.entry.slice();
    const id = queue[0];
    sim.monitor.entry = sim.monitor.entry.filter(function (x) { return x !== id; });
    sim.monitor.owner = id;
    const t = byId(id);
    if (t) { t.state = 'RUNNABLE'; t.blockedOn = null; }
  }
  if (!sim.opts.sync) { sim.monitor.owner = null; sim.monitor.entry = []; }

  threadsInOrder().forEach(function (th) {
    if (th.state === 'TERMINATED' || th.state === 'NEW' || th.state === 'BLOCKED') return;
    const prog = PROGS[th.prog];
    const ins = prog[th.pc];
    if (!ins) return;
    th.cls = ins.cls;
    th.doing = ins.doing;
    const r = ins.run(th);
    th.moved = r !== 'wait';
    if (r === 'next') th.pc = Math.min(th.pc + 1, prog.length - 1);
    else if (r && r.goto) th.pc = pcOf(th.prog, r.goto);
    if (th.state !== 'TERMINATED' && th.state !== 'BLOCKED') {
      th.state = (r === 'wait' && ins.wait) ? 'WAITING' : 'RUNNABLE';
    }
  });

  sim.clients.forEach(function (c) { c.unread = c.toClient.length; });
  sim.threads.forEach(function (th) {
    if (th.state === 'TERMINATED') th.doing = 'finished';
    th.hist.push(th.state[0]);
    if (th.hist.length > 30) th.hist.shift();
  });
  /* ordinary reads scroll away; a tick where two threads both read the
     same field stays on screen, because that is the evidence */
  const seen = {};
  sim.trace.forEach(function (r) { seen[r.tick] = (seen[r.tick] || 0) + 1; });
  sim.trace = sim.trace.filter(function (r) { return r.tick >= sim.tick - 1 || seen[r.tick] > 1; });
  render();
}

function play() {
  if (ui.running) return pause();
  ui.running = true;
  ui.timer = setInterval(tick, 620 / (ui.speed || 1));
  renderStepBar();
}
function pause() {
  ui.running = false;
  clearInterval(ui.timer);
  renderStepBar();
}
function step() { pause(); tick(); }

function toast(msg, kind) {
  const host = document.getElementById('toasts');
  const el = document.createElement('div');
  el.className = 'toast ' + (kind || '');
  el.textContent = msg;
  host.appendChild(el);
  setTimeout(function () { el.remove(); }, 3400);
}

/* ------------------------------------------------------ stage set-up */
function setupStage(n) {
  pause();
  sim = blankSim(n === 'free' ? 4 : n);
  sim.mode = n;
  if (n === 'free') { sim.totalTicks = 999; sim.opts.players = 2; }

  addThread({ kind: 'srvmain', name: 'main (server)', machine: 'server', cls: 'MathicsServer',
    prog: n === 1 ? 'srv1' : 'srv2', color: '#64748b', doing: 'starting' });

  if (n === 3) { connectPlayer(0); }
  if (n === 4) { for (let i = 0; i < 3; i++) connectPlayer(i); sim.clients[2].reaction = 5; }
  if (n === 'free') { for (let i = 0; i < 2; i++) connectPlayer(i); }
  render();
}

function connectPlayer(idx) {
  if (sim.clients.length > idx && sim.clients[idx].socket) return;
  if (sim.clients.length > idx) return;
  if (idx > 3) return;
  const c = addClient(PLAYER_NAMES[idx], idx);
  addThread({ kind: 'clientmain', name: 'main (' + c.name + ')', machine: c.id,
    cls: 'MathicsClient', prog: sim.stage >= 3 ? 'client2' : 'client1',
    clientId: c.id, color: c.color, doing: 'connecting' });
  render();
}

function addAnother() {
  const idx = sim.clients.length;
  if (idx > 3) return toast('Four terminals is all this canvas can hold', 'warn');
  connectPlayer(idx);
  toast(PLAYER_NAMES[idx] + ' knocks on port 8080', 'good');
}

function killClient() {
  const live = sim.clients.filter(function (c) { return c.socket && !c.dead; });
  if (!live.length) return;
  const c = live[live.length - 1];
  c.dead = true;
  toast(c.name + ' dropped - the handler will see readLine() return null', 'warn');
  render();
}

function chaos() {
  if (!sim.game.isRoundActive) return toast('Start a round first', 'warn');
  sim.clients.forEach(function (c) {
    if (c.socket && !c.dead) { c.armed = 0; c.pending = String(sim.game.currentAnswer); }
  });
  toast('Every player answers on the same tick', 'warn');
  render();
}

function manualRound() {
  if (!sim.game.on) {
    sim.game.on = true;
    addThread({ kind: 'gm', name: 'GameMaster', machine: 'server', cls: 'GameManager',
      prog: 'gm', color: '#f59e0b', doing: 'starting the game loop' });
    sim.game.rounds = 99;
  }
  render();
}

function serverSays() {
  broadcast('Ping from the server at tick ' + sim.tick, 'problem');
  toast('One broadcast sent', 'good');
  render();
}
function typeNow() {
  const c = sim.clients[0];
  if (!c || !c.socket) return;
  c.pending = '42'; c.armed = 2;
  toast(c.name + ' starts typing', 'good');
  render();
}

function reRunRace() {
  sim.bias = sim.bias ? 0 : 1;
  const keep = { sync: sim.opts.sync, listener: sim.opts.listener, players: sim.opts.players };
  const bias = sim.bias, mode = sim.mode;
  setupStage(mode);
  sim.bias = bias; sim.opts = keep; sim.mode = mode;
  toast('Same race, the other scheduling order - watch who wins now', 'warn');
  render();
}

function toggleSync() {
  sim.opts.sync = !sim.opts.sync;
  if (!sim.opts.sync) { sim.monitor.owner = null; sim.monitor.entry = []; }
  sim.threads.forEach(function (t) { if (t.state === 'BLOCKED') { t.state = 'RUNNABLE'; t.blockedOn = null; } });
  toast(sim.opts.sync ? 'synchronized is back on' : 'synchronized removed - nothing guards the round now',
    sim.opts.sync ? 'good' : 'bad');
  render();
}
function toggleListener() {
  sim.opts.listener = !sim.opts.listener;
  if (!sim.opts.listener) {
    sim.threads.forEach(function (t) {
      if (t.kind !== 'listener') return;
      /* it may be holding a line it has read but not yet printed - that
         line belongs back in the buffer, not in the bin */
      if (t.tmp && PROGS.listener[t.pc] && PROGS.listener[t.pc].line === 'sl.print') {
        clientOf(t.clientId).toClient.unshift(t.tmp);
      }
      t.state = 'TERMINATED';
    });
    toast('ServerListener stopped - nothing reads the socket until you press Enter', 'bad');
  } else {
    sim.clients.forEach(function (c) {
      if (c.socket && !sim.threads.some(function (t) { return t.kind === 'listener' && t.clientId === c.id && t.state !== 'TERMINATED'; })) {
        addThread({ kind: 'listener', name: 'listener(' + c.name + ')', machine: c.id,
          cls: 'ServerListener', prog: 'listener', clientId: c.id, color: c.color });
      }
    });
    toast('ServerListener running - messages land the moment they arrive', 'good');
  }
  render();
}

/* ------------------------------------------------------- the canvas */
function render() {
  if (['home', 'challenge', 'reference', 'flow'].indexOf(ui.page) >= 0) { renderStepBar(); return; }
  renderCtrls(); renderServer(); renderClients(); renderLanes(); renderJava(); renderStepBar(); renderTop();
}

function renderTop() {
  document.getElementById('tbTick').innerHTML = '&#9201; tick ' + sim.tick;
  const lk = document.getElementById('tbLock');
  if (!sim.opts.sync) { lk.className = 'tb-chip lock'; lk.innerHTML = '&#9888; no monitor at all'; }
  else if (sim.monitor.owner) {
    lk.className = 'tb-chip lock';
    lk.innerHTML = '&#128274; held by ' + byId(sim.monitor.owner).name;
  } else { lk.className = 'tb-chip free'; lk.innerHTML = '&#128275; monitor free'; }
}

function renderCtrls() {
  const host = document.getElementById('ctrlStrip');
  const s = sim.mode;
  let h = '';
  if (s === 1) {
    h = '<button class="sb-btn" onclick="addAnother()">+ Connect a client</button>' +
        '<span>' + (sim.clients.length < 1 ? 'Connect the first player and watch accept() come back to life.'
          : sim.clients.length < 2 ? 'Now connect a second one. The server is still inside client 1.'
          : 'Client 2 is knocking, and nothing is listening. That is the whole problem with one thread.') + '</span>';
  } else if (s === 2) {
    h = '<button class="sb-btn" onclick="addAnother()">+ Connect a client</button>' +
        '<button class="sb-btn" onclick="serverSays()">Broadcast a message</button>' +
        '<span>Every connection gets a ClientHandler of its own, so accept() is free again immediately.</span>';
  } else if (s === 3) {
    h = '<button class="sb-btn" onclick="serverSays()">Server broadcasts now</button>' +
        '<button class="sb-btn" onclick="typeNow()">' + (sim.clients[0] ? sim.clients[0].name : 'Player') + ' starts typing</button>' +
        '<span>Turn the listener off, broadcast while she types, and see when it appears.</span>';
  } else if (s === 4) {
    h = '<span>Reaction delay</span>' + sim.clients.map(function (c, i) {
      return '<label style="color:' + c.color + '">' + c.name +
        '<input type="range" min="1" max="6" value="' + c.reaction + '" oninput="setReact(' + i + ',this.value)">' +
        '<b style="font-weight:400;color:var(--text3)">' + c.reaction + 't</b>' +
        '<input type="checkbox" ' + (c.wrong ? 'checked' : '') + ' onchange="setWrong(' + i + ',this.checked)" title="gets it wrong"></label>';
    }).join('') + '<span style="color:var(--text3)">tie = same delay</span>';
  } else if (s === 'free') {
    h = '<button class="sb-btn" onclick="addAnother()">+ Client</button>' +
        '<button class="sb-btn" onclick="manualRound()">Start rounds</button>' +
        '<button class="sb-btn" onclick="chaos()">&#9889; Chaos</button>' +
        '<button class="sb-btn" onclick="killClient()">Kill a client</button>' +
        '<button class="sb-btn" onclick="serverSays()">Broadcast</button>';
  }
  host.className = h ? 'ctrl-strip' : '';
  host.innerHTML = h;
}
function setReact(i, v) { sim.clients[i].reaction = +v; renderCtrls(); }
function setWrong(i, v) { sim.clients[i].wrong = v; }

function renderServer() {
  const g = sim.game, m = sim.monitor;
  let h = '<div class="card srv-card' + (sim.server.bound ? '' : ' off') + '">' +
    '<div class="srv-head"><i class="dot" style="background:' + (sim.server.bound ? 'var(--green)' : 'var(--text3)') + '"></i>' +
    '<b>MathicsServer</b><span class="port">:' + sim.server.port + '</span></div>' +
    '<div class="srv-sub">activeClients: [' +
      (sim.server.activeClients.map(function (id) { const t = byId(id); return t ? t.name : ''; }).join(', ') || ' ') +
    ']</div>';
  if (sim.server.pending.length) {
    h += '<div class="srv-sub" style="color:var(--amber)">OS backlog: ' +
      sim.server.pending.map(function (id) { return clientOf(id).name; }).join(', ') +
      ' &mdash; nobody is in accept()</div>';
  }

  if (sim.stage >= 4) {
    const cls = !sim.opts.sync ? 'gm-box unsync' : (m.owner ? 'gm-box locked' : 'gm-box');
    h += '<div class="' + cls + '">' +
      '<div class="gm-head"><b>GameManager</b><s>' +
        (!sim.opts.sync ? '&#9888;' : m.owner ? '&#128274;' : '&#128275;') + '</s></div>' +
      '<div class="gm-fields">' +
      '<span><i>currentAnswer</i> <b class="' + (isFresh('currentAnswer') ? 'valchange' : '') + '" style="color:var(--amber)">' + (g.currentAnswer || '-') + '</b></span>' +
      '<span><i>isRoundActive</i> <b class="' + (isFresh('isRoundActive') ? 'valchange' : '') + '" style="color:' + (g.isRoundActive ? 'var(--green)' : 'var(--red)') + '">' + g.isRoundActive + '</b></span>' +
      '<span><i>owner</i> <b style="color:var(--red)">' + (m.owner ? byId(m.owner).name : 'none') + '</b></span>' +
      '</div>';
    if (m.entry.length) {
      h += '<div class="entryset">entry set &middot; ' +
        m.entry.map(function (id) { return byId(id).name; }).join(', ') +
        ' waiting to enter the monitor</div>';
    }
    if (!sim.opts.sync) {
      h += '<div class="entryset" style="border-color:var(--amber);color:var(--amber)">no monitor &mdash; every thread walks straight in</div>';
    }
    h += '</div>';
  }
  h += '</div>';

  if (sim.stage >= 4) {
    const names = Object.keys(g.scores);
    const total = names.reduce(function (a, n) { return a + g.scores[n]; }, 0);
    h += '<div class="card scoreboard"><h4>SCOREBOARD &middot; round ' + g.round + ' / ' + (g.rounds > 90 ? '&infin;' : g.rounds) + '</h4>' +
      (names.length ? names.sort(function (a, b) { return g.scores[b] - g.scores[a]; }).map(function (n) {
        const c = sim.clients.find(function (x) { return x.name === n; });
        return '<div class="sb-row"><i class="dot" style="background:' + (c ? c.color : '#64748b') + '"></i>' + n +
          '<s>' + g.scores[n] + '</s></div>';
      }).join('') : '<div class="sb-row" style="color:var(--text3)">nothing scored yet</div>') +
      (total > g.round && g.round > 0
        ? '<div class="sb-row sb-bad">&#9888; ' + total + ' points in ' + g.round + ' round' + (g.round > 1 ? 's' : '') + '</div>'
        : '') +
      '</div>';
  }
  document.getElementById('srvCol').innerHTML = h;
  document.getElementById('wireCol').style.display = 'none';
}

function renderClients() {
  const h = sim.clients.map(function (c) {
    const fly = sim.flying.filter(function (f) { return f.client === c.id; });
    const wire = '<div class="wire-cell">' +
      '<div class="wire' + (fly.some(function (f) { return f.dir === 'toClient'; }) ? ' hot' : '') + '" style="top:38%"></div>' +
      '<div class="wire' + (fly.some(function (f) { return f.dir === 'toServer'; }) ? ' hot' : '') + '" style="top:58%"></div>' +
      (c.socket ? '<span class="wire-tag" style="top:calc(38% - 13px)">' + (sim.server.closed ? 'closed' : 'in / out') + '</span>' : '') +
      fly.map(function (f) {
        return '<span class="pk k-' + f.kind + ' ' + (f.dir === 'toClient' ? 'pk-out' : 'pk-in') + '" style="top:' +
          (f.dir === 'toClient' ? '38%' : '58%') + '">' + esc(f.label.slice(0, 22)) + '</span>';
      }).join('') +
      '</div>';

    const th = sim.threads.filter(function (t) { return t.machine === c.id && t.state !== 'TERMINATED'; });
    const blocked = sim.threads.some(function (t) { return t.clientId === c.id && t.state === 'BLOCKED'; });
    const won = sim.log.some(function (l) { return l.indexOf(c.name + ' answered first') === 0; });
    const cls = c.dead ? 'term' : c.hang ? 'term hang' : blocked ? 'term blocked' : won ? 'term win' : 'term';
    const body = c.console.slice(-5).map(function (l) {
      return '<div class="' + l.c + '">' + esc(l.t) + '</div>';
    }).join('') || '<div style="color:var(--text3)">(nothing yet)</div>';

    const inputRow = c.socket && !c.dead && sim.stage >= 3
      ? '<div class="me">&gt; ' + esc(c.typing) + '<span class="caret"></span></div>' : '';
    const unread = c.unread && !sim.opts.listener
      ? '<div style="color:var(--amber)">[' + c.unread + ' unread sitting in the socket buffer]</div>' : '';

    return '<div class="cli-row">' + wire +
      '<div class="' + cls + '">' +
        '<div class="term-bar"><i style="background:#ef4444"></i><i style="background:#f59e0b"></i>' +
        '<i style="background:#10b981"></i><s>&#128421; ' + c.name +
        (c.socket ? ' @ localhost:' + c.remotePort : '') + '</s>' +
        '<u>' + (c.dead ? 'disconnected' : c.hang ? '<span class="spin">&#9696;</span> waiting for accept()'
          : c.socket ? th.length + ' thread' + (th.length === 1 ? '' : 's') : 'not connected') + '</u></div>' +
        '<div class="term-body">' + body + unread + inputRow + '</div>' +
      '</div></div>';
  }).join('');
  document.getElementById('cliCol').innerHTML = h ||
    '<div style="color:var(--text3);font-size:12px;padding:10px">No client has connected yet.</div>';
}

function esc(s) {
  return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) {
    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c];
  });
}

const FILL = { R: 'var(--green)', B: 'var(--red)', W: 'var(--purple)', N: '#334155', T: '#334155' };

function renderLanes() {
  const h = sim.threads.map(function (t) {
    const cells = t.hist.slice(-28).map(function (ch, i, a) {
      return '<i class="' + (i === a.length - 1 ? 'now' : '') + '" style="background:' + FILL[ch] + '"></i>';
    }).join('');
    const ins = PROGS[t.prog] && PROGS[t.prog][t.pc];
    const io = ins && ins.io && t.state === 'RUNNABLE';
    return '<div class="lane">' +
      '<span class="lane-name" style="color:' + t.color + '">' + t.name + '</span>' +
      '<span class="lane-cells">' + cells + '</span>' +
      '<span class="st-chip st-' + t.state + '">' + t.state + '</span>' +
      '<span class="lane-doing"><b>' + esc(t.doing) + '</b>' +
        (io ? '<span class="info" title="A thread parked in accept() or readLine() is still RUNNABLE to the JVM. BLOCKED means one thing only: waiting for a monitor.">i</span>' : '') +
      '</span></div>';
  }).join('');
  document.getElementById('lanes').innerHTML = h;

  const races = {};
  sim.trace.forEach(function (r) { races[r.tick] = (races[r.tick] || 0) + 1; });
  let tr = sim.trace.map(function (r) {
    return '<div class="' + (races[r.tick] > 1 ? 'race' : '') + '">T' + r.tick +
      ' &#9474; <span style="color:' + r.color + '">' + r.who + '</span>: ' + r.text + '</div>';
  }).join('');
  if (Object.keys(races).some(function (k) { return races[k] > 1; }) && !sim.opts.sync) {
    tr += '<div class="race">&#8593; both read before either wrote. That is the bug.</div>';
  }
  if (sim.banner) tr += '<div class="banner"><b>' + esc(sim.banner) + '</b> &mdash; ' +
    'with no monitor, two threads passed the same guard and both scored.</div>';
  document.getElementById('trace').innerHTML = tr;
  document.getElementById('laneNote').innerHTML = sim.threads.length + ' threads &middot; one instruction each per tick';
}

/* ------------------------------------------------------- the Java pane */
function activeLines() {
  const map = {};
  sim.threads.forEach(function (t) {
    if (t.state === 'TERMINATED' || t.state === 'NEW') return;
    const ins = PROGS[t.prog] && PROGS[t.prog][t.pc];
    if (!ins) return;
    (map[ins.line] = map[ins.line] || []).push(t);
  });
  return map;
}

function renderJava() {
  const map = activeLines();
  /* follow whatever actually moved this tick, and when several did, follow
     the one furthest inside the program - a thread standing still in
     readLine() is not what anybody wants to be reading */
  if (!ui.pinned) {
    const RANK = { GameManager: 5, ClientHandler: 4, MathicsServer: 3, ServerListener: 2, MathicsClient: 1 };
    let best = null, bestN = 0;
    sim.threads.forEach(function (t) {
      if (!t.moved || t.state === 'TERMINATED') return;
      const ins = PROGS[t.prog] && PROGS[t.prog][t.pc];
      const cls = ins ? ins.cls : t.cls;
      if (!cls || CLASS_SINCE[cls] > sim.stage) return;
      if (RANK[cls] > bestN) { bestN = RANK[cls]; best = cls; }
    });
    if (best) ui.jtab = best;
  }

  document.getElementById('jtabs').innerHTML = CLASS_ORDER.map(function (name) {
    const locked = CLASS_SINCE[name] > sim.stage;
    return '<button class="jtab ' + (locked ? 'locked' : name === ui.jtab ? 'on' : '') + '"' +
      (locked ? ' title="not written yet - arrives in stage ' + CLASS_SINCE[name] + '"' : ' onclick="pickTab(\'' + name + '\')"') +
      '>' + name + (locked ? ' &#128274;' : '') + '</button>';
  }).join('');

  const lines = CLASSES[ui.jtab].filter(function (l) { return l.since <= sim.stage && l.until >= sim.stage; });
  let n = 0;
  document.getElementById('jcode').innerHTML = lines.map(function (l) {
    n++;
    const here = (map[l.id] || []).filter(function (t) { return t.cls === ui.jtab || true; });
    const blockedHere = l.id === 'ch.submit'
      ? sim.threads.filter(function (t) { return t.state === 'BLOCKED'; }) : [];
    const all = here.concat(blockedHere);
    const on = here.some(function (t) { return t.state === 'RUNNABLE'; });
    let html = l.h;
    if (l.id === 'gm.sig' && !sim.opts.sync) {
      html = html.replace('<span class="kw" id="syncKw">synchronized</span>',
        '<span class="kw strike">synchronized</span>');
    }
    return '<div class="jline' + (on ? ' on' : blockedHere.length && l.id === 'ch.submit' ? ' blk' : '') +
      (l.since === sim.stage && CLASS_SINCE[ui.jtab] < sim.stage ? ' fresh' : '') + '">' +
      '<i>' + n + '</i><em>' + html + '</em>' +
      (all.length ? '<span class="badges">' + all.map(function (t) {
        return '<b class="badge' + (t.state === 'BLOCKED' ? ' wait' : '') + '" style="background:' + t.color +
          '" title="' + esc(t.name + ' - ' + t.state) + '">' + t.name.replace(/[^A-Za-z]/g, '').slice(-5, -4).toUpperCase() +
          (t.state === 'BLOCKED' ? '' : '') + '</b>';
      }).join('') + '</span>' : '') +
      '</div>';
  }).join('');

  const pane = document.getElementById('jcode');
  const lit = pane.querySelector('.jline.on') || pane.querySelector('.jline.blk');
  if (lit && !ui.pinned) {
    const want = lit.offsetTop - pane.clientHeight / 2 + 20;
    if (Math.abs(pane.scrollTop - want) > 30) pane.scrollTop = Math.max(0, want);
  }

  const running = sim.threads.filter(function (t) { return t.state === 'RUNNABLE' && t.cls === ui.jtab; });
  document.getElementById('jExec').innerHTML = running.length
    ? '&#9654; executing: ' + running.map(function (t) { return t.name; }).join(', ')
    : '&#9654; idle in this file';
  document.getElementById('jPin').className = 'jbtn' + (ui.pinned ? ' on' : '');
}
function pickTab(n) { ui.jtab = n; ui.pinned = true; renderJava(); }
function togglePin() { ui.pinned = !ui.pinned; renderJava(); }
function copyClass() {
  const lines = CLASSES[ui.jtab].filter(function (l) { return l.since <= sim.stage && l.until >= sim.stage; });
  const d = document.createElement('div');
  const text = lines.map(function (l) { d.innerHTML = l.h; return d.textContent; }).join('\n');
  if (navigator.clipboard) navigator.clipboard.writeText(text).then(
    function () { toast(ui.jtab + '.java copied', 'good'); },
    function () { toast('Could not reach the clipboard', 'bad'); });
  else toast('Could not reach the clipboard', 'bad');
}

const fs = { flow: null, step: -1, playing: false, speed: 1, timer: null };

function renderFlowSide() {
  const groups = [];
  FLOWS.forEach(function (f) {
    let g = groups.find(function (x) { return x.name === f.group; });
    if (!g) groups.push((g = { name: f.group, flows: [] }));
    g.flows.push(f);
  });
  document.getElementById('flowSide').innerHTML =
    '<div class="nav-head" style="padding:4px 7px">Flows</div>' +
    groups.map(function (g) {
      return '<div class="flow-group">' + g.name + '</div>' + g.flows.map(function (f) {
        return '<button class="flow-item' + (fs.flow && fs.flow.id === f.id ? ' on' : '') +
          '" onclick="loadFlow(\'' + f.id + '\')">' + f.name + '</button>';
      }).join('');
    }).join('');
}

function loadFlow(id) {
  fpause();
  fs.flow = FLOWS.find(function (f) { return f.id === id; }) || FLOWS[0];
  fs.step = -1;
  renderFlowSide();
  const f = fs.flow;
  const rows = Math.max.apply(null, f.nodes.map(function (n) { return n.row; })) + 1;
  const cols = Math.max.apply(null, f.nodes.map(function (n) { return n.col; })) + 1;
  document.getElementById('flowMain').innerHTML =
    '<div class="flow-head"><h2>' + esc(f.title) + '</h2><p>' + esc(f.subtitle) + '</p></div>' +
    '<div class="fctl">' +
      '<button onclick="fshow(-1)" title="restart">&#9198;</button>' +
      '<button onclick="fstep(-1)">&#9194;</button>' +
      '<button class="primary" id="fplay" onclick="ftoggle()">&#9654; Play</button>' +
      '<button onclick="fstep(1)">&#9193;</button>' +
      '<div class="fbar"><i id="fbar"></i></div>' +
      '<span class="mono" id="fprog" style="color:var(--text3);font-size:11px"></span>' +
      '<label class="mono" style="color:var(--text3);font-size:11px">speed ' +
        '<select class="mini-sel" onchange="fs.speed=+this.value">' +
          '<option value="0.5">0.5&times;</option><option value="1" selected>1&times;</option>' +
          '<option value="2">2&times;</option></select></label>' +
    '</div>' +
    '<div class="fcap" id="fcap"></div>' +
    '<div class="diagram"><div class="dgm" id="dgm" style="grid-template-columns:repeat(' + cols +
      ',minmax(0,1fr));min-height:' + (rows * 104) + 'px">' +
      '<svg class="dgm-edges" id="dgmEdges" aria-hidden="true"><defs>' +
        '<marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" ' +
        'orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="currentColor"/></marker>' +
      '</defs></svg>' +
      (f.crossing ? '<div class="boundary" style="left:50%"></div>' +
        '<span class="boundary-tag" style="left:50%">TCP :8080</span>' +
        '<span class="side-tag" style="left:0">SERVER SIDE</span>' +
        '<span class="side-tag" style="right:0">CLIENT SIDE</span>' : '') +
      f.nodes.map(nodeMarkup).join('') +
      f.edges.map(function (e) {
        return '<span class="elabel" data-elabel="' + e.id + '">' + esc(e.label) + '</span>';
      }).join('') +
    '</div></div>';
  fshow(-1);
  drawEdges();
  setTimeout(drawEdges, 90);
  fplay();
}

function nodeMarkup(n) {
  return '<div class="dnode dnode--' + n.kind + '" data-node="' + n.id + '" ' +
    'onclick="jumpToNode(\'' + n.id + '\')" style="grid-row:' + (n.row + 1) + ';grid-column:' + (n.col + 1) + '">' +
    '<b>' + esc(n.label) + '</b>' +

/** Lay the arrows out from where the boxes actually ended up. */
function drawEdges() {
  const inner = document.getElementById('dgm');
  const svg = document.getElementById('dgmEdges');
  if (!inner || !svg || !fs.flow) return;
  const box = inner.getBoundingClientRect();
  svg.setAttribute('viewBox', '0 0 ' + box.width + ' ' + box.height);
  svg.style.width = box.width + 'px';
  svg.style.height = box.height + 'px';
  Array.prototype.slice.call(svg.querySelectorAll('path.edge')).forEach(function (p) { p.remove(); });

  const rel = function (el) {
    const r = el.getBoundingClientRect();
    return { left: r.left - box.left, right: r.left - box.left + r.width,
      top: r.top - box.top, bottom: r.top - box.top + r.height,
      cx: r.left - box.left + r.width / 2, mid: r.top - box.top + r.height / 2 };
  };
  const obstacles = Array.prototype.slice.call(inner.querySelectorAll('[data-node]')).map(rel);
  const placed = [];

  fs.flow.edges.forEach(function (e) {
    const a = inner.querySelector('[data-node="' + e.from + '"]');
    const b = inner.querySelector('[data-node="' + e.to + '"]');
    if (!a || !b) return;
    const s = rel(a), t = rel(b);
    let d, anchor;
    if (e.from === e.to) {
      d = 'M' + s.right + ' ' + s.mid + ' C' + (s.right + 34) + ' ' + (s.mid - 26) + ',' +
          (s.right + 34) + ' ' + (s.mid + 26) + ',' + s.right + ' ' + (s.mid + 6);
      anchor = [s.right + 26, s.mid];
    } else if (t.top >= s.bottom - 2) {
      if (Math.abs(s.cx - t.cx) < 6) {
        d = 'M' + s.cx + ' ' + s.bottom + ' L' + t.cx + ' ' + t.top;
        anchor = [s.cx, (s.bottom + t.top) / 2];
      } else {
        const x1 = t.cx > s.cx ? s.right : s.left;
        d = 'M' + x1 + ' ' + s.mid + ' L' + t.cx + ' ' + s.mid + ' L' + t.cx + ' ' + t.top;
        anchor = [(x1 + t.cx) / 2, s.mid];
      }
    } else if (t.bottom <= s.top + 2) {
      const x1 = t.cx > s.cx ? s.right : s.left;
      d = 'M' + x1 + ' ' + s.mid + ' L' + t.cx + ' ' + s.mid + ' L' + t.cx + ' ' + t.bottom;
      anchor = [(x1 + t.cx) / 2, s.mid];
    } else {
      const fromRight = t.left > s.left;
      d = 'M' + (fromRight ? s.right : s.left) + ' ' + s.mid + ' L' + (fromRight ? t.left : t.right) + ' ' + t.mid;
      anchor = [((fromRight ? s.right : s.left) + (fromRight ? t.left : t.right)) / 2, (s.mid + t.mid) / 2];
    }
    const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
    path.setAttribute('d', d);
    path.setAttribute('class', 'edge' + (e.dashed ? ' edge--dashed' : '') + (e.wire ? ' edge--wire' : ''));
    path.setAttribute('marker-end', 'url(#ah)');
    path.dataset.edge = e.id;
    svg.appendChild(path);
    placeLabel(e, path, anchor, obstacles.concat(placed), s, t, placed);
  });
  paintFocus();
}

/** Put an arrow's caption on the line, but never on top of a box. */
function placeLabel(edge, path, anchor, obstacles, s, t, placed) {
  const label = document.querySelector('[data-elabel="' + edge.id + '"]');
  if (!label) return;
  label.hidden = !edge.label;
  if (!edge.label) return;
  const w = label.offsetWidth, h = label.offsetHeight;
  const clear = function (p) {
    return !obstacles.some(function (o) {
      return p[0] + w / 2 > o.left - 3 && p[0] - w / 2 < o.right + 3 &&
             p[1] + h / 2 > o.top - 3 && p[1] - h / 2 < o.bottom + 3;
    });
  };
  let point = anchor;
  if (!clear(point)) {
    const len = path.getTotalLength();
    const onLine = [0.5, 0.35, 0.65, 0.22, 0.78, 0.12, 0.88].map(function (f) {
      const p = path.getPointAtLength(len * f); return [p.x, p.y];
    });
    const offLine = onLine.reduce(function (acc, p) {
      acc.push([p[0], p[1] - h - 4]); acc.push([p[0], p[1] + h + 4]); return acc;
    }, []);
    const beside = [[anchor[0], Math.min(s.top, t.top) - h / 2 - 5],
                    [anchor[0], Math.max(s.bottom, t.bottom) + h / 2 + 5]];
    point = onLine.find(clear) || offLine.find(clear) || beside.find(clear) || anchor;
  }
  /* a wide caption near an edge would push the diagram wider than its box */
  const lim = document.getElementById('dgm');
  if (lim) point = [Math.min(Math.max(point[0], w / 2 + 2), lim.clientWidth - w / 2 - 2), point[1]];
  label.style.left = point[0] + 'px';
  label.style.top = point[1] + 'px';
  if (placed) placed.push({ left: point[0] - w / 2, right: point[0] + w / 2,
    top: point[1] - h / 2, bottom: point[1] + h / 2 });
}

function paintFocus() {
  if (!fs.flow) return;
  const now = {}, seen = {};
  if (fs.step >= 0) fs.flow.steps[fs.step].focus.forEach(function (f) { now[f] = 1; });
  fs.flow.steps.slice(0, Math.max(0, fs.step)).forEach(function (s) {
    s.focus.forEach(function (f) { seen[f] = 1; });
  });
  const mark = function (el, id) {
    el.classList.toggle('is-on', !!now[id]);
    el.classList.toggle('is-done', !now[id] && !!seen[id]);
    el.classList.toggle('is-idle', !now[id] && !seen[id]);
  };
  document.querySelectorAll('[data-node]').forEach(function (el) { mark(el, el.dataset.node); });
  document.querySelectorAll('[data-edge]').forEach(function (el) { mark(el, el.dataset.edge); });
  document.querySelectorAll('[data-elabel]').forEach(function (el) { mark(el, el.dataset.elabel); });
}

function fshow(i) {
  const steps = fs.flow.steps;
  fs.step = Math.max(-1, Math.min(i, steps.length - 1));
  const s = steps[fs.step];
  document.getElementById('fcap').innerHTML = s
    ? '<span class="fcap-n">' + (fs.step + 1) + '</span><div><b>' + esc(s.title) + '</b><p>' + esc(s.text) + '</p></div>'
    : '<span class="fcap-idle">Press Play to walk the diagram, or step with the arrow keys. Clicking a box jumps to it.</span>';
  document.getElementById('fprog').textContent = Math.max(0, fs.step + 1) + ' / ' + steps.length;
  document.getElementById('fbar').style.width = ((fs.step + 1) / steps.length * 100) + '%';
  paintFocus();
}
function fstep(d) { fpause(); fshow(fs.step + d); }
function jumpToNode(id) {
  const i = fs.flow.steps.findIndex(function (s) { return s.focus.indexOf(id) >= 0; });
  if (i > -1) { fpause(); fshow(i); }
}
function ftoggle() { fs.playing ? fpause() : fplay(); }
function fplay() {
  if (fs.step >= fs.flow.steps.length - 1) fshow(-1);
  fs.playing = true;
  const b = document.getElementById('fplay');
  if (b) b.innerHTML = '&#10073;&#10073; Pause';
  ftick();
}
function fpause() {
  fs.playing = false;
  clearTimeout(fs.timer);
  const b = document.getElementById('fplay');
  if (b) b.innerHTML = '&#9654; Play';
}
function ftick() {
  clearTimeout(fs.timer);
  if (!fs.playing) return;
  if (fs.step >= fs.flow.steps.length - 1) return fpause();
  fshow(fs.step + 1);
  fs.timer = setTimeout(ftick, 4200 / fs.speed);
}

const QUIZ = [
  {
    title: 'The missing keyword',
    code: '<span class="kw">public</span> <span class="slot" data-q="0">______</span> <span class="kw">boolean</span> <span class="fn">submitAnswer</span>(<span class="ty">String</span> player, <span class="kw">int</span> answer) {\n    <span class="kw">if</span> (!isRoundActive) <span class="kw">return false</span>;\n    isRoundActive = <span class="kw">false</span>;\n    playerScores.<span class="fn">merge</span>(player, <span class="nu">1</span>, <span class="ty">Integer</span>::sum);\n}',

      { t: 'volatile', ok: false, why: 'The distractor worth understanding. volatile is not even legal on a method, and on the field it would only make each read fresh - both threads still read true and both still walk through.', out: 'Arjun answered first! The answer was 50.\nBhavna answered first! The answer was 50.\nFINAL: 4 points across 3 rounds' },

      { t: 'isRoundActive = false;', ok: true, why: 'Right. The guard reads it and this line writes it. Put a gap between those two and a second thread can read true after the first has already decided to win.' },
      { t: 'the Integer.parseInt() call', ok: false, why: 'parseInt touches only a local variable. Threads never share locals, so it is safe anywhere.' },
      { t: 'the return statement', ok: false, why: 'A return cannot be moved out of the method it belongs to, and returning is not shared state.' }
    ]
  },

    q: 'Which line goes in the slot?',

      { t: 'h.run();', ok: false, why: 'run() is an ordinary method call. It executes the whole conversation on the accept thread, so the loop never comes back and the second client hangs - exactly the stage 1 bug, with a Thread subclass to make it look fixed.', out: 'Arjun connected.\nBhavna connecting... (waiting)\nBhavna connecting... (waiting)' },

      { t: 'new Thread(h).start(); after the loop', ok: false, why: 'The loop is while(true) - there is no after. Nothing below it will ever run.' },
      { t: 'nothing - the constructor already started it', ok: false, why: 'Starting a thread from inside its own constructor lets the new thread see a half-built object. It is a classic bug, not a shortcut.' }
    ]
  },
  {

    q: 'Bhavna types an answer and sees nothing on screen until she presses Enter - then four messages appear at once. Why?',
    opts: [

  document.getElementById('simView').style.display = isSim ? 'flex' : 'none';
  document.getElementById('flowView').style.display = page === 'flow' ? 'flex' : 'none';
  document.getElementById('viewToggle').style.display = isSim ? 'flex' : 'none';
  ['home', 'challenge', 'reference'].forEach(function (p) {
    document.getElementById('page-' + p).classList.toggle('on', p === page);
  });
  if (isSim) {
    setupStage(page === 'free' ? 'free' : +page.slice(5));
  } else if (page === 'flow') {
    renderFlowSide();
    loadFlow(fs.flow ? fs.flow.id : 'start-server');
  } else if (page === 'challenge') renderChallenge();
  renderStepBar();
  const m = document.getElementById('main');
  if (m) m.scrollTop = 0;
}

function setView(v) {
  ui.view = v;
  const col = document.getElementById('simView');
  col.classList.remove('v-net', 'v-thr');
  if (v !== 'split') col.classList.add('v-' + v);
  document.querySelectorAll('#viewToggle .view-btn').forEach(function (b, i) {
    b.classList.toggle('on', ['net', 'thr', 'split'][i] === v);
  });
}

document.addEventListener('keydown', function (e) {
  if (['INPUT', 'TEXTAREA', 'SELECT'].indexOf((document.activeElement || {}).tagName) >= 0) return;
  if (ui.page === 'flow') {
    if (e.key === 'ArrowRight') { e.preventDefault(); fstep(1); }
    else if (e.key === 'ArrowLeft') { e.preventDefault(); fstep(-1); }
    else if (e.key === ' ') { e.preventDefault(); ftoggle(); }
    return;
  }
  if (['stage1', 'stage2', 'stage3', 'stage4', 'free'].indexOf(ui.page) < 0) return;
  if (e.key === 'ArrowRight') { e.preventDefault(); step(); }
  else if (e.key === ' ') { e.preventDefault(); play(); }
});

let rsz = null;
window.addEventListener('resize', function () {
  clearTimeout(rsz);
  rsz = setTimeout(function () { if (ui.page === 'flow' && fs.flow) drawEdges(); }, 130);
}, { passive: true });

/* ---------------------------------------------------------------- boot */
sim = blankSim(1);
renderHome();
renderReference();
renderChallenge();
go('home');
</script>
</body>
</html>
