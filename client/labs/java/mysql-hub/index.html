<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>MySQL Hub</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@600;700;800&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root {
  color-scheme: light;
  --bg: #f6f5fb;
  --glow: rgba(178, 139, 220, .18);
  --card: #ffffff;
  --card-line: #e3e1ef;
  --rule: #e8e6f2;
  --text: #15132a;
  --body: #4a4766;
  --muted: #7a7794;
  --chip: #f1ecff;
  --focus: #6d4fd8;
  --bar: rgba(246, 245, 251, .9);
  --g1: #d9921c; --g2: #e2552a; --g3: #d24c6a; --g4: #8c5fd0;
  --amber: #b9740a; --amber-bg: #fdf1dc; --amber-line: #f0d7a8;
  --blue: #1f6fd1; --blue-bg: #e2eefc; --blue-line: #bcd5f4;
  --rose: #c2334d; --rose-bg: #fde7eb; --rose-line: #f3c2cb;
  --display: "Inter Tight", "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
  --sans: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --bg: #07070e;
    --glow: rgba(70, 90, 150, .16);
    --card: #100f1f;
    --card-line: #22203a;
    --rule: #2a2843;
    --text: #f1eefc;
    --body: #c9c3e6;
    --muted: #8e89ad;
    --chip: #1c1830;
    --focus: #b9a4ff;
    --bar: rgba(9, 9, 18, .88);
    --g1: #f4b740; --g2: #f0703c; --g3: #e46a7a; --g4: #b28bdc;
    --amber: #f2b13c; --amber-bg: #2b2213; --amber-line: #5a4520;
    --blue: #4fa8f2; --blue-bg: #13233b; --blue-line: #284a73;
    --rose: #ff7a8c; --rose-bg: #2c121a; --rose-line: #5e2432;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #07070e;
  --glow: rgba(70, 90, 150, .16);
  --card: #100f1f;
  --card-line: #22203a;
  --rule: #2a2843;
  --text: #f1eefc;
  --body: #c9c3e6;
  --muted: #8e89ad;
  --chip: #1c1830;
  --focus: #b9a4ff;
  --bar: rgba(9, 9, 18, .88);
  --g1: #f4b740; --g2: #f0703c; --g3: #e46a7a; --g4: #b28bdc;
  --amber: #f2b13c; --amber-bg: #2b2213; --amber-line: #5a4520;
  --blue: #4fa8f2; --blue-bg: #13233b; --blue-line: #284a73;
  --rose: #ff7a8c; --rose-bg: #2c121a; --rose-line: #5e2432;
}
html { scroll-padding-top: env(safe-area-inset-top, 0px); background: var(--bg); }
*, *::before, *::after { box-sizing: border-box; }
body {
  margin: 0; min-height: 100%;
  background: radial-gradient(1200px 600px at 85% -10%, var(--glow), transparent 70%), var(--bg);
  color: var(--text); font-family: var(--sans); font-size: 16px; line-height: 1.5;
  -webkit-font-smoothing: antialiased; -webkit-text-size-adjust: 100%;
}
button { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--focus); outline-offset: 3px; border-radius: 6px; }
[hidden] { display: none !important; }

/* ---------- hero ---------- */
.hero { max-width: 1040px; margin: 0 auto; padding: clamp(28px, 6vw, 56px) 20px 0; text-align: center; }
.wordmark {
  margin: 0; font-family: var(--display); font-weight: 800;
  font-size: clamp(2.6rem, 9.5vw, 7rem); line-height: 1; letter-spacing: -.045em;
}
.wordmark .grad {
  background: linear-gradient(90deg, var(--g1) 0%, var(--g2) 40%, var(--g3) 72%, var(--g4) 100%);
  -webkit-background-clip: text; background-clip: text; color: transparent;
}
.tip {
  display: flex; align-items: center; justify-content: center; gap: 10px;
  margin: 26px auto 0; max-width: 70ch; color: var(--muted); font-size: clamp(.92rem, 1.5vw, 1.02rem);
}
.tip svg { flex: none; }
.tip b { color: var(--text); font-weight: 600; }

/* ---------- cards ---------- */
.grid {
  max-width: 1360px; margin: clamp(36px, 6vw, 64px) auto 0; padding: 0 20px 64px;
  display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 290px), 340px)); justify-content: center; gap: 24px;
}
.card {
  --accent: var(--amber); --accent-bg: var(--amber-bg); --accent-line: var(--amber-line);
  display: flex; flex-direction: column; padding: 26px 26px 22px;
  background: var(--card); border: 1px solid var(--card-line); border-radius: 24px;
}
.card.blue { --accent: var(--blue); --accent-bg: var(--blue-bg); --accent-line: var(--blue-line); }
.card.rose { --accent: var(--rose); --accent-bg: var(--rose-bg); --accent-line: var(--rose-line); }
.card-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }
.icon {
  width: 60px; height: 60px; border-radius: 14px; display: grid; place-items: center; flex: none;
  color: var(--accent); background: var(--accent-bg); border: 1px solid var(--accent-line);
}
.meta { margin: 18px 0 0; font-family: var(--mono); font-size: .86rem; color: var(--muted); text-align: right; }
.card h2 {
  margin: 22px 0 0; font-family: var(--display); font-weight: 700;
  font-size: 1.85rem; line-height: 1.15; letter-spacing: -.02em;
}
.card p.desc { margin: 14px 0 0; color: var(--body); font-size: 1.04rem; line-height: 1.6; flex: 1; }
.card-foot {
  display: flex; justify-content: space-between; align-items: center; gap: 12px;
  margin-top: 26px; padding-top: 18px; border-top: 1px solid var(--rule);
}
.stat { white-space: nowrap; font-family: var(--mono); font-size: .9rem; color: var(--muted); }
.enter {
  display: inline-flex; align-items: center; gap: 6px; flex: none;
  border: 0; background: none; padding: 6px 2px; cursor: pointer;
  color: var(--accent); font-weight: 600; font-size: 1.12rem;
}
.enter svg { transition: transform .15s ease; }
.enter:hover svg { transform: translateX(3px); }

.card.slot {
  background: transparent; border: 1.5px dashed var(--card-line);
  align-items: flex-start; justify-content: center; min-height: 260px; color: var(--muted);
}
.slot .icon { color: var(--muted); background: var(--chip); border-color: var(--card-line); }
.slot h2 { color: var(--muted); font-size: 1.4rem; }
.slot p { margin: 8px 0 0; font-size: .98rem; }

/* ---------- full-screen viewer ---------- */
.viewer { position: fixed; inset: 0; z-index: 20; display: flex; flex-direction: column; background: var(--bg); }
.vbar {
  display: flex; align-items: center; gap: 14px; flex: none;
  padding: calc(8px + env(safe-area-inset-top, 0px)) 14px 8px;
  background: var(--bar); border-bottom: 1px solid var(--rule);
  -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px);
}
.back {
  display: inline-flex; align-items: center; gap: 8px; padding: 7px 14px 7px 10px;
  border: 1px solid var(--card-line); border-radius: 999px; background: var(--card);
  cursor: pointer; font-weight: 500; font-size: .95rem;
}
.vtitle { font-family: var(--display); font-weight: 700; font-size: 1.05rem; letter-spacing: -.01em;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.vtitle .grad {
  background: linear-gradient(90deg, var(--g1), var(--g2) 40%, var(--g3) 72%, var(--g4));
  -webkit-background-clip: text; background-clip: text; color: transparent;
}
.vframe { flex: 1; width: 100%; border: 0; display: block; background: var(--bg);
  padding-bottom: env(safe-area-inset-bottom, 0px); }
body.viewing { overflow: hidden; }
body.viewing .page { visibility: hidden; }

@media (max-width: 520px) {
  .card { padding: 22px 20px 18px; border-radius: 20px; }
  .card h2 { font-size: 1.6rem; }
  .back span { display: none; }
  .back { padding: 7px 10px; }
  .card.slot { min-height: 0; padding-top: 26px; padding-bottom: 26px; }
  .tip { align-items: flex-start; text-align: left; }
}
@media (prefers-reduced-motion: reduce) { .enter svg { transition: none; } }
</style>
</head>

<script>
'use strict';
/*
  To add an assignment later:
  1. Add an entry to ASSIGNMENTS below (id, title, desc, meta, stat, color, icon).
  2. Add a <script type="text/plain" id="src-YOUR-ID"> block above holding the app's HTML in base64.
  Cards and deep links (#your-id) update on their own.
*/
const ICONS = {
  plate: '<svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 2v7c0 1.1.9 2 2 2h4a2 2 0 0 0 2-2V2"/><path d="M7 2v20"/><path d="M21 15V2a5 5 0 0 0-5 5v6c0 1.1.9 2 2 2h3Zm0 0v7"/></svg>',
  fuel: '<svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 22h12"/><path d="M4 9h10"/><path d="M14 22V4a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v18"/><path d="M14 13h2a2 2 0 0 1 2 2v2a2 2 0 0 0 4 0V9.83a2 2 0 0 0-.59-1.42L18 5"/></svg>',
  shield: '<svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/><path d="m9 12 2 2 4-4"/></svg>',
  plus: '<svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>'
};
const ARROW = '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 5l7 7-7 7"/></svg>';

const ASSIGNMENTS = [
  {
    id: 'jeeves', title: 'Jeeves', color: 'amber', icon: 'plate',
    meta: 'menu · feedback',
    desc: 'See what the dining hall is serving right now, switch between work locations, open the full day’s menu and send feedback on a meal.',
    stat: '6 locations'
  },
  {
    id: 'fuel-map', title: 'Tamil Nadu Fuel Map', color: 'blue', icon: 'fuel',
    meta: '3D · WebGL',
    desc: 'Spin a 3D map of the state, search any town for nearby stations, filter by petrol, diesel, CNG or EV and plan a route between cities.',
    stat: '38 districts mapped'
  },
  {
    id: 'sql-injection', title: 'SQL Injection Lab', color: 'rose', icon: 'shield',
    meta: 'login · PreparedStatement',
    desc: 'Break into a student portal with \' OR 1=1 --, read the SQL the way the database reads it, then send the same attack through a PreparedStatement and watch it fail.',
    stat: '7 steps'
  }
];

const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const grid = document.getElementById('grid');
grid.innerHTML = ASSIGNMENTS.map((a) => `
  <article class="card ${a.color}" aria-labelledby="t-${a.id}">
    <div class="card-top">
      <div class="icon">${ICONS[a.icon]}</div>
      <p class="meta">${esc(a.meta)}</p>
    </div>
    <h2 id="t-${a.id}">${esc(a.title)}</h2>
    <p class="desc">${esc(a.desc)}</p>
    <div class="card-foot">
      <span class="stat">${esc(a.stat)}</span>
      <button class="enter" type="button" data-open="${a.id}" aria-label="Enter ${esc(a.title)}">Enter ${ARROW}</button>
    </div>
  </article>`).join('') + `
  <div class="card slot" aria-hidden="true">
    <div class="icon">${ICONS.plus}</div>
    <h2>Next assignment</h2>
    <p>This spot is saved for the next one.</p>
  </div>`;

/* ---------- viewer ---------- */
const viewer = document.getElementById('viewer');
const frame = document.getElementById('vframe');
const vtitle = document.getElementById('vtitle');
const backBtn = document.getElementById('back');
let current = null;
let opener = null;
const cache = {};

function decode(id) {
  if (cache[id]) return cache[id];
  const el = document.getElementById('src-' + id);
  if (!el) return null;
  const bin = atob(el.textContent.trim());
  const bytes = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
  return (cache[id] = new TextDecoder('utf-8').decode(bytes));
}

function syncTheme() {
  try {
    const t = document.documentElement.getAttribute('data-theme');
    const root = frame.contentDocument && frame.contentDocument.documentElement;
    if (!root) return;
    if (t) root.setAttribute('data-theme', t); else root.removeAttribute('data-theme');
  } catch (e) { /* frame not reachable: it follows the system theme instead */ }
}
frame.addEventListener('load', syncTheme);
new MutationObserver(syncTheme).observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] });

function open(id, fromHash) {
  const a = ASSIGNMENTS.find((x) => x.id === id);
  const html = a && decode(id);
  if (!html) return;
  if (current === id) return;
  current = id;
  opener = document.activeElement;
  vtitle.innerHTML = `${esc(a.title)} <span class="grad">· MySQL Hub</span>`;
  frame.title = a.title;
  frame.srcdoc = html;
  viewer.hidden = false;
  document.body.classList.add('viewing');
  if (!fromHash) { try { history.replaceState(null, '', '#' + id); } catch (e) {} }
  document.title = a.title + ' · MySQL Hub';
  backBtn.focus();
}

function close() {
  if (!current) return;
  const was = current;
  current = null;
  viewer.hidden = true;
  frame.removeAttribute('srcdoc');
  frame.src = 'about:blank';
  document.body.classList.remove('viewing');
  try { history.replaceState(null, '', location.pathname + location.search); } catch (e) {}
  document.title = 'MySQL Hub';
  const btn = grid.querySelector(`[data-open="${was}"]`);
  (opener && document.contains(opener) ? opener : btn)?.focus();
}

grid.addEventListener('click', (e) => {
  const b = e.target.closest('[data-open]');
  if (b) open(b.dataset.open);
});
backBtn.addEventListener('click', close);

function fromHash() {
  const id = (location.hash || '').slice(1);
  if (id && ASSIGNMENTS.some((a) => a.id === id)) open(id, true);
  else if (!id) close();
}
window.addEventListener('hashchange', fromHash);
fromHash();
</script>
