<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Switch Evolution — a journey through Java's decision-making</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --pink:#E879A6;--pink-l:#3A1A2B;--pink-d:#FFB3CE;
  --blue:#5B8DEF;--blue-l:#16294A;--blue-d:#A9CCFF;
  --teal:#3CC7A9;--teal-l:#0F3A33;--teal-d:#7FE6CF;
  --amber:#E8A33D;--amber-l:#3A2A0E;--amber-d:#FFD48A;
  --purple:#9B7BF7;--purple-l:#2A2150;--purple-d:#D3C6FF;
  --coral:#F2696B;--coral-l:#3E1A1A;--coral-d:#FFB4B4;
  --green:#34C77B;--green-l:#123A22;--green-d:#94EDB2;
  --ink:#EEF2FF;--ink2:#CBD5E1;--ink3:#8D9AB0;
  --border:#26334D;--bg:#0A1222;--surface:#121C30;--soft:#18233A;
  --sans:'Segoe UI',system-ui,-apple-system,sans-serif;
  --mono:'Fira Code','Cascadia Code',Consolas,monospace;
  --ease:cubic-bezier(.22,1,.36,1);
}
*,*::before,*::after{box-sizing:inherit}
html,body{margin:0;height:100%;background:#0A1222}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:14px;line-height:1.6;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,a:focus-visible,.check input:focus-visible{outline:3px solid var(--purple);outline-offset:2px}
.app{position:relative;height:100%;overflow:hidden;--top-h:56px;--rail-h:68px}

.top{position:absolute;top:0;left:0;right:0;z-index:5;display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:12px clamp(12px,2.4vw,24px);background:linear-gradient(to bottom,rgba(10,18,34,.55),rgba(10,18,34,0));pointer-events:none}
.top>*{pointer-events:auto}
.brand{display:flex;align-items:center;gap:10px;margin-right:auto}
.brand h1{font-size:18px;margin:0;font-weight:800;letter-spacing:-.025em;line-height:1.1}
.brand p{margin:0;font-size:12px;color:var(--ink3)}
.btn{border:1.5px solid var(--border);background:rgba(18,28,48,.6);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);border-radius:10px;padding:7px 13px;font-size:13px;font-weight:600;color:var(--ink2)}
.btn:hover{border-color:var(--ink3)}

.stage{position:absolute;inset:0}
.scene{position:relative;height:100%;overflow:hidden;background:#101C33;isolation:isolate}
.scene canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.flash{position:absolute;left:clamp(14px,3vw,30px);bottom:calc(var(--rail-h) + clamp(8px,1.6vw,16px));pointer-events:none;opacity:0;color:#E2E8F0}
.flash .fv{font-size:clamp(34px,6vw,76px);font-weight:900;letter-spacing:-.05em;line-height:.9}
.flash .ff{font-family:var(--mono);font-size:clamp(12px,1.4vw,15px);margin-top:8px;color:#94A3B8}
.flash.play{animation:flash 2.6s var(--ease) forwards}
@keyframes flash{0%{opacity:0;transform:translateY(14px)}16%{opacity:1;transform:none}75%{opacity:1}100%{opacity:0}}
.intro{position:absolute;right:clamp(14px,4vw,48px);top:50%;transform:translateY(-55%);max-width:430px;background:rgba(8,13,26,.86);border:1.5px solid #2A3D5F;border-radius:16px;padding:22px 24px;color:#E2E8F0;transition:opacity .5s,transform .6s var(--ease)}
.intro h2{font-size:clamp(26px,3.6vw,38px);font-weight:900;letter-spacing:-.04em;line-height:1;margin:0 0 12px;color:#fff}
.intro p{margin:0 0 10px;color:#A8B3C7;font-size:14px}
.intro code{font-family:var(--mono);color:#6EE7B7;font-size:13px}
.intro.gone{opacity:0;transform:translateY(-50%) translateX(30px);pointer-events:none}
.start{margin-top:6px;border:0;background:#F8FAFF;color:#0F172A;border-radius:11px;padding:11px 18px;font-weight:700;font-size:14.5px}
.start:hover{background:#fff}

.card{background:var(--surface);border:1.5px solid var(--border);border-top:5px solid var(--c,var(--purple));border-radius:16px;padding:16px 18px 14px;display:none}
.card.show{display:block;animation:cardIn .55s var(--ease)}
@keyframes cardIn{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@media (min-width:900px){
  .card{position:absolute;top:calc(var(--top-h) + 4px);right:14px;bottom:calc(var(--rail-h) + 4px);width:min(410px,40%);overflow-y:auto;box-shadow:0 18px 50px -18px rgba(0,0,0,.5)}
  .card.show{animation:cardInSide .6s var(--ease)}
  @keyframes cardInSide{from{opacity:0;transform:translateX(26px)}to{opacity:1;transform:none}}
}
@media (max-width:620px){.top{flex-wrap:nowrap;gap:10px}.brand h1{font-size:16px}.btn{padding:6px 10px}.btn-ic .bt{display:none}.btn-ic{padding:7px 9px}}
@media (max-width:899px){.card{position:absolute;left:10px;right:10px;bottom:calc(var(--rail-h) + 4px);max-height:50%;overflow-y:auto;box-shadow:0 -10px 40px -10px rgba(0,0,0,.6)}}
.c-top{display:flex;gap:12px;align-items:flex-start;justify-content:space-between;margin-bottom:12px}
.c-ver{font-size:28px;font-weight:900;letter-spacing:-.04em;line-height:1}
.c-name{font-size:14px;font-weight:600;color:var(--ink2);margin-top:3px}
.c-tag{font-family:var(--mono);font-size:11.5px;font-weight:600;padding:4px 10px;border-radius:20px;background:var(--cl);color:var(--cd);white-space:nowrap}
.lbl{font-size:11px;font-weight:600;letter-spacing:.04em;color:var(--ink3);margin:12px 0 6px}
.think{border:2px dashed #5B4A9A;border-radius:12px;padding:10px 14px;background:var(--soft);display:flex;gap:10px}
.think .dots{display:flex;flex-direction:column;gap:3px;padding-top:6px}
.think .dots i{display:block;border-radius:50%;background:var(--purple)}
.think .dots i:nth-child(1){width:8px;height:8px}
.think .dots i:nth-child(2){width:5px;height:5px;opacity:.55}
.think .dots i:nth-child(3){width:3px;height:3px;opacity:.3}
.think .lbl{margin:0 0 2px;color:var(--purple-d)}
.think p{margin:0;font-style:italic;color:var(--ink2);font-size:13.5px}
.try{border:1.5px solid var(--border);border-radius:12px;padding:11px 12px;background:var(--bg)}
.try .hint{font-size:12px;color:var(--ink3);margin:0 0 8px}
.mrow{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1.5px solid var(--border);background:var(--surface);border-radius:8px;padding:5px 10px;font-family:var(--mono);font-size:12px;font-weight:500;transition:all .15s}
.chip:hover{border-color:var(--ink3)}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.chip.rm{font-family:var(--sans);font-size:12px}
.chip.rm[aria-pressed="true"]{background:var(--coral-l);border-color:var(--coral);color:var(--coral-d);text-decoration:line-through}
.check{display:flex;gap:8px;align-items:center;margin-top:9px;font-size:12.5px;font-weight:600;color:var(--ink2);cursor:pointer}
.check input{width:16px;height:16px;accent-color:var(--teal)}
.check code{font-family:var(--mono);font-weight:500}
.status{margin-top:10px;padding:7px 10px;border-radius:8px;font-size:12.5px;font-family:var(--mono);border:1.5px solid var(--border);background:var(--surface);color:var(--ink2)}
.status.ok{border-color:var(--teal);background:var(--teal-l);color:var(--teal-d)}
.status.err{border-color:var(--coral);background:var(--coral-l);color:var(--coral-d);animation:shake .4s}
.status.info{border-color:var(--amber);background:var(--amber-l);color:var(--amber-d)}
@keyframes shake{20%{transform:translateX(-4px)}40%{transform:translateX(4px)}60%{transform:translateX(-3px)}80%{transform:translateX(3px)}}
.reveal{margin-top:10px;background:var(--teal-l);border:2px solid var(--teal);border-radius:10px;padding:9px 13px;color:var(--teal-d);font-size:13.5px;animation:popIn .4s var(--ease)}
.reveal .rl{display:block;font-size:11px;font-weight:700;letter-spacing:.04em;margin-bottom:1px}
.reveal.wait{background:transparent;border:1.5px dashed var(--border);color:var(--ink3);animation:none;font-size:12.5px}
.reveal.named{background:var(--purple-l);border-color:var(--purple);color:var(--purple-d)}
@keyframes popIn{from{opacity:0;transform:scale(.96)}to{opacity:1;transform:none}}
pre.code{margin:0;background:#070D1A;border:1px solid var(--border);color:#E2E8F0;border-radius:10px;padding:10px 0;font-family:var(--mono);font-size:12.3px;line-height:1.6;overflow-x:auto}
pre.code .ln{display:block;padding:0 13px;border-left:3px solid transparent;white-space:pre;transition:background .3s}
pre.code .ln.on{background:rgba(110,231,183,.13);border-left-color:#6EE7B7}
pre.code .ln.bad{background:rgba(252,165,165,.13);border-left-color:#FCA5A5}
.ck{color:#93C5FD}.ct{color:#C4B5FD}.cs{color:#6EE7B7}.cb{color:#FCD34D}.cm{color:#7C8BA3}
.memo{margin-top:10px;padding:9px 12px;border-radius:10px;background:var(--cl);color:var(--cd);font-weight:800;letter-spacing:.03em;font-size:13px;text-align:center}
.note{font-size:12px;color:var(--ink3);margin:8px 0 0}
.c-actions{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin-top:14px}
.links{display:flex;gap:12px;flex-wrap:wrap}
.links a{color:var(--blue-d);font-weight:600;font-size:13px;text-decoration:none;border-bottom:1.5px solid currentColor}
.go{border:0;background:var(--ink);color:var(--bg);border-radius:11px;padding:10px 15px;font-weight:700;font-size:13.5px}
.go:hover{opacity:.9}
.nav{display:flex;gap:8px}
.prev{border:1.5px solid var(--border);background:transparent;color:var(--ink2);border-radius:11px;padding:9px 12px;font-weight:600;font-size:13px;display:inline-flex;align-items:center;gap:6px}
.prev:hover{border-color:var(--ink3);color:var(--ink)}
.prev svg{flex:none}

.chain{display:flex;flex-wrap:wrap;gap:5px;align-items:center}
.chain span{font-family:var(--mono);font-size:11px;font-weight:600;padding:3px 8px;border-radius:6px;background:var(--soft);border:1.5px solid var(--border);color:var(--ink2);opacity:0;animation:popIn .4s var(--ease) forwards}
.chain em{font-style:normal;color:var(--ink3);opacity:0;animation:popIn .3s forwards}
.remember{margin:8px 0 0;padding:0;list-style:none;display:grid;gap:5px}
.remember li{padding:7px 11px;border-radius:9px;background:var(--teal-l);color:var(--teal-d);font-weight:700;font-size:13px}
.quote{margin:10px 0 0;padding:12px 14px;border-radius:12px;background:#070D1A;border:1px solid var(--border);color:#CBD5E1;font-size:13.5px}
.quote b{color:#6EE7B7}
.qa{margin-top:6px;border:1.5px solid var(--border);border-radius:10px;padding:8px 11px;background:var(--surface);font-size:13px}
.qa button{border:0;background:none;color:var(--purple-d);font-weight:700;font-size:12px;padding:0;margin-left:4px}
.qa .ans{color:var(--teal-d);font-weight:700;font-family:var(--mono);font-size:12.5px}
.explore{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.explore a{display:block;padding:8px 10px;border-radius:9px;border:1.5px solid var(--border);background:var(--bg);color:var(--ink);text-decoration:none;font-size:12px;font-weight:600;line-height:1.35}
.explore a small{display:block;color:var(--ink3);font-weight:500}
.explore a:hover{border-color:var(--purple)}

.rail{position:absolute;left:0;right:0;bottom:0;z-index:5;overflow-x:auto;padding:14px clamp(10px,2vw,20px) 8px;background:linear-gradient(to top,rgba(10,18,34,.85) 40%,rgba(10,18,34,0));transition:transform .35s var(--ease),opacity .25s,visibility 0s}
.app.no-rail .rail{transform:translateY(100%);opacity:0;visibility:hidden;transition:transform .35s var(--ease),opacity .25s,visibility 0s .35s}
.btn-ic{display:inline-flex;align-items:center;gap:7px}
.btn-ic svg{flex:none}
.btn[aria-pressed="true"]{border-color:var(--ink3);color:var(--ink)}
.rail-in{position:relative;min-width:760px;padding:10px 8px 0}
.rail-line{position:absolute;left:4.2%;right:4.2%;top:17px;height:3px;border-radius:3px;background:var(--border)}
.rail-fill{position:absolute;left:0;top:0;bottom:0;width:0;border-radius:3px;background:var(--ink2)}
.rail-veh{position:absolute;top:-5px;width:13px;height:13px;border-radius:50%;background:var(--bg);border:3px solid var(--ink);transform:translateX(-50%)}
.rail-stops{display:grid;grid-template-columns:repeat(12,1fr);position:relative}
.rs{text-align:center}
.rs i{display:block;width:12px;height:12px;margin:0 auto;border-radius:50%;background:var(--surface);border:2.5px solid var(--border);transition:all .3s}
.rs.done i{border-color:var(--ink2);background:var(--ink2)}
.rs.cur i{border-color:var(--purple);box-shadow:0 0 0 4px var(--purple-l)}
.rs b{display:block;font-size:12px;margin-top:6px}
.rs small{display:block;font-size:10.5px;color:var(--ink3);line-height:1.2;font-family:var(--mono)}
/* ===== Light theme for the side card ===== */
.card{
  color-scheme:light;
  --ink:#0F172A;--ink2:#334155;--ink3:#64748B;
  --border:#DCE3EE;--bg:#F6F8FC;--surface:#FFFFFF;--soft:#F2F5FB;
  --pink-l:#FCE7F0;--pink-d:#9D174D;
  --blue-l:#E3ECFD;--blue-d:#1D4ED8;
  --teal-l:#DDF5EF;--teal-d:#0F6B5A;
  --amber-l:#FDF1DC;--amber-d:#92580A;
  --purple-l:#EEE8FE;--purple-d:#5B3CC4;
  --coral-l:#FDE5E5;--coral-d:#B42324;
  --green-l:#DCF5E6;--green-d:#166534;
  background:var(--surface);color:var(--ink);
}
@media (min-width:900px){.card{box-shadow:0 18px 50px -18px rgba(0,0,0,.55)}}
.card .think{border-color:#C4B5FD}
.card pre.code{background:#F6F8FC;border-color:var(--border);color:#1E293B}
.card pre.code .ln.on{background:rgba(16,185,129,.12);border-left-color:#10B981}
.card pre.code .ln.bad{background:rgba(239,68,68,.1);border-left-color:#EF4444}
.card .ck{color:#1D4ED8}.card .ct{color:#7C3AED}.card .cs{color:#047857}.card .cb{color:#B45309}.card .cm{color:#94A3B8}
.card .quote{background:var(--soft);border-color:var(--border);color:var(--ink2)}
.card .quote b{color:#047857}
@media (prefers-reduced-motion:reduce){.flash.play{animation-duration:1.6s}}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="brand">
      <svg width="34" height="34" viewBox="0 0 34 34" aria-hidden="true"><rect width="34" height="34" rx="9" fill="#0F172A"/><path d="M7 17h7l5-7h8M14 17l5 7h8" stroke="#6EE7B7" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/><circle cx="7" cy="17" r="2.4" fill="#F8FAFF"/></svg>
      <h1>Switch Evolution</h1>
    </div>
    <button class="btn btn-ic" id="railToggle" aria-pressed="false" aria-controls="rail" aria-label="Show progress"><svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="M1.5 8h13" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/><circle cx="3" cy="8" r="2" fill="currentColor"/><circle cx="8" cy="8" r="2" fill="none" stroke="currentColor" stroke-width="1.5"/><circle cx="13" cy="8" r="2" fill="none" stroke="currentColor" stroke-width="1.5"/></svg><span class="bt">Show progress</span></button>
    <button class="btn" id="restart">Restart</button>
  </header>

  <div class="stage">
    <div class="scene" id="scene">
      <canvas id="cv" role="img" aria-label="A vehicle carries a value through eleven Java milestones. At each one, a decision panel shows how switch evaluates the value."></canvas>
      <div class="flash" id="flash" aria-hidden="true"><div class="fv" id="fv"></div><div class="ff" id="ff"></div></div>
      <div class="intro" id="intro">
        <h2>Every stop is a new way to decide.</h2>
        <p>Your vehicle carries a value, like <code>int choice = 2</code>. At each Java milestone it meets a <code>switch</code>, and you watch the cases being checked.</p>
        <p>As Java evolves, the value evolves too: numbers, names, text, types, records.</p>
        <button class="start" id="startBtn">Start the journey</button>
      </div>
    </div>
    <section class="card" id="card" aria-live="polite"></section>
  </div>

  <nav class="rail" id="rail" aria-label="Journey progress">
    <div class="rail-in">
      <div class="rail-line"><div class="rail-fill" id="railFill"></div><span class="rail-veh" id="railVeh"></span></div>
      <div class="rail-stops" id="railStops"></div>
    </div>
  </nav>
</div>

<script>
/* ================= HELPERS ================= */
const $=s=>document.querySelector(s);
const clamp=(v,a=0,b=1)=>Math.max(a,Math.min(b,v));
const lerp=(a,b,t)=>a+(b-a)*t;
const smooth=t=>{t=clamp(t);return t*t*(3-2*t)};
const eio=t=>t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2;
const rnd=(i,s=0)=>{const x=Math.sin(i*127.1+s*311.7)*43758.5453;return x-Math.floor(x)};
const esc=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const HC={};
const rgb=h=>HC[h]||(HC[h]=(n=>[n>>16&255,n>>8&255,n&255])(parseInt(h.slice(1),16)));
function mix(a,b,t){if(a===b||t<=0)return a;if(t>=1)return b;const A=rgb(a),B=rgb(b);return '#'+((1<<24)|(Math.round(A[0]+(B[0]-A[0])*t)<<16)|(Math.round(A[1]+(B[1]-A[1])*t)<<8)|Math.round(A[2]+(B[2]-A[2])*t)).toString(16).slice(1)}
const rgba=(h,a)=>{const c=rgb(h);return `rgba(${c[0]},${c[1]},${c[2]},${a})`};
function hl(src){
  return esc(src).replace(/(\/\/[^\n]*)|("[^"\n]*")|\b(switch|case|break|default|int|enum|sealed|interface|permits|when|null|var|return|new|record|final|class|implements)\b|\b([A-Z][A-Za-z0-9]*)\b|\b(\d+)\b/g,
   (m,c,s,k,t,n)=>c?`<span class="cm">${c}</span>`:s?`<span class="cs">${s}</span>`:k?`<span class="ck">${k}</span>`:t?`<span class="ct">${t}</span>`:`<span class="cb">${n}</span>`);
}
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
const MONO='"Fira Code","Cascadia Code",Consolas,monospace';
const seq=(v,skipNote)=>Array.from({length:v+1},(_,i)=>[i,i===v?'match':'skip',i===v?null:skipNote||null]);

/* ================= DATA ================= */
const LINKS={
  tut:{t:'Switch statements (Java tutorial)',u:'https://docs.oracle.com/javase/tutorial/java/nutsandbolts/switch.html'},
  enm:{t:'Enum types (Java tutorial)',u:'https://docs.oracle.com/javase/tutorial/java/javaOO/enum.html'},
  j325:{t:'JEP 325: Switch expressions (preview)',u:'https://openjdk.org/jeps/325'},
  j354:{t:'JEP 354: Switch expressions (2nd preview)',u:'https://openjdk.org/jeps/354'},
  j361:{t:'JEP 361: Switch expressions',u:'https://openjdk.org/jeps/361'},
  j441:{t:'JEP 441: Pattern matching for switch',u:'https://openjdk.org/jeps/441'},
  j440:{t:'JEP 440: Record patterns',u:'https://openjdk.org/jeps/440'},
  j409:{t:'JEP 409: Sealed classes',u:'https://openjdk.org/jeps/409'},
  j455:{t:'JEP 455: Primitive types in patterns (preview)',u:'https://openjdk.org/jeps/455'}
};
const ROLE={pink:['#E879A6','var(--pink-l)','var(--pink-d)'],teal:['#3CC7A9','var(--teal-l)','var(--teal-d)'],blue:['#5B8DEF','var(--blue-l)','var(--blue-d)'],amber:['#E8A33D','var(--amber-l)','var(--amber-d)'],purple:['#9B7BF7','var(--purple-l)','var(--purple-d)'],coral:['#F2696B','var(--coral-l)','var(--coral-d)'],green:['#34C77B','var(--green-l)','var(--green-d)']};
const NAMES=['PLACED','PAID','SHIPPED','DELIVERED'],NRES=['confirm()','pack()','ship()','close()'];
const PAYS=['CardPayment','CashPayment','UpiPayment'];

const STOPS=[
 {v:'bike',ver:'Java 1.0',short:'1.0',sel:'int',name:'Basic switch',role:'pink',
  problem:'I need to choose one path based on a value.',
  cap:'<b>switch</b> compares one value against each <b>case</b> and runs the first one that matches.',
  memo:'VALUE → CHOOSE A PATH',links:['tut'],

    if(state==='skip'&&note){ctx.fillStyle='#E8A33D';ctx.font=`500 ${fs*.86}px ${MONO}`;ctx.fillText(note,px+pw-pad,cy)}
    else if(state==='fail'){ctx.fillStyle='#FCA5A5';ctx.font=`500 ${fs*.86}px ${MONO}`;ctx.fillText(note||'✗',px+pw-pad,cy)}
    else if(state==='off'){ctx.fillStyle='#3E4C66';ctx.font=`500 ${fs*.86}px ${MONO}`;ctx.fillText('not written',px+pw-pad,cy)}
    else{ctx.fillStyle=state==='match'?mix(col,'#FFFFFF',.55):'#64748B';ctx.font=`500 ${fs}px ${MONO}`;ctx.fillText((state==='match'?'→ ':'')+r.r,px+pw-pad,cy)}
    ctx.textAlign='left';
    if(state==='match'&&note){ctx.fillStyle=mix(col,'#FFFFFF',.4);ctx.font=`500 ${fs*.78}px ${MONO}`;ctx.fillText(note,px+pad+8+ctx.measureText(r.t).width*fs/(fs*.78)+10,cy)}
  });
  const fy=py+headH+rows.length*rowH+6;
  ctx.fillStyle='#1E293B';ctx.fillRect(px+1,fy-2,pw-2,1);
  ctx.font=`500 ${fs}px ${MONO}`;
  if(stLines.length){ctx.fillStyle=sk==='ok'?'#5EEAD4':sk==='err'?'#FCA5A5':'#FCD34D';stLines.forEach((l,k)=>ctx.fillText(l,px+pad,fy+8+fs*.72+k*fs*1.45))}
  else{ctx.fillStyle='#475569';ctx.fillText(q.running?'checking cases…':'}',px+pad,fy+8+fs*.72)}
  ctx.textBaseline='alphabetic';ctx.restore();
}
function drawTag(){
  const tag=currentTag();if(!tag)return;
  const key=tag.ty+tag.tx+(tag.ex||'');if(key!==S.tagKey){S.tagKey=key;S.tagA=0}
  const P=S.veh,vx=ax,vy=syw(S.vehAlt),top=vy+topOf(P)*z;
  const cx=vx+(P.bx+P.bw/2)*z;
  const fs=W<620?11:12.5;ctx.font=`600 ${fs}px ${MONO}`;const tw1=ctx.measureText(tag.ty+' ').width;ctx.font=`500 ${fs}px ${MONO}`;
  const w1=tw1+ctx.measureText(tag.tx).width,w2=tag.ex?ctx.measureText(tag.ex).width:0,w=Math.max(w1,w2)+24,h=tag.ex?fs*3.2:fs*2.1;
  let x=Math.max(8,Math.min(W-w-8,cx-w/2)),y=top-14-h;
  const a=smooth(S.tagA);ctx.globalAlpha=a;
  ctx.save();ctx.translate(x+w/2,y+h);ctx.scale(1,.85+.15*a);ctx.translate(-(x+w/2),-(y+h));
  rr(x,y,w,h,7);ctx.fillStyle='#F8FAFF';ctx.fill();
  const st=STOPS[Math.max(0,S.idx)]||STOPS[0],col=ROLE[(S.mode==='travel'?STOPS[S.seg.t>.55?S.seg.to:Math.max(0,S.seg.from)]:STOPS[Math.max(0,S.idx)]).role][0];
  ctx.fillStyle=col;ctx.fillRect(x,y+5,3,h-10);
  ctx.beginPath();ctx.moveTo(cx-6,y+h);ctx.lineTo(cx+6,y+h);ctx.lineTo(cx,y+h+7);ctx.closePath();ctx.fillStyle='#F8FAFF';ctx.fill();
  ctx.textBaseline='middle';
  ctx.font=`600 ${fs}px ${MONO}`;ctx.fillStyle=mix(col,'#0F172A',.45);ctx.fillText(tag.ty,x+12,y+fs*1.05);
  ctx.font=`500 ${fs}px ${MONO}`;ctx.fillStyle='#0F172A';ctx.fillText(tag.tx,x+12+tw1,y+fs*1.05);
  if(tag.ex){ctx.fillStyle='#64748B';ctx.font=`500 ${fs*.92}px ${MONO}`;ctx.fillText(tag.ex,x+12,y+fs*2.25)}
  ctx.textBaseline='alphabetic';ctx.restore();ctx.globalAlpha=1;
  // leader line from value to matched case
  const i=S.idx;if(i>=0&&!STOPS[i].final&&(S.mode==='paused')){const q=Q[i];if(q&&q.geo&&q.matched>=0){const g=q.geo,ry=g.py+g.headH+q.matched*g.rowH+g.rowH/2+1;
    ctx.strokeStyle=rgba(ROLE[STOPS[i].role][0],.85);ctx.lineWidth=1.5;ctx.setLineDash([4,4]);ctx.beginPath();ctx.moveTo(x+w/2,y);ctx.bezierCurveTo(x+w/2,y-30,g.px-28,ry,g.px+2,ry);ctx.stroke();ctx.setLineDash([]);
    ctx.fillStyle=ROLE[STOPS[i].role][0];ctx.beginPath();ctx.arc(g.px+2,ry,3,0,7);ctx.fill()}}
}
const FINAL_TAG={ty:'switch',tx:'(what comes next?)'};
function currentTag(){
  if(S.mode==='intro')return Q[0].tag;
  if(S.mode==='travel'){const sg=S.seg,to=sg.to,dest=STOPS[to].final?FINAL_TAG:Q[to].tag;if(sg.t>.55||sg.from<0)return dest;return STOPS[sg.from].final?FINAL_TAG:Q[sg.from].tag}
  if(S.idx>=0)return STOPS[S.idx].final?FINAL_TAG:Q[S.idx].tag;return null;
}
function altHud(){
  const a=smooth((S.camAlt-30)/220);if(a<=0)return;
  ctx.font=`500 10.5px ${MONO}`;ctx.textBaseline='middle';
  for(let A=Math.floor((S.camAlt-H/z)/100)*100;A<S.camAlt+H/z;A+=100){if(A<=0)continue;const y=syw(A);if(y<0||y>H)continue;
    const big=A%500===0;ctx.globalAlpha=a*(big?.6:.3);ctx.fillStyle='#94A3B8';ctx.fillRect(W-14-(big?14:7),y,big?14:7,1);
    if(big)ctx.fillText('ALT '+A,W-80,y)}
  ctx.globalAlpha=1;ctx.textBaseline='alphabetic';
}

/* ================= UPDATE + RENDER ================= */
function update(dt){
  S.time+=dt;let dx=0;
  if(S.mode==='travel'){const sg=S.seg;sg.t=Math.min(1,sg.t+dt/sg.dur);const nx=lerp(sg.x0,sg.x1,eio(sg.t));dx=nx-S.vehX;S.vehX=nx;
    const m=sg.vFrom===sg.vTo?1:sg.morph?clamp((sg.t-sg.morph[0])/(sg.morph[1]-sg.morph[0])):1;
    S.veh=mixVeh(VEH[sg.vFrom],VEH[sg.vTo],eio(m));S.glow=m>0&&m<1?Math.sin(Math.PI*m):0;S.morphM=m;S.vName=m<.5?sg.vFrom:sg.vTo;
    if(sg.t>=1)arrive(sg.to)}
  else if(S.mode==='cruise'){S.cruise=Math.min(170,S.cruise+dt*70);dx=S.cruise*dt;S.vehX+=dx}
  S.speed=dt>0?dx/dt:0;S.wheel+=dx/16;
  const a=alt(S.vehX),bob=a>40?Math.sin(S.time*2.1)*3*smooth(a/120):0;S.vehAlt=a+bob;
  S.camAlt+=(a-S.camAlt)*Math.min(1,dt*2.6);
  const slope=(alt(S.vehX+6)-alt(S.vehX-6))/12;S.tilt+=(-Math.atan(slope)*.85-S.tilt)*Math.min(1,dt*5);
  const wide=W>=900,bz=clamp(Math.min(W/1050,H/580),.46,1.1);
  const tz=bz*S.veh.z;S.z=S.z?S.z+(tz-S.z)*Math.min(1,dt*2.5):tz;
  const tax=W*(wide&&S.cardOpen?.24:wide?.34:.38);S.anchorX=S.anchorX?S.anchorX+(tax-S.anchorX)*Math.min(1,dt*2.2):tax;
  S.tagA=Math.min(1,S.tagA+dt*3);
  S.ayk=(S.ayk||0)+(((W<900&&S.cardOpen)?1:0)-(S.ayk||0))*Math.min(1,dt*3);
  for(let i=0;i<Q.length;i++){const q=Q[i];if(!q||!q.running)continue;q.t+=dt;
    const stepT=reduce?.18:.36;
    if(q.queue.length){if(q.t>=stepT){const[r,mk,note]=q.queue.shift();q.rows[r]=mk;if(note)q.notes[r]=note;if(mk==='match')q.matched=r;q.t=0}}
    else if(q.t>=stepT*.6){finishRun(i);if(q.err)q.errT=S.time}}
  spawn(dt);stepParticles(dt);
  updateRail();
}
function render(){
  z=S.z;ax=S.anchorX;const ay0=H*lerp(.8,.64,smooth(S.camAlt/500));const cEl=S.cardOpen&&W<900?$('#card'):null;if(cEl)S.cardTop=cEl.offsetTop;ay=lerp(ay0,Math.min(ay0,(S.cardTop||H*.5)-18),S.ayk||0);
  ctx.setTransform(DPR,0,0,DPR,0,0);
  sky();
  ctx.setTransform(DPR*z,0,0,DPR*z,DPR*ax,DPR*ay);
  ridge(.12,150,40,'#121F36','#24365A');
  ridge(.24,100,18,'#101B30','#2A3D60');
  midLayer();ground();roadAhead();drawParticles();
  const P=S.veh,vy=RY(S.vehAlt,1),gf=1-smooth((S.vehAlt-10)/50);
  ctx.save();ctx.translate(0,vy);ctx.rotate(S.tilt);
  if(S.glow>0){
    ctx.globalAlpha=1-.7*S.glow;drawVehicle(P,S.wheel,gf,S.time,false);
    ctx.globalAlpha=S.glow;drawVehicle(P,S.wheel,gf,S.time,true);
    const tp=topOf(P),x0=Math.min(P.bx,P.fX,P.wX)-20,x1=Math.max(P.bx+P.bw,P.nX+P.nRx)+20,sx=lerp(x0,x1,S.morphM);
    ctx.globalAlpha=S.glow;const sg=ctx.createLinearGradient(sx-30,0,sx,0);sg.addColorStop(0,'rgba(103,232,249,0)');sg.addColorStop(1,'rgba(103,232,249,.35)');
    ctx.fillStyle=sg;ctx.fillRect(sx-30,tp-16,30,-tp+20);ctx.fillStyle='#A5F3FC';ctx.fillRect(sx-1,tp-22,2,-tp+28);
    ctx.globalAlpha=1;
  }else drawVehicle(P,S.wheel,gf,S.time,false);
  ctx.restore();
  ctx.setTransform(DPR,0,0,DPR,0,0);
  if(!reduce&&Math.abs(S.speed)>380){const a=clamp((Math.abs(S.speed)-380)/400)*.18;ctx.strokeStyle=`rgba(226,232,240,${a})`;ctx.lineWidth=1;
    for(let i=0;i<8;i++){const y=ay+(rnd(i+Math.floor(S.time*8),71)-.75)*H*.5,x=((rnd(i,72)*W*1.4-S.time*1700)%(W*1.4)+W*1.4)%(W*1.4)-W*.2,l=80+rnd(i,73)*160;ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(x+l,y);ctx.stroke()}}
  altHud();
  if(S.mode!=='intro')for(let i=0;i<LAST;i++)drawPanel(i);
  drawTag();
}
let last=performance.now();
function loop(now){const dt=Math.min(.05,(now-last)/1000);last=now;update(dt);render();requestAnimationFrame(loop)}

/* ================= JOURNEY FLOW ================= */
function travelTo(to,rev){
  const from=S.idx;
  const sF=rev?STOPS[from].v:(to<=0?'bike':STOPS[to-1].v),sT=STOPS[to].v,morph=sF!==sT?(rev?[.15,.6]:(STOPS[to].morph||[.6,.9])):null;
  let dur=rev?2.6:(to===0?3.4:4.8)+(morph?.4:0);if(reduce)dur*=.6;
  S.seg={to,from,x0:S.vehX,x1:XS(to),t:0,dur,vFrom:sF,vTo:sT,morph,rev:!!rev};S.mode='travel';
}
function arrive(i){
  S.idx=i;S.veh=VEH[STOPS[i].v];S.glow=0;S.vName=STOPS[i].v;S.speed=0;
  const f=$('#flash');$('#fv').textContent=STOPS[i].ver;$('#ff').textContent=STOPS[i].name;f.classList.remove('play');void f.offsetWidth;f.classList.add('play');
  if(STOPS[i].final){S.mode='cruise';S.cruise=0;setTimeout(()=>{if(S.idx===i&&S.mode==='cruise')showCard(i)},reduce?300:1200);return}
  S.mode='paused';
  startRun(i,false);
  setTimeout(()=>{if(S.idx===i&&S.mode==='paused')showCard(i)},reduce?400:1500);
}
function back(){if(!(S.mode==='paused'||S.mode==='cruise')||S.idx<=0)return;hideCard();travelTo(S.idx-1,true)}
function go(){if(S.mode!=='paused'||S.idx>=LAST)return;hideCard();travelTo(S.idx+1)}
function hideCard(){$('#card').classList.remove('show');S.cardOpen=false}
function start(){$('#intro').classList.add('gone');travelTo(0)}
function restart(){
  hideCard();resetQ();Object.assign(S,{mode:'intro',idx:-1,vehX:0,vehAlt:0,camAlt:0,tilt:0,veh:VEH.bike,glow:0,speed:0,seg:null,cruise:0,particles:[],vName:'bike'});
  $('#intro').classList.remove('gone');
}
$('#startBtn').onclick=start;$('#restart').onclick=restart;
function setRail(show){$('.app').classList.toggle('no-rail',!show);const b=$('#railToggle'),t=show?'Hide progress':'Show progress';b.setAttribute('aria-pressed',show);b.setAttribute('aria-label',t);b.querySelector('.bt').textContent=t;measureChrome()}
$('#railToggle').onclick=()=>setRail($('.app').classList.contains('no-rail'));
setRail(false);
addEventListener('keydown',e=>{if(e.target.closest('input,button,a'))return;if(e.key==='ArrowRight'||e.key==='Enter'){if(S.mode==='intro')start();else go()}else if(e.key==='ArrowLeft')back()});

/* ================= RAIL ================= */
$('#railStops').innerHTML=STOPS.map((s,i)=>`<div class="rs" id="rs${i}" title="${s.ver}: ${s.name}"><i></i><b>${s.short}</b><small>${s.sel}</small></div>`).join('');
function updateRail(){
  const f=clamp((S.vehX-XS(0))/(XS(LAST)-XS(0)));
  $('#railFill').style.width=(f*100)+'%';$('#railVeh').style.left=(f*100)+'%';
  for(let i=0;i<=LAST;i++){const el=document.getElementById('rs'+i);el.classList.toggle('done',S.idx>i||(S.idx===i&&STOPS[i].final));el.classList.toggle('cur',S.idx===i&&!STOPS[i].final)}
}

/* ================= CARD ================= */
function showCard(i){
  const s=STOPS[i],c=$('#card'),r=ROLE[s.role];
  c.style.setProperty('--c',r[0]);c.style.setProperty('--cl',r[1]);c.style.setProperty('--cd',r[2]);
  c.innerHTML=s.final?finalHTML():cardHTML(s,i);
  c.classList.add('show');c.scrollTop=0;S.cardOpen=true;
  if(s.final){initFinal(c)}else{wireControls(c,i);c.querySelector('.go').onclick=go;if(!Q[i].running)syncCard(i,false)}
  const pb=c.querySelector('[data-prev]');if(pb)pb.onclick=back;
}
function cardHTML(s,i){
  const next=STOPS[i+1],q=Q[i];
  const lines=s.code.split('\n').map((ln,j)=>`<span class="ln" data-l="${j}">${hl(ln)||' '}</span>`).join('');
  const inputs=`<div class="mrow" role="group" aria-label="Value to switch on">${s.inputs.map(([k,l])=>`<button class="chip" data-in="${k}" aria-pressed="${q.s.input===k}">${esc(l)}</button>`).join('')}</div>`;
  const toggles=(s.toggles||[]).map(([k,l])=>`<label class="check"><input type="checkbox" data-tg="${k}" ${q.s.flags[k]?'checked':''}> ${l}</label>`).join('');
  const removable=s.removable?`<p class="hint" style="margin:10px 0 6px">Cases in your switch:</p><div class="mrow">${PAYS.map((p,j)=>`<button class="chip rm" data-rm="${j}" aria-pressed="${q.s.removed.has(j)}">case ${p}</button>`).join('')}</div>`:'';
  return `<div class="c-top"><div><div class="c-ver">${s.ver}</div><div class="c-name">${s.name}</div></div><span class="c-tag">${esc(s.sel)}</span></div>
  <div class="think"><div class="dots"><i></i><i></i><i></i></div><div><div class="lbl">The problem</div><p>${s.problem}</p></div></div>
  <div class="lbl">Try it</div>
  <div class="try"><p class="hint">Change the value and watch the switch panel in the scene check each case.</p>${inputs}${toggles}${removable}<div class="status" id="cstatus">checking cases…</div></div>
  <div class="reveal wait" id="reveal">Try a value above to discover the capability.</div>
  <div class="lbl">Feature hint</div><pre class="code" id="ccode"><code>${lines}</code></pre>
  <div class="memo">${s.memo}</div>
  ${s.note?`<p class="note">${s.note}</p>`:''}
  <div class="c-actions"><div class="links">${s.links.map(k=>`<a href="${LINKS[k].u}" target="_blank" rel="noopener">${s.links.length>1?LINKS[k].t.split(':')[0]:'Learn more'} ↗</a>`).join('')}</div>
  <div class="nav">${i>0?'<button class="prev" data-prev aria-label="Previous stop"><svg width="14" height="14" viewBox="0 0 14 14" aria-hidden="true"><path d="M9 2 4 7l5 5" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>Prev</button>':''}<button class="go">${next.final?'Fly beyond Java 21':'Continue to '+next.ver}</button></div></div>`;
}
function wireControls(c,i){
  const q=Q[i];
  c.querySelectorAll('[data-in]').forEach(b=>b.onclick=()=>{q.s.input=b.dataset.in;c.querySelectorAll('[data-in]').forEach(x=>x.setAttribute('aria-pressed',x===b));startRun(i,true);pending(c)});
  c.querySelectorAll('[data-tg]').forEach(t=>t.onchange=()=>{q.s.flags[t.dataset.tg]=t.checked;startRun(i,true);pending(c)});
  c.querySelectorAll('[data-rm]').forEach(b=>b.onclick=()=>{const j=+b.dataset.rm;if(q.s.removed.has(j))q.s.removed.delete(j);else{q.s.removed.add(j);q.s.hadRemoved=true}
    b.setAttribute('aria-pressed',q.s.removed.has(j));startRun(i,true);pending(c)});
}
function pending(c){const s=c.querySelector('#cstatus');s.className='status';s.textContent='checking cases…';c.querySelectorAll('.ln').forEach(l=>l.classList.remove('on','bad'))}
function syncCard(i,doReveal){
  const c=$('#card'),q=Q[i],r=q.res,st=STOPS[i];if(!c.classList.contains('show')||!r)return;
  const s=c.querySelector('#cstatus');if(s){s.className='status '+r.status[0];s.textContent=(r.status[0]==='ok'?'✓ ':r.status[0]==='err'?'✗ ':'? ')+r.status[1]}
  c.querySelectorAll('.ln').forEach(l=>{const n=+l.dataset.l;l.classList.toggle('on',r.line===n);l.classList.toggle('bad',r.bad===n)});
  if(doReveal){const rev=c.querySelector('#reveal');if(rev.classList.contains('wait')){rev.className='reveal'+(i===9?' named':'');rev.innerHTML=`<span class="rl">${i===9?'You just discovered a concept':'New capability'}</span>${st.cap}`}}
}

/* ================= FINAL ================= */
function finalHTML(){
  const chain=['int','enum','String','→ value','standard','Object type','record','type + when','null','all cases','sealed'];
  const qs=[['Your switch must return a price for each customer type.','switch expression'],['Each payment subtype needs different handling.','pattern matching for switch'],['Same type, but express orders need special handling.','guard: when'],['You want the compiler to catch a forgotten case.','sealed types + exhaustiveness']];
  return `<div class="c-top"><div><div class="c-ver">The road keeps going</div><div class="c-name">From <code style="font-family:var(--mono)">int choice</code> to sealed type hierarchies</div></div></div>
  <div class="lbl">What your switch learned to decide on</div>
  <div class="chain">${chain.map((c,i)=>`<span style="animation-delay:${i*.15}s">${esc(c)}</span>${i<chain.length-1?`<em style="animation-delay:${i*.15+.07}s">→</em>`:''}`).join('')}</div>
  <div class="lbl">Which feature fits?</div>
  ${qs.map(q=>`<div class="qa">${q[0]} <button>Reveal</button><div class="ans" hidden>${q[1]}</div></div>`).join('')}
  <div class="lbl">What should you remember?</div>
  <p style="margin:0;font-weight:700">Not every syntax. Instead:</p>
  <ul class="remember"><li>Know that the feature exists.</li><li>Know the problem it solves.</li><li>Recognize the situation where it may help.</li><li>Know where to learn more.</li></ul>
  <div class="quote">AI can help you discover and write the syntax.<br><b>Your job is to know what is possible and ask the right question.</b></div>
  <div class="quote"><b>Technology keeps evolving.</b><br>You don't have to memorize every stop. You need to know that the road exists.</div>
  <div class="lbl">Explore the features</div>
  <div class="explore">${['tut','enm','j361','j441','j440','j409','j455'].map(k=>{const[a,b]=LINKS[k].t.split(': ');return `<a href="${LINKS[k].u}" target="_blank" rel="noopener">${b||a} ↗<small>${b?a:'Oracle tutorial'}</small></a>`}).join('')}</div>
  <p class="note">Up ahead: primitive types in patterns are being previewed in recent JDKs.</p>
  <div class="c-actions"><span></span><div class="nav"><button class="prev" data-prev aria-label="Previous stop"><svg width="14" height="14" viewBox="0 0 14 14" aria-hidden="true"><path d="M9 2 4 7l5 5" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>Prev</button><button class="go" id="again">Ride again from Java 1.0</button></div></div>`;
}
function initFinal(c){c.querySelectorAll('.qa button').forEach(b=>b.onclick=()=>{b.hidden=true;b.nextElementSibling.hidden=false});c.querySelector('#again').onclick=restart}

/* ================= INIT ================= */
S.anchorX=W*.42;S.z=clamp(Math.min(W/1050,H/580),.46,1.1)*VEH.bike.z;
requestAnimationFrame(loop);
</script>
</body>
</html>
