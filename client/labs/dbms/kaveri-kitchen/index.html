<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kaveri Kitchen: follow one order</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lexend:wght@300;400;500;600&family=JetBrains+Mono:wght@400&family=Fraunces:opsz,wght@9..144,500;9..144,600&display=swap" rel="stylesheet">
<style>
:root{
  --green:#24453F; --green-2:#2F5A52; --green-l:#E3EEEA;
  --brass:#A97C3F; --brass-l:#F5ECDD;
  --ink:#1D2321; --ink-2:#4A5450; --ink-3:#7A8580;
  --bg:#FAFAF8; --card:#FFFFFF; --line:#E4E6E2; --soft:#F2F4F1;
  --new:#7C8B86; --cook:#C98A1B; --ready:#2E8B6E; --served:#3B6FB6;
  --sans:'Lexend',system-ui,-apple-system,'Segoe UI',sans-serif;
  --serif:'Fraunces',Georgia,'Times New Roman',serif;
  color-scheme:light;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){ --green-l:#1C2E2A; --brass-l:#2E2516; --ink:#E9EEEB; --ink-2:#C2CCC7; --ink-3:#8E9A95; --bg:#121615; --card:#1A201E; --line:#2C3431; --soft:#202725; color-scheme:dark; }
}
:root[data-theme="dark"]{ --green-l:#1C2E2A; --brass-l:#2E2516; --ink:#E9EEEB; --ink-2:#C2CCC7; --ink-3:#8E9A95; --bg:#121615; --card:#1A201E; --line:#2C3431; --soft:#202725; color-scheme:dark; }
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font-family:var(--sans);background:var(--bg);color:var(--ink);font-size:14px;line-height:1.55;display:flex;flex-direction:column;overflow:hidden}
button,input,textarea{font:inherit;color:inherit}
:focus-visible{outline:2.5px solid var(--brass);outline-offset:2px;border-radius:6px}

.top{display:flex;align-items:center;gap:20px;padding:10px 18px;background:var(--card);border-bottom:1px solid var(--line);flex:none}
.brand b{font-family:var(--serif);font-weight:600;font-size:20px;letter-spacing:-.01em;display:block;line-height:1.1}
.brand span{font-size:12px;color:var(--ink-3)}
.steps{display:flex;gap:4px;list-style:none;margin:0 auto;padding:0}
.steps li{display:flex;align-items:center;gap:7px;padding:5px 11px 5px 6px;border-radius:20px;font-size:12.5px;color:var(--ink-3)}
.steps li i{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-style:normal;font-size:11.5px;font-weight:600;background:var(--soft);border:1px solid var(--line)}
.steps li.on{background:var(--green-l);color:var(--green)}
.steps li.on i{background:var(--green);color:#fff;border-color:var(--green)}
.steps li.done i{background:var(--brass-l);color:var(--brass);border-color:var(--brass)}
.ghost{border:1px solid var(--line);background:var(--card);padding:7px 13px;border-radius:9px;cursor:pointer;font-size:13px;color:var(--ink-2)}
.ghost:hover{border-color:var(--ink-3)}

main{flex:1;display:flex;min-height:0}
.stage{flex:1;position:relative;min-width:0;background:#E9E4DC}
#c{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;outline:none}
.tip{position:absolute;pointer-events:none;background:var(--ink);color:var(--bg);font-size:12px;padding:4px 9px;border-radius:7px;opacity:0;transform:translate(-50%,-140%);white-space:nowrap}
.hint{position:absolute;right:14px;top:14px;font-size:12px;color:#5b5f5c;background:rgba(255,255,255,.82);padding:6px 10px;border-radius:8px}
.panel{width:400px;flex:none;background:var(--card);border-left:1px solid var(--line);overflow-y:auto;transition:width .35s ease}
.panel.wide{width:min(600px,48vw)}
.pi{padding:22px 22px 28px;display:flex;flex-direction:column;gap:14px}
.pi h2{font-family:var(--serif);font-weight:600;font-size:24px;line-height:1.2;margin:0;letter-spacing:-.01em}
.pi p{margin:0;color:var(--ink-2)}
.lead{font-size:14.5px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;background:var(--green);color:#fff;padding:11px 16px;border-radius:10px;cursor:pointer;font-weight:500;font-size:14px;transition:background .15s}
.btn:hover{background:var(--green-2)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.full{width:100%}
.btn.brass{background:var(--brass)}
.wait{display:flex;align-items:center;gap:10px;color:var(--ink-3);font-size:13px}
.wait::before{content:"";width:14px;height:14px;border-radius:50%;border:2px solid var(--line);border-top-color:var(--green);animation:sp 1s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.say{border-left:3px solid var(--brass);padding:4px 0 4px 12px;color:var(--ink-2);font-style:italic}
.say b{font-style:normal;color:var(--ink)}

.tables{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.tables button{border:1px solid var(--line);background:var(--card);border-radius:12px;padding:12px 4px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px}
.tables button b{font-family:var(--serif);font-size:22px;font-weight:600;color:var(--green)}
.tables button span{font-size:11px;color:var(--ink-3)}
.tables button:hover,.tables button.hov{border-color:var(--green);background:var(--green-l)}

.menu{background:#FBF7EF;border:1px solid #E8DDC9;border-radius:14px;padding:18px 16px;color:#2A2723}
.menu h3{font-family:var(--serif);font-weight:600;font-size:21px;text-align:center;margin:0}
.menu .sub{text-align:center;font-size:12px;color:#8A7F70;margin:2px 0 12px}
.dish{display:grid;grid-template-columns:64px 1fr auto;gap:11px;align-items:center;padding:8px 0;border-top:1px solid #EDE4D4}
.dish svg{width:64px;height:48px;border-radius:8px;display:block}
.dish b{font-weight:500;font-size:13.5px;display:block}
.dish small{color:#8A7F70;font-size:12px}
.qty{display:flex;align-items:center;gap:8px}
.qty button{width:28px;height:28px;border-radius:50%;border:1px solid #CDBFA6;background:#fff;cursor:pointer;font-size:16px;line-height:1;color:#2A2723}
.qty b{min-width:14px;text-align:center}
.total{display:flex;justify-content:space-between;font-weight:600;padding-top:10px;border-top:1px solid #E8DDC9;margin-top:4px}

.device{border:1px solid var(--line);border-radius:14px;overflow:hidden}
.device header{display:flex;align-items:center;gap:9px;padding:9px 12px;background:var(--soft);font-size:13px;font-weight:500}
.device header span{margin-left:auto;font-weight:400;color:var(--ink-3);font-size:12px}
.device header i{width:9px;height:9px;border-radius:50%;background:var(--c)}
.device ul{list-style:none;margin:0;padding:6px 12px 10px}
.device li{display:flex;align-items:center;gap:8px;padding:4px 0;font-size:13px}
.device li em{margin-left:auto;font-style:normal}
.st{font-size:11.5px;font-weight:600;padding:2px 9px;border-radius:20px;color:#fff;background:var(--new)}
.st.PREPARING{background:var(--cook)} .st.READY{background:var(--ready)} .st.SERVED{background:var(--served)}
.views{position:absolute;left:14px;top:14px;display:flex;gap:6px;flex-wrap:wrap}
.views button{border:1px solid rgba(0,0,0,.08);background:rgba(255,255,255,.9);color:#2b302e;border-radius:9px;padding:6px 11px;font-size:12.5px;cursor:pointer}
.views button:hover{background:#fff;border-color:#24453F}
.small{font-size:12.5px;color:var(--ink-3)}
.phone{width:250px;margin:0 auto;border:9px solid #1D2321;border-radius:30px;background:#0E1211;padding:26px 14px 18px;position:relative}
.phone .notch{position:absolute;top:8px;left:50%;transform:translateX(-50%);width:70px;height:8px;border-radius:5px;background:#2A302E}
.phone .cam{text-align:center;color:#C9D1CE;font-size:12.5px}
.phone .cam p{color:#C9D1CE;margin-top:10px}
.qrbox{position:relative;width:170px;height:170px;margin:6px auto 0;border-radius:12px;overflow:hidden;background:#fff;padding:10px;outline:2px solid #A97C3F;outline-offset:6px}
.qrbox img{width:100%;height:100%;display:block}
.qrbox .line{position:absolute;left:0;right:0;top:0;height:3px;background:#46B48F;box-shadow:0 0 10px #46B48F;animation:scan 1.3s ease-in-out forwards}
@keyframes scan{to{top:167px}}
.touch{background:#101615;color:#E9EEEB;border-radius:16px;padding:12px;border:6px solid #2A302E}
.tbar{display:flex;justify-content:space-between;font-size:13px;color:#E8D2A6;padding:0 2px 8px}
.tbar span{color:#7E8A86}
.alert{background:#C9772A;color:#fff;border-radius:10px;padding:9px 12px;font-size:13.5px;font-weight:500;margin-bottom:8px}
.tsub{font-size:13px;color:#E8D2A6;margin-bottom:8px;padding:0 2px}
.trow{display:grid;grid-template-columns:1fr auto auto;gap:8px;align-items:center;background:#1B2523;border-radius:10px;padding:9px 10px;margin-top:6px}
.trow b{font-weight:500;font-size:13.5px;display:block}
.trow small{color:#8E9A95;font-size:11.5px}
.tbtn{border:0;border-radius:9px;padding:9px 12px;font-size:13px;font-weight:600;cursor:pointer;color:#fff;min-width:96px}
.tbtn.prep{background:#C98A1B} .tbtn.ready{background:#2E8B6E}
.touch.small{padding:10px;border-width:5px}
.pend{font-size:12px;color:#C9D1CE;font-style:italic;grid-column:1/-1;justify-self:end}
.trow .tbtn{grid-column:1/-1;justify-self:end}
.trow{grid-template-columns:1fr auto}
.tbtn{white-space:nowrap}
.tbtn:hover{filter:brightness(1.08)}
.sync{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.sync .device ul{padding:4px 9px 8px}
.sync .device li{font-size:12px;flex-wrap:wrap;gap:4px}
.sync .device li .st{margin-left:auto}
.sync .device header{font-size:12px;padding:8px 9px}
.sync .device header span{display:none}
.bar{height:4px;background:var(--soft);border-radius:3px;overflow:hidden;width:60px}
.bar i{display:block;height:100%;background:var(--cook)}
.time{display:grid;grid-template-columns:72px 1fr;gap:5px 10px;font-size:13px}
.time span{color:var(--ink-3)}

/* database step */
.think{border:1.5px dashed var(--brass);background:var(--brass-l);border-radius:12px;padding:12px 14px;font-size:13.5px;color:var(--ink-2)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips span{border:1px solid var(--line);border-radius:20px;padding:3px 10px;font-size:12.5px;background:var(--card)}
.form{display:flex;flex-direction:column;gap:8px;border:1px solid var(--line);border-radius:12px;padding:12px}
.form label{font-size:12px;color:var(--ink-3)}
.form input,.form textarea{width:100%;border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:var(--card);outline:none}
.form input:focus,.form textarea:focus{border-color:var(--green)}
.form textarea{min-height:70px;resize:vertical}
.mine{display:flex;flex-direction:column;gap:8px}
.tcard{border:1px solid var(--line);border-radius:10px;padding:9px 12px;position:relative}
.tcard b{font-size:13.5px}
.tcard .cols{display:flex;flex-wrap:wrap;gap:5px;margin-top:5px}
.tcard .cols span{font-size:11.5px;background:var(--soft);border-radius:5px;padding:1px 7px}
.tcard .x{position:absolute;right:8px;top:6px;border:0;background:none;cursor:pointer;color:var(--ink-3);font-size:16px}
.erd{border:1px solid var(--line);border-radius:12px;background:var(--soft);overflow-x:auto}
.erd svg{display:block}
.erd .box{cursor:pointer}
.erd .box rect.b{fill:var(--card);stroke:var(--line);stroke-width:1.2}
.erd .box.sel rect.b{stroke:var(--green);stroke-width:2.4}
.erd .box.hit rect.h{fill:var(--green)} .erd .box.miss rect.h{fill:var(--brass)}
.erd text{font-family:var(--sans);font-size:11px;fill:var(--ink-2)}
.erd text.t{font-weight:600;fill:#fff;font-size:11.5px}
.erd text.k{font-weight:600;font-size:9px}
.erd line{stroke:var(--ink-3);stroke-width:1.3}
.erd text.c{font-weight:600;fill:var(--ink)}
.cmp{display:flex;flex-direction:column;gap:7px}
.cmp div{border-radius:10px;padding:9px 12px;font-size:13px}
.cmp .ok{background:var(--green-l)} .cmp .no{background:var(--brass-l)}
.cmp b{font-weight:600}
table.rows{width:100%;border-collapse:collapse;font-size:12px}
table.rows th{text-align:left;color:var(--ink-3);font-weight:500;padding:5px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
table.rows td{padding:5px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
.scroll{overflow-x:auto;border:1px solid var(--line);border-radius:10px}

.tabs{display:flex;gap:2px;padding:10px 14px 0;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--card);z-index:2}
.tabs button{border:0;background:none;padding:9px 12px;font-size:13px;color:var(--ink-3);cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px;display:flex;gap:6px;align-items:center}
.tabs button.on{color:var(--green);border-bottom-color:var(--green);font-weight:500}
.tabs em{font-style:normal;font-size:11px;background:var(--green-l);color:var(--green);border-radius:10px;padding:0 7px}
.roles{display:grid;grid-template-columns:1fr 1fr;gap:6px;padding:12px 14px 0}
.roles button{display:flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--card);border-radius:10px;padding:6px 8px;cursor:pointer;text-align:left;position:relative}
.roles button:hover{border-color:var(--ink-3)}
.roles button.on{border-color:var(--rc);box-shadow:inset 0 0 0 1px var(--rc);background:var(--soft)}
.roles i{width:26px;height:26px;border-radius:50%;background:var(--rc);color:#fff;display:grid;place-items:center;font-style:normal;font-size:12px;font-weight:600;flex:none}
.roles b{font-weight:500;font-size:12.5px;display:block;line-height:1.2}
.roles small{font-size:11px;color:var(--ink-3)}
.roles span{flex:1;min-width:0}
.roles em{flex:none;font-style:normal;font-size:10px;font-weight:600;color:#fff;background:var(--brass);border-radius:8px;padding:0 6px}
.next{display:flex;align-items:center;gap:10px;justify-content:space-between;background:var(--brass-l);border:1px solid #E2CDA6;border-radius:10px;padding:8px 10px;font-size:13px}
.btn.sm{padding:7px 11px;font-size:12.5px;white-space:nowrap}
ul.plain{list-style:none;margin:0;padding:0}
ul.plain li{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:7px 0;border-bottom:1px solid var(--line);font-size:13px}
.wide-phone{width:280px}.pscreen{background:#fff;border-radius:12px;padding:8px 12px;color:#1D2321}
.pscreen ul.plain li{border-color:#ECECEA}
.tablet{background:#F4F6F5;border:8px solid #2A302E;border-radius:18px;padding:10px;color:#1D2321}
.tablet .tbar{color:#24453F}.tablet .tbar span{color:#7A8580}
.tablet .tsub{color:#4A5450}.tablet .trow{background:#fff}.tablet .trow small{color:#7A8580}.tablet .trow{grid-template-columns:1fr auto}
.tmap{display:flex;gap:6px;margin-bottom:8px}
.tmap div{flex:1;background:#fff;border:1px solid #DDE2DF;border-radius:9px;padding:6px;text-align:center}
.tmap div.occ{border-color:#3B6FB6;background:#EAF1FB}
.tmap b{display:block;font-family:var(--serif);font-size:18px}.tmap span{font-size:11px;color:#7A8580}
.alert.green{background:#2E8B6E}
.trow.other{opacity:.5}
.ostats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.ostats div{border:1px solid var(--line);border-radius:10px;padding:9px}
.ostats b{font-family:var(--serif);font-size:20px;display:block}.ostats span{font-size:11.5px;color:var(--ink-3)}
.device li .small{margin-left:6px}
.hold{font-size:12px;color:var(--ink-3);text-align:center;margin-bottom:-6px}
.phone.app{width:286px;padding:26px 10px 14px}
.appscreen{background:#FBF8F2;border-radius:16px;overflow:hidden;color:#1D2321;display:flex;flex-direction:column;max-height:520px}
.apph{background:#24453F;color:#fff;padding:12px 14px}
.apph b{font-family:var(--serif);font-weight:600;font-size:17px;display:block}
.apph span{font-size:12px;opacity:.85}
.tlist{display:flex;flex-direction:column;gap:7px;padding:12px}
.tlist button{display:grid;grid-template-columns:38px 1fr auto;align-items:center;gap:10px;background:#fff;border:1px solid #E5DFD3;border-radius:12px;padding:9px 12px;cursor:pointer;text-align:left}
.tlist button:hover,.tlist button.hov{border-color:#24453F;background:#EEF4F2}
.tlist b{font-family:var(--serif);font-size:22px;color:#24453F}
.tlist span{font-size:13px}
.tlist em{font-style:normal;font-size:11.5px;color:#2E8B6E;font-weight:600}
.pcenter{padding:40px 16px;text-align:center;display:flex;flex-direction:column;gap:6px}
.pcenter b{font-family:var(--serif);font-size:20px}.pcenter span{font-size:13px;color:#6B746F}
.viewfinder{background:#0E1211;color:#C9D1CE;text-align:center;padding:18px 10px 14px;font-size:12.5px}
.viewfinder p{color:#C9D1CE;margin:12px 0 6px}
.viewfinder small{display:block;color:#8E9A95;margin-top:4px}
.shutter{width:58px;height:58px;border-radius:50%;border:4px solid #fff;background:transparent;cursor:pointer;display:grid;place-items:center;margin:6px auto 0}
.shutter i{width:42px;height:42px;border-radius:50%;background:#fff;display:block}
.shutter:hover i{background:#E8D2A6}
.pmenu{overflow-y:auto;padding:4px 12px;flex:1}
.pdish{display:grid;grid-template-columns:48px 1fr auto;gap:9px;align-items:center;padding:7px 0;border-bottom:1px solid #EDE6D8}
.pdish svg{width:48px;height:36px;border-radius:6px;display:block}
.pdish b{font-weight:500;font-size:12.5px;display:block;line-height:1.3}
.pdish small{color:#8A7F70;font-size:11.5px}
.pdish .qty{gap:5px}.pdish .qty button{width:24px;height:24px;font-size:14px}
.porder{margin:10px 12px 12px;border:0;border-radius:12px;background:#24453F;color:#fff;padding:12px;font:500 13.5px var(--sans);cursor:pointer}
.porder:disabled{background:#B9C4C0;cursor:not-allowed}
.pendl{font-size:12.5px;color:#4A5450;font-style:italic;text-align:center;padding:8px}
.bubble{position:absolute;left:0;top:0;pointer-events:none;background:#fff;color:#1D2321;border:1px solid rgba(36,69,63,.25);border-radius:14px;padding:6px 12px;font-size:13px;font-weight:500;white-space:nowrap;box-shadow:0 6px 16px rgba(0,0,0,.12);opacity:0;z-index:5;transition:opacity .2s}
.bubble::after{content:"";position:absolute;left:50%;bottom:-6px;width:10px;height:10px;background:#fff;border-right:1px solid rgba(36,69,63,.25);border-bottom:1px solid rgba(36,69,63,.25);transform:translateX(-50%) rotate(45deg)}
.bubble.clamped::after{display:none}
@keyframes nudge{0%{box-shadow:0 0 0 0 rgba(46,139,110,.55)}70%{box-shadow:0 0 0 10px rgba(46,139,110,0)}100%{box-shadow:0 0 0 0 rgba(46,139,110,0)}}
@keyframes nudge2{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}
.cta{animation:nudge 1.8s ease-out infinite}
.shutter.cta{animation:nudge 1.8s ease-out infinite,nudge2 1.8s ease-in-out infinite}
.cta-soft:first-child{animation:nudge 2.2s ease-out infinite}
.dtabs{display:grid;grid-template-columns:repeat(4,1fr);gap:3px;background:var(--soft);border:1px solid var(--line);border-radius:12px;padding:3px}
.dtabs button{border:0;background:none;border-radius:9px;padding:7px 4px;font-size:12px;color:var(--ink-3);cursor:pointer;position:relative;line-height:1.25}
.dtabs button.on{background:var(--card);color:var(--ink);font-weight:500;box-shadow:0 1px 3px rgba(0,0,0,.08)}
.dtabs i{position:absolute;top:5px;right:6px;width:7px;height:7px;border-radius:50%;background:var(--brass)}
.dview{display:flex;flex-direction:column;gap:10px}
.ptrack{padding:12px 14px;display:flex;flex-direction:column;gap:2px}
.ptrack>b{font-family:var(--serif);font-size:17px;margin-bottom:4px}
.pline{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:7px 0;border-bottom:1px solid #ECE6DA;font-size:13px}
.ptotal{display:flex;justify-content:space-between;padding-top:8px;font-size:13px}
.appscreen .recv{border-top:1px solid #ECE6DA}
.rscreen{background:#F4F6F5;border:1px solid var(--line);border-radius:14px;padding:10px;color:#1D2321}
.rscreen .tbar{color:#24453F}.rscreen .tbar span{color:#7A8580}.rscreen .tsub{color:#4A5450}.rscreen .trow{background:#fff;grid-template-columns:1fr auto}.rscreen .trow small{color:#7A8580}

<body>
<header class="top">
  <div class="brand"><b>Kaveri Kitchen</b><span>Follow one order, from the door to the plate</span></div>
  <ol class="steps" id="steps"></ol>
  <button class="ghost" id="restart">Start again</button>
</header>
<main>
  <div class="stage" id="stage"><canvas id="c" aria-label="3D restaurant. Drag to look around, scroll to zoom."></canvas><div class="views" id="views"></div><div class="tip" id="tip"></div><div class="hint">Drag to look around, scroll to zoom</div></div>
  <aside class="panel" id="panel"></aside>
</main>
<script src="https://cdn.jsdelivr.net/npm/three@0.149.0/build/three.min.js"></script>
<script>
'use strict';
/* ============ data ============ */
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmtT=m=>{ m=Math.round(m); const h=Math.floor(m/60)%24, mm=m%60; return `${h%12||12}:${String(mm).padStart(2,'0')} ${h>=12?'PM':'AM'}`; };
const rupee=v=>'₹'+v.toLocaleString('en-IN');
const MENU=[
  {id:'ptb', name:'Paneer Tikka Biryani', price:280, prep:14, art:'biryani', col:'#E3A23F', top:'#E9773A', cat:'Biryani'},
  {id:'cbr', name:'Chicken Biryani', price:300, prep:15, art:'biryani', col:'#D58B2E', top:'#8B4A23', cat:'Biryani'},
  {id:'dosa', name:'Masala Dosa', price:110, prep:8, art:'dosa', col:'#D69A3C', top:'#F2C14E', cat:'Tiffin'},
  {id:'m65', name:'Mushroom 65', price:190, prep:10, art:'starter', col:'#C2410C', top:'#E86A2A', cat:'Starter'},
  {id:'pbm', name:'Paneer Butter Masala', price:260, prep:12, art:'curry', col:'#E2672B', top:'#FFF3DC', cat:'Curry'},
  {id:'naan', name:'Butter Naan', price:55, prep:6, art:'naan', col:'#EBC98A', top:'#9A5B22', cat:'Bread'},
  {id:'lassi', name:'Mango Lassi', price:110, prep:4, art:'juice', col:'#F6A623', top:'#FDE68A', cat:'Drink'},
  {id:'gulab', name:'Gulab Jamun', price:90, prep:3, art:'dessert', col:'#7A2E12', top:'#F4C77B', cat:'Dessert'},
];
const MB=Object.fromEntries(MENU.map(m=>[m.id,m]));
const TABLES=[{no:1,x:-8.5,z:1},{no:2,x:-2.5,z:1},{no:3,x:3.5,z:1},{no:4,x:-5.5,z:6.4},{no:5,x:0.5,z:6.4}];
const STAFF={owner:'Kavitha'};
const STEPS=['Choose table','Scan QR','Order','Kitchen','Serve','Database'];
const CHEFS=[
  {id:1, name:'Ravi', station:'Stove', dishes:['ptb','cbr','pbm','m65'], work:{x:-8.4,z:-7.75}, idle:{x:-5.3,z:-6.8}, pans:[0,1]},
  {id:2, name:'Meena', station:'Tawa', dishes:['dosa','naan'], work:{x:-6.3,z:-7.75}, idle:{x:-4.1,z:-6.8}, pans:[2]},
  {id:3, name:'Arjun', station:'Juice & dessert', dishes:['lassi','gulab'], work:{x:0.5,z:-7.75}, idle:{x:-2.9,z:-6.8}, pans:[]},
];
const WAITERS=[{id:4, name:'Selvi', she:'she', tables:[1,2,4], home:{x:-9.6,z:-2.55}},{id:5, name:'Joseph', she:'he', tables:[3,5], home:{x:2.6,z:-2.55}}];
const chefFor=id=>CHEFS.find(c=>c.dishes.includes(id));
const waiterFor=no=>WAITERS.find(w=>w.tables.includes(no));
const GUESTS=['Arun','Priya','Kavin']; const PHONE_G=1;
const LABEL={ORDERED:'Ordered',PREPARING:'Preparing',READY:'Food ready',SERVED:'Served'};
const SEAT_ANG=[90,140,40].map(a=>a*Math.PI/180);
const DOOR={x:9.6,z:10.6}, RECEPTION={x:7.9,z:6.9}, PASS_FRONT={x:-4,z:-2.75}, PASS_BACK={x:-4,z:-4.35}, OWNER={x:10.2,z:4.6};

let ST;
function freshState(){ return {step:0, phase:'start', table:null, cart:{}, order:null, t:19*60+30, log:{}, my:[], revealed:false, sel:null, busy:false, tab:'screens', role:'customer', serving:false, db:freshDb(), sql:[], changed:{}, actN:0}; }
/* ---------- the live database ---------- */
function freshDb(){ return {
  DINING_TABLE:TABLES.map(t=>({table_id:t.no, table_no:t.no, seats:3, waiter_id:waiterFor(t.no).id, status:'AVAILABLE'})),
  CUSTOMER:[], ORDERS:[], ORDER_ITEM:[],
  MENU_ITEM:MENU.map((m,i)=>({menu_item_id:i+1, name:m.name, category:m.cat, price:m.price, prep_minutes:m.prep})),
  EMPLOYEE:[...CHEFS.map(c=>({employee_id:c.id,name:c.name,role:'CHEF'})),...WAITERS.map(w=>({employee_id:w.id,name:w.name,role:'WAITER'})),{employee_id:6,name:STAFF.owner,role:'OWNER'}] }; }
const PK={DINING_TABLE:'table_id',CUSTOMER:'customer_id',ORDERS:'order_id',ORDER_ITEM:'order_item_id',MENU_ITEM:'menu_item_id',EMPLOYEE:'employee_id'};
const sqlv=v=>v==null?'NULL':typeof v==='number'?v:`'${String(v).replace(/'/g,"''")}'`;
function act(by){ ST.actN++; ST.changed={}; ST.actBy=by; }
function mark(table,key,cols){ const c=ST.changed[table]=ST.changed[table]||{}; c[key]=cols; }
function logSql(sql,by,kind){ ST.sql.unshift({sql,by,kind,t:ST.t,n:ST.actN}); showSqlBar(); }
function dbIns(table,row,by){ ST.db[table].push(row); mark(table,row[PK[table]],'all'); logSql(`INSERT INTO ${table} (${Object.keys(row).join(', ')})\nVALUES (${Object.values(row).map(sqlv).join(', ')});`,by,'write'); }
function dbUpd(table,set,where,by){ const [col,val]=Object.entries(where)[0]; const rows=ST.db[table].filter(r=>r[col]===val); rows.forEach(r=>{ Object.assign(r,set); mark(table,r[PK[table]],Object.keys(set)); });
  logSql(`UPDATE ${table}\nSET ${Object.entries(set).map(([k,v])=>`${k} = ${sqlv(v)}`).join(', ')}\nWHERE ${col} = ${sqlv(val)};`,by,'write'); }
function dbSel(sql,by){ logSql(sql,by,'read'); }
function showSqlBar(){ /* queries are shown only in the Live database tab */ }

/* ============ food illustrations for the menu ============ */
function foodArt(m){
  let x=0; for(const ch of m.id) x=(x*31+ch.charCodeAt(0))>>>0; const r=()=>{ x=(x*1664525+1013904223)>>>0; return x/4294967296; };
  const c=m.col,t=m.top; const plate=`<ellipse cx="60" cy="52" rx="44" ry="22" fill="#E7E5E0"/><ellipse cx="60" cy="50" rx="42" ry="20" fill="#fff"/>`;
  let b='';
  if(m.art==='biryani'){ b=plate+`<ellipse cx="60" cy="45" rx="28" ry="14" fill="${c}"/>`; for(let i=0;i<55;i++){ const a=r()*6.28,d=Math.sqrt(r()); b+=`<ellipse cx="${(60+Math.cos(a)*d*25).toFixed(1)}" cy="${(44+Math.sin(a)*d*11).toFixed(1)}" rx="2.4" ry=".8" fill="${r()<.4?'#FFF8E7':'#FBD38D'}"/>`; } for(let i=0;i<5;i++) b+=`<rect x="${44+r()*30}" y="${37+r()*12}" width="6" height="5" rx="1.4" fill="${t}"/>`; b+=`<path d="M52 36 q3 -4 6 0" fill="#3F8F4E"/>`; }
  else if(m.art==='starter'){ b=plate; for(let i=0;i<10;i++){ const px=38+r()*42, py=40+r()*14; b+=`<path d="M${px} ${py} q5 -6 10 -1 q3 5 -3 8 q-7 2 -7 -7z" fill="${i%3?c:t}"/>`; } b+=`<path d="M46 38 q4 -3 8 0" stroke="#2F7D4A" stroke-width="2" fill="none"/>`; }
  else if(m.art==='dosa'){ b=`<rect x="8" y="26" width="104" height="48" rx="8" fill="#8FBF79"/><path d="M14 52 Q60 24 106 44 L104 58 Q60 54 16 62Z" fill="${c}"/><circle cx="30" cy="68" r="7" fill="#E07A2E"/><circle cx="48" cy="70" r="6" fill="#F8FAFC"/>`; }
  else if(m.art==='curry'){ b=`<ellipse cx="60" cy="56" rx="38" ry="17" fill="#7C3F1D"/><ellipse cx="60" cy="48" rx="38" ry="17" fill="#B87333"/><ellipse cx="60" cy="47" rx="32" ry="13" fill="${c}"/><path d="M38 46 q11 -7 22 0 t22 0" stroke="${t}" stroke-width="2.5" fill="none"/>`; for(let i=0;i<5;i++) b+=`<rect x="${44+r()*28}" y="${41+r()*9}" width="6" height="5" rx="1" fill="#FFF7E6"/>`; }
  else if(m.art==='naan'){ b=plate+`<path d="M26 48 Q32 30 64 31 Q94 33 94 50 Q88 63 60 63 Q30 63 26 48Z" fill="${c}"/>`; for(let i=0;i<16;i++) b+=`<ellipse cx="${34+r()*54}" cy="${37+r()*20}" rx="2.2" ry="1.4" fill="${t}" opacity=".5"/>`; }
  else if(m.art==='juice'){ b=`<path d="M44 14 L76 14 L71 80 L49 80Z" fill="#E3EEF1"/><path d="M45.6 28 L74.4 28 L71 80 L49 80Z" fill="${c}"/><rect x="63" y="4" width="3" height="40" rx="1.5" fill="#24453F" transform="rotate(12 64 24)"/>`; }
  else { b=`<ellipse cx="60" cy="56" rx="36" ry="16" fill="#E7E5E0"/><ellipse cx="60" cy="52" rx="34" ry="14" fill="#fff"/><ellipse cx="60" cy="53" rx="27" ry="9" fill="${t}" opacity=".8"/><circle cx="50" cy="48" r="10" fill="${c}"/><circle cx="70" cy="49" r="10" fill="${c}"/>`; }
  return `<svg viewBox="0 0 120 90" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><rect width="120" height="90" fill="#F3EBDD"/>${b}</svg>`;
}

function qrCanvas(seed){ const c=document.createElement('canvas'); c.width=c.height=250; const g=c.getContext('2d'); let x=seed*7919+13; const r=()=>{ x=(x*1664525+1013904223)>>>0; return x/4294967296; }; const N=25, s=10; g.fillStyle='#fff'; g.fillRect(0,0,250,250); g.fillStyle='#111';
  const finder=(cx,cy)=>{ g.fillRect(cx*s,cy*s,7*s,7*s); g.fillStyle='#fff'; g.fillRect((cx+1)*s,(cy+1)*s,5*s,5*s); g.fillStyle='#111'; g.fillRect((cx+2)*s,(cy+2)*s,3*s,3*s); };
  for(let yy=0;yy<N;yy++) for(let xx=0;xx<N;xx++){ const inF=(xx<8&&yy<8)||(xx>=N-8&&yy<8)||(xx<8&&yy>=N-8); if(!inF && r()<.47) g.fillRect(xx*s,yy*s,s,s); }
  finder(0,0); finder(N-7,0); finder(0,N-7); return c; }
/* ============ 3D scene ============ */
const V={ctl:{tx:0.5,tz:2.2,ty:0.6,r:25,th:0.4,ph:0.93}, goal:null, pick:[], actors:{}, plates:{}, tokens:[], steam:[], labels:{}, tableObjs:{}};
function std(color,o={}){ return new THREE.MeshStandardMaterial({color, roughness:o.r??0.7, metalness:o.m??0, ...(o.x||{})}); }
function mesh(geo,mat,x=0,y=0,z=0,parent,cast=true){ const m=new THREE.Mesh(geo,mat); m.position.set(x,y,z); m.castShadow=cast; m.receiveShadow=true; (parent||V.scene).add(m); return m; }
const box=(w,h,d,mat,x,y,z,p)=>mesh(new THREE.BoxGeometry(w,h,d),mat,x,y,z,p);

    mesh(new THREE.CapsuleGeometry(0.075,0.3,4,10),bottom,0,-0.21,0,hip);

  const torso=mesh(new THREE.CapsuleGeometry(0.19,0.36,6,14),top,0,1.17,0,body); torso.scale.set(1.12,1,0.74);
  if(o.role==='chef'){ mesh(new THREE.BoxGeometry(0.34,0.55,0.03),M(0xFFFFFF),0,1.02,0.15,body); }
  if(o.role==='waiter'){ mesh(new THREE.BoxGeometry(0.16,0.3,0.03),M(0xF3F1EC),0,1.33,0.14,body); }
  const arms=[];
  for(const sx of [-0.26,0.26]){ const sh=new THREE.Group(); sh.position.set(sx,1.4,0); body.add(sh);
    mesh(new THREE.CapsuleGeometry(0.055,0.24,4,8),arm,0,-0.16,0,sh); const el=new THREE.Group(); el.position.y=-0.33; sh.add(el);
    mesh(new THREE.CapsuleGeometry(0.05,0.22,4,8),arm,0,-0.14,0,el); mesh(new THREE.SphereGeometry(0.05,10,8),skin,0,-0.3,0,el); arms.push({sh,el}); }
  mesh(new THREE.CylinderGeometry(0.06,0.07,0.1,10),skin,0,1.52,0,body);
  mesh(new THREE.SphereGeometry(0.155,20,16),skin,0,1.66,0,body);
  const h=mesh(new THREE.SphereGeometry(0.162,20,16,0,Math.PI*2,0,Math.PI*0.55),hair,0,1.68,-0.015,body); h.rotation.x=-0.25;
  if(o.long) { const b=mesh(new THREE.CapsuleGeometry(0.12,0.22,4,10),hair,0,1.5,-0.1,body); b.scale.set(1.1,1,0.6); }
  if(o.role==='chef'){ mesh(new THREE.CylinderGeometry(0.13,0.12,0.18,16),M(0xFFFFFF),0,1.86,0,body); mesh(new THREE.SphereGeometry(0.16,14,10),M(0xFFFFFF),0,1.98,0,body).scale.set(1,0.6,1); }
  // tray and tablet

/* ============ database step ============ */
const OUR={
 DINING_TABLE:{cols:[['table_id','PK'],['table_no'],['seats'],['waiter_id','FK'],['status']], about:'One row per physical table. waiter_id says which waiter looks after it.', show:'tables'},
 CUSTOMER:{cols:[['customer_id','PK'],['name'],['phone'],['party_size']], about:'Who came in. The family is one customer row with a party size.', show:'guests'},
 ORDERS:{cols:[['order_id','PK'],['table_id','FK'],['customer_id','FK'],['ordered_at'],['status'],['total']], about:'One confirmed order. It links the table and the customer. The waiter is found through the table.', show:'order'},
 ORDER_ITEM:{cols:[['order_item_id','PK'],['order_id','FK'],['menu_item_id','FK'],['quantity'],['unit_price'],['status'],['chef_id','FK']], about:'One line per dish. Each dish has its own status (ordered, preparing, food ready, served) and its own chef, so one dish can be ready while another is still cooking.', show:'plates'},
 MENU_ITEM:{cols:[['menu_item_id','PK'],['name'],['category'],['price'],['prep_minutes']], about:'Everything on the menu card, with today\u2019s price.', show:'menu'},
 EMPLOYEE:{cols:[['employee_id','PK'],['name'],['role']], about:'Three chefs, two waiters and the owner. One table with a role column, not one table per job.', show:'staff'},
};
const POS={DINING_TABLE:[10,10],CUSTOMER:[200,230],ORDERS:[200,10],EMPLOYEE:[10,200],ORDER_ITEM:[390,10],MENU_ITEM:[390,210]};
const RELS=[['DINING_TABLE','ORDERS','table_id'],['CUSTOMER','ORDERS','customer_id'],['ORDERS','ORDER_ITEM','order_id'],['MENU_ITEM','ORDER_ITEM','menu_item_id'],['EMPLOYEE','DINING_TABLE','waiter_id'],['EMPLOYEE','ORDER_ITEM','chef_id']];
function rowsOf(n){ return ST.db[n]; }

function matchOur(name){ const n=name.toLowerCase().replace(/[^a-z]/g,'');
  if(/order/.test(n) && /(item|detail|line|dish|food|product)/.test(n)) return 'ORDER_ITEM';
  if(/(order|bill|booking)/.test(n)) return 'ORDERS';
  if(/(employee|staff|chef|cook|waiter|owner|worker|manager)/.test(n)) return 'EMPLOYEE';
  if(/(customer|guest|visitor|person|people|family|client|user)/.test(n)) return 'CUSTOMER';
  if(/(menu|dish|food|item|product|recipe)/.test(n)) return 'MENU_ITEM';
  if(/(table|seat|sofa|dining)/.test(n)) return 'DINING_TABLE';
  return null; }
function erdSVG(){ const W=560, BW=160, rowH=15; const H=Object.fromEntries(Object.entries(OUR).map(([n,e])=>[n,26+e.cols.length*rowH+8]));
  const matched=new Set(ST.my.map(t=>matchOur(t.name)).filter(Boolean));
  const ctr=n=>({x:POS[n][0]+BW/2,y:POS[n][1]+H[n]/2});
  const edge=(a,b)=>{ const A=ctr(a),B=ctr(b); const clip=(c,o,h)=>{ const dx=o.x-c.x,dy=o.y-c.y; const s=Math.min(dx?(BW/2)/Math.abs(dx):1e9, dy?(h/2)/Math.abs(dy):1e9); return {x:c.x+dx*s,y:c.y+dy*s}; }; return [clip(A,B,H[a]),clip(B,A,H[b])]; };
  let s=`<svg width="${W}" height="380" viewBox="0 0 ${W} 380">`;
  for(const [a,b] of RELS){ const [p,q]=edge(a,b); s+=`<line x1="${p.x}" y1="${p.y}" x2="${q.x}" y2="${q.y}"/><text class="c" x="${p.x+(q.x-p.x)*0.14}" y="${p.y+(q.y-p.y)*0.14-4}" text-anchor="middle">1</text><text class="c" x="${q.x+(p.x-q.x)*0.16}" y="${q.y+(p.y-q.y)*0.16-4}" text-anchor="middle">N</text>`; }
  for(const [n,e] of Object.entries(OUR)){ const [x,y]=POS[n]; const cls=ST.sel===n?'sel':''; const m=ST.my.length?(matched.has(n)?'hit':'miss'):'';
    s+=`<g class="box ${cls} ${m}" data-a="selEnt" data-x="${n}" tabindex="0" role="button" aria-label="${n}"><rect class="b" x="${x}" y="${y}" width="${BW}" height="${H[n]}" rx="9"/><rect class="h" x="${x}" y="${y}" width="${BW}" height="24" rx="9" fill="#24453F"/><rect x="${x}" y="${y+14}" width="${BW}" height="10" fill="${m==='miss'?'#A97C3F':'#24453F'}"/><text class="t" x="${x+10}" y="${y+16}">${n}</text>`;
    e.cols.forEach(([c,k],i)=>{ s+=`<text x="${x+10}" y="${y+40+i*rowH}">${k?`<tspan class="k" fill="${k==='PK'?'#A97C3F':'#2E8B6E'}">${k} </tspan>`:''}${c}</text>`; }); s+=`</g>`; }
  return s+'</svg>'; }
function compareHTML(){
  if(!ST.my.length) return '';
  const used={}; const lines=[];
  for(const t of ST.my){ const m=matchOur(t.name); if(m){ (used[m]=used[m]||[]).push(t); } }
  for(const [n,e] of Object.entries(OUR)){
    const mine=used[n];
    if(mine){ const theirs=new Set(mine.flatMap(t=>t.cols.map(c=>c.toLowerCase().replace(/[^a-z_]/g,'')))); const miss=e.cols.map(c=>c[0]).filter(c=>!theirs.has(c) && !(c.endsWith('_id')&&[...theirs].some(x=>x.endsWith('id')&&x.includes(c.split('_')[0]))));
      lines.push(`<div class="ok"><b>${n}</b> matches your ${mine.map(t=>esc(t.name)).join(' and ')}.${mine.length>1&&n==='EMPLOYEE'?' We used one EMPLOYEE table with a <b>role</b> column instead of one table per job.':''}${miss.length?` Columns you could add: ${miss.join(', ')}.`:' Your columns cover ours.'}</div>`); }
    else lines.push(`<div class="no"><b>${n}</b> is missing. ${e.about}</div>`);
  }
  const extra=ST.my.filter(t=>!matchOur(t.name)); extra.forEach(t=>lines.push(`<div class="no"><b>${esc(t.name)}</b> has no match in our design. Could it be a column of another table instead?</div>`));
  return `<div class="cmp">${lines.join('')}</div>`; }
function rowsTable(rows){ if(!rows.length) return '<p class="small">No rows yet.</p>'; const c=Object.keys(rows[0]); return `<div class="scroll"><table class="rows"><tr>${c.map(x=>`<th>${x}</th>`).join('')}</tr>${rows.map(r=>`<tr>${c.map(x=>`<td>${esc(r[x])}</td>`).join('')}</tr>`).join('')}</table></div>`; }
ACT.addTable=()=>{ const n=$('tName').value.trim(); const cols=$('tCols').value.split(/[\n,]/).map(s=>s.trim()).filter(Boolean); if(!n){ $('tName').focus(); return; } ST.my.push({name:n,cols}); ST._clearForm=true; render(); $('tName').focus(); };
ACT.delTable=x=>{ ST.my.splice(+x,1); render(); };
ACT.reveal=()=>{ ST.revealed=true; ST.sel='ORDER_ITEM'; render(); showRef('ORDER_ITEM'); const h=$('ours'); if(h) $('panel').scrollTo({top:h.offsetTop-12, behavior:'smooth'}); };

function clearRef(){ for(const t of TABLES){ V.tableObjs[t.no].ring.visible=false; V.tableObjs[t.no].num.visible=false; } Object.values(V.labels).forEach(l=>l.visible=false); }
function showRef(n){ clearRef(); const k=OUR[n].show;
  if(k==='tables'){ showTableChoice(true); TABLES.forEach(t=>V.tableObjs[t.no].ring.material.opacity=0.8); cam('overview'); }
  if(k==='guests'||k==='plates'||k==='order'){ const o=V.tableObjs[ST.table]; if(o){ o.ring.visible=true; o.ring.material.opacity=0.9; } camTable(ST.table||3, k==='plates'?6:9); if(k==='order'){ V.labels.monitor.visible=true; V.labels.monitor.position.set(-1.2,3.95,-8.9); } }
  if(k==='staff'){ cam('order'); }
  if(k==='menu'){ camTable(ST.table||3,7); } }

      const party=pick([2,3,4],x=>x===2?3:x===3?3:2); const occ=R()<(wkend?.3:dow===5?.22:.08)?(R()<.66?'Birthday':'Anniversary'):null;
      const pref=app?pick([3,5,1,2,4],x=>({3:3.2,5:2.4,1:1.6,2:1,4:.9})[x]):null;
      const free=tables.filter(tb=>!tb.res.some(r=>Math.abs(r.start-e.t)<100)); if(!free.length) continue;
      const tb=(pref&&free.find(x=>x.n===pref))||free[Math.floor(R()*free.length)];
      const noShow=R()<(app?.055:.13), late=noShow?0:(R()<.32?Math.round(rnd(5,32)):0);
      const r={start:e.t, app, party, occ, noShow, late, table:tb.n, prefGot:pref?tb.n===pref:null, pref, lunch, daysAhead:Math.round(rnd(0,app?6:3)), preorder:app&&R()<.48, decor:false};

    // simulate the day in arrival order
    const arrivals=[...events.filter(e=>e.kind==='walk').map(e=>({t:e.t, walk:true})), ...booked.map(b=>({t:b.start+b.late, b}))].sort((a,b)=>a.t-b.t);
    const seatedToday=[];
    const loadOf=(waiter,t)=>seatedToday.filter(v=>waiterFor(v.table).name===waiter && v.seat<=t && v.leave>t).length;
    for(const ev of arrivals){
      const b=ev.b, lunch=ev.t<16*60;
      // who is it?
      let c=null;
      if(R()<.52 && customers.length>30){ c=pick(customers.filter(x=>x.visits>0||R()<.02),x=>x.loyalty); }
      if(!c) c=newCust({elderly:R()<(lunch&&!wkend?.21:.09), kids:R()<(wkend&&lunch?.46:wkend?.3:.16)});
      const v={id:visits.length+1, day:d, dow, wkend, arrive:ev.t, cust:c.id, elderly:c.elderly, kids:c.kids, wheel:c.wheel, lang:c.lang, first:c.visits===0,
        party: b?b.party:pick([1,2,3,4],x=>({1:1,2:4,3:3,4:2})[x]) , booked:!!b, app:b?b.app:false, preorder:b?b.preorder:false, late:b?b.late:0, noShow:b?b.noShow:false,
        occasion: b?b.occ:(R()<(wkend?.06:.02)?'Birthday':null), lunch, items:[], reqs:[], walkedAway:false, wait:0};
      if(c.kids) v.party=Math.max(v.party,3);
      if(b && b.noShow){ v.table=b.table; visits.push(v); continue; }
      let tb, seat;
      if(b){ tb=tables[b.table-1]; seat=Math.max(ev.t, tb.freeAt); }
      else {
        const cands=tables.filter(x=>(!v.wheel||x.n===ACCESSIBLE_TABLE) && !x.res.some(r=>!r.noShow && r.start>ev.t-10 && r.start<Math.max(ev.t,x.freeAt)+75));
        if(!cands.length){ v.walkedAway=true; v.wait=35; visits.push(v); continue; }
        tb=cands.reduce((m,x)=>x.freeAt<m.freeAt?x:m,cands[0]); seat=Math.max(ev.t,tb.freeAt);

      }
      v.table=tb.n; v.seat=seat; v.wait=Math.round(seat-ev.t); v.waiter=waiterFor(tb.n).name;
      const dine=36+8*v.party+rnd(0,22)+(v.occasion?18:0)+(v.elderly?10:0)+(v.kids?8:0);
      v.leave=seat+dine; tb.freeAt=v.leave+5;
      // how they ordered
      v.method= v.elderly?pick(['Waiter','Voice','QR'],x=>({Waiter:.52,Voice:.3,QR:.18})[x]) : pick(['QR','Voice','Waiter'],x=>({QR:.8,Voice:.09,Waiter:.11})[x]);
      const load=loadOf(v.waiter,seat);
      v.orderedAt= v.preorder? b.start-30 : seat + (v.method==='QR'?rnd(3,6):v.method==='Voice'?rnd(4,7):rnd(3,6)+1.6*load+rnd(0,3));
      // celebrations
      if(v.occasion){ v.pkg = (b&&R()<.82)||(!b&&R()<.25) ? pick(['Cake and candles','Decor and dessert','Photo memory card'],x=>({'Cake and candles':.45,'Decor and dessert':.35,'Photo memory card':.2})[x]) : null; v.decor=v.pkg==='Decor and dessert'; v.decorChannel=v.decor?(b&&b.app?'3D app':'Phone or at the door'):null; }
      v.photo= v.occasion? R()<.56 : R()<.03; v.photoDeleted=v.photo&&R()<.07;
      if(v.pkg) c.loyalty*=1.9;
      // dishes

      const chosen=[];
      for(let k=0;k<n;k++){
        const id=pick(MENU.map(m=>m.id),x=>{ let w={ptb:3,cbr:2.4,dosa:1.6,m65:1.8,pbm:2,naan:.6,lassi:1.3,gulab:.4}[x];
          if(lunch){ if(x==='cbr'||x==='dosa') w*=1.4; if(x==='m65') w*=.6; } else { if(x==='ptb') w*=1.3; if(x==='m65') w*=1.3; }
          if(wkend&&(x==='ptb'||x==='m65')) w*=1.45; if(v.first&&x==='ptb') w*=1.7; if(v.elderly&&(x==='dosa'||x==='pbm')) w*=1.8; if(v.elderly&&x==='m65') w*=.5; if(v.kids&&(x==='dosa'||x==='lassi')) w*=1.6;
          if(c.fav&&x===c.fav) w*=3.2; return w; });
        chosen.push(id); if(id==='pbm'&&R()<.8) chosen.push('naan'); if(id==='ptb'&&R()<.38) chosen.push('m65'); if(id==='cbr'&&R()<.3) chosen.push('lassi');
      }
      if(v.occasion||v.kids&&R()<.3||R()<.12) chosen.push('gulab');
      for(const id of chosen){
        const m=MB[id]; let at=id==='gulab'?seat+24+rnd(0,8):v.orderedAt; let dish=id;
        // stock check
        const need=RECIPE[id]; for(const [k,q] of Object.entries(need)) demand[k]=(demand[k]||0)+q; let ok=true; for(const [k,q] of Object.entries(need)) if((used[k]||0)+q>stock[k]) ok=false;
        if(!ok){ if(!outLogged[id]){ outLogged[id]=1; stockouts.push({day:d, dish:id, at}); } const sub=id==='m65'?'pbm':id==='pbm'?'dosa':id==='cbr'?'ptb':null; v.unavail=(v.unavail||[]).concat(id);
          if(sub && R()<.5){ dish=sub; let ok2=true; for(const [k,q] of Object.entries(RECIPE[sub])) if((used[k]||0)+q>stock[k]) ok2=false; if(!ok2) continue; v.subst=(v.subst||0)+1; } else { v.lost=(v.lost||0)+MB[id].price; continue; } }
        for(const [k,q] of Object.entries(RECIPE[dish])) used[k]=(used[k]||0)+q;
        items.push({visit:v, dish, at, station:STATION_OF(dish)}); v.items.push(items[items.length-1]);
      }
      // requests
      const R_=[]; if(R()<(v.elderly?.6:v.first?.26:.07)) R_.push('Menu help'); if(R()<.3) R_.push('Water'); if(v.kids&&R()<.55) R_.push('High chair'); if(R()<.1) R_.push('Call waiter'); if(v.method==='Waiter') R_.push('Take order');
      for(const ty of R_){ const at= ty==='Take order'||ty==='Menu help'||ty==='High chair'? seat+rnd(.5,3) : seat+rnd(8,40); const l=loadOf(v.waiter,at); const resp=0.8+1.15*l+(l>=2?2.6:0)+R()*1.8+(ty==='Menu help'?1:0);
        const r={visit:v, type:ty, at, waiter:v.waiter, load:l+1, resp, otherLoad:loadOf(v.waiter==='Selvi'?'Joseph':'Selvi',at)}; reqs.push(r); v.reqs.push(r); }
      seatedToday.push(v); c.visits++; c.history.push(v); if(!c.fav && c.visits>=2) c.fav=v.items.length?v.items[0].dish:null;
      v.promo = (!wkend&&dow!==5&&lunch&&d>=LAUNCH_DAY)?'Weekday lunch 10% off':v.kids&&R()<.35?'Family combo':v.occasion==='Birthday'?'Birthday dessert':null;
      visits.push(v);
    }
    // kitchen: cook every dish of the day with the stations' capacity
    const todays=items.filter(i=>i.visit.day===d).sort((a,b)=>a.at-b.at);
    const slots={}; for(const st of ['Stove','Tawa','Juice & dessert']) slots[st]=[0,0,0];
    for(const it of todays){ const v=it.visit, m=MB[it.dish], h=it.at/60; const cap= (h>=19&&h<22.5)?{Stove:4,Tawa:2,'Juice & dessert':2}[it.station]:(h>=12&&h<15)?{Stove:3,Tawa:2,'Juice & dessert':1}[it.station]:{Stove:2,Tawa:1,'Juice & dessert':1}[it.station];
      const sl=slots[it.station]; let k=0; for(let j=1;j<cap;j++) if(sl[j]<sl[k]) k=j;
      const queue=Math.max(0,sl[k]-it.at); const want=v.preorder&&it.at<v.seat?(v.seat-v.late)-m.prep-3:it.at+0.6;

      v.firstDish= v.items.length?Math.min(...v.items.map(i=>i.served)):null; }
    usageHist.push(demand); usageRows.push({day:d, used:{...used}, demand:{...demand}, stock});
    const w={}; for(const k of Object.keys(ING_COST)) w[k]=Math.max(0,stock[k]-(used[k]||0))*PERISH[k]; wasteRows.push({day:d, waste:w, value:Object.entries(w).reduce((a,[k,q])=>a+q*ING_COST[k],0)});
  }
  for(const c of customers) c.history.forEach((v,i)=>{ v.cameBack=i<c.history.length-1; });
  const seated=visits.filter(v=>v.seat!=null);
  HIST={days, visits, seated, items, reqs, stockouts, wasteRows, usageRows, customers};
  return HIST;
}

const avg=a=>a.length?a.reduce((x,y)=>x+y,0)/a.length:0, sum=(a,f=x=>x)=>a.reduce((s,x)=>s+f(x),0), pc=(a,b)=>b?Math.round(a/b*100):0, r1=x=>Math.round(x*10)/10, r0=Math.round;

const hl12=h=>`${h%12||12} ${h>=12?'PM':'AM'}`, slot30=t=>{ const h=Math.floor(t/60), m=t%60<30?'00':'30'; return `${h%12||12}:${m}`; };

     pat:()=>{ const vo=S.filter(v=>v.method==='Voice'); const ve=vo.filter(v=>v.elderly); return say_(`<b>${pc(vo.filter(v=>v.lang==='Tamil').length,vo.length)}%</b> of voice orders are in Tamil. Among elderly voice users it rises to <b>${pc(ve.filter(v=>v.lang==='Tamil').length,ve.length)}%</b>.`); },
     pre:()=>gap('We only know the language of guests who already used voice. Guests who never tried it may prefer another language, or no voice at all.',['The language chosen on the phone app for every visit','Whether a guest tried voice and then switched to QR or a waiter','A one-tap question after ordering: "Which language would you like next time?"']),
     act:[['Start voice ordering in Tamil, with one tap for English','Fits most current voice users.'],['Ask every guest their language on the app','Collects the missing data for a real prediction.']], more:[]},
    {t:'Which customers frequently request help with menu selection?',
     inv:{look:'Menu-help requests per visit for each kind of guest.', sql:`SELECT c.segment, COUNT(sr.request_id) / COUNT(DISTINCT ts.session_id) AS per_visit\nFROM TABLE_SESSION ts JOIN CUSTOMER c USING (customer_id)\nLEFT JOIN SERVICE_REQUEST sr ON sr.session_id = ts.session_id AND sr.type = 'MENU_HELP'\nGROUP BY c.segment;`,
       run:()=>{ const rate=a=>pc(a.filter(v=>v.reqs.some(r=>r.type==='Menu help')).length,a.length); return bars([['Elderly',rate(elderly)],['First visit',rate(S.filter(v=>v.first&&!v.elderly))],['Families',rate(S.filter(v=>v.kids&&!v.elderly))],['Regulars',rate(S.filter(v=>!v.first&&!v.elderly))]],{fmt:v=>v+'% of visits',hlTop:true}); }},

     pre:()=>{ const sat=A.filter(v=>v.dow===6&&v.booked); return tiles([[r1(perDow(S.filter(v=>v.first||v.elderly),6)),'first-time or elderly tables on a Saturday'],[r1(perDow(S.filter(v=>v.first||v.elderly),6)*0.45),'menu-help requests to expect']])+basis('average Saturday counts of these guests and how often they asked for help.'); },
     act:[['Show "Chef recommends" on the phone for first-time guests','Answers the most common question before it is asked.'],['Brief waiters on the 3 signature dishes','Shorter help conversations.']], more:[]},
    {t:'How long do customers wait before receiving assistance?', cam:'everyone',
     inv:{look:'Time from a request to the waiter arriving, by request type.', sql:`SELECT type, AVG(TIMESTAMPDIFF(SECOND, created_at, acknowledged_at))/60 AS minutes\nFROM SERVICE_REQUEST GROUP BY type ORDER BY minutes DESC;`, run:()=>bars([...grp(Q,r=>r.type)].map(([k,a])=>[k,r1(avg(a.map(r=>r.resp))),a.length+' requests']).sort((a,b)=>b[1]-a[1]),{fmt:v=>v+' min',hlTop:true})},
     pat:()=>{ const lo=Q.filter(r=>r.load===1), hi=Q.filter(r=>r.load>=3); return say_(`When the waiter is looking after 3 seated tables, guests wait <b>${r1(avg(hi.map(r=>r.resp)))} min</b>, against <b>${r1(avg(lo.map(r=>r.resp)))} min</b> when theirs is the only table.`)+bars([1,2,3].map(l=>[`${l} table${l===1?'':'s'} seated`,r1(avg(Q.filter(r=>Math.min(r.load,3)===l).map(r=>r.resp)))]),{fmt:v=>v+' min'}); },
     pre:()=>{ const l8=avg(D.filter(d=>d.dow===6).map(d=>S.filter(v=>v.day===d.d&&v.waiter==='Selvi'&&v.seat<=20*60&&v.leave>20*60).length)); const est=avg(Q.filter(r=>Math.abs(r.load-l8)<0.6).map(r=>r.resp)); return tiles([[r1(l8),'Selvi\u2019s busy tables at 8 PM Saturday'],[r1(est)+' min','expected wait for help then']])+basis('Selvi\u2019s average 8 PM load on recent Saturdays, matched to past waits at the same load.'); },
     act:[['Send the request to the other waiter when the assigned one has 3 tables','Targets exactly the slow cases.'],['Add a third waiter on Saturday evenings','Lowers every waiter\u2019s load.']], more:[]},
    {t:'Can we predict which tables may need additional assistance?', cam:'tables',
     inv:{look:'Requests per visit at each table and who sat there.', sql:`SELECT ts.table_id, COUNT(sr.request_id) / COUNT(DISTINCT ts.session_id) AS per_visit\nFROM TABLE_SESSION ts LEFT JOIN SERVICE_REQUEST sr USING (session_id)\nGROUP BY ts.table_id;`, run:()=>bars([1,2,3,4,5].map(n=>['Table '+n,r1(avg(visitsByTable(n).map(v=>v.reqs.length)))]),{fmt:v=>v+' per visit'})},
     pat:()=>say_('The table itself barely matters. What predicts help is <b>who sits there</b>: elderly guests, first-time guests and families with children.')+bars([['Elderly',r1(avg(elderly.map(v=>v.reqs.length)))],['Families',r1(avg(S.filter(v=>v.kids).map(v=>v.reqs.length)))],['First visit',r1(avg(S.filter(v=>v.first).map(v=>v.reqs.length)))],['Regular adults',r1(avg(S.filter(v=>!v.first&&!v.elderly&&!v.kids).map(v=>v.reqs.length)))]],{fmt:v=>v+' per visit'}),
     pre:()=>tiles([['High','a booked family or elderly guest'],['Low','a regular couple']])+basis('requests per visit for each guest type. A reliable per-table forecast needs the guest type at booking time, which the app can ask for.'),
     act:[['Ask "any elderly guests or children?" when booking','Lets the waiter prepare before the guests arrive.'],['Seat families near the waiter station','Shorter walks for high-chair and water requests.']], more:[]},
    {t:'Are wheelchair-accessible tables available when needed?', cam:'table5',
     inv:{look:'Guests needing step-free access: only table 5 by the entrance fits a wheelchair.', sql:`SELECT ts.session_id, TIMESTAMPDIFF(MINUTE, ts.arrived_at, ts.seated_at) AS wait\nFROM TABLE_SESSION ts JOIN CUSTOMER c USING (customer_id)\nWHERE c.needs_wheelchair = 1;`, run:()=>{ const w=A.filter(v=>v.wheel); return tiles([[w.length,'wheelchair arrivals'],[w.filter(v=>v.walkedAway).length,'left without a table'],[r1(avg(w.filter(v=>v.seat!=null).map(v=>v.wait)))+' min','average wait when seated']]); }},
     pat:()=>{ const w=A.filter(v=>v.wheel); return say_(`Wheelchair guests are few, but <b>${pc(w.filter(v=>v.walkedAway||v.wait>5).length,w.length)}%</b> of them waited or left, because table 5 was taken. At 8 PM on Saturdays table 5 is busy <b>${pc(avg(D.filter(d=>d.dow===6).map(d=>S.some(v=>v.day===d.d&&v.table===5&&v.seat<=1200&&v.leave>1200)?1:0)),1)}%</b> of the time.`); },
     pre:()=>tiles([[pc(avg(D.filter(d=>d.dow===6).map(d=>S.some(v=>v.day===d.d&&v.table===5&&v.seat<=1200&&v.leave>1200)?1:0)),1)+'%','chance table 5 is taken at 8 PM next Saturday']])+basis('how often table 5 was occupied at 8 PM on past Saturdays.'),
     act:[['Make a second table step-free','Removes the single point of failure.'],['Hold table 5 for 15 minutes when a booking mentions a wheelchair','Requires asking about access needs at booking.']], more:[]},
    {t:'How can we make the restaurant comfortable for families with children?', cam:'tables',
     inv:{look:'Family visits, when they come and what they ask for.', sql:`SELECT DAYOFWEEK(seated_at), HOUR(seated_at), COUNT(*) FROM TABLE_SESSION ts\nJOIN CUSTOMER c USING (customer_id) WHERE c.has_children = 1 GROUP BY 1, 2;`, run:()=>{ const f=S.filter(v=>v.kids); return tiles([[f.length,'family visits'],[pc(f.filter(v=>v.reqs.some(r=>r.type==='High chair')).length,f.length)+'%','asked for a high chair'],[r1(avg(Q.filter(r=>r.type==='High chair').map(r=>r.resp)))+' min','wait for a high chair']])+cols(DOWS,[0,1,2,3,4,5,6].map(d=>perDow(f,d)),{fmt:v=>r1(v),valTop:true,hl:[0,6]}); }},
     pat:()=>{ const f=S.filter(v=>v.kids); return say_(`<b>${pc(f.filter(v=>v.wkend).length,f.length)}%</b> of family visits are at the weekend, and <b>${pc(f.filter(v=>v.reqs.some(r=>r.type==='High chair')).length,f.length)}%</b> of families ask for a high chair as soon as they sit down.`); },
     pre:()=>gap('We know when families come, but not what makes them comfortable or what children actually eat.',['What children order, or skip, from the menu','Whether the family used a kids\u2019 portion','A short rating question for parents: space, noise, speed']),
     act:[['Put high chairs next to tables before weekend lunch','No request needed, no wait.'],['Add a small kids\u2019 menu and track it','Starts collecting the missing data.']], more:[]},
  ]},
  {k:'booking', t:'Advance booking & waiting time', icon:'📅', d:'Bookings, no-shows, pre-orders and queues.', cam:'reception', qs:[
    {t:'Can customers explore the restaurant in 3D and select their preferred table before visiting?', cam:'overview',
     inv:{look:'Bookings by channel since the 3D booking app launched in week 5, and which tables people chose.', sql:`SELECT YEARWEEK(created_at), channel, COUNT(*) FROM RESERVATION GROUP BY 1, 2;\nSELECT preferred_table, COUNT(*) FROM RESERVATION WHERE channel = '3D_APP' GROUP BY 1;`,
       run:()=>cols(weekLabels,[...Array(8)].map((_,w)=>pc(booked.filter(v=>wk(v.day)===w&&v.app).length,booked.filter(v=>wk(v.day)===w).length)),{fmt:v=>v+'%',valTop:true,hl:[4,5,6,7]})+'<div class="small">Share of bookings made in the 3D app per week</div>'},
     pat:()=>{ const pr=grp(app.filter(v=>v.table),v=>v.table); return say_(`Since launch, <b>${pc(app.length,booked.filter(v=>v.day>=LAUNCH_DAY).length)}%</b> of bookings come through the 3D app, and guests mostly pick <b>table 3</b> and <b>table 5</b>.`)+bars([...pr].map(([k,a])=>['Table '+k,a.length]).sort((a,b)=>b[1]-a[1]),{fmt:v=>v+' bookings',hlTop:true}); },
     pre:()=>{ const s=[4,5,6,7].map(w=>pc(booked.filter(v=>wk(v.day)===w&&v.app).length,booked.filter(v=>wk(v.day)===w).length)); const slope=(s[3]-s[0])/3; const rising=slope>2; const est=rising?Math.min(90,r0(s[3]+slope*2)):r0(avg(s)); return tiles([[est+'%','app share expected in 2 weeks']])+basis(`the last 4 weeks: ${s.join('%, ')}%. ${rising?`It is still rising by about ${r0(slope)} points a week, so we extend the trend (capped at 90%). Growth will slow eventually; re-check weekly.`:'It has levelled off, so we use the average.'}`); },
     act:[['Show table photos and views in the app','Supports the choice people are already making.'],['Price window tables slightly higher at weekends','Test carefully; demand is concentrated on two tables.']], more:[]},
    {t:'How many customers book tables in advance?',
     inv:{look:'Booked and walk-in arrivals by day and service.', sql:`SELECT DAYOFWEEK(arrived_at), service, SUM(reservation_id IS NOT NULL) AS booked, COUNT(*)\nFROM TABLE_SESSION GROUP BY 1, 2;`, run:()=>bars2(DOWS.map((n,d)=>[n,pc(A.filter(v=>v.dow===d&&v.booked).length,A.filter(v=>v.dow===d).length),pc(A.filter(v=>v.dow===d&&!v.lunch&&v.booked).length,A.filter(v=>v.dow===d&&!v.lunch).length)]),['All arrivals','Dinner only'],{fmt:v=>v+'%'})},
     pat:()=>say_(`Overall <b>${pc(booked.length,A.length)}%</b> of arrivals were booked. At <b>weekend dinner</b> it is ${pc(A.filter(v=>v.wkend&&!v.lunch&&v.booked).length,A.filter(v=>v.wkend&&!v.lunch).length)}%; at weekday lunch almost nobody books.`),
     pre:()=>tiles([[r1(perDow(booked,6)),'bookings expected next Saturday']])+basis('average Saturday bookings in the last 8 weeks.'),
     act:[['Promote booking on Friday and Saturday','That is where tables run out.'],['Keep weekday lunch walk-in only','Booking adds no value there.']], more:[]},
    {t:'How many customers actually arrive after booking?',
     inv:{look:'What happened to every booking.', sql:`SELECT channel, status, COUNT(*) FROM RESERVATION GROUP BY 1, 2;`, run:()=>bars2([['On time',pc(app.filter(v=>!v.noShow&&!v.late).length,app.length),pc(phone.filter(v=>!v.noShow&&!v.late).length,phone.length)],['Late',pc(app.filter(v=>v.late).length,app.length),pc(phone.filter(v=>v.late).length,phone.length)],['No-show',pc(app.filter(v=>v.noShow).length,app.length),pc(phone.filter(v=>v.noShow).length,phone.length)]],['3D app bookings','Phone bookings'],{fmt:v=>v+'%'})},
     pat:()=>say_(`Phone bookings fail to turn up <b>${pc(phone.filter(v=>v.noShow).length,phone.length)}%</b> of the time; app bookings <b>${pc(app.filter(v=>v.noShow).length,app.length)}%</b>. <b>${pc(booked.filter(v=>v.late).length,booked.length)}%</b> of booked guests arrive late, on average by ${r0(avg(booked.filter(v=>v.late).map(v=>v.late)))} minutes.`),
     pre:()=>{ const nb=perDow(booked,6); const rate=booked.filter(v=>v.noShow).length/booked.length; return tiles([[r1(nb*rate),'no-shows expected next Saturday'],[r1(nb*booked.filter(v=>v.late).length/booked.length),'late arrivals expected']])+basis('Saturday booking volume times the recorded no-show and late rates.'); },
     act:[['Send a reminder 2 hours before','Common fix for no-shows.'],['Release a no-show table after 15 minutes','Gives it back to walk-ins.']], more:[]},
    {t:'Can customers order food before entering the restaurant?',
     inv:{look:'App bookings that included a pre-order.', sql:`SELECT COUNT(*) AS app_bookings, SUM(has_preorder) AS with_preorder FROM RESERVATION WHERE channel = '3D_APP';`, run:()=>tiles([[app.length,'app bookings'],[app.filter(v=>v.preorder).length,'with a pre-order'],[pc(app.filter(v=>v.preorder).length,app.length)+'%','pre-order rate']])},
     pat:()=>say_('Yes: about half of app bookings already pre-order. Phone bookings cannot pre-order at all, so the channel decides it.'),
     pre:()=>tiles([[r1(perDow(app.filter(v=>v.preorder),6)),'pre-orders expected next Saturday']])+basis('Saturday app bookings since launch times the pre-order rate.'),
     act:[['Offer pre-ordering on phone bookings too','The waiter types it in during the call.']], more:[]},
    {t:'How much waiting time can advance ordering save?', cam:'table',
     inv:{look:'Minutes from sitting down to the first dish arriving.', sql:`SELECT has_preorder, AVG(TIMESTAMPDIFF(MINUTE, seated_at, first_dish_served_at))\nFROM TABLE_SESSION GROUP BY has_preorder;`, run:()=>bars([['With pre-order',r1(firstDishWait(S.filter(v=>v.preorder&&!v.late)))],['Without',r1(firstDishWait(S.filter(v=>!v.preorder)))]],{fmt:v=>v+' min'})},
     pat:()=>{ const a=firstDishWait(S.filter(v=>v.preorder&&!v.late)), b=firstDishWait(S.filter(v=>!v.preorder)); return say_(`Guests who pre-order and arrive on time see their first dish <b>${r0(b-a)} minutes sooner</b>.`); },
     pre:()=>{ const a=firstDishWait(S.filter(v=>v.preorder&&!v.late)), b=firstDishWait(S.filter(v=>!v.preorder)); const n=perDow(booked,6); return tiles([[r0((b-a)*n*0.5),'table-minutes saved next Saturday if half of bookings pre-order']])+basis(`${r0(b-a)} min saved per table times ${r1(n*0.5)} pre-ordering tables.`); },
     act:[['Suggest pre-ordering in the booking confirmation','Cheap nudge, big saving at weekend dinner.']], more:[]},
    {t:'What happens when customers arrive late?', cam:'kitchen',
     inv:{look:'Pre-ordered food: how long it waited at the counter, on-time vs late guests.', sql:`SELECT r.late_minutes > 0 AS late, AVG(TIMESTAMPDIFF(MINUTE, dp.ready_at, dp.served_at))\nFROM RESERVATION r JOIN ORDERS o USING (session_id) JOIN DISH_PREPARATION dp ...\nWHERE r.has_preorder = 1 GROUP BY 1;`, run:()=>{ const pi=I.filter(i=>i.visit.preorder&&i.at<i.visit.seat); return bars([['On time',r1(avg(pi.filter(i=>!i.visit.late).map(i=>i.waitCounter)))],['Late',r1(avg(pi.filter(i=>i.visit.late).map(i=>i.waitCounter)))]],{fmt:v=>v+' min waiting'}); }},
     pat:()=>{ const pi=I.filter(i=>i.visit.preorder&&i.at<i.visit.seat); return say_(`When pre-order guests are late, their food sits on the counter much longer, and their dishes are rated <b>${r1(avg(pi.filter(i=>i.visit.late).map(i=>i.rating)))}</b> instead of <b>${r1(avg(pi.filter(i=>!i.visit.late).map(i=>i.rating)))}</b>.`); },
     pre:()=>tiles([[r1(perDow(booked.filter(v=>v.preorder&&v.late),6)),'late pre-order tables per Saturday']])+basis('recorded late rate for pre-order bookings.'),
     act:[['Start cooking when the guest shares "I\u2019m 10 min away"','Food is fresh even when they are late.'],['Hold dishes in a warmer','Treats the symptom, not the cause.']], more:[]},
    {t:'When should the kitchen start preparing pre-ordered food?', cam:'kitchen',

     pat:()=>say_('The kitchen starts from the <b>booked</b> time. That works when guests are punctual; for late guests it is too early.'),
     pre:()=>{ const m=MB.ptb; return tiles([['7:43 PM','start Paneer Tikka Biryani for an 8:00 PM arrival'],['3 min','plating buffer']])+basis(`start = arrival − ${m.prep} min cooking − 3 min plating. If the guest shares their location, use the updated arrival time instead.`); },
     act:[['Plan from the updated arrival time','Uses data the phone already has.']], more:[]},
    {t:'Which time slots have the highest demand?',
     inv:{look:'Arrivals per hour, weekdays and weekends.', sql:`SELECT HOUR(arrived_at), DAYOFWEEK(arrived_at) IN (1,7) AS weekend, COUNT(*)\nFROM TABLE_SESSION GROUP BY 1, 2;`, run:()=>bars2(hours.map(h=>[hl12(h),r1(A.filter(v=>!v.wkend&&Math.floor(v.arrive/60)===h).length/D.filter(d=>d.dow%6!==0).length),r1(A.filter(v=>v.wkend&&Math.floor(v.arrive/60)===h).length/D.filter(d=>d.dow%6===0).length)]),['Weekday','Weekend'],{fmt:v=>v})},

     act:[['Use 4–6 PM for a tea-time offer','Fills the quiet slot.']], more:[]},
    {t:'Can we predict table availability and customer waiting time?', cam:'overview',
     inv:{look:'Walk-ins on Saturdays: how long they waited and how many gave up.', sql:`SELECT HOUR(arrived_at), AVG(wait_minutes), SUM(left_without_seat)\nFROM ARRIVAL WHERE DAYOFWEEK(arrived_at) = 7 AND reservation_id IS NULL GROUP BY 1;`, run:()=>{ const w=A.filter(v=>v.dow===6&&!v.booked); return bars(hours.filter(h=>h>=12).map(h=>[hl12(h),r1(avg(w.filter(v=>Math.floor(v.arrive/60)===h).map(v=>v.wait))),w.filter(v=>Math.floor(v.arrive/60)===h&&v.walkedAway).length+' left']),{fmt:v=>v+' min'}); }},
     pat:()=>{ const w=A.filter(v=>v.dow===6&&!v.booked); const byh=hours.map(h=>avg(w.filter(v=>Math.floor(v.arrive/60)===h).map(v=>v.wait))); const pk=hours[byh.indexOf(Math.max(...byh))]; return say_(`Saturday walk-ins wait longest around <b>${hl12(pk)}</b>, when all 5 tables are full. Bookings also hold tables, so a walk-in can wait even when a table looks empty.`); },

     act:[['Show the expected wait at the door and in the app','Guests can choose to wait or book.']], more:[]},
  ]},

     pat:()=>{ const rr=I.filter(i=>i.returned); const m=rr.filter(i=>i.dish==='m65'); return say_(`Mushroom 65 is sent back most often. For Mushroom 65 the top reason is <b>${(topOf([...grp(m,i=>i.reason)].map(([k,a])=>[k,a.length]))||['none'])[0].toLowerCase()}</b>; across all dishes the reasons are:`)+bars([...grp(rr,i=>i.reason)].map(([k,a])=>[k,a.length]).sort((a,b)=>b[1]-a[1]),{fmt:v=>v+' returns'})+say_('"Not as expected" is vague: it tells us to ask a better question when a dish comes back.'); },

     act:[['Prep extra paneer and mushrooms on Friday night','The stock rule uses a 7-day average and misses weekends.']], more:[]},
    {t:'What happens when a popular dish becomes unavailable?', cam:'kitchen',

     pat:()=>{ const sub=sum(S,v=>v.subst||0), lost=S.filter(v=>v.lost).length; return say_(`When a dish ran out, <b>${pc(sub,sub+lost)}%</b> of those orders became a substitute; the rest were simply lost. Nobody suggested a substitute, so most guests just ordered less.`); },

    {t:'Can we recommend food based on previous orders and preferences?',

     pat:()=>{ const reg=H.customers.filter(c=>c.fav&&c.history.length>=3); const later=reg.flatMap(c=>c.history.slice(2)); const p=pc(later.filter(v=>v.items.some(i=>i.dish===H.customers[v.cust-1].fav)).length,later.length); return say_(`Regulars order their favourite again on <b>${p}%</b> of later visits. ${p>=50?'That makes "your usual?" a strong suggestion.':'Useful, but not strong enough to skip the menu.'}`); },

     act:[['Show "Your usual?" for returning guests (with consent)','Fast reorder for regulars.']], more:[]},
  ]},
  {k:'kitchen', t:'Kitchen efficiency & food preparation', icon:'🔥', d:'Stations, delays, chefs, stock and waste.', cam:'kitchen', qs:[
    {t:'Which kitchen station receives the most orders?', cam:'kitchen',
     inv:{look:'Dishes cooked at each station.', sql:`SELECT station, COUNT(*) FROM DISH_PREPARATION GROUP BY station;`, run:()=>bars([...grp(I,i=>i.station)].map(([k,a])=>[k,a.length]).sort((a,b)=>b[1]-a[1]),{fmt:v=>v+' dishes',hlTop:true})},
     pat:()=>say_('The stove cooks four of the eight dishes, including the three most ordered. It carries most of the kitchen.'),
     pre:()=>tiles([[r0(I.filter(i=>i.station==='Stove'&&i.visit.dow===6).length/sats),'stove dishes next Saturday']])+basis('Saturday average.'),

     inv:{look:'Recorded time from order to ready, against the recipe time.', sql:`SELECT mi.name, mi.prep_minutes, AVG(TIMESTAMPDIFF(MINUTE, o.ordered_at, dp.ready_at))\nFROM DISH_PREPARATION dp ... GROUP BY 1, 2;`, run:()=>bars2(MENU.map(m=>[m.name,m.prep,r1(avg(I.filter(i=>i.dish===m.id&&!i.visit.preorder).map(i=>i.ready-i.at)))]),['Recipe time','Actual time'],{fmt:v=>v+' min'})},

    {t:'Why do some orders get delayed?', cam:'kitchen',

     pat:()=>{ const q=I.filter(i=>!i.visit.preorder); return say_(`Delays are not random: they come from <b>queues</b>. When a dish waits for a free burner, it is ${r1(avg(q.filter(i=>i.queue>2).map(i=>i.delay)))} min late on average, against ${r1(avg(q.filter(i=>i.queue<=2).map(i=>i.delay)))} min otherwise.`); },

     pat:()=>say_('Delay grows with the queue. Arrivals are bunched: several tables order within the same 15 minutes at 8 PM.'),
     pre:()=>basis('staggering seating by 5 minutes would spread the same orders over a longer window.'),
     act:[['Stagger bookings: 7:45, 8:00, 8:15','Smooths the rush.'],['Add a fourth burner at dinner','More capacity.']], more:[]},
    {t:'Can we predict when each dish will be ready?', cam:'kitchen',
     inv:{look:'Test a simple rule on the last week: ready time = order time + recipe time + current queue.', sql:`SELECT dp.order_item_id, mi.prep_minutes, queue_minutes_at_order, TIMESTAMPDIFF(MINUTE, o.ordered_at, dp.ready_at)\nFROM DISH_PREPARATION dp ... WHERE o.ordered_at >= CURDATE() - INTERVAL 7 DAY;`, run:()=>{ const t=I.filter(i=>i.visit.day>=49&&!i.visit.preorder); const err1=avg(t.map(i=>Math.abs((i.ready-i.at)-MB[i.dish].prep))), err2=avg(t.map(i=>Math.abs((i.ready-i.at)-(MB[i.dish].prep+i.queue)))); return bars([['Recipe time only',r1(err1)],['Recipe + queue',r1(err2)]],{fmt:v=>'off by '+v+' min'}); }},
     pat:()=>say_('Adding the queue makes the estimate several times more accurate. The rest of the error is natural variation in cooking.'),
     pre:()=>tiles([['Order + 14 + queue','Paneer Tikka Biryani ready time'],['±2 min','typical error last week']])+basis('tested on 7 days of real orders not used to build the rule.'),
     act:[['Show this estimate on the guest\u2019s phone','Honest waiting times.']], more:[]},
    {t:'How many chefs are required during peak hours?', cam:'kitchen',
     inv:{look:'Dishes per hour on Saturdays, against what the current chefs can cook.', sql:`SELECT HOUR(o.ordered_at), COUNT(*) / COUNT(DISTINCT DATE(o.ordered_at)) FROM ORDER_ITEM ... WHERE DAYOFWEEK(...) = 7 GROUP BY 1;`, run:()=>cols(hours.map(hl12),hours.map(h=>r1(I.filter(i=>i.visit.dow===6&&Math.floor(i.at/60)===h).length/sats)),{valTop:true,hl:[8,9],fmt:v=>v})},
     pat:()=>{ const per=hours.map(h=>I.filter(i=>i.visit.dow===6&&Math.floor(i.at/60)===h).length/sats); const pk=Math.max(...per), ph=hours[per.indexOf(pk)]; const q=[]; for(const d of D.filter(x=>x.dow===6)) for(let t=19*60;t<22*60;t+=15) q.push(I.filter(i=>i.visit.day===d.d&&i.at>=t&&i.at<t+15).length); return say_(`The busiest hour is <b>${hl12(ph)}</b> with about <b>${r0(pk)}</b> dishes. But orders come in bursts: the busiest 15 minutes of a Saturday averages <b>${r0(avg(D.filter(x=>x.dow===6).map(d=>Math.max(...[...Array(12)].map((_,k)=>I.filter(i=>i.visit.day===d.d&&i.at>=19*60+k*15&&i.at<19*60+k*15+15).length)))))}</b> dishes, which is what causes delays.`); },
     pre:()=>{ const per=hours.map(h=>I.filter(i=>i.visit.dow===6&&Math.floor(i.at/60)===h).length/sats); const pk=Math.max(...per); const need=Math.max(1,Math.ceil(pk/9)); return tiles([[need,'chefs needed for the peak hour next Saturday'],['3','chefs scheduled at dinner now']])+basis(`${r0(pk)} dishes ÷ about 9 dishes per chef per hour. The 9 is an assumption: time a few chefs to measure it.`)+(need<3?say_('By hourly volume, 3 chefs is more than enough. The delays come from bursts, so staggering seating may help more than another chef.'):''); },
     act:[['Stagger seating at 8 PM','Spreads the burst without adding cost.'],['Measure real dishes per chef per hour','Replaces the assumption with data.']], more:[]},
    {t:'Which ingredients frequently run out?', cam:'kitchen',

function insCam(c){ for(const t of TABLES){ V.tableObjs[t.no].ring.visible=false; }
  if(c==='kitchen') cam('kitchen'); else if(c==='reception') V.goal={tx:7,tz:5,ty:0.8,r:12,th:0.75,ph:0.95}; else if(c==='everyone') ACT.view('everyone'); else if(c==='table') camTable(ST.table||3,9);
  else if(c==='table5'){ camTable(5,9); const o=V.tableObjs[5]; o.ring.visible=true; o.ring.material.opacity=.9; } else if(c==='tables'){ cam('overview'); TABLES.forEach(t=>{ const o=V.tableObjs[t.no]; o.ring.visible=true; o.ring.material.opacity=.6; }); } else cam('overview'); }
function insightsView(){
  if(!CATS){ CATS=buildCats(); }
  const H=HIST;
  if(!INS.cat){
    return `<h2>Insights & Predictions</h2><p class="lead">Think like the owner. Pick an area, choose a question, then investigate the data before you decide.</p>
    ${tiles([['8 weeks','of recorded history'],[H.visits.length.toLocaleString('en-IN'),'arrivals'],[H.items.length.toLocaleString('en-IN'),'dishes cooked'],[H.reqs.length,'help requests']])}
    <div class="ilegend2">${itag('rec')}${itag('pat')}${itag('pred')}${itag('gap')}</div>
    <div class="icards">${CATS.map(c=>`<button class="icard" data-a="insCat" data-x="${c.k}"><span class="ic">${c.icon}</span><b>${c.t}</b><small>${c.d}</small><em>${c.qs.length} questions</em></button>`).join('')}</div>`;
  }
  const C=CATS.find(c=>c.k===INS.cat);
  if(INS.q==null){
    return `<button class="iback" data-a="insBack" data-x="home">← All areas</button><h2>${C.icon} ${C.t}</h2><p>Which question would you investigate first?</p>
    <div class="iqlist">${C.qs.map((q,i)=>`<button data-a="insQ" data-x="${i}"><i>${i+1}</i><span>${q.t}</span></button>`).join('')}</div>`;
  }
  const q=C.qs[INS.q], st=INS.stage;
  let h=`<button class="iback" data-a="insBack" data-x="cat">← ${C.t}</button><div class="iwin"><div class="iq">${q.t}</div>
  <ol class="isteps">${STAGES.map((s,i)=>`<li class="${i<st+1?'done':''} ${i===st+1?'next':''}">${s}</li>`).join('')}</ol>`;
  if(st>=1) h+=`<div class="istage"><div class="ih"><b>1. Investigate the data</b>${itag('rec')}</div><p class="small">${q.inv.look}</p>${q.inv.run()}<details class="isql"><summary>See the SQL</summary><pre>${esc(q.inv.sql)}</pre></details></div>`;
  if(st>=2){ h+=`<div class="istage"><div class="ih"><b>2. Discover the pattern</b>${itag('pat')}</div>${q.pat()}`;
    if(q.more&&q.more.length) h+=`<div class="imore"><span class="small">Dig deeper:</span>${q.more.map((m,i)=>INS.more[i]?'':`<button data-a="insMore" data-x="${i}">${m[0]}</button>`).join('')}</div>${q.more.map((m,i)=>INS.more[i]?`<div class="isub"><b>${m[0]}</b>${itag('rec')}${m[2]()}<details class="isql"><summary>See the SQL</summary><pre>${esc(m[1])}</pre></details></div>`:'').join('')}`;
    h+='</div>'; }
  if(st>=3){ const p=q.pre(); h+=`<div class="istage"><div class="ih"><b>3. Predict</b>${itag(p.includes('igap')?'gap':'pred')}</div>${p}</div>`; }
  if(st>=4){ h+=`<div class="istage"><div class="ih"><b>4. Take action</b>${itag('act')}</div><p class="small">What would you do? Pick one to see the likely effect.</p><div class="iacts">${q.act.map((a,i)=>`<button class="${INS.pick===i?'on':''}" data-a="insAct" data-x="${i}">${a[0]}</button>`).join('')}</div>${INS.pick!=null?`<div class="ieff">${q.act[INS.pick][1]}</div>`:''}</div>`; }
  const next=['Investigate the data','Find the pattern','Make a prediction','Decide what to do'][st];
  const prompt=['What would you count or measure first?','Before you look: what do you expect to see?','Can the past tell us about next week?','What is worth changing?'][st];
  if(st<4) h+=`<div class="inext"><span>${prompt}</span><button class="btn cta" data-a="insNext">${next}</button></div>`;
  else h+=`<div class="inext"><span>Done with this question.</span>${INS.q<C.qs.length-1?`<button class="btn" data-a="insQ" data-x="${INS.q+1}">Next question →</button>`:`<button class="btn" data-a="insBack" data-x="home">Pick another area</button>`}</div>`;
  return h+'</div>';
}
ACT.insCat=x=>{ INS.cat=x; INS.q=null; ST._keepScroll=false; render(); $('panel').scrollTop=0; insCam(CATS.find(c=>c.k===x).cam); };
ACT.insQ=x=>{ INS.q=+x; INS.stage=0; INS.more={}; INS.pick=null; ST._keepScroll=false; render(); $('panel').scrollTop=0; const C=CATS.find(c=>c.k===INS.cat); insCam(C.qs[INS.q].cam||C.cam); };
ACT.insNext=()=>{ INS.stage=Math.min(4,INS.stage+1); render(); const s=document.querySelectorAll('.istage'); const last=s[s.length-1]; if(last) $('panel').scrollTo({top:last.offsetTop-70,behavior:'smooth'}); };
ACT.insMore=x=>{ INS.more[+x]=true; render(); };
ACT.insAct=x=>{ INS.pick=+x; render(); };
ACT.insBack=x=>{ if(x==='home'){ INS.cat=null; INS.q=null; } else INS.q=null; ST._keepScroll=false; render(); $('panel').scrollTop=0; insCam('overview'); };


</script>
</body>
</html>
