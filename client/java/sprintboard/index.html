<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SprintBoard — who is on what</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap');
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#05060F;--s1:#0A0C1C;--s2:#0F1330;--s3:#151A3E;
  --tx:#EAF0FF;--tx2:#8FA4CC;--tx3:#4A5B8A;
  --blue:#3B82F6;--purple:#8B5CF6;--cyan:#22D3EE;
  --amber:#F59E0B;--green:#10B981;--rose:#F43F5E;
  --glow-b:rgba(59,130,246,.45);--glow-p:rgba(139,92,246,.45);
  --glass:rgba(255,255,255,.045);--hair:rgba(255,255,255,.09);
  --r:12px;--r2:20px;
}
html,body{height:100%}
body{
  font-family:'Poppins',system-ui,sans-serif;
  background:var(--bg);color:var(--tx);overflow:hidden;
  -webkit-font-smoothing:antialiased;
}
body::before{
  content:'';position:fixed;inset:0;pointer-events:none;z-index:0;
  background:
    radial-gradient(60% 50% at 16% 6%,rgba(59,130,246,.15),transparent 70%),
    radial-gradient(55% 50% at 88% 94%,rgba(139,92,246,.15),transparent 70%);
}
.app{position:relative;z-index:1;height:100%;display:flex;flex-direction:column}

/* ─────────── header ─────────── */
.top{flex:none;display:flex;align-items:center;gap:14px;padding:12px clamp(12px,2.6vw,24px)}
.brand{display:flex;align-items:center;gap:9px;flex:1;min-width:0}
.brand .mark{
  width:27px;height:27px;border-radius:9px;flex:none;display:grid;place-items:center;
  background:linear-gradient(140deg,var(--blue),var(--purple));box-shadow:0 0 18px var(--glow-b);
}
.brand .mark svg{width:15px;height:15px;color:#fff}
.brand b{font-size:14.5px;font-weight:600;white-space:nowrap}
.brand .proj{
  font-size:11.5px;color:var(--tx3);padding:3px 9px;border-radius:999px;
  background:var(--glass);border:1px solid var(--hair);white-space:nowrap;
}

.toggle{
  flex:none;position:relative;display:flex;padding:5px;gap:4px;
  background:var(--glass);border:1px solid var(--hair);border-radius:999px;
  backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
}
.thumb{
  position:absolute;top:5px;left:5px;height:calc(100% - 10px);border-radius:999px;
  background:linear-gradient(120deg,var(--blue),var(--purple));
  box-shadow:0 0 22px var(--glow-p),0 2px 10px rgba(0,0,0,.4);
  transition:transform .42s cubic-bezier(.4,1.3,.4,1),width .42s cubic-bezier(.4,1.3,.4,1);
}
.seg{
  position:relative;z-index:1;display:flex;align-items:center;gap:7px;
  padding:8px 16px;border:0;background:none;cursor:pointer;
  font-family:inherit;font-size:13px;font-weight:500;color:var(--tx2);
  border-radius:999px;transition:color .3s;white-space:nowrap;
}
.seg svg{width:15px;height:15px}
.seg.is-on{color:#fff;font-weight:600}
.seg .pip{
  min-width:17px;height:17px;padding:0 4px;border-radius:999px;
  background:var(--amber);color:#1A1200;font-size:10.5px;font-weight:700;
  display:none;place-items:center;
}
.seg .pip.on{display:grid;animation:pip .6s ease}

.clockbox{flex:1;display:flex;justify-content:flex-end;align-items:center;gap:9px}
.clock{
  font-size:13.5px;font-weight:600;letter-spacing:1px;color:var(--tx);
  padding:6px 12px;border-radius:999px;background:var(--glass);border:1px solid var(--hair);
}
.adv{
  display:flex;align-items:center;gap:6px;padding:7px 13px;border:0;border-radius:999px;
  cursor:pointer;font-family:inherit;font-size:12.5px;font-weight:600;color:#fff;
  background:linear-gradient(120deg,var(--blue),var(--purple));
  box-shadow:0 6px 18px rgba(0,0,0,.4),0 0 20px var(--glow-b);
  transition:transform .24s cubic-bezier(.3,1.5,.5,1),box-shadow .24s;
}
.adv svg{width:14px;height:14px}
.adv:hover{transform:translateY(-2px);box-shadow:0 10px 24px rgba(0,0,0,.45),0 0 28px var(--glow-p)}
.adv:active{transform:translateY(0) scale(.97)}

/* ─────────── stage / views ─────────── */
.stage{flex:1;position:relative;min-height:0}
.view{
  position:absolute;inset:0;padding:0 clamp(12px,2.6vw,24px) clamp(12px,2vh,18px);
  display:none;flex-direction:column;gap:11px;
}
.view.is-on{display:flex;animation:viewIn .4s cubic-bezier(.3,1,.4,1)}

.panel{
  border-radius:var(--r2);border:1px solid var(--hair);background:var(--glass);
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  display:flex;flex-direction:column;min-height:0;
}
.p-head{flex:none;display:flex;align-items:center;gap:9px;padding:11px 15px 0}
.p-head .dot{width:6px;height:6px;border-radius:50%;background:var(--blue);box-shadow:0 0 10px var(--glow-b)}
.p-head .dot.p{background:var(--purple);box-shadow:0 0 10px var(--glow-p)}
.p-head .lbl{font-size:12.5px;font-weight:500;color:var(--tx2)}
.p-head .hint{margin-left:auto;font-size:11.5px;color:var(--tx3);transition:color .3s}
.p-head .hint.live{color:var(--cyan)}

/* ─────────── the sprint band ─────────── */
.band-panel{flex:none}
.band{
  flex:1;min-height:0;display:flex;align-items:center;gap:16px;
  overflow-x:auto;overflow-y:hidden;padding:10px 15px 13px;scrollbar-width:none;
}
.band::-webkit-scrollbar{display:none}
.band.can-drop{background:rgba(59,130,246,.06)}
.sprint{flex:none;display:flex;align-items:center;gap:9px}
.sprint-tag{
  flex:none;display:flex;flex-direction:column;gap:2px;padding-right:4px;
  border-right:1px solid var(--hair);margin-right:3px;
}
.sprint-tag b{font-size:11px;font-weight:700;letter-spacing:.8px;color:var(--tx2)}
.sprint-tag small{font-size:10.5px;color:var(--tx3);white-space:nowrap}
.band-empty{margin:auto;color:var(--tx3);font-size:12.5px}

/* a stage chip */
.chip{
  flex:none;display:flex;align-items:center;gap:8px;padding:8px 11px;cursor:pointer;
  border-radius:var(--r);border:1px solid var(--hair);
  background:linear-gradient(170deg,rgba(255,255,255,.06),rgba(255,255,255,.02));
  transition:transform .26s cubic-bezier(.3,1.4,.5,1),box-shadow .26s,border-color .26s,opacity .26s;
}
.chip svg{width:16px;height:16px;flex:none}
/* both must refuse to shrink: nowrap text in a shrunk box would slide
   straight under the duration pill */
.chip .nm{flex:none;font-size:12px;font-weight:500;white-space:nowrap}
.chip .du{
  flex:none;font-size:10.5px;font-weight:600;color:var(--tx3);padding:2px 6px;
  border-radius:999px;background:rgba(255,255,255,.06);white-space:nowrap;
}
.chip[data-sp="0"] svg{color:var(--blue)}
.chip[data-sp="1"] svg{color:var(--purple)}
.chip:hover{transform:translateY(-3px);box-shadow:0 10px 24px rgba(0,0,0,.45)}
.chip.is-sel{
  border-color:var(--cyan);
  box-shadow:0 0 0 1px rgba(34,211,238,.45),0 0 26px rgba(34,211,238,.45);
  transform:translateY(-3px);
}
.chip.just{animation:pop .5s cubic-bezier(.2,1.5,.4,1)}

/* ─────────── the five lanes ─────────── */
.lanes-panel{flex:1;min-height:0}
.lanes{flex:1;min-height:0;overflow-y:auto;padding:8px 15px 12px;display:flex;flex-direction:column;gap:7px}
.lane{
  flex:none;display:flex;align-items:center;gap:10px;padding:7px 10px;cursor:pointer;
  border-radius:var(--r);border:1px solid transparent;background:rgba(255,255,255,.028);
  transition:border-color .26s,background .26s,box-shadow .26s;
}
.lane:hover{background:rgba(255,255,255,.05)}
.lanes.can-drop .lane{border-color:rgba(34,211,238,.28)}
.lanes.can-drop .lane:hover{border-color:var(--cyan);box-shadow:0 0 22px rgba(34,211,238,.3)}
.lane .av{
  width:28px;height:28px;border-radius:50%;flex:none;display:grid;place-items:center;
  font-size:11.5px;font-weight:600;color:#fff;
}
.lane > .nm{flex:none;width:52px;font-size:12px;font-weight:500;color:var(--tx2)}
.lane-work{
  flex:1;min-width:0;display:flex;align-items:center;gap:6px;
  overflow-x:auto;scrollbar-width:none;
}
.lane-work::-webkit-scrollbar{display:none}
.lane-work .chip{padding:5px 8px}
.lane-work .chip svg{width:14px;height:14px}
.lane-work .chip .nm{font-size:11px}
.lane-empty{font-size:11.5px;color:var(--tx3);font-style:italic}
.load{flex:none;width:58px;display:flex;flex-direction:column;gap:3px;align-items:flex-end}
.load small{font-size:10px;font-weight:600;color:var(--tx3)}
.load .bar{width:100%;height:3px;border-radius:2px;background:rgba(255,255,255,.08);overflow:hidden}
.load .bar i{display:block;height:100%;background:var(--blue);transition:width .4s ease,background .3s}
.load.over small{color:var(--amber)}
.load.over .bar i{background:var(--amber)}
.light{
  flex:none;width:22px;height:22px;border-radius:50%;display:grid;place-items:center;
  background:rgba(255,255,255,.05);color:var(--tx3);
}
.light svg{width:12px;height:12px}
.light[data-st="working"]{background:rgba(34,211,238,.16);color:var(--cyan)}
.light[data-st="decide"]{background:rgba(245,158,11,.2);color:var(--amber);animation:beat 1.5s ease-in-out infinite}
.light[data-st="done"]{background:rgba(16,185,129,.18);color:var(--green)}

/* ─────────── my work ─────────── */
.who-row{
  flex:none;display:flex;gap:8px;overflow-x:auto;padding:2px 2px 0;scrollbar-width:none;
}
.who-row::-webkit-scrollbar{display:none}
.who{
  flex:none;display:flex;align-items:center;gap:8px;padding:6px 13px 6px 6px;cursor:pointer;
  border-radius:999px;border:1px solid var(--hair);background:var(--glass);
  transition:border-color .26s,box-shadow .26s,transform .26s;position:relative;
}
.who .av{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-size:11px;font-weight:600;color:#fff}
.who .nm{font-size:12.5px;font-weight:500;color:var(--tx2)}
.who:hover{transform:translateY(-2px)}
.who.is-on{border-color:var(--purple);box-shadow:0 0 22px var(--glow-p)}
.who.is-on .nm{color:#fff;font-weight:600}
.who .flagdot{
  position:absolute;top:3px;right:3px;width:8px;height:8px;border-radius:50%;
  background:var(--amber);box-shadow:0 0 8px var(--amber);display:none;
}
.who.needs .flagdot{display:block}

.cards-panel{flex:1;min-height:0}
.cards{
  flex:1;min-height:0;overflow-y:auto;padding:13px 15px;
  display:flex;flex-wrap:wrap;gap:10px;align-content:flex-start;
}
.card{
  flex:none;width:clamp(150px,19vw,190px);padding:12px;border-radius:var(--r);
  border:1px solid var(--hair);
  background:linear-gradient(170deg,rgba(255,255,255,.06),rgba(255,255,255,.02));
  transition:border-color .3s,box-shadow .3s,transform .3s;
}
.card:hover{transform:translateY(-3px);box-shadow:0 12px 28px rgba(0,0,0,.45)}
.card-top{display:flex;align-items:center;gap:8px;margin-bottom:9px}
.card-top svg{width:18px;height:18px;flex:none}
.card[data-sp="0"] .card-top svg{color:var(--blue)}
.card[data-sp="1"] .card-top svg{color:var(--purple)}
.card-top .nm{font-size:12.5px;font-weight:600;line-height:1.25}
.meter{height:4px;border-radius:2px;background:rgba(255,255,255,.08);overflow:hidden;margin-bottom:9px}
.meter i{display:block;height:100%;width:0;background:var(--cyan);transition:width .45s ease,background .3s}
.card-bot{display:flex;align-items:center;gap:7px}
.card-bot .du{font-size:10.5px;font-weight:600;color:var(--tx3);flex:1}
.act{
  display:flex;align-items:center;gap:5px;padding:6px 11px;border:0;border-radius:999px;
  cursor:pointer;font-family:inherit;font-size:11.5px;font-weight:600;color:#fff;
  background:rgba(255,255,255,.1);transition:transform .22s,background .22s,box-shadow .22s;
}
.act svg{width:12px;height:12px}
.act:hover{transform:translateY(-2px)}
.act.go{background:linear-gradient(120deg,var(--blue),var(--purple));box-shadow:0 0 18px var(--glow-b)}
.act.ok{background:linear-gradient(120deg,var(--green),var(--cyan));box-shadow:0 0 18px rgba(16,185,129,.45)}
.act.more{background:rgba(245,158,11,.22);color:var(--amber)}
.state{
  display:flex;align-items:center;gap:5px;font-size:11px;font-weight:600;color:var(--tx3);
}
.state svg{width:13px;height:13px}
.card[data-st="working"]{border-color:rgba(34,211,238,.35)}
.card[data-st="working"] .state{color:var(--cyan)}
.card[data-st="decide"]{
  border-color:rgba(245,158,11,.6);box-shadow:0 0 0 1px rgba(245,158,11,.25),0 0 28px rgba(245,158,11,.3);
}
.card[data-st="decide"] .meter i{background:var(--amber)}
.card[data-st="done"]{opacity:.62;border-color:rgba(16,185,129,.35)}
.card[data-st="done"] .meter i{background:var(--green)}
.card[data-st="done"] .state{color:var(--green)}
.card.buzz{animation:buzz .5s cubic-bezier(.3,.9,.4,1)}
.cards-empty{margin:auto;text-align:center;color:var(--tx3);font-size:12.5px}
.cards-empty svg{width:38px;height:38px;opacity:.35;margin-bottom:9px}

@keyframes viewIn{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@keyframes pop{0%{transform:scale(.7);opacity:0}60%{transform:scale(1.1);opacity:1}100%{transform:scale(1)}}
@keyframes beat{0%,100%{opacity:1}50%{opacity:.45}}
@keyframes pip{0%{transform:scale(0)}60%{transform:scale(1.25)}100%{transform:scale(1)}}
@keyframes buzz{0%,100%{transform:translateX(0)}25%{transform:translateX(-5px)}60%{transform:translateX(4px)}}

/* short viewports — the embedded frame is about 1140x480 */
@media (max-height:620px){
  .top{padding:8px clamp(10px,2.4vw,18px);gap:10px}
  .brand .proj{display:none}
  .seg{padding:7px 13px;font-size:12.5px}
  .view{gap:8px;padding:0 clamp(10px,2.4vw,18px) 10px}
  .p-head{padding:8px 12px 0}
  .band{padding:7px 12px 10px;gap:13px}
  .chip{padding:6px 9px}
  .lanes{padding:6px 12px 9px;gap:5px}
  .lane{padding:5px 8px;gap:8px}
  .lane .av{width:25px;height:25px;font-size:11px}
  .lane > .nm{width:46px;font-size:11.5px}
  .cards{padding:10px 12px;gap:8px}
  .card{width:150px;padding:10px}
}
@media (max-width:700px){
  .brand b,.brand .proj{display:none}
  .clock{padding:5px 9px;font-size:12.5px}
  .adv span{display:none}
  .adv{padding:8px 11px}
  .lane > .nm{display:none}
  .load{width:44px}
}
/* a phone cannot fit the mark, both labels and the clock on one row,
   and the page does not scroll sideways — so the mark goes */
@media (max-width:470px){
  .top{gap:8px;padding:8px 10px}
  .brand{display:none}
  .seg{padding:7px 11px;font-size:12px;gap:5px}
  .clockbox{gap:6px}
  .clock{padding:5px 8px;font-size:12px;letter-spacing:.4px}
}
</style>
</head>
<body>

<div class="app" id="app">

  <header class="top">
    <div class="brand">
      <span class="mark" id="mark"></span>
      <b>SprintBoard</b>
      <span class="proj">AI Study Buddy</span>
    </div>
    <div class="toggle" id="toggle">
      <span class="thumb" id="thumb"></span>
      <button class="seg is-on" data-view="lead" id="segLead" aria-label="The lead's board"></button>
      <button class="seg" data-view="me" id="segMe" aria-label="One person's work"></button>
    </div>
    <div class="clockbox">
      <span class="clock" id="clock">09:00</span>
      <button class="adv" id="adv" aria-label="Move the day forward by thirty minutes"></button>
    </div>
  </header>

  <main class="stage">

    <!-- ══════ lead ══════ -->
    <section class="view is-on" id="viewLead">
      <div class="panel band-panel">
        <div class="p-head">
          <span class="dot"></span><span class="lbl">Not handed out yet</span>
          <span class="hint" id="bandHint"></span>
        </div>
        <div class="band" id="band"></div>
      </div>
      <div class="panel lanes-panel">
        <div class="p-head"><span class="dot p"></span><span class="lbl">The team</span></div>
        <div class="lanes" id="lanes"></div>
      </div>
    </section>

    <!-- ══════ my work ══════ -->
    <section class="view" id="viewMe">
      <div class="who-row" id="whoRow"></div>
      <div class="panel cards-panel">
        <div class="cards" id="cards"></div>
      </div>
    </section>

  </main>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/animejs/3.2.2/anime.min.js"></script>
<script>
/* ════════════════════════════════════════
   ICONS — all stroke, all currentColor, so no
   gradient ever has to be looked up by id
════════════════════════════════════════ */
var I = {
  board:'<svg viewBox="0 0 24 24" fill="none"><rect x="3.5" y="4.5" width="17" height="15" rx="2.5" stroke="currentColor" stroke-width="1.9"/><path d="M8.5 9h7M8.5 13h4" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"/></svg>',
  user:'<svg viewBox="0 0 24 24" fill="none"><circle cx="12" cy="8" r="3.4" stroke="currentColor" stroke-width="1.9"/><path d="M5 20c0-3.6 3.1-6 7-6s7 2.4 7 6" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"/></svg>',
  fwd:'<svg viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="8.4" stroke="currentColor" stroke-width="1.9"/><path d="M12 7.6V12l3 2" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/></svg>',
  play:'<svg viewBox="0 0 24 24" fill="none"><path d="M8 5.5l10 6.5-10 6.5z" fill="currentColor"/></svg>',
  check:'<svg viewBox="0 0 24 24" fill="none"><path d="M5 12.5l4.5 4.5L19 7.5" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg>',
  again:'<svg viewBox="0 0 24 24" fill="none"><path d="M20 12a8 8 0 11-2.6-5.9" stroke="currentColor" stroke-width="2.1" stroke-linecap="round"/><path d="M20 4v4.5h-4.5" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"/></svg>',
  wait:'<svg viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="8.4" stroke="currentColor" stroke-width="1.9"/><path d="M12 7.6V12l3 2" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/></svg>',
  spin:'<svg viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="8.4" stroke="currentColor" stroke-width="1.9" stroke-dasharray="10 6"/></svg>',
  bang:'<svg viewBox="0 0 24 24" fill="none"><path d="M12 4.5l8.3 14.4H3.7z" stroke="currentColor" stroke-width="1.9" stroke-linejoin="round"/><path d="M12 10v3.6" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><circle cx="12" cy="16.4" r="1.05" fill="currentColor"/></svg>',
  empty:'<svg viewBox="0 0 24 24" fill="none"><path d="M3 7.5L12 3l9 4.5v9L12 21l-9-4.5z" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/><path d="M3 7.5l9 4.5 9-4.5M12 12v9" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/></svg>',

  /* the ten stages */
  design:'<svg viewBox="0 0 24 24" fill="none"><rect x="3.5" y="4" width="17" height="16" rx="2.5" stroke="currentColor" stroke-width="1.8"/><path d="M3.5 9h17M8 9v11" stroke="currentColor" stroke-width="1.8"/></svg>',
  list:'<svg viewBox="0 0 24 24" fill="none"><path d="M4 7h10M4 12h16M4 17h8" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>',
  plug:'<svg viewBox="0 0 24 24" fill="none"><path d="M9 3v5M15 3v5" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"/><path d="M6 8h12v3a6 6 0 01-12 0z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><path d="M12 17v4" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"/></svg>',
  dots:'<svg viewBox="0 0 24 24" fill="none"><circle cx="6.5" cy="12" r="1.7" fill="currentColor"/><circle cx="12" cy="12" r="1.7" fill="currentColor"/><circle cx="17.5" cy="12" r="1.7" fill="currentColor"/></svg>',
  alert:'<svg viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="8.4" stroke="currentColor" stroke-width="1.8"/><path d="M12 7.8v4.4" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><circle cx="12" cy="15.9" r="1.05" fill="currentColor"/></svg>',
  save:'<svg viewBox="0 0 24 24" fill="none"><path d="M5 4.5h11L19.5 8v11.5h-15z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><path d="M8.5 4.5v5h7" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg>',
  upload:'<svg viewBox="0 0 24 24" fill="none"><path d="M12 16V4.5" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"/><path d="M7.5 9L12 4.5 16.5 9" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/><path d="M4.5 16v3.5h15V16" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"/></svg>',
  quiz:'<svg viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="8.4" stroke="currentColor" stroke-width="1.8"/><path d="M9.6 9.6a2.5 2.5 0 114 2.1c-.9.6-1.6 1-1.6 2" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/><circle cx="12" cy="16.4" r="1.05" fill="currentColor"/></svg>',
  phone:'<svg viewBox="0 0 24 24" fill="none"><rect x="7" y="3" width="10" height="18" rx="2.4" stroke="currentColor" stroke-width="1.8"/><path d="M10.8 6.4h2.4" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg>',
  rocket:'<svg viewBox="0 0 24 24" fill="none"><path d="M12 3c3.4 2.4 5 5.6 5 9l-2.4 3.4H9.4L7 12c0-3.4 1.6-6.6 5-9z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><circle cx="12" cy="10" r="1.6" stroke="currentColor" stroke-width="1.6"/><path d="M9.4 15.4L8 20l3-1.6 3 1.6-1.4-4.6" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/></svg>'
};

/* ════════════════════════════════════════
   THE PROJECT
════════════════════════════════════════ */
var PEOPLE = [
  {id:'meera', name:'Meera', i:'M', c:'linear-gradient(140deg,#F472B6,#8B5CF6)'},
  {id:'arjun', name:'Arjun', i:'A', c:'linear-gradient(140deg,#22D3EE,#3B82F6)'},
  {id:'nila',  name:'Nila',  i:'N', c:'linear-gradient(140deg,#34D399,#22D3EE)'},
  {id:'ravi',  name:'Ravi',  i:'R', c:'linear-gradient(140deg,#FBBF24,#F472B6)'},
  {id:'dev',   name:'Dev',   i:'D', c:'linear-gradient(140deg,#818CF8,#38BDF8)'}
];

var SPRINTS = ['Get it talking','Make it useful'];

var STAGES = [
  {id:'a1', sp:0, name:'Chat screen',    icon:'design', mins:120},
  {id:'a2', sp:0, name:'Message list',   icon:'list',   mins:60},
  {id:'a3', sp:0, name:'Connect the AI', icon:'plug',   mins:120},
  {id:'a4', sp:0, name:'Typing dots',    icon:'dots',   mins:30},
  {id:'a5', sp:0, name:'Error states',   icon:'alert',  mins:60},
  {id:'b1', sp:1, name:'Save history',   icon:'save',   mins:90},
  {id:'b2', sp:1, name:'Upload notes',   icon:'upload', mins:120},
  {id:'b3', sp:1, name:'Quiz maker',     icon:'quiz',   mins:120},
  {id:'b4', sp:1, name:'Test on phones', icon:'phone',  mins:60},
  {id:'b5', sp:1, name:'Polish & ship',  icon:'rocket', mins:30}
];
STAGES.forEach(function(s){ s.owner = null; s.state = 'waiting'; s.spent = 0; });

var DAY   = 480;   /* a full working day, in minutes */
var STEP  = 30;    /* how far one tap of the clock moves */
var clock = 540;   /* 09:00 */
var view  = 'lead';
var me    = PEOPLE[0].id;
var sel   = null;  /* the stage currently picked up */
var justPlaced = null;

var A = (typeof anime === 'function') ? anime : null;
if (A) A.suspendWhenDocumentHidden = false;

/* ════════════════════════════════════════
   SHORTHANDS
════════════════════════════════════════ */
function $(id){ return document.getElementById(id); }
function stage(id){ for (var i=0;i<STAGES.length;i++) if (STAGES[i].id===id) return STAGES[i]; return null; }
function person(id){ for (var i=0;i<PEOPLE.length;i++) if (PEOPLE[i].id===id) return PEOPLE[i]; return PEOPLE[0]; }
function held(pid){ return STAGES.filter(function(s){ return s.owner === pid; }); }
function loose(){ return STAGES.filter(function(s){ return s.owner === null; }); }

function dur(m){
  var h = Math.floor(m/60), r = m%60;
  if (!h) return r + 'm';
  return r ? h + 'h' + r : h + 'h';
}
function hhmm(t){
  var h = Math.floor(t/60) % 24, m = t % 60;
  return (h<10?'0':'') + h + ':' + (m<10?'0':'') + m;
}
function avatar(p, cls){
  return '<span class="av '+(cls||'')+'" style="background:'+p.c+'">'+p.i+'</span>';
}

/* where a person stands, read off the work filed under them */
function standing(pid){
  var mine = held(pid);
  if (!mine.length) return 'empty';
  if (mine.some(function(s){ return s.state === 'decide'; }))  return 'decide';
  if (mine.some(function(s){ return s.state === 'working'; })) return 'working';
  if (mine.every(function(s){ return s.state === 'done'; }))   return 'done';
  return 'waiting';
}
var LIGHT = {empty:'empty', waiting:'wait', working:'spin', decide:'bang', done:'check'};
function waitingOnUser(){ return STAGES.filter(function(s){ return s.state === 'decide'; }).length; }

/* ════════════════════════════════════════
   RENDER
════════════════════════════════════════ */
function chipHTML(s, extra){
  return '<div class="chip'+(sel===s.id?' is-sel':'')+(justPlaced===s.id?' just':'')+'"'+
           ' data-stage="'+s.id+'" data-sp="'+s.sp+'" draggable="true"'+
           ' role="button" tabindex="0" aria-label="'+s.name+', '+dur(s.mins)+'">'+
           I[s.icon]+
           '<span class="nm">'+s.name+'</span>'+
           (extra === false ? '' : '<span class="du">'+dur(s.mins)+'</span>')+
         '</div>';
}

function renderBand(){
  var el = $('band'), free = loose();
  if (!free.length){
    el.innerHTML = '<div class="band-empty">Everything is with someone</div>';
  } else {
    el.innerHTML = SPRINTS.map(function(nm, i){
      var mine = free.filter(function(s){ return s.sp === i; });
      if (!mine.length) return '';
      return '<div class="sprint">'+
               '<span class="sprint-tag"><b>SPRINT '+(i+1)+'</b><small>'+nm+'</small></span>'+
               mine.map(function(s){ return chipHTML(s); }).join('')+
             '</div>';
    }).join('');
  }
  var picked = sel ? stage(sel) : null;
  var hint = $('bandHint');
  if (picked && picked.owner){ hint.textContent = 'tap here to take it back'; hint.classList.add('live'); }
  else if (picked){ hint.textContent = 'now tap a teammate'; hint.classList.add('live'); }
  else { hint.textContent = 'tap a piece of work'; hint.classList.remove('live'); }
  el.classList.toggle('can-drop', !!(picked && picked.owner));
}

function renderLanes(){
  $('lanes').innerHTML = PEOPLE.map(function(p){
    var mine = held(p.id);
    var total = mine.reduce(function(n,s){ return n + s.mins; }, 0);
    var st = standing(p.id);
    var pct = Math.min(100, Math.round(total / DAY * 100));
    return '<div class="lane" data-person="'+p.id+'">'+
             avatar(p)+
             '<span class="nm">'+p.name+'</span>'+
             '<div class="lane-work">'+
               (mine.length ? mine.map(function(s){ return chipHTML(s); }).join('')
                            : '<span class="lane-empty">nothing yet</span>')+
             '</div>'+
             '<span class="load'+(total > DAY ? ' over' : '')+'">'+
               '<small>'+(total ? dur(total) : '—')+'</small>'+
               '<span class="bar"><i style="width:'+pct+'%"></i></span>'+
             '</span>'+
             '<span class="light" data-st="'+st+'" aria-label="'+p.name+' — '+st+'">'+I[LIGHT[st]]+'</span>'+
           '</div>';
  }).join('');
  $('lanes').classList.toggle('can-drop', !!(sel && !stage(sel).owner));
}

function renderWho(){
  $('whoRow').innerHTML = PEOPLE.map(function(p){
    var needs = held(p.id).some(function(s){ return s.state === 'decide'; });
    return '<div class="who'+(me===p.id?' is-on':'')+(needs?' needs':'')+'" data-person="'+p.id+'"'+
             ' role="button" tabindex="0" aria-label="Show '+p.name+'’s work">'+
             avatar(p)+'<span class="nm">'+p.name+'</span><span class="flagdot"></span>'+
           '</div>';
  }).join('');
}

var STATE_WORD = {waiting:'not started', working:'under way', decide:'time is up', done:'done'};
function renderCards(){
  var mine = held(me), el = $('cards');
  if (!mine.length){
    el.innerHTML = '<div class="cards-empty">'+I.empty+'<div>Nothing handed to '+person(me).name+' yet</div></div>';
    return;
  }
  el.innerHTML = mine.map(function(s){
    var pct = Math.min(100, Math.round(s.spent / s.mins * 100));
    var act = '';
    if (s.state === 'waiting')      act = '<button class="act go" data-act="start" data-stage="'+s.id+'">'+I.play+'Start</button>';
    else if (s.state === 'decide')  act = '<button class="act ok" data-act="done" data-stage="'+s.id+'" aria-label="Mark done">'+I.check+'</button>'+
                                          '<button class="act more" data-act="more" data-stage="'+s.id+'" aria-label="Give it another 30 minutes">'+I.again+'</button>';
    else                            act = '<span class="state">'+I[LIGHT[s.state]]+STATE_WORD[s.state]+'</span>';
    return '<div class="card" data-sp="'+s.sp+'" data-st="'+s.state+'" data-stage="'+s.id+'">'+
             '<div class="card-top">'+I[s.icon]+'<span class="nm">'+s.name+'</span></div>'+
             '<div class="meter"><i style="width:'+pct+'%"></i></div>'+
             '<div class="card-bot"><span class="du">'+dur(s.spent)+' / '+dur(s.mins)+'</span>'+act+'</div>'+
           '</div>';
  }).join('');
}

function renderTop(){
  $('clock').textContent = hhmm(clock);
  var n = waitingOnUser(), pip = $('segMe').querySelector('.pip');
  if (pip){ pip.textContent = n; pip.classList.toggle('on', n > 0); }
}

function renderAll(){ renderBand(); renderLanes(); renderWho(); renderCards(); renderTop(); }

/* ════════════════════════════════════════
   VIEW SWAP — display is the authority, the
   animation is only a flourish
════════════════════════════════════════ */
function moveThumb(){
  var on = $(view === 'lead' ? 'segLead' : 'segMe');
  $('thumb').style.width = on.offsetWidth + 'px';
  $('thumb').style.transform = 'translateX(' + (on.offsetLeft - 5) + 'px)';
}
function setView(next){
  if (next === view) return;
  view = next;
  $('segLead').classList.toggle('is-on', view === 'lead');
  $('segMe').classList.toggle('is-on', view === 'me');
  $('viewLead').classList.toggle('is-on', view === 'lead');
  $('viewMe').classList.toggle('is-on', view === 'me');
  moveThumb();
}

/* ════════════════════════════════════════
   HANDING WORK OUT
════════════════════════════════════════ */
function pick(id){ sel = (sel === id) ? null : id; renderBand(); renderLanes(); }

function giveTo(pid){
  if (!sel) return;
  var s = stage(sel);
  if (!s || s.owner === pid) { sel = null; renderAll(); return; }
  s.owner = pid;
  justPlaced = s.id;
  sel = null;
  renderAll();
  setTimeout(function(){ justPlaced = null; }, 600);
}

function takeBack(){
  if (!sel) return;
  var s = stage(sel);
  if (!s || !s.owner) return;
  s.owner = null; s.state = 'waiting'; s.spent = 0;
  justPlaced = s.id;
  sel = null;
  renderAll();
  setTimeout(function(){ justPlaced = null; }, 600);
}

/* ════════════════════════════════════════
   RUNNING THE DAY
════════════════════════════════════════ */
function advance(){
  clock += STEP;
  var flipped = [];
  STAGES.forEach(function(s){
    if (s.state !== 'working') return;
    s.spent += STEP;
    if (s.spent >= s.mins){ s.spent = s.mins; s.state = 'decide'; flipped.push(s.id); }
  });
  renderAll();
  flipped.forEach(function(id){
    var c = $('cards').querySelector('.card[data-stage="'+id+'"]');
    if (c){ c.classList.add('buzz'); setTimeout(function(){ c.classList.remove('buzz'); }, 520); }
  });
  if (A) A({targets:'#clock', scale:[1,1.09,1], duration:380, easing:'easeOutQuad'});
}

function act(kind, id){
  var s = stage(id);
  if (!s) return;
  if (kind === 'start' && s.state === 'waiting') s.state = 'working';
  else if (kind === 'done' && s.state === 'decide') s.state = 'done';
  else if (kind === 'more' && s.state === 'decide'){ s.mins += STEP; s.state = 'working'; }
  renderAll();
}

/* ════════════════════════════════════════
   WIRE UP
════════════════════════════════════════ */
$('mark').innerHTML = I.board;
$('segLead').innerHTML = I.board + '<span>The board</span>';
$('segMe').innerHTML   = I.user  + '<span>My work</span><span class="pip">0</span>';
$('adv').innerHTML     = I.fwd   + '<span>+30m</span>';

$('toggle').addEventListener('click', function(e){
  var seg = e.target.closest('.seg');
  if (seg) setView(seg.getAttribute('data-view'));
});
$('adv').addEventListener('click', advance);

$('band').addEventListener('click', function(e){
  var chip = e.target.closest('.chip');
  if (chip) return pick(chip.getAttribute('data-stage'));
  if (sel && stage(sel).owner) takeBack();
});

$('lanes').addEventListener('click', function(e){
  var lane = e.target.closest('.lane');
  if (!lane) return;
  if (sel) return giveTo(lane.getAttribute('data-person'));
  var chip = e.target.closest('.chip');
  if (chip) pick(chip.getAttribute('data-stage'));
});

$('whoRow').addEventListener('click', function(e){
  var w = e.target.closest('.who');
  if (w){ me = w.getAttribute('data-person'); renderWho(); renderCards(); }
});

$('cards').addEventListener('click', function(e){
  var b = e.target.closest('.act');
  if (b) act(b.getAttribute('data-act'), b.getAttribute('data-stage'));
});

/* keyboard: the chips and avatars are real controls */
document.addEventListener('keydown', function(e){
  if (e.key === 'Escape' && sel){ sel = null; renderBand(); renderLanes(); return; }
  if (e.key !== 'Enter' && e.key !== ' ') return;
  var t = document.activeElement;
  if (!t) return;
  if (t.classList.contains('chip')){ e.preventDefault(); pick(t.getAttribute('data-stage')); }
  else if (t.classList.contains('who')){ e.preventDefault(); me = t.getAttribute('data-person'); renderWho(); renderCards(); }
});

/* dragging, for anyone on a mouse — the tap path above does the same job */
document.addEventListener('dragstart', function(e){
  var chip = e.target.closest ? e.target.closest('.chip') : null;
  if (!chip) return;
  sel = chip.getAttribute('data-stage');
  if (e.dataTransfer){ e.dataTransfer.effectAllowed = 'move'; e.dataTransfer.setData('text/plain', sel); }
  renderBand(); renderLanes();
});
document.addEventListener('dragover', function(e){
  if (!sel) return;
  if (e.target.closest && (e.target.closest('.lane') || e.target.closest('.band'))) e.preventDefault();
});
document.addEventListener('drop', function(e){
  if (!sel) return;
  var lane = e.target.closest && e.target.closest('.lane');
  if (lane){ e.preventDefault(); return giveTo(lane.getAttribute('data-person')); }
  if (e.target.closest && e.target.closest('.band') && stage(sel).owner){ e.preventDefault(); takeBack(); }
});
document.addEventListener('dragend', function(){ if (sel){ sel = null; renderBand(); renderLanes(); } });

window.addEventListener('resize', moveThumb);

renderAll();
moveThumb();
if (document.fonts && document.fonts.ready) document.fonts.ready.then(moveThumb);
setTimeout(moveThumb, 300);
</script>
</body>
</html>
