<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SprintBoard Blueprint — the five classes behind the board</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap');
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#05060F;--s1:#0A0C1C;--s2:#0F1330;--s3:#151A3E;
  --tx:#EAF0FF;--tx2:#8FA4CC;--tx3:#4A5B8A;
  --blue:#3B82F6;--purple:#8B5CF6;--cyan:#22D3EE;
  --amber:#F59E0B;--green:#10B981;
  --glow-b:rgba(59,130,246,.45);--glow-p:rgba(139,92,246,.45);
  --glass:rgba(255,255,255,.045);--hair:rgba(255,255,255,.09);
  --mono:'JetBrains Mono',ui-monospace,Menlo,monospace;
  --r:14px;--r2:20px;
}
html,body{height:100%}
body{
  font-family:'Poppins',system-ui,sans-serif;background:var(--bg);color:var(--tx);
  overflow:hidden;-webkit-font-smoothing:antialiased;
}
body::before{
  content:'';position:fixed;inset:0;pointer-events:none;z-index:0;
  background:
    radial-gradient(60% 50% at 14% 6%,rgba(59,130,246,.15),transparent 70%),
    radial-gradient(55% 50% at 90% 94%,rgba(139,92,246,.15),transparent 70%);
}
.app{position:relative;z-index:1;height:100%;display:flex;flex-direction:column}

/* ─────────── header ─────────── */
.top{flex:none;display:flex;align-items:center;gap:12px;padding:12px clamp(12px,2.4vw,24px)}
.mark{
  width:27px;height:27px;border-radius:9px;flex:none;display:grid;place-items:center;
  background:linear-gradient(140deg,var(--blue),var(--purple));box-shadow:0 0 18px var(--glow-b);
}
.mark svg{width:15px;height:15px;color:#fff}
.ttl{flex:1;min-width:0}
.ttl b{display:block;font-size:14.5px;font-weight:600;line-height:1.2}
.ttl small{display:block;font-size:11.5px;color:var(--tx3)}
.legend{flex:none;display:flex;gap:12px;font-size:11px;color:var(--tx3)}
.legend i{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:5px;vertical-align:middle}
.legend .holds i{background:var(--cyan)}
.legend .does i{background:var(--purple)}

/* ─────────── the map ─────────── */
.mapwrap{
  flex:1;min-height:0;margin:0 clamp(12px,2.4vw,24px);
  border-radius:var(--r2);border:1px solid var(--hair);background:var(--glass);
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  overflow:auto;position:relative;
  /* `safe` so a frame shorter than the diagram scrolls from the top
     instead of clipping its first row */
  display:flex;align-items:safe center;
}
/* fixed height, not 100%: the boxes are placed by percentage, so letting the
   map stretch on a tall screen would drift them apart */
.map{position:relative;flex:none;width:100%;min-width:980px;height:360px}
.wires{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.wire{fill:none;stroke:rgba(255,255,255,.14);stroke-width:1.8;transition:stroke .35s,stroke-width .35s}
.wire.hot{
  stroke:var(--cyan);stroke-width:2.6;stroke-dasharray:7 7;
  animation:flow 1s linear infinite;filter:drop-shadow(0 0 6px rgba(34,211,238,.7));
}
.wire.hot.back{animation:flowback 1s linear infinite}
.head{fill:rgba(255,255,255,.22);transition:fill .35s,opacity .3s}
.head.hot{fill:var(--cyan)}
/* the reverse head only exists while an answer is travelling back */
.head.bk{opacity:0}
.head.bk.hot{opacity:1}
.head.off{opacity:0}

.cls{
  position:absolute;width:var(--w,228px);padding:10px 12px 11px;
  border-radius:var(--r);border:1px solid var(--hair);
  background:linear-gradient(170deg,rgba(255,255,255,.07),rgba(255,255,255,.025));
  transition:border-color .3s,box-shadow .3s,transform .3s,opacity .3s;
}
.cls .nm{
  font-family:var(--mono);font-size:12.5px;font-weight:600;color:#fff;
  display:flex;align-items:center;gap:7px;
}
.cls .nm svg{width:14px;height:14px;flex:none;color:var(--blue)}
.cls .row{display:flex;gap:6px;margin-top:8px;align-items:flex-start}
.cls .tagd{
  flex:none;font-size:9px;font-weight:700;letter-spacing:.6px;padding:2px 5px;
  border-radius:4px;margin-top:1px;
}
.cls .tagd.h{background:rgba(34,211,238,.16);color:var(--cyan)}
.cls .tagd.d{background:rgba(139,92,246,.18);color:#C4B5FD}
.cls .items{display:flex;flex-direction:column;gap:3px;min-width:0}
.cls .items span{font-family:var(--mono);font-size:10.5px;color:var(--tx2);line-height:1.35}
.cls:hover{transform:translateY(-3px);box-shadow:0 14px 30px rgba(0,0,0,.5)}
.cls.hot{
  border-color:var(--cyan);
  box-shadow:0 0 0 1px rgba(34,211,238,.4),0 0 34px rgba(34,211,238,.35);
  transform:translateY(-3px);
}
.cls.dim{opacity:.34}
.cls.entry{--w:132px}
.cls.entry .items span{color:var(--tx3)}

/* ─────────── story strip ─────────── */
.story{
  flex:none;display:flex;align-items:center;gap:10px;
  padding:10px clamp(12px,2.4vw,24px) clamp(12px,2vh,16px);
}
/* the chips scroll among themselves rather than widening the page —
   this lab must never make the body scroll sideways */
.picks{flex:0 1 auto;min-width:0;display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:1px}
.picks::-webkit-scrollbar{display:none}
.pick{flex:none}
.pick{
  padding:7px 12px;border-radius:999px;border:1px solid var(--hair);cursor:pointer;
  background:var(--glass);font-family:inherit;font-size:11.5px;font-weight:500;color:var(--tx2);
  transition:border-color .26s,color .26s,box-shadow .26s,transform .26s;white-space:nowrap;
}
.pick:hover{transform:translateY(-2px)}
.pick.on{border-color:var(--purple);color:#fff;font-weight:600;box-shadow:0 0 20px var(--glow-p)}

.note{
  flex:1;min-width:0;display:flex;align-items:center;gap:9px;
  padding:9px 13px;border-radius:999px;border:1px solid var(--hair);background:var(--glass);
}
.note .stepn{
  flex:none;width:19px;height:19px;border-radius:50%;display:grid;place-items:center;
  background:linear-gradient(120deg,var(--blue),var(--purple));
  font-size:10.5px;font-weight:700;color:#fff;
}
.note p{font-size:12px;color:var(--tx2);line-height:1.35}
.note code{font-family:var(--mono);font-size:11.5px;color:var(--cyan)}

.nav{flex:none;display:flex;gap:6px}
.nav button{
  display:flex;align-items:center;gap:6px;padding:8px 14px;border:0;border-radius:999px;
  cursor:pointer;font-family:inherit;font-size:12px;font-weight:600;color:#fff;
  background:linear-gradient(120deg,var(--blue),var(--purple));
  box-shadow:0 6px 18px rgba(0,0,0,.4),0 0 20px var(--glow-b);
  transition:transform .24s,box-shadow .24s,opacity .24s;
}
.nav button svg{width:13px;height:13px}
.nav button.ghost{background:rgba(255,255,255,.08);box-shadow:none;color:var(--tx2)}
.nav button:hover{transform:translateY(-2px)}
.nav button:disabled{opacity:.3;cursor:not-allowed;transform:none}

@keyframes flow{to{stroke-dashoffset:-28}}
@keyframes flowback{to{stroke-dashoffset:28}}

@media (max-height:620px){
  .top{padding:8px clamp(10px,2.2vw,18px)}
  .ttl small{display:none}
  .mapwrap{margin:0 clamp(10px,2.2vw,18px)}
  .map{height:290px}
  .cls{padding:8px 10px 9px}
  .cls .items span{font-size:10px}
  .story{padding:8px clamp(10px,2.2vw,18px) 10px}
}
@media (max-width:760px){
  .legend{display:none}
  .story{flex-wrap:wrap}
  .note{order:3;flex-basis:100%}
}
</style>
</head>
<body>

<div class="app">

  <header class="top">
    <span class="mark" id="mark"></span>
    <span class="ttl">
      <b>SprintBoard Blueprint</b>
      <small>The five classes behind the board — and how one action travels through them</small>
    </span>
    <span class="legend">
      <span class="holds"><i></i>what it holds</span>
      <span class="does"><i></i>what it does</span>
    </span>
  </header>

  <div class="mapwrap">
    <div class="map" id="map">
      <svg class="wires" id="wires" aria-hidden="true"></svg>
    </div>
  </div>

  <div class="story">
    <div class="picks" id="picks"></div>
    <div class="note">
      <span class="stepn" id="stepn">1</span>
      <p id="note"></p>
    </div>
    <div class="nav">
      <button class="ghost" id="prev" aria-label="Previous step"></button>
      <button id="next" aria-label="Next step"></button>
    </div>
  </div>

</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/animejs/3.2.2/anime.min.js"></script>
<script>
/* ════════════════════════════════════════
   ICONS
════════════════════════════════════════ */
var I = {
  plan:'<svg viewBox="0 0 24 24" fill="none"><rect x="3.5" y="4.5" width="17" height="15" rx="2.5" stroke="currentColor" stroke-width="1.9"/><path d="M8.5 9h7M8.5 13h4" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"/></svg>',
  play:'<svg viewBox="0 0 24 24" fill="none"><path d="M8 5.5l10 6.5-10 6.5z" fill="currentColor"/></svg>',
  back:'<svg viewBox="0 0 24 24" fill="none"><path d="M15 5l-7 7 7 7" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>',
  door:'<svg viewBox="0 0 24 24" fill="none"><path d="M14 4.5H6.5v15H14" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/><path d="M11 12h8m0 0l-3-3m3 3l-3 3" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/></svg>',
  key:'<svg viewBox="0 0 24 24" fill="none"><circle cx="8" cy="12" r="3.6" stroke="currentColor" stroke-width="1.9"/><path d="M11.6 12H20m-3 0v3m-2.5-3v2.2" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"/></svg>',
  person:'<svg viewBox="0 0 24 24" fill="none"><circle cx="12" cy="8" r="3.4" stroke="currentColor" stroke-width="1.9"/><path d="M5 20c0-3.6 3.1-6 7-6s7 2.4 7 6" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"/></svg>',
  crown:'<svg viewBox="0 0 24 24" fill="none"><path d="M4 18h16M4.5 7l4 4 3.5-5 3.5 5 4-4-1.5 9h-12z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg>',
  disk:'<svg viewBox="0 0 24 24" fill="none"><path d="M5 4.5h11L19.5 8v11.5h-15z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><path d="M8.5 4.5v5h7" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg>'
};

/* ════════════════════════════════════════
   THE CLASSES — straight off the design sheet
════════════════════════════════════════ */
var CLASSES = [
  { id:'main', name:'Main.java', icon:'door', entry:true,
    x:1.5, y:40,
    holds:[], does:['starts the program'] },

  { id:'board', name:'SprintBoard.java', icon:'key',
    x:16, y:35,
    holds:['[ users ]'], does:['signIn()','signUp()'] },

  { id:'user', name:'UserOperations.java', icon:'person',
    x:41, y:2,
    holds:['[ tasks ]'], does:['updateTasks()','viewPreviousTasks()'] },

  { id:'admin', name:'AdminOperations.java', icon:'crown',
    x:41, y:58,
    holds:['[ all tasks ]','[ employee → [tasks] ]'], does:['assignTasks()'] },

  { id:'file', name:'FileOperations.java', icon:'disk',
    x:73, y:30,
    holds:['[ employee, [tasks] ]'], does:['getAllUsersDetails()','getEmployeeTasks()'] }
];

/* every arrow on the sheet */
var WIRES = [
  ['main','board'], ['board','user'], ['board','admin'],
  ['board','file'], ['user','file'], ['admin','file']
];

/* ════════════════════════════════════════
   THREE THINGS THAT CAN HAPPEN
   a step spotlights one class, and optionally one arrow
════════════════════════════════════════ */
var STORIES = [
  { id:'join', label:'Someone joins', steps:[
    {cls:'main',  wire:null,            note:'<code>Main.java</code> starts and hands over to the board.'},
    {cls:'board', wire:['main','board'], note:'<code>signUp()</code> adds the new person to <code>[ users ]</code>.'},
    {cls:'file',  wire:['board','file'], note:'The board asks <code>FileOperations</code> to write them down, so they are still there tomorrow.'}
  ]},

  { id:'assign', label:'The lead hands out a stage', steps:[
    {cls:'board', wire:['main','board'], note:'<code>signIn()</code> recognises this person as the lead.'},
    {cls:'admin', wire:['board','admin'], note:'The lead side takes over: <code>AdminOperations</code> holds <code>[ all tasks ]</code>.'},
    {cls:'admin', wire:null,             note:'<code>assignTasks()</code> files the stage under the employee — that is the <code>[ employee → [tasks] ]</code> pairing.'},
    {cls:'file',  wire:['admin','file'], note:'Who holds what gets saved, so the board looks the same next time it opens.'}
  ]},

  { id:'open', label:'An employee opens their day', steps:[
    {cls:'board', wire:['main','board'], note:'<code>signIn()</code> recognises an ordinary employee.'},
    {cls:'user',  wire:['board','user'], note:'The employee side takes over: <code>UserOperations</code> holds only <code>[ tasks ]</code> — their own.'},
    {cls:'file',  wire:['user','file'],  note:'<code>viewPreviousTasks()</code> asks <code>FileOperations</code> for the work filed under this person.'},
    {cls:'user',  wire:['user','file'], back:true,
                                         note:'<code>getEmployeeTasks()</code> hands back <code>[ employee, [tasks] ]</code> — one name, and everything under it.'},
    {cls:'user',  wire:null,             note:'<code>updateTasks()</code> writes any change back the same way it came.'}
  ]}
];

var story = 0, step = 0;
var A = (typeof anime === 'function') ? anime : null;
if (A) A.suspendWhenDocumentHidden = false;

function $(id){ return document.getElementById(id); }
function cls(id){ for (var i=0;i<CLASSES.length;i++) if (CLASSES[i].id===id) return CLASSES[i]; return null; }
function wireId(a,b){ return 'w-'+a+'-'+b; }

/* ════════════════════════════════════════
   BUILD THE MAP
════════════════════════════════════════ */
function buildClasses(){
  var map = $('map');
  CLASSES.forEach(function(c){
    var el = document.createElement('div');
    el.className = 'cls' + (c.entry ? ' entry' : '');
    el.id = 'c-' + c.id;
    el.style.left = c.x + '%';
    el.style.top  = c.y + '%';
    var rows = '';
    if (c.holds.length){
      rows += '<div class="row"><span class="tagd h">HOLDS</span><span class="items">' +
              c.holds.map(function(h){ return '<span>'+h+'</span>'; }).join('') + '</span></div>';
    }
    if (c.does.length){
      rows += '<div class="row"><span class="tagd d">DOES</span><span class="items">' +
              c.does.map(function(d){ return '<span>'+d+'</span>'; }).join('') + '</span></div>';
    }
    el.innerHTML = '<span class="nm">'+I[c.icon]+c.name+'</span>' + rows;
    map.appendChild(el);
  });
}

/* Wires are drawn from where the boxes actually ended up, so the picture
   survives a resize, a font landing late, or a longer method name. */
function drawWires(){
  var map = $('map'), svg = $('wires');
  var box = map.getBoundingClientRect();
  svg.setAttribute('viewBox', '0 0 ' + box.width + ' ' + box.height);
  svg.innerHTML = '';

  WIRES.forEach(function(w){
    var a = $('c-'+w[0]).getBoundingClientRect();
    var b = $('c-'+w[1]).getBoundingClientRect();
    var x1 = a.right - box.left, y1 = a.top - box.top + a.height/2;
    var x2 = b.left  - box.left, y2 = b.top - box.top + b.height/2;
    var dx = Math.max(38, (x2 - x1) * 0.45);

    var path = document.createElementNS('http://www.w3.org/2000/svg','path');
    path.setAttribute('d', 'M'+x1+','+y1+' C'+(x1+dx)+','+y1+' '+(x2-dx)+','+y2+' '+x2+','+y2);
    path.setAttribute('class','wire');
    path.id = wireId(w[0], w[1]);
    svg.appendChild(path);

    var head = document.createElementNS('http://www.w3.org/2000/svg','path');
    head.setAttribute('d','M'+x2+','+y2+' l-7,-4.5 l0,9 z');
    head.setAttribute('class','head');
    head.id = 'h-' + wireId(w[0], w[1]);
    svg.appendChild(head);

    /* the same line carries an answer back, so it needs a head at the other
       end too — pointing the wrong way would undo the whole diagram */
    var back = document.createElementNS('http://www.w3.org/2000/svg','path');
    back.setAttribute('d','M'+x1+','+y1+' l7,-4.5 l0,9 z');
    back.setAttribute('class','head bk');
    back.id = 'hb-' + wireId(w[0], w[1]);
    svg.appendChild(back);
  });
}

/* ════════════════════════════════════════
   SPOTLIGHT
════════════════════════════════════════ */
function centreOn(el){
  if (!el) return;
  var wrap = document.querySelector('.mapwrap');
  var max = wrap.scrollWidth - wrap.clientWidth;
  if (max <= 0) return;                       /* nothing to scroll: it all fits */
  var want = el.offsetLeft + el.offsetWidth / 2 - wrap.clientWidth / 2;
  want = Math.max(0, Math.min(want, max));

  if (wrap.scrollTo){
    try { wrap.scrollTo({ left: want, behavior: 'smooth' }); } catch (e) { wrap.scrollLeft = want; }
    /* if the smooth scroll never ran, put it there anyway */
    setTimeout(function(){
      if (Math.abs(wrap.scrollLeft - want) > 2) wrap.scrollLeft = want;
    }, 420);
  } else {
    wrap.scrollLeft = want;
  }
}

function paint(){
  var st = STORIES[story].steps[step];

  CLASSES.forEach(function(c){
    var el = $('c-'+c.id);
    el.classList.toggle('hot', c.id === st.cls);
    el.classList.toggle('dim', c.id !== st.cls);
  });

  WIRES.forEach(function(w){
    var on = !!(st.wire && st.wire[0] === w[0] && st.wire[1] === w[1]);
    var rev = on && !!st.back;
    var p = $(wireId(w[0], w[1]));
    var h = $('h-'+wireId(w[0], w[1])), hb = $('hb-'+wireId(w[0], w[1]));
    if (!p) return;
    p.classList.toggle('hot', on);
    p.classList.toggle('back', rev);
    h.classList.toggle('hot', on && !rev);
    h.classList.toggle('off', rev);
    hb.classList.toggle('hot', rev);
  });

  $('note').innerHTML = st.note;
  $('stepn').textContent = (step + 1);
  $('prev').disabled = step === 0;
  $('next').textContent = '';
  $('next').appendChild(document.createTextNode(step === STORIES[story].steps.length - 1 ? 'Replay' : 'Next'));
  $('next').insertAdjacentHTML('afterbegin', I.play);

  /* In a narrow frame the diagram is wider than the window, so the class being
     spotlighted can easily be off to one side. Bring it into view by setting
     the scroll position outright — smooth scrolling is animation, and
     animation is exactly what cannot be relied on to run here. */
  centreOn($('c-'+st.cls));

  if (A) A({targets:'#c-'+st.cls, scale:[1,1.03,1], duration:420, easing:'easeOutQuad'});
}

function renderPicks(){
  $('picks').innerHTML = STORIES.map(function(s,i){
    return '<button class="pick'+(i===story?' on':'')+'" data-i="'+i+'">'+s.label+'</button>';
  }).join('');
}

function go(n){
  var len = STORIES[story].steps.length;
  step = (n + len) % len;
  paint();
}

/* ════════════════════════════════════════
   WIRE UP
════════════════════════════════════════ */
$('mark').innerHTML = I.plan;
$('prev').innerHTML = I.back;

buildClasses();
renderPicks();
drawWires();
paint();

$('picks').addEventListener('click', function(e){
  var b = e.target.closest('.pick');
  if (!b) return;
  story = +b.getAttribute('data-i'); step = 0;
  renderPicks(); paint();
});
$('next').addEventListener('click', function(){ go(step + 1); });
$('prev').addEventListener('click', function(){ go(step - 1); });

/* clicking a class walks to the next step that features it */
$('map').addEventListener('click', function(e){
  var el = e.target.closest('.cls');
  if (!el) return;
  var id = el.id.slice(2), steps = STORIES[story].steps;
  for (var i = 1; i <= steps.length; i++){
    var n = (step + i) % steps.length;
    if (steps[n].cls === id){ go(n); return; }
  }
});

document.addEventListener('keydown', function(e){
  if (e.key === 'ArrowRight') go(step + 1);
  else if (e.key === 'ArrowLeft') go(step - 1);
});

window.addEventListener('resize', function(){ drawWires(); paint(); });
if (document.fonts && document.fonts.ready) document.fonts.ready.then(function(){ drawWires(); paint(); });
setTimeout(function(){ drawWires(); paint(); }, 350);
</script>
</body>
</html>
