<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Class Detective — Discover why we need another class</title>
<style>
:root {
  --bg: #0f1117;
  --surface: #1a1d27;
  --surface2: #21253a;
  --surface3: #2a2f47;
  --border: #3a3f5c;
  --border2: #4a5080;
  --text: #e8eaf6;
  --text2: #9ea3c0;
  --text3: #6b70a0;
  --accent: #7c7fff;
  --accent2: #5b5ff0;
  --green: #4caf7d;
  --amber: #f0a843;
  --red: #f06b6b;
  --pink: #e879a0;
  --teal: #4dd9c0;
  --radius: 12px;
  --radius-sm: 8px;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; background: var(--bg); color: var(--text); overflow: hidden; }
#app { height: 100vh; display: flex; flex-direction: column; }

/* Progress bar */
#progress-bar {
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  padding: 12px 24px;
  display: flex;
  align-items: center;
  gap: 20px;
  flex-shrink: 0;
}
.step-label { font-size: 13px; color: var(--text2); min-width: 100px; }
.dots { display: flex; gap: 6px; flex: 1; }
.dot {
  width: 32px; height: 6px; border-radius: 3px;
  background: var(--border); transition: all 0.3s;
}
.dot.active { background: var(--accent); }
.dot.done { background: var(--accent2); }
.restart-btn {
  background: none; border: 1px solid var(--border2); color: var(--text2);
  padding: 6px 14px; border-radius: 20px; cursor: pointer; font-size: 12px;
  transition: all 0.2s;
}
.restart-btn:hover { border-color: var(--accent); color: var(--accent); }

/* Main content */
#screen-container {
  flex: 1; overflow-y: auto; overflow-x: hidden;
  padding: 32px 24px;
  display: flex; flex-direction: column; align-items: center;
}
.screen { width: 100%; max-width: 860px; animation: fadeIn 0.4s ease; }
@keyframes fadeIn { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }

h1 { font-size: 26px; font-weight: 700; margin-bottom: 8px; }
h2 { font-size: 20px; font-weight: 600; margin-bottom: 8px; }
.subtitle { font-size: 15px; color: var(--text2); margin-bottom: 28px; line-height: 1.6; }
.step-tag {
  display: inline-block; background: var(--surface2); border: 1px solid var(--border);
  color: var(--accent); font-size: 11px; letter-spacing: 0.5px; padding: 4px 10px;
  border-radius: 20px; margin-bottom: 14px; font-weight: 600;
}

/* Cards */
.card {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: var(--radius); padding: 20px 24px; margin-bottom: 16px;
}
.card-title {
  font-size: 12px; font-weight: 700; letter-spacing: 1px; color: var(--text3);
  text-transform: uppercase; margin-bottom: 12px;
}

/* Class diagram boxes */
.class-box {
  background: var(--surface2); border: 1.5px solid var(--border2);
  border-radius: var(--radius); overflow: hidden; display: inline-block; min-width: 200px;
  transition: all 0.4s;
}
.class-name {
  background: var(--accent2); padding: 10px 20px; font-size: 15px; font-weight: 700;
  text-align: center; color: #fff;
}
.class-name.green-header { background: linear-gradient(135deg, #1e7a50, #2da870); }
.class-name.purple-header { background: linear-gradient(135deg, #5b2db5, #7c5de0); }
.class-section { border-top: 1px solid var(--border); padding: 12px 20px; }
.class-field { font-size: 13px; color: var(--teal); padding: 3px 0; font-family: 'Consolas','Courier New',monospace; }
.class-method { font-size: 13px; color: var(--amber); padding: 3px 0; font-family: 'Consolas','Courier New',monospace; }

/* Note cards */
.note-card {
  background: var(--surface2); border: 1px solid var(--border2); border-radius: var(--radius-sm);
  padding: 14px 18px; min-width: 160px; max-width: 200px; display: inline-block;
  transition: all 0.3s;
}
.note-pin { font-size: 16px; margin-right: 6px; }
.note-title { font-size: 14px; font-weight: 700; margin-bottom: 4px; }
.note-content { font-size: 12px; color: var(--text2); }
.note-category {
  display: inline-block; background: var(--surface3); border: 1px solid var(--border);
  font-size: 11px; color: var(--text3); padding: 2px 8px; border-radius: 10px; margin-top: 6px;
}

/* Buttons */
.btn {
  display: inline-block; padding: 12px 28px; border-radius: 8px; font-size: 15px;
  font-weight: 600; cursor: pointer; border: none; transition: all 0.2s; text-align: center;
}
.btn-primary { background: var(--accent2); color: #fff; }
.btn-primary:hover { background: var(--accent); transform: translateY(-1px); }
.btn-outline {
  background: var(--surface2); border: 1.5px solid var(--border2); color: var(--text);
}
.btn-outline:hover { border-color: var(--accent); color: var(--accent); }
.btn-choice {
  display: block; width: 100%; padding: 18px 24px; margin-bottom: 12px;
  background: var(--surface2); border: 1.5px solid var(--border);
  border-radius: var(--radius-sm); cursor: pointer; text-align: left; font-size: 15px;
  color: var(--text); font-family: inherit; transition: all 0.2s;
}
.btn-choice:hover { border-color: var(--accent); background: var(--surface3); }
.btn-choice.correct { border-color: var(--green); background: rgba(76,175,125,0.1); color: var(--green); }
.btn-choice.wrong { border-color: var(--red); background: rgba(240,107,107,0.1); color: var(--red); animation: shake 0.3s; }
@keyframes shake { 0%,100%{transform:translateX(0)} 25%{transform:translateX(-5px)} 75%{transform:translateX(5px)} }

/* Input form */
.input-group { display: flex; flex-direction: column; gap: 10px; margin-bottom: 20px; }
.input-row { display: flex; align-items: center; gap: 12px; }
.input-label { font-size: 13px; color: var(--text2); width: 80px; flex-shrink: 0; }
input[type="text"], select {
  background: var(--surface2); border: 1px solid var(--border2); color: var(--text);
  padding: 8px 14px; border-radius: 6px; font-size: 14px; flex: 1;
  font-family: inherit; outline: none;
}
input[type="text"]:focus, select:focus { border-color: var(--accent); }
select option { background: var(--surface2); }

/* Notes grid */
.notes-grid { display: flex; flex-wrap: wrap; gap: 14px; margin: 20px 0; }

/* Code blocks */
.code-block {
  background: #0d1117; border: 1px solid var(--border); border-radius: var(--radius-sm);
  padding: 18px 20px; font-family: 'Consolas','Courier New',monospace; font-size: 13px;
  line-height: 1.7; overflow-x: auto;
}
.kw { color: #f97583; } .cls { color: #79b8ff; } .type { color: #b392f0; }
.field-c { color: #56d364; } .method-c { color: #e3b341; } .comment-c { color: #6a737d; }
.str-c { color: #9ecbff; }

/* Arrow / relationship */
.relationship {
  display: flex; flex-direction: column; align-items: center; gap: 6px;
  padding: 12px 0;
}
.rel-arrow { font-size: 24px; color: var(--accent); }
.rel-label { font-size: 12px; color: var(--text3); }

/* Columns */
.two-col { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; align-items: start; }
.three-col { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 16px; }
@media (max-width: 680px) { .two-col, .three-col { grid-template-columns: 1fr; } }

/* Animation for properties floating */
@keyframes flyRight { from { transform: translateX(0) scale(1); opacity: 1; } to { transform: translateX(120px) scale(0.9); opacity: 0; } }
@keyframes flyIn { from { transform: translateX(-40px) scale(0.9); opacity: 0; } to { transform: translateX(0) scale(1); opacity: 1; } }
.fly-out { animation: flyRight 0.5s ease forwards; }
.fly-in { animation: flyIn 0.5s ease 0.5s both; }

/* Highlight */
.highlight { color: var(--amber); }
.highlight-green { color: var(--green); }
.highlight-blue { color: var(--accent); }

/* Investigation panel */
.investigation-row {
  display: flex; align-items: flex-start; gap: 16px; padding: 16px;
  background: var(--surface2); border: 1px solid var(--border); border-radius: var(--radius-sm);
  margin-bottom: 12px;
}
.inv-icon { font-size: 24px; flex-shrink: 0; }
.inv-content { flex: 1; }
.inv-title { font-size: 14px; font-weight: 700; margin-bottom: 4px; }
.inv-desc { font-size: 13px; color: var(--text2); }

/* Summary flow */
.flow-step {
  display: flex; align-items: center; gap: 16px; padding: 14px 18px;
  background: var(--surface2); border: 1px solid var(--border); border-radius: var(--radius-sm);
  margin-bottom: 4px;
}
.flow-arrow { font-size: 18px; color: var(--border2); margin: 0 auto 4px; display: block; text-align: center; }
.flow-num { width: 32px; height: 32px; border-radius: 50%; background: var(--accent2); font-size: 14px; font-weight: 700; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
.flow-text { font-size: 14px; color: var(--text2); }
.flow-text strong { color: var(--text); }

/* Big idea */
.big-idea {
  background: linear-gradient(135deg, rgba(92,95,240,0.2), rgba(78,127,208,0.2));
  border: 1.5px solid var(--accent); border-radius: var(--radius);
  padding: 28px 32px; text-align: center; margin: 20px 0;
}
.big-idea h2 { color: var(--accent); font-size: 22px; margin-bottom: 20px; }
.big-idea-row { display: flex; align-items: center; justify-content: center; gap: 16px; flex-wrap: wrap; margin: 12px 0; }
.big-idea-pill {
  background: var(--surface2); border: 1px solid var(--border2); border-radius: 8px;
  padding: 12px 24px; font-size: 15px; font-weight: 600;
}
.big-idea-plus { font-size: 22px; color: var(--text3); }
.big-idea-arrow { font-size: 28px; color: var(--accent); display: block; margin: 8px 0; }
.big-idea-result {
  background: var(--accent2); color: #fff; border-radius: 8px;
  padding: 14px 32px; font-size: 16px; font-weight: 700;
}
.quote-box {
  background: var(--surface2); border-left: 3px solid var(--accent); border-radius: 0 var(--radius-sm) var(--radius-sm) 0;
  padding: 14px 18px; margin: 12px 0; font-size: 14px; color: var(--text2); font-style: italic;
}

/* Crowded single class visual */
.crowded-class {
  background: var(--surface2); border: 2px solid var(--red); border-radius: var(--radius);
  padding: 20px; position: relative; transition: all 0.4s;
}
.crowded-class.normal { border-color: var(--border2); }
.crowded-badge {
  position: absolute; top: -10px; right: 12px; background: var(--red);
  color: #fff; font-size: 11px; font-weight: 700; padding: 3px 10px; border-radius: 10px;
}
.problem-item {
  background: rgba(240,107,107,0.1); border: 1px solid rgba(240,107,107,0.3);
  border-radius: 6px; padding: 8px 14px; margin: 8px 0; font-size: 13px; color: var(--red);
  display: flex; align-items: center; gap: 8px;
}

/* Object badge */
.object-badge {
  display: flex; flex-direction: column; gap: 6px; padding: 14px 18px;
  background: var(--surface2); border: 1.5px solid var(--border2); border-radius: var(--radius-sm);
}
.object-header { font-size: 11px; color: var(--accent); font-weight: 700; letter-spacing: 0.5px; text-transform: uppercase; }
.object-field { font-size: 13px; font-family: monospace; }
.object-field .field-name { color: var(--teal); }
.object-field .field-val { color: var(--amber); }

/* Scenario cards */
.scenario-card {
  background: var(--surface2); border: 1.5px solid var(--border); border-radius: var(--radius);
  padding: 20px; cursor: pointer; transition: all 0.2s;
}
.scenario-card:hover { border-color: var(--accent); transform: translateY(-2px); }
.scenario-icon { font-size: 28px; margin-bottom: 10px; }
.scenario-title { font-size: 15px; font-weight: 700; margin-bottom: 4px; }
.scenario-desc { font-size: 13px; color: var(--text2); }

/* Back/next nav */
.nav-row { display: flex; justify-content: space-between; align-items: center; margin-top: 24px; }
.chip { background: var(--surface2); border: 1px solid var(--border); border-radius: 20px; padding: 6px 14px; font-size: 12px; color: var(--text3); }

/* Ops animation */
.ops-row { display: flex; flex-wrap: wrap; gap: 10px; padding: 16px; }
.op-pill {
  background: var(--surface2); border: 1px solid var(--border2); border-radius: 6px;
  padding: 8px 16px; font-size: 13px; display: flex; align-items: center; gap: 8px;
  transition: all 0.3s;
}
.op-pill.moving { background: rgba(92,95,240,0.15); border-color: var(--accent); }

.fade-in-item { animation: fadeIn 0.4s ease both; }
</style>
</head>
<body>
<div id="app">
  <div id="progress-bar">
    <span class="step-label" id="step-label">The Challenge</span>
    <div class="dots" id="dots"></div>
    <button class="restart-btn" onclick="restart()">↺ Restart</button>
  </div>
  <div id="screen-container">
    <div id="screen" class="screen"></div>
  </div>
</div>

<script>
// App state
let state = {
  step: 0,
  notes: [],
  noteTitle: '', noteContent: '', noteCat: 'Programming', notePinned: false,
  scenario: 'notes'
};

const TOTAL_STEPS = 10;
const STEP_NAMES = [
  'The Challenge','Single Class','Create Notes','Problem Appears',
  'Discover the Thing','Multiple Objects','Responsibility','Transformation',
  'Java Code','Big Idea'
];

function updateProgress() {
  document.getElementById('step-label').textContent = `Step ${state.step+1} / ${TOTAL_STEPS}`;
  const dots = document.getElementById('dots');
  dots.innerHTML = Array.from({length: TOTAL_STEPS}, (_,i) =>
    `<div class="dot ${i < state.step ? 'done' : i === state.step ? 'active' : ''}"></div>`
  ).join('');
}

function restart() {
  state = { step: 0, notes: [], noteTitle:'', noteContent:'', noteCat:'Programming', notePinned:false, scenario:'notes' };
  render();
}

function goTo(step) {
  state.step = step;
  render();
  document.getElementById('screen-container').scrollTop = 0;
}

function render() {
  updateProgress();
  const screens = [s0,s1,s2,s3,s4,s5,s6,s7,s8,s9];
  document.getElementById('screen').innerHTML = '';
  document.getElementById('screen').appendChild(screens[state.step]());
}

// ── SCREEN 0: The Challenge ──────────────────────────────────────────────────
function s0() {
  const el = div();
  el.innerHTML = `
    <div class="step-tag">CASE 0 / THE CHALLENGE</div>
    <h1>📝 You need to build a Notes App</h1>
    <p class="subtitle">Users need to create, edit, delete, search, pin, and view notes. How would you design it?</p>
    <div class="card">
      <div class="card-title">Required Features</div>
      ${['Create notes','Edit notes','Delete notes','Search notes','Pin notes','View notes']
        .map(f => `<div style="padding:6px 0; font-size:14px; border-bottom:1px solid var(--border); display:flex; align-items:center; gap:10px">
          <span style="color:var(--green)">✓</span> ${f}</div>`).join('')}
    </div>
    <p style="font-size:15px; margin:24px 0 16px; font-weight:600">How would you design this application?</p>
    <button class="btn-choice" onclick="chooseDesign('one')">
      <span style="font-size:20px; margin-right:12px">🏠</span>
      <strong>ONE CLASS</strong> — Put everything in a single class
    </button>
    <button class="btn-choice" onclick="chooseDesign('multi')">
      <span style="font-size:20px; margin-right:12px">🏘️</span>
      <strong>MULTIPLE CLASSES</strong> — Split into separate classes
    </button>
  `;
  return el;
}

function chooseDesign(choice) {
  if (choice === 'one') {
    goTo(1);
  } else {
    const btns = document.querySelectorAll('.btn-choice');
    btns[1].classList.add('correct');
    btns[0].style.opacity = '0.5';
    setTimeout(() => goTo(1), 1200);
  }
}

// ── SCREEN 1: The Single Class ────────────────────────────────────────────────
function s1() {
  const el = div();
  el.innerHTML = `
    <div class="step-tag">CASE 1 / THE DESIGN</div>
    <h1>The Single Class Approach</h1>
    <p class="subtitle">One class to rule them all. Looks simple, right?</p>
    <div style="display:flex; justify-content:center; margin: 28px 0;">
      <div class="class-box" style="min-width:260px">
        <div class="class-name">NotesApp</div>
        <div class="class-section">
          <div class="class-field">title</div>
          <div class="class-field">content</div>
          <div class="class-field">category</div>
          <div class="class-field">pinned</div>
          <div class="class-field">createdDate</div>
        </div>
        <div class="class-section">
          <div class="class-method">addNote()</div>
          <div class="class-method">deleteNote()</div>
          <div class="class-method">searchNote()</div>
          <div class="class-method">editNote()</div>
          <div class="class-method">displayNotes()</div>
        </div>
      </div>
    </div>
    <div class="card" style="background: rgba(76,175,125,0.08); border-color: rgba(76,175,125,0.3)">
      <div style="font-size:14px; color:var(--green); margin-bottom:6px">✓ Everything is in one place</div>
      <div style="font-size:13px; color:var(--text2)">All the data fields and all the operations. Clean and simple. Let's try using it!</div>
    </div>
    <div class="nav-row">
      <div></div>
      <button class="btn btn-primary" onclick="goTo(2)">Let's try it →</button>
    </div>
  `;
  return el;
}

// ── SCREEN 2: Create Notes ────────────────────────────────────────────────────
function s2() {
  const el = div();
  const presets = [
    {title:'Java', content:'Classes and Objects', cat:'Programming', pin:true},
    {title:'SQL', content:'Joins and Queries', cat:'Databases', pin:false},
    {title:'Python', content:'Lists and Loops', cat:'Programming', pin:false},
    {title:'Git', content:'Version Control', cat:'Tools', pin:true},
    {title:'Linux', content:'Shell Commands', cat:'OS', pin:false},
  ];

  el.innerHTML = `
    <div class="step-tag">CASE 2 / CREATE NOTES</div>
    <h1>Create Some Notes</h1>
    <p class="subtitle">Use the NotesApp to create notes. Everything looks fine so far...</p>
    <div class="card">
      <div class="card-title">New Note</div>
      <div class="input-group">
        <div class="input-row">
          <span class="input-label">Title</span>
          <input type="text" id="n-title" placeholder="e.g. Java" value="${state.noteTitle}">
        </div>
        <div class="input-row">
          <span class="input-label">Content</span>
          <input type="text" id="n-content" placeholder="e.g. Classes and Objects" value="${state.noteContent}">
        </div>
        <div class="input-row">
          <span class="input-label">Category</span>
          <select id="n-cat">
            ${['Programming','Databases','Tools','OS','Other'].map(c =>
              `<option ${c===state.noteCat?'selected':''}>${c}</option>`).join('')}
          </select>
        </div>
        <div class="input-row">
          <span class="input-label">Pinned</span>
          <select id="n-pin">
            <option value="false" ${!state.notePinned?'selected':''}>No</option>
            <option value="true" ${state.notePinned?'selected':''}>Yes</option>
          </select>
        </div>
      </div>
      <button class="btn btn-primary" onclick="addNote()" style="width:100%; margin-bottom:12px">+ CREATE NOTE</button>
      <div style="font-size:12px; color:var(--text3); text-align:center">or use quick presets:</div>
      <div style="display:flex; flex-wrap:wrap; gap:8px; margin-top:10px; justify-content:center">
        ${presets.filter(p => !state.notes.find(n=>n.title===p.title)).map(p =>
          `<button class="btn btn-outline" style="padding:6px 14px; font-size:12px" onclick='addPreset(${JSON.stringify(p)})'>
            ${p.pin?'📌 ':''}${p.title}
          </button>`).join('')}
      </div>
    </div>
    <div id="notes-area">
      ${renderNotesGrid()}
    </div>
    ${state.notes.length >= 3 ? `
    <div class="nav-row">
      <div></div>
      <button class="btn btn-primary" onclick="goTo(3)">I've created enough notes →</button>
    </div>` : `<div style="text-align:center; font-size:13px; color:var(--text3); margin-top:16px">Create at least ${3 - state.notes.length} more note${3-state.notes.length!==1?'s':''} to continue</div>`}
  `;
  return el;
}

function renderNotesGrid() {
  if (!state.notes.length) return '<div style="text-align:center; color:var(--text3); font-size:14px; padding:20px">No notes yet. Create your first note!</div>';
  return `<div class="notes-grid">${state.notes.map(n => `
    <div class="note-card fade-in-item">
      <div class="note-title">${n.pin?'📌 ':''}${n.title}</div>
      <div class="note-content">${n.content}</div>
      <div class="note-category">${n.cat}</div>
    </div>`).join('')}</div>`;
}

function addNote() {
  const t = document.getElementById('n-title').value.trim();
  const c = document.getElementById('n-content').value.trim();
  const cat = document.getElementById('n-cat').value;
  const pin = document.getElementById('n-pin').value === 'true';
  if (!t || !c) { alert('Please enter a title and content.'); return; }
  state.notes.push({title:t, content:c, cat, pin});
  state.noteTitle = ''; state.noteContent = ''; state.noteCat = cat; state.notePinned = false;
  render();
}

function addPreset(p) {
  state.notes.push({title:p.title, content:p.content, cat:p.cat, pin:p.pin});
  render();
}

// ── SCREEN 3: Show the Problem ────────────────────────────────────────────────
function s3() {
  const el = div();
  el.innerHTML = `
    <div class="step-tag">CASE 3 / THE PROBLEM</div>
    <h1>Wait... Something feels off</h1>
    <p class="subtitle">Look at the NotesApp class. It started with data for <em>one</em> note. But now you have ${state.notes.length} notes...</p>
    <div class="two-col" style="margin: 20px 0;">
      <div class="crowded-class" id="crowded">
        <div class="crowded-badge">⚠️ Confused!</div>
        <div style="font-size:13px; color:var(--text2); margin-bottom:12px; font-weight:600">NotesApp</div>
        <div class="class-field" style="font-size:13px">title = ???</div>
        <div class="class-field" style="font-size:13px">content = ???</div>
        <div class="class-field" style="font-size:13px">category = ???</div>

        <div class="class-box" style="width:100%">
          <div class="class-name green-header">${cls1}</div>
          <div class="class-section">
            <div class="class-field" style="font-size:13px; color:var(--text2)">← data for one ${cls1.toLowerCase()}</div>
          </div>
        </div>
        <div class="class-box" style="width:100%">
          <div class="class-name purple-header">${cls2}</div>
          <div class="class-section">
            <div class="class-field" style="font-size:13px; color:var(--accent)">List&lt;${cls1}&gt;</div>
          </div>
          <div class="class-section">
            <div class="class-method" style="font-size:12px">add() &nbsp; remove() &nbsp; find()</div>
          </div>
        </div>
      </div>
      <p style="font-size:14px; color:var(--text2); margin-top:14px">
        <strong style="color:var(--teal)">${cls1}</strong> — a thing with its own data.<br>
        <strong style="color:var(--amber)">${cls2}</strong> — manages a collection of ${cls1}s.
      </p>
      <p style="font-size:13px; color:var(--text3); margin-top:8px">The same pattern works in every problem! 🎯</p>
    </div>`;
}

// Helper
function div() { return document.createElement('div'); }

// Start!
render();
</script>
</body>
</html>
