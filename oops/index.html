<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Java OOP — From one class to many</title>
<style>
/* ── Reset & base ── */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --mint:     #E8F6F0;
  --mint-mid: #4CAF8A;
  --mint-dark:#2E7D5E;
  --sage:     #C8EAD8;
  --coral:    #FEE8E7;
  --coral-mid:#F4756B;
  --coral-dark:#C0392B;
  --lav:      #EEEDfe;
  --lav-mid:  #7F77DD;
  --lav-dark: #3C3489;
  --amber:    #FFF8ED;
  --amber-mid:#D4A017;
  --amber-dark:#7D5A00;
  --slate:    #F4F6F8;
  --slate-mid:#8C9BAB;
  --ink:      #1C2B3A;
  --ink-soft: #3D5166;
  --ink-muted:#6B7D8E;
  --white:    #FFFFFF;
  --card-br:  10px;
  --sidebar-w:230px;
  --font: 'Segoe UI', system-ui, -apple-system, sans-serif;
  --mono: 'Cascadia Code', 'Fira Code', 'Consolas', monospace;
}

body {
  font-family: var(--font);
  background: var(--slate);
  color: var(--ink);
  min-height: 100vh;
  display: flex;
  font-size: 14px;
  line-height: 1.5;
}

/* ── Sidebar ── */
.sidebar {
  width: var(--sidebar-w);
  min-width: var(--sidebar-w);
  background: var(--ink);
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  position: sticky;
  top: 0;
  height: 100vh;
  overflow-y: auto;
}

.sidebar-brand {
  padding: 22px 18px 16px;
  border-bottom: 1px solid rgba(255,255,255,.08);
}

.sidebar-brand-icon {
  width: 36px; height: 36px;
  background: var(--mint-mid);
  border-radius: 8px;
  display: flex; align-items: center; justify-content: center;
  font-size: 18px; margin-bottom: 10px;
  color: white;
}

.sidebar-brand h1 {
  font-size: 13px; font-weight: 600;
  color: white; letter-spacing: -.01em;
  line-height: 1.3;
}
.sidebar-brand p {
  font-size: 11px; color: rgba(255,255,255,.45);
  margin-top: 2px;
}

.sidebar-section-label {
  font-size: 10px; font-weight: 600;
  color: rgba(255,255,255,.3);
  letter-spacing: .06em;
  padding: 16px 18px 6px;
  text-transform: uppercase;
}

.sidebar-item {
  display: flex; align-items: center; gap: 10px;
  padding: 9px 18px;
  cursor: pointer;
  border-radius: 0;
  transition: background .15s;
  color: rgba(255,255,255,.55);
  font-size: 12.5px;
  border-left: 3px solid transparent;
  position: relative;
}

.sidebar-item:hover {
  background: rgba(255,255,255,.05);
  color: rgba(255,255,255,.85);
}

.sidebar-item.active {
  background: rgba(76,175,138,.12);
  color: var(--mint-mid);
  border-left-color: var(--mint-mid);
}

.sidebar-item.done .si-num {
  background: var(--mint-mid);
  color: white;
}

.si-num {
  width: 20px; height: 20px;
  border-radius: 50%;
  background: rgba(255,255,255,.1);
  display: flex; align-items: center; justify-content: center;
  font-size: 10px; font-weight: 600;
  flex-shrink: 0;
  transition: background .2s, color .2s;
}

.si-label { flex: 1; }

.si-badge {
  font-size: 9px; padding: 2px 6px;
  border-radius: 10px;
  background: rgba(255,255,255,.08);
  color: rgba(255,255,255,.35);
}
.si-badge.imp { background: rgba(76,175,138,.2); color: var(--mint-mid); }

.sidebar-footer {
  margin-top: auto;
  padding: 14px 18px;
  border-top: 1px solid rgba(255,255,255,.08);
  font-size: 11px;
  color: rgba(255,255,255,.25);
}

/* ── Main ── */
.main {
  flex: 1;
  display: flex;
  flex-direction: column;
  min-width: 0;
}

/* ── Topbar ── */
.topbar {
  background: var(--white);
  border-bottom: 1px solid #E5E9ED;
  padding: 0 28px;
  height: 56px;
  display: flex; align-items: center;
  gap: 16px;
  position: sticky; top: 0; z-index: 10;
}

.topbar-breadcrumb {
  font-size: 12px; color: var(--ink-muted);
}
.topbar-breadcrumb span {
  color: var(--ink); font-weight: 500;
}

.topbar-right {
  margin-left: auto;
  display: flex; align-items: center; gap: 10px;
}

.progress-pill {
  background: var(--mint);
  border: 1px solid var(--sage);
  border-radius: 20px;
  padding: 5px 12px;
  font-size: 12px; color: var(--mint-dark); font-weight: 500;
}

.nav-btn {
  padding: 7px 14px;
  border-radius: 6px;
  border: 1px solid #D5DDE5;
  background: white;
  font-size: 12.5px; color: var(--ink-soft);
  cursor: pointer; font-family: var(--font);
  transition: all .15s;
}
.nav-btn:hover { background: var(--slate); border-color: #BCC5CF; }
.nav-btn.primary {
  background: var(--mint-mid); border-color: var(--mint-mid);
  color: white;
}
.nav-btn.primary:hover { background: var(--mint-dark); border-color: var(--mint-dark); }
.nav-btn.danger {
  background: var(--coral); border-color: #F4C4C1;
  color: var(--coral-dark);
}

/* ── Content area ── */
.content { padding: 24px 28px; flex: 1; }

/* ── Stage header card ── */
.stage-header-card {
  background: var(--white);
  border: 1px solid #E5E9ED;
  border-radius: var(--card-br);
  padding: 18px 22px;
  margin-bottom: 18px;
  display: flex; align-items: flex-start; gap: 16px;
}

.shc-icon {
  width: 44px; height: 44px;
  border-radius: 10px;
  display: flex; align-items: center; justify-content: center;
  font-size: 22px; flex-shrink: 0;
}

.shc-body { flex: 1; }
.shc-stage { font-size: 11px; color: var(--ink-muted); margin-bottom: 3px; }
.shc-title { font-size: 18px; font-weight: 600; color: var(--ink); letter-spacing: -.02em; }
.shc-sub { font-size: 13px; color: var(--ink-soft); margin-top: 3px; }

/* ── Two-col layout ── */
.two-col {
  display: grid;
  grid-template-columns: 340px 1fr;
  gap: 18px;
  align-items: start;
}

@media (max-width: 880px) {
  .two-col { grid-template-columns: 1fr; }
  .sidebar { display: none; }
}

/* ── Panel card ── */
.panel {
  background: var(--white);
  border: 1px solid #E5E9ED;
  border-radius: var(--card-br);
  overflow: hidden;
}

.panel-header {
  padding: 13px 18px;
  border-bottom: 1px solid #F0F3F6;
  display: flex; align-items: center; gap: 10px;
}

.panel-title {
  font-size: 13px; font-weight: 600; color: var(--ink);
}

.panel-badge {
  font-size: 10px; padding: 2px 8px;
  border-radius: 10px; font-weight: 500;
}

.panel-body { padding: 16px 18px; }

/* ── Importance banner ── */
.imp-banner {
  border-radius: 8px;
  padding: 11px 14px;
  margin-bottom: 14px;
  display: flex; gap: 11px; align-items: flex-start;
  border: 1px solid;
}
.imp-banner.mint { background: var(--mint); border-color: var(--sage); }
.imp-banner.lav  { background: var(--lav);  border-color: #CECBF6; }
.imp-banner.amber{ background: var(--amber);border-color: #FAC775; }
.imp-banner.coral{ background: var(--coral);border-color: #F4C4C1; }

.ib-icon { font-size: 16px; flex-shrink: 0; margin-top: 1px; }
.ib-content {}
.ib-label { font-size: 10px; font-weight: 600; color: var(--ink-muted); letter-spacing: .04em; margin-bottom: 2px; }
.ib-text  { font-size: 12.5px; color: var(--ink-soft); line-height: 1.55; }

/* ── Thinking bubble ── */
.think-bubble {
  border: 1.5px dashed #C8D6E0;
  border-radius: 10px;
  padding: 11px 14px;
  margin-bottom: 14px;
  background: #F8FAFB;
  display: flex; gap: 10px; align-items: flex-start;
}
.tb-dots {
  display: flex; flex-direction: column; gap: 3px;
  align-items: center; padding-top: 3px; flex-shrink: 0;
}
.tb-dot {
  border-radius: 50%; background: var(--lav-mid);
}
.tb-dot:nth-child(1){width:8px;height:8px}
.tb-dot:nth-child(2){width:5px;height:5px;opacity:.6}
.tb-dot:nth-child(3){width:3px;height:3px;opacity:.35}
.tb-label { font-size: 10px; font-weight: 600; color: var(--lav-dark); margin-bottom: 3px; }
.tb-q { font-size: 12.5px; color: var(--ink-soft); font-style: italic; line-height: 1.55; }
.tb-q strong { font-style: normal; color: var(--lav-dark); }

/* ── Form fields ── */
.field-group { margin-bottom: 12px; }
.field-label {
  display: block; font-size: 11px; font-weight: 600;
  color: var(--ink-muted); margin-bottom: 5px;
  letter-spacing: .02em;
}
.field-input {
  width: 100%; padding: 9px 12px;
  border: 1px solid #D5DDE5;
  border-radius: 6px;
  font-family: var(--font); font-size: 13px;
  color: var(--ink); background: white;
  transition: border-color .15s, box-shadow .15s;
  outline: none;
}
.field-input:focus {
  border-color: var(--mint-mid);
  box-shadow: 0 0 0 3px rgba(76,175,138,.12);
}
.field-select {
  width: 100%; padding: 9px 12px;
  border: 1px solid #D5DDE5;
  border-radius: 6px;
  font-family: var(--font); font-size: 13px;
  color: var(--ink); background: white;
  outline: none; cursor: pointer;
}

.field-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

/* ── Submit btn ── */
.submit-btn {
  width: 100%; padding: 10px;
  background: var(--mint-mid);
  border: none; border-radius: 7px;
  color: white; font-family: var(--font);
  font-size: 13px; font-weight: 600;
  cursor: pointer; transition: background .15s;
  margin-top: 4px;
}
.submit-btn:hover { background: var(--mint-dark); }
.submit-btn.danger { background: var(--coral-mid); }
.submit-btn.danger:hover { background: var(--coral-dark); }
.submit-btn.lav { background: var(--lav-mid); }
.submit-btn.lav:hover { background: var(--lav-dark); }

/* ── Code block ── */
.code-block {
  background: #1C2B3A;
  border-radius: 8px;
  padding: 14px 16px;
  font-family: var(--mono);
  font-size: 12px;
  line-height: 1.8;
  color: #C8D8E8;
  margin-bottom: 12px;
  overflow-x: auto;
  white-space: pre;
}
.ck  { color: #79C0FF; }   /* keyword */
.ct  { color: #B8BEFF; }   /* type */
.cs  { color: #7CE38B; }   /* string/bool */
.cm  { color: #5E7A9A; }   /* comment */
.co  { color: #FFA657; }   /* operator */

/* ── Transaction list ── */
.tx-list { display: flex; flex-direction: column; gap: 0; }

.tx-row {
  display: flex; align-items: center; gap: 12px;
  padding: 10px 18px;
  border-bottom: 1px solid #F0F3F6;
  transition: background .12s;
}
.tx-row:last-child { border-bottom: none; }
.tx-row:hover { background: #FAFBFC; }

.tx-dot {
  width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0;
}

.tx-name { flex: 1; font-size: 13px; color: var(--ink); }
.tx-sub  { font-size: 11px; color: var(--ink-muted); }

.tx-val {
  font-size: 13px; font-weight: 600;
  font-family: var(--mono);
}
.tx-val.pos { color: var(--mint-dark); }
.tx-val.neg { color: var(--coral-mid); }
.tx-val.neu { color: var(--lav-mid); }

.tx-tag {
  font-size: 10px; padding: 2px 7px;
  border-radius: 10px; font-weight: 500;
}

/* ── Counter cards ── */
.stat-row {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(90px,1fr));
  gap: 10px; margin-bottom: 14px;
}
.stat-card {
  background: var(--slate);
  border-radius: 8px; padding: 10px 12px;
  text-align: center; border: 1px solid #E5E9ED;
}
.stat-num {
  font-size: 24px; font-weight: 700; color: var(--mint-mid);
  font-family: var(--mono); transition: all .3s;
  line-height: 1.1;
}
.stat-num.warn { color: var(--coral-mid); }
.stat-num.lav  { color: var(--lav-mid); }
.stat-label { font-size: 10px; color: var(--ink-muted); margin-top: 3px; }

/* ── Parallel lists ── */
.para-wrap { display: flex; gap: 12px; flex-wrap: wrap; }
.para-col { flex: 1; min-width: 100px; }
.para-col-name {
  font-family: var(--mono); font-size: 10px;
  color: var(--mint-dark); margin-bottom: 5px; font-weight: 600;
}
.para-item {
  display: flex; align-items: center; gap: 6px;
  padding: 5px 9px; border-radius: 5px;
  border: 1px solid #E5E9ED;
  font-family: var(--mono); font-size: 11.5px;
  color: var(--ink); margin-bottom: 3px;
  background: white;
}
.para-item .idx { color: var(--ink-muted); font-size: 10px; min-width: 14px; }
.para-item.hl { border-color: var(--sage); background: var(--mint); }
.para-item.miss { border-color: #F4C4C1; background: var(--coral); color: var(--coral-dark); }

.link-label {
  display: flex; align-items: center; justify-content: center;
  flex: 0 0 48px;
  font-size: 10px; color: var(--mint-dark); text-align: center;
  line-height: 1.4;
}

/* ── Warning bar ── */
.warn-bar {
  background: var(--coral); border: 1px solid #F4C4C1;
  border-radius: 7px; padding: 9px 13px;
  font-size: 12.5px; color: var(--coral-dark);
  font-weight: 600; margin-bottom: 10px;
  display: flex; align-items: center; gap: 8px;
}

/* ── Choice buttons ── */
.choice-list { display: flex; flex-direction: column; gap: 6px; margin: 10px 0; }
.choice-btn {
  background: white; border: 1px solid #D5DDE5;
  border-radius: 7px; padding: 9px 13px;
  font-size: 13px; color: var(--ink);
  cursor: pointer; text-align: left;
  font-family: var(--font); transition: all .15s;
}
.choice-btn:hover { background: var(--slate); border-color: #BCC5CF; }
.choice-btn.correct { background: var(--mint); border-color: var(--sage); color: var(--mint-dark); }
.choice-btn.wrong   { background: var(--coral); border-color: #F4C4C1; color: var(--coral-dark); opacity: .7; }

/* ── Reveal box ── */
.reveal-box {
  background: var(--mint); border: 1px solid var(--sage);
  border-radius: 8px; padding: 11px 14px;
  font-size: 12.5px; color: var(--mint-dark);
  line-height: 1.6; margin-top: 10px;
  animation: fadeup .3s ease-out;
}

/* ── Class diagram box ── */
.class-box {
  display: inline-flex; flex-direction: column;
  border: 1.5px solid #D5DDE5;
  border-radius: 9px; overflow: hidden;
  min-width: 130px; font-family: var(--mono);
  font-size: 11px; vertical-align: top;
  background: white;
}
.class-box-head {
  background: var(--mint); color: var(--mint-dark);
  padding: 6px 11px; font-weight: 700; text-align: center; font-size: 12px;
  border-bottom: 1px solid var(--sage);
}
.class-box-head.purple { background: var(--lav); color: var(--lav-dark); border-color: #CECBF6; }
.class-box-head.gray   { background: #F0F3F6; color: var(--ink-soft); border-color: #D5DDE5; }
.class-box-body { padding: 7px 11px; }
.class-box-row  { padding: 2px 0; color: var(--ink-soft); font-size: 11px; }
.class-box-row .bt { color: var(--amber-dark); }
.class-box-row .st { color: var(--mint-dark); }
.class-box-row.mth { color: var(--lav-mid); }

/* ── Diagram area ── */
.dia-area {
  display: flex; flex-direction: column; align-items: center;
  gap: 8px; padding: 16px; background: var(--slate);
  border-radius: 8px; margin-bottom: 12px;
}
.dia-row { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; }
.dia-arrow { color: var(--ink-muted); font-size: 16px; text-align: center; }
.dia-lbl { font-size: 10px; color: var(--ink-muted); }

/* ── Before/after ── */
.ba-grid { display: grid; grid-template-columns: 1fr 32px 1fr; gap: 10px; align-items: start; margin-bottom: 12px; }
.ba-lbl  { font-size: 10px; font-weight: 600; color: var(--ink-muted); margin-bottom: 5px; }
.ba-arr  { display: flex; align-items: center; justify-content: center; padding-top: 24px; color: var(--mint-mid); font-size: 20px; font-weight: bold; }

/* ── Pill ── */
.pill {
  display: inline-block;
  background: var(--lav); color: var(--lav-dark);
  border: 1px solid #CECBF6; border-radius: 20px;
  padding: 4px 11px; font-size: 12px; font-weight: 500;
  cursor: pointer; margin: 3px; transition: all .2s;
}
.pill:hover { background: #CECBF6; }
.pill.done  { background: var(--mint); color: var(--mint-dark); border-color: var(--sage); cursor: default; }
.pill.no    { background: var(--coral); color: var(--coral-dark); border-color: #F4C4C1; cursor: default; }

/* ── Sort drop zones ── */
.drop-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin: 10px 0; }
.drop-zone {
  border: 1.5px dashed #D5DDE5; border-radius: 8px;
  padding: 10px; min-height: 60px; background: #FAFBFC;
}
.drop-zone.yes { border-color: var(--sage); background: var(--mint); }
.drop-zone.no  { border-color: #F4C4C1; background: var(--coral); }
.drop-label { font-size: 10px; font-weight: 600; color: var(--ink-muted); margin-bottom: 6px; }

/* ── Reflection ── */
.ref-q { margin-bottom: 12px; }
.ref-qt { font-size: 13px; color: var(--ink); margin-bottom: 5px; font-weight: 600; }
.ref-ans {
  background: var(--mint); border: 1px solid var(--sage);
  border-radius: 7px; padding: 9px 13px;
  font-size: 12.5px; color: var(--mint-dark); font-style: italic;
}

/* ── Final ── */
.final-card {
  background: var(--ink); border-radius: 12px;
  padding: 22px; text-align: center; margin-top: 12px;
  color: white;
}
.final-hed { font-size: 16px; font-weight: 700; color: white; margin-bottom: 6px; }
.final-sub { font-size: 12px; color: rgba(255,255,255,.5); margin-bottom: 14px; }
.final-flow { display: flex; flex-direction: column; align-items: center; gap: 2px; margin: 12px 0; }
.ff-item { font-size: 12.5px; color: rgba(255,255,255,.7); padding: 3px 16px; }
.ff-arrow { color: var(--mint-mid); font-size: 12px; }
.final-eq { font-size: 14px; font-weight: 700; color: var(--mint-mid); margin-top: 10px; }

.try-btns { display: flex; gap: 7px; flex-wrap: wrap; margin-top: 10px; }
.try-btn {
  padding: 7px 13px; border-radius: 7px;
  border: 1px solid #D5DDE5; background: white;
  font-size: 12px; color: var(--ink-soft);
  cursor: pointer; font-family: var(--font); transition: all .15s;
}
.try-btn:hover { background: var(--mint); border-color: var(--sage); color: var(--mint-dark); }

/* ── Note card ── */
.note-card {
  border: 1px solid #E5E9ED; border-radius: 7px;
  padding: 9px 13px; margin-bottom: 6px;
  background: white; animation: fadeup .3s ease-out;
}
.nc-title { font-size: 13px; font-weight: 600; color: var(--ink); }
.nc-sub   { font-size: 11px; color: var(--ink-muted); }

/* ── Anim ── */
@keyframes fadeup {
  from { opacity: 0; transform: translateY(-5px); }
  to   { opacity: 1; transform: translateY(0); }
}

.new { animation: fadeup .35s ease-out; }

/* ── Scrollbar ── */
::-webkit-scrollbar { width: 6px; height: 6px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: #C8D0D8; border-radius: 3px; }
</style>
</head>
<body>

<!-- ── Sidebar ── -->
<nav class="sidebar" id="sidebar">
  <div class="sidebar-brand">
    <div class="sidebar-brand-icon">&#128196;</div>
    <h1>Java OOP<br>Learning App</h1>
    <p>From one class to many</p>
  </div>

  <div class="sidebar-section-label">Learning stages</div>
  <div id="nav-items"></div>

  <div class="sidebar-footer">
    Discover classes — don't memorize them.
  </div>
</nav>

<!-- ── Main ── -->
<div class="main">
  <!-- Topbar -->
  <div class="topbar">
    <div class="topbar-breadcrumb">
      Java OOP &rsaquo; <span id="tb-title">One note</span>
    </div>
    <div class="topbar-right">
      <div class="progress-pill" id="tb-progress">Stage 1 of 10</div>
      <button class="nav-btn" id="btn-prev" onclick="navigate(-1)">&#8592; Prev</button>
      <button class="nav-btn primary" id="btn-next" onclick="navigate(1)">Next &#8594;</button>
      <button class="nav-btn danger" onclick="restartApp()">Restart</button>
    </div>
  </div>

  <!-- Content -->
  <div class="content" id="content"></div>
</div>

<script>
/* ────────────────────────────────── DATA ── */
const BOOL_ATTRS = ['pinned','archived','favorite'];

const S = {
  stage: 0,
  attrs: ['title','content'],

/* ────────────────────────────────── NAV ── */
function buildSidebar() {
  const nav = document.getElementById('nav-items');
  nav.innerHTML = '';
  STAGE_META.forEach((m, i) => {
    const div = document.createElement('div');
    div.className = 'sidebar-item' +
      (i === S.stage ? ' active' : '') +
      (i < S.stage ? ' done' : '');
    div.onclick = () => { if (i <= S.stage) { S.stage = i; resetTransient(); render(); } };
    div.innerHTML = `
      <div class="si-num">${i + 1}</div>
      <div class="si-label">${m.title}</div>
      ${m.color === 'coral' ? '<div class="si-badge imp">!</div>' : m.color === 'lav' ? '<div class="si-badge imp">★</div>' : ''}
    `;
    nav.appendChild(div);
  });
}

function navigate(dir) {
  const next = S.stage + dir;
  if (next < 0 || next >= 10) return;
  S.stage = next;
  resetTransient();
  render();
}

function restartApp() {
  S.stage = 0; S.attrs = ['title','content']; S.notes = [];
  S.attrGroup = 0; S.actsSorted = {}; S.refStep = 0;
  S.s5Props = []; S.bugShown = false;
  render();
}

function resetTransient() {
  S.bugShown = false;
}

/* ────────────────────────────────── HELPERS ── */
function q(id) { return document.getElementById(id); }

function impBanner(m) {
  return `<div class="imp-banner ${m.impStyle}">
    <div class="ib-icon">★</div>
    <div class="ib-content">
      <div class="ib-label">Why this stage matters</div>
      <div class="ib-text">${m.impText}</div>
    </div>
  </div>`;
}

function thinkBubble(m) {
  return `<div class="think-bubble">
    <div class="tb-dots">
      <div class="tb-dot"></div>
      <div class="tb-dot"></div>
      <div class="tb-dot"></div>
    </div>
    <div>
      <div class="tb-label">Think about this</div>
      <div class="tb-q">${m.think}</div>
    </div>
  </div>`;
}

function codeBlock(lines) {
  return `<div class="code-block">${lines}</div>`;
}

function kw(t) { return `<span class="ck">${t}</span>`; }
function ty(t) { return `<span class="ct">${t}</span>`; }
function st(t) { return `<span class="cs">${t}</span>`; }
function cm(t) { return `<span class="cm">${t}</span>`; }

function classBox(name, attrs, methods, variant) {
  const hc = variant === 'purple' ? ' purple' : variant === 'gray' ? ' gray' : '';
  let rows = attrs.map(a => {
    const ib = BOOL_ATTRS.includes(a);
    return `<div class="class-box-row"><span class="${ib ? 'bt' : 'st'}">${ib ? 'bool' : 'String'}</span> ${a}</div>`;
  }).join('');
  if (methods && methods.length) {
    rows += `<div style="border-top:1px solid #F0F3F6;margin:4px 0"></div>`;
    rows += methods.map(m => `<div class="class-box-row mth">+ ${m}</div>`).join('');
  }
  return `<div class="class-box">
    <div class="class-box-head${hc}">${name}</div>
    <div class="class-box-body">${rows}</div>
  </div>`;
}

/* ────────────────────────────────── RENDER ── */
function render() {
  buildSidebar();
  const m = STAGE_META[S.stage];
  q('tb-title').textContent = m.title;
  q('tb-progress').textContent = `Stage ${S.stage + 1} of 10`;
  q('btn-prev').disabled = S.stage === 0;

  const stageHtml = [s0,s1,s2,s3,s4,s5,s6,s7,s8,s9][S.stage]();
  q('content').innerHTML = `
    <div class="stage-header-card">
      <div class="shc-icon" style="background:${iconBg(m.color)}">${m.icon}</div>
      <div class="shc-body">
        <div class="shc-stage">Stage ${S.stage + 1} of 10</div>
        <div class="shc-title">${m.title}</div>
      </div>
    </div>
    ${stageHtml}
  `;
  // re-attach events after render
  attachEvents();
  window.scrollTo(0, 0);
}

function iconBg(c) {
  return c === 'mint' ? '#E8F6F0' : c === 'coral' ? '#FEE8E7' : c === 'lav' ? '#EEEDfe' : '#FFF8ED';
}

function renderS4Data(bug) {
  const items = [
    {n:'titles[2]',v:'Python'},{n:'contents[2]',v:'Lists'},
    {n:'categories[2]',v:'Programming'},{n:'createdDates[2]',v:'Sep 8'},
    {n:'modifiedDates[2]',v:'Sep 8'},{n:'pinned[2]',v:'false'},
    {n:'archived[2]',v:'false'},{n:'favorite[2]',v:'true'},
    {n:'colors[2]',v:'Blue'},{n:'reminders[2]',v:'Tomorrow'},
    {n:'attachments[2]',v:bug?null:'notes.pdf'},
  ];
  let h = '';
  if (bug) h += `<div class="warn-bar">⚠ Data misalignment — attachments[2] is missing!</div>`;
  items.forEach(it => {
    const miss = bug && it.v === null;
    h += `<div class="para-item${miss?' miss':''}" style="margin-bottom:3px;font-size:11.5px">
      <span class="idx" style="min-width:110px">${it.n}</span>
      <span>${miss ? '❌ missing — index out of sync' : '→ '+escHtml(it.v)}</span>
    </div>`;
  });
  const d = q('s4data'); if (d) d.innerHTML = h;
}

function renderS4Choices() {
  const opts = ['ArrayList is bad','Java is bad','Too many related pieces to maintain','Notes cannot have many attributes'];
  const c = q('s4choices');
  if (!c) return;
  c.innerHTML = opts.map((o,i) => `<button class="choice-btn" onclick="s4pick(${i})">${escHtml(o)}</button>`).join('');
}

function s4pick(i) {
  document.querySelectorAll('.choice-btn').forEach((b,bi) => {
    b.className = 'choice-btn' + (bi===2?' correct':bi===i?' wrong':'');
    b.onclick = null;
  });
  const r = q('s4reveal');
  if (r) r.innerHTML = `<div class="reveal-box">Exactly — <strong>too many related pieces to maintain</strong>. The bug is not in ArrayList or Java. It's in how we've organized the data — spread across 11 separate lists that all need to stay in sync.</div>`;
}

function s5pick(name) {
  if (S.s5Props.includes(name)) return;
  S.s5Props.push(name);
  const p = q('pp'+name); if (p) p.className = 'pill done';
  const prog = q('s5progress');
  if (prog) prog.textContent = `${S.s5Props.length} / ${ALL_ATTRS.length} properties placed`;
  const bx = q('s5box');
  if (bx) bx.innerHTML = classBox('Note', S.s5Props, []);
  if (S.s5Props.length === ALL_ATTRS.length) {
    const rv = q('s5reveal');
    if (rv) rv.innerHTML = `<div class="reveal-box" style="margin-top:12px">All 11 properties describe <strong>one Note</strong>. They belong together — not scattered across 11 parallel lists. This is what a class <em>is</em>: a bundle of data that belongs to the same thing.</div>`;
  }
}

  return `<div class="two-col">
    <div>
      <div class="panel">
        <div class="panel-header">
          <div class="panel-title">The transformation</div>
          <div class="panel-badge" style="background:#E8F6F0;color:#2E7D5E">Payoff</div>
        </div>
        <div class="panel-body">
          ${impBanner(m)}
          ${thinkBubble(m)}
          <div class="ba-grid">
            <div>
              <div class="ba-lbl">Before — 11 ArrayLists</div>
              ${codeBlock(ALL_ATTRS.slice(0,5).map(a=>`${ty('ArrayList')}&lt;${st('String')}&gt; ${a}s;`).join('\n')+'\n'+cm('// ...6 more'))}
            </div>
            <div class="ba-arr">→</div>
            <div>
              <div class="ba-lbl">After — 1</div>
              ${codeBlock(`${ty('ArrayList')}&lt;${ty('Note')}&gt; notes;`)}
            </div>
          </div>
        </div>
      </div>
    </div>
    <div>
      <div class="panel">
        <div class="panel-header">
          <div class="panel-title">How the data looks now</div>
          <div class="panel-badge" style="background:#E8F6F0;color:#2E7D5E">Clean</div>
        </div>
        <div class="panel-body">
          <div class="tx-list">
            ${[{t:'Java',cat:'Programming',pin:'true'},{t:'SQL',cat:'Database',pin:'false'},{t:'Python',cat:'Programming',pin:'true'}]
              .map((n,i)=>`<div class="tx-row">
                <div class="tx-dot" style="background:var(--mint-mid)"></div>
                <div><div class="tx-name">notes[${i}]</div><div class="tx-sub">title: "${n.t}", category: "${n.cat}", pinned: ${n.pin}, ...</div></div>
                <div class="tx-val pos">Note</div>
              </div>`).join('')}
          </div>
          ${codeBlock(`notes[0]${'\n'}  title: "Java"${'\n'}  content: "OOP"${'\n'}  category: "Programming"${'\n'}  pinned: true${'\n'}  ${cm('// all 11 fields travel together')}`)}
          <div style="padding:10px 13px;background:#E8F6F0;border:1px solid var(--sage);border-radius:7px;font-size:12.5px;color:var(--mint-dark)">
            Each item in the list is a <strong>whole Note object</strong>. All 11 fields travel together. Nothing can go out of sync.
          </div>
        </div>
      </div>
    </div>
  </div>`;
}

/* S7 — NotesManager */
function s7() {
  const m = STAGE_META[6];
  S.actsSorted = {};
  return `<div class="two-col">
    <div>
      <div class="panel">
        <div class="panel-header">
          <div class="panel-title">Who manages the notes?</div>
          <div class="panel-badge" style="background:#EEEDfe;color:#3C3489">Discovery</div>
        </div>
        <div class="panel-body">
          ${impBanner(m)}
          ${thinkBubble(m)}
          <p style="font-size:12.5px;color:var(--ink-soft);margin-bottom:10px">We have 100 Note objects. These operations need a home. Tap each one — does it belong <em>inside</em> a Note?</p>
          <div id="s7pills" style="display:flex;flex-wrap:wrap;gap:4px;margin-bottom:12px">
            ${ACTIONS.map(a=>`<div class="pill" id="act${a}" onclick="s7sort('${a}')">${a}</div>`).join('')}
          </div>
          <div id="s7reveal"></div>
        </div>
      </div>
    </div>
    <div>
      <div class="panel">
        <div class="panel-header">
          <div class="panel-title">Sort by responsibility</div>
        </div>
        <div class="panel-body">
          <div class="drop-grid">
            <div>
              <div class="drop-label">Inside Note?</div>
              <div class="drop-zone no" id="s7no">
                <div style="font-size:11px;color:var(--coral-dark)">Drop here if yes</div>
              </div>
            </div>
            <div>
              <div class="drop-label">Belongs in a manager?</div>
              <div class="drop-zone yes" id="s7yes">
                <div style="font-size:11px;color:var(--mint-dark)">Drop here if yes</div>
              </div>
            </div>
          </div>
          <div id="s7code"></div>
        </div>
      </div>
    </div>
  </div>`;
}

function s7sort(a) {
  if (S.actsSorted[a]) return;
  S.actsSorted[a] = 'mgr';
  const p = q('act'+a); if (p) p.className = 'pill done';
  const drop = q('s7yes');
  const pill = document.createElement('div');
  pill.className = 'pill done'; pill.style.margin='2px'; pill.textContent = a;
  drop.appendChild(pill);
  if (Object.keys(S.actsSorted).length === ACTIONS.length) {
    const rv = q('s7reveal');
    if (rv) rv.innerHTML = `<div class="reveal-box">None belong inside a Note. A Note <em>has</em> data — it doesn't manage other notes. We need a separate class for this responsibility.</div>`;
    const cd = q('s7code');
    if (cd) cd.innerHTML = codeBlock(`${kw('class')} ${ty('NotesManager')} {\n  ${ty('ArrayList')}&lt;${ty('Note')}&gt; notes;\n\n  ${kw('void')} addNote(${ty('Note')} note) { }\n  ${kw('void')} deleteNote(${ty('Note')} note) { }\n  ${kw('void')} searchNote(${ty('String')} kw) { }\n  ${kw('void')} editNote(${ty('Note')} note) { }\n  ${kw('void')} displayNotes() { }\n}`);
  }
}

/* S8 — Final diagram */
function s8() {
  const m = STAGE_META[7];
  return `<div class="two-col">
    <div>
      <div class="panel">
        <div class="panel-header">
          <div class="panel-title">Three classes, three jobs</div>
          <div class="panel-badge" style="background:#EEEDfe;color:#3C3489">Architecture</div>
        </div>
        <div class="panel-body">
          ${impBanner(m)}
          ${thinkBubble(m)}
          <div class="dia-area">
            <div class="dia-row">${classBox('NotesApp', [], ['main()'], 'gray')}</div>
            <div class="dia-arrow">↓ <span class="dia-lbl">uses</span></div>
            <div class="dia-row">${classBox('NotesManager', ['notes: ArrayList&lt;Note&gt;'], ['addNote()','deleteNote()','searchNote()','editNote()','displayNotes()'], 'purple')}</div>
            <div class="dia-arrow">↓ <span class="dia-lbl">manages</span></div>
            <div class="dia-row">
              ${classBox('Note', ALL_ATTRS, [], '')}
              ${classBox('Note', ALL_ATTRS, [], '')}
              ${classBox('Note', ALL_ATTRS, [], '')}
            </div>
          </div>
        </div>
      </div>
    </div>
    <div>
      <div class="panel">
        <div class="panel-header">
          <div class="panel-title">Code transformation</div>
          <div class="panel-badge" style="background:#E8F6F0;color:#2E7D5E">Before → After</div>
        </div>
        <div class="panel-body">
          <div class="ba-lbl" style="margin-bottom:5px">Before — one bloated class</div>
          ${codeBlock(`${kw('class')} ${ty('NotesApp')} {\n  ${ty('ArrayList')}&lt;${st('String')}&gt; titles;\n  ${ty('ArrayList')}&lt;${st('String')}&gt; contents;\n  ${cm('// ...9 more lists')}\n\n  ${kw('void')} addNote(${cm('/* 11 params */') }) {}\n  ${kw('void')} deleteNote(${cm('/* 11 params */') }) {}\n}`)}
          <div class="ba-arr" style="padding:4px 0;text-align:center">↓</div>
          <div class="ba-lbl" style="margin-bottom:5px">After — three focused classes</div>
          ${codeBlock(`${kw('class')} ${ty('Note')} {\n  ${st('String')} title;\n  ${st('boolean')} pinned; ${cm('// + 9 more')}\n}\n\n${kw('class')} ${ty('NotesManager')} {\n  ${ty('ArrayList')}&lt;${ty('Note')}&gt; notes;\n  ${kw('void')} addNote(${ty('Note')} n) {}\n}`)}
        </div>
      </div>
    </div>
  </div>`;
}

/* S9 — Reflect */
function s9() {
  const m = STAGE_META[8];
  const qs = [
    { q:'Why did we create the Note class?',
      a:'Because title, content, category, pinned, and the rest all describe one Note. Data that belongs together should live together.' },
    { q:'Why did we create NotesManager?',
      a:'Because managing many notes is a separate responsibility. A Note should not manage other notes.' },
    { q:'Could everything stay in one class technically?',
      a:'Yes. Java will not stop you. But it becomes harder to read, test, and change as it grows.' },
    { q:'Then why separate it?',
      a:'Different things and different responsibilities should be separate. That is the core insight of object-oriented design.' },
  ];
  let qHtml = '';
  for (let i = 0; i <= S.refStep && i < qs.length; i++) {
    const q2 = qs[i];
    qHtml += `<div class="ref-q">
      <div class="ref-qt">${i+1}. ${q2.q}</div>
      ${i < S.refStep
        ? `<div class="ref-ans">${q2.a}</div>`
        : `<button class="nav-btn" onclick="s9ans(${i})" style="font-size:12px">Reveal answer</button><div id="rv${i}"></div>`
      }
    </div>`;
  }
  let finalHtml = '';
  if (S.refStep >= qs.length) {
    finalHtml = `<div class="final-card">
      <div class="final-hed">Don't create classes because someone tells you to.</div>
      <div class="final-sub">Instead, ask these questions for every new system:</div>
      <div class="final-flow">
        <div class="ff-item">What is the <strong style="color:var(--mint-mid)">thing</strong>?</div>
        <div class="ff-arrow">↓</div>
        <div class="ff-item">What <strong style="color:var(--mint-mid)">data</strong> belongs to that thing?</div>
        <div class="ff-arrow">↓</div>
        <div class="ff-item">What does that thing <strong style="color:var(--mint-mid)">do</strong>?</div>
        <div class="ff-arrow">↓</div>
        <div class="ff-item">Who <strong style="color:var(--mint-mid)">manages many</strong> of those things?</div>
        <div class="ff-arrow">↓</div>
        <div class="ff-item">What are the different <strong style="color:var(--mint-mid)">responsibilities</strong>?</div>
      </div>
      <div class="final-eq">Different things + Different responsibilities = Different classes</div>
    </div>
    <div style="margin-top:14px">
      <p style="font-size:12px;color:var(--ink-muted);margin-bottom:8px">Try discovering classes for a new problem:</p>
      <div class="try-btns">
        ${['Student management','Movie watchlist','Library system','Shopping cart','Employee records'].map(p =>
          `<button class="try-btn" onclick="alert('Great! Ask: What is the central thing? What data does it hold? What manages many of them?\\n\\nFor "${p}": try to name the classes before looking them up.')">${p} →</button>`
        ).join('')}
      </div>
    </div>`;
  }
  return `<div class="two-col">
    <div>
      <div class="panel">
        <div class="panel-header">
          <div class="panel-title">Check your understanding</div>
          <div class="panel-badge" style="background:#E8F6F0;color:#2E7D5E">Reflection</div>
        </div>
        <div class="panel-body">
          ${impBanner(m)}
          ${thinkBubble(m)}
          ${qHtml}
        </div>
      </div>
    </div>
    <div>
      ${finalHtml || `<div class="panel">
        <div class="panel-header"><div class="panel-title">Coming up…</div></div>
        <div class="panel-body" style="text-align:center;padding:32px 0;color:var(--ink-muted);font-size:13px">
          Answer each question to unlock the final principle.
        </div>
      </div>`}
    </div>
  </div>`;
}

function s9ans(i) {
  const answers = [
    'Because title, content, category, pinned, and the rest all describe one Note. Data that belongs together should live together.',
    'Because managing many notes is a separate responsibility. A Note should not manage other notes.',
    'Yes. Java will not stop you. But it becomes harder to read, test, and change as it grows.',
    'Different things and different responsibilities should be separate. That is the core insight of object-oriented design.',
  ];
  const rv = q('rv'+i);
  if (rv) rv.innerHTML = `<div class="ref-ans new">${answers[i]}</div>`;
  S.refStep = i + 1;
  setTimeout(() => { render(); }, 500);
}

/* ────────────────────────────────── ATTACH EVENTS (post-render) ── */
function attachEvents() {
  const stage = S.stage;
  if (stage === 1) renderS1Lists();
  if (stage === 2) renderS2();
  if (stage === 3) {} // no dynamic init
  if (stage === 3 && q('s4data')) {
    // handled by s4 render
  }
  if (stage === 3) {
    // s3 = maintenance problem view, no events
  }
  if (stage === 4) {
    renderS4Data(false);
    setTimeout(() => { renderS4Data(true); renderS4Choices(); }, 800);
  }
}

/* ────────────────────────────────── UTIL ── */
function escHtml(str) {
  return String(str||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

/* ────────────────────────────────── INIT ── */
render();
</script>
</body>
</html>
